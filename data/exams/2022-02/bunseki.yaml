  stem: ガスクロマトグラフ分析法に用いられる検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 熱伝導度検出器（TCD）では、成分気体とキャリヤーガスとの熱伝導率の差を利用する。
  - 水素炎イオン化検出器（FID）では、水素炎中で試料がイオン化される。
  - 電子捕獲検出器（ECD）では、β線照射で生じた二次電子が測定対象化合物に捕獲されることを利用する。
  - 光イオン化検出器（PID）では、グロー放電で放射される紫外線で試料がイオン化される。
  - 炎光光度検出器（FPD）では、酸素過剰の酸化炎中で発光する試料特有の波長の光を利用する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '炎光光度検出器（FPD）は、水素の量を FID より多くした**還元炎**（水素に富む炎）を使います。「酸素過剰の酸化炎」とする選択肢5は誤りです。


