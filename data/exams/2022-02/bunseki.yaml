  stem: 作業環境測定に使用する各器具及びその使用に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 熱電対温度計は使用温度範囲が広いという利点を持つが、応答速度が遅いという欠点を有する。
  - アスマン通風乾湿計による温湿度の測定は、ファンを回転させてから5分程度後に行う。
  - 石けん膜流量計では、一定体積の気体が流量計の計量部を流れるのに要する時間を測定し、流量を計算する。
  - ガラス製体積計の校正は、体積計に受け入れられる水又は排出される水の質量と温度を正確に測定することで実施する。
  - マイクロシリンジの計量目盛りは、針の部分の体積を含まない。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '熱電対温度計は、使用温度範囲が広く、応答速度も**速い**ことが特徴です。「応答速度が遅い」とする選択肢1は誤りです。


    アスマン通風乾湿計は、ファンを回転させて5分程度後に測定します（選択肢2）。石けん膜流量計は、一定体積の気体が流れる時間から流量を計算します（選択肢3）。ガラス製体積計の校正は、受け入れた水や排出した水の質量と温度から行い（選択肢4）、マイクロシリンジの目盛りは、針の部分の体積を含みません（選択肢5）。'
  figures: []
