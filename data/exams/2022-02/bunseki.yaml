  - '3.0'
  - '5.0'
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'pH 1.0 の硝酸溶液の水素イオン濃度は 0.10 mol/L で、5倍に希釈すると 0.020 mol/L になります。


    pH ＝ −log(0.020) ＝ −log(2 × 10⁻²) ＝ 2 − 0.301 ＝ 1.699 ≒ 1.7


    よって（2）が正しい値です。'
  figures: []
