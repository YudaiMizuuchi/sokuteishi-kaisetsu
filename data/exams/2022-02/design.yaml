  stem: 25℃、1気圧における環境空気中のメチルエチルケトン（CH₃COC₂H₅）の体積分率が200 ppmであるとき、その質量濃度（mg・m⁻³）に最も近いものは、次のうちどれか。
  choices:
  - 70 mg・m⁻³
  - 140 mg・m⁻³
  - 290 mg・m⁻³
  - 590 mg・m⁻³
  - 730 mg・m⁻³
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'ppm を mg/m³ に直すときは、ppm に分子量を掛けて 24.45 で割ります。メチルエチルケトン（CH₃COC₂H₅）の分子量は 72.1 です。


    C [mg/m³] ＝ 200 × 72.1 ÷ 24.45 ≒ 590


    よって（4）が正しい値です。'
