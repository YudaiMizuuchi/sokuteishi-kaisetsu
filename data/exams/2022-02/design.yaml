  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  - 測定時間が10分間未満の検知管を使用する場合には、各測定点において複数の検知管を使用して10分間以上連続して測定を行わなければならない。
  - 測定点の高さは、床上50 cm以上150 cm以下の位置とする。
  - 測定点と測定点との間隔は、原則として、6 m以下の等間隔とするが、縦方向と横方向の間隔は、必ずしも同一でなくてもよい。
  - 測定を行うことによって、管理区分を決めるための評価値を求めることができる。
  columns: null
  answer: 2
