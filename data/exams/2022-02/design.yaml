  choices:
  - 一般に、ろ過捕集法による粒子の捕集率は、粒径0.1～0.3 µm程度の粒子で低くなる。
  - 多段平行板式分粒装置を用いる場合、吸引流量が所定の値より大きいと、分粒装置を通過する粒子の50%分粒粒径は大きくなる。
  - ミゼットインピンジャーによる粒子の捕集では、粒径が小さいほど捕集率は小さくなる。
  - 慣性衝突式分粒装置を用いる場合、吸引流量が所定の値よりも小さいと、測定値は小さくなる。
  - 捕集装置とポンプとの間に接続された面積式流量計は、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より大きくなる。
