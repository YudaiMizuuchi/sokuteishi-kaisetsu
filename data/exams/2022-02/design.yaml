  stem: 騒音の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の範囲は、作業者が常時作業するために立ち入る場所で、おおむね80 dB(A)以上の騒音レベルの範囲とする。
  - A測定点の位置は、単位作業場所の床面上に任意の基点を定め、原則として、この基点を軸として6 m以下の等間隔で引いた縦の線と横の線との交点の全てを測定点とする。
  - 測定点の高さは床上1.2 m以上1.5 m以下とするが、作業者が上下方向に作業の位置を移動する場合は、当該作業が行われる作業床から1.2 m以上1.5 m以下とする。
  - A測定点が5に満たない場合は、縦の線若しくは横の線の間隔の変更又は基点の移動を行うことにより、測定点を5以上になるようにする。
  - A測定及びB測定を実施した場合の管理区分の決定は、A測定の算術平均値及び標準偏差並びにB測定値を用いる。
