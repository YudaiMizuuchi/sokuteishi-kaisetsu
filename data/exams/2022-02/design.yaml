  stem: 固体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 固体捕集管に破過が生じた場合、捕集した試料から求めた測定値は、真の値より小さくなる。
  - 一般に、シリカゲルは極性の小さい有機溶剤、活性炭は極性の大きい有機溶剤の捕集に適している。
  - ポーラスポリマー管に捕集された試料は、活性炭管と比べて、加熱脱着が容易である。
  - アセトンの捕集には、シリカゲル管が用いられる。
  - 塩素化ビフェニルの捕集には、フロリジル管が用いられる。
