  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の濃度が高くなると考えられる作業位置が複数ある場合は、それらの全ての作業位置で測定を行い、各々の測定値の算術平均値をB測定値とする。
  - 検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値をB測定値とする。
  - 相対濃度指示方法によってB測定を行った場合、質量濃度変換係数はA測定で用いる係数と同じものを用いる。
  - 圧電天秤方式の相対濃度計を用いて鉱物性粉じんのB測定を行う場合は、測定時間を2分に合わせて、連続して5回の測定を行い、指示値の算術平均値をB測定値とする。
  - B測定に真空捕集びんを用いる場合には、真空捕集びんの本数は5本程度を目安にする。
