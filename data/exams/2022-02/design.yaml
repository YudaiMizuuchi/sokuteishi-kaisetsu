  stem: 正規分布、対数正規分布及び環境空気中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 対数正規分布の幾何標準偏差の値は、1以上である。
  - 環境空気中の有害物質の濃度の分布は、対数正規分布で近似される。
  - 正規分布の算術平均値と標準偏差をそれぞれμ、σとすると、この分布に従う変数がμ-σからμ+σの範囲に入る確率は、およそ68%である。
  - 正規分布では、平均値と標準偏差は、互いに独立している。
  - 対数正規分布の幾何平均値と幾何標準偏差とは同じ次元を持つ。
