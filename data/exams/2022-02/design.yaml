  stem: 液体捕集法及び直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 使用後の捕集袋を再使用するためには、水又は洗剤で内面を十分に洗浄しなければならない。
  - 真空捕集びんのコックには、漏れを防止するためのグリースの使用は避ける。
  - ミゼットインピンジャーによる粒子状物質の捕集は、慣性衝突効果によるものである。
  - ミゼットインピンジャーによるガス状物質の捕集では、吸引流量が大きいほど捕集率は低くなる。
  - 気体を液体捕集によって試料採取する場合、有機溶剤等の揮発性物質の捕集率は、捕集液の温度が低いほど高い。
  columns: null
  answer: 1
