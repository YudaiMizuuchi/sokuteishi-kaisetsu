  stem: A・B測定の単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の範囲は、有害業務を行う作業場を、作業環境管理の対象となる区域に層別化したものである。
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間なども考慮する必要がある。
  - 有害物質の濃度が、他の場所より常に高かったり、常に低かったりすることが予測される場所は、それぞれ別の単位作業場所とする。
  - 塗料の調合作業とそこで調合された塗料を用いる塗装作業が同時に行われる区域を、1つの単位作業場所として設定することができる。
  - 単位作業場所の設定に当たっては、作業場内の気流、換気設備の稼働状況なども考慮すべきである。
