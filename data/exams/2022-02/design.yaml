  stem: 有害物質のA測定及びB測定が行われた場合の作業環境評価等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第1評価値が管理濃度より小さい単位作業場所内の気中有害物質濃度が管理濃度を超える確率は、5%未満である。
  - A測定の第1評価値が管理濃度を超えておらず、B測定の測定値が管理濃度の1.5倍であった場合の管理区分は、第2管理区分になる。
  - A測定の第1評価値とB測定の測定値が共に管理濃度より小さくても、管理区分は第1管理区分になるとは限らない。
  - 幾何標準偏差（σ）の値は、2日間測定では、1以上の値であるが、1日測定の場合には、1.95以上の値になる。
  - A測定の第2評価値が管理濃度を超えていれば、B測定値の結果にかかわらず、管理区分は第3管理区分になる。
