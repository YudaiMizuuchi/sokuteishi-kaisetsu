  - 常時特定粉じん作業が行われる屋内作業場については、6か月以内ごとに1回、定期に、当該作業場における空気中の粉じんの濃度を測定し、その都度、所定の事項を記録して、これを7年間保存しなければならない。
  - 粉じん作業に労働者を従事させるときは、坑内等の特殊な作業場でやむを得ない事由がある場合を除き、粉じん作業を行う作業場以外の場所に休憩設備を設けなければならない。
  - 法令に基づき特定粉じん発生源に設ける局所排気装置のフードは、粉じんの発生源ごとに設けなければならない。
