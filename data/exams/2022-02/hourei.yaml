  traps:
  - lw-law-measurement-scope-03
  rank: null
  stem: 作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 気温が28℃をこえ、又はこえるおそれのある坑内の作業場については、半月以内ごとに1回、定期に当該作業場における気温を測定しなければならない。
  - 動力によりチェーン等を用いてドラムかんを洗浄する業務を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 海水が滞留している暗きょの内部における作業に係る作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。
  - 熱源を用いる乾燥室により物を乾燥する業務を行う屋内作業場については、半月以内ごとに1回、定期に当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'ふく射熱を測定するのは、暑熱の屋内作業場のうち、労働安全衛生規則第587条の**第1号から第8号**までの作業場に限られます（溶鉱炉から溶融ガラスの成型まで）。熱源を用いる乾燥室は**第10号**なので、気温と湿度だけを測定します。「気温、湿度及びふく射熱」とする選択肢4は誤りです。


    坑内の作業場では、気温が 28℃を超えるとき、通気設備があるときは半月以内ごと（選択肢1・5）、炭酸ガスが停滞するときは1か月以内ごとに測定します。ドラムかんの洗浄などの著しい騒音を発する屋内作業場は、6か月以内ごとに等価騒音レベルを測定し（選択肢2）、海水が滞留している暗きょの内部は、その日の作業開始前に酸素と硫化水素の濃度を測定します（選択肢3）。


    根拠：労働安全衛生規則第587条（第10号が乾燥室）、第607条（ふく射熱の測定の範囲）、第592条・第603条・第612条・第590条・第591条。'
  figures: []
  law_note: null
  _key_choice: 熱源を用いる乾燥室により物を乾燥する業務を行う屋内作業場については、半月以内ごとに1回、定期に当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
