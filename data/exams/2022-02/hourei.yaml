  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについての一酸化炭素の含有率の測定の測定点は、建築物の室の中央部の床上75 cm以上120 cm以下の位置に、1以上としなければならない。
  - 鉱物性粉じんに係る単位作業場所が著しく狭ければ、単位作業場所における測定点の数を5未満とすることができる。
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 鉱物性粉じんの濃度の測定を相対濃度指示方法によって行う場合には、原則として、当該単位作業場所における1箇所以上の測定点において、同時に分粒装置を用いるろ過捕集方法及び重量分析方法による測定を行わなければならない。
  - 溶融金属の運搬又は鋳込みの業務を行う暑熱の屋内作業場における気温及び湿度の測定の測定点は、当該単位作業場所の中央部の床上50 cm以上150 cm以下の位置に、1以上としなければならない。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '鉱物性粉じんの単位作業場所で、測定点を5未満にできるのは、単位作業場所が著しく狭く、**かつ**、粉じんの濃度がほぼ均一であることが明らかなときです。「著しく狭ければ」だけでは足りないので、選択肢2は誤りです。


    遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法で行い（選択肢3）、相対濃度指示方法による測定は、1以上の測定点で、分粒装置を用いるろ過捕集方法を同時に行います（選択肢4）。暑熱の屋内作業場の気温・湿度の測定点は、中央部の床上 50 cm 以上 150 cm 以下に1以上です（選択肢5）。


    根拠：作業環境測定基準第2条第1項、第2条の3（遊離けい酸の含有率の測定。令和8年10月1日適用の改正後の条番号）、第3条、第6条。'
  figures: []
  law_note: null
