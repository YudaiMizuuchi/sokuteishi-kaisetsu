  stem: 法令により、定期に作業環境測定を行うべき作業場に関する測定対象Ⓐ、測定頻度Ⓑ及び記録の保存期間Ⓒの組合せとして、誤っているものはどれか。
  choices:
  - 空気中のトリクロロエチレンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中のオルト-トルイジンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中のカドミウムの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中の二硫化炭素の濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中の放射性物質の濃度 ／ 1か月以内ごとに1回 ／ 5年
  columns:
  - Ⓐ
  - Ⓑ
  - Ⓒ
  answer: 3
  choice_notes: []
  explanation: 'カドミウム及びその化合物は、管理第2類物質で、特別管理物質ではありません。作業環境測定の記録の保存期間は**3年間**で、30年とする選択肢3は誤りです。


    トリクロロエチレンとオルト-トルイジンは特別管理物質なので、記録は30年保存です（選択肢1・2）。二硫化炭素（第1種有機溶剤）は3年（選択肢4）、放射性物質は1か月以内ごと・5年です（選択肢5）。


    根拠：特定化学物質障害予防規則第36条第2項・第3項、有機溶剤中毒予防規則第28条。'
  figures: []
  law_note: null
  _key_choice: A空気中のカドミウムの濃度 B6か月以内ごとに1回 C30年
- num: 5
  status: published
  chapters:
