  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務に労働者を就かせるときは、原則として、法令で定める特別の教育を行わなければならない。
  - 労働者の作業内容を変更したときは、その労働者に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 特定化学物質を取り扱う業務に労働者を就かせるときは、原則として、法令で定める特別の教育を行わなければならない。
  - 職長等の教育の事項の全部又は一部について十分な知識及び技能を有していると認められる者については、当該事項に関する教育を省略することができる。
  - 法令で定める特別の教育を行ったときは、記録を作成して、これを3年間保存しておかなければならない。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '特定化学物質を取り扱う業務は、特別教育の対象ではありません。選択肢3は誤りです。特定化学物質の作業は、特定化学物質作業主任者を選任して管理します。


    廃棄物の焼却施設で焼却灰を取り扱う業務は、特別教育の対象です（選択肢1）。作業内容を変更したときにも、安全又は衛生のための教育が必要で（選択肢2）、十分な知識・技能のある事項は、職長等の教育を省略できます（選択肢4）。特別教育の記録は3年間保存します（選択肢5）。


    根拠：労働安全衛生規則第35条・第38条、労働安全衛生法施行令第19条。'
  figures: []
  law_note: null
  _key_choice: 特定化学物質を取り扱う業務に労働者を就かせるときは、原則として、法令で定める特別の教育を行わなければならない。
