  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時100人以上の労働者を使用する事業場においては、その業種に関係なく総括安全衛生管理者を選任しなければならない。
  - 常時500人を超える労働者を使用する事業場で、エックス線その他有害放射線にさらされる業務に常時30人以上の労働者を従事させるものにあっては、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 常時50人以上の労働者を使用する事業場においては、その業種に関係なく産業医を選任しなければならない。
  - 常時500人を超える労働者を使用する事業場で、鉛、水銀、一酸化炭素、その他これに準ずる有害物の粉じん、蒸気又はガスを発散する場所における業務に常時30人以上の労働者を従事させるものにあっては、衛生管理者のうち1人を衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。
  - 常時使用する労働者の数が10人以上50人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '総括安全衛生管理者の選任が必要な規模は、業種によって違います（林業・建設業などは100人以上、製造業などは300人以上、その他の業種は1,000人以上）。「業種に関係なく100人以上」とする選択肢1は誤りです。


    常時50人以上の労働者を使用する事業場では、業種にかかわらず産業医を選任し（選択肢3）、常時10人以上50人未満の事業場では、安全衛生推進者又は衛生推進者を選任します（選択肢5）。選択肢2・4は、500人を超える事業場の衛生管理者についての規定で、正しい記述です。'
  figures: []
  law_note: null
  _key_choice: 常時100人以上の労働者を使用する事業場においては、その業種に関係なく総括安全衛生管理者を選任しなければならない。
