  rank: null
  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定士ではない者に、作業環境評価基準に基づいて、指定作業場についての作業環境測定結果の評価を行わせることができる。
  - 放射性物質取扱作業室における空気中の放射性物質の濃度の測定は、作業環境測定士ではない者に行わせることはできない。
  - 作業環境測定の業務に関する不正の行為により、作業環境測定士の登録を取り消された者は、その日から起算して1年間は、作業環境測定士となることができない。
  - 指定作業場以外の作業場における作業環境測定については、作業環境測定士以外の者に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリング（個人サンプリング法を除く。）の業務を行うことができる。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '作業環境測定士の登録を取り消された者は、取消しの日から起算して**2年**を経過しないと、作業環境測定士になれません。「1年間」とする選択肢3は誤りです。


    評価基準による管理区分の決定は、測定士でなくてもでき（選択肢1）、指定作業場以外の作業場の測定も、測定士以外の者に行わせることができます（選択肢4）。放射性物質取扱作業室の空気中の放射性物質の濃度の測定は、指定作業場の測定なので、測定士でなければ行えません（選択肢2）。第1種作業環境測定士は、登録を受けた作業場の種類以外でも、デザインとサンプリングを行えます（選択肢5）。


    根拠：作業環境測定法第6条。'
  figures: []
  law_note: 令和8年10月1日に、個人ばく露測定の制度（作業環境測定法第2条第3号、労働安全衛生法第65条の3）が始まりました。作業環境測定士の登録事項に、個人ばく露測定に係るデザイン及びサンプリング（作業環境測定法施行規則第6条第1項第5号・第6号）が加わり、サンプリング補助者の制度も新設されました。この問題で問われている測定士の資格・登録・業務の範囲の規定は、現行法でも同じ内容です（作業環境測定法第2条第6号・第7号、第6条、同施行規則第3条第1項、別表で確認）。
  _key_choice: 作業環境測定の業務に関する不正の行為により、作業環境測定士の登録を取り消された者は、その日から起算して1年間は、作業環境測定士となることができない。
