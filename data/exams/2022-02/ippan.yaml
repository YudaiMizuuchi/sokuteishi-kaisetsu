  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - リスクとは、労働者に負傷又は疾病を生じさせる潜在的な根源である「危険性又は有害性」のことで、ILO等においては、「ハザード」等の用語で表現されている。
  - リスク低減措置の検討において、より優先順位の高い措置を実施すれば十分にリスクが低減される場合には、その措置よりも優先順位の低い措置の検討は必要ない。
  - リスクの見積りの方法として、化学物質等への労働者のばく露濃度を測定し、測定結果を当該化学物質についての日本産業衛生学会の許容濃度と比較する方法がある。
  - 傷害や疾病等の種類にかかわらず、負傷又は疾病の重篤度の見積りは、基本的に負傷又は疾病による休業日数等を尺度として使用する。
  - 負傷又は疾病の重篤度の見積りに際しては、過去に実際に発生した負傷又は疾病の重篤度ではなく、最悪の状況を想定した最も重篤な負傷又は疾病の重篤度を見積もる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '「危険性又は有害性」は、労働者に負傷や疾病を生じさせる潜在的な根源で、ILO などでは「**ハザード**」と呼ばれます。これを「リスク」とする選択肢1は誤りです。リスクは、危険又は健康障害を生ずるおそれの程度（発生可能性）と、その程度（重篤度）を組み合わせたものです。


    より優先順位の高い措置で十分にリスクが低減されるなら、優先順位の低い措置は検討しなくてよく（選択肢2）、ばく露濃度を測って許容濃度と比べる見積り方法があります（選択肢3）。重篤度は休業日数などを尺度にし（選択肢4）、過去の実績ではなく、最悪の状況を想定した最も重篤な負傷又は疾病で見積もります（選択肢5）。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(1)、9(3)ア・イ、10(1)・(2)。'
