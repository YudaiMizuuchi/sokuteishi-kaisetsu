  rank: null
  stem: 作業環境評価基準に定める「管理濃度」及び日本産業衛生学会の「許容濃度等の勧告」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度は、測定値を統計的に処理したものと対比するもので、個々のA測定値と直接比較するものではない。
  - 有機溶剤の管理濃度の値は、全てppmで表記されている。
  - 許容濃度の数値は、種類の異なる物質の毒性の強さの相対的な尺度に用いることができる。
  - 許容濃度は、作業中のばく露濃度の変動があまり大きくない場合に利用される。
  - 許容濃度等の勧告における発がん性分類表で「第2群」とされた物質は、おそらく人に対して発がん性があると判断できる物質である。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '許容濃度の数値は、種類の異なる物質の毒性の強さを**比べる尺度としては使えません**。許容濃度は、物質ごとに、ばく露による健康影響をもとに定められた値だからです。選択肢3は誤りです。


    管理濃度は、測定値を統計的に処理したものと比べるもので、個々の A 測定値と直接比べるものではありません（選択肢1）。有機溶剤の管理濃度は全て ppm で表され（選択肢2）、許容濃度は、ばく露濃度の変動があまり大きくない場合に利用されます（選択肢4）。発がん性分類の第2群は、おそらく人に対して発がん性があると判断できる物質です（選択肢5）。'
