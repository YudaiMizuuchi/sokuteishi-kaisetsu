  - 毒素型食中毒は、食物に付着した細菌により産生された毒素によって起こる食中毒で、ボツリヌス菌によるものなどがある。
  - 微生物を含む飛沫の水分が蒸発し、5 µm以下の粒子として長時間空気中に浮遊して感染することを空気感染という。
