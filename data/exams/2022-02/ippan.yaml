  - リスク低減措置の検討において、より優先順位の高い措置を実施すれば十分にリスクが低減される場合には、その措置よりも優先順位の低い措置の検討は必要ない。
  - リスクの見積りの方法として、化学物質等への労働者のばく露濃度を測定し、測定結果を当該化学物質についての日本産業衛生学会の許容濃度と比較する方法がある。
