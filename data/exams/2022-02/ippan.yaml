  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - スチレンの生物学的モニタリングの指標として、尿中のマンデル酸及びフェニルグリオキシル酸の総量がある。
  - 鉛の生物学的モニタリングの指標として、赤血球中のプロトポルフィリンの濃度がある。
  - 血液中の鉛濃度の上昇は、数日以内に鉛にばく露したことを反映している。
  - トルエンの尿中代謝物である馬尿酸の測定値は、食品中の保存料、カフェインなどによる影響を受けて、見かけ上高値になることがある。
  - キシレンは、代謝されて、尿中にエチル馬尿酸として排泄される。
  columns: null
  answer: 5
