  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - インジウム化合物は、間質性肺炎を引き起こすほか、人に対する発がん性が疑われている。
  - フッ化水素による慢性中毒では、骨の硬化や斑状歯がみられるほか、人に対する発がん性があることが知られている。
  - 塩化ビニルによる中毒では、レイノー現象、指端骨溶解や肝血管肉腫などがみられる。
  - N,N-ジメチルホルムアミドのばく露では、頭痛、めまい、肝機能障害などがみられる。
  - コバルト及びその無機化合物は、接触性皮膚炎、気管支ぜんそくなどを生じる。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'フッ化水素の慢性中毒では、骨の硬化や斑状歯がみられますが、ヒトに対する**発がん性があるとは知られていません**。選択肢2は誤りです。


    インジウム化合物は間質性肺炎を起こし、発がん性が疑われています（選択肢1）。塩化ビニルは、レイノー現象・指端骨溶解・肝血管肉腫（選択肢3）、N,N-ジメチルホルムアミドは、頭痛・めまい・肝機能障害（選択肢4）、コバルトは、接触性皮膚炎・気管支ぜんそく（選択肢5）を起こします。'
