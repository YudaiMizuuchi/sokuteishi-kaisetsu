  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの沈降速度は、粒径の2乗に比例する。
  - 粉じん中の遊離けい酸は、胸膜プラークの主要な原因である。
  - 吸入性粉じんの分粒装置は、空気力学相当径4 µmの粉じん粒子を50%透過する性能を有する。
  - 鉱物性粉じんの管理濃度は、その遊離けい酸含有率が小さいほど大きな値になる。
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度1 g/cm³の球形粒子の直径である。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '胸膜プラークの主要な原因は**石綿**です。遊離けい酸の主な健康障害は、けい肺です。選択肢2は誤りです。


    粉じんの沈降速度は粒径の2乗に比例し（選択肢1）、吸入性粉じんの分粒装置は、空気力学相当径4 µm の粒子を50％透過します（選択肢3）。鉱物性粉じんの管理濃度は、遊離けい酸の含有率が小さいほど大きな値になり（選択肢4）、空気力学相当径は、同じ終末沈降速度をもつ密度 1 g/cm³ の球形粒子の直径です（選択肢5）。


    （参考：厚生労働省「石綿による健康被害に係る医学的判断に関する考え方」。胸膜プラークは石綿ばく露と極めて関係の深い所見で、日本では石綿ばく露によってのみ発生すると考えてよい、とされています。遊離けい酸の主な健康障害は、けい肺です。）'
