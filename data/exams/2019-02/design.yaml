  stem: 有害物質のA測定における測定点の位置又は数に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点を決める縦の線と横の線の間隔は、6m以下の任意でよいが、等間隔の原則はくずしてはならない。
  - 有害物質の発生源の間隔が等間隔で配列されている場合には、測定点の縦又は横の線の間隔が発生源の間隔と一致しないように設定する。
  - 2年間にわたって第1管理区分であった単位作業場所では、測定点の数は5未満としてもよい。
  - 単位作業場所が直線で区切れない場合にあっては、測定点を定める線は、単位作業場所の形に沿って曲率をもってもよい。
  - 単位作業場所の有害物質濃度がほぼ均一であることが明らかであるときは、6mを超える等間隔で引いた縦の線と横の線との交点を測定点とすることができる。
  answer: 3
  choice_notes: []
  explanation: 'A 測定の測定点を5未満にできるのは、単位作業場所が著しく狭く、かつ濃度がほぼ均一であることが明らかな場合です。過去に第1管理区分が続いていたことは、測定点を減らす理由にはならないので、選択肢3は誤りです。


    根拠：作業環境測定基準第2条第1項第1号の2。令和5年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 2年間にわたって第1管理区分であった単位作業場所では、測定点の数は5未満としてもよい。
