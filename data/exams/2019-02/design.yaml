  stem: 液体捕集法及び直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ミゼットインピンジャーによる粒子状物質の捕集では、粒径が小さいほど捕集率は低くなる。
  - バブラーによるガス状物質の捕集では、気泡が小さいほど捕集率は高くなる。
  - 小型ガス吸収管による有機溶剤などの揮発性物質の捕集では、捕集液の温度が低いほど捕集率は高くなる。
  - 真空捕集びんのコックには、漏れがないようにグリースを使用する。
  - 捕集袋を再度使用する場合には、窒素又は清浄空気で内面を十分に洗浄する。
  answer: 4
  choice_notes: []
  explanation: '真空捕集びんのコックには、グリースを使用しないようにします。グリースに測定対象物質が吸着したり、グリースから成分が出たりして、試料が変化するおそれがあるからです。「グリースを使用する」とする選択肢4は誤りです。


