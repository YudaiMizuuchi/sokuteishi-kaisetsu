  stem: 簡易測定機器による測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 圧電天秤方式の相対濃度計は、一定の周波数で振動している圧電結晶板上に粉じんが付着すると、その質量に応じて周波数が変わることを利用したものである。
  - 光散乱方式の相対濃度計の光源としては、白色ランプ又は半導体レーザーが用いられる。
  - 圧電天秤方式の相対濃度計の測定値は、mg/m³で表示される。
  - 光散乱方式の相対濃度計による鉱物性粉じんの測定では、相対濃度計の吸引口に分粒装置を接続して用いる。
  - 検知管の検知試薬は、測定対象物質以外の物質にも反応するものが用いられることがある。
  answer: 4
