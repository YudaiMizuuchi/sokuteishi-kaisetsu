  stem: 正規分布、対数正規分布及び作業環境空気中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の濃度分布は、対数正規分布で近似される。
  - 正規分布の平均と標準偏差は、同じ次元を持つ。
  - 対数正規分布の幾何平均と幾何標準偏差は、同じ次元を持つ。
  - 横軸を変数の対数変換値とし、縦軸を確率密度とすると、対数正規分布の曲線の形は、幾何平均の対数変換値を中心として左右対称になる。
  - 横軸を変数とし、縦軸を確率密度とすると、正規分布の曲線の形は、平均を中心として左右対称になる。
