  stem: 作業環境空気中の有害物質の捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 一般に、ろ過捕集法による粒子の捕集率は、粒径0.1～0.3μm程度の粒子で低くなる。
  - 多段平行板式分粒装置を用いて鉱物性粉じん濃度を測定する場合、吸引流量が所定の値より大きいと測定値は高くなる。
  - 捕集装置を取り付けない状態で流量校正した流量計を用いて、有機溶剤を捕集した場合、測定される濃度は低くなる。
  - 慣性衝突式分粒装置を用いて、所定の吸引流量より大きい流量で吸引すると、分粒装置を通過する粒子の50%分粒粒径は大きくなる。
  - シリカゲル管を用いてメタノールを捕集する場合、湿度が高いほどメタノールの破過時間は短くなる。
  answer: 4
  choice_notes: []
  explanation: '慣性衝突式分粒装置を所定より**大きい**流量で吸引すると、ノズルから吹き出す空気の速さが増して、小さい粒子まで衝突板にぶつかるので、50 ％ 分粒粒径は**小さく**なります。「大きくなる」とする選択肢4は誤りです。


    流量が小さいと50％分粒粒径が大きくなる（令和2年度第2回）のと、逆の関係です。'
