  stem: 光散乱方式の相対濃度計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸引流量は、相対濃度には影響しない。
  - 質量濃度変換係数（K）、相対濃度（R）及び質量濃度（C）の関係は、K＝R/Cで表される。
  - 感度校正には0.3μmのステアリン酸粒子が用いられる。
  - 同じ個数であれば、粒径5μmの粉じん粒子の散乱強度は、粒径0.3μmの粉じん粒子の散乱強度より大きい。
  - 測定を行う際は、前もって光散乱部を清浄空気で満たした状態で感度合わせを行う。
  answer: 2
  choice_notes: []
  explanation: '質量濃度変換係数 K は、質量濃度 C を相対濃度 R で割ったもの（K ＝ C ÷ R）です。K ＝ R ÷ C とする選択肢2は、分子と分母が逆で誤りです。


    令和4年度第2回にも、同じ論点があります。'
