  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 最大濃度を示す可能性のある作業位置が複数あって、どの作業位置で最大濃度になるか予測できない場合には、それらのすべての作業位置で測定を行い、最大の測定値をB測定の測定値とする。
  - A測定の終了後に作業環境空気中の濃度が最大になると考えられる作業が行われることが判明した場合は、A測定の実施時間とは別に、その作業が行われる時間にB測定を実施してもよい。
  - B測定は、測定時に労働者がいない場合でも立ち入ることがあるならば、その作業位置で測定を行う。
  - サンプリング時間1分の検知管を5本用いてB測定を行った場合は、10分間に均等な間隔で測定した検知管の指示値の幾何平均値を測定値とする。
  - B測定の試料採取方法と分析方法は、A測定と同じ方法を用いる。
  answer: 4
  choice_notes: []
  explanation: '検知管を10分間に均等な間隔で5本使って B 測定を行った場合は、指示値の**算術平均値**を B 測定値とします。幾何平均値とする選択肢4は誤りです。


