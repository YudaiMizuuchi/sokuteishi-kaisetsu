  stem: 作業環境測定の対象物質の状態に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒子状物質には、粉じん、ミスト及びヒュームがある。
  - ヒュームの一次粒子の粒径は、5～10μm程度である。
  - 固体に研磨、切削などの機械的な作用を加えて発生した固体の微粒子が空気中に浮遊しているものは、粉じんである。
  - 液体の微粒子が空気中に浮遊しているものは、ミストである。
  - 気体が空気中で凝固し、固体の微粒子となって空気中に浮遊しているものは、ヒュームである。
  answer: 2
  choice_notes: []
  explanation: 'ヒュームの一次粒子の粒径は、一般に **1 µm 以下**です。5〜10 µm 程度とする選択肢2は誤りです。


    令和2年度第2回にも、まったく同じ選択肢があります。'
  figures: []
  law_note: null
  _key_choice: ヒュームの一次粒子の粒径は、5～10 µm程度である。
