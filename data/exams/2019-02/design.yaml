  stem: 有害物質のA測定及びB測定が行われた場合の作業環境評価等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定の測定値が管理濃度以上であれば、A測定の結果にかかわらず、管理区分は第2又は第3管理区分になる。
  - A測定の第2評価値が管理濃度を超えていれば、B測定の結果にかかわらず、管理区分は第3管理区分になる。
  - A測定の第1評価値とB測定の測定値が共に管理濃度より小さくても、管理区分は第1管理区分になるとは限らない。
  - 幾何標準偏差(σ)の値は、2日間測定では、1以上の値であるが、1日測定の場合には、1.95以上の値になる。
  - A測定の第1評価値が管理濃度より小さい単位作業場所内の気中有害物質濃度が管理濃度を超える確率は、5%未満である。
  answer: 3
  choice_notes: []
  explanation: 'A 測定の第1評価値と B 測定値がともに管理濃度より小さければ、管理区分は**第1管理区分**です。「第1管理区分になるとは限らない」とする選択肢3は誤りです。


    この選択肢は、令和2年度第1回・令和4年度第2回・令和5年度第2回にも、まったく同じ形で出題されています。'
