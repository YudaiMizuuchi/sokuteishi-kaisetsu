  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致していなければならない。
  - 同一建物内にいくつかの単位作業場所を設定する場合、それぞれの単位作業場所の範囲が重なってはならない。
  - クロム酸亜鉛を含む塗料で吹付け塗装を行う作業場で、同一の区域をクロム酸と有機溶剤とで別々の単位作業場所として設定した。
  - 有機溶剤による金属の洗浄を行う工場で働く作業者の行動範囲が当該工場内全体であったが、有機溶剤の分布が発生源周辺に限定されると考えられたので、発生源周辺の区域を単位作業場所とした。
  - 粉じんの発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  answer: 2
  choice_notes: []
  explanation: '同じ建物の中に単位作業場所をいくつか設定する場合、その範囲が**重なっても構いません**。物質ごとに単位作業場所を設定するので、同じ区域が、ある物質の単位作業場所と別の物質の単位作業場所の両方に入ることもあります。「重なってはならない」とする選択肢2は誤りです。


    クロム酸亜鉛を含む塗料の吹付け塗装で、同じ区域をクロム酸と有機溶剤の別々の単位作業場所とする（選択肢3）のが、その典型例です。'
  figures: []
  law_note: null
  _key_choice: 同一建物内にいくつかの単位作業場所を設定する場合、それぞれの単位作業場所の範囲が重なってはならない。
