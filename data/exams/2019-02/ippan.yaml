  stem: 酸素欠乏症及び硫化水素中毒に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 酸素欠乏症発生時の救助活動では、救出作業に従事する労働者に空気呼吸器、酸素呼吸器又は送気マスクを使用させる必要がある。
  - 海水が滞留している暗きょの内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  - ドライアイスを使用して冷蔵を行っている冷蔵庫の内部での作業では、酸素欠乏症の危険がある。
  - 石炭、硫化鉱又は鋼材を入れてあるタンクの内部での作業では、硫化水素中毒の危険がある。
  - 空気中の酸素濃度が16%程度以下になると、頭痛、吐き気などの自覚症状が現れ、10%程度以下になると、意識喪失やけいれんが生じる。
