  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 防毒マスクの有機ガス用の吸収缶の色は、黒である。
  - 防毒マスクのアンモニア用の吸収缶の色は、緑である。
  - 隔離式防毒マスクは、直結式防毒マスクより使用できる環境空気中の対象ガス濃度の範囲が広い。
  - 有害物質の臭気等を感知できる濃度がばく露限界濃度より著しく小さい物質では、防毒マスクの使用中に臭気等を感知したときを吸収缶の交換時期とすることができるものがある。
  - 顔への密着性を確認する方法の一つである陽圧法は、息を吸って、防毒マスクの面体と顔面との隙間から空気が面体内に漏れ込まず、面体が顔面に吸いつけられるかどうかを確認する方法である。
  answer: 5
  choice_notes: []
  explanation: 面体を手で押さえて**息を吸い**、面体が顔面に吸いつけられるかを確認するのは「**陰圧法**」です。陽圧法は、排気弁をふさいで息を吐き、面体と顔面の間から空気が漏れないかを確認する方法なので、選択肢5は誤りです。
