  - 空気中に浮遊する粉じんは、密度が同じであれば粒径が小さくなるほど、沈降速度は遅くなる。
  - 有機溶剤の蒸気密度は、空気の密度より大きいため、低いところに滞留しやすい。
  - 混合有機溶剤から出る蒸気の組成は、一般に、元の混合有機溶剤の組成と異なる。
