  stem: 金属による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - カドミウム中毒では、上気道炎、肺炎、腎機能障害などがみられる。
  - ヒ素中毒では、角化症、黒皮症などの皮膚障害、鼻中隔穿孔などの障害がみられる。
  - ベリリウム中毒では、溶血性貧血、尿の赤色化などの症状がみられる。
  - マンガンの慢性中毒では、神経質になるなどの精神症状のほか、歩行障害、発語障害、筋緊張亢進といったパーキンソン病に似た症状がみられる
  - クロム酸や二クロム酸は、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって鼻中隔穿孔、肺がんなどを生じる。
  answer: 3
  choice_notes: []
  explanation: '溶血性貧血や尿の赤色化は、**ヒ化水素（アルシン）**の中毒の特徴です。ベリリウムの代表的な健康障害は、肺の肉芽腫（ベリリウム肺）や皮膚炎なので、選択肢3は誤りです。


    この組合せの誤りは、令和3年度第1回・令和7年度第1回にもあります。'
