  stem: 鉱物性粉じん及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求められる。
  - じん肺は、ある程度進行すると、ばく露を中止しても、更に進行することがある。
  - 遊離けい酸を含まない鉱物性粉じんの管理濃度は、3.0mg/m³である。
  - じん肺の合併症としては、肺結核、続発性気管支炎、原発性肺がんなどがある。
  - 鉱物性粉じんの有害性の程度は、遊離けい酸含有率によって異なる。
  answer: 1
