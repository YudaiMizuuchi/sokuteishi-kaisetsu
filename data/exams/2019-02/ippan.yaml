  stem: 電離放射線及びその影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 白血病は、晩発障害に分類される確率的影響である。
  - しきい値は、確定的影響には存在するが、確率的影響には存在しないとされている。
  - X線とγ線は、波長の長短ではなく、その発生過程の違いによって区別される。
  - β線は、電離作用を有する電磁波である。
  - α線、β線及びX線の中で、透過力が最も強いものはX線である。
  answer: 4
  choice_notes: []
  explanation: 'β 線は、電子（または陽電子）の流れで、電離作用を有する**粒子線**です。電磁波とする選択肢4は誤りです。


