  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 1,2-ジクロロプロパンは、肝臓及び腎臓の障害などのほか、長期間の高濃度ばく露により胆管がん発症につながる蓋然性が高い。
  - 二硫化炭素中毒では、微細動脈瘤などの網膜の変化が起こる。
  - ジメチル-2,2-ジクロロビニルフォスフェート(DDVP)は、神経系や肝臓の障害などのほか、ヒトに対する発がん性が疑われている。
  - 硫化水素は、無色・無臭の気体であり、酸素欠乏症を起こす。
  - コバルト及びその無機化合物は、接触性皮膚炎、気管支ぜんそくなどを引き起こすほか、ヒトに対する発がん性が疑われている。
  answer: 4
  choice_notes: []
  explanation: '硫化水素は無色ですが、腐った卵のような**特有の臭い**がある気体です。「無色・無臭」とする選択肢4は誤りです。


    ただし、高い濃度では嗅覚が麻痺して臭いを感じなくなるので、臭いで安全を判断することはできません。'
