  - 隔離式防毒マスクは、直結式防毒マスクより使用できる環境空気中の対象ガス濃度の範囲が広い。
  - 有害物質の臭気等を感知できる濃度がばく露限界濃度より著しく小さい物質では、防毒マスクの使用中に臭気等を感知したときを吸収缶の交換時期とすることができるものがある。
  - 顔への密着性を確認する方法の一つである陽圧法は、息を吸って、防毒マスクの面体と顔面との隙間から空気が面体内に漏れ込まず、面体が顔面に吸いつけられるかどうかを確認する方法である。
