  rank: null
  summary: null
  stem: '厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の㋑から㋥の記述について、誤っているものの組合せは、下のうちどれか。


    ㋑ 発生可能性及び重篤度を考慮して行うリスクの見積りでは、必ずしも数値化する必要はなく、相対的な分類でも差し支えない。


    ㋺ リスクの見積りにおいては、過去に発生した最も重篤な負傷又は疾病の重篤度を見積もる。


    ㋩ 「ハザード（hazard）」とは、この指針における「危険性又は有害性」に相当する。


    ㋥ 化学物質のばく露限界には、管理濃度、日本産業衛生学会の許容濃度、ACGIH（米国産業衛生専門家会議）のTLV-TWAなどが含まれる。'
  choices:
  - ㋑㋺
  - ㋑㋩
  - ㋑㋥
  - ㋺㋩
  - ㋺㋥
  answer: 5
  choice_notes: []
  explanation: '㋺ リスクの見積りでは、過去に発生した重篤度ではなく、**予想される最も重篤な**負傷又は疾病の重篤度を見積もります。㋥ 管理濃度は、作業環境測定の結果を評価するための行政上の値で、指針でいう「ばく露限界」（許容濃度や TLV-TWA など）には含まれません。よって、誤っているのは㋺と㋥の組合せ（5）です。


    ㋑ 見積りは相対的な分類でもよい、㋩ ハザードは「危険性又は有害性」に当たる、は正しい記述です。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 8イ（管理濃度・濃度基準値と、それらが設定されていない場合の許容濃度や TLV-TWA 等の「ばく露限界」を分けて定めている）、9(3)ア（過去に実際に発生した重篤度ではなく、最悪の状況を想定した最も重篤な負傷又は疾病の重篤度を見積もる）。'
  figures: []
