  stem: '厚生労働省の「VDT作業における労働衛生管理のためのガイドライン」に基づく対応に関する次の㋑から㋥の記述について、誤っているものの組合せは、下のうちどれか。


    ㋑ ディスプレイ画面上における照度は、500ルクス以上になるようにする。


    ㋺ 書類上及びキーボード上における照度は、300ルクス以上になるようにする。


    ㋩ ディスプレイは、おおむね30cm以上の視距離が確保できるようにし、画面の上端が、眼と同じ高さか、やや上になるようにしている。


    ㋥ VDT作業健康診断では、視力検査などの眼科学的検査のほか、上肢の運動機能などの筋骨格系に関する検査も行っている。'
  choices:
  - ㋑㋺
  - ㋑㋩
  - ㋺㋩
  - ㋺㋥
  - ㋩㋥
  answer: 2
  choice_notes: []
  explanation: '㋑ ディスプレイ画面上の照度は **500 ルクス以下**とします（画面が明るすぎると見えにくくなるため）。㋩ ディスプレイはおおむね **40 cm 以上**の視距離を確保し、画面の上端が眼と同じ高さか、やや**下**になるようにします。よって、誤っているのは㋑と㋩の組合せ（2）です。


    令和4年度第2回にも、40 cm 以上・やや下という同じ論点があります。'
  figures: []
  law_note: この問題の「VDT作業における労働衛生管理のためのガイドライン」は、令和元年7月12日に「情報機器作業における労働衛生管理のためのガイドライン」（基発0712第3号）に改められています。照度や視距離の考え方は引き継がれています。
  _key_choice: ㋑ ㋩
