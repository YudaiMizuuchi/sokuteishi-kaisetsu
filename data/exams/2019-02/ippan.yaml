  stem: 化学物質の代謝、吸収、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 化学物質の生物学的半減期とは、体内に吸収された化学物質の量が半分に減るのに要する時間である。
  - キシレンの生物学的モニタリング指標は、尿中のトリクロロ酢酸である。
  - n-ヘキサンの生物学的モニタリング指標は、尿中の2,5-ヘキサンジオンである。
  - スチレンの生物学的モニタリング指標は、尿中のマンデル酸である。
  - 粒子状物質が経気道的に侵入した場合、空気力学相当径が1～2μm程度の大きさの粒子は肺胞に沈着しやすい。
  answer: 2
  choice_notes: []
  explanation: 'キシレンの生物学的モニタリングの指標は、尿中の**メチル馬尿酸**です。トリクロロ酢酸は、トリクロロエチレンなどの代謝物なので、選択肢2は誤りです。


    令和2年度第2回・令和4年度第2回にも、キシレンとメチル馬尿酸の論点があります。'
  figures: []
  law_note: null
  _key_choice: キシレンの生物学的モニタリング指標は、尿中のトリクロロ酢酸である。
