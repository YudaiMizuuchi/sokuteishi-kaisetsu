  stem: 局所振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動工具の日振動ばく露量は、周波数補正振動加速度実効値の3軸合成値が大きいほど大きくなる。
  - 振動工具の日振動ばく露量は、振動ばく露時間が長いほど大きくなる。
  - 日振動ばく露量が、5.0m/s²を超えないように、振動ばく露時間の抑制、低振動の振動工具の選定などを行う。
  - 振動工具を使用する作業では、レイノー現象などの末梢神経障害及び手指のしびれなどの末梢循環障害が発生するおそれがある。
  - 振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬季に行うとよい。
  answer: 4
