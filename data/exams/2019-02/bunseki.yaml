  explanation: 'メスフラスコを用いて溶液を希釈するときは、メスフラスコを希釈前の溶液で共洗いしてはいけません。共洗いすると、メスフラスコの内壁に残った溶液の分だけ溶質が多くなり、正しい濃度にならないからです。選択肢5は誤りです。


