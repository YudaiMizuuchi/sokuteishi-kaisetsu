  - '9.255'
  - '9.2549'
  answer: 2
  choice_notes: []
  explanation: '捕集量を捕集効率で割って空気中にあった量に直し、通気量で割ります。


    通気量 ＝ 100 mL/min × 30.0 分 ＝ 3.00 L、空気中の量 ＝ 23.60 ÷ 0.85 ≒ 27.8 µg


    濃度 ＝ 27.8 ÷ 3.00 ≒ 9.25 µg/L


