  stem: 捕集材に空気を流量100mL·min⁻¹で30.0分間通気して物質Aを23.60μg捕集した。捕集材の物質Aに対する捕集効率が85%であるとき、物質Aの空気中濃度（μg·L⁻¹）の数値の表示として適切なものは次のうちどれか。
