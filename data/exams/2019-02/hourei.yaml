  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 事業者は、常時300人以上の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
  - 事業者は、総括安全衛生管理者を選任する場合には、当該事業場においてその事業の実施を統括管理する者をもって充てなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に関係なく産業医を選任しなければならない。
  - 事業者は、2人以上の衛生管理者を選任する場合においては、そのうちの1人は、当該事業場に専属ではない労働衛生コンサルタントとすることができる。
  - 衛生管理者は、少なくとも毎週1回作業場等を巡視し、設備、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  answer: 1
  choice_notes: []
  explanation: '総括安全衛生管理者を選任しなければならない規模は、業種によって違います（林業・建設業などは100人以上、製造業などは300人以上、その他の業種は1,000人以上）。「業種に関係なく300人以上」とする選択肢1は誤りです。


    令和2年度第1回にも、同じ選択肢があります。'
  figures: []
  law_note: null
