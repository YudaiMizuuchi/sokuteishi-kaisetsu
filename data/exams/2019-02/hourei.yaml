  stem: 次の記述のうち、労働安全衛生関係法令上、誤っているものはどれか。
  choices:
  - じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病と定義されている。
  - 高気圧障害は、高気圧による減圧症、酸素、窒素又は炭酸ガスによる中毒その他の高気圧による健康障害と定義されている。
  - 常時粉じん作業に従事する労働者で、じん肺管理区分が管理2であるものについては、3年以内ごとに1回、定期的に、じん肺健康診断を行わなければならない。
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務(設備の解体等に伴うものを除く。)を行う作業場については、6か月以内ごとに1回、定期に、その作業場における空気中のダイオキシン類の濃度を測定しなければならない。
  - はんだ付けの業務(鉛業務)を行う自然換気が不十分な屋内作業場に設ける全体換気装置は、その業務に従事する労働者1人について100m³/h以上の換気能力を有するものでなければならない。
  answer: 3
