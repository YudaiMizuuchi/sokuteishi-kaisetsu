  stem: 法令に基づく安全又は衛生のための特別教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - エックス線装置を用いて行う透過写真の撮影の業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - 有機溶剤業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別教育を省略することができる。
  answer: 4
  choice_notes: []
  explanation: '有機溶剤業務は、特別教育の対象ではありません。選択肢4は誤りです。


    有機溶剤業務は、有機溶剤作業主任者の選任によって管理します。'
  figures: []
