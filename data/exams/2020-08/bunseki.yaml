  stem: 捕集材に空気を流量 100 mL･min⁻¹ で 30.0 分間通気して物質 A を 23.60 µg捕集した。捕集材の物質 A に対する捕集効率が 85 ％ である時、物質 A の空気中濃度（µg･L⁻¹)の数値として適切なものは次のうちどれか。
