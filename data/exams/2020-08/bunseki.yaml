  stem: pH 1.0 の硝酸溶液を水で2倍に希釈した溶液の pH として、正しい値に最も近いものは下のうちどれか。ただし、pH は次の式で計算し、 log₁₀2 = 0.301 とする。pH = - log₁₀［H ＋］なお、式中の［H ＋］は水素イオンのモル濃度を表す。
  choices:
  - '1.0'
  - '1.3'
  - '2.0'
  - '2.3'
  - '3.0'
  answer: 2
  choice_notes: []
  explanation: 'pH 1.0 の硝酸の水素イオン濃度は 0.10 mol/L です。2倍に希釈すると 0.050 mol/L になるので、


    pH ＝ −log(0.050) ＝ −log(0.10 ÷ 2) ＝ 1.0 ＋ log 2 ≒ 1.0 ＋ 0.30 ＝ 1.3


    よって（2）が正しい値です。2倍に薄めても pH が2倍になるわけではなく、log 2 ≒ 0.3 だけ大きくなります。'
