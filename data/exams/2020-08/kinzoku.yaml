  stem: 作業環境空気中の金属の測定に用いる蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 蛍光の波長は、励起光の波長より長い。
  - 入射光に対して直角方向の蛍光を測定する。
  - 試料溶液中の金属イオンの蛍光強度を測定する。
  - 試料溶液の pH や温度は、蛍光強度に影響を及ぼす。
  - 吸光光度分析法に比べ、感度が高い。
