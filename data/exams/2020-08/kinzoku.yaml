  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 光源の輝線の線幅は、吸収線の線幅よりも広い。
  - 中空陰極ランプは、陰極が測定対象金属又はその合金でできている。
  - 吸光度は、光路長と基底状態の金属原子の濃度の積に比例する。
  - 中空陰極ランプでは、励起原子の発光スペクトルが得られる。
  - 電気加熱原子化法(グラファイト炉法)は、フレーム法に比べて測定感度が高い。
  answer: 1
  choice_notes: []
  explanation: '原子吸光分析法では、光源の輝線の線幅は、吸収線の線幅より**狭く**なければなりません。「広い」とする選択肢1は誤りです。


    中空陰極ランプは、陰極が測定対象金属（またはその合金）でできています。吸光度は、光路長と、基底状態の金属原子の濃度の積に比例します。中空陰極ランプでは、励起原子の発光スペクトルが得られます。電気加熱原子化法は、フレーム法より、測定感度が高いです。


    同じ記述は、令和6年度第1回にも出題されています（出題実績）。


    （参考：『機器分析の実務』）'
