  stem: ベリリウムの蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - ガラス繊維ろ紙で試料を捕集する。
  - 採取した試料を硫酸(1＋10)で処理し、試料液を調製する。
  - 試料液をアルカリ性にした後、モリンを加えて、最終試料液とする。
  - 最終試料液に励起光を照射し、蛍光強度を測定する。
  - 標準液の調製には、硫酸ベリリウム(四水和物)を高温乾燥後、使用する。
  answer: 5
  choice_notes: []
  explanation: 'ベリリウムの蛍光光度分析法で、標準液は、硫酸ベリリウム（四水和物）で調製します。四水和物は、結晶水を含む化合物なので、**高温で乾燥すると、結晶水が失われて**、質量が変わります。「高温乾燥後、使用する」とする選択肢5は誤りです。


    試料は、ガラス繊維ろ紙に捕集し、硫酸（1＋10）で処理して試料液にします。試料液をアルカリ性にしたあと、モリンを加えて最終試料液とし、励起光を照射して、蛍光強度を測定します。


