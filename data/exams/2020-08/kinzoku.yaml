    蛍光の波長は、励起光の波長より長くなります。入射光に対して直角方向の蛍光を測定します。試料溶液のpHや温度は、蛍光強度に影響します。吸光光度分析法に比べて、感度が高いです。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
