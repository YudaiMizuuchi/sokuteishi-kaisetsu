  stem: 誘導結合プラズマ発光分光分析法(ICP-AES)のプラズマに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - プラズマトーチは通常、三重管で、プラズマガス、補助ガス、キャリヤーガスが流れる。
  - キャリヤーガスは、霧化した試料溶液をプラズマの中心に導入する。
  - プラズマ炎の中心部は、周囲よりも温度が高い。
  - プラズマ炎の分析ゾーンでは、原子又はイオンの発光が観測される。
  - プラズマ炎の観測方向は、軸方向と横方向の2種類がある。
  answer: 3
  choice_notes: []
  explanation: 'ICP-AESのプラズマ炎は、ドーナツ構造をしていて、**中心部は、周囲よりも温度が低く**なります（試料は、この中心部の通路を通ります）。「中心部は、周囲よりも温度が高い」とする選択肢3は誤りです。同じ記述は、令和3年度第1回にも出題されています（出題実績）。


    プラズマトーチは三重管で、キャリヤーガスは、霧化した試料溶液をプラズマの中心に導入します。分析ゾーンでは、原子またはイオンの発光が観測され、観測方向には、軸方向と横方向があります。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
