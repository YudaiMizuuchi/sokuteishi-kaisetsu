  stem: 金属等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ヒ素中毒では、角化症、黒皮症などの皮膚障害、末梢神経障害、鼻中隔穿孔などの障害がみられる。
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対する発がん性が疑われている。
  - 金属熱は、亜鉛や銅などのヒュームを長期にわたって吸入して発生する疾病で、慢性化すると高熱、関節痛などの症状が長期間続く。
  - 金属水銀中毒では、感情不安定、幻覚などの精神障害や手指の震えなどがみられる。
  - コバルト及びその無機化合物は、接触皮膚炎、気管支ぜんそくなどを生じる。
  answer: 3
  choice_notes: []
  explanation: '金属熱は、亜鉛や銅などのヒュームを吸い込んでから数時間後に、悪寒・発熱・関節痛などが起こる**急性**の疾病で、多くは1〜2日で回復します。「長期にわたって吸入して発生し、慢性化すると症状が長期間続く」とする選択肢3は誤りです。


    令和6年度第1回・令和8年度第1回でも、金属熱は後遺症なく回復するという論点が出題されています。'
  figures: []
  law_note: null
  _key_choice: 金属熱は、亜鉛や銅などのヒュームを長期にわたって吸入して発生する疾病で、慢性化すると高熱、関節痛などの症状が長期間続く。
