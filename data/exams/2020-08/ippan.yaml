  stem: 職場環境等における健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 減圧症は、潜函作業者や潜水作業者などに発症するもので、高圧下作業からの急な減圧に伴い、血液中や組織中に溶け込んでいた酸素の気泡化により発生する。
  - ノロウイルスによる食中毒は、冬季の集団食中毒として発生することが多く、潜伏期間は、1～2日間である。
  - 満18歳以上の男子労働者が人力のみにより取り扱う物の重量は、体重のおおむね 40 ％ 以下となるようにし、満18歳以上の女子労働者では、さらに男性が取り扱うことのできる重量の 60 ％ 位までとする。
  - 感染型食中毒は、食物に付着している細菌そのものの感染によって起こる食中毒で、サルモネラ菌によるものなどがある。
  - 情報機器作業において、ディスプレイを用いる場合のディスプレイ画面上における照度を500ルクス以下、書類上及びキーボード上における照度を300ルクス以上とする。
  answer: 1
  choice_notes: []
  explanation: '減圧症は、高い圧力のもとで血液や組織に溶け込んでいた**窒素**が、急な減圧によって気泡になることで起こります。酸素とする選択肢1は誤りです。


    窒素は体内でほとんど使われずに溶け込んだまま残るので、減圧のときに気泡になりやすいのです。令和2年度第2回にも、窒素の気泡化という正しい記述があります。'
  figures: []
  law_note: null
