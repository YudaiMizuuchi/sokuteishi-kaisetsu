  - gn-oh-management-05
  rank: null
  summary: null
  stem: 労働衛生の三管理とされる作業環境管理、作業管理及び健康管理について、次の措置のうち作業管理に該当するものはどれか。
  choices:
  - 有機溶剤の蒸気を発散する屋内作業場において、定期的に環境空気中の有機溶剤の濃度を測定する。
  - 外部放射線による実効線量が3か月間に一定の線量を超えるおそれのある区域を管理区域として設定し、標識によって明示する。
  - 使用している有害な化学物質を、同じ使用目的を達成できる有害性のより少ない物質に代替する。
  - 深夜業に従事する労働者の健康診断の結果、有所見と判断された者の勤務を昼間勤務に転換する。
  - 有害な化学物質の蒸気を発散する屋内作業場に、プッシュプル型換気装置を設置し、稼働させる。
  answer: 2
  choice_notes: []
  explanation: '労働衛生の三管理のうち、**作業管理**は、作業の方法や作業時間・作業場所などを管理して、労働者への有害要因の影響を少なくするものです。管理区域を設定して標識で明示し、立ち入る人や場所を管理することは作業管理に当たるので、答えは（2）です。


    有機溶剤の濃度の測定（1）、有害性の少ない物質への代替（3）、プッシュプル型換気装置の設置（5）は作業環境管理、健康診断の結果に基づく昼間勤務への転換（4）は健康管理です。


    （参考：『作業環境測定のための労働衛生の知識』「労働衛生管理」の項。作業管理は「作業を適正に進めることにより、作業活動によってもたらされる作業環境の悪化や、作業者の有害要因へのばく露の防止を図るための管理」とされています。管理区域を設けて立ち入る人や場所を管理することは、ばく露を防ぐための作業の管理に当たります）'
  figures: []
  law_note: null
  _key_choice: 外部放射線による実効線量が3か月間に一定の線量を超えるおそれのある区域を管理区域として設定し、標識によって明示する。
- num: 2
