  stem: 温熱環境及び人体の適応等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 屋内の場合のWBGTは、自然湿球温度及び黒球温度の数値から算出される。
  - WBGT基準値は、同一作業であっても、熱に順化していない人の方が熱に順化している人よりも、低い値となる。
  - 絶対湿度とは、ある温度における飽和水蒸気圧に対する空気中の水蒸気圧の比を百分率で示したものである。
  - 放熱は、ふく射、伝導、蒸発などの物理的な過程で行われ、蒸発には発汗と不感蒸泄によるものがある。
  - 体温調節中枢は、間脳の視床下部にある。
  answer: 3
  choice_notes: []
  explanation: 'ある温度における飽和水蒸気圧に対する、空気中の水蒸気圧の比を百分率で表したものは、**相対湿度**です。絶対湿度は、空気 1 m³ に含まれる水蒸気の質量（g/m³）などで表すものなので、選択肢3は誤りです。


    令和5年度第1回では、相対湿度の正しい定義が出題されています。'
  figures: []
  law_note: null
  _key_choice: 絶対湿度とは、ある温度における飽和水蒸気圧に対する空気中の水蒸気圧の比を百分率で示したものである。
