  - 窒素は、無色、無臭の気体であるが、高気圧下においては麻酔作用などが現れる。
  - カドミウム中毒では、上気道炎、肺炎、腎機能障害などがみられる。
  - 二硫化炭素による中毒では、メトヘモグロビン形成によるチアノーゼがみられる。
