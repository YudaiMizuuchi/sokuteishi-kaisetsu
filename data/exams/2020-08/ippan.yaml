  summary: null
  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 負傷又は疾病の重篤度の見積りに際しては、傷害や疾病等の種類にかかわらず、基本的に、負傷又は疾病による休業日数等を尺度として使用する。
  - ハザードは、労働災害発生の可能性と負傷又は疾病の重大性(重篤度)の組合せであると定義される。
  - 個人ばく露濃度をばく露限界と比較する方法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - 化学物質等による危険性又は有害性の特定は、一般に、作業標準等に基づき、必要な単位で作業を洗い出した上で、国連勧告の「化学品の分類及び表示に関する世界調和システム(GHS)」で示されている危険性又は有害性の分類等に則して行う。
  - リスク低減措置の検討に当たっては、作業手順の改善等の管理的対策は、個人用保護具の使用よりも、より高い優先順位で検討されるべきである。
  answer: 2
  choice_notes: []
  explanation: 'ハザード（危険性又は有害性）は、労働者に負傷や疾病を生じさせる**潜在的な根源**です。労働災害の発生の可能性と重篤度の組合せは「リスク」の定義なので、選択肢2は誤りです。


    令和5年度第2回でも、ハザードとリスクの定義を入れ替えた誤りが出題されています。'
  figures: []
  law_note: null
  _key_choice: ハザードは、労働災害発生の可能性と負傷又は疾病の重大性（重篤度）の組合せであると定義される。
- num: 3
