  stem: 粉じん等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アーク溶接ヒュームは、じん肺を引き起こす原因となる。
  - ヒュームの一次粒子の粒径は、一般に、1 µm 以下である。
  - けい肺は、鉄、アルミニウムなどの金属粉じんを吸入することによって発症するじん肺である。
  - 吸入された鉱物性粉じんの各呼吸部位での沈着率は、その空気力学相当径によって異なる。
  - 石綿粉じんへの長期間ばく露により、胸膜プラーク(肥厚斑)が生じる。
  answer: 3
  choice_notes: []
  explanation: 'けい肺は、**遊離けい酸**（結晶質シリカ）を含む粉じんを吸入して起こるじん肺です。鉄やアルミニウムなどの金属粉じんによるじん肺は、溶接工肺やアルミニウム肺などと呼ばれ、けい肺とは別のものなので、選択肢3は誤りです。


    令和6年度第1回でも、結晶質シリカによるじん肺がけい肺、という正しい記述が出題されています。'
  figures: []
  law_note: null
  _key_choice: けい肺は、鉄、アルミニウムなどの金属粉じんを吸入することによって発症するじん肺である。
