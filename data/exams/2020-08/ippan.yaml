  rank: null
  summary: null
  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 体内に取り込まれた鉛の生物学的半減期は数時間と短いので、鉛健康診断における採尿及び採血の時期は、正確にチェックする必要がある。
  - テトラクロロエチレンの生物学的モニタリングの指標として尿中の総三塩化物の濃度がある。
  - N,N-ジメチルホルムアミドの生物学的モニタリングの指標として尿中の N-メチルホルムアミドの濃度がある。
  - トルエンの生物学的モニタリングの指標である尿中馬尿酸の濃度は、飲食物中の安息香酸の量が増加すると高くなることがある。
  - キシレンは、代謝されて、尿中にメチル馬尿酸として排泄される。
  answer: 1
  choice_notes: []
  explanation: '体内に取り込まれた鉛は、血液中で約1か月、骨では年単位と、生物学的半減期は**長い**物質です。「数時間と短い」とする選択肢1は誤りです。


    採尿の時刻を正確にチェックする必要があるのは、生物学的半減期が短い有機溶剤の方です。鉛は体にたまりやすいので、採尿・採血の時期にはそれほど厳しい制約がありません。'
  figures: []
  law_note: null
  _key_choice: 体内に取り込まれた鉛の生物学的半減期は数時間と短いので、鉛健康診断における採尿及び採血の時期は、正確にチェックする必要がある。
