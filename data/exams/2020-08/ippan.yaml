  stem: 騒音等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音へのばく露により、ストレス反応である副腎皮質ホルモンの分泌の増加が認められる。
  - 音圧レベルは、通常、その音圧と人間が聴くことができる最も小さな音圧(20 µPa)との比の常用対数を20倍して求められ、その単位はデシベル(dB)で表される。
  - 騒音の A 測定の平均の値は、得られた測定値のうち 80 dB(A) 以上の測定値の幾何平均として得られる。
  - 騒音性難聴の初期に認められる 4,000 Hz 付近の音から始まる聴力低下の型を c⁵ dip という。
  - 騒音性難聴は、内耳の障害による感音性難聴である。
  answer: 3
  choice_notes: []
  explanation: '騒音の A 測定平均値は、80 dB 以上の測定値の**算術平均**として求めます。幾何平均とする選択肢3は誤りです。


    有害物質の評価では幾何平均を使いますが、騒音では算術平均です。令和6年度第1回の一般でも、80 dB 未満の値を含めずに算術平均する、という正しい記述が出題されています。'
  figures: []
  law_note: null
  _key_choice: 騒音のA測定の平均の値は、得られた測定値のうち80 dB(A)以上の測定値の幾何平均として得られる。
