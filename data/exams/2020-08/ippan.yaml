  stem: 酸素欠乏症及び硫化水素中毒に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中の酸素濃度が 16 ％ 程度以下になると、頭痛、吐き気などの自覚症状が現れ、10 ％ 程度以下になると、意識喪失やけいれんが現れる。
  - 爆発、酸化等を防止するために酸素欠乏危険作業を行う場所の換気を行うことができない場合には、空気呼吸器、酸素呼吸器又は送気マスクを備え、労働者に使用させる。
  - 石炭、硫化鉱又は鋼材を入れてある貯蔵施設の内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  - 雨水又は河川の流水が滞留しており、又は滞留したことのある暗きょの内部での作業では、酸素欠乏症の危険がある。
  - 海水が滞留している暗きょの内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  answer: 3
  choice_notes: []
  explanation: '石炭、硫化鉱、鋼材を入れてある貯蔵施設の内部は、これらが酸化して酸素を消費するため、酸素欠乏症の危険がある場所ですが、硫化水素中毒の危険はありません（第1種酸素欠乏危険作業）。選択肢3は誤りです。


    硫化水素の危険まであるのは、海水が滞留している暗きょや、汚水・腐泥などがある場所です（選択肢5）。'
  figures: []
  law_note: null
  _key_choice: 石炭、硫化鉱又は鋼材を入れてある貯蔵施設の内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
