  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化ビニルによる中毒では、レイノー現象、指端骨溶解や肝血管肉腫などがみられる。
  - クロム酸は、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって鼻中隔穿孔や肺がんなどを生じる。
  - 窒素は、無色、無臭の気体であるが、高気圧下においては麻酔作用などが現れる。
  - カドミウム中毒では、上気道炎、肺炎、腎機能障害などがみられる。
  - 二硫化炭素による中毒では、メトヘモグロビン形成によるチアノーゼがみられる。
  answer: 5
  choice_notes: []
  explanation: メトヘモグロビンを形成してチアノーゼを起こすのは、アニリンやニトロベンゼンなどの芳香族アミノ化合物・ニトロ化合物です。二硫化炭素の中毒では、急性の精神障害や、慢性の動脈硬化・網膜の微細動脈瘤などがみられるので、選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 二硫化炭素による中毒では、メトヘモグロビン形成によるチアノーゼがみられる。
