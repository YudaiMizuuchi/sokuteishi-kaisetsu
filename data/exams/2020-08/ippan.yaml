  stem: 局所振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動工具の取扱いにおける「日振動ばく露量」は、周波数補正振動加速度実効値の3軸合成値と振動ばく露時間から算出される。
  - 日振動ばく露量が、日振動ばく露限界値(5.0 m/s²)を超えないように、ばく露時間の抑制、低振動の振動工具の選定等を行う。
  - 振動障害は、振動の周波数が高いほど起こりやすい。
  - 喫煙は、レイノー現象発現の増悪因子である。
  - 振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬季に行うとよい。
  answer: 3
  choice_notes: []
  explanation: '局所振動障害は、周波数が高いほど起こりやすいわけではありません。手腕への影響が大きいのは比較的低い周波数（10 Hz 前後〜数百 Hz）で、1,000 Hz を超えるとほとんど影響しないとされています。選択肢3は誤りです。


    令和2年度第2回・令和8年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 振動障害は、振動の周波数が高いほど起こりやすい。
