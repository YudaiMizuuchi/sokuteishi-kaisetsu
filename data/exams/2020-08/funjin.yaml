  stem: 王水添加りん酸法による遊離けい酸分析に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 約 200 mg の分析対象試料を精秤し、りん酸 15 mL を加えて試料をよく分散させた後、王水5 mL を加えて加熱する。
  - 王水は硝酸3に対し塩酸1を加え用時調製する。
  - 加熱開始から6分経過後より1分ごとに振とうし、所定時間加熱した後、電熱器から降ろし、約40秒間振とうする。
  - 加熱終了後、室温まで冷却し、60 ～ 70 ℃ の温湯を 50 mL 加えてよく振とうし、その後希ホウフッ化水素酸 10 mL を加え、1時間以上静置する。
  - 最適加熱時間は、石英のりん酸残渣率が 95 ％ 以上、かつ、微斜長石のりん酸残渣率が 1 ％ 以下になる加熱時間である。
