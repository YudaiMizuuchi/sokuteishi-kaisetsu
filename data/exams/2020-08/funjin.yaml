  - 直示天秤の感度は、荷重の大きさにはほとんど影響を受けず、零点の変位も少ない。
  - 振動が測定精度に及ぼす影響は、直示天秤より電子天秤の方が小さい。
  - 温度が測定精度に及ぼす影響は、直示天秤より電子天秤の方が大きい。
  - 零位（電磁力平衡）方式は、荷重の変化による可動部の微小変位を差動トランス等により検出し、変位がゼロになるよう、磁力により外力を加えて平衡をとる方式である。
  - 試料の温度が天秤の秤量室内の温度よりも高い場合の秤量値は、真の値よりも小さくなる。
  answer: 1
  choice_notes: []
  explanation: '**直示天びん**の感度は、荷重の大きさによって**変化します**（電子天びんでは、荷重の影響が小さい）。「荷重の大きさにはほとんど影響を受けず、零点の変位も少ない」とする選択肢1は誤りです。


