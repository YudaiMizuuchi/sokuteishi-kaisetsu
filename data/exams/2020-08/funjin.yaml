  columns: null
  choices:
  - 浮遊粉じんの採取には、多段平行板式、慣性衝突式などの分粒装置を付けたろ過捕集装置が用いられる。
  - 浮遊粉じんの採取の際の採取量の目安を得るためには、あらかじめ圧力計の指示値と粉じんの採取量との関係を求めておくとよい。
