  stem: '空気中に浮遊している粒子は、粒子の大きさや密度、空気の密度や粘性係数などに応じて、一定の速度で沈降するようになる。このときの速度を終末速度（Vs：cm/s）という。微小粒子の終末速度はストークスの式で表されるが、終末速度から粒子の大きさを表す式として適当なものは次のうちどれか。ただし、


    ρ ：粒子の密度（g/cm³）


    ρ₀：空気の密度（g/cm³）


    g ：重力加速度（cm/s²）


    η ：空気の粘性係数（g/cm・s）


    dp ：粒子の直径（cm）とする。'
  choices:
  - $d_p=\sqrt{\dfrac{Vs\cdot 9\eta}{(\rho_0-\rho)\cdot g}}$
  - $d_p=\dfrac{Vs\cdot 9\eta}{(\rho-\rho_0)\cdot g}$
  - $d_p=\sqrt{\dfrac{Vs\cdot 18\eta}{(\rho_0-\rho)\cdot g}}$
  - $d_p=\dfrac{Vs\cdot 18\eta}{(\rho-\rho_0)\cdot g}$
  - $d_p=\sqrt{\dfrac{Vs\cdot 18\eta}{(\rho-\rho_0)\cdot g}}$
  answer: 5
  choice_notes: []
  explanation: 'ストークスの式は、終末速度 Vs ＝（ρ − ρ₀）× g × dp² ／（18 η）です。これを、粒子の直径 dp について解きます。


    dp² ＝ 18 η × Vs ／（（ρ − ρ₀）× g）


    dp ＝ √（Vs × 18 η ／（（ρ − ρ₀）× g））


    よって（5）です。同じ問題は、令和5年度第1回にも出題されています（出題実績）。'
