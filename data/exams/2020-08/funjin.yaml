  explanation: '慣性衝突式分粒装置は、**吸入性**粉じんを分離・捕集するために使い、定められた流量で捕集したとき、**空気力学相当径4 µm**の粒子の50％が衝突板に捕集されます。吸引流量が低下すると、ノズルを出る空気の流速が遅くなり、慣性が小さくなって、50％分粒粒径は**大きく**なります。よって（3）です。


