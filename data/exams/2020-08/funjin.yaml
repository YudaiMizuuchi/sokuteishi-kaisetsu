  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 粒径が1 µm より大きな粒子は、繊維層フィルターの繊維と繊維の隙間にはさまって捕集される。
  - 粒径が 0.1 µm より小さな粒子では、主として拡散作用によってろ過材に捕集され、粒径が小さいほど捕集率は上昇する。
  - 繊維層フィルターの粉じん捕集率は、粒径 0.1 ～ 0.3 µm 付近で最も低くなる。
  - メンブランフィルターは、繊維層フィルターに比べ空間率の低い多孔質フィルターである。
  - 平均孔径 0.8 µm のメンブランフィルターは、0.3 µm の粒径の粉じん粒子を 95 ％ 以上捕集する。
  answer: 1
