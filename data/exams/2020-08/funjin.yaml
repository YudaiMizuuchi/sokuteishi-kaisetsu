  stem: 石綿粉じんの捕集及び分析に用いるセルローズエステルメンブランフィルターに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - フィルターのごく表面に粒子が捕集されるため、光学顕微鏡で計数するのに都合が良い。
  - フィルターの孔径は、走査電子顕微鏡法によって実測した値である。
  - グラスファイバーフィルターに比べて、圧力損失が大きい。
  - フィルターの透明化には、アセトン蒸気が用いられる。
  - フィルターには、格子（グリッド）が印刷されているものがあるが、細い繊維が格子の線に重なると見えにくいという欠点がある。
  answer: 2
  choice_notes: []
  explanation: 'セルローズエステルメンブランフィルターの**孔径**は、走査電子顕微鏡法で実測した値ではなく、**バブルポイントテスト法**などで求められる公称（平均）孔径です。「走査電子顕微鏡法によって実測した値である」とする選択肢2は誤りです。


    フィルターのごく表面に粒子が捕集されるため、光学顕微鏡で計数するのに都合がよいです。グラスファイバーフィルターに比べて、圧力損失が大きいです。フィルターの透明化には、アセトン蒸気を使います。格子（グリッド）が印刷されたものは、細い繊維が格子の線に重なると見えにくいという欠点があります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
