  stem: 粉じん作業場において、有効直径 20 mm のフィルターに 1.26 mg の 粉 じ んを捕集した。このフィルター中のクリストバライトをX線回折基底標準吸収補正法により定量操作を行ったところ、クリストバライトの主回折線強度は 150 cps であった。粉じん中のクリストバライト含有率（％）として、正しいものはどれか。ただし、X線吸収補正係数は 1.10、クリストバライトの回折線強度は1 mg/cm² のとき 4000 cps とする。
  columns: null
  choices:
  - 4.7 ％
  - 7.5 ％
  - 10.3 ％
  - 13.1 ％
  - 15.0 ％
  answer: 3
  choice_notes: []
  explanation: '次の順で計算します。


    1. フィルターの有効面積：直径20 mm（半径1 cm）なので、π × 1² ＝ 3.14 cm²

    2. 吸収補正をしたクリストバライトの回折線強度：150 cps × 1.10 ＝ 165 cps

    3. クリストバライトが1 mg/cm²のとき4000 cpsなので、165 ÷ 4000 ＝ 0.04125 mg/cm²

    4. クリストバライトの量：0.04125 × 3.14 ≒ 0.1296 mg

    5. 含有率：0.1296 ÷ 1.26 ≒ 0.103 ＝ **10.3％**


    よって（3）です。'
  figures: []
