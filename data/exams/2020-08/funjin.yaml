  stem: 光散乱方式の相対濃度計の特性等に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 散乱光の強さは、光学系と粒子の系が一定であれば粉じんの濃度に比例する。
  - 感度調整は、光源からの光が通る部分に標準散乱板を挿入して行う。
  - 計数値は、空気吸引流量の変化に影響されない。
  - 0.1 µm よりも小さい粒子と数 µm の粒子では、個々の粒子の散乱光の強度は、数 µm の粒子の方が大きい。
  - 数 µm の粒径の粒子による散乱光強度は、全方向においてほぼ一定である。
