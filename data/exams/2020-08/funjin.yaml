  - 1回の捕集で十分な質量が得られなかった場合は、小型インピンジャー内の残った試料を再度発じんさせて、サンプリングを行う。
  - 厚さの薄いフィルターを用いる場合は、採取量が多くなると変形することがあるので、フィルターを2枚重ねにして用いるとよい。
  - 帯電性の高い粉じんの場合は、装置の内壁に帯電防止剤をスプレーしてから行うとよい。
