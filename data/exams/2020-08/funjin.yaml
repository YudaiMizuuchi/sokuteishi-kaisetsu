  stem: 相対濃度計を用いて鉱物性粉じんの濃度測定を行った場合の併行測定及び質量濃度変換係数に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 光散乱方式の相対濃度計では、同じ粉じんで、粒径が 0.5 µm 程度より大きいと、粒径が大きくなるほど質量濃度変換係数は大きくなる。
  - 光散乱方式の相対濃度計では、粒度分布が同じであっても、石英粉じんと酸化鉄粉じんの質量濃度変換係数は同じになるとは限らない。
  - 併行測定で得られた粉じん濃度が 1.50 mg/m³ で圧電天秤方式の粉じん計の5回の平均濃度が 1.20 mg/m³ の場合の質量濃度変換係数は、1.25である。
  - 併行測定は、粉じんの発生状況や気流の影響等を考慮して、A測定を実施した測定点のうちのいずれか一点で行わなければならない。
  - 光散乱方式の相対濃度では、研磨作業場での質量濃度変換係数は、発生源の近くでは大きく、発生源から離れると小さくなる傾向がある。
