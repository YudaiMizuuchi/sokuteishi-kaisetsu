  stem: リフラクトリーセラミックファイバーに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - リフラクトリーセラミックファイバーは、アルミナ（Al₂O₃）とシリカ（SiO₂）を主成分とする非晶質の人造鉱物繊維である。
  - リフラクトリーセラミックファイバーは、1000 ℃ 以上の高温域で耐火材や断熱材として使用されている。
  - リフラクトリーセラミックファイバーの管理濃度は、5 µm 以上の繊維として 0.15 本/cm³ である。
  - リフラクトリーセラミックファイバーの捕集・分析方法の基本は、石綿の捕集・分析方法と同じである。
  - 位相差顕微鏡を用いる計数分析法では、リフラクトリーセラミックファイバーのみを区別して計数することはできない。
  answer: 3
  choice_notes: []
  explanation: 'リフラクトリーセラミックファイバー（RCF）の管理濃度は、**5 µm以上の繊維として0.3 本/cm³**です（石綿の管理濃度は0.15本/cm³）。「0.15本/cm³」とする選択肢3は誤りです。


    RCFは、アルミナ（Al₂O₃）とシリカ（SiO₂）を主成分とする非晶質の人造鉱物繊維で、1000℃以上の高温域で、耐火材・断熱材として使われます。捕集・分析方法の基本は、石綿と同じです。位相差顕微鏡では、RCFのみを区別して計数することはできません。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
