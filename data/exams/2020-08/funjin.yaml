  stem: りん酸法により、石英含有率を求めるため、液相沈降法により 10 µm 以下に粒度調整した試料 200.00 mg を熱りん酸で処理し、りん酸残渣として 45.00 mg を得た。このりん酸残渣を白金るつぼに移し、フッ化水素酸で処理したところ、フッ化水素酸残渣 0.75 mg が得られた。石英含有率（％）の値に最も近いものは次のうちどれか。ただし、標準石英について求めたりん酸残渣率は 96.0 ％ であったものとする。
  columns: null
  choices:
  - '21.2'
  - '21.6'
  - '22.1'
  - '22.5'
  - '23.0'
  answer: 5
  choice_notes: []
  explanation: '次の順で計算します。


    1. りん酸残渣中の石英の量：45.00 − 0.75 ＝ 44.25 mg

    2. 標準石英のりん酸残渣率が96.0％なので、もとの石英の量は、44.25 ÷ 0.960 ≒ 46.09 mg

    3. 石英含有率 ＝ 46.09 ÷ 200.00 ≒ 0.2305 ＝ **23.0％**


    よって（5）です。'
