  stem: 遊離けい酸に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 遊離けい酸とは、けい素が酸素と3次元的に結合していて、他の元素とは化学的に結合していない状態の鉱物のことである。
  - 石英は、常圧下の 573 ℃ において可逆的に転移し、低温型をα石英、高温型をβ石英と呼ぶ。
  - 石英が長時間高温にさらされると、トリジマイトなどに変化する。
  - メノウ、フリント、カオリンは石英の微細結晶が集まった鉱物であり、遊離けい酸含有率の測定の対象となる。
  - 作業環境における粉じん中の遊離けい酸の大部分は石英である。
  answer: 4
  choice_notes: []
  explanation: '**カオリン**は、けい酸塩鉱物（Al₂O₃・2SiO₂・2H₂O）で、遊離けい酸含有率の**測定の対象になりません**。「メノウ、フリント、カオリンは、…測定の対象となる」とする選択肢4は誤りです（メノウやフリントは、石英の微細結晶の集まりで、対象になります）。同様の記述は、令和3年度第1回にも出題されています（出題実績）。


    遊離けい酸は、けい素が酸素と3次元的に結合していて、他の元素とは化学的に結合していない状態の鉱物です。石英は、573℃で、α石英とβ石英に可逆的に転移し、長時間高温にさらされると、トリジマイトなどに変化します。粉じん中の遊離けい酸の大部分は、石英です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
