  - 空気中に浮遊する粒子を捕集して、それぞれの大きさを計測し、平均粒子径を求める場合、個数基準平均径の方が質量基準平均径より小さくなる。
  - ブラウン運動による粒子の平均移動距離は、拡散係数の平方根に比例する。
  - 微小粒子の重力による自然沈降の終末速度は、粒径が2倍になれば4倍になる。
