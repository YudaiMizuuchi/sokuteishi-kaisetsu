  - 吸収補正を行うことにより、定量範囲は広くなり、マトリックスの吸収の影響を少なくすることができる。
  - 検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度をとり、横軸に石英量をとって作成する。
  - 金属基底標準板には、石英の測定回折線より低角度側でそれに近い回折線を持つ材質を選ぶ。
  - 試料の採取にフッ素樹脂加工グラスファイバーろ紙を用いた場合には、ろ紙に固有の測定回折線を用いることができる。
