    この方法は、試料の後ろに置いた基底標準物質のX線回折強度の変化量から、試料のX線吸収量を補正します。吸収補正で、定量範囲は広くなり、マトリックスの吸収の影響が少なくなります。検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度、横軸に石英量をとって作成します。


