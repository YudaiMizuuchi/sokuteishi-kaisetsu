  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 粒径が1 µm より大きな粒子は、繊維層フィルターの繊維と繊維の隙間にはさまって捕集される。
  - 粒径が 0.1 µm より小さな粒子では、主として拡散作用によってろ過材に捕集され、粒径が小さいほど捕集率は上昇する。
  - 繊維層フィルターの粉じん捕集率は、粒径 0.1 ～ 0.3 µm 付近で最も低くなる。
  - メンブランフィルターは、繊維層フィルターに比べ空間率の低い多孔質フィルターである。
  - 平均孔径 0.8 µm のメンブランフィルターは、0.3 µm の粒径の粉じん粒子を 95 ％ 以上捕集する。
  answer: 1
  choice_notes: []
  explanation: '繊維層フィルターでは、粒径が1 µmより大きい粒子は、**慣性効果、重力効果、さえぎり効果**で捕集されます。「繊維と繊維の隙間にはさまって捕集される」とする選択肢1は、捕集の機構の説明として誤りです。同じ記述は、令和5年度第1回にも出題されています（出題実績）。


    粒径が0.1 µmより小さい粒子は、拡散作用で捕集され、粒径が小さいほど、捕集率は上昇します。繊維層フィルターの捕集率は、粒径0.1〜0.3 µm付近で最も低くなります。メンブランフィルターは、空間率の低い多孔質フィルターで、平均孔径0.8 µmのものは、0.3 µmの粒子を95％以上捕集します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
