  stem: 媒質中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 遠心力場の加速度は、角速度が同じであれば、回転半径に反比例する。
  - 空気中でブラウン運動する粒子の個数濃度が半減する時間は、濃度が1/10になれば約10倍となる。
  - 空気中に浮遊する粒子を捕集して、それぞれの大きさを計測し、平均粒子径を求める場合、個数基準平均径の方が質量基準平均径より小さくなる。
  - ブラウン運動による粒子の平均移動距離は、拡散係数の平方根に比例する。
  - 微小粒子の重力による自然沈降の終末速度は、粒径が2倍になれば4倍になる。
  answer: 1
  choice_notes: []
  explanation: '遠心力場における粒子の加速度は、回転半径 r と角速度 ω で、rω² と表されます。角速度が同じなら、加速度は、回転半径に**比例**します。「反比例する」とする選択肢1は誤りです。


    ブラウン運動によって、粒子の個数濃度が半減する時間は、濃度が1/10になれば、約10倍になります（初期濃度に反比例します）。個数基準平均径は、質量基準平均径より小さくなります。ブラウン運動による粒子の平均移動距離は、拡散係数の平方根に比例します。微小粒子の終末速度は、粒径の2乗に比例するので、粒径が2倍になれば、4倍になります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
