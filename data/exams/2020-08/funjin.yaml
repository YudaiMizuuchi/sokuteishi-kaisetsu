  stem: 鉱物性粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - フロート型面積式流量計は、浮子とテーパー管との間隙の面積と、そこを流れる試料空気の体積流量が比例することを利用した流量計である。
  - ハイボリウムエアサンプラーに表示される流量の校正は、ルーツメーターを用いることができる。
  - オリフィス流量計は、管内のオリフィス板の上流側と下流側との間に生じる圧力差が流量と一定の関係を示すことを利用した流量計である。
  - メンブランフィルターを用いたサンプリングでは、捕集装置の圧力損失が大きくなるので、捕集器具と吸引ポンプの間に接続された面積式流量計の指示値は、真の流量よりも小さくなる。
  - 流量計の指示値が脈動して読み取りにくい場合には、流量計と吸引ポンプの間にコンデンサー（空気だめ）を設けるとよい。
  answer: 4
  choice_notes: []
  explanation: 'メンブランフィルターを使うサンプリングでは、捕集装置の圧力損失が大きくなり、捕集器具と吸引ポンプの間に接続した面積式流量計の指示値は、真の流量より**大きく**なります（空気の密度が小さくなるためです）。「真の流量よりも小さくなる」とする選択肢4は誤りです。同じ趣旨の記述は、令和5年度第1回の問題にも、正しいものとして出題されています（出題実績）。


    フロート型面積式流量計は、浮子とテーパー管の間隙の面積と、体積流量が比例することを利用します。ハイボリウムエアサンプラーの流量は、ルーツメーターで校正できます。オリフィス流量計は、オリフィス板の上流側と下流側の圧力差を利用します。指示値が脈動するときは、流量計と吸引ポンプの間に空気だめを設けます。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
