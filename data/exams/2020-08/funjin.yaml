  stem: 遊離けい酸に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 遊離けい酸とは、けい素が酸素と3次元的に結合していて、他の元素とは化学的に結合していない状態の鉱物のことである。
  - 石英は、常圧下の 573 ℃ において可逆的に転移し、低温型をα石英、高温型をβ石英と呼ぶ。
  - 石英が長時間高温にさらされると、トリジマイトなどに変化する。
  - メノウ、フリント、カオリンは石英の微細結晶が集まった鉱物であり、遊離けい酸含有率の測定の対象となる。
  - 作業環境における粉じん中の遊離けい酸の大部分は石英である。
