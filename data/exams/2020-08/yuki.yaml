  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集びんによる試料空気の採取には、内容積が 1 L 以上のガラス製の捕集びんが用いられるが、その内面は測定対象物質に対して不活性でなければならない。
  - 真空捕集びんに試料空気を採取する際の空気吸引流量は一定でない。
  - 活性炭管に試料空気を捕集する際は、前もって活性炭管を接続した状態で電動ポンプの流量を、石けん膜流量計で校正する。
  - 小型バブラーに試料空気を捕集する際は、吸引する電動ポンプの流量を石けん膜流量計で校正する。
  - ミゼットインピンジャーに粒径 3 ～ 5 mm のグラスビーズを入れておくと、ガス状物質の捕集率が高まるのは、試料空気と液体の接触面積が小さくなるからである。
  answer: 5
