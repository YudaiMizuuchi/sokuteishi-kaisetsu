  stem: 混合有機溶剤について検知管法の使用が認められている場合において、トルエン、酢酸エチル、1,1,1-トリクロロエタン及びキシレンを含有する混合溶剤を使用している単位作業場所内の併行測定点におけるトルエン用検知管の測定値は、1.5 ppm であった。一方、ガスクロマトグラフで分析した測定値は、トルエン 1.0 ppm 、 酢酸エチル 8.0 ppm 、1,1,1-トリクロロエタン 10 ppm 及びキシレン 1.0 ppm であった。換算値変換係数として、正しい値に最も近いものは次のうちどれか。なお、トルエン、酢酸エチル、1,1,1-トリクロロエタン及びキシレンの管理濃度は、それぞれ 20 ppm 、200 ppm 、200 ppm 及び 50 ppm である。
  columns: null
  choices:
  - 0.054 ppm⁻¹
  - 0.107 ppm⁻¹
  - 0.214 ppm⁻¹
  - 0.428 ppm⁻¹
  - 0.767 ppm⁻¹
  answer: 2
  choice_notes: []
  explanation: "換算値変換係数は、併行測定で、**換算値を検知管の指示値で割って**求めます。\n\n1. 換算値（作業環境評価基準第2条第4項）＝ Σ（各成分の濃度／その管理濃度）\n ＝ 1.0／20 ＋ 8.0／200 ＋ 10／200 ＋ 1.0／50 ＝ 0.05 ＋ 0.04 ＋ 0.05 ＋ 0.02 ＝ 0.16\n2. 換算値変換係数 ＝ 0.16 ÷ 1.5 ppm ≒ 0.107 ppm⁻¹\n\nよって（2）です。\n\n（参考：『デザイン・サンプリングの実務（C・D測定編）』）"
