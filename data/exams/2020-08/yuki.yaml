  stem: 有機溶剤の標準液の調製に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 冷蔵保管した有機溶剤や標準原液は、室温に戻してから使用する。
  - 一度正確に調製した標準液中の標準物質の濃度は、時間経過や保管によって変化しない。
  - 調製方法の異なる標準液などについて、クロスチェックすることは、測定結果の信頼性を高める。
  - 標準液に使用する溶質、溶媒は共に蒸気圧が高い場合が多いことから、できる限り短時間で操作する。
  - 標準液を調製する際は、ドラフト等の局所排気装置を使用する。
