  stem: 固体捕集法に用いられる捕集剤に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集剤を2層に分けて充塡された捕集管では、後層から検出された対象物質の量が、前層からの検出量の 10 ％ を超えた場合、両充塡層からの検出量の和を用いて濃度計算する。
  - シリカゲルは、水分含有率によって、測定対象物質の吸着容量が異なる。
  - 活性炭は、窒素又は乾燥空気の加熱気流中で脱水したものを使用する。
  - ポーラスポリマービーズ（多孔性プラスチック）は反応性が低く、捕集した試料の重合、酸化などが起こりにくい。
  - ポーラスポリマー捕集管に捕集した試料は、活性炭に比べて、加熱脱着が容易である。
