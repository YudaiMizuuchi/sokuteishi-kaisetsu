  explanation: '電子捕獲検出器（ECD）は、ハロゲンを含む化合物（電子親和力の強い物質）の分析に**適しています**。「適していない」とする選択肢1は誤りです。


    質量分析器は、イオン化されにくい化合物の分析には適していません。光イオン化検出器は、紫外線でイオン化する化合物に適しています。炎光光度検出器は、リンや硫黄を含む化合物に、アルカリ熱イオン化検出器は、窒素やリンを含む化合物に適しています。


