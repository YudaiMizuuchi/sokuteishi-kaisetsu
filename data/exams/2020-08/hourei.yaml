  - 空気中の二硫化炭素の濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中の鉛の濃度 ／ 1年以内ごとに1回 ／ 3年
  - 外部放射線の線量当量率又は線量当量 ／ 1か月以内ごとに1回 ／ 30年
