  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、指定作業場の作業環境測定において、簡易測定機器以外の機器を用いて行う分析を、第2種作業環境測定士に行わせることができる。
  - 作業環境測定機関等への委託によらず、指定作業場の作業環境測定を行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる。
  - 法令で義務付けられている作業環境測定のうち、騒音についての測定は、作業環境測定士ではない者に行わせることができる。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士ではない者に行わせることができる。
  answer: 1
  choice_notes: []
  explanation: '第2種作業環境測定士は、簡易測定機器以外の機器を用いて行う分析の業務を行うことができません。それを第2種測定士に行わせることができるとする選択肢1は誤りです。


    第2種測定士の業務は、デザイン・サンプリングと、検知管や相対濃度計などの簡易測定機器による分析です。'
