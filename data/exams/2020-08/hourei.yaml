  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める業種に属する事業場においては、新たに職務につくこととなった職長に対し、原則として、法定の事項について安全又は衛生のための教育を行わなければならない。
  - ガンマ線照射装置を用いて行う透過写真の撮影の業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別教育を省略することができる。
  - 有機溶剤業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 労働者の作業内容を変更したときは、当該労働者に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  answer: 4
  choice_notes: []
  explanation: '有機溶剤業務は、特別教育の対象業務ではありません。有機溶剤業務は、有機溶剤作業主任者を選任して管理するので、選択肢4は誤りです。


    ガンマ線照射装置による透過写真の撮影は、特別教育の対象です（選択肢2）。'
  figures: []
