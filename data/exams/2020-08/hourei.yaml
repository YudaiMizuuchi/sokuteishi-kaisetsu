  stem: 作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多量のドライアイスを取り扱う業務を行う著しく寒冷な屋内作業場については、半月以内ごとに1回、定期に、気温及び湿度を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 著しい騒音を発する屋内作業場については、3か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務（設備の解体等に伴うものを除く。）を行う作業場については、6か月以内ごとに1回、定期に、その作業場における空気中のダイオキシン類の濃度を測定しなければならない。
  answer: 4
  choice_notes: []
  explanation: 著しい騒音を発する屋内作業場の等価騒音レベルの測定は、**6か月以内ごとに1回**です。3か月以内ごととする選択肢4は誤りです。
