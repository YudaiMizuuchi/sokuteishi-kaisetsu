  stem: 労働衛生管理体制に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 常時300人以上の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
  - 常時1,000人以上の労働者を使用する事業場においては、その業種に関係なく、事業場に専属の産業医を選任しなければならない。
  - 総括安全衛生管理者が旅行、疾病、事故その他やむを得ない事由によって職務を行うことができないときは、代理者を選任しなければならない。
  - 常時1,000人を超える労働者を使用する事業場においては、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 作業環境測定を作業環境測定機関等への委託によらず自ら行っている事業場の労働者で、作業環境測定を実施している作業環境測定士であるものを衛生委員会の委員として指名することができる。
  answer: 1
  choice_notes: []
  explanation: '総括安全衛生管理者を選任しなければならない事業場の規模は、業種によって違います。林業・鉱業・建設業などは常時100人以上、製造業などは常時300人以上、それ以外の業種は常時1,000人以上です。「業種に関係なく300人以上」とする選択肢1は誤りです。


    業種に関係なく選任が必要になるのは、常時1,000人以上の事業場です。'
  figures: []
  law_note: null
  _key_choice: 常時300人以上の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
- num: 2
