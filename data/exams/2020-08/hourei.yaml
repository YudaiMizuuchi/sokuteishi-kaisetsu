  explanation: '管理区域の外部放射線による線量当量率または線量当量の測定は1か月以内ごとに1回で、記録は**5年間**保存します。30年とする選択肢4は誤りです。


    空気中の放射性物質の濃度の測定も、1か月以内ごと・5年保存です。ナフタレンは特別管理物質で30年、二硫化炭素とシアン化水素は3年、鉛は1年以内ごと・3年です。'
