  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音の測定点は、原則として、単位作業場所の床面上に 6 m 以下の等間隔で引いた縦の線と横の線との交点の床上 120 cm 以上 150 cm 以下の位置としなければならない。
  - 鉱物性粉じんに係る単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、相対濃度指示方法のみによる測定が認められている。
  - ろ過捕集方法に用いるろ過材は、0.3 µm の粒子を 95 ％ 以上捕集する性能を有するものに限られる。
  - 第1種酸素欠乏危険作業に係る作業場の酸素濃度測定における測定点は、作業場における酸素の濃度の分布の状況を知るために適当な位置に、5以上としなければならない。
  - 有機溶剤に関わる A 測定は、作業が定常的に行われている時間に行わなければならない。
  answer: 2
  choice_notes: []
  explanation: '鉱物性粉じんの濃度の測定で、単位作業場所が著しく狭く濃度がほぼ均一であれば相対濃度指示方法のみによる測定が認められる、という定めはありません。選択肢2は誤りです。


    令和2年度第2回にも、まったく同じ選択肢があります。


    根拠：作業環境測定基準第2条第1項第4号ロ。'
  figures: []
