  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 深夜業を含む業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、法令で定める健康診断を行わなければならないが、胸部エックス線検査については、1年以内ごとに1回、定期に行えばよい。
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に提出する必要はない。
  - 定期健康診断を受けた労働者に対し、異常の所見がない者を除き、遅滞なく、健康診断結果の通知を行わなければならない。
  - 弗化水素ガスを発散する場所における業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。
  answer: 4
  choice_notes: []
  explanation: '定期健康診断を受けた労働者には、異常の所見の**有無にかかわらず**、遅滞なく結果を通知しなければなりません。「異常の所見がない者を除き」とする選択肢4は誤りです。


    令和6年度第1回でも、異常の所見の有無にかかわらず通知する、という正しい記述が出題されています。'
  figures: []
  law_note: null
  _key_choice: 定期健康診断を受けた労働者に対し、異常の所見がない者を除き、遅滞なく、健康診断結果の通知を行わなければならない。
