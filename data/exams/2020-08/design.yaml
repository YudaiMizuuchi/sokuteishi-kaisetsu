  stem: 作業環境測定における濃度等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石綿の管理濃度は、本/cm³ で表されている。
  - 空気中の有機溶剤の体積分率 0.1 ％ は、1,000 ppm に相当する。
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が低いほど小さな値となる。
  - 圧電天秤方式の相対濃度計の測定値は、mg/m³ で表示される。
  - 有機溶剤の管理濃度は、体積分率（ppm）で表されている。
  answer: 3
  choice_notes: []
  explanation: '鉱物性粉じんの管理濃度は、E ＝ 3.0 ÷ (1.19Q ＋ 1)（Q は遊離けい酸の含有率 ％）で求めます。遊離けい酸の含有率が**高い**ほど管理濃度は小さく、低いほど大きくなるので、「含有率が低いほど小さな値となる」とする選択肢3は誤りです。


    遊離けい酸は肺を線維化させる作用が強いので、多く含む粉じんほど管理を厳しくします。'
