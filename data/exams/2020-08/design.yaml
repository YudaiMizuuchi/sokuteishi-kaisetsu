    0.1 µm 以下の小さな粒子では散乱光が弱く、感度が低くなります（選択肢1）。


    光散乱方式の相対濃度計には、側方散乱光を測る方式や前方散乱光を測る方式があります。数 µm の粒子では、散乱光の強さが方向によって大きく変わるため、決まった方向の散乱光を測る仕組みになっています（参考：『作業環境測定のためのデザイン・サンプリングの実務―A・B測定編―（上）』）。'
