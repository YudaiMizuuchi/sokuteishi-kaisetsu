  stem: 環境空気中の有害物質の捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 捕集装置を取り付けない状態で流量調整した吸引ポンプを用いて、有機溶剤を捕集した場合、測定される濃度は高くなる。
  - 多段平行板式分粒装置を用いて鉱物性粉じんの濃度を測定する場合、吸引流量が所定の値より小さいと、分粒装置を通過する粒子の 50 ％ 分粒粒径は小さくなる。
  - 慣性衝突式分粒装置を用いて鉱物性粉じんの濃度を測定する場合、吸引流量が所定の値より大きいと、分粒装置を通過する粒子の 50 ％ 分粒粒径は小さくなる。
  - ミゼットインピンジャーによる粒子の捕集では、粒径が小さいほど捕集率は低くなる。
  - 気体を液体捕集によって試料採取する場合、有機溶剤等の揮発性物質の捕集率は、一般に、捕集液の温度が低いほど高くなる。
  answer: 1
  choice_notes: []
  explanation: '捕集装置を付けない状態で流量を調整したポンプに捕集装置を付けると、捕集装置の圧力損失のために実際の流量は設定より**少なく**なります。実際に吸引した空気の量は設定値から計算した量より少ないのに、計算では多いものとして割るので、測定される濃度は**低く**なります。「高くなる」とする選択肢1は誤りです。


    流量の校正・調整は、捕集装置を取り付けた状態で行うのが原則です。'
