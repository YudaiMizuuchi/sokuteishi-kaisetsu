  stem: 騒音の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定の測定点は、原則として、単位作業場所の床面上に 6 m 以下の等間隔で引いた縦の線と横の線との交点の床上 120 cm 以上 150 cm 以下の位置とする。
  - A 測定の平均値の算定には、80 dB (A)未満の測定値は含めない。
  - A 測定のみを行った場合における管理区分の決定には、A 測定値の算術平均と標準偏差を用いる。
  - 音源に近接する場所において作業が行われる単位作業場所において、当該作業が行われる時間のうち、騒音レベルが最も大きくなると思われる時間に、当該作業が行われる位置において行う測定を B 測定という。
  - B 測定の値が 90 dB(A)以上のときは、A 測定の値にかかわらず、第Ⅲ管理区分に区分される。
  answer: 3
  choice_notes: []
  explanation: '騒音の管理区分の決定には、A 測定平均値（算術平均）と B 測定値を用い、標準偏差は用いません。「算術平均と標準偏差を用いる」とする選択肢3は誤りです。


