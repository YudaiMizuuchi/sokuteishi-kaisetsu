  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定は、単位作業場所の中で、有害物質の発散源に近接する場所において作業が行われる場合に、有害物質の濃度が最も高くなると考えられる作業位置とその時間に行う。
  - B 測定の目的は、局所的短時間の個人ばく露量の測定である。
  - 真空捕集びん5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて捕集したそれぞれの真空捕集びん内の有害物質の濃度の算術平均値を測定値とする。
  - 有害物質の発散源とともに労働者が移動しながら行う作業がある場合には、作業位置の移動に沿って測定を行う。
  - 相対濃度指示方法を用いて B 測定を行う場合の質量濃度変換係数は、その単位作業場所で行われた A 測定における併行測定の質量濃度変換係数を用いる。
  answer: 2
