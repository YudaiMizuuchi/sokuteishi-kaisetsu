  stem: 簡易測定機器による測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 光散乱方式の相対濃度計では、0.1 µm 以下の粒子に対する感度は低い。
  - 検知管の変色層が斜めに現れたときは、斜めに変色した部分の中央の値を読み取る。
  - 光散乱方式の相対濃度計では、全方向の散乱光の強度を測定している。
  - 圧電天秤方式の相対濃度計では、結晶素子上の粉じんの堆積物 1 µg 当たりの周波数の変化量は、約 180 Hz である。
  - 検知管の変色層の長さは、有害物質の濃度に必ずしも比例しない。
