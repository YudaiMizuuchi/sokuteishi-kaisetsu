  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定は、当該単位作業場所における気中有害物質の平均的な濃度とその変動を求めるための測定である。
  - 測定点と測定点の間隔は、6 m 以下の等間隔とし、かつ縦方向と横方向の間隔を同一にしなければならない。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね 1.2 以下であることが明らかであって、かつ、施設又は作業工程等の変更がない場合は、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  - 測定点の数を5未満とすることができる単位作業場所でも、各測定点で繰り返し測定を行うことによって、測定値の総数は5以上とする。
  answer: 2
  choice_notes: []
  explanation: null
  figures: []
  law_note: null
  _key_choice: 測定点と測定点の間隔は、6m以下の等間隔とし、かつ縦方向と横方向の間隔を同一にしなければならない。
