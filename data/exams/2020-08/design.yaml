  stem: 単位作業場所に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塗料の調合作業と、そこで調合された塗料を用いる塗装作業が併行して行われている区域を、一つの単位作業場所として設定することができる。
  - トルエンによる抽出作業とキシレンによる抽出作業が同一の場所で別々に行われている作業場を、トルエンとキシレンの混合溶剤を使用する作業場とみなして一つの単位作業場所として設定する。
  - 単位作業場所は、面積 30 m² 以下の作業場についても設定することができる。
  - 初めての測定で、有害物の濃度分布等が予測できなかったので、当該作業場で働く作業者の行動範囲を単位作業場所の範囲とした。
  - クロム酸鉛を取り扱っている作業場では、同一の区域をクロム酸と鉛とで、別々の単位作業場所として設定する。
  answer: 2
  choice_notes: []
  explanation: 'トルエンによる抽出作業とキシレンによる抽出作業が、同じ場所で別々に行われている場合は、混合溶剤を使う作業場とみなして1つの単位作業場所とすることはできません。それぞれの物質について単位作業場所を設定するので、選択肢2は誤りです。


    混合溶剤として扱えるのは、実際に混合物を使っている場合です。令和5年度第2回では、「一つの単位作業場所とすることはできない」という正しい記述として出題されています。'
