  stem: 吸光光度分析法による環境空気中のフッ化水素の分析に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集液として水酸化ナトリウム溶液を用いる。
  - 捕集器具としてミゼットインピンジャーを用いる。
  - 標準原液は、ポリエチレン製の容器に保存する。
  - ランタン-アリザリンコンプレクソン錯体は、フッ化物イオンと複合錯体を形成する。
  - 発色操作は pH 2で行う。
  answer: 5
  choice_notes: []
  explanation: 'フッ化水素の吸光光度分析法（ランタン-アリザリンコンプレクソン法）では、発色操作は、**pH5前後**（酢酸緩衝液で調整）で行います。「pH2で行う」とする選択肢5は誤りです。ランタン-アリザリンコンプレクソン錯体が、フッ化物イオンと、青色の複合錯体をつくります（620 nm付近で測定）。


    捕集は、水酸化ナトリウム溶液を入れたミゼットインピンジャーで行います。フッ化物イオンは、ガラスに吸着されたり、ガラスと反応したりするので、標準原液は、ポリエチレン製の容器に保存します。


    （参考：JIS K 0102（工場排水試験方法）34.1 ランタン-アリザリンコンプレキソン吸光光度法。溶液のpHを5前後に調整し、酢酸緩衝液を加えて発色させ、620 nm付近で測定します。）'
