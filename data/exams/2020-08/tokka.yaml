  stem: 吸光光度分析法に関する次の記述の㋑と㋺の［　］に入る語句の組合せとして、正しいものはどれか。「吸光度は、［㋑］に比例するが、［㋺］には比例しない。」
  columns:
  - ㋑
  - ㋺
  choices:
  - 発色試薬の濃度 ／ 入射光の強度
  - 入射光の強度 ／ セルの光路長
  - セルの光路長 ／ 溶質のモル吸光係数
  - 測定対象物質の分子量 ／ 発色試薬の濃度
  - 溶質のモル吸光係数 ／ 入射光の強度
  answer: 5
  choice_notes: []
  explanation: 'ランベルト・ベールの法則 A ＝ ε・c・l から、吸光度は、**溶質のモル吸光係数**（ε）、濃度（c）、**セルの光路長**（l）に比例します。**入射光の強度**には、依存しません（吸光度は、入射光と透過光の強度の比で決まります）。


    よって、「㋑ 溶質のモル吸光係数に比例するが、㋺ 入射光の強度には比例しない」の（5）です。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
