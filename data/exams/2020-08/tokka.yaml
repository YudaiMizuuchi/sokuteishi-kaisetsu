  stem: 環境空気（25 ℃、1気圧）中のシアン化水素濃度を液体捕集法-吸光光度分析法により測定した。ミゼットインピンジャーに捕集液 10 mL を入れ、シアン化水素を含む環境空気を、流量 0.50 L･min⁻¹ で15分間吸引し、シアン化水素を捕集した。捕集後の捕集液 10 mL のうちの 2 mL をとり、これに必要な試薬を加え、発色操作を行い 15.2 mL の最終試料液を調製した。この最終試料液中のシアン化物イオン（CN ⁻）の濃度を測定したところ、0.42 µg･mL⁻¹ であった。この環境空気中のシアン化水素濃度に最も近いものは、次のうちどれか。ただし、捕集率は 100 ％ とする。
  columns: null
  choices:
  - 1 ppm
  - 2 ppm
  - 3 ppm
  - 4 ppm
  - 5 ppm
  answer: 4
  choice_notes: []
  explanation: '次の順で計算します。


    1. 最終試料液15.2 mL中のシアン化物イオン：0.42 µg/mL × 15.2 mL ＝ 6.384 µg

    2. 捕集液10 mL全体の量（10 mLのうち2 mLを使ったので、5倍）：6.384 × 10／2 ＝ 31.92 µg

    3. 物質量：31.92 µg ÷ 26.02 g/mol（CN⁻）≒ 1.227 µmol

    4. 気体の体積（25℃、1気圧）：1.227 × 10⁻⁶ × 24.45 ≒ 3.0 × 10⁻⁵ L

    5. 吸引した空気の量：0.50 L/min × 15 min ＝ 7.5 L

    6. 濃度：3.0 × 10⁻⁵ ÷ 7.5 ＝ 4.0 × 10⁻⁶ ＝ **4.0 ppm**


    よって（4）です。'
  figures: []
