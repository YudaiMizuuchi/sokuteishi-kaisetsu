  stem: 環境空気（25 ℃、1気圧）中の p-ニトロクロルベンゼンの濃度を測定するため、2本のミゼットインピンジャーの各々に捕集液 10 mL を入れて直列に連結し、試料空気を流量 1.0 L･min⁻¹ で10分間捕集した。捕集後の捕集液は合わせてメスフラスコに入れ、さらに捕集液で 25 mL に定容したものを試料液とした。ガスクロマトグラフで分析した結果、試料液のピーク面積は 2,900であった。p-ニトロクロルベンゼン濃度が、0.50 µg･mL⁻¹ の標準液を試料液と同様に分析したところ、ピーク面積は 6,000 であった。環境空気中の p-ニトロクロルベンゼン濃度として、正しい値に最も近いものは次のうちどれか。ただし、p-ニトロクロルベンゼンのモル質量は 157.55 g･mol⁻¹ とする。
  columns: null
  choices:
  - 0.1 mg･m⁻³
  - 0.2 mg･m⁻³
  - 0.4 mg･m⁻³
  - 0.6 mg･m⁻³
  - 0.8 mg･m⁻³
  answer: 4
  choice_notes: []
  explanation: '次の順で計算します。


    1. 試料液の濃度：標準液（0.50 µg/mL）のピーク面積が6,000、試料液が2,900なので、0.50 × 2900／6000 ≒ 0.2417 µg/mL

    2. 試料液25 mL中の量：0.2417 × 25 ≒ 6.04 µg

    3. 吸引した空気の量：1.0 L/min × 10 min ＝ 10 L ＝ 0.010 m³（2本は直列なので、空気は同じ量が通ります）

    4. 濃度：6.04 µg ÷ 10 L ≒ 0.604 µg/L ＝ **0.6 mg/m³**


