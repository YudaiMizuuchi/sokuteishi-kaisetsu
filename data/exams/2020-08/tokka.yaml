  explanation: '真空捕集びんのコックのすり合わせ部には、**グリースを塗布しません**（グリースが試料ガスを吸着したり、汚染したりするためです）。「グリースを塗布して漏れをなくす」とする選択肢2は誤りです。同じ記述は、令和5年度第1回にも出題されています（出題実績）。


    真空捕集びんの内圧は、1.33 kPa以下にします。捕集袋は、清浄な乾燥空気または窒素で洗浄します。試料空気から水分を除くときは、ガラス管に無水硫酸カルシウム粒などを詰めて、試料採取口の前に接続します。電動ポンプで袋に送るときは、ポンプ内の吸着に注意します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
