  stem: ガスクロマトグラフ分析法の検出器に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 水素炎イオン化検出器は、水素炎中で燃焼しイオン化する物質のみを検出する。
  - 水素炎イオン化検出器は、ハロゲン化炭化水素に対して感度が高い。
  - 電子捕獲型検出器は、電子親和力の強い物質が高感度で検出される。
  - 電子捕獲型検出器の直線性を示す測定範囲は、水素炎イオン化検出器よりも狭い。
  - 炎光光度検出器は、リンや硫黄を含む化合物に選択性がある。
  answer: 2
  choice_notes: []
  explanation: '水素炎イオン化検出器（FID）は、ほとんどの有機化合物に感度がありますが、**ハロゲン化炭化水素に対しては、感度が低い**検出器です（ハロゲンに高感度なのは、電子捕獲型検出器（ECD）です）。「ハロゲン化炭化水素に対して感度が高い」とする選択肢2は誤りです。


    FIDは、水素炎中で燃焼してイオン化する物質のみを検出します。ECDは、電子親和力の強い物質を高感度で検出し、直線範囲は、FIDより狭いです。炎光光度検出器は、リンや硫黄を含む化合物に選択性があります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
