  choices:
  - 真空捕集びんは、内圧を、1.33 kPa 以下にしたものを使用する。
  - 真空捕集びんのコックのすり合わせ部には、グリースを塗布して漏れをなくす。
  - 捕集袋は、清浄な乾燥空気又は窒素を用いて洗浄する。
  - 試料空気から水分を取り除く場合には、ガラス管に無水硫酸カルシウム粒などの乾燥剤を詰めて、試料採取口の前に接続する。
