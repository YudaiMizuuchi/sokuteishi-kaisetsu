  stem: 環境空気（25 ℃、1気圧）中のシアン化水素濃度を液体捕集法-吸光光度分析法により測定した。ミゼットインピンジャーに捕集液 10 mL を入れ、シアン化水素を含む環境空気を、流量 0.50 L･min⁻¹ で15分間吸引し、シアン化水素を捕集した。捕集後の捕集液 10 mL のうちの 2 mL をとり、これに必要な試薬を加え、発色操作を行い 15.2 mL の最終試料液を調製した。この最終試料液中のシアン化物イオン（CN ⁻）の濃度を測定したところ、0.42 µg･mL⁻¹ であった。この環境空気中のシアン化水素濃度に最も近いものは、次のうちどれか。ただし、捕集率は 100 ％ とする。
  columns: null
