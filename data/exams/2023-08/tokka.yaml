  stem: 液体捕集法と吸光光度分析法を用いた p-ニトロクロロベンゼンの測定に関する次の記述の㋑から㋩までの［　］に入る語句の組合せとして、正しいものは下のうちどれか。「捕集液にエタノール水溶液を使用して p-ニトロクロロベンゼンを捕集して、亜鉛末と［㋑］を用いてニトロ基を還元する。亜硝酸ナトリウムを加え、更にスルファミン酸アンモニウムを加えて［㋺］基を［㋩］化した後、発色させて吸光度を測定する。」
  columns:
  - ㋑
  - ㋺
  - ㋩
  choices:
  - 塩酸 ／ アミド ／ アゾ
  - 塩酸 ／ アミノ ／ ニトロ
  - 塩酸 ／ アミノ ／ アゾ
  - 水酸化ナトリウム ／ アミド ／ アゾ
  - 水酸化ナトリウム ／ アミノ ／ ニトロ
  answer: 3
  choice_notes: []
  explanation: 'p-ニトロクロロベンゼンの液体捕集法―吸光光度分析法は、次の流れです。


    1. エタノール水溶液に捕集し、**亜鉛末と塩酸**で、ニトロ基（−NO₂）を**アミノ基（−NH₂）**に還元します。

    2. 亜硝酸ナトリウムを加えて、アミノ基を**ジアゾ化**します（ジアゾニウム塩になります）。

    3. 余った亜硝酸を、スルファミン酸アンモニウムで分解します。

    4. カップリング試薬を加えて、ジアゾニウム塩を**アゾ化**（アゾ色素）して発色させ、吸光度を測定します。


    よって（3）の「塩酸／アミノ／アゾ」です。'
  figures: []
  law_note: null
  _review: true
  minor_note: p-ニトロクロロベンゼンの吸光光度分析法の手順（亜鉛末と塩酸による還元、ジアゾ化、アゾ化）は、ガイドブック3で該当箇所を確認できておらず、化学反応の一般的な知識による説明です。根拠の確認は後回しにしています。
