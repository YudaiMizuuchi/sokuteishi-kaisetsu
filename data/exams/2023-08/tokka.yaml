  stem: ベンゼン 1.00 gを容量 1 Lの真空容器に密封し、常温（25℃）にした。このとき容器内に液体として存在するベンゼンの質量に最も近いものは、次のうちどれか。ただし、25℃でのベンゼンの飽和蒸気圧は12.6 kPa、モル質量は78.1 g･mol⁻¹とする。また、気体定数は 8.31 × 10³ Pa･L･mol⁻¹･K⁻¹とする。
  columns: null
  choices:
  - 0 g
  - 0.20 g
  - 0.40 g
  - 0.60 g
  - 0.80 g
  answer: 4
  choice_notes: []
  explanation: '次の順で、全量が蒸発したときの圧力と、飽和蒸気圧を比べます。


    1. ベンゼンの物質量：1.00 g ÷ 78.1 g/mol ≒ 0.0128 mol

    2. 全量が蒸気になったときの圧力：P ＝ nRT／V ＝ 0.0128 × 8.31 × 10³ × 298 ／ 1 ≒ 3.17 × 10⁴ Pa（約31.7 kPa）

    3. 飽和蒸気圧（12.6 kPa）より大きいので、一部は液体として残り、気体は飽和蒸気圧（12.6 kPa）になります。

    4. 気体のベンゼンの物質量：n ＝ PV／RT ＝ 12.6 × 10³ ×1／（8.31 × 10³ × 298）≒ 5.09 × 10⁻³ mol、質量は 5.09 × 10⁻³ × 78.1 ≒ 0.40 g

    5. 液体として残る質量：1.00 − 0.40 ＝ **0.60 g**


    よって（4）です。'
