  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 吸光度は、入射光の強度に依存しない。
  - 吸光度 0.3 では、入射光の 30 ％ が試料液に吸収される。
  - 発色のために加熱した場合は、常温に戻してから測定する。
  - 石英セルはガラスセルに比べて、紫外光の吸収が少ない。
  - 通常、分析には、吸収スペクトルの極大波長を用いる。
  answer: 2
  choice_notes: []
  explanation: '吸光度 A ＝ −log₁₀（透過率）です。吸光度0.3のとき、透過率は 10⁻⁰·³ ≒ 0.5（50％）で、入射光の約**50％**が試料液に吸収されます。「30％が吸収される」とする選択肢2は誤りです。


    吸光度は、入射光の強度に依存しません。発色のために加熱した場合は、常温に戻してから測定します。石英セルは、ガラスセルに比べて、紫外光の吸収が少ないです。通常、吸収スペクトルの極大波長を使います。


    （参考：『機器分析の実務』）'
