  stem: 次の化合物Ⓐについて、その構造式Ⓑが誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 1,1-ジメチルヒドラジン ／ 図の1
  - o-トリジン ／ 図の2
  - アクリルアミド ／ 図の3
  - クロロメチルメチルエーテル ／ 図の4
  - 酸化プロピレン ／ 図の5
  answer: 5
  choice_notes: []
  explanation: '各物質の構造式を、図と照らし合わせます。


    - 5 酸化プロピレン：プロピレン（CH₃−CH＝CH₂）の二重結合に酸素が付加した三員環（エポキシド）で、**CH₃−CH−CH₂（O）**の構造です。図の5は、環の炭素の1つに二重結合（C＝CH₂）がある構造で、酸化プロピレンの構造式としては**誤り**です。

    - 1 1,1-ジメチルヒドラジン（(CH₃)₂N−NH₂）、2 o-トリジン（ビフェニルの両端にNH₂、隣にCH₃）、3 アクリルアミド（CH₂＝CH−CO−NH₂）、4 クロロメチルメチルエーテル（CH₃−O−CH₂Cl）は、正しい組合せです。


    よって（5）です。'
  figures:
  - file: 2023-08-tokka-13-fig.png
    alt: Ⓐ（化合物名）とⒷ（構造式）の2列の表。1＝1,1-ジメチルヒドラジン、Ⓑは、中央のNに、左上・左下のH₃Cと、右のNH₂が結合。2＝o-トリジン、Ⓑは、2つのベンゼン環が単結合でつながり、左の環には左端にH₂N-、下にH₃C、右の環には上にCH₃、右端に-NH₂が結合。3＝アクリルアミド、Ⓑは、H₂C=CH-C-NH₂で、右側のCの上にOが二重結合で結合。4＝クロロメチルメチルエーテル、Ⓑは、CH₃-O-CH₂Cl。5＝酸化プロピレン、Ⓑは、H₂C-C=CH₂で、左のH₂Cと中央のCの下にOが結合した三員環
