  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 試料中の成分は、移動相と固定相との相互作用（親和性）の差によって分離される。
  - 移動相が固定相よりも極性が高い場合、逆相クロマトグラフ法という。
  - 逆相クロマトグラフ法では、カラム温度を上げると、カラム圧が高くなる。
