  stem: 作業環境空気（25 ℃、1気圧）中のフッ化水素の濃度を測定するため、捕集液 10 mL に 1.00 L･min⁻¹の流量で試料空気を10分間吸引した。その全量 10 mLについて定量操作を行い、その吸光度をブランクを対照として測定したところ0.350 であった。フッ化水素の濃度が、1.15 × 10⁻⁸mol･mL⁻¹の標準溶液 10 mLについても同様の操作を行って測定した吸光度は 0.450 であった。フッ化水素の作業環境空気中濃度（体積分率）として、正しい値に最も近いものは次のうちどれか。ただし、捕集率は 100％とする。
  columns: null
  choices:
  - 0.022 ppm
  - 0.032 ppm
  - 0.22 ppm
  - 0.32 ppm
  - 2.2 ppm
  answer: 3
  choice_notes: []
  explanation: '次の順で計算します。


    1. 標準溶液10 mL中のフッ化水素の量：1.15 × 10⁻⁸ mol/mL × 10 mL ＝ 1.15 × 10⁻⁷ mol（吸光度0.450）

    2. 試料液中のフッ化水素の量：1.15 × 10⁻⁷ × 0.350／0.450 ≒ 8.94 × 10⁻⁸ mol

    3. 吸引した空気の量：1.00 L/min × 10 min ＝ 10 L

    4. フッ化水素の気体の体積（25℃、1気圧のモル体積24.45 L/mol）：8.94 × 10⁻⁸ × 24.45 ≒ 2.19 × 10⁻⁶ L

    5. 体積分率：2.19 × 10⁻⁶ L ÷ 10 L ≒ 2.2 × 10⁻⁷ ＝ **0.22 ppm**


    よって（3）です。'
