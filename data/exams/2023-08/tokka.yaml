  stem: 直接捕集法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集瓶の内面は、測定対象物質に対して不活性でなければならない。
  - 真空捕集瓶のコックのすり合わせ部には、グリースを塗布して漏れをなくす。
  - 捕集袋は、清浄な乾燥空気又は窒素を用いて洗浄する。
  - 試料空気から水分を取り除く場合には、ガラス管に無水硫酸カルシウムなどの乾燥剤を詰めて、試料採取口の前に接続する。
  - 電動ポンプを通して、捕集袋内に試料空気を送り採取する方法の場合、ポンプ内の吸着に注意する必要がある。
  answer: 2
  choice_notes: []
  explanation: '真空捕集瓶のコックのすり合わせ部には、**グリースを塗布しません**（グリースが試料ガスを吸着したり、汚染したりするためです）。「グリースを塗布して漏れをなくす」とする選択肢2は誤りです。


    真空捕集瓶の内面は、測定対象物質に不活性でなければなりません。捕集袋は、清浄な乾燥空気または窒素で洗浄します。試料空気から水分を除くときは、ガラス管に無水硫酸カルシウムなどの乾燥剤を詰めて、試料採取口の前に接続します。電動ポンプで袋に送るときは、ポンプ内の吸着に注意します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
