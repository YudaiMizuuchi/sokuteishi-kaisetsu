  stem: ガスクロマトグラフ分析法における分離機構及び分離能に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 固定相が液体の場合、試料中の各成分はカラム内で固定相液体と気相間の分配平衡の差によって分離される。
  - 固定相液体には、極性が異なる物質を使用することができるので、多種類の物質の分析が可能である。
  - 保持時間とは、カラムに試料を導入後、分析対象成分のピークが出終わるまでの時間をいう。
  - 理論段数は、カラムの長さ、内径、温度、移動相流速などによって変化する。
  - ピークの重なりの程度を表す分離度が、1.5 のとき二つのピークはほぼ完全に分離される。
  answer: 3
  choice_notes: []
  explanation: '**保持時間**は、カラムに試料を導入してから、分析対象成分の**ピークが極大（頂点）になるまで**の時間です。「ピークが出終わるまでの時間」とする選択肢3は誤りです。


    固定相が液体のとき、各成分は、固定相液体と気相の間の分配平衡の差によって分離されます。固定相液体には、極性の異なるものがあります。理論段数は、カラムの長さ、内径、温度、流速などで変わります。分離度が1.5のとき、2つのピークはほぼ完全に分離します。


    （参考：『機器分析の実務』）'
