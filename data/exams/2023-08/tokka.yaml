  choice_notes: []
  explanation: 'マゼンタは、**粒子状（粉じん）**の物質（塩基性色素）で、ろ過捕集で捕集します。固体捕集法は、ガス状・蒸気状の物質を、活性炭などの捕集剤に吸着させる方法なので、マゼンタには不適切です。よって（5）です。


    アクリロニトリル、エチルベンゼン、ベンゼン、ベンゾトリクロリドは、固体捕集法で捕集できます。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
