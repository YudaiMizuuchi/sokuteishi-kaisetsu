  explanation: 'ミゼットインピンジャーで粒子を捕集するのは慣性衝突の作用で、吸引流量が大きいほど、空気の噴出の勢いが増して粒子が捕集液にぶつかりやすくなり、捕集率は**高く**なります。「流量が大きいほど捕集率は低くなる」とする選択肢4は誤りです。


    一方、ガス状物質の液体捕集では、流量が大きいほど捕集液と接する時間が短くなり、捕集率は低くなります（選択肢3）。粒子とガスで、流量の影響が逆になる点が罠です。'
