  stem: 正規分布、対数正規分布及び環境空気中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 対数正規分布の幾何標準偏差は無次元である。
  - 正規分布の平均値と標準偏差とは同じ次元を持つ。
  - 横軸に変数の対数をとったとき、対数正規分布の曲線の形は、幾何平均値を中心として左右対称になる。
  - 一般に、環境空気中の有害物質の濃度の平均値が高くなるにしたがって、濃度の標準偏差も大きくなる。
  - 正規分布の平均（算術平均）及び標準偏差をそれぞれμ及びσとすると、この分布の 95 ％ 上限値は μ＋3σである。
  answer: 5
