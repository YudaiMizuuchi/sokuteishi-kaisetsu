  stem: A・B 測定の単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間などを考慮する必要がある。
  - 単位作業場所の設定に当たっては、作業場の区域を、労働者の行動範囲、有害物質の分布状況などの判断基準によって層別化を行う。
  - 単位作業場所の区域は、著しい濃度変動がないか、濃度変動があってもランダムであるような範囲とする。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は同一とする。
  - 塗料の調合の作業とそこで調合された塗料を用いる塗装作業が同時に行われる区域を、1つの単位作業場所として設定することができる。
  answer: 1
  choice_notes: []
  explanation: '単位作業場所は、有害物質の濃度分布と労働者の行動範囲から決めるもので、作業場で働く労働者の人数や作業時間は考慮しません。「考慮する必要がある」とする選択肢1は誤りです。


    令和7年度第2回でも、人数や作業時間を考慮しない、という同じ論点が出題されています。'
  figures: []
  law_note: null
  _key_choice: 単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間などを考慮する必要がある。
