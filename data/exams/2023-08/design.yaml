  choices:
  - インジウム化合物、マンガン及びその化合物の試料空気を採取するときは、分粒装置付きの個人サンプラーを用いる。
  - 個人サンプラーを装着する位置は、労働者の前面であれば腰部でも構わない。
  - 個人サンプラーを装着した労働者が、単位作業場所外に出る場合であっても、測定結果に影響を与えない場合には、吸引ポンプを停止する必要はないが、その場合の測定値は、単位作業場所の滞在時間での時間加重平均値とする。
  - C 測定のサンプリング時間は、単位作業場所において労働者が作業に従事する全時間であれば、2時間未満であってもよい。
  - D 測定の測定値が複数ある場合には、得られた測定値のうちの最大値をD 測定の測定値とする。
  answer: 2
  choice_notes: []
  explanation: '個人サンプラーの捕集口は、労働者の**呼吸域**（できるだけ口や鼻の近く）に装着します。前面であれば腰部でもよいとする選択肢2は誤りです。


    個人サンプリング法は、労働者が実際に吸い込む空気をとらえるための測定です。腰の位置では呼吸域の濃度を代表できません。通常は襟元や胸元に装着します。'
  figures: []
  law_note: null
  _key_choice: 個人サンプラーを装着する位置は、労働者の前面であれば腰部でも構わない。
