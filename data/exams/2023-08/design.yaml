  stem: 25 ℃、1気圧における環境空気中のトルエン（C₆H₅CH₃）の体積分率が50 ppmであるとき、その質量濃度（mg･m⁻³）に最も近いものは、次のうちどれか。
  choices:
  - 105 mg･m⁻³
  - 190 mg･m⁻³
  - 205 mg･m⁻³
  - 290 mg･m⁻³
  - 380 mg･m⁻³
  answer: 2
  choice_notes: []
  explanation: 'ppm を mg/m³ に直すときは、ppm に分子量を掛けて、24.45 で割ります。トルエン（C₆H₅CH₃）の分子量は 92.1 なので、


    C [mg/m³] ＝ 50 × 92.1 ÷ 24.45 ≒ 188


    よって、最も近いのは 190 mg/m³ です。


    0℃・1気圧の 22.4 で割ると約 206（選択肢3）になります。25℃・1気圧では 24.45 を使うことを確認しましょう。'
  figures: []
  law_note: null
  _key_choice: 190mg・m-3
