  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点と測定点の間隔は、6 mを超えない等間隔であれば、縦方向と横方向は異なってもよい。
  - 2年間にわたって第1管理区分であった単位作業場所では、測定点の数を5未満とすることができる。
  - 測定点の数を5未満とすることができる単位作業場所でも、各測定点で繰り返し測定を行うことによって、測定値の総数は5以上とする。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね 1.2 以下であることが明らかであって、かつ、施設又は作業工程等の変更がない場合は、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 測定点の数が多く、1作業日中にサンプリングを終了できない場合は、単位作業場所の範囲を更に幾つかの単位作業場所に区分けし、測定点の数が1日にサンプリング可能な数より多くならないようにする。
  answer: 2
  choice_notes: []
  explanation: 'A 測定の測定点を5未満にできるのは、単位作業場所が著しく狭く、かつ濃度がほぼ均一であることが明らかな場合です。過去に第1管理区分が続いていたことは、測定点を減らす理由にはならないので、選択肢2は誤りです。


    濃度がほぼ均一かどうかは、過去の測定記録で幾何標準偏差がおおむね 1.2 以下であることなどで判断します（選択肢4）。「管理区分が良かった」と「濃度が均一」は別のことです。'
  figures: []
  law_note: null
  _key_choice: 2年間にわたって第1管理区分であった単位作業場所では、測定点の数を5未満とすることができる。
