  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 面積式流量計を捕集材と吸引ポンプの間に接続した場合、捕集材の圧力損失が大きくなるに従って、流量計の指示値は真の流量より小さくなる。
  - 絞り式（オリフィス）流量計は、ハイボリウムエアサンプラーの校正に用いる。
  - 石けん膜流量計は、所定の区間を石けん膜が移動する時間を測定して、所要時間とその区間の容積から流量を求めるものである。
  - 湿式ガスメーターは、原則として、ポンプより下流側に接続する。
  - サンプリングに用いる流量計の校正は、捕集装置を取り付けた状態で行う。
  answer: 1
  choice_notes: []
  explanation: '面積式流量計を捕集材と吸引ポンプの間に接続すると、捕集材の圧力損失によって流量計の部分の空気が減圧されるため、指示値は真の流量より**大きく**なります。「小さくなる」とする選択肢1は誤りです。


    この論点は、令和5年度第2回・令和6年度第2回でも繰り返し出題されています。だからこそ、流量計の校正は捕集装置を付けた状態で行います（選択肢5）。'
  figures: []
  law_note: null
