  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定を行う必要がある単位作業場所で、連続する2作業日にわたって測定を行う場合は、第1日目と第2日目ともに、B 測定を行う。
  - B 測定に光散乱方式の粉じん計を用いる場合は、10 分間連続測定を行う。
  - B 測定に圧電天秤方式の粉じん計を用いる場合は、測定時間を2分に合わせて、連続して5回測定を行う。
  - 相対濃度指示方法によって B 測定を行った場合に用いる質量濃度変換係数は、A 測定とは別に求めなければならない。
  - 検知管5本を用いても測定時間の合計が10 分に満たない場合は、10 分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値を測定値とする。
  answer: 4
  choice_notes: []
  explanation: '相対濃度指示方法で B 測定を行うときは、A 測定で求めた質量濃度変換係数を**そのまま用います**。A 測定とは別に求めなければならないとする選択肢4は誤りです。


    B 測定は A 測定と同じ方法で測るのが原則で、変換係数も共通です。同じ単位作業場所の粉じんなので、性質も同じと考えます。'
  figures: []
