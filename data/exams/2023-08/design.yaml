  explanation: '小型ガス吸収管で揮発性の物質を捕集するときは、捕集液の温度が**低い**ほど、物質が液に溶け込んだまま逃げにくくなり、捕集率は高くなります。「温度が高いほど高くなる」とする選択肢3は誤りです。


    気体の液体への溶解度は温度が低いほど大きい、という性質と同じ考え方です。令和7年度第2回でも同じ論点が出題されています。'
