  explanation: '正規分布の95％上限値は、μ ＋ **1.645**σ です。μ ＋ 3σ とする選択肢5は誤りです。


    1.645 は、正規分布の上側5％点です。μ ± σ の範囲に約68％、μ ± 2σ に約95％（両側）が入る、という値とあわせて覚えておきましょう。'
