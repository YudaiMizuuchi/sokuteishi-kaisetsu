  stem: 指定作業場における次の作業環境測定のうち、個人サンプリング法による測定（C・D 測定）の対象となるものはどれか。
  choices:
  - ウレタン樹脂を製造する工程において、トリレンジイソシアネートの投入作業を行う単位作業場所におけるトリレンジイソシアネートの測定
  - ガラス製品を製造する工程において、フッ酸を用いてガラスの表面処理を行う単位作業場所におけるフッ化水素の測定
  - 有機化合物をメチル化する工程において、ヨウ化メチルの混合作業を行う単位作業場所におけるヨウ化メチルの測定
  - 金属ニッケルを溶接する作業場において、溶接作業終了後、労働者が作業場内を移動しながら、ヒュームとして発生した酸化ニッケルを主成分とする粉じんの清掃作業を行う単位作業場所における酸化ニッケルの測定
  - 亜鉛めっきを行う工程において、シアン化ナトリウムを含むめっき浴を使用する単位作業場所におけるシアン化ナトリウムの測定
  answer: 1
  choice_notes: []
  explanation: 'トリレンジイソシアネートは、個人サンプリング法（C・D 測定）の対象となる物質です。よって答えは（1）です。


    フッ化水素は、令和6年度第2回で個人サンプリング法の対象外として出題されています。個人サンプリング法の対象は物質ごとに定められているので、対象となる物質と対象外の物質を、出題されたものから一つずつ押さえていきましょう。'
  figures: []
