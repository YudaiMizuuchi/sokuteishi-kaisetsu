  - n-ヘキサン
  - 酢酸エチル
  - 二硫化炭素
  - テトラヒドロフラン
  answer: 4
  choice_notes: []
  explanation: '水を加えて撹拌・放置すると、**ほぼ等量の2相に分離し**、下層を取り出して、さらに水を加えても、**再びほぼ等量に2相に分離する**のは、水にほとんど溶けず、水より**重い**有機溶剤です。**二硫化炭素**は、水への溶解度が小さく、密度が約1.26 g/cm³で水より重いので、下層に分かれます。よって（4）です。


    メタノールとテトラヒドロフランは、水と混ざり合います。n-ヘキサンと酢酸エチルは、水より軽く、上層に分かれます（酢酸エチルは水にやや溶けます）。'
