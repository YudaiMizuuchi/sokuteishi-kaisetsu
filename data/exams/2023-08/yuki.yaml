  stem: ガスクロマトグラフ分析法のキャリアガスに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - キャリアガスとして、水素を使用することができる。
  - 溶出ピークの幅は、カラム内キャリアガスの渦流拡散の影響を受ける。
  - カラムの理論段数は、キャリアガスの種類が関係する。
  - 内径0.3 mmのキャピラリカラムでは、キャリアガス流量が20～30 mL･min⁻¹が適切である。
  - 電子捕獲検出器（ECD）には、キャリアガスとして、窒素を使用することができる。
  answer: 4
  choice_notes: []
  explanation: '内径0.3 mmのキャピラリカラムでは、キャリアガス流量は**1〜3 mL/min程度**が適切です。20〜30 mL/minは、内径3 mm程度の**充填カラム**の最適流量です。選択肢4は誤りです。


    キャリアガスには、水素も使えます。溶出ピークの幅は、カラム内の渦流拡散の影響を受け、理論段数は、キャリアガスの種類が関係します。電子捕獲検出器（ECD）には、窒素を使えます。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
