  stem: ガスクロマトグラフ分析法に用いる検量線に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 標準溶液は、対象の標準物質を脱着溶媒で適切な濃度範囲内に希釈したものを用いる。
  - 比較的高濃度の溶液を標準原液として冷暗所に保管し、検量線作成の都度、適切に希釈して標準系列液を調製する。
  - 検量線の適用範囲は、標準系列液の濃度の上限と下限の間にあり、かつ直線とみなせる範囲である。
  - 内標準法で用いられる内標準物質には、目的物質と物理的・化学的によく似ているが、実際の試料中に含まれず、かつ、測定を妨害しない物質を選択する。
  - 内標準法では、ガスクロマトグラフに導入した試料の体積を正確に測定する必要がある。
  answer: 5
  choice_notes: []
  explanation: '内標準法では、検量線を、標準物質と内標準物質のピーク面積（または高さ）の**比**で作成するので、ガスクロマトグラフに導入した**試料の体積を正確に測定する必要はありません**。「正確に測定する必要がある」とする選択肢5は誤りです。


    標準溶液は、標準物質を脱着溶媒で、適切な濃度範囲内に希釈して使います。標準原液は、比較的高濃度で冷暗所に保管し、検量線作成のたびに、希釈して標準系列液を調製します。検量線の適用範囲は、標準系列液の濃度の上限と下限の間で、かつ、直線とみなせる範囲です。内標準物質には、目的物質と物理的・化学的によく似ていて、試料中に含まれず、測定を妨害しない物質を選びます。'
