  stem: ある有機溶剤に等量の水を加えて撹拌後放置したところ、ほぼ等量に2相に分離した。この下層を取り出し、これに等量の水を加え撹拌後放置したところ、再びほぼ等量に2相に分離した。次の有機溶剤のうち、上記の記述に該当するものはどれか。
  columns: null
  choices:
