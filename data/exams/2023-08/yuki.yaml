  stem: 検知管法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 濃度目盛は、20 ℃ を基準にしている。
  - 検知剤は、測定対象物質以外と反応することがある。
  - 個人サンプリング法（C・D 測定）では、検知管法を用いることはできない。
  - 検知剤の変色層の長さは、担体粒子径の影響を受ける。
  - 変色層が斜めの場合、変色した部分の最先端と斜めに変色が生じ始めた点との中央値を読み取る。
  answer: 3
  choice_notes: []
  explanation: '検知管法は、**個人サンプリング法（C・D測定）でも**使えます。「用いることはできない」とする選択肢3は誤りです。


    検知管の濃度目盛は、20℃を基準にしています。検知剤は、測定対象物質以外とも反応することがあります。変色層の長さは、担体の粒子径の影響を受けます。変色層が斜めのときは、変色した部分の最先端と、斜めに変色が生じ始めた点との中央値を読み取ります。


    この選択肢と同様の記述は、令和4年度第1回の問題でも出題され、誤りとして扱われています。この問題の正誤は、出題実績にもとづいて判断しています。'
