  stem: 有機溶剤の受動型試料採取機器（パッシブサンプラー）における捕集速度に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 一般に、単位は cm³･min⁻¹を用いる。
  - 任意の速度に調整することはできない。
  - 気流の影響を受けると変動する。
  - サンプラーの構造により異なる。
  - 有機溶剤の種類にかかわらず同じである。
  answer: 5
  choice_notes: []
  explanation: 'パッシブサンプラーの捕集速度（サンプリング速度）は、拡散係数に比例するので、**有機溶剤の種類によって異なります**。「有機溶剤の種類にかかわらず同じである」とする選択肢5は誤りです。


    捕集速度の単位は、cm³/minです。任意の速度に調整することはできず、サンプラーの構造によって決まります。気流の影響を受けると、変動します。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
