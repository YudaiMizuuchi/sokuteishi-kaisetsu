  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集袋により試料を採取する場合には、内容積 5 L以上のものを用いる。
  - 小型ガス吸収管による試料採取時の空気吸引流量は、50～100 mL･min⁻¹とする。
  - 固体捕集法で試料を捕集する場合、電動ポンプの流量調整は捕集管等を接続せずに行う。
  - ガラス製、プラスチック製にかかわらず、管や装置の接続にグリースは使用しない。
  - 流量計の校正には、基準流量計として石けん膜流量計を用いることができる。
  answer: 3
  choice_notes: []
  explanation: '固体捕集法で、電動ポンプの流量調整は、**捕集管を接続した状態で**行います。捕集管を通すと空気が流れにくくなるので、接続せずに調整すると、実際の流量が設定からずれてしまいます。「捕集管等を接続せずに行う」とする選択肢3は誤りです。


    捕集袋は、内容積5 L以上のものを使います。小型ガス吸収管の吸引流量は、50〜100 mL/minです。管や装置の接続には、グリースを使いません。流量計の校正には、基準流量計として石けん膜流量計を使えます。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
