  stem: 有機溶剤の物性等に関する次の記述のうち、誤っているものはどれか。ただし、大気圧は1気圧とする。
  columns: null
  choices:
  - シクロヘキサノンの分子量は、シクロヘキサノールの分子量より小さい。
  - トルエンの融点は、キシレンの融点より低い。
  - 1-ブタノールの沸点は、イソブチルアルコールの沸点より低い。
  - 25 ℃ において、trans-1,2-ジクロロエチレンの密度は、1,1,1-トリクロロエタンの密度より小さい。
  - 25 ℃において、イソプロピルアルコールの蒸気圧は、酢酸イソプロピルの蒸気圧より小さい。
  answer: 3
  choice_notes: []
  explanation: '沸点は、1-ブタノールが約118℃、イソブチルアルコールが約108℃で、**1-ブタノールのほうが高い**です（枝分かれの多いアルコールのほうが、沸点が低くなります）。「1-ブタノールの沸点は、イソブチルアルコールの沸点より低い」とする選択肢3は誤りです。


    シクロヘキサノン（98）はシクロヘキサノール（100）より分子量が小さく、トルエン（−95℃）はキシレン（m-キシレン −48℃など）より融点が低いです。（物性値は、一般的な化学便覧の概数です。）'
