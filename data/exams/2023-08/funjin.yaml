  stem: 媒質中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 遠心力場の加速度は、角速度が同じであれば、回転半径に比例する。
  - 密度 2 g･cm⁻³、直径 1 µmの球形粒子の空気力学相当径は 2 µmである。
  - 帯電している粒子は、それぞれ反対の極性に向かって移動し、帯電量が同じであれば、粒径が小さいほどその移動速度は大きい。
  - ブラウン運動による粒子の平均移動距離は、拡散係数の平方根に比例する。
  - ブラウン運動をしている粒子の拡散係数は、粒径が小さいほど大きくなる。
  answer: 2
  choice_notes: []
  explanation: '空気力学相当径は、密度1 g/cm³の球で、終末沈降速度が同じになる粒子の径です。密度ρ、直径dの粒子では、d × √ρ で表されます。密度2 g/cm³、直径1 µmの粒子の空気力学相当径は、1 × √2 ≒ **1.4 µm**で、2 µmではありません。選択肢2は誤りです。


    遠心力場の加速度は、角速度が同じなら、回転半径に比例します。電荷が同じなら、粒径が小さいほど、電界中の移動速度は大きくなります。ブラウン運動による平均移動距離は、拡散係数の平方根に比例し、拡散係数は、粒径が小さいほど大きくなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
  figures: []
  law_note: null
  _review: true
