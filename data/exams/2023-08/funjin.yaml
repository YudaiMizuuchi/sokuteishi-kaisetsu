  stem: 相対濃度計を用いて鉱物性粉じんの濃度測定を行った場合の併行測定及び質量濃度変換係数に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 併行測定点は、その単位作業場所を代表する粉じんの質量濃度変換係数が得られると思われる位置とする。
  - 併行測定で得られた圧電天秤方式の粉じん計の5回の平均濃度が 0.96 mg･m⁻³ で粉じん質量濃度が 1.20 mg･m⁻³ の場合の質量濃度変換係数は、1.25 である。
  - 光散乱方式の相対濃度計の場合、粒度分布が同じであっても、石英粉じんと酸化鉄粉じんの質量濃度変換係数は一致しない。
  - 併行測定に使用する相対濃度計は、A 測定に使用した相対濃度計と同じ型式の機器とすることが望ましいが、厚生労働大臣の登録を受けた機関で校正された機器を用いる場合は必ずしも同じ型式とする必要はない。
  - 併行測定を行うことなしに作業環境測定を実施する許可を所轄労働基準監督署長より受けた場合の質量濃度変換係数は、厚生労働省労働基準局長が示す値を用いることができる。
