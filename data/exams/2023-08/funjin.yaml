  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 繊維層フィルターでは、粒径が 1 µmより大きな粒子は、繊維と繊維の隙間に挟まって捕集される。
  - 粒径が 0.1 µmより小さな粒子では、主として拡散作用によってろ過材に捕集され、粒径が小さいほど捕集率は上昇する。
  - メンブランフィルターは、繊維層フィルターに比べ空間率の低い多孔質フィルターである。
  - 平均孔径が 0.8 µmのメンブランフィルターは、粒径が 0.3 µmの粒子を99 ％ 以上捕集する。
  - メンブランフィルターは、帯電しやすいので質量濃度を求めるためのろ過材としては不向きである。
  answer: 1
  choice_notes: []
  explanation: '繊維層フィルターでは、粒径が1 µmより大きい粒子は、**慣性効果、重力効果、さえぎり効果**で捕集されます。「繊維と繊維の隙間に挟まって捕集される」とする選択肢1は、捕集の機構の説明として誤りです。


    粒径が0.1 µmより小さい粒子は、ブラウン運動による拡散作用で捕集され、粒径が小さいほど捕集率は上昇します。メンブランフィルターは、繊維層フィルターより空間率が低い多孔質フィルターで、帯電しやすいので、質量濃度を求めるためのろ過材としては不向きです。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
