  stem: 粉じん中の遊離けい酸の分析手順に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - X 線回折分析装置による定性分析で、遊離けい酸が確認できなかった試料は、管電流及び管電圧を見直し、感度を上げて再度分析し、それでも遊離けい酸の存在が認められない場合は、遊離けい酸含有率は 0 ％として取り扱う。
  - X 線回折分析装置による定性分析で、クリストバライトの含有が認められた場合、りん酸法による定量操作を選択してはならない。
