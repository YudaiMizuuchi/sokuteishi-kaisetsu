  stem: 空気調和されている室内に設置されている電子天秤に関する次の記述のうち、適切でないものはどれか。
  columns: null
  choices:
  - 粉じん濃度の測定には、読み取り限界が 0.01 mg以下の天秤を使用する。
  - 天秤は、天秤内部の水準器により、常に水平に保っておかなければならない。
  - 秤量開始の 30 分以上前に天秤の電源を入れておく。
  - 秤量するフィルターは、少なくとも秤量開始の2時間前に天秤室内に静置する。
  - 測定精度が高く感度の変化も少ないので、設置時に校正を行えば、設置場所を変える等の特別な理由がなければ、改めて校正を行う必要はない。
  answer: 5
  choice_notes: []
  explanation: '電子天びんは、温度変化による感度の変化が、直示天びんより大きいので、設置時に校正を行っても、**しばしば校正して、感度を調べる必要があります**。「設置場所を変える等の特別な理由がなければ、改めて校正を行う必要はない」とする選択肢5は適切でありません。


    粉じん濃度の測定には、読み取り限界0.01 mg以下の天びんを使います。天びんは、水準器で水平に保ちます。秤量開始の30分以上前に電源を入れ、フィルターは、少なくとも秤量開始の2時間前に天びん室内に静置します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
