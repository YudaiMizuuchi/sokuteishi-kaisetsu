  stem: 吸入性粉じんを分離・捕集するために使用される慣性衝突式分粒装置に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 円形ノズル式分粒装置で分粒される50％透過粒径は、ノズルを通過する空気の速度の1/2乗に比例する。
  - 総粉じんと吸入性粉じんの濃度を同時に求めることができる。
  - ノズルの下流にある衝突板上に、グリースガイド等を用いてシリコン油を塗布する。
  - 吸入性粉じんは、フィルターに捕集される。
  - 規定の流量で使用すると、4 µmの粒径の粉じんは 50 ％ 捕集される。
  answer: 1
  choice_notes: []
  explanation: '慣性衝突式分粒装置では、ノズルから出た空気の流れが曲がるとき、慣性の大きい粗大粒子が、衝突板に衝突して捕集されます。円形ノズル式で分粒される50％透過粒径は、ノズルを通過する空気の速度の**1/2乗に反比例**します（速度が速いほど、小さい粒子まで衝突板に捕集され、50％透過粒径は小さくなります）。「比例する」とする選択肢1は誤りです。


    衝突板には、シリコン油を塗布して、跳ね返りを防ぎます。吸入性粉じんは、フィルターに捕集されます。規定の流量で使うと、粒径4 µmの粉じんが50％捕集されます。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
