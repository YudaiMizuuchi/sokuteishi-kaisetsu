  stem: 光散乱方式の相対濃度計の特性等に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 散乱光の強さは、光学系と粒子の系が一定であれば粉じんの濃度に比例する。
  - 散乱光の強さは、入射光の波長が大きいほど大きくなる。
  - 計数値は、空気吸引流量の変化に影響されない。
  - 0.1 µmよりも小さい粒子と数 µmの粒子では、個々の粒子の散乱光の強度は、数 µmの粒子の方が大きい。
  - 0.3 µm以下の粒子では、散乱光強度は角度方向の変動は少ない。
  answer: 2
  choice_notes: []
  explanation: '光散乱方式の相対濃度計で、散乱光の強さは、入射光の波長が**短い**ほど大きくなる傾向があります。「波長が大きいほど大きくなる」とする選択肢2は誤りです。


    光学系と粒子の系が一定であれば、散乱光の強さは、粉じんの濃度に比例します。計数値は、空気吸引流量の変化に影響されません。数µmの粒子のほうが、0.1 µmより小さい粒子より、個々の散乱光の強度は大きく、0.3 µm以下の粒子では、散乱光強度は角度方向の変動が少ないです。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
  figures: []
