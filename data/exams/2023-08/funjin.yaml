  stem: 鉱物性粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 面積式流量計は、使用する前に使用条件に合わせた状態で流量の校正を行う。
  - 面積式流量計は、浮子とテーパー管との間隙の面積と、そこを流れる試料空気の体積流量が比例することを利用した流量計である。
  - 圧力損失の大きなフィルターを用いたサンプリングでは、ろ過捕集器具と吸引ポンプの間に接続された面積式流量計の指示値は、真の流量よりも大きい。
  - ローボリウムエアサンプラーに用いる流量計の校正には、石けん膜流量計を用いることができる。
  - ハイボリウムエアサンプラーに表示される流量の校正には、ルーツメーターを用いることができない。
  answer: 5
  choice_notes: []
  explanation: 'ハイボリウムエアサンプラーに表示される流量の校正には、**ルーツメーター**を使えます。「ルーツメーターを用いることができない」とする選択肢5は誤りです。


    面積式流量計は、使用前に、使用条件に合わせた状態で校正します。ローボリウムエアサンプラーの流量計の校正には、石けん膜流量計を使えます。圧力損失の大きなフィルターを使うときは、吸引ポンプ側の面積式流量計では、空気の密度が小さくなるので、指示値が真の流量より大きくなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
