  stem: 粉じん作業場において、有効直径 20 mmのフィルターに 1.30 mgの粉じんを捕集した。このフィルター中の石英を X 線回折基底標準吸収補正法により定量操作を行ったところ、粉じん中の石英含有率は15.0％であった。このとき石英の主回折線強度として、正しい値に最も近いものは次のうちどれか。ただし、X 線吸収補正係数は 1.20、石英の回折線強度は 1 mg･cm⁻²のとき2000 cpsとする。
