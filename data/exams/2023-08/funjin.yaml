  stem: 遊離けい酸に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 石英が長時間高温にさらされると、トリジマイトやクリストバライトに変化する。
  - 石英は、常圧下の 573 ℃ において可逆的に転移し、低温型を α 石英、高温型を β 石英と呼ぶ。
  - 作業環境測定における粉じん中の遊離けい酸の大部分は石英である。
  - オパール(たんぱく石)は、遊離けい酸含有率の測定の対象となる。
  - 玉ずいは、遊離けい酸含有率の測定の対象とならない。
  answer: 5
  choice_notes: []
  explanation: '**玉ずい**（玉髄）は、石英の微結晶と非晶質シリカの集合体で、遊離けい酸含有率の**測定の対象になります**。「測定の対象とならない」とする選択肢5は誤りです。


    石英は、長時間高温にさらされると、トリジマイトやクリストバライトに変化します。常圧下の573℃で、低温型のα石英と高温型のβ石英が可逆的に転移します。作業環境測定における粉じん中の遊離けい酸の大部分は石英です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
  figures: []
  law_note: null
  _review: true
  minor_note: 玉ずいが遊離けい酸含有率の測定の対象になる、という点は、旧版ガイドブックで確認できておらず、一般的な知識による説明です。根拠の確認は後回しにしています。
