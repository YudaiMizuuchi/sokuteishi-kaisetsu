  stem: '下表は、繊維層フィルターによる粒子の捕集機構別に粒径、ろ過速度、繊維径の捕集率に与える影響を表したものである。表中のⒶ、Ⓑ、Ⓒに入る語句の組合せとして正しいものは下のうちどれか。


    |  | 粒径 | ろ過速度 | 繊維径 |

    |---|---|---|---|

    | さえぎり効果 | 大きいほど効果大 | — | Ⓐ |

    | 重力効果 | 大きいほど効果大 | Ⓑ | 小さいほど効果大 |

    | 慣性効果 | Ⓒ | 大きいほど効果大 | 小さいほど効果大 |

    | 静電沈着 | — | 小さいほど効果大 | 小さいほど効果大 |'
  columns:
  - Ⓐ
  - Ⓑ
  - Ⓒ
  choices:
  - 小さいほど効果大 ／ 小さいほど効果大 ／ 小さいほど効果大
  - 小さいほど効果大 ／ 小さいほど効果大 ／ 大きいほど効果大
  - 小さいほど効果大 ／ 大きいほど効果大 ／ 大きいほど効果大
  - 大きいほど効果大 ／ 小さいほど効果大 ／ 小さいほど効果大
  - 大きいほど効果大 ／ 大きいほど効果大 ／ 小さいほど効果大
  answer: 2
  choice_notes: []
  explanation: '各捕集機構が、繊維径・ろ過速度・粒径にどう依存するかを考えます。


    - **さえぎり効果**（Ⓐ：繊維径）：繊維径が**小さい**ほど効果が大きくなります。

    - **重力効果**（Ⓑ：ろ過速度）：ろ過速度が**小さい**ほど、粒子が沈降する時間があるので、効果が大きくなります。

    - **慣性効果**（Ⓒ：粒径）：粒径が**大きい**ほど、慣性が大きく、効果が大きくなります。


    よって（2）の「小さいほど／小さいほど／大きいほど」です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
