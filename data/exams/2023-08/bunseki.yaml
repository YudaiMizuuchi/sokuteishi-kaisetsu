  stem: 拡散セルを用いた標準ガスの調製に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 標準ガスの濃度は、拡散セルの拡散チューブの寸法、温度、希釈空気の流量に依存する。
  - 拡散セルに、複数の標準物質を入れて標準ガスの調製をすることはできない。
  - 標準ガスの濃度の微調整は、拡散セルの温度を変えるよりも希釈空気の流量を変える方が短時間で行うことができる。
  - 標準ガスの濃度は、拡散セルの温度が高いほど高くなる。
  - 標準ガスの濃度は、拡散セルの拡散チューブの長さが長いほど高くなる。
  answer: 5
  choice_notes: []
  explanation: '拡散チューブの長さ（有効長）が長いほど、蒸気が拡散して出てくるまでの道のりが長くなるので、標準ガスの濃度は**低く**なります。「長いほど高くなる」とする選択肢5は誤りです。


    拡散速度は、チューブの断面積に比例し、長さに反比例します。内径が大きいほど、温度が高いほど濃度は高くなります。'
  figures: []
