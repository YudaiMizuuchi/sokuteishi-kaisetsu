  stem: 検量法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定結果が検量線の濃度範囲を超えた場合は、試料溶液を希釈して再測定する。
  - 測定値と濃度が本来比例関係にあるにもかかわらず検量線が直線とならない場合は、分析条件を再検討する必要がある。
  - 標準添加法は、測定対象物質濃度がゼロの時に測定値がゼロとみなせる場合に使用可能である。
  - 内標準法は、測定対象物質と内標準物質のそれぞれの測定値に誤差があるため、測定精度が下がる。
  - 内標準物質には、測定対象物質と物理的、化学的によく似た物質を選択する。
  answer: 4
  choice_notes: []
  explanation: '内標準法は、試料と標準溶液の両方に同じ量の内標準物質を加え、測定対象物質との信号の比で定量する方法です。注入量のばらつきや装置の感度の変動が打ち消されるので、測定精度は**向上**します。「精度が下がる」とする選択肢4は誤りです。


    内標準物質には、測定対象物質と性質がよく似ていて、試料には含まれない物質を選びます（選択肢5）。'
