  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 陰極に合金を用いることにより、複数の測定対象金属に使用可能な中空陰極ランプがある。
  - 中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して発光する。
  - 光源の輝線の線幅は、吸収線の線幅より狭い。
  - フレーム原子化法では、光路に対してフレームを平行ではなく角度をつけることにより、感度を向上させることができる。
  - 電気加熱式原子化法（グラファイト炉法）は、フレーム原子化法に比べて測定感度が高い。
  answer: 4
  choice_notes: []
  explanation: 'フレーム原子化法で、光路に対して、バーナーを角度をつけて（回転させて）使うと、光がフレームを通る距離（光路長）が短くなるので、**感度は低下**します。感度を向上させるには、バーナーを光路に平行にして、光路長を長くします。「感度を向上させることができる」とする選択肢4は誤りです。


    陰極に合金を使うと、複数の金属に使える中空陰極ランプになります。中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して発光します。光源の輝線の線幅は、吸収線の線幅より狭いです。電気加熱式原子化法は、フレーム法より感度が高いです。'
  figures: []
  law_note: null
  _review: true
  minor_note: フレーム原子化法で、バーナーに角度をつけると感度が低下する、という点は、プロジェクトの教科書で記述を確認できておらず、一般的な知識による説明です。根拠の確認は後回しにしています。
