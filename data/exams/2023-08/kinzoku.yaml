  - 蛍光光度分析法 ／ 物質の光ルミネセンス
  - 原子吸光分析法 ／ 励起状態原子の光吸収
  - 誘導結合プラズマ発光分光分析法（ICP-AES法） ／ 励起された原子・イオンの発光
  - 誘導結合プラズマ質量分析法（ICP-MS法） ／ 原子のイオン化
  answer: 3
  choice_notes: []
  explanation: '原子吸光分析法は、**基底状態の原子**が、特定の波長の光を吸収する現象を利用します。「励起状態原子の光吸収」とする選択肢3は誤りです。


    吸光光度分析法はキレート分子などの光吸収、蛍光光度分析法は物質の光ルミネセンス、ICP-AES法は励起された原子・イオンの発光、ICP-MS法は原子のイオン化を利用します。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
