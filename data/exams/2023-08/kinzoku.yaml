  stem: 溶媒抽出原子吸光分析法に用いられるメチルイソブチルケトンに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 金属キレートの溶解度が大きい。
  - 溶媒抽出後の層分離は、手早く行う。
  - 水とは、相互に数％程度溶解する。
  - 抽出時には、脱水・乾燥したものを用いる。
  - 燃焼時に比較的安定な炎が得られる。
  answer: 4
  choice_notes: []
  explanation: '溶媒抽出に使うメチルイソブチルケトン（MIBK）は、水と相互に数％程度溶け合う溶媒で、MIBK層には1〜3％の水分が含まれています。抽出には、水で飽和させたものを使うので、「脱水・乾燥したものを用いる」とする選択肢4は誤りです。


    金属キレートの溶解度が大きく、燃焼時に比較的安定な炎が得られます。層分離は、手早く行います。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
