  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 測定波長が紫外部にある物質には、ガラスセルは適さない。
  - 測定波長が紫外部にある場合は、光源にタングステンランプを用いる。
  - 吸光度の測定には、通常、吸収極大波長を用いる。
  - 吸光度が光路長に比例することを、ランベルトの法則という。
  - 吸光度の誤差が最も小さいのは、0.4 付近である。
  answer: 2
  choice_notes: []
  explanation: '紫外部（約340 nm以下）の測定には、光源に**重水素ランプ**を使います。タングステンランプは、可視部の光源です。「紫外部にある場合は、光源にタングステンランプを用いる」とする選択肢2は誤りです。


    ガラスセルは、紫外部の光を吸収するので、紫外部の測定には使えません（石英セルを使います）。吸光度は、通常、吸収極大波長で測定します。吸光度が光路長に比例することを、ランベルトの法則といいます。吸光度の誤差が最も小さいのは、0.4付近です。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
