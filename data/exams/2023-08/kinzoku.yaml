  stem: 金属及び金属化合物の性質を示す次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - ベリリウムは銀白色の金属であり、銅にベリリウムを添加したベリリウム銅は火花を出しにくい特徴を有している。
  - バナジウムは耐食性と耐熱性にすぐれており、ドリルなどの工具用合金に使用されている。
  - 酸化クロム（Ⅵ）は、緑色で化学的に安定である。
  - インジウム酸化物は、液晶ディスプレイの透明電極材料として使用される。
  - 鉛は融点が低く加工しやすい金属であり、鉛ガラスは放射線遮蔽物として使用されている。
  answer: 3
  choice_notes: []
  explanation: '酸化クロム(Ⅵ)（三酸化クロム、CrO₃）は、**暗赤色**の結晶で、強い酸化力をもつ不安定な物質です。「緑色で化学的に安定」なのは、酸化クロム(Ⅲ)（Cr₂O₃）です。選択肢3は誤りです。


    ベリリウム銅は、火花を出しにくい合金です。バナジウムは、耐食性・耐熱性にすぐれ、工具用合金に使われます。インジウム酸化物は、液晶ディスプレイの透明電極材料です。鉛ガラスは、放射線の遮蔽に使われます。'
  figures: []
  law_note: null
