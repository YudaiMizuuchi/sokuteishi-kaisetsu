    フェノールフタレインは、pH10付近のアルカリ性で赤色を示します。EDTAのマスキング効果は、pHによって異なります。硫酸アンモニウムは、溶媒抽出の効率を高める塩として、酢酸アンモニウムは、pHの緩衝剤として使います。


