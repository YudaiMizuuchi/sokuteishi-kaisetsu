  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 国内で使用される防毒マスクは、有害ガスの種類にかかわらず、厚生労働大臣が指定する機関による型式検定の対象である。
  - 着用者の顔面と防毒マスクの面体との密着性の良否の簡便な確認方法には、陰圧法及び陽圧法がある。
  - 有機ガス用防毒マスクの吸収缶は、メタノール、二硫化炭素等については、除毒能力試験の試験用ガスであるシクロヘキサンに比べて破過時間が著しく短くなる。
  - 一酸化炭素用防毒マスクの吸収缶は、使用する環境の湿度が高いほど破過時間が短くなる傾向にある。
  - 防じん機能を有する防毒マスクには、吸収缶のろ過材がある部分に白線が入れてある。
  answer: 1
