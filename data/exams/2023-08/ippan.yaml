  stem: 化学物質等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アクリルアミドによる健康障害では、皮膚の剝離、末梢神経炎などがみられる。
  - N,N-ジメチルホルムアミドのばく露では、頭痛、めまい、肝機能障害などがみられる。
  - 塩化ビニルによる中毒では、レイノー現象、指端骨溶解や肝血管肉腫などがみられる。
  - フッ化水素による慢性中毒では、骨の硬化や斑状歯がみられる。
  - 二酸化硫黄による慢性中毒では、門歯・犬歯の黄色環、低分子蛋白尿などの症状がみられる。
  answer: 5
  choice_notes: []
  explanation: '門歯・犬歯の黄色環（歯の着色）や低分子蛋白尿（腎障害）は、**カドミウム**による慢性中毒の症状です。二酸化硫黄による慢性中毒では、慢性気管支炎や歯牙酸蝕症などがみられるので、選択肢5は誤りです。


    低分子蛋白尿（β₂-ミクログロブリンなどが尿に出る）は、カドミウムの腎障害の特徴です。症状から物質を逆にたどれるようにしておきましょう。'
