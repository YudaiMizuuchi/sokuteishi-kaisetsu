  stem: 振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動障害は、チェーンソーなどの振動工具によって生じる障害で、手のしびれなどの末梢循環障害やレイノー現象などの末梢神経障害がみられる。
  - 日振動ばく露量は、周波数補正振動加速度実効値の3軸合成値と1日の振動ばく露時間から求められる。
  - 日振動ばく露量が、日振動ばく露限界値を超えることがないよう振動ばく露時間の抑制、低振動の振動工具の選定を行うようにする。
  - 振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬季に行うとよい。
  - フォークリフトや建設機械などの運転では、全身が低い周波数の振動にばく露され、不快感を感じたり、腰痛や頚部痛などの脊柱障害を起こすことがある。
