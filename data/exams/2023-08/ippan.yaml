  stem: 化学物質による健康影響及びその管理指標等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 量 — 影響関係とは、個体について、有害物質へのばく露量と、ある生体影響の大きさとの関係を示したものである。
  - 量 — 反応関係とは、集団について、有害物質へのばく露量と、ある生体影響を表す個体の割合との関係を示したものである。
  - 最小毒性量（LOAEL）とは、毒性試験において有害な影響が認められた最小のばく露量をいう。
  - LD₅₀とは、慢性毒性を評価する指標で、一群の試験動物の 50 ％ が死亡すると予想されるばく露量をいう。
  - ACGIH（米国産業安全衛生専門家会議）が勧告する TLV— TWA（時間加重平均）は、ほとんどすべての労働者が1日8時間及び週 40時間、繰り返しばく露を受けても健康に有害な影響を受けないとされる気中物質の濃度である。
  answer: 4
  choice_notes: []
  explanation: '半数致死量（LD₅₀）は、1回の投与で試験動物の50％が死亡すると予想される量で、**急性毒性**を評価する指標です。慢性毒性の指標とする選択肢4は誤りです。


    慢性毒性（繰り返しばく露）の評価には、無毒性量（NOAEL）や最小毒性量（LOAEL）を用います。


    （参考：辞典類（日本大百科全書、医学用語辞典など）の定義。LD50（半数致死量）は、試験動物の集団の50％が死亡すると推定される投与量で、化学物質の急性毒性の一般的な指標です。値が小さいほど毒性が強いことを示します。）'
