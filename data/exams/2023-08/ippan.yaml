  - 電離放射線の被ばくによる白内障は、晩発障害に分類され、被ばく後、半年 ～ 30 年後に現れる。
  - 造血器、消化管粘膜など細胞分裂の頻度の高い細胞が多い組織・臓器は、一般に、電離放射線の影響を受けやすい。
