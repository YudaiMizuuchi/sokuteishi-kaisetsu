  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 化学品について、「物理化学的危険性」、「健康に対する有害性」及び「環境に対する有害性」の三つに関し、危険有害性クラスが設定されており、それぞれについて定められた、危険有害性を判断するための分類基準に従って、危険有害性区分に分類する。
  - 分類基準に従って分類した結果を情報伝達するための方法として、ラベルや安全データシート（SDS）がある。
  - ラベルに記載する注意喚起語には、「警告」と「危険」の2種類があり、重大な危険有害性がある場合には「警告」を用い、それよりは重大性の低い危険有害性がある場合には「危険」を用いる。
  - ラベルに表示する絵表示は9種類あり、危険有害性区分に応じ表示する。
  - 安全データシート（SDS）に記載すべき事項は 16項目であり、これらを定められた順に従って記載する。
  answer: 3
  choice_notes: []
  explanation: 'GHS の注意喚起語は、重大な危険有害性がある場合に「**危険**」、それより重大性の低い場合に「**警告**」を用います。選択肢3は使い分けが逆になっていて誤りです。


    令和5年度第2回では、正しい使い分けが出題されています。言葉の強さのとおり、「危険」の方が重い、と覚えましょう。'
