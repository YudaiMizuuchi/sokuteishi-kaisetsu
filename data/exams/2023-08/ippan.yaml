  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - リスクアセスメントを実施する際に、必要に応じ入手すべき情報として、作業環境測定結果、特殊健康診断結果、生物学的モニタリングの結果などがある。
  - 負傷又は疾病の重篤度の見積りに際しては、傷害や疾病等の種類にかかわらず、基本的に、負傷又は疾病による休業日数等を尺度として使用する。
  - リスクの見積りにあたって、作業環境測定で測定した化学物質等の気中濃度を、当該化学物質等のばく露限界と比較してはならない。
  - 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - 化学反応のプロセス等の運転条件の変更、取り扱う化学物質等の形状の変更等によるリスクの低減措置は、機械設備等の防爆構造化、局所排気装置の設置等の対策よりも優先して実施されるべきである。
  answer: 3
  choice_notes: []
  explanation: '指針では、リスクの見積り方法の一つとして、作業環境測定などで測った化学物質等の気中濃度を、その物質のばく露限界と比較する方法が示されています。「比較してはならない」とする選択肢3は誤りです。


    気中濃度やばく露濃度をばく露限界と比べる方法、数理モデル（CREATE-SIMPLE など）を使う方法、マトリクスで見積もる方法など、指針の見積り方法は複数あります。'
