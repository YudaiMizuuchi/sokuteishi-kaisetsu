  stem: 騒音に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 人が聴くことのできる音の周波数は 20 Hzから 20,000 Hz程度までで、会話音域は 500Hzから 2,000 Hz程度までである。
  - 騒音性難聴は、騒音により内耳の前庭や半規管の機能に障害を受けることにより生じる。
  - 騒音性難聴の初期に認められる 4,000 Hz付近の音を中心とする聴力低下の型を c⁵dip という。
  - 等価騒音レベルは、時間的に変動する騒音レベルのエネルギー的な平均値を表す量で、変動する騒音に対する人間の生理・心理的反応とよく対応している。
  - 騒音は、自律神経系や内分泌系へも影響を与えるため、騒音ばく露により、交感神経の活動の亢進や副腎皮質ホルモンの分泌の増加が認められることがある。
