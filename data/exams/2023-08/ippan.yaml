  stem: 温熱環境及び熱中症に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 温度感覚を左右する環境条件は、気温、湿度及び気流の三要素によって決まる。
  - 相対湿度とは、空気中の水蒸気圧とその温度における飽和水蒸気圧との比を百分率で示したものである。
  - WBGT は、暑熱環境による熱ストレスの評価に用いられる指標で、日射がない場合は、自然湿球温度と黒球温度の測定値から算出される。
  - Ⅰ度の熱中症では、めまい、筋肉痛、筋肉の硬直などの症状が現れる。
