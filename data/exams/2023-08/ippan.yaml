  stem: 作業環境評価基準に定める「管理濃度」及び日本産業衛生学会の「許容濃度等の勧告」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度は、有害環境下での労働者の労働時間に関係なく、その作業場所の作業環境に対して用いられる。
  - 鉱物性粉じんの管理濃度は、遊離けい酸の含有率によって異なり、0.025 ～ 3 mg / m³の範囲にある。
  - 許容濃度等の勧告において、化学物質の許容濃度は、経皮吸収を考慮して定められている。
  - 許容濃度等の勧告において、生物学的許容値とは、生物学的モニタリング値がその勧告値の範囲内であれば、ほとんどすべての労働者に健康上の悪い影響が見られないと判断される濃度である。
  - 許容濃度等の勧告において、ヒトに対する発がん性については、第1群、第2群 A、第2群 B の3種類に分類されており、ヒトに対して発がん性があると判断できる物質は、第1群に分類されている。
  answer: 3
  choice_notes: []
  explanation: '日本産業衛生学会の許容濃度は、経皮吸収がないことを前提に定められた数値です。経皮吸収が無視できない物質には「皮」の表示を付けて、注意を促しています。「経皮吸収を考慮して定められている」とする選択肢3は誤りです。


    「皮」のある物質は、空気中の濃度が許容濃度以下でも、皮膚からの吸収によってばく露が大きくなるおそれがあります。


    令和3年度第1回 一般 問20でも、「許容濃度の値は、経皮吸収があることを考慮して定められている」が誤りの選択肢として出題されています。'
