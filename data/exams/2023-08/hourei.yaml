  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 指定作業場について作業環境測定を自ら行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  - 第2種作業環境測定士は、指定作業場についての作業環境測定の業務のうち、簡易測定機器以外の機器を用いて行う分析の業務を行うことができない。
  - 放射性物質取扱作業室について法令に基づき行う空気中の放射性物質の濃度の測定は、作業環境測定士ではない者に行わせることはできない。
  - 第2種酸素欠乏危険作業が行われる場所における硫化水素濃度の測定は、作業環境測定士でなければ行うことができない。
  - 指定作業場以外の作業場における作業環境測定については、作業環境測定士ではない者に行わせることができる。
  answer: 4
  choice_notes: []
  explanation: '第2種酸素欠乏危険作業を行う場所での硫化水素の濃度の測定は、指定作業場の作業環境測定ではないので、作業環境測定士でなくても行うことができます。選択肢4は誤りです。


    作業環境測定士でなければ行えないのは、指定作業場の作業環境測定だけです。放射性物質取扱作業室の空気中の放射性物質の濃度の測定は指定作業場の測定なので、測定士が行います（選択肢3）。'
  figures: []
  law_note: null
  _key_choice: 第2種酸素欠乏危険作業が行われる場所における硫化水素濃度の測定は、作業環境測定士でなければ行うことができない。
