  stem: 個人サンプリング法に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定機関が、事業場の委託を受けて指定作業場について個人サンプリング法による作業環境測定を実施する場合、作業環境測定機関として個人サンプリング法について登録を受け、かつ、個人サンプリング法について登録を受けた作業環境測定士にデザイン及びサンプリングを行わせなければならない。
  - 金属アーク溶接等作業を継続して行う屋内作業場において、当該作業の方法を変更しようとするときに行う空気中の溶接ヒュームの濃度の測定に係る試料空気の採取は、個人サンプリング法について登録を受けていない第1種作業環境測定士であっても行うことができる。
  - 低管理濃度特定化学物質の測定は、発散源の場所が一定しない作業が行われる単位作業場所に係るものであるか否かにかかわらず、全て個人サンプリング法によることができる。
  - 有機溶剤に係る測定のうち、発散源の場所が一定しない作業が行われる単位作業場所で行われるものは、有機溶剤の種類にかかわらず、全て個人サンプリング法の対象となる。
  - 個人サンプリング法では、作業に従事する労働者が常に動いているため、測定対象物質の発散源に近接する場所において作業が行われる単位作業場所においても、当該作業が行われる時間のうち、空気中の測定対象物質の濃度が最も高くなると思われる時間に、試料空気の採取を行う必要はない。
