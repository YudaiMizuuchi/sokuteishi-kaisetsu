  stem: 作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 気温が 28 ℃ をこえ、又はこえるおそれのある坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における気温を測定しなければならない。
  - 多量のドライアイスを取り扱う業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 溶融ガラスからガラス製品を成型する業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 多量の蒸気を使用する金属又は非金属の洗浄又はめっきの業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 鉱物の焙焼、又は焼結の業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  answer: 4
  choice_notes: []
  explanation: '多量の蒸気を使用する洗浄やめっきの業務を行う屋内作業場では、気温と湿度を測定しますが、ふく射熱の測定は求められていません。選択肢4は誤りです。


    ふく射熱の測定が必要なのは、溶融ガラスの成型や鉱物の焙焼・焼結のように、高温の熱源がある屋内作業場です。蒸気を使う作業は「湿度が高い」作業で、強いふく射熱源はありません。'
