  stem: 労働安全衛生規則に基づく雇入時の医師による健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 雇入時の健康診断において、医師による健康診断を受けた後3か月を経過しない者が、その健康診断結果を証明する書面を提出したときは、その健康診断の項目に相当する項目を省略することができる。
  - 雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 雇入時の健康診断の項目のうち、聴力の検査は、1000 Hz及び 4000 Hz の音について行わなければならない。
  - 雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 事業場において実施した雇入時の健康診断の結果、健康診断項目に異常の所見があると診断された労働者については、健康を保持するために必要な措置について、健康診断を実施した日から3か月以内に、医師から意見聴取を行わなければならない。
  answer: 2
  choice_notes: []
  explanation: '貧血検査や肝機能検査などを、医師が必要でないと認めるときに省略できるのは、**定期**健康診断の場合です。雇入時の健康診断では、これらの項目を省略することはできないので、選択肢2は誤りです。


    雇入時の健康診断は、その人の健康状態の基準を把握するためのものなので、項目を省略しないのが原則です。3か月以内に受けた健康診断の結果を出せば省略できる（選択肢1）のは、別の規定です。'
  figures: []
  law_note: null
  _key_choice: 雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができ
