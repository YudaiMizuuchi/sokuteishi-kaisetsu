  - 空気中のシクロヘキサノールの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中のシクロヘキサノンの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中のメチルイソブチルケトンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中のメチル-ノルマル-ブチルケトンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  answer: 5
