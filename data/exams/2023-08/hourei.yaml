  stem: 労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 常時300 人以上の労働者を使用する製造業の事業場では、その事業の実施を統括管理する者を総括安全衛生管理者として選任しなければならない。
  - 事業場の規模、業種にかかわらず、衛生工学衛生管理者免許を有する者を衛生管理者として選任することができる。
  - 塩酸、硝酸、硫酸、その他これらに準ずる有害物を取り扱う業務に、常時500人以上の労働者を従事させる事業場では、その事業場に専属の産業医を選任しなければならない。
  - 作業環境測定を外部の作業環境測定機関に委託して実施している場合、当該作業環境測定を実施している作業環境測定士を衛生委員会の委員として指名しなければならない。
  - 衛生委員会の議長は、原則として、総括安全衛生管理者又は総括安全衛生管理者以外の者で事業場においてその事業の実施を統括管理するもの若しくはこれに準ずる者のうちから事業者が指名した委員がなるものとされている。
  answer: 4
  choice_notes: []
  explanation: '衛生委員会の委員に指名**できる**のは、当該事業場の労働者で作業環境測定を実施している作業環境測定士です。外部の作業環境測定機関の測定士を委員として指名しなければならない、とする選択肢4は誤りです。


    衛生委員会は事業場の労働者で構成するものなので、外部の人はそもそも委員になりません。令和5年度第2回でも、「指名しなければならない」が誤りとして出題されています。'
  figures: []
  law_note: null
  _key_choice: 作業環境測定を外部の作業環境測定機関に委託して実施している場合、当該作業環境測定を実施している作業環境測定士を衛生委員会の委員として指名しなければならない。
