  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点における測定対象物質の濃度が、その測定で採用した試料採取方法及び分析方法で求められる定量下限の値に満たない場合には、当該定量下限の値をその測定点の測定値とみなして、管理区分の区分を行う。
  - 2種類以上の有機溶剤を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を当該測定点における測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - A 測定の評価値は、1作業日について測定した場合と連続する2作業日について測定した場合とでは異なった計算式により計算する。
  - A 測定と B 測定を行った場合、B 測定の測定値が管理濃度の 1.5 倍を超えている単位作業場所の管理区分は、A 測定の結果にかかわらず第3管理区分となる。
  - 鉱物性粉じんの管理濃度は、当該粉じんの遊離けい酸含有率が高いほど大きくなる。
  answer: 5
  choice_notes: []
  explanation: '鉱物性粉じんの管理濃度は、遊離けい酸の含有率が高いほど**小さく**なります。「大きくなる」とする選択肢5は誤りです。


    遊離けい酸は肺を線維化させる作用が強いので、含有率が高い粉じんほど、管理濃度を厳しく（小さく）します。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんの管理濃度は、当該粉じんの遊離けい酸含有率が高いほど大きくなる。
