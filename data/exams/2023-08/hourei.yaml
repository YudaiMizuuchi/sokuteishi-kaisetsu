  explanation: 'メチル-ノルマル-ブチルケトンは第2種有機溶剤なので、作業環境測定の記録の保存期間は**3年間**です。30年とする選択肢5は誤りです。


    メチルイソブチルケトンは、発がん性のおそれから特別有機溶剤（特定化学物質）に移されており、記録は30年間保存します（選択肢4）。名前の似た2つのケトンで、区分が違う点が罠です。'
