  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の A 測定において、直接捕集方法により試料空気を採取する場合、採取時間は、10分間以上の継続した時間としなければならない。
  - 寒冷の屋内作業場における気温及び湿度の測定の測定点は、単位作業場所について、当該単位作業場所の中央部の床上50 cm以上150 cm以下の位置に、1以上としなければならない。
  - 騒音の測定において、音源に近接する場所において作業が行われる単位作業場所にあっては、当該作業が行われる時間のうち、騒音レベルが最も大きくなると思われる時間に、当該作業が行われる位置において測定を行わなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについての一酸化炭素の含有率の測定における測定点は、建築物の室の中央部の床上 75 cm以上120 cm以下の位置に、1以上としなければならない。
  - 第1種酸素欠乏危険作業に係る作業場の酸素濃度の測定における測定点は、作業場における空気中の酸素の濃度の分布の状況を知るために適当な位置に、5以上としなければならない。
  answer: 1
  choice_notes: []
  explanation: 'A 測定で直接捕集方法により試料空気を採取する場合は、1つの測定点での採取時間を10分間以上とする必要はありません。「10分間以上の継続した時間としなければならない」とする選択肢1は誤りです。


    10分間以上の例外になるのは、直接捕集方法、検知管方式、相対濃度指示方法などです。事務所の一酸化炭素の測定点が「室の中央部の床上 75 cm 以上 120 cm 以下に1以上」（選択肢4）であることも押さえておきましょう。'
  figures: []
  law_note: null
  _key_choice: 有害物質のA測定において、直接捕集方法により試料空気を採取する場合、採取時間は、10分間以上の継続した時間としなければならない。
