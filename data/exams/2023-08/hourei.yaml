  stem: 次の業務に労働者を常時就かせるとき、法令に基づく安全又は衛生のための特別の教育を行わなければならないものはどれか。
  choices:
  - 廃棄物の焼却施設において焼却灰を取り扱う業務
  - レーザー光線による金属加工の業務
  - 特定化学物質を製造する業務
  - 鉛ライニングの業務
  - 有機溶剤等を用いて行う洗浄の業務
  answer: 1
  choice_notes: []
  explanation: '廃棄物の焼却施設で焼却灰を取り扱う業務は、ダイオキシン類のばく露防止のための特別教育の対象です。よって答えは（1）です。


    特定化学物質の製造、鉛ライニング、有機溶剤による洗浄は、作業主任者の選任で管理する業務で、特別教育の対象ではありません。'
  figures: []
  law_note: null
  _key_choice: 廃棄物の焼却施設において焼却灰を取り扱う業務
