  stem: 有機溶剤の性質及び人体に対する影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩素系有機溶剤は、一般に、水より密度が大きく、蒸気密度も空気よりも大きい。
  - トリクロロエチレンは、水に難溶の有機溶剤で、腎臓がん、肝臓がんなどを引き起こす。
  - エチレングリコールモノメチルエーテル（メチルセロソルブ）は、ヒトに対して生殖毒性を示すことが知られている。
  - N,N-ジメチルホルムアミドは、水溶性を有する有機溶剤で、ばく露により、頭痛、めまい、肝機能障害などがみられる。
  - 二硫化炭素は、急性ばく露では精神障害を生じ、低濃度長期ばく露では動脈硬化を進行させ、また、腎臓や肝臓に対する発がん性がある。
  answer: 5
  choice_notes: []
  explanation: '二硫化炭素は、急性ばく露では精神障害（興奮、幻覚など）を起こし、低濃度・長期のばく露では動脈硬化を進め、網膜の微細動脈瘤などを生じます。しかし、腎臓や肝臓に対する発がん性がある物質とはされていません。選択肢5は誤りです。


    二硫化炭素の特殊健康診断で眼底検査を行うのは、網膜の血管の変化をみるためです。「二硫化炭素 ＝ 精神障害・動脈硬化・網膜」と覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 二硫化炭素は、急性ばく露では精神障害を生じ、低濃度長期ばく露では動脈硬化を進行させ、また、腎臓や肝臓に対する発がん性がある。
