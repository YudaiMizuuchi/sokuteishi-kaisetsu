  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の経皮吸収には、皮膚の表皮を透過して真皮の毛細血管に至る経路と、毛孔や汗孔から侵入する経路があるが、水溶性物質は、主に毛孔や汗孔から体内に侵入する。
  - 体内に取り込まれた有機溶剤の代謝に要する時間は長く、有機溶剤にばく露しても尿中の代謝物はすぐには増加しないため、採尿は、有機溶剤業務終了後、24時間以上経過してから行うようにする。
  - トルエンが代謝されると、馬尿酸として尿中に排泄されるが、清涼飲料水やマーガリンなどに食品添加物として含まれている安息香酸を摂取すると、同様に馬尿酸として尿中に排泄されるため、トルエンのばく露評価に当たっては注意を要する。
  - ナフタレンは、体内で代謝されて、1-ナフトール又は2-ナフトールとして尿中に排泄される。
  - 鉛の生物学的モニタリングの指標として、尿中の δ-アミノレブリン酸がある。
  answer: 2
  choice_notes: []
  explanation: '多くの有機溶剤は、体内で比較的速く代謝されて尿中に出てきます。そのため、有機溶剤等健康診断の尿の採取は、作業が続いた週の後半の、その日の作業終了時（終業時）に行うのが基本です。業務終了から24時間以上たってから採尿するとする選択肢2は誤りです。


    時間がたつと代謝物は尿中から減ってしまい、実際のばく露を正しく反映できなくなります。採尿のタイミングは、ばく露をとらえるための大切な条件です。'
  figures: []
  law_note: null
