  stem: 化学物質とその水溶液等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化水素は、水、メタノール、エタノールに易溶で、水溶液を塩酸といい、皮膚腐食性や眼に対する重篤な損傷性がある。
  - 硫化水素の水溶液を硫酸といい、高濃度のものが皮膚に接触すると化学熱傷を生じる。
  - 二酸化炭素の水溶液を炭酸水といい、弱酸性を示し、また、1気圧下で気体の二酸化炭素の温度を下げていくと、液体とはならず固体であるドライアイスとなる。
  - 水酸化カルシウムの飽和水溶液を石灰水といい、強いアルカリ性を示し、皮膚や粘膜、眼の角膜や結膜を損傷させる。
  - ホルムアルデヒドを40％程度含む水溶液をホルマリンといい、通常、ホルムアルデヒドの重合防止のためメタノールが加えられており、防腐剤などとして利用される。
  answer: 2
  choice_notes: []
  explanation: '硫化水素の水溶液は「硫化水素水」で、弱い酸性を示します。硫酸は、三酸化硫黄が水と反応してできる別の物質（H₂SO₄）なので、選択肢2は誤りです。


    名前が似ていても、硫化水素（H₂S）と硫酸（H₂SO₄）はまったく別の物質です。硫化水素は、主に吸入による中毒（呼吸麻痺など）が問題になります。'
  figures: []
  law_note: null
  _key_choice: 硫化水素の水溶液を硫酸といい、高濃度のものが皮膚に接触すると化学熱傷を生じる。
- num: 6
  status: published
  chapters:
  - toxicity
  traps:
  - gn-toxicity-08
  rank: null
  summary: null
  stem: 化学物質等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 高分圧の酸素の毒性によって生じる障害を酸素中毒といい、症状は主に中枢神経系と肺に現れ、急性症状として現れるのは、吐き気、めまい、視野狭窄、けいれん発作、昏睡等の中枢神経系の症状である。
  - 一酸化炭素は、酸素よりも血液中のヘモグロビンと結合しやすいため、吸入すると体内の各組織への酸素の運搬を阻害する。
  - 二酸化硫黄による慢性中毒では、慢性気管支炎、歯牙酸蝕症などがみられる。
  - アクリロニトリルによる健康障害では、皮膚の剝離、末梢神経炎などがみられ、低濃度・長期ばく露では、レイノー現象がみられる。
  - ニトログリコールは、血管を拡張させる作用があり、頭痛、めまい、悪心、動悸、血圧低下などを生じるが、ばく露が継続した後に急に中断されると、冠血管の収縮により、狭心症様の症状を生じる。
  answer: 4
  choice_notes: []
  explanation: 'レイノー現象（指が白くなる発作）が低濃度・長期ばく露でみられるのは、塩化ビニルです。アクリロニトリルの健康障害は、皮膚に触れたときの水疱や、蒸気を吸入したときの頭痛・めまいなどの中枢神経症状などで、レイノー現象を起こす物質としては扱われていません。選択肢4は誤りです。


    塩化ビニルは、レイノー現象のほか、指の骨が溶ける指端骨溶解や、肝血管肉腫も起こします。「塩化ビニル ＝ レイノー・指端骨溶解・肝血管肉腫」とまとめて覚えましょう。'
  figures: []
  law_note: null
  _key_choice: アクリロニトリルによる健康障害では、皮膚の剝離、末梢神経炎などがしょうみられ、低濃度・長期ばく露では、レイノー現象がみられる。
