  stem: 金属及びその化合物による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - カドミウム中毒では、上気道炎、肺炎、腎機能障害などがみられる。
  - ヒ素中毒では、角化症、黒皮症などの皮膚障害、鼻中隔穿孔などの障害がみられる。
  - ベリリウム中毒では、溶血性貧血、尿の赤色化などの症状がみられる。
  - マンガンの慢性中毒では、神経質になるなどの精神症状のほか、歩行障害、発語障害、筋緊張亢進といった症状がみられる。
  - クロム酸や重クロム酸は、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって肺がんなどを生じる。
  answer: 3
  choice_notes: []
  explanation: 'ベリリウムの代表的な健康障害は、肺に肉芽腫ができる慢性ベリリウム肺（ベリリウム症）や、皮膚炎です。溶血性貧血や尿の赤色化（血色素尿）は、ヒ化水素（アルシン）による中毒の特徴なので、選択肢3は誤りです。


    金属は、代表的な障害を1つずつ押さえます。カドミウムは腎障害、ヒ素は皮膚障害と鼻中隔穿孔、マンガンはパーキンソン病に似た神経症状、6価クロムは潰瘍と肺がん、ベリリウムは肺の肉芽腫です。'
  figures: []
  law_note: null
  _key_choice: ベリリウム中毒では、溶血性貧血、尿の赤色化などの症状がみられる。
