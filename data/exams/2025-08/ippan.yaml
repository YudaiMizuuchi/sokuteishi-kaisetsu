  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」で定められた危険有害性クラスのうち、次の絵表示が示すものでないものは下のうちどれか。ただし、絵表示の枠は赤色とする。
  choices:
  - 急性毒性
  - 生殖細胞変異原性
  - 発がん性
  - 特定標的臓器毒性（反復ばく露）
  - 誤えん有害性
  answer: 1
  choice_notes: []
  explanation: '図の絵表示は「健康有害性」（人の上半身に星形の模様）で、呼吸器感作性、生殖細胞変異原性、発がん性、生殖毒性、特定標的臓器毒性、誤えん有害性を表します。急性毒性は、区分1〜3が「どくろ」、区分4が「感嘆符」で表されるので、この絵表示が示すものではありません。よって答えは（1）です。


    「どくろ ＝ 急性毒性（重い）」「感嘆符 ＝ 急性毒性（軽い）・刺激性」「健康有害性 ＝ 長期的・重大な健康影響」と、3つの健康系の絵表示を使い分けで覚えましょう。'
  figures:
  - file: 2025-08-ippan-02-1.png
    alt: 問2の図
  law_note: null
  _key_choice: 急性毒性
