  stem: リスクアセスメントに関する次の記述のうち、誤っているものはどれか。ただし、指針とは、厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」をいう。
  choices:
  - CREATE-SIMPLE は、あらゆる業種に向けたリスクアセスメント支援ツールで、リスク低減措置の検討も支援しており、どのような措置を講じればリスクが低減されるかを確認することができる。
  - ECETOC TRAは、欧州化学物質生態毒性及び毒性センター（ECETOC）が開発した数理モデルで、作業の種類、対象物質の性状、換気条件などのばく露に関する情報と許容濃度等を入力すると、推定ばく露濃度の計算とリスク判定が実行される。
  - 指針では、リスクの見積り方法として、厚生労働大臣が定める濃度の基準値が設定されている物質については、当該濃度の基準値と個人ばく露測定により測定した当該物質の濃度を比較する方法、があげられている。
  - 指針では、リスクの見積りに当たっては、リスクアセスメントの対象の業務に従事する労働者の疲労等、危険性又は有害性への付加的影響については考慮しないこと、とされている。
  - 指針では、リスク低減措置の検討及び実施に当たっては、機械設備等の密閉化や局所排気装置の設置等の衛生工学的対策よりも、危険性又は有害性のより低い物質への代替や化学反応のプロセス等の運転条件の変更を優先して行うこと、とされている。
  answer: 4
  choice_notes: []
  explanation: '指針では、リスクの見積りに当たって、労働者の疲労などの危険性又は有害性への付加的な影響を**考慮する**こととされています。「考慮しない」とする選択肢4は誤りです。


    同じ濃度のばく露でも、疲労や長時間労働などが重なると健康影響が大きくなることがあるので、リスクを見積もるときはこうした要素も含めて考えます。'
