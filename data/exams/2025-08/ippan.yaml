  stem: 化学物質Ⓐとそれによってヒトに生じる主要ながんⒷとの次の組合せのうち、誤っているものはどれか。
  choices:
  - ニッケル化合物 ／ 鼻腔がん
  - 無機水銀化合物 ／ 肺がん
  - 塩化ビニル ／ 肝臓がん
  - ジクロロメタン ／ 胆管がん
  - マゼンタ ／ 膀胱がん
  answer: 2
  choice_notes: []
  explanation: '無機水銀化合物について、ヒトに肺がんを起こすという知見は確立していません。無機水銀の主な健康障害は腎障害などです。選択肢2は誤りです。


    ほかの組合せは、職業がんの代表例です。ニッケル化合物の鼻腔がん、塩化ビニルの肝臓がん（肝血管肉腫）、ジクロロメタンの胆管がん、マゼンタの膀胱がんを、物質とがんの部位の対応で覚えましょう。'
