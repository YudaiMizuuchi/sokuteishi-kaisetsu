  rank: null
  summary: null
  stem: 化学物質による健康影響及びその管理指標等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ばく露限界とは、ほとんど全ての労働者がばく露されても健康に影響を受けないと考えられている濃度又は量のしきい値をいう。
  - ACGIH（米国産業衛生専門家会議）が勧告する TLV- C（天井値）は、瞬間的にでも超えてはならない上限値である。
  - 1回又は短時間ばく露したときに発現する毒性を急性毒性といい、その指標としては、無影響量（NOEL）や無毒性量（NOAEL）などがある。
  - 催奇形性試験は、化学物質による胎児の臓器・組織形成への影響をみるためのものである。
  - 発がん性のスクリーニング試験には、細菌を用いる変異原性試験や哺乳類培養細胞を用いる染色体異常試験がある。
  answer: 3
  choice_notes: []
  explanation: '無影響量（NOEL）や無毒性量（NOAEL）は、繰り返しばく露したときに影響が現れない量を表す指標で、慢性毒性（反復投与毒性）の評価に用いられます。急性毒性の指標は、半数致死量（LD₅₀）や半数致死濃度（LC₅₀）です。選択肢3は誤りです。


    「急性 ＝ 1回で死ぬ量（LD₅₀）」「慢性 ＝ 繰り返しても影響が出ない量（NOAEL）」と、指標が何を見ているかで区別しましょう。'
  figures: []
  law_note: null
  _key_choice: １回又は短時間ばく露したときに発現する毒性を急性毒性といい、その指標としては、無影響量（NOEL）や無毒性量（NOAEL）などがある。
