- num: 8
  status: published
  chapters:
  - dust-disease
  traps:
  - gn-dust-disease-04
  rank: null
  summary: null
  stem: 粉じん及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 「吸引性（インハラブル）粉じん」には「吸入性（レスピラブル）粉じん」が含まれるが、「吸入性（レスピラブル）粉じん」の方が、呼吸器の深部まで到達する。
  - 経気道的に取り込まれ、肺胞内に達した粉じんは、体液に可溶性のものは毛細血管に溶出するなどにより徐々に排出されるが、難溶性のものは体外に排出されにくく、有害作用が長期にわたって持続する。
  - 鉱物性粉じんは、粉じん中の遊離けい酸の含有率が高いほど有害性が大きくなるため、その管理濃度は、遊離けい酸含有率が高くなるほど小さくなるように設定されている。
  - 中皮腫は、心膜、胸膜、腹膜などの中皮細胞に生じる原発性のがんであるが、石綿により発症する中皮腫は、胸膜の中皮細胞にのみ生じる。
  - 木材粉じんは、ヒトに対してぜんそくを起こし、また、鼻腔がんや副鼻腔がんを引き起こすとされている。
  answer: 4
  choice_notes: []
  explanation: '石綿による中皮腫は、胸膜だけでなく、腹膜や心膜などの中皮細胞にも生じます。「胸膜の中皮細胞にのみ生じる」とする選択肢4は誤りです。


    石綿による疾病は、石綿肺、肺がん、中皮腫（胸膜・腹膜など）、良性石綿胸水、びまん性胸膜肥厚です。中皮腫は、ばく露から数十年たって発症するのが特徴です。'
  figures: []
  law_note: null
  _key_choice: 中皮腫は、心膜、胸膜、腹膜などの中皮細胞に生じる原発性のがんであるが、石綿により発症する中皮腫は、胸膜の中皮細胞にのみ生じる。
