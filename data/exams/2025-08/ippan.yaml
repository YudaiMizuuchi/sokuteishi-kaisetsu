  - A 測定の第1評価値とは、単位作業場所において考え得る全ての測定点の作業時間における気中有害物質の濃度の実現値のうち、高濃度側から5％に相当する濃度の推定値をいい、第1管理区分となるためには、第1評価値が管理濃度より小さくなければならない。
  - 許容濃度は、作業中のばく露濃度の変動の幅があまり大きくない場合に利用される。
