  stem: 作業環境空気（25 ℃、1気圧）中の硫化水素濃度を測定するため、捕集液4.0 mL に0.10 L･min⁻¹ の流量で試料空気を10 分間吸引した。試料を捕集した溶液のうち3.0 mL について発色操作を行い、その吸光度をブランクを対照として測定したところ 0.125 であった。硫化水素濃度が、0.25 µg･mL⁻¹の標準溶液について同様の操作を行って測定した吸光度は 0.400 であった。硫化水素の作業環境空気中の濃度として、正しい値に最も近いものは次のうちどれか。ただし、硫化水素の分子量は 34.1、捕集率は 100％とする。
  columns: null
  choices:
  - 0.016 ppm
  - 0.022 ppm
  - 0.16 ppm
  - 0.22 ppm
  - 1.6 ppm
  answer: 4
  choice_notes: []
  explanation: '次の順で計算します。


    1. 試料液の濃度：標準溶液（0.25 µg/mL）の吸光度が0.400、試料液の吸光度が0.125なので、試料液の硫化水素濃度は 0.25 × 0.125／0.400 ＝ 0.0781 µg/mL

    2. 捕集液4.0 mL中の量：0.0781 × 4.0 ＝ 0.3125 µg

    3. 吸引した空気の量：0.10 L/min × 10 min ＝ 1.0 L

    4. 濃度：0.3125 µg ÷ 1.0 L ＝ 0.3125 µg/L ＝ 0.3125 mg/m³

    5. ppmに換算（25℃、1気圧）：0.3125 × 24.45／34.1 ≒ 0.22 ppm


    よって（4）です。'
