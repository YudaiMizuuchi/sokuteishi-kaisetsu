  stem: 直接捕集法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集瓶による捕集では、あらかじめコックの開き具合を一定にして、試料空気吸引に要する時間を測定しておく。
  - 真空捕集瓶のコックのすり合わせ部には、グリースの使用を避ける。
  - 捕集袋の内容積は、試料採取から分析までに要する時間とその間の濃度減衰を考慮して、1L 以上とする。
  - 試料空気から水分を取り除く場合には、ガラス管に無水硫酸カルシウム粒などの乾燥剤を詰めて、試料採取口の前に接続する。
  - 電動ポンプを通して、捕集袋内に試料空気を送り採取する方法の場合、ポンプ内の吸着に注意する必要がある。
  answer: 3
  choice_notes: []
  explanation: null
