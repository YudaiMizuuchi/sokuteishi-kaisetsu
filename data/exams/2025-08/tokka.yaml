  stem: 次の化学物質のうち、可視部の吸光光度分析法で定量する場合に発色操作を必要としないものはどれか。
  columns: null
  choices:
  - マゼンタ
  - クロロメチルメチルエーテル
  - トルエンジイソシアネート（TDI）
  - エチレンイミン
  - p-ニトロクロロベンゼン
  answer: 1
  choice_notes: []
  explanation: 'マゼンタ（オーラミンと同じ塩基性色素）は、**それ自体が色素**なので、発色操作を行わず、ろ紙に捕集した試料をメタノールで溶出して、そのまま吸光度を測定できます。


    クロロメチルメチルエーテル（4-(p-ニトロベンジル)ピリジンとアンモニア水で発色）、トルエンジイソシアネート（誘導体化して発色）、エチレンイミン（ナフトキノンスルホン酸と反応して発色）、p-ニトロクロロベンゼンは、いずれも発色操作が必要です。


    よって（1）です。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
