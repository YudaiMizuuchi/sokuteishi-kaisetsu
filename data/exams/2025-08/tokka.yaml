  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 吸光度は、入射光の強度に依存しない。
  - 吸光度 0.3 では、入射光の 30 ％ が試料液に吸収される。
  - 可視部の測定の光源には、ハロゲンタングステンランプ又はタングステンランプが用いられる。
  - 石英セルはガラスセルに比べて、紫外光の吸収が少ない。
  - 通常、分析には、吸収スペクトルの極大波長を用いる。
  answer: 2
  choice_notes: []
  explanation: '吸光度 A は、**A ＝ −log₁₀（透過率）**です。吸光度0.3のとき、透過率は 10⁻⁰·³ ≒ 0.5（50％）で、入射光の約**50％**が吸収されます。「30％が吸収される」とする選択肢2は誤りです。


    吸光度は、入射光と透過光の強度の比で決まるので、入射光の強度に依存しません。可視部の光源は、ハロゲンタングステンランプまたはタングステンランプです。石英セルは、ガラスセルより紫外光の吸収が少ないです。通常は、吸収スペクトルの極大波長を使います。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
