  stem: ミゼットインピンジャーを用いたシアン化ナトリウムの液体捕集-吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集液は水酸化ナトリウム溶液を用いる。
  - 捕集される粉じんは、粒径が小さくなるほど捕集率が低下する。
  - 標準原液のシアン化物イオン濃度は、硝酸銀溶液で滴定して求める。
  - シアン化ナトリウムを捕集した溶液は、塩酸で中和した後、発色操作を行う。
  - 発色操作には、クロラミン T とピリジン-ピラゾロンを用いる。
  answer: 4
  choice_notes: []
  explanation: 'シアン化ナトリウムの液体捕集-吸光光度分析法は、シアン化水素やシアン化カリウムと同じ方法で、次のとおりです。


    1. 水酸化ナトリウム溶液を捕集液にして、ミゼットインピンジャーで捕集します（選択肢1）。

    2. 捕集した溶液を、**酢酸**で中和します。「塩酸で中和する」とする選択肢4は誤りです。

    3. 緩衝液（pH6.8）で調整し、クロラミンTとピリジン-ピラゾロンで発色させます（選択肢5）。

    4. 標準原液のシアン化物イオン濃度は、硝酸銀溶液で滴定して標定します（選択肢3）。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
