  explanation: '捕集袋の内容積は、試料採取から分析までの時間とその間の濃度減衰を考慮して、**5 L以上**とします。「1 L以上」とする選択肢3は誤りです。5 L以上の袋を使うと、1測定あたりの捕集時間を10分にすることができます。


    真空捕集瓶は、コックの開き具合を一定にして、試料空気の吸引に要する時間をあらかじめ測定します。すり合わせ部には、グリースを使いません。試料空気から水分を除くときは、ガラス管に無水硫酸カルシウム粒などの乾燥剤を詰めて、試料採取口の前に接続します。電動ポンプで袋に送るときは、ポンプ内の吸着に注意します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
