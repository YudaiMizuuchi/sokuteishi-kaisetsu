  stem: 作業環境空気（25 ℃、1気圧）中のトルエンジイソシアネート（TDI）の濃度を測定するため、1.0 L･min⁻¹ で 10 分間試料空気を1-(2-ピリジル)ピペラジン（2-PP）含浸ろ紙に通気した。得られた TDI-2-PP誘導体を抽出液 4.0 mLで抽出し試料液とした。高速液体クロマトグラフで分析した結果、試料液中のこの誘導体の濃度は 0.15 µg･mL⁻¹ であった。作業環境空気中の TDI 濃度として、正しい値に最も近いものは次のうちどれか。ただし、TDI と TDI-2-PP誘導体のモル質量は、それぞれ 174 g･mol⁻¹ と501 g･mol⁻¹、ろ紙への捕集率は 100 ％ とし、TDI は全て2,4-TDI の形で存在しているものとする。
  columns: null
  choices:
  - 1 ppb
  - 2 ppb
  - 3 ppb
  - 4 ppb
  - 5 ppb
  answer: 3
  choice_notes: []
  explanation: '次の順で計算します。


    1. 試料液中の誘導体の量：0.15 µg/mL × 4.0 mL ＝ 0.60 µg

    2. TDIの量に換算：0.60 µg × 174／501 ≒ 0.208 µg（TDI 1分子が誘導体1分子になるとして、モル質量の比で換算）

    3. 吸引した空気の量：1.0 L/min × 10 min ＝ 10 L

    4. 濃度：0.208 µg ÷ 10 L ≒ 0.0208 µg/L ＝ 0.0208 mg/m³

    5. ppbに換算（25℃、1気圧）：0.0208 × 24.45／174 × 1000 ≒ 2.9 ppb


    よって（3）の3 ppbです。'
