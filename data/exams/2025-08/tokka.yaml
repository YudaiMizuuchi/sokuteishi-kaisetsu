  stem: 特定化学物質Ⓐとそのガスクロマトグラフ分析に用いる検出器Ⓑとの次の組合せのうち、不適当なものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - アクリロニトリル ／ 電子捕獲検出器（ECD）
  - アクリルアミド ／ フレーム熱イオン化検出器（FTD、TID）
  - 臭化メチル ／ 水素炎イオン化検出器（FID）
  - ナフタレン ／ 質量分析器（MS）
  - 硫酸ジメチル ／ 炎光光度検出器（FPD）
  answer: 1
  choice_notes: []
  explanation: 'アクリロニトリルのガスクロマトグラフ分析では、窒素を含む化合物に高感度な**フレーム熱イオン化検出器（FTD）**を使います。電子捕獲検出器（ECD）は、ハロゲンなど電子親和力の強い物質に高感度な検出器なので、アクリロニトリルとの組合せは不適当です。よって（1）です。


    硫酸ジメチルは、Porapak Nの捕集管に捕集し、**炎光光度検出器（FPD）**で分析します。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
