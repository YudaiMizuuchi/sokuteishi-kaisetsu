  stem: ガスクロマトグラフ分析法に用いられる固定相液体に関する次の記述の㋑から㋩までの［　］に入る語句の組合せとして、適切なものは下のうちどれか。「固定相として用いられる液体は、蒸気圧が［㋑］、かつ、分析対象物質に対して［㋺］があり、しかも反応性や熱分解性の低い液体が推奨される。この液体の一種であるポリエチレングリコールエーテルでは、重合度によって［㋩］が変化する。」
