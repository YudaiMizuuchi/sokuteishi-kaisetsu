  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 高速液体クロマトグラフィーの基本構成は、溶離液槽-送液ポンプ-試料導入装置-カラム-検出器-データ処理装置から成る。
  - 分離モードの選択は、分析対象物質の分子量、極性、溶媒に対する溶解性や解離性などの物性を考慮して決定する。
  - 分析対象物質の検出感度を向上させるために、誘導体化反応を利用することがある。
  - 逆相クロマトグラフィーでは、極性の高い成分から順に溶出する。
  - 逆相クロマトグラフィーでは、移動相より固定相の方が極性が高い。
  answer: 5
  choice_notes: []
  explanation: '逆相クロマトグラフィーでは、固定相の極性が**低く**（オクタデシル基など）、移動相の極性が**高い**（水系の溶媒）ので、移動相より固定相の方が極性が低くなります。「固定相の方が極性が高い」とする選択肢5は誤りです。そのため、極性の高い成分から先に溶出します。


    高速液体クロマトグラフは、溶離液槽、送液ポンプ、試料導入装置、カラム、検出器、データ処理装置から成ります。検出感度を上げるために、誘導体化反応を使うことがあります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
