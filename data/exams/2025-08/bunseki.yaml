  stem: ガスクロマトグラフ分析法において、カラムの長さを2倍にしたときのカラム特性に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 理論段相当高さは変化しない。
  - 理論段数は変化しない。
  - 分離度は √2 倍になる。
  - ピーク幅は √2 倍になる。
  - 保持時間は2倍になる。
  answer: 2
  choice_notes:
  - 正しい。理論段相当高さは、カラム1段あたりの長さなので変わらない。
  - 誤り。理論段数はカラムの長さに比例して2倍になる。
  - 正しい。分離度は理論段数の平方根に比例するので √2 倍。
  - 正しい。ピーク幅は √2 倍になる。
  - 正しい。保持時間はカラムの長さに比例して2倍。
  explanation: '理論段数は、カラムの長さを理論段相当高さで割ったものです。理論段相当高さはカラムの長さで変わらないので（選択肢1）、カラムを2倍の長さにすると、理論段数も2倍になります。「理論段数は変化しない」とする選択肢2は誤りです。


