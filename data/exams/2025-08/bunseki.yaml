  explanation: '核異性体転移は、エネルギーの高い状態の原子核が、γ 線を出して低い状態に移る現象です。陽子や中性子の数は変わらないので、質量数も原子番号も変化しません。選択肢5は誤りです。


    壊変の種類ごとの変化をまとめると、α 壊変は質量数 −4・原子番号 −2、β⁻ 壊変は原子番号 ＋1、β⁺ 壊変と軌道電子捕獲は原子番号 −1（いずれも質量数は変わらない）、核異性体転移はどちらも変わらない、です。'
