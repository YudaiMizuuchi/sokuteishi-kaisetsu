  stem: 空気中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - ブラウン運動している粒子の拡散係数は、絶対温度に比例する。
  - 空気中でブラウン運動する粒子の個数濃度が半減するのに要する時間は、初期濃度が 10 倍になれば約 10 倍となる。
  - 平衡帯電状態では粒子が大きいほど1個当たりの平均帯電量は多い。
  - 電界中での帯電している粒子の移動速度は、粒径が小さいほど大きい。
  - 遠心力場における粒子の移動速度は、角速度の二乗に比例する。
  answer: 2
  choice_notes: []
  explanation: 'ブラウン運動をする粒子が、互いに衝突して凝集する（凝集によって個数濃度が減る）とき、個数濃度が半減するのに要する時間は、初期濃度に**反比例**します。初期濃度が10倍になると、個数濃度が半減する時間は約**1/10**になります。「約10倍となる」とする選択肢2は誤りです。


    拡散係数は絶対温度に比例します。粒子が大きいほど、1個あたりの平均帯電量は多くなります。遠心力場における粒子の移動速度は、角速度の2乗に比例します。


    なお、「ブラウン運動する粒子の個数濃度が半減するのに要する時間は、濃度が1/10になれば約10倍となる」という記述は、令和3年度第1回の問題でも、正しい記述として出題されています。この問題の正誤は、出題実績にもとづいて判断しています。'
