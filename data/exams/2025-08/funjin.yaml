  stem: 粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 面積式流量計は、テーパー管と管内の浮子（フロート）との間隙の面積と、そこを流れる試料空気の体積流量が比例することを利用した流量計である。
  - ローボリウムエアサンプラーに用いる流量計の校正に用いる湿式ガスメーターは、押し込み方式では使用しない。
  - 絞り式流量計は、管内の絞り部分の上流側と下流側の圧力差が流量の二乗に比例することを利用した流量計である。
  - 絞り式流量計には、差圧を発生させる絞りとして、管路中にオリフィス板やベンチュリー管が設けられているものがある。
  - 20 L･min⁻¹ の流量で空気（25 ℃）を吸引する場合において、捕集装置の圧力損失が 25 kPa のとき、組み込まれた面積式流量計の指示値は約23 L･min⁻¹となる。
  answer: 2
  choice_notes: []
  explanation: 'ローボリウムエアサンプラーの流量計を較正するときに使う湿式ガスメーターは、**元来、押し込み方式で使用するように作られている**ので、押し込み方式で使います（使用にあたっては注意が必要です）。「押し込み方式では使用しない」とする選択肢2は誤りです。


    面積式流量計は、テーパー管と浮子の間隙の面積と、流れる空気の体積流量が比例することを利用します。絞り式流量計は、オリフィス板やベンチュリー管を管路中に置き、上流と下流の圧力差が流量の関係を示すことを利用します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
