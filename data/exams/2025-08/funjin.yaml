  stem: 密度 2.5 g・cm⁻³、粒径 4.0 µmの球形粒子の水中における自由落下の終末速度を測定して 8.7 × 10⁻⁴ cm・s⁻¹ を得た。このときの水の粘性係数として、正しい値に最も近いものは次のうちどれか。ただし、粒子の終末速度はストークスの式に従い、また、水の密度は 1.0 g・cm⁻³とする。
  columns: null
  choices:
  - 1.5 × 10⁻⁴ g・cm⁻¹・s⁻¹
  - 2.5 × 10⁻⁴ g・cm⁻¹・s⁻¹
  - 2.0 × 10⁻³ g・cm⁻¹・s⁻¹
  - 1.5 × 10⁻² g・cm⁻¹・s⁻¹
  - 2.5 × 10⁻² g・cm⁻¹・s⁻¹
  answer: 4
  choice_notes: []
  explanation: 'ストークスの式 v ＝ g × d² ×（ρ − ρ₀）／（18 η）を、粘性係数ηについて解きます。


    η ＝ g × d² ×（ρ − ρ₀）／（18 v）


    d ＝ 4.0 µm ＝ 4.0 × 10⁻⁴ cm、ρ − ρ₀ ＝ 2.5 − 1.0 ＝ 1.5 g/cm³、v ＝ 8.7 × 10⁻⁴ cm/s、g ＝ 980 cm/s² を代入すると、


    η ＝ 980 ×（4.0 × 10⁻⁴）² × 1.5 ／（18 × 8.7 × 10⁻⁴）≒ 2.35 × 10⁻⁴ ／ 1.566 × 10⁻² ≒ 1.5 × 10⁻² g/(cm・s)


    よって（4）です。'
