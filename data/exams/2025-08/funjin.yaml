  stem: 吸入性粉じん濃度の測定に用いられる分粒装置に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 分粒装置としては、多段平行板式分粒装置（重力沈降）か慣性衝突式分粒装置（慣性衝突）のいずれかを選択しなければならない。
  - 多段平行板式分粒装置を構成する平行板の一部を何らかの理由で欠損した状態で使用したときは、分粒装置を通過する粒子の50 ％分粒粒径は大きくなる。
  - 多段平行板式分粒装置の吸引流量を所定の流量より大きくすると、分粒装置を通過する粒子の 50 ％ 分粒粒径は大きくなる。
  - 慣性衝突式分粒装置の吸引流量を所定の流量より大きくすると、分粒装置を通過する粒子の 50 ％ 分粒粒径は小さくなる。
  - 慣性衝突式分粒装置では、分粒装置の衝突板に付着する粉じんが多くなると、分粒装置を通過する粒子の粒径は大きい方へ移行する。
