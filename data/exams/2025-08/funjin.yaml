  stem: 繊維状フィルターによる粉じんの捕集原理に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 慣性効果による捕集効率は、ろ過速度が小さいほど低くなる。
  - 重力効果による捕集効率は、ろ過速度が小さいほど高くなる。
  - さえぎり効果による捕集効率は、粒径が小さいほど低くなる。
  - 拡散効果による捕集効率は、粒径が大きいほど高くなる。
  - 捕集効率は、粒径 0.1 ～ 0.3 µm の付近で最も低くなる。
  answer: 4
  choice_notes: []
  explanation: '繊維層フィルターの捕集原理は、粒径とろ過速度によって、捕集効率が変わります。


    - **拡散効果**は、粒径が0.1 µmより小さい粒子で支配的で、粒径が**小さい**ほど捕集効率が**高く**なります。「粒径が大きいほど高くなる」とする選択肢4は誤りです。

    - 慣性効果は、ろ過速度が大きいほど、粒径が大きいほど、捕集効率が高くなります（選択肢1）。

    - 重力効果は、ろ過速度が小さいほど、粒径が大きいほど、捕集効率が高くなります（選択肢2）。

    - さえぎり効果は、粒径が大きいほど捕集効率が高くなり、小さいほど低くなります（選択肢3）。

    - どの効果もあまり効かない粒径0.1〜0.3 µm付近で、捕集効率が最も低くなります（選択肢5）。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
