  stem: 光散乱方式の相対濃度計の特性等に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 粒子の粒径が一定であっても、粉じんの種類が異なると相対濃度の値が同じになるとは限らない。
  - 同じ組成、同じ質量濃度の粉じんの場合、粒径 1 µm の粒子の方が 10 µmの粒子より相対濃度の値が大きい。
  - 数 µm の粒径の粒子による散乱光強度は、全方向においてほぼ一定である。
  - 0.1 µm より小さい粒子をほとんど検知しない。
  - 粒子による散乱光の強度は、粒子の屈折率によって異なる。
  answer: 3
  choice_notes: []
  explanation: '光散乱方式の相対濃度計では、粒子による散乱光の強さは、粒子の大きさ、屈折率、入射光の波長、散乱する角度に大きく依存します。微小な粒子（約0.3 µm以下）では、散乱光強度は弱く、角度による変動も少なくなります。**数µm以上の粒子では強い散乱光が観察され、散乱角によって強度の変動が大きく**なります。「全方向でほぼ一定」とする選択肢3は誤りです。


    同じ組成・同じ質量濃度の粉じんでは、粒径1 µmの粒子のほうが10 µmの粒子より個数が多く、相対濃度の値が大きくなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
