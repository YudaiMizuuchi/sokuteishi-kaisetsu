  stem: 光散乱方式の相対濃度計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 相対濃度計に付属する質量濃度変換係数は、平均粒径0.3µm のステアリン酸粒子で値付けられたものである。
  - 質量濃度変換係数は、同一物質の場合、粒径が大きくなるほど大きくなる。
  - 粉じんの質量濃度が同じであっても、粒度分布が異なると相対濃度計の測定値は同じにならない。
  - 質量濃度変換係数は、併行測定によって得られた質量濃度を相対濃度で除した値である。
  - 研磨作業場での質量濃度変換係数は、発生源の近くでは小さく、発生源から離れると大きくなる傾向がある。
  answer: 5
  choice_notes: []
  explanation: '質量濃度変換係数Kは、併行測定で得た質量濃度を相対濃度で割った値で、粒径、粒度分布、粉じんの種類によって変わります。粗い粒子が多いほど、同じ質量でも相対濃度の値（カウント数）が小さくなり、Kは**大きく**なります。研磨作業場では、発生源の近くに粗大粒子が多く、発生源から離れると、細かい粒子が多くなるので、Kは、発生源の近くでは**大きく**、離れると**小さく**なる傾向があります。選択肢5は、逆なので誤りです。


    相対濃度計に付属するKは、平均粒径0.3 µmのステアリン酸粒子で値付けられたものです。


    なお、研磨作業場での質量濃度変換係数が「発生源の近くでは大きく、離れると小さくなる傾向がある」という記述は、令和4年度第1回の問題でも、正しい記述として出題されています。この問題の正誤は、出題実績にもとづいて判断しています。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
