  stem: 次の記述の㋑及び㋺の［　］に入る語句の組合せとして、誤っているものは下のうちどれか。ただし、粒子の密度は空気の密度より十分大きいものとする。「 粒径 5 µm程度の球形粒子が空気中を落下する際の終末速度は、［㋑］に［㋺］する。」
  columns:
  - ㋑
  - ㋺
  choices:
  - 粒子の直径の二乗 ／ 比例
  - 粒子の密度 ／ 比例
  - 空気の密度の逆数 ／ 反比例
  - 重力加速度の逆数 ／ 反比例
  - 空気の粘性係数 ／ 反比例
  answer: 3
  choice_notes: []
  explanation: 'ストークスの式は、v ＝（ρ − ρ₀）× g × d² ／（18 η）です（ρは粒子の密度、ρ₀は空気の密度、gは重力加速度、dは粒子の直径、ηは空気の粘性係数）。粒子の密度が空気の密度より十分大きいときは、ρ − ρ₀ ≒ ρ なので、終末速度は、粒子の直径の2乗、粒子の密度、重力加速度に**比例**し、空気の粘性係数に**反比例**します。


    空気の密度は、粒子の密度に比べて無視できるほど小さいので、終末速度は、空気の密度の逆数に反比例しません。選択肢3は誤りです。


    （参考：『作業環境測定のための労働衛生の知識』）'
