  stem: 王水添加りん酸法により、石英含有率を求めるため、液相沈降法により10µm以下に粒度調整した試料 200.00 mg を王水及び熱リン酸で処理し、りん酸残渣として 45.25 mg を得た。このりん酸残渣を白金るつぼに移し、フッ化水素酸で処理したところ、ふっ化水素酸残渣 0.75 mg が得られた。この試料の石英含有率（％）として、正しい値に最も近いものは次のうちどれか。ただし、標準石英について求めたりん酸残渣率は95.0 ％であったものとする。
