  stem: 粉じんのろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - グラスファイバーフィルターは、メンブランフィルターに比べ空間率が大きい。
  - ろ過材を通して空気を吸引した場合におけるろ過材の圧力損失は、流速にほぼ比例する。
  - ろ過捕集に使用できるろ過材は、粒径 0.3 µm の粒子を 95％以上捕集する性能を有するものに限られる。
  - フッ素樹脂加工グラスファイバーフィルターは、加湿空気を通してもほとんど吸湿しない。
  - 多段平行板式分粒装置の 50 ％ 分粒粒径は、流量に比例する。
  answer: 5
  choice_notes: []
  explanation: '多段平行板式分粒装置は、重力沈降を利用します。平行板の間を通過する間に沈降する粒子が、板に捕集されます。粒子の沈降速度は、粒径の2乗に比例し、通過時間は流量に反比例するので、50％分粒粒径の2乗は、流量に比例し、**50％分粒粒径は、流量の平方根に比例**します。「流量に比例する」とする選択肢5は誤りです。


    ろ過材の圧力損失は、流速にほぼ比例します。グラスファイバーフィルターは、メンブランフィルターより空間率が大きいです。ろ過捕集に使えるろ過材は、粒径0.3 µmの粒子を95％以上捕集できるものに限られます。フッ素樹脂加工グラスファイバーフィルターは、ほとんど吸湿しません。'
