  stem: 空気調和されている室内に設置されている電子天秤を用いた試料の秤量操作等に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 粉じん濃度の測定には、読み取り限度 0.01 mg 以下の天秤を使用する。
  - 天秤の水平が保たれていない状態で秤量すると、秤量値は真値より小さくなる。
  - 周囲温度より温度の高い試料を秤量すると、秤量値は真値より小さくなる。
