    溶媒抽出に使う有機溶媒には、水と混ざり合う度合いが少ない、有機溶媒層の分離が容易、金属キレートに対する溶解度が大きい、燃やすときに炎が不安定にならない、といった性質が望ましいとされます。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
