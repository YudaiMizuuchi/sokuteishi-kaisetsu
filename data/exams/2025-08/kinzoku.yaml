  - 原子吸光分析法 ／ 原子固有の光の吸収
  - 誘導結合プラズマ発光分析法（ICP-AES） ／ 励起された原子及びイオンの発光
  - 誘導結合プラズマ質量分析法（ICP-MS） ／ イオン化された原子の質量
