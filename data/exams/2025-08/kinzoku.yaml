  stem: 誘導結合プラズマ発光分析法（ICP-AES）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 一般的に分析可能な元素の定量下限値が、誘導結合プラズマ質量分析法（ICP-MS）よりも高くなる。
  - プラズマはドーナツ構造で、側面部が中心部よりも高温である。
  - 同位体比を調べることができる。
  - 発光の観測（測光）方向は、軸方向と横方向がある。
  - 測定波長は、分光干渉を考慮して選択する必要がある。
  answer: 3
  choice_notes: []
  explanation: '同位体比を調べることができるのは、イオンを質量電荷比で分離して検出する**ICP-MS**です。ICP-AESは、原子やイオンの発光を測る方法なので、同位体比は調べられません。選択肢3は誤りです。


    ICP-AESは、一般にICP-MSより定量下限値が高く、プラズマはドーナツ構造をしています。発光の観測方向には、軸方向と横方向があります。測定波長は、分光干渉を考慮して選びます。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
