  explanation: '水銀の液体捕集法では、硫酸酸性の過マンガン酸カリウム溶液（吸収液）に捕集します（選択肢1）。捕集後の試料液に残った**過剰の過マンガン酸カリウム**は、**塩酸ヒドロキシルアミン**溶液で還元します。「塩化スズ(Ⅱ)溶液を用いる」とする選択肢4は誤りです。塩化スズ(Ⅱ)は、水銀(Ⅱ)を水銀原子に還元する試薬です。


