  stem: 金属元素の性質に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 金属元素の原子半径は、周期表の横の列（周期）にそって左から右へとしだいに増大する。
  - アルカリ土類金属の二価イオンのイオン半径は、周期表の縦の列（族）にそって上から下へとしだいに増大する。
  - アルカリ金属元素のイオン化エネルギーは、原子番号が大きくなるにつれて減少する傾向がある。
  - 金属元素の化合物の多くは、金属の酸化数が正である。
  - 同一金属の酸化物の水溶液は、金属の酸化数が大きくなるにつれて、酸性を示す傾向がある。
  answer: 1
  choice_notes: []
  explanation: '金属元素の原子半径は、同じ周期では、原子番号が大きくなるにつれて（左から右へ）、原子核の正電荷が増えて電子が引きつけられるため、**しだいに小さく**なる傾向があります。「しだいに増大する」とする選択肢1は誤りです。


    アルカリ土類金属の二価イオンのイオン半径は、上から下へ（電子殻が増えるため）増大します。アルカリ金属のイオン化エネルギーは、原子番号が大きくなるほど減少します。金属の化合物の多くは、金属の酸化数が正です。同じ金属の酸化物は、酸化数が大きいほど、水溶液が酸性を示す傾向があります（例：CrO₃は酸性、Cr₂O₃は両性、CrOは塩基性）。'
