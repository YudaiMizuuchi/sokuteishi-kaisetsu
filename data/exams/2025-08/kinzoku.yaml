  stem: N-ベンゾイル-N-フェニルヒドロキシルアミン（NBPHA）を用いる五酸化バナジウムの吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - リン酸が共存しても干渉は起こらない。
  - 試料の湿式灰化には、硝酸と過酸化水素水が用いられる。
  - NBPHA は、バナジウム（Ⅴ）と錯体を生成する。
  - バナジウムの NBPHA 錯体は、酸性溶液からクロロホルム層に抽出される。
  - 試料の捕集には、メンブランフィルターを用いる。
  answer: 2
  choice_notes: []
  explanation: '五酸化バナジウムの吸光光度分析法（NBPHA法）の手順は、次のとおりです。


    1. 試料は、メンブランフィルターに捕集します（選択肢5）。

    2. 試料を採取したフィルターに、**硫酸**を加えて加熱し、**過酸化水素水**で灰化します。「硝酸と過酸化水素水を用いる」とする選択肢2は誤りです。

    3. 酸性溶液に、N-ベンゾイル-N-フェニルヒドロキシルアミン（NBPHA）のクロロホルム溶液を加えて、バナジウム(Ⅴ)の錯体を抽出します（橙黄色、440 nm付近）（選択肢3、4）。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
