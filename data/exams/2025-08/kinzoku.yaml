  stem: 水素化物発生原子吸光分析法によるヒ素の分析に関する次の記述の㋑から㋩までの［　］に入る語句の組合せとして、正しいものは下のうちどれか。「石英繊維フィルターに捕集した試料を硝酸と硫酸の混酸で処理し、溶液化した。その溶液に1％ヨウ化カリウム溶液と［㋑］溶液を加え30 分間静置した。この溶液を反応フラスコに移し亜鉛末懸濁液を加え試料溶液中のAs（Ⅲ）イオンを還元し［㋺］を発生させた。［㋺］をアルゴンガスとともに水素炎に送り込み 193.70 nmの［㋩］を測定した。」
  columns:
  - ㋑
  - ㋺
  - ㋩
  choices:
  - 水素化ホウ素ナトリウム ／ アルシン ／ 吸光度
  - 水素化ホウ素ナトリウム ／ アルシン ／ 発光強度
  - 水素化ホウ素ナトリウム ／ スチビン ／ 発光強度
  - 塩化スズ（Ⅱ） ／ アルシン ／ 吸光度
  - 塩化スズ（Ⅱ） ／ スチビン ／ 吸光度
  answer: 4
  choice_notes: []
  explanation: 'ヒ素の水素化物発生原子吸光分析法の手順は、次のとおりです。


    1. 石英繊維フィルターに捕集し、混酸で処理して溶液にします。

    2. 1％ヨウ化カリウム溶液と**塩化スズ(Ⅱ)**溶液を加えて静置し、ヒ素を3価に還元します。

    3. 反応フラスコで、亜鉛末懸濁液を加えて、水素化ヒ素（**アルシン**）を発生させます。

    4. アルシンをアルゴンガスとともに水素炎に送り、193.70 nmの**吸光度**を測定します。


    よって（4）です。水素化ホウ素ナトリウムを用いるのは、別の連続水素化物発生装置の方法です。


