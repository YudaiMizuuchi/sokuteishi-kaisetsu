  stem: 電気加熱式原子吸光分析法における鉛の測定に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 水酸化アンモニウム-過酸化水素の添加は、塩化鉛の揮発を抑制するために行う。
  - 最も吸収が強い共鳴線は 217.0 nm である。
  - 217.0 nm の共鳴線より 283.3 nm の共鳴線の方が S / N 比が高い。
  - 共存物質が存在する場合は灰化温度を高くする。
  - 原子化温度を高くすると繰り返し精度が低下する。
  answer: 4
  choice_notes: []
  explanation: '電気加熱式原子吸光分析法による鉛の測定では、**灰化温度が高くとれない**ので、共存物質の影響を受けやすくなります。「共存物質があるときは灰化温度を高くする」とする選択肢4は誤りです。


    塩化鉛は、鉛の原子蒸気が生成するより先に分子の形で蒸発してしまうので、過酸化水素や水酸化アンモニウム-過酸化水素を加えて、その揮発を防ぎます（選択肢1）。最も吸収が強い共鳴線は217.0 nmで、283.3 nmの共鳴線のほうが、S/N比が高いので、実際の測定では283.3 nmが使われます（選択肢2、3）。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
