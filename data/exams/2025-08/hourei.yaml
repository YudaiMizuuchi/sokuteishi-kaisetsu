  stem: 常時1500人の労働者を使用する事業場における労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 総括安全衛生管理者を選任しなければならない。
  - 事業場に専属の産業医を選任しなければならない。
  - 衛生管理者を4人選任しなければならない。
  - 衛生管理者のうち1人を労働衛生コンサルタントである者としなければならない。
  - 衛生管理者のうち1人を専任の者としなければならない。
  answer: 4
  choice_notes: []
  explanation: '常時1,500人の労働者を使用する事業場では、総括安全衛生管理者と専属の産業医を選任し、衛生管理者を4人以上選任して、そのうち1人以上を専任とします。衛生管理者のうち1人を労働衛生コンサルタントとしなければならない、という定めはないので、選択肢4は誤りです。


    労働衛生コンサルタントは、衛生管理者を2人以上選任する場合に、1人に限って専属でなくてもよいとされる、という形で出てくる資格です。「しなければならない」ではなく「できる」の規定です。'
  figures: []
  law_note: null
  _key_choice: 衛生管理者のうち１人を労働衛生コンサルタントである者としなければならない。
