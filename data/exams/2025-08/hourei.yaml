  - 有害物質の B 測定で検知管方式による測定機器により測定する場合、一つの測定点における試料空気の採取時間の合計は、10分間未満でよい。
  - 有害物質の C 測定で試料空気を採取する場合、採取の方法にかかわらず、一人の労働者における試料空気の採取時間は、2時間以上でなければならない。
  - 有害物質の D 測定で試料空気を採取する場合、採取の方法にかかわらず、一人の労働者における試料空気の採取時間は、15分間でなければならない。
