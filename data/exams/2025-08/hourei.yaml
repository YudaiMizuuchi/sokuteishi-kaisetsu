  - 炭酸ガスが停滞するおそれのある坑内の作業場については、1か月以内ごとに1回、定期に、炭酸ガス濃度を測定し、その都度、所定の事項を記録して、これを3年間保存しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、2か月以内ごとに1回、定期に、浮遊粉じん量を測定し、その都度、所定の事項を記録して、これを3年間保存しなければならない。
  - 著しい騒音を発する屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定し、その都度、所定の事項を記録して、これを3年間保存しなければならない。
