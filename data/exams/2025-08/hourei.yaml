  stem: 法令に基づく作業環境測定等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 硫化水素を取り扱う屋内作業場における空気中の硫化水素濃度の測定は、作業環境測定士でなければ行うことができない。
  - 第2種酸素欠乏危険作業場所において、その日の作業を開始する前に行う空気中の硫化水素濃度の測定は、酸素欠乏危険作業主任者が行うこととされており、当該作業主任者は作業環境測定士でなくてもよい。
  - ホルムアルデヒドを取り扱う屋内作業場における空気中のホルムアルデヒド濃度の測定は、作業環境測定士でなければ行うことができない。
  - 空気調和設備を設けている場合における、室に供給される空気中のホルムアルデヒドの量の測定は、作業環境測定士でない者が行うことができる。
  - 放射性物質取扱作業室における放射性物質による表面汚染の測定は、作業環境測定士でなければ行うことができない。
  answer: 5
  choice_notes: []
  explanation: '作業環境測定士でなければ行えないのは、指定作業場の作業環境測定です。放射性物質取扱作業室については、空気中の放射性物質の濃度の測定が指定作業場の測定に当たりますが、表面汚染の測定はこれに含まれません。測定士でなければ行えないとする選択肢5は誤りです。


    硫化水素やホルムアルデヒドは特定化学物質の第2類物質なので、取り扱う屋内作業場の濃度の測定は指定作業場の測定で、測定士が行います。何が「指定作業場の測定」に当たるかで判断しましょう。'
  figures: []
  law_note: null
  _key_choice: 放射性物質取扱作業室における放射性物質による表面汚染の測定は、作業環境測定士でなければ行うことができない。
