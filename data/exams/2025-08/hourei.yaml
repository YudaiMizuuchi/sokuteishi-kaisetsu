  stem: 事業場における化学物質管理に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - リスクアセスメント対象物を製造し、又は取り扱う事業場においては、常時使用する労働者数が50人未満である場合を除き、化学物質管理者を選任しなければならない。
  - リスクアセスメント対象物を製造している事業場において選任する化学物質管理者は、厚生労働大臣が定める化学物質の管理に関する講習を修了した者又はこれと同等以上の能力を有すると認められる者でなければならない。
  - 化学物質管理者を選任した事業場において、リスクアセスメントの結果に基づく措置として、労働者に保護具を使用させるときは、保護具に関する知識及び経験を有すると認められる者のうちから、保護具着用管理責任者を選任しなければならない。
  - リスクアセスメント対象物のうち、厚生労働大臣が定めるものを製造し、又は取り扱う業務を行う屋内作業場においては、当該業務に従事する労働者が、これらの物にばく露される程度を、厚生労働大臣が定める濃度の基準以下としなければならない。
  - リスクアセスメントを行ったときは、所定の事項について、記録を作成し、次にリスクアセスメントを行うまでの期間又は3年間のいずれか長い期間、これを保存しなければならない。
  answer: 1
  choice_notes: []
  explanation: '化学物質管理者は、リスクアセスメント対象物を製造し、または取り扱う事業場で、**労働者数にかかわらず**選任しなければなりません。50人未満の事業場を除くとする選択肢1は誤りです。


    50人という数字は、衛生管理者や産業医の選任で出てくる基準です。化学物質の自律的管理では、小さな事業場も含めて化学物質管理者の選任が求められています。'
  figures: []
  law_note: null
  _key_choice: リスクアセスメント対象物を製造し、又は取り扱う事業場においては、常時使用する労働者数が50人未満である場合を除き、化学物質管理者を選任しなければならない。
