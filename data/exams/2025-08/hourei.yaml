  stem: 作業主任者に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定を行うべき指定作業場で行われる作業のうち、特定粉じん作業においては、作業主任者を選任する必要はない。
  - 作業主任者は、作業の区分に応じ、都道府県労働局長の免許を受けた者又は都道府県労働局長の登録を受けた者が行う技能講習を修了した者のうちから選任しなければならない。
  - 作業主任者の選任は、作業主任者を選任すべき事由が発生した日から14日以内に行い、選任したときは、遅滞なく、所轄労働基準監督署長に報告しなければならない。
  - 作業の区分が同一である作業を同一の場所で行う場合において、当該作業に係る作業主任者を2人以上選任したときは、それぞれの作業主任者の職務の分担を定めなければならない。
  - 作業主任者を選任したときは、当該作業主任者の氏名及びその者に行わせる事項を作業場の見やすい箇所に掲示する等により関係労働者に周知させなければならない。
  answer: 3
  choice_notes: []
  explanation: '作業主任者を選任したときに、所轄労働基準監督署長へ報告する必要はありません。選任した作業主任者の氏名と行わせる事項は、作業場の見やすい箇所に掲示するなどして関係労働者に周知します。「14日以内に選任し、遅滞なく報告」とする選択肢3は誤りです。


    「14日以内に選任して報告」は、総括安全衛生管理者、衛生管理者、産業医などの選任で出てくる決まりです。作業主任者には当てはまりません。'
  figures: []
  law_note: null
  _key_choice: 作業主任者の選任は、作業主任者を選任すべき事由が発生した日から14日以内に行い、選任したときは、遅滞なく、所轄労働基準監督署長に報告しなければならない。
