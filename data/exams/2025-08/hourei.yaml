  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者が指定した医師が行う健康診断を受けることを希望しない労働者は、他の医師が行う健康診断を受け、その結果を証明する書面を事業者に提出しなければならない。
  - 労働者を海外に6か月以上派遣しようとするときは、あらかじめ、当該労働者に対し、医師による健康診断を行わなければならない。
  - 健康診断を受診した労働者の異常の所見の有無にかかわらず、事業場において健康診断を実施した日から3か月以内に、当該労働者の健康を保持するために必要な措置について、医師から意見聴取を行わなければならない。
  - 健康診断個人票は、雇入時の健康診断に係るもの、定期健康診断に係るもののいずれについても、5年間保存しなければならない。
  - リスクアセスメント対象物を取り扱う業務に常時従事する労働者に対しては、定期健康診断のほか、リスクアセスメント対象物に係るリスクアセスメントの結果に基づき、関係労働者の意見を聴き、必要があると認めるときは、医師又は歯科医師が必要と認める項目について、医師又は歯科医師による健康診断を行わなければならない。
  answer: 3
  choice_notes: []
  explanation: '健康診断の結果について医師から意見を聴くのは、**異常の所見があると診断された労働者**についてです（健康診断が行われた日から3か月以内）。「異常の所見の有無にかかわらず」とする選択肢3は誤りです。


    異常の所見がない人まで個別に意見を聴く必要はなく、所見がある人について、就業上の措置が必要かどうかを医師に判断してもらう仕組みです。'
