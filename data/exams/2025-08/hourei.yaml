  stem: 個人サンプリング法に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 有機溶剤及び特別有機溶剤の濃度の測定は、測定対象物質の種類及び作業方法にかかわらず、個人サンプリング法の対象となる。
  - 特別有機溶剤を除く特定化学物質の濃度の測定のうち、個人サンプリング法の対象となるのは、管理濃度が厚生労働大臣が定める値以下のものである。
  - 金属アーク溶接等作業を行う屋内作業場における空気中の溶接ヒュームの濃度の測定は、個人サンプリング法の登録を受けていない作業環境測定士であっても行うことができる。
  - 常時特定粉じん作業を行う屋内作業場における空気中の粉じん濃度の測定は、遊離けい酸の含有率が極めて高いものを除き、個人サンプリング法の対象となる。
  - 粉じん作業を行う坑内作業場における空気中の粉じん濃度の測定は、個人サンプリング法の登録を受けていない作業環境測定士であっても行うことができる。
  answer: 2
  choice_notes: []
  explanation: '個人サンプリング法の対象となる特定化学物質は、管理濃度の値で一律に決まっているわけではありません。対象とする物質は物質ごとに定められていて、令和の改正で範囲が広げられています。「管理濃度が一定値以下のもの」とする選択肢2は誤りです。


    個人サンプリング法は当初、管理濃度が低い（有害性が高い）物質から導入されましたが、その後、対象が拡大されました。「管理濃度で決まる」という古い理解のままだと誤る問題です。


    個人サンプリング法の対象は、令和5年厚生労働省告示第174号（令和5年10月1日適用）で、粉じんやアクリロニトリル等15物質の特定化学物質などが追加されています。'
  figures: []
  law_note: null
  _key_choice: 特別有機溶剤を除く特定化学物質の濃度の測定のうち、個人サンプリング法の対象となるのは、管理濃度が厚生労働大臣が定める値以下のものである。
