  stem: 国内で製造され、使用される呼吸用保護具に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 一酸化炭素用防毒マスクは、厚生労働大臣が定める規格を具備しなければ、譲渡してはならない。
  - 硫化水素用防毒マスクは、厚生労働大臣が定める規格を具備しなければ、譲渡してはならないものに該当しない。
  - ハロゲンガス用防毒マスクは、型式検定合格標章が付されたものでなければ使用してはならない。
  - 使い捨て式防じんマスクは、厚生労働大臣の登録を受けた者が行う型式検定を受けなければならない。
  - 電動ファン付き呼吸用保護具は、厚生労働大臣の登録を受けた者が行う個別検定を受けなければならない。
  answer: 5
  choice_notes: []
  explanation: '電動ファン付き呼吸用保護具は、防じんマスクや防毒マスクと同じく、厚生労働大臣の登録を受けた者が行う**型式検定**の対象です。個別検定とする選択肢5は誤りです。


    個別検定は、一つひとつの製品を検定するもので、ボイラーの安全弁などが対象です。呼吸用保護具は型式ごとに検定する型式検定、と区別しておきましょう。'
  figures: []
  law_note: null
  _key_choice: 電動ファン付き呼吸用保護具は、厚生労働大臣の登録を受けた者が行う個別検定を受けなければならない。
