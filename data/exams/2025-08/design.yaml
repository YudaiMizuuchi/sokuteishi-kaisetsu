  stem: 正規分布及び対数正規分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 横軸を変数とし、縦軸を確率密度とすると、正規分布の曲線の形は、平均を中心として左右対称になる。
  - 正規分布の算術平均値及び標準偏差をそれぞれ μ 及び σ とすると、この分布に従う変数がμ-σからμ＋σ の範囲に入る確率は、およそ 68 ％ である。
  - 正規分布の算術平均値及び標準偏差をそれぞれ μ 及び σ とすると、この分布の 95 ％ 上限値は、μ ＋1.645 σ である。
  - 対数正規分布の幾何平均値と幾何標準偏差とは、異なる次元をもつ。
  - 正規分布の母平均と母分散は互いに独立ではない。
  answer: 5
  choice_notes: []
  explanation: '正規分布は、平均（母平均）と分散（母分散）の2つの値で形が決まり、この2つは互いに独立した値です。平均を変えても分散は変わらず、分散を変えても平均は変わりません。「互いに独立ではない」とする選択肢5は誤りです。


    作業環境の濃度分布では、濃度が高いほどばらつきも大きくなる傾向がありますが、それは対数正規分布で近似する理由の一つで、正規分布そのものの性質とは別の話です。'
  figures: []
  law_note: null
  _key_choice: 正規分布の母平均と母分散は互いに独立ではない。
