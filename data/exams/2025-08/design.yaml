  stem: 25 ℃、1気圧における環境空気中のエチルベンゼン（C₆H₅C₂H₅）の体積分率が 20 ppmであるとき、その質量濃度（mg･m⁻³）に最も近いものは、次のうちどれか。
  choices:
  - 20 mg･m⁻³
  - 52 mg･m⁻³
  - 87 mg･m⁻³
  - 95 mg･m⁻³
  - 104 mg･m⁻³
  answer: 3
  choice_notes: []
  explanation: 'ppm を mg/m³ に直すときは、ppm に分子量を掛けて、25℃・1気圧の気体 1 mol の体積 24.45 L で割ります。


    エチルベンゼン（C₆H₅C₂H₅）の分子量は、12 × 8 ＋ 1 × 10 ＝ 106 です。


    C [mg/m³] ＝ 20 × 106 ÷ 24.45 ≒ 87


    よって、最も近いのは 87 mg/m³ です。


    向きを逆にして 20 × 24.45 ÷ 106 と計算すると約 4.6 になり、どの選択肢にも合いません。「mg/m³ にするときは分子量を掛ける」と覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 87 mg・m⁻³
