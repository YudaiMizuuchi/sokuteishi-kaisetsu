  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の発散源とともに労働者が移動する作業では、B 測定を行う必要があるが、労働者の作業位置が変わるので、作業位置の移動に沿って測定を行う。
  - 濃度が最も高くなると思われる作業が、A 測定の実施時間内に行われない場合には、B 測定は A 測定の実施時間とは別に、その作業が行われる時間に実施してもよい。
  - 真空捕集瓶を用いる場合には、5本程度を目安とし、試料採取時間が10分に満たない場合には、10分の間に採取時間を均等に分布させ、各真空捕集瓶内の有害物質の濃度の算術平均値を測定値とする。
  - 一部の特定化学物質では、A 測定において分粒装置を用いるろ過捕集法によって捕集するが、最も高くなると思われる濃度を測定するための B 測定では分粒装置は使用しない。
  - B 測定で、10分間未満でしか作動できない相対濃度計を用いる場合は、1回あたりを同じ作動時間とする繰り返し測定により10分間作動させて、それぞれの測定値の算術平均値を B 測定値とする。
  answer: 4
  choice_notes: []
  explanation: 'B 測定も、A 測定と同じ方法で測るのが原則です。A 測定で分粒装置を用いる特定化学物質は、B 測定でも分粒装置を用いて捕集します。「B 測定では分粒装置は使用しない」とする選択肢4は誤りです。


    B 測定の値は A 測定の結果とあわせて管理区分の決定に使うので、測り方をそろえておく必要があります。方法が違うと、同じ物差しで比べられなくなります。'
  figures: []
  law_note: null
  _key_choice: 一部の特定化学物質では、A測定において分粒装置を用いるろ過捕集法によって捕集するが、最も高くなると思われる濃度を測定するためのB測定では分粒装置は使用しない。
