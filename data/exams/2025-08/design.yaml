  stem: A・B 測定の単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の行動範囲は考慮するが、その人数や作業時間を考慮する必要はない。
  - 同一の区域で、同一時間内に、塗料の調合の作業とそこで調合された塗料を用いる塗装作業が同時に行われている場合、作業が異なるので、異なる単位作業場所としなければならない。
  - 同一の区域でも、作業工程の進み具合などによって、他の時間帯に比べて有害物質の濃度が高かったり低かったりする時間帯が予測される場合には、それらの時間帯を他の時間帯と区別して、異なる単位作業場所とする。
  - 有害物質の濃度分布が予測できない場合には、当該作業場で働く労働者の行動範囲を単位作業場所の範囲としてよい。
  - 床面がグレーチング張りになっており、有害物質が上下階にわたり拡散している作業場所において、労働者が上下階を行き来しながら作業を行っていたので、上下階をあわせて一つの単位作業場所とした。
  answer: 2
  choice_notes: []
  explanation: '単位作業場所は、有害物質の濃度分布と労働者の行動範囲から決める「区域」です。同じ区域で同じ時間に行われていれば、塗料の調合と塗装のように作業の種類が違っても、一つの単位作業場所とすることができます。作業が異なるから別の単位作業場所に「しなければならない」とする選択肢2は誤りです。


    単位作業場所を分けるかどうかは、作業の名前ではなく、濃度の分布（区域や時間帯で濃度が違うか）で判断します。選択肢3のように、時間帯によって濃度が明らかに違えば、時間で分けることもあります。'
  figures: []
  law_note: null
  _key_choice: 同一の区域で、同一時間内に、塗料の調合の作業とそこで調合された塗料を用いる塗装作業が同時に行われている場合、作業が異なるので、異なる単位作業場所としなければならない。
