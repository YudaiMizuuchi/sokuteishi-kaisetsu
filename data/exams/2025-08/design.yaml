  stem: 固体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 固体捕集法で捕集できるのは、有機溶剤、特別有機溶剤及び 25 ℃、1気圧において液体である特定化学物質に限られる。
  - シリカゲルは、水分含有量により測定対象物質の吸着容量が大きく異なることがあるので、ガス状物質の捕集には、100 ～ 110 ℃ で約1時間加熱して活性化したものが使用される。
  - 活性炭は、その種類及び活性化の条件により吸着特性が異なるが、一般に、無極性有機溶剤に対する吸着力が強い。
  - ポーラスポリマービーズは、活性炭に比べ表面が不活性なため、捕集された不安定な化合物が化学反応で変化しにくい。
  - 捕集管の後層から測定対象物質が検出された場合には、破過が起こっている可能性がある。
  answer: 1
  choice_notes: []
  explanation: '固体捕集法は、有機溶剤や特別有機溶剤だけでなく、常温で気体の物質や、粒子と蒸気が混在する物質など、さまざまな物質の捕集に使われます。対象を液体の物質に限るとする選択肢1は誤りです。


    固体捕集法は、吸着剤や含浸剤を変えることで多くの物質に対応できる、作業環境測定で最も広く使われる捕集方法の一つです。'
