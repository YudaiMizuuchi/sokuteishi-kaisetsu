  - 分粒装置を用いたろ過捕集法及び重量分析法を用いて得られた粉じんの質量濃度が 1.5 mg･m⁻³ で、同時に行った光散乱方式の相対濃度計の60分間測定での計数値が 9000 カウントであった場合、質量濃度変換係数は0.01 mg･m⁻³･ cpm⁻¹である。
