  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点は、6m以下の等間隔で引いた縦の線と横の線との交点とするが、生産設備などと重なる交点がある場合には、その交点における縦の線又は横の線のいずれかの間隔を変えて引いた線の交点としてよい。
  - 単位作業場所が著しく狭く、かつ、単位作業場所における空気中の有害物質の濃度がほぼ均一であることが明らかな場合には、測定点の数を5未満とすることができる。
  - 測定点の数を5未満とすることができる単位作業場所であっても、各測定点で繰り返し測定を行うことにより測定値の総数を5以上とする必要があるが、この場合、各測定点における繰り返し測定の回数は同一でなければならない。
  - 測定点の高さは、作業中の労働者の呼吸域における有害物質の濃度を把握することを考慮し、床上 50 cm以上 150 cm以下とする。
  - 粉じんの相対濃度計を用いる場合には、一つの測定点における試料空気の採取時間は10分未満でよいが、1単位作業場所における全測定点の数を、10 分間を1測定点における試料空気の採取時間で除した値の数以上とする。
  answer: 1
  choice_notes: []
  explanation: 'A 測定の測定点は、6 m 以下の等間隔で引いた線の交点です。設備などと重なって測定できない交点は**除くだけ**で、線の間隔を変えて引き直すことはしません。選択肢1は誤りです。


    線をずらして交点を設備から外すと、測る人の判断で測定点の位置を動かすことになり、場を偏りなく代表させるという A 測定の考え方に反します。繰り返し出題されているAランクのひっかけパターンです。'
  figures: []
  law_note: null
  _key_choice: 測定点は、6 m以下の等間隔で引いた縦の線と横の線との交点とするが、生産設備などと重なる交点がある場合には、その交点における縦の線又は横の線のいずれかの間隔を変えて引いた線の交点としてよい。
