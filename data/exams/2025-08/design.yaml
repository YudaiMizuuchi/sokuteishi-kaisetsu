  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ろ過捕集法に用いるフィルターは、粒径が 0.3 µmの粒子に対し、95 ％以上捕集する性能を有するものでなければならない。
  - フィルターによる粒子の捕集率は、粒径が 0.1 µmよりも小さな粒子では、粒径が小さいほど大きく、粒径が 1 µmより大きな粒子では、粒径が大きいほど大きい。
  - ろ過捕集法に用いるフィルターには、メンブランフィルター、ガラス繊維フィルター、石英繊維フィルター、硫酸含浸フィルターがある。
  - メンブランフィルターには、セルローズメンブランフィルター、ナイロンメンブランフィルター、銀メンブランフィルターがある。
  - クロム酸、重クロム酸及びこれらの塩の捕集には、フッ素樹脂製又は塩化ビニル製のメンブランフィルターを用いる。
  answer: 3
