  explanation: 'o-フタロジニトリルは常温で固体の物質で、融点は約 140℃ です。ほかの4つ（アクリロニトリル、p-キシレン、1,4-ジオキサン、n-ヘキサン）は、常温で液体の有機溶剤なので、融点は最も高くて十数℃程度です。よって、融点が最も高いのは（4）です。


    物性の問題は、まず「常温で気体・液体・固体のどれか」を考えるのが近道です。常温で固体のものは、融点が常温より高いことがすぐに分かります。'
