  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石けん膜流量計は、所定の区間を石けん膜が移動する時間を測定して、所要時間とその区間の容積から流量を求めるものである。
  - 面積式流量計は、内径が下部より上部が大きくなっている垂直に立てた管に、浮子（フロート）を入れたものである。
  - 絞り式流量計は、管の途中に絞り弁を設置したもので、絞り弁の開口度から流量を求めるものである。
  - 面積式流量計の校正に、石けん膜流量計を用いることができる。
  - ハイボリウムエアサンプラーの流量計の校正は、ルーツメーターを用いて行うと精度よく行うことができるが、ルーツメーターによって校正された絞り式流量計を用いてもよい。
  answer: 3
  choice_notes: []
  explanation: '絞り式流量計（オリフィス流量計など）は、管の途中に設けた絞りの前後に生じる**圧力差**から流量を求めるものです。絞り弁の開き具合（開口度）から流量を求めるものではないので、選択肢3は誤りです。


    流量計は「何を測って流量に換算するか」で区別します。石けん膜流量計は体積と時間、面積式流量計は浮子の位置、絞り式流量計は圧力差です。'
  figures: []
