  explanation: '硫酸含浸フィルターは、フィルターに硫酸をしみ込ませて、アミン類などのガス状物質を化学反応で捕らえるものです。作業環境測定では固体捕集法に分類されるので、ろ過捕集法に用いるフィルターに含めた選択肢3は誤りです。


