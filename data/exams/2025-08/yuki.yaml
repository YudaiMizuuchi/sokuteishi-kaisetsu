  stem: ガスクロマトグラフ分析法の定量下限を求める次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 標準液を調製して検量線を作成する。
  - 管理濃度の1/10倍の標準ガスを捕集して得られる最終試料濃度になるように調製した標準試料を分析する。
  - 標準試料を5回以上繰り返し分析し、得られた測定濃度から標準偏差を求める。
  - 標準偏差の10倍に相当する濃度を検出下限、標準偏差の3倍に相当する濃度を定量下限とする。
  - 管理濃度の1/10倍濃度で得た最終試料液濃度が、分析機器の標準的な定量下限よりかなり高い場合は、定量下限は検量線作成時の最低濃度の標準液を用いて求めることが望ましい。
  answer: 4
  choice_notes: []
  explanation: 'ガスクロマトグラフ分析法の定量下限は、低濃度の標準試料を5回以上繰り返して分析し、標準偏差（σ）を求めて決めます。標準偏差の**10倍**（10σ）に相当する濃度が**定量下限**で、標準偏差の**3倍**（3σ）が**検出下限**です。選択肢4は、この関係が逆なので誤りです。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
