  stem: 有機溶剤の標準液の調製に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 標準液は、対象の標準物質を脱着溶媒で適切な濃度範囲内に希釈したものを用いる。
  - 液体の体積の正確な計量が必要な標準液の調製には、メスシリンダーやメスピペットを使用する。
  - 比較的高濃度の溶液を標準原液として冷暗所に保管し、検量線作成の都度、適切に希釈して標準系列液を調製する。
  - 標準原液の保存可能期間は、溶質と溶媒の組合せによって異なる。
  - 未知試料中の対象物質の濃度が、標準系列液の最高濃度と最低濃度の間になるように調製する。
  answer: 2
  choice_notes: []
  explanation: null
