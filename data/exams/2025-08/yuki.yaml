  stem: 受動型試料採取機器（パッシブサンプラー）を用いた有機溶剤の測定では、フィックの拡散法則に基づいた計算式により空気中濃度が算出される。フィックの拡散法則に基づき理論的に求めたサンプリング速度（cm³・min⁻¹）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 拡散係数（cm²・min⁻¹）は、物質によって異なる値である。
  - サンプリング速度は、拡散係数（cm²・min⁻¹）に比例する。
  - サンプリング速度は、拡散面断面積（cm²）に比例する。
  - サンプリング速度は、拡散長（cm）に比例する。
  - サンプリング速度は、実験により求めた値とは異なる場合がある。
  answer: 4
  choice_notes: []
  explanation: 'フィックの拡散法則では、サンプリング速度は、拡散係数Dと拡散面断面積Aに**比例**し、拡散長Lに**反比例**します（速度＝D・A／L）。「拡散長に比例する」とする選択肢4は誤りです。


    拡散係数は物質によって異なり、理論値は、実験で求めた値と異なる場合があります。


    拡散の速度が、チューブの長さに反比例し、断面積に比例する関係は、拡散セルの式でも同様です。


    （参考：『作業環境測定ガイドブック5 有機溶剤関係』）'
