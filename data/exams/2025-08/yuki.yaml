    スプリット比は、カラムに導入される部分と排出される部分の比率です。スプリット注入法は、導入量が少ないので、スプリットレス注入法と比べて、低濃度成分の分析には向きません。一方、溶媒ピークの影響を受けにくく、ライナー内で気化した試料がカラムに入るまでの時間が短いという特徴があります。


