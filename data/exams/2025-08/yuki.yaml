  stem: 有機溶剤の測定に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 流量計の校正には、基準流量計として、石けん膜流量計を用いることができる。
  - 固体捕集法により試料を捕集する際に用いる電動ポンプの流量調整は、捕集管を接続した状態で行ってはならない。
  - 捕集管の活性炭量に比べて脱着溶媒の量が少ない場合、脱着率が低くなることがある。
  - 真空捕集瓶は、捕集瓶内の圧力を 1.33 kPa以下にしたものを使用する。
  - 真空捕集瓶のコックには、グリースは使用しない。
  answer: 2
  choice_notes: []
  explanation: '固体捕集法で、電動ポンプの流量を調整するときは、**捕集管を接続した状態で**行います。捕集管（活性炭管など）を通すと、空気が流れにくくなるので、接続しない状態で調整すると、実際の流量が設定からずれてしまうからです。「捕集管を接続した状態で行ってはならない」とする選択肢2は誤りです。


    真空捕集瓶は、瓶内の圧力を1.33 kPa以下にして使います。コックのすり合わせ部には、グリースを使いません。


    （参考：『作業環境測定ガイドブック5 有機溶剤関係』）'
