  stem: 作業者がメチルエチルケトンを含む塗料容器を持ち、移動しながら製品に塗装する作業を行っていたため、作業者に受動型試料採取機器（パッシブサンプラー）を装着して15分間のD 測定を実施した。測定終了後、2 mLの溶媒でメチルエチルケトンを脱着し、これを試料液とした。試料液のうち 2 µLをマイクロシリンジでガスクロマトグラフに導入して分析したところ、試料液の濃度は10.5 µg･mL⁻¹であった。D 測定値として、正しい値に最も近いものは次のうちどれか。ただし、サンプリング速度：12 cm³･min⁻¹、メチルエチルケトンのモル質量：72.1 g･mol⁻¹、脱着率：0.9 とする。また、25 ℃、1気圧下とする。
  columns: null
  choices:
  - 22 ppm
  - 44 ppm
  - 66 ppm
  - 88 ppm
  - 110 ppm
  answer: 2
  choice_notes: []
  explanation: 'パッシブサンプラーの測定値は、次の順で求めます。


    1. 脱着液中の量：10.5 µg/mL × 2 mL ＝ 21 µg

    2. 脱着率0.9で補正：21 ÷ 0.9 ≒ 23.3 µg

    3. 捕集した空気の見かけの体積：12 cm³/min × 15 min ＝ 180 cm³ ＝ 0.18 L

    4. 濃度：23.3 µg ÷ 0.18 L ≒ 130 µg/L ＝ 130 mg/m³

    5. ppmに換算（25℃、1気圧）：130 × 24.45／72.1 ≒ 44 ppm


    よって（2）です。（ガスクロマトグラフに導入した2 µLは、濃度の計算には使いません。）'
