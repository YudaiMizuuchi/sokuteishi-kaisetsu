  stem: ガスクロマトグラフ分析法に用いられる検出器に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 電子捕獲検出器（ECD）は、ニッケル63などから放出されるβ線を利用する方法で、ハロゲンを含む有機化合物の高感度検出に適している。
  - 水素炎イオン化検出器（FID）は、水素炎中で燃焼しイオン化する物質を検出する方法で、ほとんどの有機化合物及び無機化合物を検出できる。
  - 熱伝導度検出器（TCD）は、キャリアガスと対象物質蒸気の熱伝導度の差を利用した検出器で、物質選択性がない。
  - 質量分析計（MS）は、分子構造情報を収集でき、未知物質の同定が可能である。
  - 光イオン化検出器（PID）は、紫外線を照射して対象物質をイオン化し、イオン電流を検出する方法で、多くの有機化合物を高感度で検出できる。
  answer: 2
