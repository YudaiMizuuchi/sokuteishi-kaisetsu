  stem: 次の有機溶剤の組合せのうち、モル質量の値及び常温（25℃）での蒸気圧（hPa）の値のいずれもがⒷに比べⒶの方が大きいものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 酢酸エチル ／ トルエン
  - テトラヒドロフラン ／ n-ヘキサン
  - シクロヘキサノン ／ シクロヘキサノール
  - 酢酸メチル ／ メタノール
  - 2-ブタノール ／ イソプロピルアルコール
  answer: 4
  choice_notes: []
  explanation: 'モル質量と25℃での蒸気圧を比べます。


    - 酢酸メチル（モル質量74、蒸気圧 約230 hPa）とメタノール（32、約170 hPa）：どちらも酢酸メチルのほうが**大きい**ので、条件に合います。

    - 酢酸エチル（88）とトルエン（92）：酢酸エチルのモル質量のほうが小さいので、不適です。

    - テトラヒドロフラン（72）とn-ヘキサン（86）：同様に不適です。

    - シクロヘキサノン（98）とシクロヘキサノール（100）：同様に不適です。

    - 2-ブタノール（74）とイソプロピルアルコール（60）：2-ブタノールのほうが沸点が高く、蒸気圧は小さいので不適です。


    よって（4）です。（蒸気圧とモル質量の数値は、一般的な化学便覧の概数です。）'
