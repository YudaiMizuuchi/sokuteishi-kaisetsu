  stem: 混合有機溶剤について検知管法の使用が認められている場合において、トルエン、酢酸エチル、1,1,1-トリクロロエタン及びキシレンを含有する混合溶剤を使用している単位作業場所内の併行測定点におけるトルエン用検知管の測定値は、15 ppmであった。一方、ガスクロマトグラフで分析した測定値は、トルエン 10 ppm、酢酸エチル 14 ppm、1,1,1-トリクロロエタン 8.0 ppm及びキシレン 4.0 ppmであった。換算値変換係数として、正しい値は次のうちどれか。なお、トルエン、酢酸エチル、1,1,1-トリクロロエタン及びキシレンの管理濃度は、それぞれ 20 ppm、200 ppm、200 ppm及び 50 ppmである。
  columns: null
  choices:
  - 0.0058 ppm⁻¹
  - 0.0115 ppm⁻¹
  - 0.0230 ppm⁻¹
  - 0.0460 ppm⁻¹
  - 0.0920 ppm⁻¹
  answer: 4
  choice_notes: []
  explanation: "換算値変換係数は、併行測定で、**換算値を検知管の指示値で割って**求めます。\n\n1. ガスクロマトグラフの結果から、換算値を求めます（作業環境評価基準第2条第4項）。換算値 ＝ Σ（各成分の濃度／その管理濃度）\n ＝ 10／20 ＋ 14／200 ＋ 8.0／200 ＋ 4.0／50 ＝ 0.5 ＋ 0.07 ＋ 0.04 ＋ 0.08 ＝ 0.69\n2. 換算値変換係数 ＝ 0.69 ÷ 15 ppm ＝ 0.046 ppm⁻¹\n\nよって（4）です。（キシレンの管理濃度は50 ppmです。）\n\n（参考：『作業環境測定ガイドブック5 有機溶剤関係』）"
