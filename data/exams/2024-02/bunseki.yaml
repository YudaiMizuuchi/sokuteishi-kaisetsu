  stem: 誘導結合プラズマ発光分析法（ICP-AES 法）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 代表的な装置の構成は高周波励起源部、発光部、試料導入部、分光測光部、データ処理部からなる。
  - 発光部のプラズマの温度は6000～10000 K程度である。
  - 試料導入部のネブライザーは、先端部が細いため、試料溶液中に不溶物がある場合はあらかじめろ過する。
  - 分光測光部はシーケンシャル型検出器とマルチ型検出器に大別されるが、いずれの形式でも多元素分析が可能である。
  - プラズマの観測方向には軸方向と横方向があり、高濃度の測定には軸方向観測が、低濃度の測定には横方向観測が適している。
  answer: 5
  choice_notes: []
  explanation: 'ICP 発光分光分析法のプラズマの観測方向は、軸方向観測の方が発光を長い光路で取り込むので感度が高く、**低濃度**の測定に適しています。横方向観測は、感度は下がるものの干渉が少なく、**高濃度**の測定に適しています。選択肢5は逆になっていて誤りです。


    軸方向（プラズマの炎を正面から見る）は光を多く集められる、横方向（横から見る）は余分な光が入りにくい、と見る向きのイメージで覚えましょう。


    ICP 発光分析法の軸方向観測は、アルゴンのバックグラウンドが低く横方向観測より高感度ですが、高濃度側で検量線が曲がりやすく、イオン化干渉も大きくなります（参考：『作業環境測定のための機器分析の実務［特定化学物質・金属類・有機溶剤］』（2019年 初版） 「分析法の種類」のICP発光分析法（観測方向））。'
  figures: []
  law_note: null
  _key_choice: プラズマの観測方向には軸方向と横方向があり、高濃度の測定には軸方向観測が、低濃度の測定には横方向観測が適している。
