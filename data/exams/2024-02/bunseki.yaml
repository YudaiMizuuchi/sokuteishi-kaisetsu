  stem: 液体のトルエン 3.0 mgを捕集袋内の清浄空気中で完全に気化させて、トルエンの標準ガス 100 Lを調製した。その濃度として、正しい値に最も近いものは次のうちどれか。ただし、トルエンのモル質量は92 g･mol⁻¹とし、気体定数を0.082 atm L mol⁻¹K⁻¹とする。また、調製した標準ガスの温度は 25 ℃、圧力は1気圧とする。
  choices:
  - 2 ppm
  - 4 ppm
  - 6 ppm
  - 8 ppm
  - 10 ppm
  answer: 4
  choice_notes: []
  explanation: 'トルエンの物質量を求め、25℃・1気圧での体積に直してから、100 L に対する割合を出します。


    トルエンの物質量 ＝ 3.0 × 10⁻³ g ÷ 92 g/mol ≒ 3.26 × 10⁻⁵ mol


    気体の体積 ＝ 3.26 × 10⁻⁵ mol × 0.082 × 298 L/mol ≒ 7.97 × 10⁻⁴ L


    濃度 ＝ 7.97 × 10⁻⁴ L ÷ 100 L ≒ 8.0 × 10⁻⁶ ＝ 8 ppm


    よって、最も近いのは（4）です。'
  figures: []
