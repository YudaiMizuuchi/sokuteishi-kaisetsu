  answer: 2
  choice_notes: []
  explanation: '同じ濃度の酸では、強酸で、1分子から出す水素イオンの数が多いほど pH が小さくなります。硫酸は2価の強酸なので、1価の強酸である硝酸より水素イオン濃度が大きく、pH が最も小さくなります。よって（2）です。


    酢酸、フッ化水素酸、炭酸は弱酸なので、同じ濃度では強酸より pH が大きくなります。令和7年度第1回でも、同じ型の問題が出ています。'
