  stem: データの取扱いに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 誤差とは、測定値の平均値と各測定値との差のことである。
  - 精度とは、分析値のバラツキの程度を示すものである。
  - 真度（正確さ）とは、分析を無限回繰り返したときに得られる平均値が真の値にどれだけ近いかを示すものである。
  - 精度と真度（正確さ）よりも迅速性を優先することがある。
  - 測定値のバラツキの大きさを示す場合は、測定値の平均値に標準偏差や不偏分散の平方根などを±をつけて表す。
  answer: 1
  choice_notes: []
  explanation: '誤差とは、測定値と**真の値（真値）**との差のことです。測定値の平均値と各測定値との差は「偏差」なので、選択肢1は誤りです。


    偏差はばらつきの計算（分散・標準偏差）に使う値で、誤差は真値からのずれです。真値は実際には分からないので、誤差は推定するしかありません。'
  figures: []
  law_note: null
  _key_choice: 誤差とは、測定値の平均値と各測定値との差のことである。
