  stem: 拡散セルを用いた標準ガスの調製に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 拡散セルに、複数の標準物質を入れて標準ガスの調製をすることはできない。
  - 拡散セル内の液面の高さにより標準ガスの濃度が変化するため、セル内に入れる試薬量は常に一定にする必要がある。
  - 標準ガスの濃度の微調整は、希釈空気の流量を変える方が拡散セルの温度を変えるよりも、短時間で行うことができる。
  - 標準ガスの濃度は、拡散セルの温度が高いほど高くなる。
  - 標準ガスの濃度は、拡散セルの拡散チューブの内径が大きいほど高くなる。
  answer: 2
  choice_notes: []
  explanation: '拡散セルからの標準物質の流出速度は、拡散チューブの内径や有効長、温度、物質の拡散係数・蒸気圧で決まり、液溜めの中の液面の高さではほとんど変わりません。液面の高さで濃度が変わるので試薬量を常に一定にする、とする選択肢2は誤りです。


    拡散セルで濃度を決めるのは、細い拡散チューブの中を蒸気が拡散する速さです。液溜めは、蒸気を飽和状態に保つための部分です。


    拡散セルの液体だめの表面では蒸気は飽和蒸気圧にあり、拡散チューブの出口までの間の濃度勾配で蒸気が移動します。拡散速度は、拡散チューブの長さに反比例し、断面積と飽和蒸気圧に比例します（参考：『作業環境測定のための機器分析の実務［特定化学物質・金属類・有機溶剤］』（2019年 初版） 「分析についての一般的事項」の拡散セルによる標準ガスの調製）。'
  figures: []
  law_note: null
  _key_choice: 拡散セル内の液面の高さにより標準ガスの濃度が変化するため、セル内に入れる試薬量は常に一定にする必要がある。
