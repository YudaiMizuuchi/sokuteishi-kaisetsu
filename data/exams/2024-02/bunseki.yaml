  stem: '次の熱化学反応式で示される溶液中での反応の平衡状態に関する下の記述のうち、誤っているものはどれか。


    A ＋ B ⇄ C ＋ q（q は熱エネルギーで q ＜ 0）


    ただし、平衡定数（K）は次の式で表される。


    K ＝ [C] ÷ ([A][B])'
  choices:
  - 平衡状態での正反応と逆反応の反応速度は等しい。
  - この反応は、温度を上げると左に進む。
  - この反応の平衡定数の単位は、mol⁻¹･L である。
  - 平衡定数は、平衡状態での物質の濃度から計算できる。
  - 平衡定数は、温度に依存する。
  answer: 2
  choice_notes: []
  explanation: '熱化学反応式の q が負（q ＜ 0）なので、右向きの反応は熱を**吸収する**反応（吸熱反応）です。温度を上げると、平衡は熱を吸収する向き、つまり**右**に移動します。「左に進む」とする選択肢2は誤りです。


    ルシャトリエの原理では、加えた変化をやわらげる向きに平衡が移動します。温度を上げれば熱を吸収する向き、下げれば熱を出す向きに進みます。q の符号から、どちらが吸熱かを最初に確かめましょう。'
  figures: []
  law_note: null
  _key_choice: この反応は、温度を上げると左に進む。
  _stem_head: 次の熱化学反応式で示される溶液中での反応の平衡状態に関する下の記述のうち、誤っているものはどれか。A+BC+q(qは熱エネルギーでq<0)ただし、平衡定数(K)は次の式で表される。K=\[C\]\[A\]\[B\]
