  stem: 次の記述のうち、誤っているものはどれか。
  choices:
  - アボガドロ定数の数の物質粒子（原子、分子、イオン等）の物質量は、1モルである。
  - 原子量は、¹²C の質量を基準として定められている。
  - 原子の質量数は、その原子が有する陽子数と電子数との和である。
  - 原子番号の順に元素を並べると、原子及び単体の諸性質に一定の周期性がある。
  - 中性の原子又は分子は、電子を失うと正に帯電する。
  answer: 3
  choice_notes: []
  explanation: '原子の質量数は、原子核に含まれる**陽子の数と中性子の数**の和です。電子は質量がとても小さく、質量数には含めません。「陽子数と電子数との和」とする選択肢3は誤りです。


    原子番号は陽子の数、質量数は陽子と中性子の数の和です。陽子の数が同じで中性子の数が違う原子が同位体です。'
  figures: []
