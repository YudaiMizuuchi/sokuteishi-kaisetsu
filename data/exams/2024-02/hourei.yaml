  stem: 法令により、定期に作業環境測定を行うべき作業環境測定対象Ⓐ、測定頻度Ⓑ及び記録の保存期間Ⓒの組合せとして、誤っているものはどれか。
  choices:
  - 空気中の放射性物質の濃度 ／ 1か月以内ごとに1回 ／ 5年
  - 空気中のフッ化水素の濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中の塩化ビニルの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中の鉱物性粉じんの濃度 ／ 6か月以内ごとに1回 ／ 7年
  - 空気中の鉛の濃度 ／ 1年以内ごとに1回 ／ 3年
  answer: 3
  choice_notes: []
  explanation: '塩化ビニルは特別管理物質に当たるので、作業環境測定の記録は**30年間**保存します。3年とする選択肢3は誤りです。


    塩化ビニルは、肝血管肉腫を起こす発がん性物質です。放射性物質は1か月以内ごと・5年、鉱物性粉じんは7年、鉛は1年以内ごと・3年と、例外的な組合せをまとめて覚えましょう。'
  figures: []
  law_note: null
  _key_choice: 空気中の塩化ビニルの濃度6か月以内ごとに1回3年
