  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 2種類以上の有機溶剤又は特別有機溶剤を含有する混合物を取り扱う単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - A 測定と B 測定を行った場合、B 測定の測定値が第1評価値の 1.5 倍を超えている単位作業場所の管理区分は、第3管理区分である。
  - A 測定と B 測定を行った場合、第2評価値が管理濃度を超えるときは、B 測定の測定値にかかわらず、第3管理区分に区分される。
  - A 測定のみを行った場合、第1評価値が管理濃度以上であり、かつ、第2評価値が管理濃度以下である単位作業場所の管理区分は、第2管理区分である。
  - 第1評価値及び第2評価値については、1作業日について測定した場合と連続する2作業日について測定した場合とでは計算式が異なる。
  answer: 2
  choice_notes: []
  explanation: 'A 測定と B 測定を行った場合、B 測定の測定値が**管理濃度**の1.5倍を超えると、A 測定の結果にかかわらず第3管理区分になります。比べる相手は第1評価値ではないので、選択肢2は誤りです。


    管理区分の判定で、B 測定値と比べるのは常に管理濃度（またはその1.5倍）です。第1評価値・第2評価値は A 測定の側の値で、B 測定値とは直接比べません。'
  figures: []
  law_note: null
  _key_choice: A測定とB測定を行った場合、B測定の測定値が第1評価値の1.5倍を超えている単位作業場所の管理区分は、第3管理区分である。
