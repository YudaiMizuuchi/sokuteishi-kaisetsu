  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、指定作業場の作業環境測定について、自ら使用する作業環境測定士に実施させることができない場合には、作業環境測定機関又は厚生労働大臣が指定する機関に委託しなければならない。
  - 第2種作業環境測定士は、指定作業場におけるキシレンの濃度の測定に関し、検知管方式による測定機器を用いた分析の業務を行うことができる。
  - 第2種作業環境測定士は、指定作業場における塩素の濃度の測定に関し、デザイン及びサンプリングの業務を行うことができる。
  - 中央管理方式の空気調和設備を設けている建築物の室における空気中に占める一酸化炭素及び二酸化炭素の含有率の測定は、作業環境測定士ではない者に行わせることができる。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
  answer: 5
  choice_notes: []
  explanation: '作業環境測定士でなければ行えないのは、指定作業場の作業環境測定です。放射線業務を行う管理区域の外部放射線による線量当量率などの測定は、指定作業場の測定には当たらないので、測定士に行わせなければならないものではありません。選択肢5は誤りです。


    放射線関係で指定作業場に当たるのは、放射性物質取扱作業室などの空気中の放射性物質の濃度の測定です。外部放射線の測定と区別しましょう。


    根拠：作業環境測定法施行令第1条第1項、作業環境測定法施行規則第1条。放射線業務に係る指定作業場は、電離放射線障害防止規則第53条第2号（放射性物質取扱作業室）と第2号の2（事故由来廃棄物等取扱施設）の作業場に限られ、管理区域の外部放射線の測定（同条第1号）は含まれていません。'
  figures: []
  law_note: null
  _key_choice: 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
