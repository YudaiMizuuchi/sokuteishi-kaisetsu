  stem: 法令に基づく安全又は衛生のための特別の教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - エックス線装置を用いて行う透過写真の撮影の業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - 特定化学物質を製造し、又は取り扱う業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
  - 特別の教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別の教育を省略することができる。
  answer: 4
  choice_notes: []
  explanation: '特定化学物質を製造し、または取り扱う業務は、特別教育の対象業務ではありません。選択肢4は誤りです。


    特定化学物質の業務は、技能講習を修了した特定化学物質作業主任者を選任して管理します。焼却灰の取扱い、酸素欠乏危険作業、エックス線による透過写真の撮影は、特別教育の対象です。'
  figures: []
  law_note: null
  _key_choice: 特定化学物質を製造し、又は取り扱う業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別の教育を行わなければならない。
