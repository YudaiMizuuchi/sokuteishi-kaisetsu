  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 鋲打ち機、はつり機、鋳物の型込機等圧縮空気により駆動される機械又は器具を取り扱う業務を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 多量の液体空気、ドライアイス等を取り扱う業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 第1種酸素欠乏危険作業に係る作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素の濃度を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、6か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: '事務所衛生基準規則で、中央管理方式の空気調和設備を設けた事務所の室について、一酸化炭素・二酸化炭素の含有率、室温・外気温、相対湿度を定期に測定するのは、**2か月以内ごとに1回**です。6か月以内ごととする選択肢5は誤りです。


    暑熱・寒冷の屋内作業場の気温・湿度や坑内の通気量は半月以内ごと、騒音は6か月以内ごと、事務所の空気環境は2か月以内ごと、と測定の種類ごとの頻度を整理しておきましょう。'
  figures: []
  law_note: null
  _key_choice: 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、6か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有
