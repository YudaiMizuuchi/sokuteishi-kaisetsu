  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 作業環境測定基準で定める一定の有機溶剤の濃度を測定する場合、当該有機溶剤以外の物が測定値に影響を及ぼすおそれがないときは、検知管方式による測定機器を用いて測定することができる。
  - 冷却凝縮捕集方法は、ガス状の放射性物質の試料採取方法の一つである。
  - 空気中の石綿の濃度の測定は、ろ過捕集方法及び計数方法によらなければならない。
  - ろ過捕集方法に用いるろ過材は、0.3 μm の粒子を 90 ％ 以上捕集する性能を有するものに限られる。
  answer: 5
  choice_notes: []
  explanation: 'ろ過捕集方法に用いるろ過材は、0.3 µm の粒子を **95 ％ 以上**捕集する性能を有するものでなければなりません。90 ％ 以上とする選択肢5は誤りです。


    令和7年度第1回のデザイン・サンプリングでも、95 ％ 以上が正しい記述として出題されています。'
  figures: []
  law_note: null
  _key_choice: ろ過捕集方法に用いるろ過材は、0.3μmの粒子を90%以上捕集する性能を有するものに限られる。
