  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 重量物の取扱い等重激な業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、医師による健康診断を行わなければならない。
  - 医師による定期健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 常時 50 人以上の労働者を使用する事業者が雇入時の健康診断を行った場合、その結果を所轄労働基準監督署長に報告しなければならない。
  - 硫酸のミストを発散する場所における業務に常時従事する労働者に対して、定期の歯科健康診断を行った場合、事業場の規模にかかわらず、その結果を所轄労働基準監督署長に報告しなければならない。
  answer: 4
  choice_notes: []
  explanation: '所轄労働基準監督署長への結果報告が必要なのは、常時50人以上の労働者を使用する事業者が行った**定期**健康診断です。雇入時の健康診断の結果は報告不要なので、選択肢4は誤りです。


    一方、硫酸などのミストを発散する場所での業務に従事する労働者の歯科健康診断（定期のもの）は、事業場の規模にかかわらず報告が必要です（選択肢5）。'
  figures: []
  law_note: null
  _key_choice: 常時50人以上の労働者を使用する事業者が雇入時の健康診断を行った場合、その結果を所轄労働基準監督署長に報告しなければならない。
