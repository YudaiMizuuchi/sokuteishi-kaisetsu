  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者の選任の特例はないものとする。
  choices:
  - 常時 1,200 人の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
  - 総括安全衛生管理者を選任する場合には、当該事業場においてその事業の実施を統括管理する者をもって充てなければならない。
  - 常時使用する労働者の数が 10 人以上 50 人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  - 常時 500 人を超える労働者を使用し、かつ、エックス線にさらされる業務に常時 30 人以上の労働者を従事させている事業場においては、衛生管理者のうち1人を衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。
  - 当該事業場の労働者で、作業環境測定を実施している作業環境測定士であるものを衛生委員会の委員として指名しなければならない。
  answer: 5
  choice_notes: []
  explanation: '衛生委員会には、事業場の労働者で作業環境測定を実施している作業環境測定士を、委員として指名することが**できる**とされています。指名しなければならない、とする選択肢5は誤りです。


    衛生委員会に必ず含めるのは、議長（総括安全衛生管理者など）、衛生管理者、産業医、衛生に関する経験を有する労働者です。作業環境測定士は「できる」の規定です。'
  figures: []
  law_note: null
  _key_choice: 当該事業場の労働者で、作業環境測定を実施している作業環境測定士であるものを衛生委員会の委員として指名しなければならない。
- num: 2
