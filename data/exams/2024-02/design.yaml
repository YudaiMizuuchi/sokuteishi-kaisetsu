  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の発生源の間隔が等間隔で配置されている場合は、測定点の縦又は横の線の間隔が発生源の間隔と一致しないようにする。
  - 測定点を決めるために引いた縦の線と横の線との交点のうち、設備などと重なり作業者の呼吸域とならない交点は、測定点としない。
  - 単位作業場所の有害物の濃度がほぼ均一であることが明らかな場合は、測定点は、6 m を超える等間隔で引いた縦の線と横の線との交点とすることができる。
  - 測定点の高さは、床上 50 cm以上 150 cm以下とする。
  - 測定時間が10分未満の検知管を使用する場合は、各測定点において複数の検知管を使用して10分間以上連続して測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: '検知管のように1回の測定時間が10分未満の方法では、1つの測定点で10分間以上連続して測定する必要はありません。複数の検知管を使って10分間以上にしなければならないとする選択肢5は誤りです。


    10分以上連続の例外は、検知管、相対濃度計、直接捕集方法です。B 測定で検知管を10分間に5本使うのは、B 測定値を「10分間の値」として求めるためで、A 測定の測定点の決まりとは別です。'
  figures: []
  law_note: null
  _key_choice: 測定時間が10分未満の検知管を使用する場合は、各測定点において複数の検知管を使用して10分間以上連続して測定しなければならない。
