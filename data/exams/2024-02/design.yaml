  stem: 作業環境測定における管理濃度に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度は、労働安全衛生法に基づく指標である。
  - 空気中の有機溶剤の体積分率 0.01 ％ は、100 ppm に相当する。
  - リフラクトリーセラミックファイバーの管理濃度の単位は、mg/m³である。
  - 有機溶剤の管理濃度は、体積分率（ppm）で表されている。
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が大きいほど小さな値となる。
  answer: 3
  choice_notes: []
  explanation: 'リフラクトリーセラミックファイバーの管理濃度は、石綿と同じく繊維の本数で表され、単位は**本/cm³** です。mg/m³ とする選択肢3は誤りです。


    管理濃度の単位は、ガス・蒸気は ppm、粉じんや金属などの粒子は mg/m³、繊維は本/cm³ と、物質の状態で決まります。'
  figures: []
  law_note: null
  _key_choice: リフラクトリーセラミックファイバーの管理濃度の単位は、mg/m3である。
