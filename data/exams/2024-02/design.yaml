  stem: 有害物質の物性に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石英は、遊離けい酸である。
  - フッ化水素の気体の密度は、空気より大きい。
  - コールタールは、常温・常圧で液体である。
  - 正長石は、遊離けい酸ではない。
  - アセトンは、n-ヘキサンよりも極性が高い。
  answer: 2
  choice_notes: []
  explanation: 'フッ化水素の分子量は約 20 で、空気の平均分子量（約 29）より小さいので、気体の密度は空気より**小さく**なります。選択肢2は誤りです。


    気体の密度は分子量に比例します。分子量が29より小さい気体（フッ化水素、アンモニア、メタンなど）は空気より軽く、大きい気体（硫化水素、塩素、多くの有機溶剤の蒸気など）は空気より重くなります。'
  figures: []
  law_note: null
  _key_choice: フッ化水素の気体の密度は、空気より大きい。
