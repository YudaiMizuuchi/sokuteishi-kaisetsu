  stem: 単位作業場所に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場内の気流や換気設備の稼働状況について考慮する必要がある。
  - トルエンによる抽出作業とキシレンによる抽出作業が同一の場所で別々に行われている作業場では、トルエンとキシレンの混合溶剤を使用する作業場とみなして一つの単位作業場所として設定することはできない。
  - 単位作業場所は、面積 20 m² 以下の作業場については設定することができない。
  - 粉じんの発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  - 同一建屋内に複数の単位作業場所を設定する場合、それぞれの単位作業場所の範囲が重なってもよい。
  answer: 3
  choice_notes: []
  explanation: '単位作業場所は、作業場の広さにかかわらず設定します。面積 20 m² 以下の作業場では設定できない、という定めはないので、選択肢3は誤りです。


    狭い作業場では、単位作業場所が著しく狭い場合の例外として、条件がそろえば測定点を5未満にすることができます。狭いことは測定点の数の問題で、単位作業場所を設定するかどうかとは関係ありません。'
  figures: []
  law_note: null
  _key_choice: 単位作業場所は、面積20m2以下の作業場については設定することができない。
