  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定は、当該単位作業場所の中で、有害物質の発散源に近接する場所において作業が行われる場合に、有害物質の濃度が最も高くなると考えられる作業位置とその時間に行う測定である。
  - B 測定は、A 測定を補完するための測定なので、全ての単位作業場所で実施する必要がある。
  - 発生源とともに労働者が移動しながら行う作業の場合には、労働者の作業位置が変わるので、B 測定は、作業位置の移動に沿って行う。
  - 5本の検知管を用いて B 測定を行った場合は、10分間に均等な時間間隔で測定した検知管指示値の算術平均値を測定値とする。
  - 粉じんのA測定において併行測定で質量濃度変換係数を求めた場合には、B測定においても同じ質量濃度変換係数を用いる。
  answer: 2
  choice_notes: []
  explanation: 'B 測定は、有害物質の発散源に近接する場所で作業が行われる単位作業場所で行う測定です。発散源の近くで作業がなければ行う必要はないので、全ての単位作業場所で実施が必要とする選択肢2は誤りです。


    B 測定は、A 測定では見落としやすい「発散源のすぐそばで作業する人の、最も高い濃度」を押さえるための測定です。その状況がなければ、補う必要もありません。'
  figures: []
  law_note: null
  _key_choice: B測定は、A測定を補完するための測定なので、全ての単位作業場所で実施する必要がある。
