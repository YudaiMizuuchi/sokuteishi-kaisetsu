  explanation: 'メンブランフィルターのポアサイズ（孔径）は、バブルポイント法で測った値で、フィルターの孔の大きさの目安です。実際には、拡散や慣性衝突などの作用で、ポアサイズよりずっと小さい粒子も捕集されるので、ポアサイズは「捕集できる粒子の大きさ」を表すものではありません。選択肢5は誤りです。


    フィルターは、ふるいのように孔より大きな粒子だけをこし取るものではありません。ポアサイズ 0.8 µm のフィルターでも、0.3 µm の粒子を高い率で捕集できます。'
