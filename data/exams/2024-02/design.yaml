  stem: ある作業場で騒音レベルの測定を行ったところ以下のような結果を得た。この単位作業場所（広さ 3 m ×10 m）の測定結果に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定の平均値は、84 dB である。
  - A 測定の標準偏差は、3 dB より小さい。
  - この単位作業場所は、著しく狭い作業場とみなすことができる。
  - この単位作業場所は、第Ⅱ管理区分に区分される。
  - この単位作業場所を次回測定する際は、測定点の数を5未満とすることができる。
  answer: 4
  choice_notes: []
  explanation: '騒音の A 測定平均値は、80 dB 未満の測定値を除いて算術平均します。78 dB を除いた7点の平均は、(86 ＋ 84 ＋ 82 ＋ 82 ＋ 84 ＋ 86 ＋ 84) ÷ 7 ＝ 84 dB です（選択肢1は正しい）。


    A 測定平均値は 85 dB 未満ですが、B 測定値が **90 dB** なので、管理区分は**第Ⅲ管理区分**になります。騒音では、A 測定平均値・B 測定値のどちらかが 90 dB 以上なら第Ⅲ管理区分です。第Ⅱ管理区分とする選択肢4は誤りです。


    騒音の管理区分は、85 dB と 90 dB の2つの境目で決まります。A 測定平均値と B 測定値のうち、悪い方で決まると覚えましょう。'
  figures:
