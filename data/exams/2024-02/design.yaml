  stem: 液体捕集法及び直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 液体捕集における捕集率は、捕集器具を2本直列につないで試料空気を吸引し、それぞれの器具に捕集された測定対象物質の量を測定することにより推定される。
  - 小型ガス吸収管によりキシレンを液体捕集する際、捕集液には精製水を用いる。
