  explanation: 'C 測定の試料空気の採取時間は、作業時間が2時間を超える場合でも、2時間を下回らない範囲でしか短縮できません。1時間とすることができるとする選択肢4は誤りです。


    1時間サイクルの作業でも、採取時間は2時間以上が必要です。D 測定の連続した15分間（選択肢5）、労働者が5人未満のときの時間の分割（選択肢3）とあわせて、C・D 測定の時間の決まりを整理しておきましょう。'
