  explanation: 'ポーラスポリマービーズは、活性炭に比べて表面が不活性なので、捕集した不安定な化合物が化学反応で変質しにくいのが長所です。「表面が不活性なため変質が起こりやすい」とする選択肢3は、理由と結果がかみ合っておらず誤りです。


    同じ論点は、令和6年度第2回・令和7年度第1回でも出題されています。「不活性 ＝ 反応しにくい ＝ 不安定な化合物に向く」とつなげて覚えましょう。'
