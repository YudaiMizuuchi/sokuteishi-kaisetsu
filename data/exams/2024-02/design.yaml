  stem: 測定誤差に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定誤差は、系統誤差、偶然誤差及び過失誤差に分けられる。
  - 検知管用真空法ガス採取器は、漏れ試験を行わずに測定を行うと、系統誤差を生じる可能性がある。
  - 系統誤差は、その原因を明らかにしても補正することができない。
  - 一つのサンプルを同一条件で繰り返して分析したときに、測定値がばらつくのは、偶然誤差である。
  - 偶然誤差は、一般に、測定値の標準偏差で表される。
  answer: 3
  choice_notes: []
  explanation: '系統誤差は、測定器の目盛りのずれや測定者のくせなど、一定の方向にかたよる誤差なので、原因が分かれば補正して取り除くことができます。「補正することができない」とする選択肢3は誤りです。


    同じ論点は令和7年度第2回でも出題されています。検知管のガス採取器の漏れ（選択肢2）のように、原因が分かれば対策できるのが系統誤差です。'
  figures: []
