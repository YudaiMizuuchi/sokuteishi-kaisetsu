  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 絞り式（オリフィス）流量計は、オリフィス板の上流側と下流側との間に生じる圧力差が流量と一定の関係にあることを利用している。
  - 面積式流量計は、テーパー管内の浮子が停止したとき、浮子とテーパー管の間隙の面積とそこを流れている流量とが比例することを利用している。
  - 捕集器具を取り付けない状態で流量校正した面積式流量計を捕集器具と吸引ポンプの間に接続して捕集すると、流量計の指示流量は、実際の流量よりも低くなる。
  - 脈動のため、流量計の指示の読み取りが難しい場合には、流量計と吸引ポンプの間に空気だめを設けるとよい。
  - 石けん膜流量計は、所定の距離を石けん膜が移動する時間を測定して流量を求める。
  answer: 3
  choice_notes: []
  explanation: '捕集器具を付けない状態で校正した面積式流量計を、捕集器具と吸引ポンプの間に接続すると、捕集器具の圧力損失のために流量計の部分の空気が減圧され、指示値は実際の流量よりも**高く**なります。「低くなる」とする選択肢3は誤りです。


    流量計の校正は、実際に使うときと同じように捕集器具を付けた状態で行うのが原則です。令和6年度第2回でも、圧力損失が大きいほど指示値が真の流量より大きくなる、という形で出題されています。'
  figures: []
  law_note: null
  _key_choice: 捕集器具を取り付けない状態で流量校正した面積式流量計を捕集器具と吸引ポンプの間に接続して捕集すると、流量計の指示流量は、実際の流量よりも低くなる。
