  choices:
  - 単位作業場所を決定するために考慮する労働者の行動範囲は、個人サンプラーを装着する労働者の行動範囲である。
  - 労働者が有害物質の発散源に近接する作業を10分間行い、その後、単位作業場所外に移動する場合には、個人サンプリング法を選択することができない。
  - 単位作業場所において作業に従事する労働者が5人を下回る場合には、作業に従事する時間を分割してサンプリングを行い、C 測定の測定値数を5以上とする。
  - 1時間サイクルで繰り返される作業が1日中行われる単位作業場所で、労働者がばく露される有害物質の濃度がほぼ均一であることが明らかな場合は、C 測定のサンプリング時間を1時間とすることができる。
  - D 測定の試料空気の採取時間は、連続した15分間とする。
  answer: 4
