    アセトン（約 56℃）、メタノール（約 65℃）、トルエン（約 111℃）、キシレン（約 140℃）の順に沸点が高くなり、蒸気圧は低くなります。液体どうしの蒸気圧は、沸点の低い順に高い、と考えれば判断できます。'
  figures: []
  law_note: null
  _key_choice: ジクロロメタン
