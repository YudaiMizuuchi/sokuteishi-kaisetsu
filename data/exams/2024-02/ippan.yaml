  stem: 暑熱又は寒冷の環境及びその人体への影響などに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 熱中症は、重症度が小さい順にⅠ度からⅢ度までに分類され、熱失神と呼ばれる症状は、Ⅰ度に分類される。
  - 着用している衣類によっては、算出した WBGT 値に着衣補正値を加える必要がある。
  - 暑熱順化とは、熱に慣れ暑熱環境に適応することをいい、その方法としては、作業者が暑熱順化していない状態から、7日以上かけて熱へのばく露時間を次第に長くすることなどがある。
  - 寒冷環境下で体温が低下し始めると、筋肉の弛緩、酸素摂取量の減少などの症状が現れる。
  - 低体温症は、寒冷環境下で全身が冷やされ、体の中心部の温度が 35 ℃ 程度以下に低下した状態をいう。
  answer: 4
  choice_notes: []
  explanation: '寒冷環境で体温が下がり始めると、体は熱をつくろうとして、筋肉の緊張が高まり（ふるえ）、酸素摂取量が**増加**します。筋肉の弛緩、酸素摂取量の減少とする選択肢4は誤りです。


    体温がさらに下がって重い低体温症になると、ふるえが止まり、意識が低下していきます。初期の反応（熱をつくる）と、進行したときの状態を分けて覚えましょう。'
  figures: []
  law_note: null
  _key_choice: 寒冷環境下で体温が低下し始めると、筋肉の弛緩、酸素摂取量の減少なしどの症状が現れる。
