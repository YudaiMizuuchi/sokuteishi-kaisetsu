  stem: 金属及びその化合物による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - インジウム化合物では、溶血性貧血、尿の赤色化などの症状がみられるほか、肺に肉芽腫を生じることがある。
  - クロム化合物のうち、クロムが6価のものはヒトへの発がん性がある。
  - コバルト及びその無機化合物は、アレルギー性皮膚炎、間質性肺炎などを引き起こす。
  - 無機ニッケル化合物では、気管支喘息や接触皮膚炎などのアレルギー症状や腎機能障害を生ずる。
  - マンガンは、脳に沈着しやすく、中毒症状として、歩行障害、発語異常、筋緊張亢進などがみられる。
  answer: 1
  choice_notes: []
  explanation: 'インジウム化合物の代表的な健康障害は、間質性肺炎や肺の線維化などの肺障害です。溶血性貧血や尿の赤色化はヒ化水素（アルシン）の中毒の特徴なので、選択肢1は誤りです。


    令和7年度第1回では、同じ「溶血性貧血・尿の赤色化」がベリリウムの症状として出題されています。この症状を見たら「ヒ化水素」と結びつけましょう。'
  figures: []
  law_note: null
  _key_choice: インジウム化合物では、溶血性貧血、尿の赤色化などの症状がみられるほか、肺に肉芽腫を生じることがある。
