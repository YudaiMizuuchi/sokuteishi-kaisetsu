  stem: 化学物質等の性状及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 環境空気中の有害物質濃度は、対数正規分布に従って分布していることが多い。
  - 気体の液体への溶解度は、一般に、液体の温度が高いほど大きい。
  - 有機溶剤の蒸気密度は、空気の密度より大きいため、低いところに滞留しやすい。
  - ヒュームの1次粒子の粒径は1 μm 以下と小さく、粒径の分散範囲も狭い。
  - 鉱物性粉じんは、一般に、水に対する溶解度が極めて小さく、化学的には不活性のものが多い。
  answer: 2
  choice_notes: []
  explanation: '気体の液体への溶解度は、一般に、液体の温度が**低い**ほど大きくなります。温めると気体は液体から抜け出しやすくなるので、「温度が高いほど大きい」とする選択肢2は誤りです。


    炭酸飲料が温まると気が抜けやすくなるのと同じ現象です。固体の溶解度（温度が高いほど大きいものが多い）と逆になる点に注意しましょう。'
  figures: []
  law_note: null
  _key_choice: 気体の液体への溶解度は、一般に、液体の温度が高いほど大きい。
