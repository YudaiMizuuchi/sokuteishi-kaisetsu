  stem: 粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの空気力学相当径は、光学顕微鏡で粒子の大きさを計測することによって求められる。
  - 「吸引性（インハラブル）粉じん」には「吸入性（レスピラブル）粉じん」が含まれる。
  - アーク溶接ヒュームには、マンガンが含まれていることが多い。
  - 遊離けい酸とは、けい素と酸素が3次元的に結合していて、他の元素とは化学的に結合していない状態の鉱物のことである。
  - 粉じんが肺胞に到達し沈着して、肺組織に線維増殖性変化を起こすと、肺の換気機能が低下する。
  answer: 1
  choice_notes: []
  explanation: '空気力学相当径は、その粒子と同じ沈降速度を示す、密度 1 g/cm³ の球形粒子の直径です。粒子の沈み方（空気中でのふるまい）から求める値で、光学顕微鏡で見た大きさから求めるものではないので、選択肢1は誤りです。


    同じ見た目の大きさでも、密度や形が違えば空気中での沈み方は変わります。体のどこまで届くかは沈み方で決まるので、粉じんの評価には空気力学相当径を使います。'
  figures: []
  law_note: null
  _key_choice: 粉じんの空気力学相当径は、光学顕微鏡で粒子の大きさを計測することによって求められる。
