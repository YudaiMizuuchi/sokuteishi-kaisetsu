  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は脂溶性が高いので、中枢神経系などの脂肪に富んだ組織に蓄積しやすい。
  - ベンゼンは体内で代謝されて、フェノールを生じる。
  - テトラクロロエチレンの生物学的モニタリングの指標として、尿中の総三塩化物の濃度がある。
  - カドミウムの生物学的モニタリングの指標として、尿中の β₂-ミクログロブリンの濃度がある。
  - 鉛の生物学的モニタリングの指標として、赤血球中の δ-アミノレブリン酸の濃度がある。
  answer: 5
  choice_notes: []
  explanation: '鉛の生物学的モニタリングの指標は、血液中の鉛（血中鉛）と、**尿中**のδ-アミノレブリン酸です。赤血球中のδ-アミノレブリン酸とする選択肢5は誤りです。


    鉛は、ヘモグロビンをつくる途中の酵素を妨げるため、その材料であるδ-アミノレブリン酸がたまって尿に出てきます。テトラクロロエチレンの総三塩化物、カドミウムの尿中β₂-ミクログロブリンも、あわせて覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 鉛の生物学的モニタリングの指標として、赤血球中のδ-アミノレブリン酸の濃度がある。
