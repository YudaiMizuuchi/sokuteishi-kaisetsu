  stem: 振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動障害は、振動工具の使用により発生する手指等の末梢循環障害、末梢神経障害及び運動器障害の3つの障害の総称である。
  - 振動障害の一つであるレイノー現象は、白ろう病とも言われ、手指が不可逆的にろうのように白く硬直する疾病である。
  - 喫煙は、レイノー現象発現の増悪因子である。
