  stem: 化学物質による健康影響及びその管理指標等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 量—反応関係とは、個体について、有害物質へのばく露量と、ある生体影響の大きさとの関係を示したものである。
  - 最小毒性量（LOAEL）とは、毒性試験において有害な影響が認められた最低のばく露量をいう。
  - 無影響量（NOEL）とは、毒性試験において影響が認められなかった最高のばく露量をいう。
  - 半数致死量（LD₅₀）とは、急性毒性を評価する指標で、1回の投与で一群の試験動物の 50 ％ が死亡すると予想される投与量をいう。
  - ACGIH（米国産業安全衛生専門家会議）が勧告する TLV- STEL（短時間ばく露限度）は、1日の労働時間においてどの15分間においても超えてはならない時間加重平均濃度である。
  answer: 1
  choice_notes: []
  explanation: '量-反応関係は、有害物質にばく露した**集団**について、ばく露量と、特定の影響が現れた人の**割合**との関係を示したものです。個体についてばく露量と影響の大きさの関係を示すのは「量-影響関係」なので、選択肢1は誤りです。


    令和6年度第2回では、集団についての正しい定義が出題されています。「量-反応は集団と割合、量-影響は個体と大きさ」と対で覚えましょう。'
  figures: []
  law_note: null
  _key_choice: 量—反応関係とは、個体について、有害物質へのばく露量と、ある生体影響の大きさとの関係を示したものである。
