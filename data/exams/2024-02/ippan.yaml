  stem: リスクアセスメントに関する次の記述のうち、誤っているものはどれか。ただし、指針とは、厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」をいう。
  choices:
  - コントロール・バンディングは、簡易なリスクアセスメント手法で、取り扱う化学物質の有害性の程度及びばく露の程度をいくつかのバンド（区分）に分けてリスク評価を行い、リスクレベルに応じたリスク低減措置が決定されるものである。
  - CREATE-SIMPLE（クリエイト・シンプル）は、リスクアセスメント支援ツールで、取り扱う化学物質の情報と作業条件を入力するとリスクレベルが見積もられ、リスクレベルに応じて、リスク低減措置の検討が行えるものである。
  - 指針における「危険性又は有害性」とは、一般にリスクといわれるものであり、労働者に負傷又は疾病を生じさせる潜在的な根源である。
  - 指針では、対象の業務について作業環境測定により測定した作業場所における化学物質等の気中濃度等を、当該化学物質等のばく露限界と比較することによってリスクを見積もることができる、とされている。
  - 指針では、個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない、とされている。
  answer: 3
  choice_notes: []
  explanation: '指針でいう「危険性又は有害性」は、労働者に負傷や疾病を生じさせる**潜在的な根源**（ハザード）のことで、一般にリスクといわれるものではありません。リスクは、ハザードによって生じるおそれのある負傷・疾病の重篤度と、その発生の可能性の度合いを組み合わせたものです。選択肢3は誤りです。


    「ハザード（危険性・有害性）」と「リスク」を区別することが、リスクアセスメントの出発点です。有害性が高い物質でも、ばく露がなければリスクは小さくなります。'
  figures: []
  law_note: null
  _key_choice: 指針における「危険性又は有害性」とは、一般にリスクといわれるものであり、労働者に負傷又は疾病を生じさせる潜在的な根源である。
