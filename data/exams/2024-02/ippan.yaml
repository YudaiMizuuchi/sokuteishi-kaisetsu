  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 化学品について、可燃性ガス、引火性液体、急性毒性、発がん性などの危険有害性クラスが設定されており、各危険有害性クラスについて定められた分類基準に従って、危険有害性区分に分類する。
  - 危険有害性区分が数字で示されているものは、区分の数字が大きい方が危険有害性の程度が大きい。
  - ラベルの記載項目は、化学品の名称、注意喚起語、絵表示、危険有害性情報、注意書き、供給者を特定する情報の6項目である。
  - ラベルに記載する注意喚起語には、「危険」と「警告」の2種類があり、重大な危険有害性がある場合には「危険」を用い、それよりは重大性の低い危険有害性がある場合には「警告」を用いる。
  - 安全データシート（SDS）に記載すべき事項は「その他の情報」を含む16項目であり、各項目に該当する情報が入手できない場合は、その事実を明記し、「その他の情報」以外の項目は空白にしてはならない。
  answer: 2
  choice_notes: []
  explanation: 'GHS の危険有害性区分は、区分1が最も危険有害性の程度が大きく、数字が大きくなるほど程度は小さくなります。数字が大きい方が危険有害性が大きいとする選択肢2は誤りです。


    区分の向きは、令和6年度第2回でも出題されています。「区分1 ＝ いちばん危ない」と覚えましょう。'
  figures: []
  law_note: null
  _key_choice: 危険有害性区分が数字で示されているものは、区分の数字が大きい方が危険有害性の程度が大きい。
