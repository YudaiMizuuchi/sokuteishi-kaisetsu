  stem: 化学物質等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩素は、黄緑色の刺激臭のある気体で、吸入した場合、粘膜や呼吸器が刺激され、高濃度では肺水腫を生じる。
  - 一酸化炭素中毒の後遺症として、健忘やパーキンソン症状がみられることがある。
  - 二酸化窒素による慢性中毒では、歯牙酸蝕症、慢性気管支炎などがみられる。
  - 二酸化硫黄による急性中毒では、咳、眼の痛み、呼吸困難を生じる。
  - フッ化水素は、細胞内の呼吸酵素の障害による呼吸麻痺などを生じる。
  answer: 5
  choice_notes: []
  explanation: '細胞内の呼吸酵素を妨げて呼吸麻痺などを起こすのは、シアン化水素や硫化水素です。フッ化水素の主な健康障害は、皮膚や粘膜の深い化学熱傷と、気道の刺激、慢性では骨や歯の障害なので、選択肢5は誤りです。


    呼吸酵素（チトクロム酸化酵素）を阻害する物質は、シアン化水素、硫化水素、アジ化物などです。「細胞が酸素を使えなくなる」タイプの中毒として整理しておきましょう。'
  figures: []
  law_note: null
  _key_choice: フッ化水素は、細胞内の呼吸酵素の障害による呼吸麻痺などを生じる。ひ
