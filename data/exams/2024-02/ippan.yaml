  stem: 有機溶剤の性質及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は、引火性であるものが多く、ハロゲン化炭化水素は特に引火性が強い。
  - 二硫化炭素は、低濃度の長期間ばく露では、動脈硬化を進行させ微細動脈瘤を伴う脳卒中や虚血性疾患の発生リスクが高くなり、高濃度の急性ばく露では、精神障害を生じる。
  - N,N-ジメチルホルムアミドのばく露では、頭痛、めまい、肝機能障害などがみられる。
  - 四塩化炭素は、肝臓や腎臓に障害を引き起こす。
  - n-ヘキサンによる健康障害として、多発性神経炎があるが、これは、n-ヘキサンの代謝産物である2,5-ヘキサンジオンにより引き起こされる。
  answer: 1
  choice_notes: []
  explanation: 'ハロゲン化炭化水素（塩素系有機溶剤など）は、燃えにくいものが多く、ジクロロメタンやテトラクロロエチレンのように不燃性のものもあります。「特に引火性が強い」とする選択肢1は誤りです。


    有機溶剤は引火性のものが多いですが、塩素などのハロゲンを含むと燃えにくくなります。令和6年度第2回でも、難燃性のものがあるという形で出題されています。'
  figures: []
  law_note: null
  _key_choice: 有機溶剤は、引火性であるものが多く、ハロゲン化炭化水素は特に引火性が強い。
