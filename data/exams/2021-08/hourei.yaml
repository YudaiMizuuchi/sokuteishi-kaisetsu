  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時50人以上の労働者を使用する事業場においては、その業種にかかわらず衛生管理者を選任しなければならない。
  - 常時50人以上の労働者を使用する事業場においては、その業種にかかわらず産業医を選任しなければならない。
  - 衛生管理者は、少なくとも毎週1回作業場等を巡視し、設備、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  - 常時500人を超える労働者を使用する事業場で、エックス線その他の有害放射線にさらされる業務に常時30人以上の労働者を従事させるものにあっては、衛生管理者のうち一人を衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。
  - 常時100人以上の労働者を使用する製造業の事業場においては、総括安全衛生管理者を選任しなければならない。
  answer: 5
  choice_notes: []
  explanation: '総括安全衛生管理者の選任が必要になる規模は業種によって違い、製造業では常時**300人以上**です。100人以上とする選択肢5は誤りです。


    常時100人以上で選任が必要なのは、林業・鉱業・建設業などの業種です。'
  figures: []
  law_note: null
  _key_choice: 常時100人以上の労働者を使用する製造業の事業場においては、総括安全衛生管理者を選任しなければならない。
