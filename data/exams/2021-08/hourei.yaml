  - 空気中のアクリロニトリルの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中の石綿の濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中のメチルイソブチルケトンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中の鉛の濃度 ／ 1年以内ごとに1回 ／ 3年
  answer: 3
  choice_notes: []
  explanation: '石綿の作業環境測定は6か月以内ごとに1回で、記録は**40年間**保存します。30年とする選択肢3は誤りです。


    三酸化二アンチモンとメチルイソブチルケトン（特別有機溶剤）は特別管理物質で30年、アクリロニトリルは3年、鉛は1年以内ごと・3年です。'
