  - 室における一酸化炭素の含有率（1気圧、25 ℃ とした場合の空気中に占める一酸化炭素の容積の割合）を 50 ppm 以下としなければならない。
  - 室の気積を、設備の占める容積及び床面から 4 m をこえる高さにある空間を除き、労働者1人について、10 m³ 以上としなければならない。
  - 空気調和設備を設けている場合は、室に供給される空気中のホルムアルデヒドの量（1気圧、25 ℃ とした場合の空気 1 m³ 中に含まれるホルムアルデヒドの量）を 0.1 mg 以下としなければならない。
