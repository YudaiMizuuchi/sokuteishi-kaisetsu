  stem: 次の化学物質について、その製造に際し厚生労働大臣の許可が必要となるものはどれか。
  choices:
  - カドミウム化合物
  - ジメチル-2,2-ジクロロビニルホスフェイト（DDVP）
  - ベータ-プロピオラクトン
  - アルファ-ナフチルアミン
  - ビス（クロロメチル）エーテル
