  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 指定作業場の作業環境測定結果についての作業環境評価基準に基づく管理区分の決定は、作業環境測定士ではない者に行わせることはできない。
  - 放射性物質取扱作業室における空気中の放射性物質の濃度の測定は、作業環境測定士ではない者に行わせることはできない。
  - 作業環境測定の業務に関する不正の行為により、作業環境測定士の登録を取り消された者は、その日から起算して2年間は、作業環境測定士となることができない。
  - 第2種作業環境測定士は、指定作業場についての作業環境測定の業務のうち、簡易測定機器以外の機器を用いて行う分析の業務を行うことができない。
  - 指定作業場について、作業環境測定機関等への委託によらず、作業環境測定を行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  answer: 1
  choice_notes: []
  explanation: '作業環境評価基準に基づく管理区分の決定（評価）は、事業者が行うもので、作業環境測定士でなければ行えないものではありません。選択肢1は誤りです。


    令和8年度第1回にも、評価は測定士でない者が行える、という正しい記述があります。'
  figures: []
  law_note: null
  _key_choice: 指定作業場の作業環境測定結果についての作業環境評価基準に基づく管理区分の決定は、作業環境測定士ではない者に行わせることはできない。
