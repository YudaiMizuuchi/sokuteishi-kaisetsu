  stem: 次の記述のうち、労働安全衛生関係法令上、誤っているものはどれか。
  choices:
  - 高気圧障害とは、高気圧による減圧症、酸素、窒素又は炭酸ガスによる中毒その他の高気圧による健康障害をいう。
  - 事業者は、常時粉じん作業に従事する労働者でじん肺管理区分が管理1である者に対して、3年以内ごとに1回、定期的に、じん肺健康診断を行わなければならない。
  - じん肺管理区分が管理2又は管理3と決定された者に係るじん肺と合併した肺結核及び原発性肺がんは、じん肺法に規定するじん肺の合併症である。
  - 法令に定める鉛業務に労働者を従事させるときに設置する局所排気装置の除じん装置は、サイクロンによる除じん方式の除じん装置又はこれと同等以上の性能を有するものでなければならない。
  - 屋内作業場において、第2種有機溶剤等について法令に基づき設置した局所排気装置については、原則として、1年以内ごとに1回、法定の事項について定期自主検査を行い、その結果等を記録し、3年間保存しなければならない。
  answer: 4
  choice_notes: []
  explanation: '鉛業務で設ける局所排気装置などの除じん装置は、**ろ過除じん方式**又はこれと同等以上の性能を有するものでなければなりません。サイクロンによる除じん方式とする選択肢4は誤りです。


    根拠：鉛中毒予防規則第26条。'
