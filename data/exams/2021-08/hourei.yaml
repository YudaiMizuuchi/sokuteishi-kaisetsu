  explanation: '換気ができない酸素欠乏危険場所では、**空気呼吸器、酸素呼吸器又は送気マスク**を備えて使用させます。電動ファン付き呼吸用保護具は、周りの空気をろ過して供給するものなので、酸素欠乏の場所では使えません。選択肢4は誤りです。


