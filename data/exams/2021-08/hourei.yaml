  - lw-law-evaluation-02
  rank: null
  summary: null
  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 特別有機溶剤を除き、2種類以上の特定化学物質を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - 第2評価値及び B 測定値が、いずれも管理濃度と等しいときは、第2管理区分に区分される。
  - A 測定のみを行った場合、第1評価値が管理濃度以上であり、かつ、第2評価値が管理濃度以下である単位作業場所の管理区分は第2管理区分である。
  - B 測定値が管理濃度未満であり、かつ、第2評価値が管理濃度を超えるときは、第3管理区分に区分される。
  - A 測定の評価値については、1作業日について測定した場合と連続する2作業日について測定した場合とでは計算式が異なる。
  answer: 1
  choice_notes: []
  explanation: '換算値を求めて管理濃度に相当する値を1として評価する方法は、2種類以上の**有機溶剤**（特別有機溶剤を含む）の混合物に用いるものです。特定化学物質の混合物には用いないので、選択肢1は誤りです。


    根拠：作業環境評価基準第2条第4項。'
  figures: []
  law_note: null
  _key_choice: 特別有機溶剤を除き、2種類以上の特定化学物質を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
