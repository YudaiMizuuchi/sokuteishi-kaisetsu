  stem: 個人サンプリング法による作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 個人サンプリング法とは、作業に従事する労働者の身体に装着する試料採取機器等を用いて行う作業環境測定に係るデザイン及びサンプリングをいう。
  - 指定作業場について行う個人サンプリング法による作業環境測定に係るデザイン及びサンプリングは、個人サンプリング法について登録を受けている作業環境測定士でなければ実施することができない。
  - 特定化学物質のうち管理濃度が一定の値以上であるものに係る測定は、個人サンプリング法によることができる。
  - D 測定は、測定対象物質の発散源に近接する場所で作業が行われる単位作業場所において、当該作業が行われる時間のうち、測定対象物質の濃度が最も高くなると思われる時間に行う測定である。
  - C 測定及び D 測定を行った場合は、A 測定及び B 測定を行った場合と同様の方法により管理区分を決定する。
  answer: 3
  choice_notes: []
  explanation: この試験の時点（令和3年8月）では、個人サンプリング法によることができる特定化学物質は、管理濃度の値が**低い**ものに限られていました。「管理濃度が一定の値以上であるもの」とする選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: 特定化学物質のうち管理濃度が一定の値以上であるものに係る測定は、個人サンプリング法によることができる。
