  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 屋内作業場における等価騒音レベルの測定についての測定点は、原則として、単位作業場所の床面上に 6 m 以下の等間隔で引いた縦の線と横の線との交点の床上 120 cm 以上 150 cm 以下の位置としなければならない。
  - 鉱物性粉じんの濃度の測定を相対濃度指示方法によって行う場合には、原則として、当該単位作業場所における1箇所以上の測定点において、同時に分粒装置を用いるろ過捕集方法及び重量分析方法による測定を行わなければならない。
  - 単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、測定点の数は、5未満としてよい。
  - 有害物質の A 測定において、直接捕集方法により試料空気を採取する場合、採取時間は、10分間以上の継続した時間としなければならない。
  - 有害物質の A 測定は、作業が定常的に行われている時間に行わなければならない。
  answer: 4
  choice_notes: []
  explanation: 'A 測定で直接捕集方法により試料空気を採取する場合は、10分間以上の継続した時間とする必要はありません。選択肢4は誤りです。


    令和5年度第1回にも、同じ選択肢があります。'
  figures: []
  law_note: null
  _key_choice: 有害物質のA測定において、直接捕集方法により試料空気を採取する場合、採取時間は、10分間以上の継続した時間としなければならない。
- num: 10
  status: published
