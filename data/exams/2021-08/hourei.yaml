  stem: 作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 第2種酸素欠乏危険作業に係る作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。
  - 放射線業務を行う作業場のうち管理区域に該当する部分については、原則として、1か月以内ごとに1回、定期に、外部放射線による線量当量率又は線量当量を放射線測定器を用いて測定しなければならない。
  - ロール機、圧延機等による金属の圧延を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 多量のドライアイスを取り扱う業務を行う著しく寒冷な屋内作業場については、半月以内ごとに1回、定期に、気温、湿度及びふく射熱を測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: 'ドライアイスを扱う著しく寒冷な屋内作業場で測定するのは、気温と湿度です。ふく射熱の測定は求められていないので、選択肢5は誤りです。


    令和2年度第1回にも、寒冷な作業場についての同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 多量のドライアイスを取り扱う業務を行う著しく寒冷な屋内作業場については、半月以内ごとに1回、定期に、気温、湿度及びふく射熱を測定しなければならない。
