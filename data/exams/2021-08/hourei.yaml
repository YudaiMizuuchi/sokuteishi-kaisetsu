  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 雇入時の健康診断の結果については、使用する労働者数にかかわらず、所轄労働基準監督署長に報告する必要はない。
  - 雇入時の健康診断において、医師による健康診断を受けた後3か月を経過しない者が、その健康診断結果を証明する書面を提出したときは、その健康診断の項目に相当する項目については省略することができる。
  - 事業場で行った定期健康診断の結果、異常の所見があると診断された労働者については、その健康を保持するために必要な措置について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。
  - 雇入時の健康診断における45歳未満の者についての聴力の検査は、1,000ヘルツ及び4,000ヘルツの音に係る聴力以外の、医師が適当と認める聴力の検査をもって代えることができる。
  answer: 5
  choice_notes: []
  explanation: '雇入時の健康診断で、45歳未満の者についても、聴力の検査は1,000 Hz と 4,000 Hz の音について行わなければならず、医師が適当と認める他の方法に代えることはできません。選択肢5は誤りです。


    医師が適当と認める方法に代えることができるのは、定期健康診断で、45歳未満の者（35歳と40歳の者を除く）についての聴力の検査です。


    根拠：労働安全衛生規則第43条第3号（雇入時の健康診断の聴力の検査は「千ヘルツ及び四千ヘルツの音に係る聴力」）。医師が適当と認める検査に代えられるのは、第44条の定期健康診断の規定です。'
  figures: []
  law_note: null
  _key_choice: 雇入時の健康診断における45歳未満の者についての聴力の検査は、1,000ヘルツ及び4,000ヘルツの音に係る聴力以外の、医師が適当と認める聴力の検査をもって代えることができる。
