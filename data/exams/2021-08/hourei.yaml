  choices:
  - 外部放射線による実効線量と空気中の放射性物質による実効線量との合計が3か月間につき 1.3 mSv を超えるおそれのある区域は、管理区域として標識により明示しなければならない。
  - 放射線業務従事者及び管理区域に一時的に立ち入る労働者については、管理区域内において受ける外部及び内部被ばくによる線量を測定しなければならない。
  - 管理区域内において男性の放射線業務従事者の受ける実効線量は、5年間につき 100 mSv を超えず、かつ、1年間につき 50 mSv を超えないようにしなければならない。
  - 管理区域内において女性の放射線業務従事者（妊娠する可能性がないと診断されたもの及び妊娠と診断されたものを除く。）の受ける実効線量は、3か月間につき5 mSv を超えないようにしなければならない。
  - 事業者は、放射線業務従事者の皮膚に受ける等価線量については、1年間につき 150 mSv を超えないようにしなければならない。
