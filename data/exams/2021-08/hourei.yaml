  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める業種に属する事業場においては、新たに職務に就くこととなった職長に対しては、原則として、法定の事項について安全又は衛生のための教育を行わなければならない。
  - 衛生管理者、安全衛生推進者等、労働災害の防止のための業務に従事する者に対し、その業務に関する能力の向上を図るための教育等を行い、又はこれらを受ける機会を与えるよう努めなければならない。
  - 有機溶剤業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 石綿等が使用されている建築物、工作物又は船舶の解体等の作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別教育を省略することができる。
  answer: 3
  choice_notes: []
  explanation: '有機溶剤業務は、特別教育の対象ではありません。選択肢3は誤りです。


    有機溶剤業務は、有機溶剤作業主任者の選任によって管理します。石綿の解体等の作業は特別教育の対象です（選択肢4）。'
  figures: []
  law_note: null
  _key_choice: 有機溶剤業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
