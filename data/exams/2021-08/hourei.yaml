  stem: 酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 酸素欠乏等とは、空気中の酸素の濃度が 18 ％ 未満である状態又は空気中の硫化水素の濃度が 10 ppm を超える状態をいう。
  - 第2種酸素欠乏危険作業に係る作業場について行う酸素及び硫化水素の濃度測定は、作業環境測定士でない者に行わせることができる。
  - 河川の流水が滞留しているピットの内部における作業は、第1種酸素欠乏危険作業である。
  - 酸素欠乏危険作業を行う場所において、爆発、酸化等を防止するために換気を行うことができない場合は、空気呼吸器、送気マスク又は電動ファン付き呼吸用保護具を備え、労働者に使用させなければならない。
  - 硫化鉱又は魚油を入れてあるタンクの内部における作業は、第1種酸素欠乏危険作業である。
  answer: 4
