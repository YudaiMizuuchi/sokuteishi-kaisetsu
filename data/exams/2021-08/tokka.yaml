  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 吸光光度分析法では、分子やイオンの電子遷移による光の吸収を利用する。
  - 吸光度と光の波長の関係を示す図は、吸収スペクトルである。
  - 透過光の強度は、溶液中の目的物質の濃度が増加するとともに指数関数的に増加する。
  - 光源光から、回折格子により特定の波長の光を選別する。
  - 石英製のセルは、紫外部領域の測定に使用できる。
  answer: 3
  choice_notes: []
  explanation: '吸光光度分析法で、試料液を透過した光の強度は、試料液中の目的物質の濃度が増加するとともに、**指数関数的に減少**します。「指数関数的に増加する」とする選択肢3は誤りです。


    吸光光度分析法は、分子やイオンの電子遷移による光の吸収を利用します。吸光度と波長の関係を示す図は、吸収スペクトルです。光源光から、回折格子で特定の波長の光を選別します。石英セルは、紫外部領域の測定に使えます。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
