  stem: 特定化学物質用の検知管Ⓐと、それに利用される反応Ⓑとの次の組合せのうち、誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - アクリロニトリル用検知管 ／ アクリロニトリルが酸化剤と反応してシアン化水素を発生する。
  - 四塩化炭素用検知管 ／ 四塩化炭素が酸化剤と反応してホスゲンとなる。
  - フッ化水素用検知管 ／ フッ化水素が五酸化ヨウ素と反応してヨウ素を生じる。
  - ホルムアルデヒド用検知管 ／ ホルムアルデヒドがリン酸ヒドロキシルアミンと反応してリン酸を遊離する。
  - 硫化水素用検知管 ／ 硫化水素が酢酸鉛と反応して硫化鉛を生成する。
  answer: 3
  choice_notes: []
  explanation: '検知管の反応を確認します。


    - **五酸化ヨウ素**と反応して**ヨウ素**を生じる反応は、ベンゼン用検知管などの、**炭化水素・有機溶剤用**の検知管の反応です。フッ化水素用検知管ではないので、選択肢3は誤りです。

    - アクリロニトリル用検知管は、酸化剤との反応でシアン化水素を発生させます。四塩化炭素用検知管は、酸化剤との反応でホスゲンになります。ホルムアルデヒド用検知管は、リン酸ヒドロキシルアミンとの反応でリン酸を遊離し、pH指示薬が変色します。硫化水素用検知管は、酢酸鉛との反応で硫化鉛を生成します。'
