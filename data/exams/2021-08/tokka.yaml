  stem: ある化合物の水溶液を吸光光度分析法で測定したところ、測定波長における透過率は 50 ％ であった。その波長におけるモル吸光係数を 8.26 × 10³ cm⁻¹･mol⁻¹･L、セルの光路長を 2.0 cm とすると、この化合物のモル濃度に最も近いものは次のうちどれか。ただし、log₁₀2 = 0.301 とする。
  columns: null
  choices:
  - 1.8 × 10⁻⁵ mol･L⁻¹
  - 3.6 × 10⁻⁵ mol･L⁻¹
  - 6.1 × 10⁻⁵ mol･L⁻¹
  - 7.3 × 10⁻⁵ mol･L⁻¹
  - 8.3 × 10⁻⁵ mol･L⁻¹
  answer: 1
  choice_notes: []
  explanation: '吸光度 A ＝ −log₁₀（透過率）です。透過率が50％（0.5）のとき、


    A ＝ −log₁₀0.5 ＝ log₁₀2 ＝ 0.301


    ランベルト・ベールの法則 A ＝ ε・c・l から、


    c ＝ A／（ε・l）＝ 0.301／（8.26 × 10³ × 2.0）≒ 1.8 × 10⁻⁵ mol/L


    よって（1）です。'
