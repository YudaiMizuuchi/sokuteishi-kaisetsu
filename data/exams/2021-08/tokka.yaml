  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 吸着クロマトグラフ法は、分析成分の固定相への吸着力の違いを利用して分離する。
  - 分配クロマトグラフ法は、分析成分の固定相と移動相への分配の違いを利用して分離する。
  - 逆相分配クロマトグラフ法は、高極性の固定相と低極性の移動相間における分析成分の分配の違いを利用して分離する。
  - イオン交換クロマトグラフ法は、分析成分の固定相へのイオン交換能の違いを利用して分離する。
  - サイズ排除クロマトグラフ法は、分析成分の固定相粒子の細孔内部への浸透性の違いを利用して分離する。
  answer: 3
  choice_notes: []
  explanation: '逆相分配クロマトグラフ法は、**低極性の固定相**（オクタデシル基などのODS）と、**高極性の移動相**（水系の溶媒）の間における、分析成分の分配の違いを利用します。「高極性の固定相と低極性の移動相」とする選択肢3は、逆なので誤りです（それは順相です）。


    吸着クロマトグラフ法は固定相への吸着力の違い、分配クロマトグラフ法は固定相と移動相への分配の違い、イオン交換クロマトグラフ法はイオン交換能の違い、サイズ排除クロマトグラフ法は固定相粒子の細孔内部への浸透性の違いを利用します。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
