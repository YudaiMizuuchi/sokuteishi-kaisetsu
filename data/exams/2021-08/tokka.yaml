  stem: 環境空気（25 ℃、1気圧）中のトルエンジイソシアネート（TDI）の濃度を測定するため、1.0 L･min⁻¹ で10分間試料空気を1-(2-ピリジル)ピペラジン（2-PP）含浸ろ紙に通気した。得られた TDI-2-PP誘導体を抽出液 4.0 mL で抽出し試料液とした。高速液体クロマトグラフで分析した結果、試料液中のこの誘導体の濃度は 0.21 µg･mL⁻¹であった。環境空気中の TDI 濃度として、正しい値に最も近いものは次のうちどれか。ただし、TDI と TDI-2-PP誘導体のモル質量は、それぞれ 174 g･mol⁻¹ と501 g･mol⁻¹ 、ろ紙への捕集率は 100 ％ とし、TDI は全て2,4-TDI の形で存在しているものとする。
  columns: null
  choices:
  - 1 ppb
  - 2 ppb
  - 3 ppb
  - 4 ppb
  - 5 ppb
  answer: 4
