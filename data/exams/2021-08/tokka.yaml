  stem: 環境空気中のエチレンオキシドのガスクロマトグラフ質量分析法に関する次の記述の㋑から㋩の［　］に入る用語の組合せとして、正しいものは下のうちどれか。「活性炭に［㋑］を含浸・乾燥させたものを充塡した捕集管に試料空気を通気し、エチレンオキシドを誘導体化して［㋺］として捕集する。この［㋺］をトルエン/アセトニトリルで抽出し、［㋩］を加えて1時間以上放置した後、ガスクロマトグラフ質量分析法で分析する。」
  columns:
