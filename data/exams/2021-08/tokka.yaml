  - 検量線は、捕集管に標準液を添加し、未知試料と同一条件で分析して作成する。
  - 試料を捕集した捕集管は、両端を真鍮製保存キャップで密栓して保管する。
  - 分析後のポーラスポリマービーズは、コンディショニング後に再利用することができる。
