  - 臭化水素酸 ／ 1-ブロモエタノール ／ 塩化ナトリウム
  - 臭化水素酸 ／ 2-ブロモエタノール ／ 炭酸ナトリウム
  - 臭化カリウム ／ 2-ブロモエタノール ／ 炭酸ナトリウム
