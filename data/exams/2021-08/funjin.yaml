  stem: 空気調和されている室内に設置されている電子天秤及びフィルターの秤量操作等に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 粉じん濃度の測定には、読み取り限度 0.01 mg 以下の天秤を使用する。
  - 天秤の水平が保たれていない状態で秤量すると、秤量値は真値より小さくなる。
  - 周囲温度より温度の低い試料を秤量すると、秤量値は真値より大きくなる。
  - 秤量しようとするフィルターは、汚染を防ぐために、秤量の直前までデシケーター等の乾燥剤入りの密閉された容器に保存する。
  - フィルターが静電気を帯びていると、その影響により秤量値がばらつくことがある。
  answer: 4
  choice_notes: []
  explanation: 'フィルターは、秤量する**少なくとも2時間前に、天びん室内に静置**して、天びん室の温度・湿度になじませます。「秤量の直前までデシケーター等の乾燥剤入りの密閉容器に保存する」とする選択肢4は誤りです。


    読み取り限度0.01 mg以下の天びんを使います。水平が保たれていないと、秤量値は真値より小さくなります。試料の温度が周囲より低いと、秤量値は真値より大きくなり、高いと小さくなります。フィルターが静電気を帯びていると、秤量値がばらつくことがあります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
