  stem: 粉じん粒子のろ過に用いられるフィルターに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 繊維層フィルターは、1本1本の繊維が独立した平行円柱群モデルフィルターとみなすことができる。
  - 粒径が 0.1 µm より小さい粒子では、拡散効果が有効であり、粒径が小さくなるほど捕集効率は低下する。
  - 繊維層フィルターは、構成する繊維の表面に粒子を捕集する。
  - メンブランフィルターは、繊維層フィルターに比べ空間率の低い多孔質フィルターである。
  - 粉じんを測定する場合には、0.3 µm の粒子に対する捕集率が 95 ％以上でなければならない。
