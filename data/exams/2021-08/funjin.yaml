  stem: りん酸法により、石英含有率を求めるため、液相沈降法により 10 µm 以下に粒度調整した試料 200.00 mg を熱リン酸で処理し、りん酸残渣として 40.00 mg を得た。このりん酸残渣を白金るつぼに移し、フッ化水素酸で処理したところ、ふっ化水素酸残渣 0.50 mg が得られた。石英含有率（％）の値に最も近いものは次のうちどれか。ただし、標準石英について求めたりん酸残渣率は 96.0 ％ であったものとする。
  columns: null
  choices:
  - '19.0'
  - '19.4'
  - '19.8'
  - '20.6'
  - '21.1'
  answer: 4
  choice_notes: []
  explanation: '次の順で計算します。


    1. りん酸残渣中の石英の量：りん酸残渣（40.00 mg）から、フッ化水素酸残渣（0.50 mg）を引くと、40.00 − 0.50 ＝ 39.50 mg

    2. 標準石英のりん酸残渣率が96.0％なので、もとの石英の量は、39.50 ÷ 0.960 ≒ 41.15 mg

    3. 石英含有率 ＝ 41.15 ÷ 200.00 ≒ 0.2057 ＝ **20.6％**


    よって（4）です。'
