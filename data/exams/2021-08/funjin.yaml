  stem: 光散乱方式の相対濃度計の特性等に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 計数値は、清浄空気においてもゼロではないので、この数値を差し引いた計数値を相対濃度とする。
  - 計数値は、空気吸引流量にほとんど影響されない。
  - 光散乱特性は、粒子の屈折率によって異なる。
  - 白色光やレーザー光を光源とするが、同じ粉じんであっても光源が異なれば質量濃度変換係数は異なる値となる。
  - 同じ組成、同じ質量濃度の粉じんは、粒径 10 µm の粒子の方が 1 µmの粒子より計数値が大きくなる。
  answer: 5
  choice_notes: []
  explanation: '光散乱方式の相対濃度計では、同じ組成・同じ質量濃度の粉じんでは、粒径1 µmの粒子のほうが、10 µmの粒子より個数が多く、計数値は**大きく**なります。「10 µmのほうが大きい」とする選択肢5は誤りです。


    清浄空気でも計数値はゼロにならないので、その値を差し引いて相対濃度とします。計数値は、空気吸引流量にほとんど影響されません。散乱特性は、粒子の屈折率によって異なります。光源が異なれば、質量濃度変換係数も異なります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
