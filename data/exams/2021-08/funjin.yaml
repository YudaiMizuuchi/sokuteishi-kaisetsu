  explanation: '基底標準吸収補正法では、吸収補正を行うことで、夾雑物の吸収の影響が少なくなり、**定量範囲は広くなります**。「定量範囲は狭くなる」とする選択肢5は誤りです。


    金属基底標準板には、石英の測定回折線より高角度側で、それに近い回折線をもつ材質を選びます。フッ素樹脂加工グラスファイバーフィルターを使った場合は、フィルターに固有の回折線を使えます。検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度、横軸に石英量をとって作成します。


