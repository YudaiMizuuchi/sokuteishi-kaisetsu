  explanation: 'Cu対陰極のX線の単色化（Kβ線の除去）には、原子番号が**1小さい**Ni（ニッケル）を使います。「原子番号が1大きいZn」とする選択肢2は誤りです。


    Kα線は、L殻の電子がK殻に落ち込んだ際に放出される特性X線で、原子番号が大きくなるほど波長が短くなります。Cu対陰極で、石英の主回折線は、2θ＝26.66°です。走査速度は、回折線のピーク位置や強度に影響します。石英の主回折線に近い回折線をもつ鉱物には、シリマナイトやグラファイトなどがあります。


