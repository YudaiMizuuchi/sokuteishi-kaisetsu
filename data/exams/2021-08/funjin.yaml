  stem: 媒質中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 空気中でブラウン運動する粒子の個数濃度が半減するのに要する時間は、濃度が1/10になれば約10倍となる。
  - 空気中に浮遊する粒子を捕集して、それぞれの大きさを計測し、平均粒子径を求める場合、個数基準平均径の方が質量基準平均径より小さくなる。
  - 平衡帯電状態では粒子が大きいほど1個当たりの平均帯電量は多い。
  - 空気力学相当径は粒子の密度を 1 g･cm⁻³ と定めている。
  - 遠心力場における粒子の移動速度は、回転半径の二乗に反比例する。
  answer: 5
  choice_notes: []
  explanation: '遠心力場における粒子の移動速度は、回転半径に**比例**し、角速度の2乗に比例します。「回転半径の二乗に反比例する」とする選択肢5は誤りです。


    ブラウン運動する粒子の個数濃度が半減するのに要する時間は、濃度が1/10になれば、約10倍になります（初期濃度に反比例します）。個数基準平均径は、小さい粒子が多いので、質量基準平均径より小さくなります。平衡帯電状態では、粒子が大きいほど、1個当たりの平均帯電量は多くなります。空気力学相当径は、粒子の密度を1 g/cm³と定めています。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
