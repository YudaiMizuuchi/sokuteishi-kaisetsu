  stem: 遊離けい酸に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 石英は、常圧下の 573 ℃ において可逆的に転移し、低温型をα石英、高温型をβ石英と呼ぶ。
  - 石英が長時間高温にさらされると、トリジマイトやクリストバライトに変化する。
  - オパール（たんぱく石）は、化学組成が SiO₂･nH₂O で表される鉱物であり、遊離けい酸含有率の測定の対象とならない。
  - 化学組成が Al₂O₃･2SiO₂･2H₂O で表されるカオリンは、遊離けい酸含有率の測定の対象とならない。
  - 作業環境における粉じん中の遊離けい酸の大部分は、石英である。
  answer: 3
  choice_notes: []
  explanation: '**オパール**（たんぱく石、SiO₂・nH₂O）は、非晶質のシリカで、遊離けい酸含有率の**測定の対象に含まれます**。「測定の対象とならない」とする選択肢3は誤りです。


    石英は、常圧下の573℃で可逆的に転移します（低温型がα石英、高温型がβ石英）。長時間高温にさらされると、トリジマイトやクリストバライトに変化します。カオリン（Al₂O₃・2SiO₂・2H₂O）は、けい酸塩鉱物で、測定の対象ではありません。作業環境の粉じん中の遊離けい酸の大部分は、石英です。


