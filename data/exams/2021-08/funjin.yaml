  stem: X線回折分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - Kα線とは、L殻の電子がK殻に落ち込んだ際に放出される特性X線のことをいい、原子番号が大きくなるほど波長が短くなる。
  - 対陰極が Cu の場合のX線の単色化には、原子番号が1大きい Zn が用いられる。
