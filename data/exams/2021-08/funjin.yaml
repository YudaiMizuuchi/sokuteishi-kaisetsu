  stem: 粉じんのろ過捕集に用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 石けん膜流量計を用いてローボリウムエアサンプラーの流量計の校正を行ってもよい。
  - ハイボリウムエアサンプラーに表示される流量の校正には、ルーツメーターによって校正されたオリフィス流量計を用いてもよい。
  - 面積式流量計は、テーパー管と浮子との間隙の面積とそこを流れる空気量が比例することを利用しているので、流量計が傾いていても流量測定には影響しない。
  - 面積式流量計はあらかじめ目盛りが刻まれているが、使用する際には適正な機器により流量の校正をしなければならない。
  - 面積式流量計の浮子が脈動して指示が読み取りにくい場合は、流量計と吸引ポンプの間に空気だめを設けるとよい。
  answer: 3
  choice_notes: []
  explanation: '面積式流量計は、テーパー管と浮子の間隙の面積と、流れる空気量が比例することを利用していますが、**流量計が傾いていると、流量の測定に影響します**。垂直に設置して使います。「傾いていても影響しない」とする選択肢3は誤りです。


    石けん膜流量計は、ローボリウムエアサンプラーの流量計の校正に使えます。ハイボリウムエアサンプラーの表示流量の校正には、ルーツメーターで校正したオリフィス流量計も使えます。面積式流量計は、使うときに、適正な機器で校正します。浮子が脈動するときは、流量計と吸引ポンプの間に空気だめを設けます。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
