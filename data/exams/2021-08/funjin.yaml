  stem: ローボリウムエアサンプラーを用いて粉じんの質量濃度を測定し、 0.8 mg･m⁻³という結果を得た。吸引流量 20 L･min⁻¹、サンプリング時間100分、捕集前及び捕集後のろ紙の秤量誤差は、それぞれ 0.04 mg、吸引試料空気量の計測値の相対誤差は 5 ％ 、ろ過材の捕集率は 100 ％ とする。この場合の粉じん質量濃度の測定値の相対誤差（％）に最も近い値は下のうちどれか。なお、粉じん質量濃度の測定値の相対誤差（δC/C）は、次式で表されるものとする。δC 2｜δW｜ ｜δQ｜＝ +C W Qただし、δW は秤量誤差、W は粉じん捕集量、δQ/Q は吸引試料空気量の計測値の相対誤差である。
  columns: null
  choices:
  - 8.0 ％
  - 8.5 ％
  - 9.0 ％
  - 9.5 ％
  - 10.0 ％
  answer: 5
  choice_notes: []
  explanation: '粉じん質量濃度の測定値の相対誤差 δC／C は、秤量誤差と吸引空気量の誤差から求めます。


    1. 吸引した空気の量 Q：20 L/min × 100 min ＝ 2000 L ＝ 2.0 m³

    2. 捕集した粉じんの質量 W：0.8 mg/m³ × 2.0 m³ ＝ 1.6 mg

    3. 秤量誤差による項：2 × 0.04／1.6 ＝ 0.05（5％）（捕集前後の2回分の誤差）

    4. 吸引空気量の相対誤差：5％

    5. 合計：5 ＋ 5 ＝ **10.0％**


    よって（5）です。'
