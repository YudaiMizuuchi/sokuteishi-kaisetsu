  stem: X線回折基底標準吸収補正法によって、粉じん中の石英を定量する方法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 基底標準吸収補正法は、試料による吸収の影響を補正して、遊離けい酸含有率の多少にかかわらず、標準試料で作った検量線をそのまま適用できるようにした方法である。
  - 金属基底標準板には、石英の測定回折線より高角度側でそれに近い回折線をもつ材質を選ぶ。
  - 試料の採取にフッ素樹脂加工グラスファイバーフィルターを用いた場合には、フィルターに固有の測定回折線を用いることができる。
  - 検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度をとり、横軸に石英量をとって作成する。
  - 吸収補正を行うことにより、夾雑物の吸収の影響を少なくすることができるが、定量範囲は狭くなる。
