  stem: 環境空気中に浮遊する粉じんのろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 繊維層フィルターの粉じん捕集効率は、粒径 0.1 ～ 0.3 µm 付近で最も低くなる。
  - ろ過捕集の際のろ過材の圧力損失は、ろ過面における流速の二乗にほぼ比例する。
  - 繊維層フィルターの方がメンブランフィルターより圧力損失が少ないので、多量の粉じんを捕集するのに適している。
  - メンブランフィルターでは、粉じんの多くはフィルター表面で捕集される。
  - 浮遊粉じんの採じん量は、測定濃度に対する相対誤差を少なくするために、天秤の読み取り限度の20倍以上必要である。
  answer: 2
  choice_notes: []
  explanation: 'ろ過材の圧力損失は、ろ過面における流速に**ほぼ比例**します（2乗ではありません）。「流速の二乗にほぼ比例する」とする選択肢2は誤りです。


    繊維層フィルターの捕集効率は、粒径0.1〜0.3 µm付近で最も低くなります。繊維層フィルターは、メンブランフィルターより圧力損失が少なく、多量の粉じんの捕集に適しています。メンブランフィルターでは、粉じんの多くはフィルター表面で捕集されます。浮遊粉じんの採じん量は、天びんの読み取り限度の20倍以上必要です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
