  stem: 光散乱方式の相対濃度計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 質量濃度変換係数は、併行測定によって得られた質量濃度を相対濃度で除した値である。
  - 質量濃度変換係数は、同一物質の場合、粒径が大きくなるほど小さくなる。
  - 測定を行う前には、光散乱部を清浄空気で満たした状態で零点調整と感度合わせを行う必要がある。
  - 光学系には、前方散乱光や側方散乱光を計測する方式のものがある。
  - 入射光の強度が同じでも波長が異なると、散乱光の強度は変わる。
  answer: 2
  choice_notes: []
  explanation: '質量濃度変換係数は、同一の物質では、粒径が約0.5 µmより大きくなると、粒径が**大きく**なるほど、**大きく**なります（粗い粒子は、同じ質量でも、計数値が小さいためです）。「粒径が大きくなるほど小さくなる」とする選択肢2は誤りです。


    質量濃度変換係数は、併行測定の質量濃度を、相対濃度で除した値です。測定前には、光散乱部を清浄空気で満たして、零点調整と感度合わせを行います。入射光の波長が異なると、散乱光の強度は変わります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
