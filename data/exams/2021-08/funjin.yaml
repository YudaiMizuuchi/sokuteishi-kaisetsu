  stem: 次の記述の［　］に入る語句として、誤っているものは下のうちどれか。「粒径 5 µm 程度の球形粒子が空気中を落下する際の終末速度は、に比例する。」
  columns: null
  choices:
  - 粒子の直径の二乗
  - 粒子の密度
  - 空気の密度
  - 重力加速度
  - 空気の粘性係数の逆数
  answer: 3
  choice_notes: []
  explanation: 'ストークスの式は、終末速度 v ＝（ρ − ρ₀）× g × d² ／（18 η）です。終末速度は、粒子の直径の2乗、粒子の密度、重力加速度に比例し、空気の粘性係数に反比例します（粘性係数の逆数に比例します）。**空気の密度**は、粒子の密度に比べて無視できるほど小さく、終末速度は、空気の密度に比例しません。選択肢3は誤りです。


    （参考：『作業環境測定のための労働衛生の知識』）'
