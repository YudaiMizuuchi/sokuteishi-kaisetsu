  columns: null
  choices:
  - 試料の捕集には、ガラス繊維ろ紙を用いる。
  - 採取した試料を硫酸（1＋10）で処理し、試料溶液を調製する。
  - 試料溶液をアルカリ性にした後、モリンを加えて最終試料溶液とする。
  - 試料中の亜鉛による妨害を抑制するために、シアン化カリウムを加える。
  - モリンが還元されて蛍光強度が低下するのを防ぐために、塩化スズ（Ⅱ）溶液を加える。
  answer: 5
  choice_notes: []
  explanation: 'ベリリウムの蛍光光度分析法では、**塩化スズ(Ⅱ)**を、**モリンの酸化**を防いで、蛍光強度が低下しないようにするために加えます（還元剤として働きます）。「モリンが還元されて蛍光強度が低下するのを防ぐ」とする選択肢5は、酸化と還元の向きが逆なので誤りです。


