  stem: 作業環境空気中の金属の分析法Ⓐとその分析原理の基礎となる現象Ⓑの次の組合せのうち、誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 吸光光度分析法 ／ 物質による可視光の吸収
  - 蛍光光度分析法 ／ 物質による蛍光の発生
  - 原子吸光分析法 ／ 励起状態の原子の光吸収
  - 高周波誘導結合プラズマ発光分析法（ICP-AES） ／ 励起状態の原子又はイオンの発光
  - 高周波誘導結合プラズマ質量分析法（ICP-MS） ／ 原子のイオン化
  answer: 3
  choice_notes: []
  explanation: '原子吸光分析法は、**基底状態の原子**が、特定の波長の光を吸収する現象を利用します。「励起状態の原子の光吸収」とする選択肢3は誤りです。


    吸光光度分析法は物質による可視光の吸収、蛍光光度分析法は物質による蛍光の発生、ICP-AESは励起状態の原子またはイオンの発光、ICP-MSは原子のイオン化を利用します。


    同じ型の出題は、令和5年度第1回にもあります（出題実績）。


    （参考：『機器分析の実務』）'
