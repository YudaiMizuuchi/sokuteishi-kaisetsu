  stem: 作業環境空気中の鉛のろ過捕集法-原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 試料液は、ガラス繊維ろ紙に捕集した試料を硝酸又は塩酸で加熱溶解して調製する。
  - 鉛を MIBK に抽出するキレート剤には、APDC、DDTC などが用いられる。
