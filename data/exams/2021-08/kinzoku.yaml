  stem: 溶媒抽出-原子吸光分析法によるカドミウムの分析に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - カドミウムの APDC 錯体は、アルカリ性溶液から MIBK に抽出する。
  - 標準液の調製には、塩化カドミウム（無水物）を用いる。
  - 検量線の作成には、試料と同様に MIBK に抽出した溶液を用いる。
  - 試料液中に共存して分光学的干渉の原因となる塩化ナトリウムは除去される。
  - アセチレンの流量を少なくしたフレームを用いる。
  answer: 1
  choice_notes: []
  explanation: 'APDC-カドミウム錯体は、**弱酸性**（pH3.5〜4.0程度）の溶液から、MIBKに抽出します。pHが4以上になると不安定になり、抽出率が低くなります。「アルカリ性溶液から抽出する」とする選択肢1は誤りです。


    検量線は、試料と同様に、MIBKに抽出した溶液を使って作成します。塩化ナトリウムなど、分光学的干渉の原因になる共存塩は、溶媒抽出で除去できます。標準液は、塩化カドミウム（無水物）で調製します。アセチレンの流量を少なくしたフレームを使います。


    同様の記述は、令和4年度第1回、令和5年度第1回にも出題されています（出題実績）。


