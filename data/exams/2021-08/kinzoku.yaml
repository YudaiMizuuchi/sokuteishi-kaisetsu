  stem: 硫酸ベリリウム（四水和物）（BeSO₄･4H₂O）197 mg を精製水に溶かし、95 ％ 硫酸 1 mL を加えた後、メスフラスコ（500 mL）に洗い移し、精製水で定容にした。この溶液のベリリウムの濃度として、正しい値に最も近いものは次のうちどれか。ただし、ベリリウム、硫黄、酸素、水素の原子量はそれぞれ9、32、16、1とする。
  columns: null
  choices:
  - 5 mg･L⁻¹
  - 10 mg･L⁻¹
  - 15 mg･L⁻¹
  - 20 mg･L⁻¹
  - 25 mg･L⁻¹
  answer: 4
  choice_notes: []
  explanation: '次の順で計算します。


    1. 硫酸ベリリウム四水和物（BeSO₄・4H₂O）のモル質量：9 ＋ 32 ＋ 16×4 ＋ 18×4 ＝ 9 ＋ 32 ＋ 64 ＋ 72 ＝ 177 g/mol

    2. 物質量：197 mg ÷ 177 g/mol ≒ 1.113 mmol

    3. ベリリウムの質量：1.113 mmol × 9 g/mol ≒ 10.0 mg

    4. 500 mLの溶液の濃度：10.0 mg ÷ 0.500 L ＝ **20 mg/L**


    よって（4）です。'
