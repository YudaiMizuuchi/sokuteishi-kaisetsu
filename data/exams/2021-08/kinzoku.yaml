  stem: 誘導結合プラズマ発光分光分析法（ICP-AES）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - プラズマトーチは通常、三重管で、プラズマガス、補助ガス、キャリアガスが流れる。
  - キャリアガスは、ネブライザーで霧化した試料溶液をプラズマの中心に導入する。
  - プラズマ炎の中心部は、周囲よりも温度が高い。
  - プラズマ炎の観測方向は、軸方向と横方向の2種類がある。
  - 試料溶液の粘性は、発光強度に影響を与える。
  answer: 3
  choice_notes: []
  explanation: 'ICP-AESのプラズマ炎は、ドーナツ構造をしていて、**中心部は、周囲よりも温度が低く**なります（試料は、この低温の中心部の通路を通ります）。「中心部は、周囲よりも温度が高い」とする選択肢3は誤りです。


    プラズマトーチは、通常、三重管で、プラズマガス、補助ガス、キャリアガスが流れます。キャリアガスは、霧化した試料溶液を、プラズマの中心に導入します。観測方向には、軸方向と横方向があります。試料溶液の粘性は、発光強度に影響を与えます。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
