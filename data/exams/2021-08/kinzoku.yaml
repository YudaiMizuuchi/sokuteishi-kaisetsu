  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 試料中の測定対象物質の濃度と原子吸光の吸光度との間には、ベールの法則が成り立つ。
  - 測定対象元素の光源には、重水素放電ランプが用いられる。
  - フレーム法では、均一な微粒子をバーナーに送る必要がある。
  - 電気加熱式原子吸光法では、アルゴンや窒素などの不活性気体を通じながら黒鉛炉を加熱する。
  - 還元気化法で発生させたヒ素の水素化物は、加熱石英セル内で熱分解し、原子化する。
  answer: 2
  choice_notes: []
  explanation: '原子吸光分析法の光源には、測定対象元素の**中空陰極ランプ**（または無電極放電ランプ）を使います。**重水素放電ランプ**は、バックグラウンド補正に使う光源で、測定対象元素の光源ではありません。「測定対象元素の光源には、重水素放電ランプが用いられる」とする選択肢2は誤りです。


    吸光度と濃度の間には、ベールの法則が成り立ちます。フレーム法では、均一な微粒子をバーナーに送る必要があります。電気加熱式では、不活性ガスを通じながら黒鉛炉を加熱します。還元気化法で発生させたヒ素の水素化物は、加熱石英セル内で熱分解して原子化します。


    （参考：『機器分析の実務』）'
