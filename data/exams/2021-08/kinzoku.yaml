  stem: 蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 蛍光の出現波長範囲は、紫外領域から赤外領域にわたる。
  - 吸光光度分析法に比べ、選択性が優れている。
  - 金属イオンは、キレート化剤を用いることにより分析することができる。
  - 試料液の pH、粘性及び温度は、蛍光強度に影響を与える。
  - 蛍光の波長は、励起光の波長より短い。
