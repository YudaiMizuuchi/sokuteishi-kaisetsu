  stem: 吸光光度分析法によるクロム（Ⅵ）の分析に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集は、精製水を捕集液とする液体捕集法による。
  - 標準液は、二クロム酸カリウム又はクロム酸カリウムを精製水に溶かして調製する。
  - クロム（Ⅵ）を硫酸酸性下でジフェニルカルバジドと反応させ、赤紫色に着色した液を 358 nm の波長で測定する。
  - 試料液の硫酸濃度は 、0.025 ～ 0.1 mol･L⁻¹ がよい。
  - ジフェニルカルバジドは、硫酸酸性下でバナジウムとも反応し発色する。
