  stem: ろ過捕集法-原子吸光分析法における試料の前処理法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - ろ過捕集には、ガラス繊維ろ紙又はメンブランフィルターが使用される。
  - ガラス繊維ろ紙に捕集した金属は、一般に酸で溶出する。
  - 有機物の共存が多い試料は、灰化を行った後に、金属を溶出する。
  - 有機溶媒抽出法は、共存する妨害イオンを除去するために行う。
  - ガラス繊維ろ紙のケイ酸分は、金属の分析を妨害しない。
  answer: 5
  choice_notes: []
  explanation: 'ろ過捕集法―原子吸光分析法の前処理を確認します。ガラス繊維ろ紙は、ケイ酸分を含み、金属の分析を**妨害することがあります**。「妨害しない」とする選択肢5は誤りです。


    ろ過捕集には、ガラス繊維ろ紙またはメンブランフィルターを使います。ガラス繊維ろ紙に捕集した金属は、一般に酸で溶出します。有機物の共存が多い試料は、灰化してから、金属を溶出します。有機溶媒抽出法は、共存する妨害イオンを除去するために行います。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
