    測りたい濃度 ＝ 6.0 × 10⁻⁷ ÷ 10 ＝ 6.0 × 10⁻⁸ Bq/cm³、吸引流量 ＝ 80 L/min ≒ 1,333 cm³/s


    計数率 ＝ 6.0 × 10⁻⁸ × 1,333 × t × 1.00 × 0.28 ≒ 2.24 × 10⁻⁵ × t


