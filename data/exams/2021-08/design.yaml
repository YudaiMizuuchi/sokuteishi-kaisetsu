  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定は、測定時に労働者がいない場合でも、立ち入ることがあるならば、その作業位置で測定を行う。
  - B 測定は局所的短時間の個人ばく露の評価のために行う。
  - 相対濃度指示方法を用いて B 測定を行う場合の質量濃度変換係数は、その単位作業場所で行われた A 測定の質量濃度変換係数を用いる。
