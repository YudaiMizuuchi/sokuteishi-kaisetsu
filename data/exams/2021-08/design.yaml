  stem: 放射性物質を取り扱っている作業場において、取扱い核種の濃度限度の10分の1の空気中放射能濃度を測定するための最小試料採取時間に最も近い値は次のうちどれか。ただし、取扱い核種の濃度限度は 6.0 × 10⁻⁷ Bq･cm⁻³、測定装置の検出限界計数率は 2.5 s⁻¹ 、測定装置の計数効率は 28 ％ 、試料空気の吸引流量は80 L･min⁻¹ 、使用する捕集材の捕集率は 100 ％ とする。
