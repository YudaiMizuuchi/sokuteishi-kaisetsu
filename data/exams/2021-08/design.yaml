  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の発生源が等間隔で配列されている場合には、測定点の縦又は横の線の間隔が発生源の間隔と一致しないようにする。
  - 単位作業場所における粉じんの濃度がほぼ均一であることが明らかなときは、測定点の間隔は、6 m を超える等間隔で引いた縦の線と横の線との交点とすることができる。
  - 単位作業場所が著しく狭く、かつ単位作業場所における粉じんの濃度がほぼ均一であることが明らかなときは、測定値の総数を5未満とすることができる。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下であることが明らかなときは、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 鉱物性粉じんの相対濃度指示方法による A 測定では、各々の測定点における測定時間は10分未満とすることができる。
  answer: 3
  choice_notes: []
  explanation: '単位作業場所が著しく狭く、かつ濃度がほぼ均一であることが明らかなときに5未満にできるのは、**測定点の数**です。測定値の総数を5未満にできるとする選択肢3は誤りです。


    測定点を5未満にした場合でも、同じ測定点で繰り返し測定して、測定値の総数は5以上とします。


    根拠：作業環境測定基準第2条第1項第1号の2。'
