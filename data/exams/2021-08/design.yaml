  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致していなければならない。
  - 必ずしも、平面的な場所だけでなく、装置の周囲に設けられた作業足場のような立体的な作業場も単位作業場所となり得る。
  - 同一作業場において2種類の有機溶剤を、別々に使用している場合は、当該有機溶剤の混合有機溶剤を使用する作業場とみなして一つの単位作業場所として設定する。
  - 単位作業場所の範囲の設定に当たっては、作業場の区域を、労働者の作業中の行動範囲、有害物質の分布状況などの判断基準によって層別化を行う。
  - クロム酸鉛を取り扱っている作業場では、同一の区域をクロム酸と鉛とで別々の単位作業場所として設定する。
  answer: 3
  choice_notes: []
  explanation: '同じ作業場で2種類の有機溶剤を別々に使っている場合は、混合有機溶剤の作業場とみなして1つの単位作業場所とすることはできません。物質ごとに単位作業場所を設定するので、選択肢3は誤りです。


