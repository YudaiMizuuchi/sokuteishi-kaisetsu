  stem: 環境空気中の放射性物質Ⓐとその試料捕集法Ⓑとの次の組合せのうち、不適当なものはどれか。
  choices:
  - 放射性コバルト ／ ろ過捕集法
  - トリチウム化水蒸気 ／ 液体捕集法
  - 放射性ストロンチウム ／ ろ過捕集法
  - 放射性ヨウ素 ／ 直接捕集法
  - 放射性アルゴン ／ 直接捕集法
  answer: 4
  choice_notes: []
  explanation: '放射性ヨウ素は、活性炭などを用いる**固体捕集法**で捕集します。直接捕集法との組合せは不適当なので、答えは（4）です。


    放射性アルゴンのような希ガスは直接捕集法、トリチウム化水蒸気は液体捕集法、コバルトやストロンチウムなどの粒子状のものはろ過捕集法です。'
  figures: []
  law_note: '作業環境測定基準第9条第1号の表では、放射性物質の状態が粒子状のときは液体捕集方法又はろ過捕集方法、ガス状のときは液体捕集方法、固体捕集方法、直接捕集方法又は冷却凝縮捕集方法とされています。条文の表は、状態ごとに選べる方法を広く示しているため、この問題の「不適当」という答えは、条文の表だけでは決まらず、物質ごとの代表的な捕集方法に基づいています。


    参考：『作業環境測定ガイドブック2』では、性状に適する方法の例として、粒子状の物質（コバルト、ウラン、プルトニウム、タリウムなど）はろ過捕集、揮発性のヨウ素などは活性炭による固体捕集、放射性希ガスは直接捕集が挙げられています。'
