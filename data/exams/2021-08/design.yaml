  stem: 25 ℃、1気圧における環境空気中のメタノールの質量濃度が 260 mg･m⁻³であるとき、その体積分率（ppm）に最も近いものは、次のうちどれか。
  choices:
  - 50 ppm
  - 100 ppm
  - 200 ppm
  - 300 ppm
  - 400 ppm
  answer: 3
  choice_notes: []
  explanation: 'mg/m³ を ppm に直すときは、24.45 を掛けて分子量で割ります。メタノール（CH₃OH）の分子量は 32.0 です。


    C [ppm] ＝ 260 × 24.45 ÷ 32.0 ≒ 199


    よって、最も近いのは 200 ppm です。'
  figures: []
