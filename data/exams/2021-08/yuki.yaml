  stem: ガスクロマトグラフ分析法のキャリアガスに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - キャリアガスとして、窒素やヘリウムを使用することができる。
  - 溶出ピークの幅は、カラム内キャリアガスの渦流拡散の影響を受ける。
  - カラムの理論段数には、キャリアガスの種類は関係しない。
  - 内径 3 mm 程度の充塡カラムでは、キャリアガス流量が 20 ～ 30 mL･min⁻¹ が適切である。
  - 電子捕獲検出器（ECD）には、キャリアガスとして、アルゴンを使用することができる。
