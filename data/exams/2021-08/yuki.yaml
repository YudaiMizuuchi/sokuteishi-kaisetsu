  stem: ガスクロマトグラフ分析法に用いられるキャピラリカラムに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - キャピラリカラムの内径は、0.1 ～ 0.75 mm 程度であり、カラムの材質としては溶融石英ガラスのものが多い。
  - 同一のカラムならば、キャリアガスの種類を変えても最適な線速度は同じである。
  - 充塡カラムに比べて試料負荷量が小さいので、導入量も少量にする必要がある。
  - 理論段数が大きいので、多成分を含む試料の分離分析に適している。
  - キャリアガス流量が小さいので、FID を取り付けた装置では、検出器部でメイクアップガスを追加する必要がある。
