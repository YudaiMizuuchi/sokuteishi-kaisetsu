  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集袋により試料を採取する場合には、内容積 0.1 ～ 1 L のものを用いる。
  - 小型ガス吸収管による試料採取時の空気吸引流量は、50 ～ 100 mL･min⁻¹とする。
  - 活性炭管に試料を採取する際に用いる電動ポンプは、活性炭管を接続して流量を調整する。
  - 流量計の校正には、基準流量計として、石けん膜流量計を用いることができる。
  - 真空捕集びんに試料を採取する際の空気吸引流量は一定ではない。
  answer: 1
  choice_notes: []
  explanation: '捕集袋は、内容積**5 L以上**のものを使います。「0.1〜1 L」とする選択肢1は誤りです。5 L以上の袋を使うと、1測定あたりの捕集時間を10分にすることができます。


    小型ガス吸収管の吸引流量は、50〜100 mL/minです。活性炭管に試料を採取するときの電動ポンプは、活性炭管を接続した状態で、流量を調整します。流量計の校正には、石けん膜流量計を使えます。真空捕集びんに採取するときの吸引流量は、瓶内の圧力の上昇とともに減るので、一定ではありません。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
