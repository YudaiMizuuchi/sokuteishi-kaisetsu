  stem: 有機溶剤の液体捕集法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 試料空気の気泡を大きくすると、捕集率が低くなる。
  - 試料空気採取によって液量が減少した場合は、捕集液を追加して一定量に調整して分析する。
  - 捕集液内での気泡の滞留時間が長いほど、捕集率は高くなる。
  - 捕集液に溶解させて捕集する場合は、捕集液を冷却すると一般に捕集率を高めることができる。
  - ミゼットインピンジャーによる捕集では、主として慣性効果によって捕集される。
  answer: 5
  choice_notes: []
  explanation: 'ミゼットインピンジャーで、ガス状の有機溶剤を捕集するしくみは、ノズルから噴出した試料空気が、捕集液中で気泡になり、捕集液に**溶解**（または反応）することです。**慣性効果**は、粒子状物質を衝突で捕集する原理で、有機溶剤の蒸気の捕集では主な原理ではありません。「主として慣性効果によって捕集される」とする選択肢5は誤りです。


    気泡が大きいと、接触面積が小さく、捕集率が低くなります。気泡の滞留時間が長いほど、捕集率は高くなります。捕集液に溶解させて捕集するときは、捕集液を冷却すると、捕集率を高められます。液量が減少したときは、捕集液を追加して一定量に調整します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
