  stem: 有機溶剤の標準液の調製に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 標準液に使用する溶質、溶媒は蒸気圧が高い場合が多いので、できる限り短時間で調製する。
  - 計量精度は、ガラス体積計の種類によって異なる。
  - 容量で調製する場合、標準液の濃度の正確さは、温度の影響を受けない。
  - 標準液の保存可能期間は、溶質と溶媒の組合せによって異なる。
  - 標準系列液の中には、対象物質の濃度がゼロのものを含める。
  answer: 3
  choice_notes: []
  explanation: '容量で標準液を調製するときは、液体の体積が**温度によって変わる**ので、標準液の濃度の正確さは、**温度の影響を受けます**。「温度の影響を受けない」とする選択肢3は誤りです。


    蒸気圧が高い溶質・溶媒を使うので、標準液は、できる限り短時間で調製します。計量精度は、ガラス体積計の種類によって異なります。標準液の保存可能期間は、溶質と溶媒の組合せによって異なります。標準系列液の中には、対象物質の濃度がゼロのものを含めます。'
