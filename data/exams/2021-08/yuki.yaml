  stem: 有機溶剤 A の空気中濃度を吸光光度分析法で測定した。小型ガス吸収管に捕集液 4.0 mL を入れ、100 mL･min⁻¹ の流量で試料空気を10分間吸引した。この捕集液のうちの 1.0 mL をとり、発色試薬 5.0 mL を加えて測定し、吸光度0.32 を得た。一方、A の濃度が 10 µg･mL⁻¹ の標準液 1.0 mL に発色試薬 5.0 mL を加え、測定したところ吸光度 0.12 を得た。A の空気中濃度として、正しい値に最も近いものは次のうちどれか。ただし、捕集前後で捕集液量は変化しないものとし、かつ、捕集率は 100 ％とする。A のモル質量を 106 g･mol⁻¹ 、また、25 ℃ 、1気圧下とする。
