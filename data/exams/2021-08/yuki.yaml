  stem: ガスクロマトグラフ分析法に用いる水素炎イオン化検出器（FID）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 水素炎中で燃焼し、イオン化する物質の測定に適している。
  - キャリアガスには、水素を用いることができない。
  - 二硫化炭素に対する感度は低い。
  - 脂肪族炭化水素の同族体でのイオン発生量は、化合物中の炭素数にほぼ比例する。
  - 応答直線範囲は、電子捕獲検出器（ECD）より広い。
  answer: 2
  choice_notes: []
  explanation: '水素炎イオン化検出器（FID）の**キャリアガスには、水素を使えます**（窒素やヘリウムが一般的ですが、水素も使えます）。「水素を用いることができない」とする選択肢2は誤りです。


