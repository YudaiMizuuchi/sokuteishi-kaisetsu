  explanation: '標準液と試料液は、同じ操作（捕集液1.0 mLに発色試薬5.0 mL）で発色させているので、吸光度の比で濃度を求めます。


    1. 試料液（捕集液）の濃度：10 µg/mL × 0.32／0.12 ≒ 26.7 µg/mL

    2. 捕集液4.0 mL中の量：26.7 × 4.0 ≒ 107 µg

    3. 吸引した空気の量：100 mL/min × 10 min ＝ 1.0 L

