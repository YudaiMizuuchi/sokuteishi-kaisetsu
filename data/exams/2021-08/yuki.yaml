  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集袋により試料を採取する場合には、内容積 0.1 ～ 1 L のものを用いる。
  - 小型ガス吸収管による試料採取時の空気吸引流量は、50 ～ 100 mL･min⁻¹とする。
  - 活性炭管に試料を採取する際に用いる電動ポンプは、活性炭管を接続して流量を調整する。
  - 流量計の校正には、基準流量計として、石けん膜流量計を用いることができる。
  - 真空捕集びんに試料を採取する際の空気吸引流量は一定ではない。
