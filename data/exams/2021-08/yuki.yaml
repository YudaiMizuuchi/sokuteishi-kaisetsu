  stem: 作業者が酢酸エチルを含む塗料容器を持って移動しながら補修塗装を行っていたため、作業者に受動型試料採取機器（パッシブサンプラー）を装着して、15分間の D 測定を行った。捕集された酢酸エチルを溶媒 2 mL で脱着し、ガスクロマトグラフで分析したところ、酢酸エチル 95.0 µg･mL⁻¹の結果が得られた。D 測定値として、正しい値に最も近いものは次のうちどれか。ただし、サンプリング速度：40.0 mL･min⁻¹ 、酢酸エチルのモル質量：88.1 g･mol⁻¹、脱着率：1とする。また、25 ℃、1気圧下とする。
