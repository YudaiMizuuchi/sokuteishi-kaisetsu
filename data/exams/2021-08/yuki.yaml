  stem: トルエン、酢酸イソブチル、メチルエチルケトン及びキシレンを含有する混合溶剤を使用している単位作業場所内の併行測定点におけるトルエン用検知管の測定値は 9.5 ppm であった。一方、ガスクロマトグラフで分析した測定値はトルエン 3.0 ppm 、酢酸イソブチル 3.0 ppm 、メチルエチルケトン 2.0 ppm 及びキシレン 2.5 ppm であった。換算値変換係数として、正しい値に最も近いものは次のうちどれか。ただし、トルエン、酢酸イソブチル、メチルエチルケトン及びキシレンの管理濃度は、それぞれ 20 ppm 、150 ppm 、200 ppm 及び 50 ppm である。
  columns: null
  choices:
