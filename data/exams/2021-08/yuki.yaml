  - 0.022 ppm⁻¹
  - 0.024 ppm⁻¹
  - 0.026 ppm⁻¹
  - 0.028 ppm⁻¹
  answer: 3
  choice_notes: []
  explanation: "換算値変換係数は、併行測定で、**換算値を検知管の指示値で割って**求めます。\n\n1. 換算値（作業環境評価基準第2条第4項）＝ Σ（各成分の濃度／その管理濃度）\n ＝ 3.0／20 ＋ 3.0／150 ＋ 2.0／200 ＋ 2.5／50 ＝ 0.15 ＋ 0.02 ＋ 0.01 ＋ 0.05 ＝ 0.23\n2. 換算値変換係数 ＝ 0.23 ÷ 9.5 ppm ≒ 0.024 ppm⁻¹\n\nよって（3）です。\n\n（参考：『デザイン・サンプリングの実務（C・D測定編）』）"
