  explanation: 'カラムの理論段数は、**キャリアガスの種類の影響を受けます**。「キャリアガスの種類は関係しない」とする選択肢3は誤りです。


    キャリアガスには、窒素、ヘリウム、水素などが使えます。溶出ピークの幅は、カラム内の渦流拡散の影響を受けます。内径3 mm程度の充填カラムでは、キャリアガス流量は20〜30 mL/minが適切です。電子捕獲検出器（ECD）には、アルゴンを使えます。


