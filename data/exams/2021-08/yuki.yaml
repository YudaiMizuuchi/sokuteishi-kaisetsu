  stem: ガスクロマトグラムで、ピークの保持時間が12.3分、ピーク幅が0.5分であった。このピークについて計算した理論段相当高さ（単位段数当たりのカラムの長さ）は 0.3 mm であった。使用したカラムの長さとして、正しい値に最も近いものは次のうちどれか。
