  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - リスクは、厚生労働省や ILO が示したコントロール・バンディングを用いて見積もることができる。
  - 化学反応のプロセス等の運転条件の変更、取り扱う化学物質等の形状の変更等によるリスクの低減対策は、設備等の密閉化や局所排気装置の設置等の衛生工学的対策よりも優先して実施されるべきである。
  - 負傷又は疾病の重篤度の見積りに際しては、傷害や疾病等の種類にかかわらず、基本的に、負傷又は疾病による休業日数等を尺度として使用する。
  - 危険予知活動（KYT）の実施結果、職場巡視の実施結果等を、調査等の実施に当たり活用することができる。
  - ハザードは、労働災害発生の可能性と負傷又は疾病の重大性（重篤度）の組合せとして定義される。
