  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - トリクロロエチレンの生物学的モニタリングの指標として、尿中のフェニルグリオキシル酸の濃度がある。
  - 体内に取り込まれた有機溶剤の生物学的半減期は比較的短いので、有機溶剤等健康診断における尿中代謝物の検査のための採尿時刻は、正確にチェックする必要がある。
  - 鉛の生物学的モニタリングの指標として、赤血球中のプロトポルフィリンの濃度がある。
  - n-ヘキサンの生物学的モニタリングの指標として、尿中の2,5-へキサンジオンの濃度がある。
  - スチレンは、代謝されて、尿中にマンデル酸が排泄される。
  answer: 1
  choice_notes: []
  explanation: トリクロロエチレンの生物学的モニタリングの指標は、尿中の**トリクロロ酢酸**や総三塩化物です。フェニルグリオキシル酸は、スチレンやエチルベンゼンの指標（マンデル酸とともに）なので、選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: トリクロロエチレンの生物学的モニタリングの指標として、尿中のフェニルグリオキシル酸の濃度がある。
