  - 許容濃度とは、労働者が1日8時間、週に40時間程度、肉体的に激しくない労働強度で有害物質にばく露される場合に、その平均ばく露濃度がその数値以下であれば、ほとんど全ての労働者に健康上の悪い影響がみられないと判断される濃度である。
  - 許容濃度の値は、経皮吸収があることを考慮して定められている。
