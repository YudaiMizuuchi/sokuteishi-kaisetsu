  choices:
  - 満18歳以上の男性労働者が人力のみにより取り扱う物の重量は、体重のおおむね 40 ％ 以下となるようにする。
  - 満18歳以上の女性労働者が人力のみにより取り扱う物の重量は、男性が取り扱うことのできる重量の 60 ％ 位までとする。
