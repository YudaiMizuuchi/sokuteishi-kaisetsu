  explanation: '振動障害では、レイノー現象は**末梢循環障害**、手指のしびれは**末梢神経障害**です。選択肢1は、2つの分類が入れ替わっていて誤りです。


    振動工具取扱い作業者の特殊健康診断を年2回行う場合、そのうち1回は冬季に行うとよい（選択肢3）という正しい記述も、あわせて押さえておきましょう。'
