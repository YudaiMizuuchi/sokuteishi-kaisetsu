  stem: 電磁波に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 紫外線は、可視光線より波長が短い電磁波で、電気性眼炎を起こすことがある。
  - 高温の物体から放射される赤外線は、白内障を起こすことがある。
  - マイクロ波は､赤外線より波長が長い電磁波で、組織壊死を起こすことがある。
  - レーザー光線は、単一波長で位相のそろった可視光線のことで、指向性や集束性が強く、エネルギー密度が高いという特徴を持つ。
  - 可視光線のうち、黄色の光の波長は緑色の光の波長より長い。
  answer: 4
  choice_notes: []
  explanation: レーザー光線は、単一波長で位相のそろった光ですが、可視光線に限らず、紫外線や赤外線の領域のものもあります。「可視光線のことで」とする選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: レーザー光線は、単一波長で位相のそろった可視光線のことで、指向性や集束性が強く、エネルギー密度が高いという特徴を持つ。
