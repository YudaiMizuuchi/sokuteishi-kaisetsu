  - 窒素ガスで置換したタンク内など、ほとんど無酸素状態で呼吸をすると徐々に窒息の状態になり、この状態が5分程度継続すると呼吸停止する。
  - 相当期間密閉されていた鋼製のタンクの内部での作業では、酸素欠乏症の危険がある。
