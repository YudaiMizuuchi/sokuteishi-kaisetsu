  stem: 電離放射線及びその生体影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - X線は、通常、X線発生装置を用いて発生させる電離放射線で、放射性物質から放出されるγ線と同様に電磁波である。
  - 発がんや遺伝的影響は、確率的影響に分類され、しきい値はない。
  - α線、β線及び中性子線は粒子線である。
  - 放射線宿酔は、急性影響であり、かつ、確定的影響である。
  - 放射線による皮膚障害のうち、脱毛には潜伏期があり、晩発影響に分類される。
  answer: 5
  choice_notes: []
  explanation: '脱毛は、被ばく後数週間程度で現れる確定的影響で、**早期影響**（急性影響）に分類されます。晩発影響とする選択肢5は誤りです。


