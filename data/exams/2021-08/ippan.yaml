  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩素は、黄緑色の刺激臭のある気体で、吸入した場合、粘膜や呼吸器が刺激され、肺水腫を生じることがある。
  - 高濃度の硫化水素による中毒では、脳神経細胞の障害による意識消失、呼吸麻痺などがみられる。
  - エチレンオキシドは、眼、上部気道、皮膚を刺激したり、肺水腫を起こすほか、ヒトに対する発がん性が知られている。
  - ベリリウム中毒では、溶血性貧血、尿の赤色化などの症状がみられる。
  - 鉛中毒では、ヘム合成過程の阻害による貧血が起こる。
  answer: 4
  choice_notes: []
  explanation: '溶血性貧血や尿の赤色化（血色素尿）は、ヒ化水素（アルシン）の中毒の特徴です。ベリリウムの代表的な健康障害は、肺の肉芽腫（ベリリウム肺）や皮膚炎なので、選択肢4は誤りです。


    令和7年度第1回にも、同じ組合せの誤りがあります。'
  figures: []
  law_note: null
  _key_choice: ベリリウム中毒では、溶血性貧血、尿の赤色化などの症状がみられる。
