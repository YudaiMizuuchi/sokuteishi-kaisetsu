  stem: 鉱物性粉じん等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求められる。
  - 吸入された鉱物性粉じんの各呼吸部位での沈着率は、その空気力学相当径によって異なる。
  - 粒子状物質の沈降速度は、粒径の2乗に比例する。
  - 遊離けい酸を含まない鉱物性粉じんの管理濃度は、3.0 mg/m³ である。
  - 同一の鉱物の破砕により発散した粉じんであっても、その浮遊粉じんと堆積粉じんとでは遊離けい酸の含有率が異なることが多い。
  answer: 1
  choice_notes: []
  explanation: '空気力学相当径は、その粒子と同じ沈降速度を示す、密度 1 g/cm³ の球形粒子の直径で、沈み方から求める値です。光学顕微鏡による粒径測定で求めるものではないので、選択肢1は誤りです。


    令和5年度第2回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求められる。
