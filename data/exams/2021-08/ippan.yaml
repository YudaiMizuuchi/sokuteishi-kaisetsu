  stem: 厚生労働省の「職場における腰痛予防対策指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 満18歳以上の男性労働者が人力のみにより取り扱う物の重量は、体重のおおむね 40 ％ 以下となるようにする。
  - 満18歳以上の女性労働者が人力のみにより取り扱う物の重量は、男性が取り扱うことのできる重量の 60 ％ 位までとする。
  - 重量物取扱い作業では、腰部保護ベルトを、必ず使用するよう指導する。
  - 立位、椅座位にかかわらず、作業台の高さは肘の曲げ角度がおよそ 90°になる高さとする。
  - 直接床に座る座作業は、仙腸関節、股関節等に負担がかかることに留意する。
  answer: 3
  choice_notes: []
  explanation: '腰痛予防対策指針では、腰部保護ベルトは一律に使用させるのではなく、個人ごとに効果を確認してから使用の適否を判断するとされています。「必ず使用するよう指導する」とする選択肢3は誤りです。


    令和6年度第1回にも、腰部保護ベルトについての同じ論点があります。


    根拠：職場における腰痛予防対策指針（「腰部保護ベルトは、個人により効果が異なるため、一律に使用するのではなく、個人毎に効果を確認してから使用の適否を判断すること」）。'
  figures: []
  law_note: null
  _key_choice: 重量物取扱い作業では、腰部保護ベルトを、必ず使用するよう指導する。
