  stem: 金属による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ヒ素中毒では、角化症、黒皮症などの皮膚障害、末梢神経障害、鼻中隔穿孔などの障害がみられる。
  - 金属水銀中毒では、感情不安定、幻覚などの精神障害や手指の震えなどがみられる。
  - 金属熱は、亜鉛や銅などのヒュームを吸入することにより発生し、悪寒や発熱、関節痛などの症状がみられる。
  - コバルトによる中毒では、レイノー現象、指端骨溶解や肝血管肉腫などがみられる。
  - カドミウムによる慢性中毒では、腎機能障害、肺気腫、肺がんなどを生じる。
  answer: 4
  choice_notes: []
  explanation: レイノー現象、指端骨溶解、肝血管肉腫は、**塩化ビニル**による健康障害の特徴です。コバルトの代表的な健康障害は、気管支ぜんそくやアレルギー性皮膚炎などの感作性によるものなので、選択肢4は誤りです。
