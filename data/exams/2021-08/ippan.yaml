  stem: 酸素欠乏症に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中の酸素濃度が 16 ％ 程度以下になると、頭痛、吐き気などの自覚症状が現れ、10 ％ 程度以下になると、意識喪失やけいれんが現れる。
  - 酒類その他発酵する物を入れてある醸造槽の内部での作業では、酸素欠乏症の危険がある。
  - 酸素欠乏危険作業を行う場所において、爆発、酸化等を防止するため換気を行うことができない場合には、空気呼吸器、酸素呼吸器又は送気マスクを備え、労働者に使用させる。
  - 窒素ガスで置換したタンク内など、ほとんど無酸素状態で呼吸をすると徐々に窒息の状態になり、この状態が5分程度継続すると呼吸停止する。
  - 相当期間密閉されていた鋼製のタンクの内部での作業では、酸素欠乏症の危険がある。
