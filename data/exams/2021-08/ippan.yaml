  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 物質のばく露限界濃度にかかわらず、臭気を感知するかどうかという人の知覚の有無を、吸収缶の交換時期の判断基準としてはならない。
  - シアン化水素用防毒マスクの吸収缶の色は、青色である。
