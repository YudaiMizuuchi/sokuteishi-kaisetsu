  stem: 局所振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動工具を使用する作業では、レイノー現象などの末梢神経障害及び手指のしびれなど末梢循環障害が発生するおそれがある。
  - 厚生労働省の「チェーンソー取扱い作業指針」によれば、日振動ばく露限界値は、5.0 m/s² である。
  - 振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬季に行うとよい。
  - レイノー現象を発症した場合は、振動負荷の頻度を少なくしても、改善するには長期間を要することがある。
  - 厚生労働省の「チェーンソー取扱い作業指針」によれば、一連続の振動ばく露時間は、10分以内とする。
  answer: 1
