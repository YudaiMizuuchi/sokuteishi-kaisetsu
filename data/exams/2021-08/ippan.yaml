  choices:
  - 空気中の酸素濃度が 16 ％ 程度以下になると、頭痛、吐き気などの自覚症状が現れ、10 ％ 程度以下になると、意識喪失やけいれんが現れる。
  - 酒類その他発酵する物を入れてある醸造槽の内部での作業では、酸素欠乏症の危険がある。
