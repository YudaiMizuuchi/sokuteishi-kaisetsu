    - ディスプレイは、おおむね40 cm以上の視距離が確保できるようにし、画面の上端が、眼と同じ高さか、やや下になるようにする
    - O-157は、腸管出血性ウイルスの一種で、加熱不足の食肉等から摂取され、潜伏期間は3～5日である（誤りの記述）
    - ノロウイルスによる食中毒は、ウイルスに汚染された食品等を摂取することで発症し、主として冬季に発生する
