  stem: 精製水の製造に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 蒸留水製造装置では、不揮発性の不純物のみを除去することが可能である。
  - 金属製やガラス製の蒸留水製造装置からは、イオンの溶出がある。
  - イオン交換水の純度は、電気伝導度で評価する。
  - メンブランフィルターは、水中の粒子を除去できる。
  - 逆浸透膜法では、溶存気体を完全に取り除くことはできない。
  answer: 1
  choice_notes: []
  explanation: '蒸留法は、加熱しても蒸発しない**高沸点の成分**だけでなく、冷却水で凝縮しない**低沸点の成分**も除去できる方法です。「不揮発性の不純物**のみ**を除去することが可能」とする選択肢1は誤りです。


    ただし、水と同じ温度範囲で気化・液化する物質は除けません。また、蒸留装置が金属製やガラス製だと、装置から溶け出したイオンが混入します（選択肢2は正しい）。高純度の蒸留水を得るには、石英製の装置を使います。


    イオン交換水の純度は、水の電気伝導度を測り、比抵抗で表します（選択肢3）。メンブランフィルターによるろ過は、水中の粒子を除きます（選択肢4）。逆浸透法は、イオン、有機成分、コロイド粒子、細菌などを除けますが、溶存気体は除けません（選択肢5）。


    （参考：『作業環境測定のための分析概論』）'
  figures: []
  law_note: null
  _key_choice: 蒸留水製造装置では、不揮発性の不純物のみを除去することが可能である。
