    重力効果は、ろ過速度が小さいほど高くなります。慣性効果は、ろ過速度が大きいほど高くなります。拡散効果は、粒径が小さいほど高くなります。さえぎり効果は、粒径が大きいほど高くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
