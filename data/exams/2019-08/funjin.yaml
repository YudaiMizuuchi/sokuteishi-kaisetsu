  stem: 繊維層フィルターによる粒子の捕集原理に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 重力効果による捕集効率は、ろ過速度が小さいほど高くなる。
  - 慣性効果による捕集効率は、ろ過速度が大きいほど高くなる。
  - 拡散効果による捕集効率は、粒径が小さいほど高くなる。
  - さえぎり効果による捕集効率は、粒径が大きいほど高くなる。
  - 捕集効率は、粒径 0.1 ～ 0.3 µm の付近で最も高くなる。
