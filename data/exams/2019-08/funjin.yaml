  stem: X線回折基底標準吸収補正法により、粉じん中の石英の定量を行ったところ、次のような測定結果が得られた。有効直径 20 mm のフィルターに、再発じん法により 1.26 mg の粉じんを捕集した。このフィルターの石英の主回折線強度は 325 cps であった。粉じん中の石英含有率（％）は、下のうちどれか。ただし、X線吸収補正係数は 1.20、石英の回折線強度は石英が 1 mg/cm²のとき 6500 cps とする。
  columns: null
  choices:
  - 4.8％
  - 7.6％
  - 10.4％
  - 13.2％
  - 15.0％
  answer: 5
  choice_notes: []
  explanation: '次の順で計算します。


    1. フィルターの有効面積：直径20 mm（半径1 cm）なので、π × 1² ＝ 3.14 cm²

    2. 吸収補正をした回折線強度：325 cps × 1.20 ＝ 390 cps

    3. 石英が1 mg/cm²のとき6500 cpsなので、390 ÷ 6500 ＝ 0.060 mg/cm²

    4. 石英の量：0.060 × 3.14 ≒ 0.1885 mg

    5. 含有率：0.1885 ÷ 1.26 ≒ 0.150 ＝ **15.0％**


    よって（5）です。'
