  stem: 粉じんのろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 石英繊維ろ紙では、粒子はろ紙の表面だけでなく内部でも捕集される。
  - ろ過材を通して空気を吸引した場合におけるろ過材の圧力損失は、流速にほぼ反比例する。
  - ろ過捕集に使用できるろ過材は、粒径 0.3 µm の粒子を 95％以上捕集する性能を有するものに限られる。
  - フッ素樹脂加工グラスファイバーフィルターは、加湿空気を通してもほとんど吸湿しない。
  - 多段平行板式分粒装置の 50％分粒粒径は、流量の平方根に比例する。
  answer: 2
  choice_notes: []
  explanation: 'ろ過材の圧力損失は、流速に**ほぼ比例**します。「流速にほぼ反比例する」とする選択肢2は誤りです。同じ記述は、令和4年度第1回にも出題されています（出題実績）。


    石英繊維ろ紙では、粒子は、表面だけでなく、内部でも捕集されます。ろ過捕集に使えるろ過材は、粒径0.3 µmの粒子を95％以上捕集する性能のものに限られます。フッ素樹脂加工グラスファイバーフィルターは、加湿空気を通しても、ほとんど吸湿しません。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
