  stem: 次の記述の 内に入るⒶ及びⒷの語句の組合せのうち、正しいものはどれか。「粒径 5 µm 以下の球形粒子が媒質中を落下する際の終末速度は、 Ⓐと Ⓑ に比例する。」
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 粒子の直径 ／ 粒子の密度
  - 粒子の直径の2乗 ／ 媒質の密度
  - 粒子の直径 ／ 媒質の密度
  - 粒子の密度 ／ 媒質の粘性係数
  - 粒子の直径の2乗 ／ 媒質の粘性係数の逆数
  answer: 5
  choice_notes: []
  explanation: 'ストークスの式は、終末速度 v ＝（ρ − ρ₀）× g × d² ／（18 η）です。粒径5 µm以下の球形粒子の終末速度は、**粒子の直径の2乗**に比例し、**媒質の粘性係数の逆数**（粘性係数に反比例）に比例します。よって（5）です。同じ型の問題は、令和4年度第1回にも出題されています（出題実績）。


    （参考：『作業環境測定のための労働衛生の知識』）'
