  stem: 粉じんの相対濃度計の質量濃度変換係数（K値）を求めるため、サンプリング時間を 60 min として併行測定を行い、次の結果を得た。質量濃度：0.57 mg/m³相対濃度：450 cpmこれらの値から求められるK値の最大誤差として、正しい値に最も近いものは下のうちどれか。ただし、粉じんの捕集流量：20 L/min粉じん捕集前後のろ紙の秤量誤差：それぞれ 0.005 mg吸引空気量の測定誤差：2.0％計数値の誤差：10 カウントとする。
  columns: null
  choices:
  - 3.0％
  - 3.5％
  - 4.0％
  - 4.5％
  - 5.0％
  answer: 2
  choice_notes: []
  explanation: '質量濃度変換係数 K ＝ 質量濃度／相対濃度 の最大誤差は、各誤差を足し合わせて求めます。


    1. 吸引した空気の量：20 L/min × 60 min ＝ 1200 L ＝ 1.2 m³

    2. 捕集した粉じんの質量：0.57 mg/m³ × 1.2 m³ ＝ 0.684 mg

    3. 秤量誤差による相対誤差：捕集前後の2回分なので、2 × 0.005／0.684 ≒ 1.46％

    4. 吸引空気量の測定誤差：2.0％

    5. 計数値の誤差：60分間の総カウント数は 450 × 60 ＝ 27000 なので、10／27000 ≒ 0.04％（無視できる大きさ）

    6. 合計：1.46 ＋ 2.0 ＋ 0.04 ≒ **3.5％**


    よって（2）です。'
