  explanation: '液相沈降法（ピペット法）の手順は、次のとおりです。


    1. 単位作業場所で採取した堆積粉じんのうち、**目開き75 µm**のふるいを通過したものを使います。

    2. 約**500 mL**の媒体（精製水）に対し、約5 gの試料を加え、懸濁液を作製します。

    3. 沈降距離を10〜20 cmの間に設定し、所定粒径以下の試料を得るための所定時間、静置します。

