  stem: 鉱物性粉じんのろ過捕集で用いる流量計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - フロート型面積式流量計は、使用する前に使用条件に合わせた状態で流量の校正を行う。
  - 捕集装置の圧力損失が大きくなる場合、ろ過捕集器具と吸引ポンプの間の流量計の指示値は、真の流量より小さくなる。
  - 石けん膜流量計は、ローボリウムエアサンプラー用流量計の校正に用いられる。
  - ハイボリウムエアサンプラーの捕集流量の校正は、ルーツメーターによって校正されたオリフィス流量計を用いてもよい。
  - ローボリウムエアサンプラーに用いる流量計の校正に用いられる湿式ガスメーターは、通常、押し込み方式で使用する。
  answer: 2
  choice_notes: []
  explanation: '捕集装置の圧力損失が大きいとき、ろ過捕集器具と吸引ポンプの間の面積式流量計の指示値は、真の流量より**大きく**なります（空気の密度が小さくなるためです）。「小さくなる」とする選択肢2は誤りです。同じ趣旨の記述は、令和5年度第1回、令和2年度第1回にも出題されています（出題実績）。


    フロート型面積式流量計は、使用前に、使用条件に合わせた状態で校正します。石けん膜流量計は、ローボリウムエアサンプラー用流量計の校正に使います。ハイボリウムエアサンプラーの校正には、ルーツメーターで校正したオリフィス流量計を使えます。湿式ガスメーターは、通常、押し込み方式で使います。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
