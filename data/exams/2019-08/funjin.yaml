  stem: 吸入性粉じん濃度の測定に用いる分粒装置に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 測定に用いる分粒装置は、空気力学相当径 4 µm の粒子を 100％除去する。
  - 慣性衝突式分粒装置では、総粉じんと吸入性粉じんの濃度を同時に求めることができる。
  - 慣性衝突式分粒装置は、円形ノズル孔に汚れが付着すると通過する粒子の粒径は小さい方へ移行する。
  - 多段平行板式分粒装置の流量を大きくすると 50％分粒粒径は、大きい方へ移行する。
  - ハイボリウムエアサンプラーでは、分粒装置の衝突板の付着粉じんが多くなると、通過する粒子の粒径は大きい方へ移行する。
  answer: 1
  choice_notes: []
  explanation: '吸入性粉じんの測定に使う分粒装置は、**空気力学相当径4 µmの粒子を50％除去**するように設計されています。「100％除去する」とする選択肢1は誤りです。同じ記述は、令和3年度第1回にも出題されています（出題実績）。


    慣性衝突式分粒装置では、総粉じんと吸入性粉じんの濃度を、同時に求められます。円形ノズル孔に汚れが付着すると、通過する粒子の粒径は小さいほうへ移行します。多段平行板式分粒装置の流量を大きくすると、50％分粒粒径は、大きいほうへ移行します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
