  stem: 密度 2.4 g/cm³、粒径 10.0 µm の球形粒子の水中における自由落下の終末速度を測定して 7.5 × 10⁻³ cm/s を得た。同じ条件のもとで、別に密度 3.8 g/cm³、粒径 7.0 µm の球形粒子について同様の測定をしたときの終末速度の値に最も近いものは次のうちどれか。ただし、粒子の終末速度はストークスの式に従い、また、水の密度は 1.0 g/cm³ とする。
  columns: null
  choices:
  - 3.8 × 10⁻³ cm/s
  - 5.8 × 10⁻³ cm/s
  - 7.4 × 10⁻³ cm/s
  - 8.7 × 10⁻³ cm/s
  - 1.0 × 10⁻² cm/s
  answer: 3
  choice_notes: []
  explanation: '終末沈降速度は、ストークスの式から、（ρ − ρ₀）× d² に比例します（水中なので、ρ₀＝1.0 g/cm³）。2つの粒子の比をとります。


    - 1つ目：（2.4 − 1.0）× 10.0² ＝ 1.4 × 100 ＝ 140

    - 2つ目：（3.8 − 1.0）× 7.0² ＝ 2.8 × 49 ＝ 137.2


    2つ目の速度 ＝ 7.5 × 10⁻³ × 137.2／140 ≒ 7.35 × 10⁻³ ≒ **7.4 × 10⁻³ cm/s**


    よって（3）です。'
