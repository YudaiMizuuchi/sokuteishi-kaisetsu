  stem: 空気中の粒子のブラウン運動及び帯電粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 微小粒子がブラウン運動で衝突・凝集して粒子の個数が減少する速度は、粒子の個数濃度に依存する。
  - 粒子を発熱体を中央に挟んだ冷却面の間を通すと冷却面に沈着する。
  - 粒径 5 µm 以上の粒子では、ブラウン運動による拡散は、無視できる。
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は、粒径が大きいほど速い。
  - 粒子の帯電量は荷電条件が同じであれば、粒径が大きい方が多い。
  answer: 4
  choice_notes: []
  explanation: '粒子の帯電量が同じであれば、電界中での粒子の移動速度は、粒径が**小さい**ほど**速く**なります（粒径が大きいほど、受ける空気の抵抗が大きいためです）。「粒径が大きいほど速い」とする選択肢4は誤りです。


    微小粒子がブラウン運動で衝突・凝集して減る速度は、粒子の個数濃度に依存します。粒径5 µm以上の粒子では、ブラウン運動による拡散は無視できます。粒子の帯電量は、荷電条件が同じなら、粒径が大きいほど多くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
