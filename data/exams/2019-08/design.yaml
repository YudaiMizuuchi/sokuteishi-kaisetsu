  explanation: '騒音の管理区分は、A 測定平均値（算術平均）と B 測定値で決め、標準偏差は用いません。選択肢3は誤りです。


    騒音レベルがほぼ均一かどうかの判断には、過去の測定値の標準偏差が 3 dB 以下であることを用います（選択肢5）。管理区分の決定と、均一の判断とで、標準偏差の使い方が違う点に注意しましょう。'
  figures: []
