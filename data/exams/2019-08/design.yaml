  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定は、当該単位作業場所の中で、有害物質の発散源に近接する場所において作業が行われる場合に、有害物質の濃度が最も高くなると考えられる作業位置とその時間に行う測定である。
  - 検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値を測定値とする。
  - 相対濃度指示方法によってB測定を行った場合に用いる質量濃度変換係数は、A測定とは別に求めなければならない。
  - B測定に真空捕集びんを用いる場合には、真空捕集びんの本数は5本程度を目安にする。
  - 圧電天秤方式の相対濃度計を用いて鉱物性粉じんのB測定を行うときは、測定時間を2分に合わせて、連続して5回行う。
  answer: 3
  choice_notes: []
  explanation: '相対濃度指示方法で B 測定を行うときは、A 測定で求めた質量濃度変換係数を**そのまま用います**。A 測定とは別に求めなければならないとする選択肢3は誤りです。


    令和5年度第1回にも、同じ論点があります。'
  figures: []
