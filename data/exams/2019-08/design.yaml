  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定は、当該単位作業場所における気中有害物質の平均的な濃度とその変動を求めるための測定である。
  - 測定点と測定点の間隔は、6 m を超えない等間隔であれば、縦方向と横方向は異なってもよい。
  - 測定点の高さは、床上 120 ～ 150 cm の呼吸域の高さとする。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下であることが明らかであって、かつ、施設又は作業工程等の変更がない場合は、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 測定点の数を5未満とすることができる単位作業場所でも、各測定点で繰り返し測定を行うことによって、測定値の総数は5以上とする。
  answer: 3
  choice_notes: []
  explanation: 'A 測定の測定点の高さは、床上 **50 cm 以上 150 cm 以下**です。120〜150 cm とする選択肢3は誤りです。


    120〜150 cm は、騒音の測定点の高さです。'
  figures: []
  law_note: null
  _key_choice: 測定点の高さは、床上120~150cmの呼吸域の高さとする。
