  stem: 空気中の有害物質の濃度及び管理濃度に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石綿の管理濃度は、本/cm³ で表されている。
  - 鉱物性粉じんの相対濃度を質量濃度にするには、質量濃度変換係数が必要である。
  - 空気中の有機溶剤の体積分率 0.1％は、10,000 ppm に相当する。
  - 有機溶剤の管理濃度は、ppm で表されている。
  - 鉱物性粉じんの管理濃度は、その粉じん中の遊離けい酸含有率が大きいほど小さな値になる。
  answer: 3
  choice_notes: []
  explanation: '体積分率 1 ％ は 10,000 ppm なので、0.1 ％ は **1,000 ppm** です。10,000 ppm とする選択肢3は誤りです。


    ppm は100万分の1（10⁻⁶）、％ は100分の1（10⁻²）なので、1 ％ ＝ 10⁴ ppm です。桁を1つずらさないように注意しましょう。'
  figures: []
  law_note: null
  _key_choice: 空気中の有機溶剤の体積分率0.1%は、10,000ppmに相当する。
