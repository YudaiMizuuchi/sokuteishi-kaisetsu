  stem: 単位作業場所に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 同一建物内にいくつかの単位作業場所を設定する場合、それぞれの単位作業場所の範囲が重なってもよい。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致していなければならない。
  - 塗料の調合作業とそこで調合された塗料を用いる塗装作業が同一作業場で併行して行われている場合、1つの単位作業場所として設定することができる。
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間を考慮する必要がある。
  - クロム酸鉛を取り扱っている作業場では、同一の区域をクロム酸と鉛とで別々の単位作業場所として設定する。
