  - 定量下限濃度 ／ 捕集時間 ／ 0.01
  - 定量下限濃度 ／ 捕集液の量 ／ 0.01
  - 吸引流量 ／ 捕集液の量 ／ 0.1
  answer: 2
  choice_notes: []
  explanation: '液体捕集法で、測定に必要な最小の吸引空気量 Q（L）は、次の式で求めます。


    Q ＝（定量下限濃度 × 最終試料液の総量）／（0.1 × 管理濃度）


    - A：定量下限濃度

    - B：最終試料液の総量

    - C：0.1（管理濃度の1/10）


