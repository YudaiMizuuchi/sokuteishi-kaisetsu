  stem: 次の化合物Ⓐについて、その構造式Ⓑが誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 1,1-ジメチルヒドラジン ／ 図の1
  - β-プロピオラクトン ／ 図の2
  - クロロメチルメチルエーテル ／ 図の3
  - α-ナフチルアミン ／ 図の4
  - エチレンイミン ／ 図の5
  answer: 1
  choice_notes: []
  explanation: '各物質の構造式を、図と照らし合わせます。


    - 1 **1,1-ジメチルヒドラジン**：2つのメチル基が**同じ窒素原子**についた (CH₃)₂N−NH₂ です。図の1は、メチル基が**別々の窒素**についた H₃C−NH−NH−CH₃ で、**1,2-ジメチルヒドラジン**の構造です。組合せは誤りです。

    - 2 β-プロピオラクトン（四員環のラクトン）、3 クロロメチルメチルエーテル（CH₃−O−CH₂Cl）、4 α-ナフチルアミン（ナフタレンの1位にNH₂）、5 エチレンイミン（三員環のアジリジン）は、正しい組合せです。


    よって（1）です。'
  figures:
  - file: 2019-08-tokka-13-fig.png
    alt: Ⓐ（名称）とⒷ（構造式）の2列。1＝1,1-ジメチルヒドラジン、ⒷはN−Nの単結合で、左のNにH₃CとH、右のNにCH₃とHが付いた式。2＝β-プロピオラクトン、ⒷはO＝C、CH₂、CH₂、Oの4つが四角形の環を作る式（C（＝O）の上にCH₂、右にCH₂、下にO）。3＝クロロメチルメチルエーテル、ⒷはCH₃−O−CH₂Clの式。4＝α-ナフチルアミン、Ⓑはベンゼン環が2つ縮合した環（ナフタレン骨格）の端の位置にNH₂が付いた式。5＝エチレンイミン、ⒷはH₂C−CH₂とNHが三角形の環を作る式。
