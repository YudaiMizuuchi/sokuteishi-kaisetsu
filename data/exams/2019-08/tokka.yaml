  stem: 環境空気（25 ℃、1気圧）中のフッ化水素の濃度を測定するため、捕集液10 mL に 0.75 L･min⁻¹ の流量で試料空気を10分間吸引した。その全量 10 mLについて定量操作を行い、その吸光度をブランクを対照として測定したところ0.350 であった。フッ化水素の濃度が、1.15 × 10⁻⁷ mol･mL⁻¹ の標準溶液 10 mL についても同様の操作を行って測定した吸光度は 0.455 であった。フッ化水素の環境空気中濃度（体積分率）として、正しい値に最も近いものは次のうちどれか。ただし、捕集率は 100％とする。
  columns: null
  choices:
  - 1.5 ppm
  - 2.9 ppm
  - 3.4 ppm
  - 4.2 ppm
  - 5.3 ppm
  answer: 2
  choice_notes: []
  explanation: '次の順で計算します。


    1. 標準溶液10 mL中のフッ化水素の量：1.15 × 10⁻⁷ mol/mL × 10 mL ＝ 1.15 × 10⁻⁶ mol（吸光度0.455）

    2. 試料液中のフッ化水素の量：1.15 × 10⁻⁶ × 0.350／0.455 ≒ 8.85 × 10⁻⁷ mol

    3. 吸引した空気の量：0.75 L/min × 10 min ＝ 7.5 L

    4. フッ化水素の気体の体積（25℃、1気圧のモル体積24.45 L/mol）：8.85 × 10⁻⁷ × 24.45 ≒ 2.16 × 10⁻⁵ L

    5. 体積分率：2.16 × 10⁻⁵ L ÷ 7.5 L ≒ 2.9 × 10⁻⁶ ＝ **2.9 ppm**


    よって（2）です。'
