  stem: ガスクロマトグラフ質量分析法（GC-MS 法）による環境空気中のエチレンオキシド濃度の測定に関する次の記述の㋑から㋩の［　］に入る用語の組合せとして、正しいものは下のうちどれか。「［㋑］に臭化水素酸を含浸・乾燥させたものを充塡した捕集管に試料空気を通気し、エチレンオキシドを［㋺］して2-ブロモエタノールとして捕集する。この2-ブロモエタノールをトルエン/［㋩］で抽出し、ガスクロマトグラフ質量分析法で分析する。」
