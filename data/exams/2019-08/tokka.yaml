  stem: 次の測定対象物質のうち、固体捕集法による捕集が不適切なものはどれか。
  columns: null
  choices:
  - コールタール
  - アクリロニトリル
  - クロロホルム
  - 酸化プロピレン
  - 1,2-ジクロロプロパン
  answer: 1
  choice_notes: []
  explanation: '**コールタール**は、粒子状（粉じん）の物質なので、ろ過捕集法で捕集します。固体捕集法は、ガス状・蒸気状の物質を、活性炭などの捕集剤に吸着させる方法なので、コールタールには不適切です。よって（1）です。


    アクリロニトリル、クロロホルム、酸化プロピレン、1,2-ジクロロプロパンは、いずれも固体捕集法で捕集できます。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
