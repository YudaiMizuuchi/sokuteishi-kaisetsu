  - 固体捕集法では、0.1 L･min⁻¹ の一定流量で試料空気を吸引する。
  - 固体捕集法には、吸着剤として、ポーラスポリマービーズを用いる方法もある。
  - 活性炭管で捕集した場合は、脱着に二硫化炭素を用いる。
  - 検出器には、炎光光度検出器（FPD）を用いる。
