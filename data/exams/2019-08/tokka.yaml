    アクリルアミドはFTD、塩化ビニルはFID、塩素化ビフェニル（PCB）はECD、o-フタロジニトリルは質量分析器で、適切な組合せです。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
