  stem: '液体捕集法を用いて環境空気試料を捕集する際の、必要最小吸引空気量Q（L）を求める次の式中のA、B、Cが表すものの組合せとして、正しいものは下のうちどれか。


    ただし、単位は次のとおりとする。


    吸引流量（L・min⁻¹）


    捕集時間（min）


    捕集液の量（mL）


    最終試料液の総量（mL）


    定量下限濃度（µg・mL⁻¹）


    管理濃度（mg・m⁻³）


    $Q=(A×B)/(C×管理濃度)$'
  columns:
