  stem: ピリジン-ピラゾロン法による環境空気中のシアン化水素濃度の測定に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 発色は、捕集後に得られた試料液に塩酸を加え酸性にした後、クロラミンT 及びピリジン-ピラゾロンを加えて行う。
  - 標準原液のシアン化物イオン濃度は、硝酸銀溶液で標定する。
  - 標準液は、標準原液を捕集液で希釈して調製する。
  - 試料の採取は、ミゼットインピンジャーに捕集液 10 mL を入れ、0.5～ 1 L･min⁻¹ の一定流量で試料空気を吸引する。
  - 試料空気中に硫化水素が共存すると、分析の妨害となる。
  answer: 1
  choice_notes: []
  explanation: 'ピリジン-ピラゾロン法によるシアン化水素の測定では、捕集した溶液を、**酢酸で中和**し、緩衝液で調整してから、クロラミンTとピリジン-ピラゾロンを加えて発色させます。「塩酸を加え酸性にした後」とする選択肢1は誤りです。同様の問題は、令和7年度第1回にも出題されています（出題実績）。


    標準原液のシアン化物イオン濃度は、硝酸銀溶液で標定します。標準液は、標準原液を捕集液で希釈して調製します。試料空気中に硫化水素が共存すると、分析の妨害になります。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
