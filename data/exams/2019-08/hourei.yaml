  stem: 労働安全衛生規則の衛生基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 溶融ガラスからガラス製品を成型する業務を行う屋内作業場については、半月以内ごとに1回、定期に、気温、湿度及びふく射熱を測定しなければならない。
  - 労働者を常時就業させる屋内作業場の気温が 10℃以下であるときは、換気に際し、労働者を 1 m/s 以上の気流にさらしてはならない。
  - 日常行う清掃のほか、大掃除を、6か月以内ごとに1回、定期に、統一的に行わなければならない。
  - 炭酸ガス(二酸化炭素)濃度が 5,000 ppm を超える場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 労働者を常時就業させる屋内作業場の気積を、設備の占める容積及び床面から 4 m をこえる高さにある空間を除き、労働者1人について、10 m³以上としなければならない。
  answer: 4
  choice_notes: []
  explanation: '関係者以外の立入りを禁止しなければならないのは、炭酸ガス濃度が **1.5 ％**を超える場所です。5,000 ppm とする選択肢4は誤りです。


    5,000 ppm（0.5 ％）は、事務所の室の二酸化炭素の含有率の基準です。数字の取り違えをねらった選択肢です。'
  figures: []
