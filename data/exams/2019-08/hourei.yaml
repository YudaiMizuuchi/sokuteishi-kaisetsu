  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業場の業種にかかわらず、新たに職務に就くこととなった職長に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 労働者の作業内容を変更したときは、当該労働者に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 常時特定粉じん作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、その科目についての特別教育を省略することができる。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目について特別教育を行わなければならない。
