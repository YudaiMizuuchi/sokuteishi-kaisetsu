  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 弗化水素ガスを発散する場所における業務に常時従事している労働者に対し、6か月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。
  - 定期健康診断を行ったときは、事業場の規模にかかわらず、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 雇入時の健康診断の結果については、事業場の規模にかかわらず、所轄労働基準監督署長に報告する必要はない。
  - 定期健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  answer: 2
  choice_notes: []
  explanation: 定期健康診断の結果報告書を所轄労働基準監督署長に提出しなければならないのは、常時**50人以上**の労働者を使用する事業場です。「事業場の規模にかかわらず」とする選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: 定期健康診断を行ったときは、事業場の規模にかかわらず、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
