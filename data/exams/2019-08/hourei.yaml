  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 第2種作業環境測定士は、指定作業場の作業環境測定において簡易測定機器を用いる分析を行うことができる。
  - 指定作業場の作業環境測定結果についての作業環境評価基準に基づく管理区分の決定は、作業環境測定士ではない者に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる。
  - 法令で義務付けられている作業環境測定のうち、騒音についての測定は、作業環境測定士ではない者に行わせることができる。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
  answer: 5
  choice_notes: []
  explanation: '管理区域の外部放射線による線量当量率又は線量当量の測定は、指定作業場の作業環境測定ではないので、作業環境測定士に行わせなければならないものではありません。選択肢5は誤りです。


    根拠：作業環境測定法施行令第1条第1項、作業環境測定法施行規則第1条。'
  figures: []
  law_note: null
