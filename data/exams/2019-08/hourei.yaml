  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 作業環境測定基準で定める一定の有機溶剤の濃度を測定する場合、当該有機溶剤以外の物が測定値に影響を及ぼすおそれがないときは、検知管方式の測定機器により測定することができる。
  - 鉱物性粉じんに係る単位作業場所が著しく狭いときは、単位作業場所における測定点の数を5未満とすることができる。
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - ろ過捕集方法による鉱物性粉じんの濃度の測定のための一つの測定点における試料空気の採取時間は、10分間以上の継続した時間としなければならない。
  - ろ過捕集方法に用いるろ過材は、0.3 μm の粒子を 95%以上捕集する性能を有するものに限られる。
  answer: 2
  choice_notes: []
  explanation: 'A 測定の測定点を5未満にできるのは、単位作業場所が著しく狭く、**かつ**、濃度がほぼ均一であることが明らかな場合です。著しく狭いだけでは5未満にできないので、選択肢2は誤りです。


    根拠：作業環境測定基準第2条第1項第1号の2。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんに係る単位作業場所が著しく狭いときは、単位作業場所における測定点の数を5未満とすることができる。
- num: 10
  status: published
