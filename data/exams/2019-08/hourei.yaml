  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 鋲打ち機、はつり機、鋳物の型込機等圧縮空気により駆動される機械又は器具を取り扱う業務を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 多量の液体空気、ドライアイス等を取り扱う業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 第2種酸素欠乏危険作業に係る作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  answer: 3
  choice_notes: []
  explanation: 液体空気やドライアイスなどを取り扱う寒冷な屋内作業場で、半月以内ごとに測定するのは、気温と湿度です。ふく射熱の測定は求められていないので、選択肢3は誤りです。
  figures: []
