  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時使用する労働者の数が 10人以上 50人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  - 常時 300人以上の労働者を使用する製造業の事業場においては、総括安全衛生管理者を選任しなければならない。
  - 常時 1,000人以上の労働者を使用する事業場においては、その業種に関係なく、事業場に専属の産業医を選任しなければならない。
  - 常時 1,000人を超える労働者を使用する事業場においては、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 総括安全衛生管理者には、当該事業場においてその事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
