  rank: null
  summary: null
  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 2種類以上の有機溶剤を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - 評価値の計算式は、1作業日について測定した場合と連続する2作業日について測定した場合とでは異なる。
  - 測定点における測定対象物質の濃度がその測定で採用した試料採取方法及び分析方法で求められる定量下限の値に満たない場合には、当該定量下限の値をその測定点の測定値とみなして、管理区分の区分を行う。
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - A測定の第1評価値が管理濃度未満の単位作業場所の管理区分は、B測定の測定値に関係なく、第1管理区分である。
  answer: 5
  choice_notes: []
  explanation: 'A 測定の第1評価値が管理濃度未満でも、B 測定値が管理濃度以上であれば、第1管理区分にはなりません（1.5倍以下なら第2、1.5倍を超えれば第3管理区分）。「B 測定の測定値に関係なく第1管理区分」とする選択肢5は誤りです。


    根拠：作業環境評価基準第2条第1項第2号。'
  figures: []
  law_note: null
  _key_choice: A測定の第1評価値が管理濃度未満の単位作業場所の管理区分は、B測定の測定値に関係なく、第1管理区分である。
