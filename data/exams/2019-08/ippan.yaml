  - 減圧症は、潜函作業者や潜水作業者などに発症するもので、高圧下作業からの減圧に伴い、血液中や組織中に溶け込んでいた窒素の気泡化が関与して発生する。
  - 腰痛予防のため、満18歳以上の男子労働者が人力のみにより取り扱う物の重量は、体重のおおむね 40％以下とする。
  - ノロウイルスは、ベロ毒素を産生するウイルスで、腹痛や出血を伴う水様性の下痢などを起こす。
  - 低体温症は、低温下の作業で全身が冷やされ、体の中心部の温度が 35 ℃程度以下に低下した状態をいい、意識消失、筋の硬直などの症状がみられる。
