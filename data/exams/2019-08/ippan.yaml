    - 許容濃度は、作業中のばく露濃度の変動があまり大きくない場合に利用される
    - 許容濃度等の勧告で、ヒトに対する発がん性は、第1群・第2群A・第2群Bの3種類に分類される（第1群＝発がん性があると判断できる物質、第2群＝おそらく発がん性がある物質。第3群はない）
