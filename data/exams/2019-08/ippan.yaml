  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 個人用保護具の使用によるばく露低減対策は、機械設備の密閉化等の衛生工学的対策、マニュアルの整備等の管理的対策等を講じても十分にリスクを低減できない場合に行うべき対策である。
  - ハザードは、労働災害発生の可能性と負傷又は疾病の重大性（重篤度）の組合せであると定義される。
  - リスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ずしも数値化する必要はなく、相対的な分類でも差し支えない。
  - 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - 化学物質等の適切な管理について必要な能力を有する者のうちから、化学物質管理者を指名してリスクアセスメント等に関する技術的業務を行わせる。
  answer: 2
  choice_notes: []
  explanation: ハザード（危険性又は有害性）は、労働者に負傷や疾病を生じさせる潜在的な根源です。労働災害発生の可能性と重篤度の組合せは「リスク」の定義なので、選択肢2は誤りです。
