  stem: 金属による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - カドミウムは、主として腎臓皮質に蓄積し、腎障害を起こす。
  - 金属熱は、鉄、アルミニウムなどの金属を溶融する作業などに長時間従事した際に、高温により体温調節機能が障害を受けたことにより発生する。
  - 金属水銀中毒では、感情不安定、幻覚などの精神障害や手指の震えなどがみられる。
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対する発がん性が疑われている。
  - ヒ素中毒では、角化症、黒皮症などの皮膚障害、末梢神経障害などがみられる。
  answer: 2
  choice_notes: []
  explanation: '金属熱は、亜鉛や銅などの金属の**ヒュームを吸入**して起こる疾病です。高温により体温調節機能が障害されて起こるもの（熱中症）ではないので、選択肢2は誤りです。


    名前に「熱」が付きますが、暑さによる障害ではなく、金属ヒュームを吸い込んだことへの体の反応です。'
