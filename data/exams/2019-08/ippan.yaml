  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - マンガンによる中毒では、筋のこわばり、歩行困難、発語障害などの症状がみられる。
  - 粉状のニッケル化合物は、生殖毒性、皮膚感作性のほか、ヒトに対する発がん性があるとされている。
  - 塩化ビニルによる中毒では、レイノー現象、指端骨溶解や肝血管肉腫などがみられる。
  - ベンゼンによる中毒では、白血病や再生不良性貧血などがみられる。
  - フッ化水素は、細胞内の呼吸酵素の障害による呼吸麻痺などを生じる。
  answer: 5
  choice_notes: []
  explanation: '細胞内の呼吸酵素を障害して呼吸麻痺を起こすのは、シアン化水素や硫化水素です。フッ化水素の主な健康障害は、皮膚や粘膜の深い化学熱傷と、慢性の骨や歯の障害なので、選択肢5は誤りです。


    令和5年度第2回にも、同じ論点があります。'
