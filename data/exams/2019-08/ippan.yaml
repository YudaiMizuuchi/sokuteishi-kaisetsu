  stem: 厚生労働省の｢職場における腰痛予防対策指針｣に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 取り扱う物の重量を明示し、著しく重心の偏っている荷物は、その旨を明示する。
  - 満18歳以上の女子労働者が人力のみにより取り扱う物の重量は、男性が取り扱うことのできる重量の 60％位までとする。
  - 腰部保護ベルトを、全員一律に使用するように指導する。
  - 直接床に座る座作業は、仙腸関節、股関節等に負担がかかることに留意する。
  - 重量物取扱い作業を2人以上で行う場合、身長差の大きな労働者同士を組み合わせないようにする。
  answer: 3
  choice_notes: []
  explanation: '腰部保護ベルトは、個人により効果が異なるため、全員に一律に使用させるのではなく、個人ごとに効果を確認してから使用の適否を判断します。選択肢3は誤りです。


    根拠：職場における腰痛予防対策指針。'
