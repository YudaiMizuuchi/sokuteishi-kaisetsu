  - 172.1680 g･mol⁻¹
  answer: 3
  choice_notes: []
  explanation: '原子量を足し合わせるときは、小数点以下の桁数が最も少ないものに合わせます。


    40.08 ＋ 32.06 ＋ 15.9994 × 6 ＋ 1.0079 × 4 ＝ 40.08 ＋ 32.06 ＋ 95.9964 ＋ 4.0316 ＝ 172.1680


    小数点以下の桁数が最も少ないのは、Ca と S の小数点以下2桁なので、結果も小数点以下2桁に丸めて **172.17 g/mol** です。よって（3）が正しいものです。


