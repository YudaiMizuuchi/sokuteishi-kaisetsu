  stem: 'CaSO₄･2 H₂O のモル質量を有効数字で表した場合、正しいものは下のうちどれか。ただし、各元素の原子量は次のとおりとする。


    Ca 40.08、S 32.06、O 15.9994、H 1.0079'
  choices:
  - 172 g･mol⁻¹
  - 172.2 g･mol⁻¹
  - 172.17 g･mol⁻¹
  - 172.168 g･mol⁻¹
  - 172.1680 g･mol⁻¹
  answer: 3
  choice_notes: []
  explanation: '原子量を足し合わせるときは、小数点以下の桁数が最も少ないものに合わせます。


    40.08 ＋ 32.06 ＋ 15.9994 × 6 ＋ 1.0079 × 4 ＝ 40.08 ＋ 32.06 ＋ 95.9964 ＋ 4.0316 ＝ 172.1680


    小数点以下の桁数が最も少ないのは、Ca と S の小数点以下2桁なので、結果も小数点以下2桁に丸めて **172.17 g/mol** です。よって（3）が正しいものです。


    令和6年度第1回にも、同じ型の問題があります。'
