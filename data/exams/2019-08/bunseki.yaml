  stem: 1 mol の理想気体に関する次の記述のうち、誤っているものはどれか。ただし、温度は絶対温度（熱力学温度）で表している。
  choices:
  - 温度が一定の条件で体積を2倍にすると、圧力は1/2倍になる。
  - 体積が一定の条件で温度を2倍にすると、圧力は2倍になる。
  - 圧力が一定の条件で温度を2倍にすると、体積は2倍になる。
  - 温度を2倍にして体積を1/2倍にすると、圧力は4倍になる。
  - 温度と体積の両方を2倍にすると、圧力は2倍になる。
  answer: 5
  choice_notes: []
  explanation: 理想気体の圧力は、絶対温度に比例し、体積に反比例します（P ＝ nRT／V）。温度と体積の両方を2倍にすると、圧力は 2 ÷ 2 ＝ 1 倍で、**変わりません**。「2倍になる」とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 温度と体積の両方を2倍にすると、圧力は2倍になる。
