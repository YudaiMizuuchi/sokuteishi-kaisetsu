  explanation: '溶媒抽出に使う有機溶媒の比重は、**水より小さい必要はありません**（MIBKは水より軽く、クロロホルムは水より重い溶媒で、どちらも使われます）。「水より小さくなければならない」とする選択肢3は誤りです。


    精製水には、蒸留水、イオン交換水などがあります。ガラス容器は、硝酸酸性溶液に浸した後、精製水で十分に洗浄して使います。キレート剤は、キレートをつくる金属によって、反応するpH範囲が異なります。アルカリ溶液の保存には、ガラス容器を使いません。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
