  stem: 作業環境空気中の金属類の分析に用いる試薬類に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 精製水には、蒸留水、イオン交換水などがある。
  - ガラス容器は、硝酸酸性溶液に浸した後、精製水で十分に洗浄してから用いる。
  - 溶媒抽出に用いる有機溶媒の比重は、水より小さくなければならない。
  - キレート剤は、キレートを作る金属によって反応する pH 範囲が異なる。
  - アルカリ溶液の保存には、ガラス容器を用いない。
