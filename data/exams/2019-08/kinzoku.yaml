  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 中空陰極ランプは、陰極が測定対象金属又はその合金からなり、その金属固有の輝線スペクトルを発する。
  - 中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して発光する。
  - 光源の輝線の線幅は、吸収線の線幅より広い。
  - 吸光度は光路長に比例する。
  - 電気加熱式原子化法（グラファイト炉法）は、フレーム原子化法に比べて測定感度が高い。
  answer: 3
  choice_notes: []
  explanation: '原子吸光分析法では、光源の輝線の線幅は、吸収線の線幅より**狭く**なければなりません。「広い」とする選択肢3は誤りです。同じ記述は、令和2年度第1回、令和6年度第1回にも出題されています（出題実績）。


    中空陰極ランプは、陰極が測定対象金属（またはその合金）で、その金属固有の輝線スペクトルを発し、金属原子が封入ガスのイオンと衝突して発光します。吸光度は光路長に比例します。電気加熱式原子化法は、フレーム原子化法に比べて、測定感度が高いです。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
