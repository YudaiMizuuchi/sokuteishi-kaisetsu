  stem: 高周波誘導結合プラズマ発光分析法（ICP-AES）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - プラズマの生成には、アルゴンが用いられる。
  - 最終試料液は、硫酸酸性が望ましい。
  - キャリアガス流量は、試料導入量や感度に影響を与える。
  - 検量線は、目的元素の特定波長のスペクトル線の強度を測定して作成する。
  - 原子吸光分析法に比べ、化学干渉はほとんどないが、物理干渉や分光干渉には注意を要する。
  answer: 2
  choice_notes: []
  explanation: 'ICP-AESの最終試料液は、**硝酸酸性**が望ましく、**硫酸酸性**は、試料溶液の粘性が高くなり、ネブライザーの吸い上げ量などに影響するので、望ましくありません。「硫酸酸性が望ましい」とする選択肢2は誤りです。


    プラズマの生成には、アルゴンを使います。キャリアガス流量は、試料導入量や感度に影響します。検量線は、目的元素の特定波長のスペクトル線の強度を測定して作成します。原子吸光分析法に比べて、化学干渉はほとんどなく、物理干渉や分光干渉には、注意が必要です。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
