  stem: 作業環境空気中の測定対象金属の測定に用いる蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 蛍光のエネルギーは吸収したエネルギーよりも小さく、蛍光の波長は必ず励起光の波長よりも長くなる。
  - 入射光に対して直角方向の蛍光を測定する。
  - 最もよく使用される試料の状態は、溶液状態である。
  - 溶液中の金属イオンの蛍光強度を測定する。
  - 吸光光度分析法に比べ、定量下限は低いが、測定に影響を及ぼす因子が多い。
  answer: 4
  choice_notes: []
  explanation: '蛍光光度分析法で、蛍光強度を測定する対象は、金属イオンそのものではなく、**キレート化剤と金属イオンがつくる錯体**（蛍光を示すもの）です。「溶液中の金属イオンの蛍光強度を測定する」とする選択肢4は誤りです。同様の記述は、令和2年度第1回にも出題されています（出題実績）。


    蛍光の波長は、励起光の波長より長くなります。入射光に対して直角方向の蛍光を測定します。最もよく使う試料の状態は、溶液状態です。吸光光度分析法に比べて、定量下限は低いですが、測定に影響を及ぼす因子が多いです。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
