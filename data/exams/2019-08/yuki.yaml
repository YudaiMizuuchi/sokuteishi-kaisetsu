  stem: ガスクロマトグラフ分析法に用いる水素炎イオン化検出器（FID）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 水素炎中で燃焼し、イオン化する物質の測定に適している。
  - 炭化水素の分析に適している。
  - 二硫化炭素に対する感度は低い。
  - 脂肪族炭化水素の同族体でのイオン発生量は、化合物中の炭素数にほぼ比例する。
  - 応答直線範囲は、電子捕獲検出器（ECD）より狭い。
  answer: 5
  choice_notes: []
  explanation: '水素炎イオン化検出器（FID）の応答直線範囲は、電子捕獲検出器（ECD）より**広い**です。「ECDより狭い」とする選択肢5は誤りです。


    FIDは、水素炎中で燃焼してイオン化する物質の測定に適し、炭化水素の分析に適しています。二硫化炭素に対する感度は低いです。脂肪族炭化水素の同族体では、イオン発生量は、炭素数にほぼ比例します。


    同様の記述は、令和6年度第1回にも出題されています（出題実績）。


    （参考：『機器分析の実務』）'
