  stem: 環境空気中の n-ヘキサンを真空捕集びんに捕集した。この試料ガス中のn-ヘキサンを定量するために、n-ヘキサン 1.8 mL を含む二硫化炭素溶液 50 mL から 3.0 µL をマイクロシリンジで採取し、清浄空気の入っている 1.0 Lの真空捕集びん中に完全に蒸発させ、標準ガスを作成した。試料ガス及び標準ガスを同一条件でガスクロマトグラフ分析したところ、試料ガスのピーク面積は、標準ガスのピーク面積の1/2であった。環境空気中の n-ヘキサン濃度として、正しい値に最も近いものは次のうちどれか。ただし、n-ヘキサン（液体）の密度を 0.66 g･cm⁻³、モル質量を 86 g･mol⁻¹とする。また、真空捕集びんの中は、25 ℃、1気圧とする。
  columns: null
  choices:
  - 5 ppm
  - 10 ppm
  - 15 ppm
  - 20 ppm
  - 25 ppm
  answer: 2
  choice_notes: []
  explanation: '次の順で計算します。


    1. 3.0 µLに含まれるn-ヘキサンの体積：3.0 µL × 1.8／50 ＝ 0.108 µL

    2. その質量：0.108 × 10⁻³ cm³ × 0.66 g/cm³ ≒ 7.13 × 10⁻⁵ g、物質量 ＝ 7.13 × 10⁻⁵ ÷ 86 ≒ 8.29 × 10⁻⁷ mol

    3. 気体の体積（25℃、1気圧のモル体積24.45 L/mol）：8.29 × 10⁻⁷ × 24.45 ≒ 2.03 × 10⁻⁵ L

    4. 標準ガスの濃度：2.03 × 10⁻⁵ L／1.0 L ≒ 20.3 ppm

    5. 試料ガスのピーク面積は、標準ガスの1/2なので、試料ガスの濃度は、20.3／2 ≒ **10 ppm**


    よって（2）です。'
