  stem: ガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 理論段数はカラムの長さ、内径、温度、キャリアガスの流速によって変化する。
  - カラムの長さが2倍になると、保持時間及び理論段数は共に約2倍になる。
  - 保持時間が同一の場合、理論段数が大きいほどピーク幅は狭くなり、カラム効率が良い。
  - ピークの幅の広がりには、カラム内での渦流拡散及びキャリアガスの線速度が関係する。
  - 充塡カラムでは渦流拡散が小さく、キャリアガスの種類による分離度の差が大きい。
