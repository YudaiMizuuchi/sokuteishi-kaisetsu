  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集袋に試料を採取する際に内容積 5 L 以上のものを用いる。
  - 小型ガス吸収管による試料採取時の空気吸引流量は、1 L･min⁻¹ 前後とする。
  - 活性炭管に試料を捕集する際に用いる電動ポンプは、活性炭管を接続して流量を調整する。
  - 真空捕集びんに試料を採取する際の空気吸引流量は一定ではない。
  - 流量計の校正には、基準流量計として、石けん膜流量計を用いることができる。
  answer: 2
  choice_notes: []
  explanation: '小型ガス吸収管の空気吸引流量は、**50〜100 mL/min程度**です。「1 L/min前後」とする選択肢2は誤りです。


    捕集袋の内容積は、5 L以上とします。活性炭管に試料を捕集するときの電動ポンプは、活性炭管を接続した状態で、流量を調整します。真空捕集びんの吸引流量は、瓶内の圧力が上昇するにつれて、減るので、一定ではありません。流量計の校正には、基準流量計として、石けん膜流量計を使えます。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
