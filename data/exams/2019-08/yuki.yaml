  stem: ガスクロマトグラフ分析法の定量下限を求める次の手順のうち、誤っているものはどれか。
  columns: null
  choices:
  - 標準液を調製し、検量線を作成する。
  - 管理濃度の1/10倍の標準ガスを捕集して得られる最終試料液濃度になるように調整した標準試料を調製する。
  - 標準試料を5回繰り返し分析し、濃度を検量線から求める。
  - 標準試料の測定濃度から標準偏差を求める。
  - 標準偏差の3倍に相当する濃度を定量下限とする。
  answer: 5
  choice_notes: []
  explanation: 'ガスクロマトグラフ分析法の定量下限は、管理濃度の1/10に相当する標準試料を、5回以上繰り返して分析し、標準偏差を求め、その**10倍**（10σ）に相当する濃度とします。「標準偏差の3倍に相当する濃度を定量下限とする」とする選択肢5は誤りです（3倍は、検出下限です）。同様の記述は、令和7年度第1回にも出題されています（出題実績）。


    （参考：『機器分析の実務』）'
