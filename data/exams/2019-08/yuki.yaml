  stem: 有機溶剤の液体捕集法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 試料空気の気泡を細かくすると、捕集率が高まる。
  - 試料空気との接触面積を大きくするために、ガラスビーズを入れることがある。
  - 捕集液内での気泡の滞留時間が長いほど、捕集率は高くなる。
  - 捕集液に溶解させて捕集する場合は、捕集液を加熱すると一般に捕集率を高めることができる。
  - 捕集液との化学反応により捕集することがある。
  answer: 4
  choice_notes: []
  explanation: '捕集液に溶解させて有機溶剤を捕集するときは、捕集液の温度が**低い**ほど、溶解度が大きくなり、捕集率が高くなります。**加熱**すると、気体が液体から逃げやすくなり、捕集率は低下します。「捕集液を加熱すると、一般に捕集率を高めることができる」とする選択肢4は誤りです。


    試料空気の気泡を細かくすると、捕集率は高まります。ガラスビーズを入れると、接触面積が大きくなります。気泡の滞留時間が長いほど、捕集率は高くなります。捕集液との化学反応により捕集することもあります。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
