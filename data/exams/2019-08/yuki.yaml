  stem: 有機溶剤に関する次の記述の［　］に入る溶剤名として、適当なものは下のうちどれか。「 は 60 ℃で液体であり、その 25 ℃における液体の密度は 1 g･cm⁻³より大きい。」
  columns: null
  choices:
  - クロロベンゼン
  - N,N-ジメチルホルムアミド
  - アセトン
  - 二硫化炭素
  - 酢酸イソペンチル
  answer: 1
  choice_notes: []
  explanation: '60℃で液体であるためには、沸点が60℃より高い必要があります。さらに、25℃での密度が1 g/cm³より大きいものを選びます。


    - 1 クロロベンゼン：沸点約132℃、密度約1.11 g/cm³ → 条件に合います。

    - 2 N,N-ジメチルホルムアミド：密度約0.94 g/cm³で、1より小さいです。

    - 3 アセトン：密度約0.79 g/cm³で、1より小さく、沸点も約56℃です。

    - 4 二硫化炭素：密度は約1.26 g/cm³ですが、沸点が約46℃なので、60℃では気体です。

    - 5 酢酸イソペンチル：密度約0.87 g/cm³で、1より小さいです。


    よって（1）です。（沸点・密度は、一般的な化学便覧の概数です。）'
