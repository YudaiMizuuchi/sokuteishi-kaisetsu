  stem: 有機溶剤Aの空気中濃度を吸光光度分析法で測定した。ミゼットインピンジャーに捕集液 10.0 mL を入れ、流量 1.0 L･min⁻¹ で試料空気を10分間吸引した。この捕集液のうちの 4.0 mL をとり、発色試薬 1.0 mL を加えて測定し、吸光度 0.30 を得た。一方、Aの濃度が 10 µg･mL⁻¹ の標準液 4.0 mL に発色試薬 1.0 mL を加え、測定したところ吸光度 0.54 を得た。有機溶剤Aの空気中濃度として、正しい値に最も近いものは次のうちどれか。なお、捕集前後で捕集液の体積は変化しないものとし、捕集率は 100％とし、Aのモル質量を 90 g･mol⁻¹ とする。また、25 ℃、1気圧下とする。
  columns: null
  choices:
  - 1.5 ppm
  - 2.5 ppm
  - 3.5 ppm
  - 4.5 ppm
  - 5.5 ppm
  answer: 1
  choice_notes: []
  explanation: '標準液と試料液は、同じ操作（捕集液4.0 mLに発色試薬1.0 mL）で発色させているので、吸光度の比で濃度を求めます。


    1. 捕集液の濃度：10 µg/mL × 0.30／0.54 ≒ 5.56 µg/mL

    2. 捕集液10.0 mL中の量：5.56 × 10.0 ≒ 55.6 µg

    3. 吸引した空気の量：1.0 L/min × 10 min ＝ 10 L

    4. 濃度：55.6 µg ÷ 10 L ＝ 5.56 µg/L ＝ 5.56 mg/m³

    5. ppmに換算（25℃、1気圧）：5.56 × 24.45／90 ≒ **1.5 ppm**


    よって（1）です。'
