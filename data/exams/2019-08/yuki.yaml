  stem: 次の有機溶剤のうち、25 ℃における飽和蒸気圧が最も小さいものはどれか。
  columns: null
  choices:
  - o-ジクロロベンゼン
  - エチルエーテル
  - メチルエチルケトン
  - メタノール
  - 酢酸メチル
  answer: 1
  choice_notes: []
  explanation: 飽和蒸気圧は、沸点が高い物質ほど小さくなります。沸点は、エチルエーテルが約35℃、酢酸メチルが約57℃、メタノールが約65℃、メチルエチルケトンが約80℃、**o-ジクロロベンゼンが約180℃**です。o-ジクロロベンゼンが最も高く、蒸気圧は最も小さいので、（1）です。（沸点は、一般的な化学便覧の概数です。）
