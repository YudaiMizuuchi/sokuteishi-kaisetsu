    alt: Ⓐ（化合物名）とⒷ（構造式）の2列の表。1＝アクリルアミド、Ⓑは、H₂C=CH-C-NH₂ で、中央のCの下にOが二重結合で結合。2＝ベンゾトリクロリド、Ⓑは、ベンゼン環にCCl₃が結合。3＝エチレンオキシド、Ⓑは、H₂CとCH₂が結合し、その下側のOがH₂CとCH₂の両方に結合した三員環。4＝o-トルイジン、Ⓑは、ベンゼン環の隣り合う炭素にNH₂とCH₃が結合。5＝o-フタロジニトリル、Ⓑは、ベンゼン環の隣り合う炭素に、それぞれN=C=Oが結合
