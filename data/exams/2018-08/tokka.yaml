  stem: エチレンイミン1gを容量1Lの真空容器に密封し、温度を20℃にした。このとき容器内に液体として存在するエチレンイミンの量に最も近いものは、次のうちどれか。ただし、20℃でのエチレンイミンの飽和蒸気圧は、21.3kPaであり、エチレンイミンのモル質量は、43.07g·mol⁻¹とする。
