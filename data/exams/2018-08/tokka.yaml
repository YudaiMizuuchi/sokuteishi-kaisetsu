  stem: 特定化学物質Ⓐとそのガスクロマトグラフ分析法に用いる検出器Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 硫化水素 ／ 炎光光度検出器(FPD)
  - アクリロニトリル ／ アルカリ熱イオン化検出器(FTD)
  - ナフタレン ／ 電子捕獲検出器(ECD)
  - ジメチル-2,2-ジクロロビニルホスフェイト(DDVP) ／ 質量分析器(MS)
  - 臭化メチル ／ 水素炎イオン化検出器(FID)
  columns:
  - Ⓐ
  - Ⓑ
  answer: 3
  choice_notes: []
  explanation: '**ナフタレン**のガスクロマトグラフ分析法では、検出器に、**質量分析器（MS）**を使います（または水素炎イオン化検出器）。電子捕獲検出器（ECD）は、ハロゲンなど、電子親和力の強い物質に高感度な検出器なので、ナフタレンとの組合せは誤りです。選択肢3は誤りです。


    硫化水素には炎光光度検出器（FPD）、アクリロニトリルにはアルカリ熱イオン化検出器（FTD）、DDVPには質量分析器（MS）、臭化メチルには水素炎イオン化検出器（FID）が、適切な組合せです。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
