  stem: 環境空気（25℃、1気圧）中のフッ化水素の濃度を吸光光度分析法で測定した。捕集液に0.70L·min⁻¹の流量で試料空気を10分間吸引して得られた試料液10mLについて定量操作を行い、その吸光度をブランクを対照として測定したところ0.100であった。フッ化水素の濃度が、1.00×10⁻³g·L⁻¹の標準溶液10mLにつき試料液と同様の定量操作を行って測定した吸光度は0.350であった。フッ化水素の環境空気中濃度（体積分率）として、正しい値に最も近いものは次のうちどれか。ただし、捕集率は100%とし、フッ化水素のモル質量を20.01g·mol⁻¹とする。
  choices:
  - 0.30ppm
  - 0.35ppm
  - 0.40ppm
  - 0.45ppm
  - 0.50ppm
  columns: null
  answer: 5
  choice_notes: []
  explanation: '次の順で計算します。


    1. 標準溶液10 mL中のフッ化水素の量：1.00 × 10⁻³ g/L × 0.010 L ＝ 1.00 × 10⁻⁵ g（吸光度0.350）

    2. 試料液中のフッ化水素の量：1.00 × 10⁻⁵ × 0.100／0.350 ≒ 2.86 × 10⁻⁶ g、物質量は 2.86 × 10⁻⁶ ÷ 20.01 ≒ 1.43 × 10⁻⁷ mol

    3. 気体の体積（25℃、1気圧のモル体積24.45 L/mol）：1.43 × 10⁻⁷ × 24.45 ≒ 3.49 × 10⁻⁶ L

    4. 吸引した空気の量：0.70 L/min × 10 min ＝ 7.0 L

    5. 体積分率：3.49 × 10⁻⁶ ÷ 7.0 ≒ 5.0 × 10⁻⁷ ＝ **0.50 ppm**


    よって（5）です。'
