  stem: カラムAとBを用いて、ある化合物を溶出させたとき、保持時間が同じであった。カラムAの理論段数が5,000、カラムBの理論段数が9,000の場合、カラムBにおけるピーク幅(W_B)とカラムAにおけるピーク幅(W_A)の比(W_B/W_A)に最も近い値は、次のうちどれか。
  choices:
  - '0.38'
  - '0.56'
  - '0.75'
  - '1.34'
  - '1.80'
  columns: null
  answer: 3
  choice_notes: []
  explanation: '保持時間が同じとき、ピーク幅 W は、理論段数 n の平方根に反比例します（W ＝ 4tR／√n）。


    W_B／W_A ＝ √（n_A／n_B）＝ √（5000／9000）＝ √0.556 ≒ **0.75**


    よって（3）です。同じ問題は、令和8年度第1回にも出題されています（出題実績）。


