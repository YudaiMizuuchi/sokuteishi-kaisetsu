  stem: 環境空気（25℃、1気圧）中のエチレンイミンの濃度を測定するため、試料空気を流量0.50L·min⁻¹で10分間、捕集液10mLに通気した。捕集液5.0mLを取り、クロロホルム5.0mLにエチレンイミンを抽出し、試料液とした。高速液体クロマトグラフで分析した結果、試料液中のピーク面積は3,600であった。エチレンイミン濃度が、0.50μg·mL⁻¹の標準液5.0mLを試料液と同様に処理して分析したところ、ピーク面積は10,000であった。環境空気中のエチレンイミン濃度として、正しい値に最も近いものは次のうちどれか。ただし、エチレンイミンのモル質量は43.07g·mol⁻¹とし、捕集率及び抽出率は100%とする。
  choices:
  - 0.10ppm
  - 0.20ppm
  - 0.40ppm
  - 0.60ppm
  - 0.80ppm
  columns: null
  answer: 2
  choice_notes: []
  explanation: '次の順で計算します。


    1. 試料液の濃度：標準液（0.50 µg/mL）のピーク面積が10,000、試料液が3,600なので、0.50 × 3600／10000 ＝ 0.18 µg/mL

    2. 試料液（クロロホルム5.0 mL）中の量：0.18 × 5.0 ＝ 0.90 µg（これは、捕集液10 mLのうちの5.0 mL分）

    3. 捕集液10 mL全体の量：0.90 × 10／5.0 ＝ 1.80 µg、物質量は 1.80 ÷ 43.07 ≒ 0.0418 µmol

    4. 気体の体積（25℃、1気圧のモル体積24.45 L/mol）：0.0418 × 24.45 ≒ 1.02 µL ＝ 1.02 × 10⁻⁶ L

    5. 吸引した空気の量：0.50 L/min × 10 min ＝ 5.0 L

    6. 体積分率：1.02 × 10⁻⁶ ÷ 5.0 ≒ 2.0 × 10⁻⁷ ＝ **0.20 ppm**


    よって（2）です。'
