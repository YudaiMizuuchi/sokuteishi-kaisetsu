  stem: 次の化合物Ⓐについて、その構造式Ⓑが誤っているものはどれか。
  choices:
  - アクリルアミド ／ 図の1
  - ベンゾトリクロリド ／ 図の2
  - エチレンオキシド ／ 図の3
  - o-トルイジン ／ 図の4
  - o-フタロジニトリル ／ 図の5
  columns:
  - Ⓐ
  - Ⓑ
  answer: 5
  choice_notes: []
  explanation: '各化合物の構造式を、図と照らし合わせます。


    - 5 o-フタロジニトリル：ベンゼン環の隣り合う2つの炭素に、**シアノ基（−CN）**が1つずつついた化合物です。図の5は、ベンゼン環に**イソシアネート基（−N＝C＝O）**が2つついた**ジイソシアネート**で、別の物質（フェニレンジイソシアネート）です。組合せは誤りです。

    - 1 アクリルアミド（CH₂＝CH−CO−NH₂）、2 ベンゾトリクロリド（ベンゼン環に−CCl₃）、3 エチレンオキシド（三員環のエポキシド）、4 o-トルイジン（ベンゼン環に隣り合ってNH₂とCH₃）は、正しい組合せです。


    よって（5）です。同じ型の問題は、令和2年度第1回、令和6年度第1回にも出題されています（出題実績）。'
  figures:
