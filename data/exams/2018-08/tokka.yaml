  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガラス製のセルは、紫外部の光を吸収する。
  - 発色試薬として、主に有機試薬が用いられる。
  - 光源からの光をモノクロメーターによって単色光として測定に用いる。
  - 吸光度は、入射光の強さに対する透過光の強さの比に比例する。
