  explanation: 'シアン化水素の吸光光度分析法（ピリジン-ピラゾロン法）では、発色試薬に、**クロラミンTとピリジン-ピラゾロン**を使います。ジフェニルカルバジドは、クロム(Ⅵ)の発色試薬なので、「発色試薬として、ジフェニルカルバジドを用いる」とする選択肢5は誤りです。


    シアン化水素は、ミゼットインピンジャーで水酸化ナトリウム溶液に捕集します。標準原液は、シアン化カリウムで調製し、シアン化物イオン濃度を、硝酸銀溶液で滴定して標定します。捕集した溶液は、酢酸で中和してから、発色操作を行います。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
