  explanation: 'マゼンタは、**それ自体が色素**（塩基性色素）なので、発色操作を行わず、ろ紙に捕集した試料をメタノールで溶出して、そのまま吸光度を測定できます。アクリロニトリル、トルエンジイソシアネート、p-ニトロクロロベンゼン、MOCAは、発色操作が必要です。よって（1）です。同じ問題は、令和7年度第1回にも出題されています（出題実績）。


