  columns: null
  answer: 4
  choice_notes: []
  explanation: '次の順で、全量が蒸発したときの圧力と、飽和蒸気圧を比べます。


    1. 物質量：1 g ÷ 43.07 g/mol ≒ 0.02322 mol

    2. 全量が蒸気になったときの圧力：P ＝ nRT／V ＝ 0.02322 × 8.31 × 10³ × 293 ／ 1 ≒ 5.65 × 10⁴ Pa（約56.5 kPa）

    3. 飽和蒸気圧（21.3 kPa）より大きいので、一部は液体として残り、気体は飽和蒸気圧（21.3 kPa）になります。

    4. 気体の物質量：n ＝ PV／RT ＝ 21.3 × 10³ × 1 ／（8.31 × 10³ × 293）≒ 8.75 × 10⁻³ mol、質量は 8.75 × 10⁻³ × 43.07 ≒ 0.377 g

    5. 液体として残る質量：1 − 0.377 ≒ **0.62 g**


    よって（4）です。'
