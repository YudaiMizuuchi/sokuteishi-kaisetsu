  stem: 加熱脱着法を用いたo-フタロジニトリルのガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ポーラスポリマービーズとガラス繊維ろ紙を組み合わせた相補型ろ過捕集法で捕集する。
  - 捕集剤とろ紙の入った捕集管は、あらかじめ加熱処理して分析の妨害となる物質を除去する。
  - 溶媒抽出には、アセトニトリルを使用する。
  - 試料を捕集した捕集管は、両端を真ちゅう製保存キャップで密栓して保管する。
  - 検出器には、質量分析器（MS）を使用する。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '加熱脱着法は、捕集管を加熱して、捕集した物質を、そのままガスクロマトグラフに導入する方法なので、**溶媒抽出は行いません**。「溶媒抽出には、アセトニトリルを使用する」とする選択肢3は誤りです。


    捕集は、ポーラスポリマービーズとガラス繊維ろ紙を組み合わせた、相補型ろ過捕集法で行います。捕集剤とろ紙の入った捕集管は、あらかじめ加熱処理して、分析の妨害となる物質を除去します。試料を捕集した捕集管は、両端を真ちゅう製保存キャップで密栓して保管します。検出器には、質量分析器を使います。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
