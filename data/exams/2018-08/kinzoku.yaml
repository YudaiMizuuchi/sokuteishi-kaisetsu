  stem: ICP-AES法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フレーム原子吸光分析法に比べ、検量線の直線範囲が広い
  - 試料中の測定目的元素を高周波プラズマで励起し、発光させる。
  - 化学干渉は少ないが、分光干渉を考慮して、測定波長を選択する。
  - 試料溶液の粘性は、測定値に影響しない。
  - 多元素同時測定を行うことができる。
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'ICP-AES法では、試料溶液の**粘性**が、ネブライザーの吸い上げ量に影響するので、測定値に影響します。「粘性は、測定値に影響しない」とする選択肢4は誤りです。同じ記述は、令和6年度第1回にも出題されています（出題実績）。


    ICP-AESは、フレーム原子吸光分析法に比べて、検量線の直線範囲が広いです。試料中の測定目的元素を、高周波プラズマで励起し、発光させます。化学干渉は少ないですが、分光干渉を考慮して、測定波長を選びます。多元素同時測定ができます。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
