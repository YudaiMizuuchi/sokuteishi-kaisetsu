  stem: 作業環境中の金属の分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸光光度分析法では、可視光が用いられる。
  - 蛍光光度分析法は、温度、pH、濃度などの影響を受けやすい。
  - フレーム原子吸光分析法の感度は、フレームの種類によらない。
  - 誘導結合プラズマ原子発光分析法(ICP-AES法)の感度は、フレーム原子吸光分析法と同程度又はそれ以上である。
  - 誘導結合プラズマ質量分析法(ICP-MS法)で分析する試料液は、硝酸酸性が望ましい。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'フレーム原子吸光分析法の感度は、**フレームの種類によって変わります**（温度や還元性が異なるため）。「フレームの種類によらない」とする選択肢3は誤りです。


    吸光光度分析法では、可視光を使います。蛍光光度分析法は、温度、pH、濃度などの影響を受けやすいです。ICP-AESの感度は、フレーム原子吸光分析法と同程度またはそれ以上です。ICP-MS法で分析する試料液は、硝酸酸性が望ましいです。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』、『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
