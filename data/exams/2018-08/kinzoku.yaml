  stem: 金属酸化物の酸への溶解に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 酸化ニッケル(Ⅱ)は、塩酸に溶ける。
  - 酸化クロム(Ⅲ)は、塩酸に溶ける。
  - 酸化コバルト(Ⅱ)は、塩酸に溶ける。
  - 酸化マンガン(Ⅳ)は、塩酸に溶ける。
  - 酸化鉛(Ⅱ)は、硝酸に溶ける。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '**酸化クロム(Ⅲ)**（Cr₂O₃）は、化学的に非常に安定で、**塩酸にほとんど溶けません**。「塩酸に溶ける」とする選択肢2は誤りです。同じ記述は、令和元年度第1回、令和5年度第1回にも出題されています（出題実績）。


    酸化ニッケル(Ⅱ)、酸化コバルト(Ⅱ)、酸化マンガン(Ⅳ)は塩酸に、酸化鉛(Ⅱ)は硝酸に溶けます。'
