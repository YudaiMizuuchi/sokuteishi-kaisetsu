  stem: ベリリウムの分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸光光度分析法よりも蛍光光度分析法の方が感度が高い。
  - ベリロンⅢとベリリウムとの錯体は、共存物質の影響を避けるためpH10付近のアルカリ性で発色させるのがよい。
  - 塩化スズ(Ⅱ)溶液は、モリン試薬の酸化を防ぎ蛍光を安定に保つ作用がある。
  - モリン錯体は、水酸化ナトリウム濃度が0.02～0.1mol·L⁻¹の範囲で蛍光強度が最も大きくなる。
  - 電気加熱原子吸光分析法では、灰化温度を1,100℃以上にする。
