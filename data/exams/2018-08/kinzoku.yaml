  explanation: '発色反応を促進するために加熱操作を行った試料は、**常温に戻してから**測定します。「発色後、直ちに測定する」とする選択肢5は誤りです。同じ記述は、令和8年度第1回にも出題されています（出題実績）。


    石英セルは、全波長領域で使えます。可視領域の光源は、タングステンランプです。吸光度の測定には、通常、極大吸収波長を選びます。モル吸光係数は、波長に依存します。


