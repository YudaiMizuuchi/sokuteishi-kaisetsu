  - フレーム原子吸光分析法の感度は、フレームの種類によらない。
  - 誘導結合プラズマ原子発光分析法(ICP-AES法)の感度は、フレーム原子吸光分析法と同程度又はそれ以上である。
  - 誘導結合プラズマ質量分析法(ICP-MS法)で分析する試料液は、硝酸酸性が望ましい。
