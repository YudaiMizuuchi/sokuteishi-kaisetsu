  - 酸素欠乏等とは、空気中の酸素の濃度が18%未満である状態又は空気中の硫化水素の濃度が10ppmを超える状態をいう。
  - 酸素欠乏症とは、酸素欠乏の空気を吸入することにより生ずる症状が認められる状態をいう。
  - 硫化鉱、乾性油、魚油その他空気中の酸素を吸収する物質を入れてあるタンクの内部における作業は、第2種酸素欠乏危険作業である。
  - 第一鉄塩類を含有している地層に接する井戸の内部における作業は、第1種酸素欠乏危険作業である。
