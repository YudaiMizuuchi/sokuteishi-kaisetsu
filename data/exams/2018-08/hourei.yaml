  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 騒音の測定点は、原則として単位作業場所の床面上に6m以下の等間隔で引いた縦の線と横の線との交点の床上50cm以上150cm以下の位置としなければならない。
  - 鉱物性粉じんの濃度の測定を相対濃度指示方法によって行う場合には、当該単位作業場所における1箇所以上の測定点において、同時に分粒装置を用いるろ過捕集方法及び重量分析方法による測定を行わなければならない。
  - 単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、測定点の数は5未満としてよい。
  - 石綿等を取り扱う屋内作業場における空気中の石綿の濃度の測定は、ろ過捕集方法及び計数方法によらなければならない。
  answer: 2
  choice_notes: []
  explanation: '騒音の測定点の高さは、床上 **120 cm 以上 150 cm 以下**です。50 cm 以上 150 cm 以下とする選択肢2は誤りです。


    50〜150 cm は、有害物質の A 測定の測定点の高さです。'
  figures: []
  law_note: null
  _key_choice: 騒音の測定点は、原則として単位作業場所の床面上に6 m以下の等間隔で引いた縦の線と横の線との交点の床上50 cm以上150 cm以下の位置としなければならない。
