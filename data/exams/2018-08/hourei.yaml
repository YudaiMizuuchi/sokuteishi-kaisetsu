  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - 測定点における測定対象物質の濃度がその測定で採用した試料採取方法及び分析方法で求められる定量下限の値に満たない場合には、当該定量下限の値をその測定点の測定値とみなして、管理区分の区分を行うものとする。
  - A測定のみを行った場合、第1評価値が管理濃度以上であり、かつ、第2評価値が管理濃度以下である単位作業場所の管理区分は、第2管理区分である。
  - A測定とB測定を行った場合、A測定の第1評価値及びB測定の測定値が管理濃度に満たない単位作業場所の管理区分は、第1管理区分である。
  - A測定とB測定を行った場合、B測定の測定値がA測定の第1評価値の1.5倍を超えている単位作業場所の管理区分は、第3管理区分である。
  answer: 5
  choice_notes: []
  explanation: 'B 測定の測定値が**管理濃度**の1.5倍を超えれば、第3管理区分です。比べる相手は第1評価値ではないので、選択肢5は誤りです。


    根拠：作業環境評価基準第2条第1項第2号。'
  figures: []
  law_note: null
  _key_choice: A測定とB測定を行った場合、B測定の測定値がA測定の第1評価値の1.5倍を超えている単位作業場所の管理区分は、第3管理区分である。
