  stem: 労働安全衛生規則の衛生基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 炭酸ガス(二酸化炭素)濃度が1.5%を超える場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 硫化水素濃度が10ppmを超える場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 鋲打ち機等圧縮空気により駆動される機械を取り扱う業務を行い、著しい騒音を発する屋内作業場の施設又は設備を変更した場合には、遅滞なく、等価騒音レベルを測定しなければならない。
  - 労働者を常時就業させる屋内作業場において、換気設備を設けていないときは、窓その他の開口部の直接外気に向かって開放することができる部分の面積が、常時床面積の25分の1以上になるようにしなければならない。
  - 日常行う清掃のほか、大掃除を、6か月以内ごとに1回、定期に、統一的に行わなければならない。
  answer: 4
  choice_notes: []
  explanation: '換気設備を設けていない屋内作業場では、直接外気に向かって開放できる窓などの面積を、常時床面積の **20分の1以上**にしなければなりません。25分の1とする選択肢4は誤りです。


    根拠：労働安全衛生規則第601条（窓その他の開口部の直接外気に向かって開放できる部分の面積を、常時床面積の二十分の一以上にする）。'
  figures: []
