  stem: 電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。ただし、放射線業務従事者は緊急作業には従事しないものとする。
  choices:
  - 外部放射線による実効線量と空気中の放射性物質による実効線量との合計が3か月間につき1.3mSvを超えるおそれがある区域は、管理区域である。
  - 管理区域内において放射線業務に従事する労働者の受ける実効線量が5年間につき100mSvを超えず、かつ、1年間に50mSvを超えないようにしなければならない。
  - 放射線業務従事者の受ける等価線量のうち、眼の水晶体に受けるものについては、1年間につき150mSvを超えないようにしなければならない。
  - 放射線業務従事者の皮膚に受ける等価線量については、1年間につき500mSvを超えないようにしなければならない。
  - 女性の放射線業務従事者で妊娠する可能性があり、かつ、妊娠中ではない者の受ける実効線量は、1か月間につき2mSvを超えないようにしなければならない。
  answer: 5
  choice_notes: []
  explanation: '妊娠する可能性があり、かつ妊娠中でない女性の放射線業務従事者の実効線量の限度は、**3か月間につき 5 mSv** です。1か月間につき 2 mSv とする選択肢5は誤りです。


    平成30年度第2回にも、3か月間につき 5 mSv という正しい記述があります。'
  figures: []
  law_note: 選択肢3の眼の水晶体の等価線量限度（1年間につき150 mSv）は、令和3年4月の改正前の値です。現在は、5年間につき100 mSv、かつ1年間につき50 mSv です。
