  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 指定作業場の作業環境測定において、簡易測定機器以外の機器を用いて行う分析を第2種作業環境測定士に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる
  - 放射性物質取扱作業室における空気中の放射性物質の濃度の測定は、作業環境測定士ではない者に行わせることはできない。
  - 法令で定める著しい騒音を発する屋内作業場についての等価騒音レベルの測定は、作業環境測定士ではない者に行わせることができる。
  - 指定作業場について作業環境測定を自ら行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  answer: 1
