  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、定期健康診断を受けた労働者のうち、無所見の者を除き、再検査を必要とする者及び異常の所見があると診断された者に対し、遅滞なく、健康診断結果の通知を行わなければならない。
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に報告する必要はない。
  - 雇入時の健康診断において、医師による健康診断を受けた後3か月を経過しない者が、その健康診断結果を証明する書面を提出したときは、その健康診断の項目に相当する項目については省略することができる。
  - 事業者は、雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  answer: 1
  choice_notes: []
  explanation: 定期健康診断を受けた労働者には、異常の所見の**有無にかかわらず**、遅滞なく結果を通知しなければなりません。「無所見の者を除き」とする選択肢1は誤りです。
  figures: []
