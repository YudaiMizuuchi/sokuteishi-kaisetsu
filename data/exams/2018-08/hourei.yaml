  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、2人以上の衛生管理者を選任する場合、そのうちの1人は、当該事業場に所属していない労働衛生コンサルタントとすることができる。
  - 事業者は、当該事業場の労働者で、作業環境測定を実施している作業環境測定士であるものを衛生委員会の委員として指名することができる。
  - 事業者は、総括安全衛生管理者を選任する場合には、当該事業場において、その事業の実施を統括管理する者をもって充てなければならない。
  - 工業的業種に属する事業場においては常時50人以上の労働者を使用する場合に、非工業的業種に属する事業場においては常時100人以上の労働者を使用する場合に、それぞれ衛生委員会を設けなければならない。
  - 作業環境測定基準に従って行わなければならない作業環境測定の結果及びその結果の評価に基づく対策の樹立に関することは、衛生委員会における付議事項とされている。
  answer: 4
  choice_notes: []
  explanation: '衛生委員会は、業種にかかわらず、常時**50人以上**の労働者を使用する事業場に設置しなければなりません。非工業的業種は100人以上とする選択肢4は誤りです。


    業種によって規模が変わるのは、安全委員会の方です。'
  figures: []
  law_note: null
