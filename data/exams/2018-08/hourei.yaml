  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 廃棄物の焼却施設において焼却灰を取り扱う業務(設備の解体等に伴うものを除く。)を行う作業場について、6か月以内ごとに1回、定期に、その作業場における空気中のダイオキシン類の濃度を測定しなければならない。
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始する前に、当該作業場における空気中の硫化水素の濃度を測定しなければならない。
  - 動力により駆動されるハンマーを用いる金属の鍛造の業務を行い、著しい騒音を発する屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 溶融ガラスからガラス製品を成型する業務を行う暑熱の屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  answer: 3
  choice_notes: []
  explanation: 第1種酸素欠乏危険作業では、その日の作業開始前に測定するのは**酸素**の濃度です。硫化水素の濃度もあわせて測定するのは、第2種酸素欠乏危険作業です。選択肢3は誤りです。
  figures: []
