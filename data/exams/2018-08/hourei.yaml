  stem: 安全衛生教育に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、法令で定める業種に属する事業場においては、新たに職務に就くこととなった職長に対し、原則として、安全又は衛生のための教育を行わなければならない。
  - 事業者は、労働者の作業内容を変更したときは、その労働者に対し、原則として、安全又は衛生のための教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、その科目についての特別教育を省略することができる。
  - 特別教育の講師は、法令で定める資格を有する者のうちから選任しなければならない。
  - 事業者は、衛生管理者、安全衛生推進者等、労働災害の防止のための業務に従事する者に対し、その業務に関する能力の向上を図るための教育等を行い、又はこれらを受ける機会を与えるよう努めなければならない。
  answer: 4
