  stem: X線回折基底標準吸収補正法により、粉じん中の石英の定量を行った。直径25mmのフィルター（採じん面の直径20mm）に再発じん法により1.57mgの粉じんを捕集した。このフィルターの石英の主回折線強度を測定し、粉じん中の石英含有率を求めたところ24.0%が得られた。測定された石英の主回折線強度（cps）として、正しい値に最も近いものは下のうちどれか。ただし、X線吸収補正係数は1.20、石英の回折線強度は石英が1mg/cm²のとき6,400cpsとする。
  choices:
