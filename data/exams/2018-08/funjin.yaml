  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、不適当なものはどれか。
  choices:
  - 粒径が1μmより大きい粒子では、慣性、重力及びさえぎり効果が有効であり、粒径が大きいほど捕集率は上昇する。
  - 繊維層フィルターは、1本1本の繊維が独立した円柱とみなすことができる。
  - 繊維層フィルターの粉じん捕集率は、粒径0.1～0.3μmのあたりで最も低くなる。
  - メンブランフィルターは、繊維層フィルターと同程度の空間率を持つ多孔質フィルターである。
  - 粉じんを測定する場合には、0.3μmのステアリン酸粒子に対する捕集率が95%以上であれば、吸湿量が小さいろ過材を使用したほうがよい。
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'メンブランフィルターは、繊維層フィルターに比べて、**空間率の低い**多孔質フィルターです。「繊維層フィルターと同程度の空間率」とする選択肢4は不適当です。同様の記述は、令和3年度第1回にも出題されています（出題実績）。


    粒径が1 µmより大きい粒子では、慣性、重力、さえぎり効果が有効です。繊維層フィルターは、1本1本の繊維が独立した円柱とみなせます。繊維層フィルターの捕集率は、粒径0.1〜0.3 µm付近で最も低くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
