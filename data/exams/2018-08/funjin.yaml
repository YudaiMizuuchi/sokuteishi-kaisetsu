  rank: null
  stem: '空気中に浮遊している粒子が沈降する際、粒子は上向きの力を及ぼす抵抗力及び浮力と、下向きの力を及ぼす重力とが釣り合って、一定の速度で沈降し、この速度を終末速度（Vs）という。微小粒子の終末速度を表すストークスの式として、正しいものは次のうちどれか。


    ただし、ρ：粒子の密度、ρ₀：空気の密度、g：重力加速度、η：空気の粘性係数、dp：粒子の直径とする。'
  choices:
  - Vs＝(ρ₀－ρ)·g/(9η)·dp²
  - Vs＝(ρ₀－ρ)·g/(9η)·dp
  - Vs＝(ρ₀－ρ)·g/(18η)·dp²
  - Vs＝(ρ－ρ₀)·g/(18η)·dp
  - Vs＝(ρ－ρ₀)·g/(18η)·dp²
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'ストークスの式は、粒子の密度を ρ、媒質の密度を ρ₀、粘性係数を η、粒子の直径を dp として、


    **Vs ＝（ρ − ρ₀）× g × dp² ／（18 η）**


    です。終末速度は、粒子の直径の**2乗**に比例し、粘性係数に反比例します。よって（5）です。


    （参考：『作業環境測定のための労働衛生の知識』）'
