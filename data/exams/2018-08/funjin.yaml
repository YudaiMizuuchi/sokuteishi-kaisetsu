  stem: 慣性衝突式分粒装置（インパクター）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - インパクターには、円形ノズル式とスリット式とがある。
  - 円形ノズル式インパクターで所定の流量より大きな流量で吸引すると測定値は大きくなる。
  - 吸入性粉じん濃度測定用インパクターは、50%分粒粒径を4.0μmとして設計・製作されている。
  - 円形ノズル式インパクターで分粒される粒子の粒径は、ノズルを通過する空気の速度の1/2乗に反比例する。
  - インパクターでは、慣性パラメータの値を設定して吸引流量を求める。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '円形ノズル式インパクターで、**所定の流量より大きな流量で吸引**すると、流速が速くなり、50％分粒粒径は小さいほうへ移行して、通過する粒子が少なくなるので、**測定値は小さく**なります。「測定値は大きくなる」とする選択肢2は誤りです。同様の記述は、令和8年度第1回などにも出題されています（出題実績）。


    インパクターには、円形ノズル式とスリット式があります。吸入性粉じん濃度測定用インパクターは、50％分粒粒径を4.0 µmとして設計・製作されています。分粒される粒子の粒径は、ノズルを通過する空気の速度の1/2乗に反比例します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
