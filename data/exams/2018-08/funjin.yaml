  stem: '次の条件で、石綿粉じんを直径25mmのセルローズエステルメンブランフィルター（採じん面の直径22mm）上に捕集して位相差顕微鏡を用いて計数を行った。この試料において、1視野に認められた繊維数の平均値が6.6本であった。このときの繊維数濃度に最も近いものは下のうちどれか。ただし、ブランクの値を0本とする。


    捕集流量：1L/min


    捕集時間：20分間


    計測視野：直径300μmの円形'
  choices:
