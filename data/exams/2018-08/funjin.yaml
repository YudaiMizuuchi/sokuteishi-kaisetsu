  - フッ素樹脂加工グラスファイバーろ紙の吸湿性は、石英繊維ろ紙よりも小さい。
  - フッ素樹脂加工グラスファイバーろ紙による圧力損失は、セルローズエステルメンブランフィルターよりも小さい。
