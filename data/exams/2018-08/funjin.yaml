  stem: X線回折基底標準吸収補正法によって、粉じん中の石英を定量するための方法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金属基底標準板は、石英の主回折線より高角度側に回折線のある亜鉛又はアルミニウムを用いる。
  - X線吸収補正係数は、計測された金属の回折線の強度と石英の回折線の強度との比から求める。
  - 検量線用標準フィルター試料は、ろ過材上の標準石英粒子の量0.2～1.2mg/cm²くらいまで7段階程度になるように作製する。
  - 検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度をとり、横軸に石英量をとって作成する。
  - 試料の採取にフッ素樹脂加工グラスファイバーろ紙を用いた場合には、ろ紙に固有の測定回折線を用いることができる。
  columns: null
  answer: 2
