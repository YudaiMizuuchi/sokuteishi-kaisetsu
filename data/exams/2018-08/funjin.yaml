  stem: 空気中の粒子の挙動等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 同じ大きさの球形粒子の空気力学相当径は、粒子の密度の平方根に比例する。
  - 空気力学相当径が10μmの粒子は、肺の深部(肺胞)へはほとんど到達しない。
  - 慣性力場での50%分粒粒径は、ノズル式の分粒装置では、ノズルの直径に比例する。
  - 遠心力場における粒子の半径方向への移動速度は、角速度の2乗に比例する。
  - サイクロン式分粒装置は、遠心力場における粒子の移動を利用している。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '慣性力場での50％分粒粒径は、ノズル式の分粒装置では、ノズルの直径に**単純には比例しません**（ストークス数が一定になる条件から、ノズル直径の1.5乗などに依存します）。「ノズルの直径に比例する」とする選択肢3は誤りです。


    空気力学相当径は、粒子の密度の平方根に比例します。空気力学相当径が10 µmの粒子は、肺の深部（肺胞）にはほとんど到達しません。遠心力場における粒子の半径方向への移動速度は、角速度の2乗に比例します。サイクロン式分粒装置は、遠心力場における粒子の移動を利用しています。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
  figures: []
