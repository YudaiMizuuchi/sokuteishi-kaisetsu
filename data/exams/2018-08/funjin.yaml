  choice_notes: []
  explanation: '次の順で計算します。


    1. 捕集した空気の量：1 L/min × 20 min ＝ 20 L ＝ 20000 cm³

    2. 採じん面の面積：直径22 mm（半径1.1 cm）なので、π × 1.1² ≒ 3.80 cm²

    3. 1視野の面積：直径300 µm（0.03 cm）なので、π × 0.015² ≒ 7.07 × 10⁻⁴ cm²

    4. 採じん面全体の視野数：3.80 ÷ 7.07 × 10⁻⁴ ≒ 5380視野

    5. フィルター全体の繊維数：6.6本 × 5380 ≒ 35500本

    6. 繊維数濃度：35500 ÷ 20000 ≒ **1.8本/cm³**


    よって（2）です。'
