    金属基底標準板には、石英の主回折線より高角度側に回折線のある、亜鉛またはアルミニウムを使います。検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度、横軸に石英量をとって作成します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
