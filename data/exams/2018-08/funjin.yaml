  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、不適当なものはどれか。
  choices:
  - 粒径が1μmより大きい粒子では、慣性、重力及びさえぎり効果が有効であり、粒径が大きいほど捕集率は上昇する。
  - 繊維層フィルターは、1本1本の繊維が独立した円柱とみなすことができる。
