  stem: 空気中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 慣性衝突式分粒装置を通過して、フィルター上に捕集される粒子の平均粒径は、ノズルを通過する気流の速度が速いほど小さい。
  - 流体とともに運動している粒子のブラウン運動による拡散速度は、粒径5μm以上では無視できる。
  - 凝集によって粒子数濃度が1/10になる時間は、粒子数濃度が高いほど短い。
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は小さな粒子の方が速い。
  - 温度の偏りがある空間では、高温側及び低温側の空気分子の運動量の違いにより、粒子は高温側に向かう力を受ける。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '温度の偏りがある空間では、高温側の空気分子のほうが運動量が大きいので、粒子は、高温側から押されて、**低温側**に向かう力（熱泳動力）を受けます。「高温側に向かう力を受ける」とする選択肢5は誤りです。同じ記述は、令和4年度第1回にも出題されています（出題実績）。


    慣性衝突式分粒装置では、ノズルを通過する気流の速度が速いほど、フィルター上に捕集される粒子の平均粒径は小さくなります。粒径5 µm以上では、ブラウン運動による拡散は、無視できます。凝集によって粒子数濃度が1/10になる時間は、粒子数濃度が高いほど短くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
