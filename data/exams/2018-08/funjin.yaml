  stem: X線回折分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 通常の定性分析では、ゴニオメータの走査速度は2°/min程度が適当である。
  - ブラッグの条件を満たした方向にのみ、結晶のX線回折が生ずる。
  - 照射X線の強度は、管電圧、管電流及び発散スリットの幅によって調整する。
  - 結晶格子の面間隔(d)の単位は、通常、オングストローム(Å)で表わされている。
  - X線管球より放射される連続X線の最大強度波長と特性X線の波長は、印加電圧を下げると、共に短波長側に遷移する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'X線管球から放射される**連続X線の最大強度波長**は、印加電圧を下げると、**長波長側**に移ります。一方、**特性X線の波長**は、対陰極物質の元素で決まり、印加電圧を変えても**変わりません**。「共に短波長側に遷移する」とする選択肢5は誤りです。


    通常の定性分析では、ゴニオメータの走査速度は2°/min程度が適当です。ブラッグの条件を満たした方向にのみ、結晶のX線回折が生じます。照射X線の強度は、管電圧、管電流、発散スリットの幅で調整します。結晶格子の面間隔（d）の単位は、通常、オングストローム（Å）です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
