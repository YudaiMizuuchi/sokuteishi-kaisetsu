  stem: 環境空気中のガス状放射性物質の放射能測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 端窓型GM計数管を使用したサンプラ型ガスモニタは、ガス状β線放出核種の測定に使用される。
  - 通気型電離箱の検出下限濃度は、電離箱の容積に依存する。
  - ガス捕集用電離箱の動作電圧は、飽和電離電流とならないように設定する。
  - ガス捕集用電離箱において、α線に対する電離効率は、β線に対する電離効率より高い。
  - 捕集用ガス容器を用いた直接捕集方法による測定では、ガス容器は原則として、容積1,000cm³以上のものを用いる。
