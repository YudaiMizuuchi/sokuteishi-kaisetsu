  - 電離箱によるトリチウム化水蒸気の捕集は、その内壁に放射能汚染を生じやすい。
  - ガス状トリチウムは、酸化させることにより、トリチウム化水蒸気として測定が可能である。
  - トリチウム化水蒸気のシリカゲルによる捕集は、1か月程度の長期の連続サンプリングが可能である。
  - ガス捕集用電離箱による測定では、水蒸気成分とガス成分を分離して測定できる。
