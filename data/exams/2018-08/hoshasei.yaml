  - ⁶⁰Coはβ崩壊により⁶⁰Niの励起状態に変わり、1.17MeVのγ線と1.33MeVのγ線を放出する。
  - α線などの高速の荷電粒子が物質を電離する際には、二次電子を発生させる。
