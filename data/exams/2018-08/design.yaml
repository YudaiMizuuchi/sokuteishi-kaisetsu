  stem: 騒音のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点は、原則として、単位作業場所の床面上に6m以下の等間隔で引いた縦の線と横の線との交点の床上120cm以上150cm以下の位置とする。
  - 単位作業場所における騒音レベルがほぼ均一であることが明らかなときは、測定点は、当該単位作業場所の床面上に6mを超える等間隔で引いた縦の線と横の線との交点とすることができる。
  - A測定における単位作業場所の設定に当たっては、おおむね80dB以上の区域に限定して差し支えない。
  - 騒音の測定は、騒音計の周波数補正回路のC特性で行う。
  - 一つの測定点における等価騒音レベルの測定時間は、10分間以上の継続した時間とする。
  answer: 4
  choice_notes: []
  explanation: '騒音の測定は、騒音計の周波数補正回路の **A 特性**で行います。C 特性とする選択肢4は誤りです。


    A 特性は、人の耳の感じ方（低い音ほど聞こえにくい）に合わせた補正です。平成30年度第2回 法令 問9でも、A 特性で行うという正しい記述が出題されています。'
  figures: []
  law_note: null
  _key_choice: 騒音の測定は、騒音計の周波数補正回路のC特性で行う。
