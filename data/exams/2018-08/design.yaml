  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の中で有害物質の濃度が最大になると考えられる箇所については、作業者が立ち入る可能性がなくても、その箇所でB測定を行わなければならない。
  - 相対濃度指示方法を用いてB測定を行う場合の質量濃度変換係数は、その単位作業場所で行われたA測定の質量濃度変換係数を用いる。
  - B測定は、局所的及び短時間の個人ばく露の評価のために行うものではない。
  - 圧電天秤方式の相対濃度計を用いて鉱物性粉じんのB測定を行うときは、測定時間を2分に合わせて、連続して5回行う。
  - 発生源とともに作業者が移動しながら行う作業の場合には、B測定は、作業位置の移動に沿って行う。
  answer: 1
  choice_notes: []
  explanation: 'B 測定は、発散源に近接する場所で作業が行われる単位作業場所で、濃度が最も高くなると考えられる**作業位置**で行う測定です。作業者が立ち入る可能性がない箇所で行う必要はないので、選択肢1は誤りです。


    B 測定は「作業者がばく露される最悪の状態」をとらえるためのもので、人が立ち入らない場所の濃度は対象外です。立ち入る可能性があれば、測定時に人がいなくても測ります（平成30年度第2回）。'
  figures: []
  law_note: null
  _key_choice: 単位作業場所の中で有害物質の濃度が最大になると考えられる箇所については、作業者が立ち入る可能性がなくても、その箇所でB測定を行わなければならない。
