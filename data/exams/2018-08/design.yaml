  stem: 単位作業場所に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所とは、当該作業場の区域のうち労働者の作業中の行動範囲、有害物の分布等の状況等に基づき定められる作業環境測定のために必要な区域をいう。
  - 測定点は、隣接する他の単位作業場所の測定点と重複してもよい。
  - クロム酸鉛を取り扱っている作業場において、同一の区域をクロム酸と鉛とで別々の単位作業場所として設定した。
  - 初めての測定で、有害物の濃度分布等が予測できなかったので、当該作業場で働く作業者の行動範囲を単位作業場所の範囲とした。
  - 同一の場所でトルエンによる抽出作業とキシレンによる抽出作業が別々に行われている場合、トルエンとキシレンの混合溶剤を使用する作業場とみなして一つの単位作業場所として設定した。
  answer: 5
  choice_notes: []
  explanation: '同じ場所でトルエンによる抽出作業とキシレンによる抽出作業が別々に行われている場合は、混合溶剤を使う作業場とみなして1つの単位作業場所とすることはできません。物質ごとに単位作業場所を設定するので、選択肢5は誤りです。


    令和2年度第1回・令和3年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
