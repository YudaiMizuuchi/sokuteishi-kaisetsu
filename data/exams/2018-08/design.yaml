  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定を行うことによって、管理区分を決めるための評価値を求めることができる。
  - 有害物質の発生源の間隔が等間隔で配列されている場合には、測定点の縦又は横の線の間隔が発生源の間隔と一致しないようにする。
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  - 測定点と測定点の間隔は、原則として、6m以下の等間隔とし、かつ、縦方向と横方向の間隔を同一にしなければならない。
  - 単位作業場所における有害物質の濃度がほぼ均一であることが明らかなときは、測定点は、当該単位作業場所の床面上に6mを超える等間隔で引いた縦の線と横の線との交点とすることができる。
  answer: 4
  choice_notes: []
  explanation: 'A 測定の測定点の間隔は、6 m 以下の等間隔であれば、縦方向と横方向で違っていても構いません。「縦方向と横方向の間隔を同一にしなければならない」とする選択肢4は誤りです。


    令和2年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 測定点と測定点の間隔は、原則として、6 m以下の等間隔とし、かつ、縦方向と横方向の間隔を同一にしなければならない。
