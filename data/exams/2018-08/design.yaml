  stem: 正規分布、対数正規分布及び作業環境中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 正規分布では、平均値と標準偏差は、互いに独立である。
  - 対数正規分布の母平均と母分散とは互いに独立ではない。
  - 環境空気中の有害物質の濃度の分布は、正規分布で近似される。
  - 横軸に変数の対数をとったとき、対数正規分布の曲線の形は、幾何平均値を中心として左右対称になる。
  - 一般に、環境中の有害物質の濃度の算術平均値が大きくなるに従って、濃度の標準偏差も大きくなる。
  answer: 3
  choice_notes: []
  explanation: '環境空気中の有害物質の濃度の分布は、**対数正規分布**で近似されます。正規分布とする選択肢3は誤りです。


    濃度の算術平均値が大きくなるほど標準偏差も大きくなる（選択肢5）ことが、対数正規分布で近似する理由の一つです。'
  figures: []
