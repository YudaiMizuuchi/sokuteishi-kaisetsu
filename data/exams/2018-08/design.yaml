  stem: 環境空気中の有害物質の捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 一般に、ろ過捕集法による粒子の捕集率は、粒径0.1～0.3μm程度の粒子で低くなる。
  - 多段平行板式分粒装置を用いて鉱物性粉じん濃度を測定する場合、吸引流速が所定の値より大きいと測定値は高くなる。
  - 小型ガス吸収管によるガス状物質の捕集では、流量が大きいほど捕集率は低くなる。
  - 慣性衝突式分粒装置を用いて、所定の吸引流量より大きい流量で吸引すると、分粒装置を通過する粒子の50%分粒粒径は大きくなる。
  - 面積式流量計では、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より大きくなる。
  answer: 4
  choice_notes: []
  explanation: '慣性衝突式分粒装置を所定より**大きい**流量で吸引すると、50 ％ 分粒粒径は**小さく**なります。「大きくなる」とする選択肢4は誤りです。


    平成30年度第2回にも、まったく同じ選択肢があります。'
  figures: []
