  stem: 有害物質及び騒音の測定の評価に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質のA測定の第1評価値は、測定値の幾何平均及び幾何標準偏差から求める。
  - 騒音のA測定の平均値は、測定値の幾何平均の値とする。
  - 有害物質のA測定の第2評価値は、有害物質の算術平均濃度の推定値である。
  - 騒音の管理区分を決定する際には、測定値の標準偏差は用いない。
  - 有害物質のA測定の第1評価値及びB測定値が、共に管理濃度未満であれば、その単位作業場所は、第1管理区分に区分される。
  answer: 2
  choice_notes: []
  explanation: 騒音の A 測定の平均値は、80 dB 以上の測定値の**算術平均**です。幾何平均の値とする選択肢2は誤りです。
  figures: []
