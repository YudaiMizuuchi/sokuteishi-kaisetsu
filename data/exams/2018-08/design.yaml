  stem: 空気中の有害物質の濃度及び管理濃度に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が高いほど、大きな値になる。
  - 石綿の管理濃度は、本/cm³で表されている。
  - 有機溶剤の管理濃度は、全てppmで表されている。
  - 空気中の有機溶剤の体積分率1%は、10,000ppmに相当する。
  - 光散乱方式による相対濃度計では、粉じんの相対濃度はcpmで表す。
  answer: 1
  choice_notes: []
  explanation: '鉱物性粉じんの管理濃度は、E ＝ 3.0 ÷ (1.19Q ＋ 1)（Q は遊離けい酸の含有率 ％）で求めます。遊離けい酸の含有率が**高い**ほど、管理濃度は**小さな**値になります。「大きな値になる」とする選択肢1は誤りです。


    石綿の管理濃度は本/cm³（選択肢2）、有機溶剤の管理濃度は全て ppm（選択肢3）、1 ％ は 10,000 ppm（選択肢4）、光散乱方式の相対濃度は cpm（選択肢5）で、いずれも正しい記述です。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が高いほど、大きな値になる。
