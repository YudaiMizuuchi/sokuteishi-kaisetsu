  stem: 光散乱方式の相対濃度計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸引流量が大きくなるほど相対濃度の値は増大する。
  - 質量濃度変換係数K値は、同一作業場であっても併行測定の時間帯によって変わることがある。
  - 質量濃度が同じであれば、粒径5μmの粉じん粒子の散乱光強度は、粒径0.3μmの粉じん粒子の散乱光強度より小さい。
