  stem: 簡易測定機器による測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 相対濃度指示方法によるA測定においては、1単位作業場所における採取開始から終了までの時間は、試料採取の間隔を調整することにより1時間以上となるようにする。
  - 光散乱方式の相対濃度計による測定において、粒子の組成と粒径分布が一定で、濃度に変動がなければ、相対濃度の値は、測定時間に比例する。
  - 圧電天秤方式の相対濃度計では、結晶素子上の粉じんの堆積物1μg当たりの周波数の変化量は、約180Hzである。
  - 光散乱方式の相対濃度計は、0.1μm以下の粒子に対する感度は低い。
  - 検知管の変色層の長さは、有害物質の濃度に必ずしも比例しない。
