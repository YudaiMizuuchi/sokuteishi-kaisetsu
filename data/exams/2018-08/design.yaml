  - 検知限度とは変色がわずかでも認められる最低濃度のことである。
  - 検知管のガス採取器のピストン及びシリンダー内部にグリースを塗布してはならない。
  - 採取時間1分の検知管を用いた特定化学物質のA測定では、1単位作業場所における全測定点の数は10以上とする。
  - アクリロニトリルは、妨害物質がない場合には、検知管で測定することができる。
  - B測定においては、検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値を測定値とする。
  answer: 2
