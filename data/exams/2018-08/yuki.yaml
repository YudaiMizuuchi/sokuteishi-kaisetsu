  stem: 環境空気中の有機溶剤の直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 真空捕集びんのコックには、グリースなどの使用を避ける。
  - 真空捕集びんは、清浄な乾燥空気又は窒素ガスを用いて洗浄する。
  - 捕集袋の内容積は、捕集後の濃度減衰を防ぐため、1L以下とする。
  - 採取した試料空気は、可能な限り、その日のうちに分析する。
  - 採取した試料空気を保存する場合は、温度変化が少ない場所に保存する。
