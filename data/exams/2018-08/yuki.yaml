  stem: 光路長10.0cmの気体用石英セルを真空にした後、ある有機溶剤を封入したところ、25℃において6.00×10⁻³気圧の気体となった。このとき、ある波長における吸光度が0.400であった。この気体のその波長におけるモル吸光係数の値に最も近いものは次のうちどれか。
  choices:
  - 1.02×10²cm⁻¹·mol⁻¹·L
  - 1.49×10²cm⁻¹·mol⁻¹·L
  - 1.63×10²cm⁻¹·mol⁻¹·L
  - 1.02×10³cm⁻¹·mol⁻¹·L
  - 1.63×10³cm⁻¹·mol⁻¹·L
  columns: null
  answer: 3
  choice_notes: []
  explanation: '気体の状態方程式から、気体のモル濃度を求め、吸光度からモル吸光係数を計算します。


    1. 気体のモル濃度：c ＝ P／（RT）＝ 6.00 × 10⁻³ atm ／（0.0821 × 298）≒ 2.45 × 10⁻⁴ mol/L

    2. モル吸光係数：ε ＝ A／（c・l）＝ 0.400／（2.45 × 10⁻⁴ × 10.0）≒ **1.63 × 10²** cm⁻¹・mol⁻¹・L


    よって（3）です。'
