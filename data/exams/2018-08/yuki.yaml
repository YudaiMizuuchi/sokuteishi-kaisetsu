    捕集袋に試料空気を採取するときは、電動ポンプで一定流量で採取します。捕集装置の圧力損失が著しく大きいときは、差圧計の値による流量補正が必要になることがあります。活性炭管や小型バブラーに試料を捕集するときの電動ポンプの流量は、石けん膜流量計で校正します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
