  stem: ガスクロマトグラフ分析に用いる検量線に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 検量線範囲を超えた高濃度の試料液については、検量線を外挿して定量値を求める。
  - 標準液は、対象の標準物質を脱着溶媒で正確な濃度に希釈したものを用いる。
  - 検量線は、測定の都度、作成する。
  - 内標準法で用いられる内標準物質には、目的物質と物理的・化学的によく似ているが、実際の試料中に含まれず、かつ、測定を妨害しない物質を選択する。
  - 内標準法では、ガスクロマトグラフに導入した体積を正確に測定する必要はない。
