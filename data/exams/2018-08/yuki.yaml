  stem: ガスクロマトグラフに利用されている検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電子捕獲検出器は、ハロゲンを含む化合物の分析に適している。
  - 質量分析器は、酸素を含む化合物の分析には適していない。
  - 水素炎イオン化検出器は、水素炎中で燃焼しイオン化する化合物を検出する。
  - 炎光光度検出器は、リンや硫黄を含む化合物の分析に適している。
  - アルカリ熱イオン化検出器は、窒素やリンを含む化合物の分析に適している。
  columns: null
  answer: 2
