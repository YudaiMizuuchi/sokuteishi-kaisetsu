  - 検知管の指示値(ppm)は、高気圧下では高くなる。
  - 検知管には、前段に酸化剤、後段に検知剤が充填されているものがある。
  - 検知剤と気体の反応速度は、一般に、温度が低下するほど大きくなる。
  - 検知管は、作業場所の室温にしてから使用する。
