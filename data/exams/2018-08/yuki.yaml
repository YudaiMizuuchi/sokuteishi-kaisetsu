  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 捕集袋に試料空気を採取する際は、電動ポンプにより一定流量で採取する。
  - 校正した流量計を用いても、捕集装置の圧力損失が著しく大きいと、差圧計の値を用いた流量補正が必要な場合がある。
  - 活性炭管に試料を捕集する際は、活性炭管を接続した状態で電動ポンプの流量を、石けん膜流量計で校正する。
  - 小型バブラーに試料空気を捕集する際は、吸引する電動ポンプの流量を石けん膜流量計で校正する。
  - 真空捕集びんは、捕集びん内の圧力を13.3kPa以下にしたものを使用する。
