  stem: 捕集率が同じ2本のミゼットインピンジャーを直列に連結して、ある有機溶剤蒸気の捕集を行ったところ、1本目の吸収管には1.00mgの有機溶剤が、2本目には0.0750mgの有機溶剤が捕集された。このミゼットインピンジャー1本の捕集率(%)として、正しい値は次のうちどれか。
  choices:
