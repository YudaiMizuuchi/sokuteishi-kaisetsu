  - 97.5%
  - 99.0%
  columns: null
  answer: 2
  choice_notes: []
  explanation: '直列に連結した2本のミゼットインピンジャーの捕集率が同じ（η）のとき、1本目で捕集されなかった（1−η）の割合が、2本目で捕集されます。


    2本目／1本目 ＝ 1 − η ＝ 0.0750／1.00 ＝ 0.075


    η ＝ 1 − 0.075 ＝ 0.925 ＝ **92.5％**


    よって（2）です。'
