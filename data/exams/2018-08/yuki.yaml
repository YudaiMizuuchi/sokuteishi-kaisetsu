  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 溶液の濃度1mol·L⁻¹、かつ、液層の長さ1cmのときの吸光度の値をモル吸光係数という。
  - Tを透過率(%)、Aを吸光度とすると、log₁₀T＝2－Aが成り立つ。
  - 通常、青色溶液の可視部の主な吸収波長域は、赤色溶液のそれより短波長側にある。
  - 吸光度は、対象物質の試料液中の濃度と液層の長さの積に比例する。
  - 液層の長さが同一の場合、透過率(%)の値が大きいほど、対象物質の試料液中の濃度は低い。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '補色の関係から、**青色の溶液**は、赤〜橙色の光（長波長側）を吸収し、**赤色の溶液**は、緑色の光（中間の波長）を吸収します。したがって、青色溶液の主な吸収波長域は、赤色溶液のそれより**長波長側**にあります。「短波長側にある」とする選択肢3は誤りです。同じ問題は、令和4年度第1回にも出題されています（出題実績）。


    モル吸光係数は、濃度1 mol/L、液層1 cmのときの吸光度です。透過率T（％）と吸光度Aの関係は、log₁₀T ＝ 2 − A です。吸光度は、濃度と液層の長さの積に比例し、透過率が大きいほど、濃度は低いです。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
