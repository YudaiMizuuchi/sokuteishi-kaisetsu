  stem: 活性炭管を用いて、常温・常圧（25℃、1気圧）の環境空気中のアセトンを吸引流量0.2L·min⁻¹で10分間捕集し、脱着液1.0mLで脱着した。この脱着液1μLをガスクロマトグラフで分析したところ、脱着液1μL中にアセトン0.1μgが得られた。環境空気中のアセトン濃度として、正しい値に最も近いものは次のうちどれか。ただし、回収率は100%とし、アセトンのモル質量は58g·mol⁻¹とする。
  choices:
  - 10ppm
  - 20ppm
  - 30ppm
  - 40ppm
  - 50ppm
  columns: null
  answer: 2
  choice_notes: []
  explanation: '次の順で計算します。


    1. 脱着液1.0 mL中のアセトンの量：0.1 µg/µL × 1000 µL ＝ 100 µg

    2. 吸引した空気の量：0.2 L/min × 10 min ＝ 2 L

    3. 濃度：100 µg ÷ 2 L ＝ 50 µg/L ＝ 50 mg/m³

    4. ppmに換算（25℃、1気圧）：50 × 24.45／58.1 ≒ 21 ppm


    最も近いのは（2）の20 ppmです。同じ問題は、令和5年度第1回にも出題されています（出題実績）。'
