  choices:
  - ディスプレイは、おおむね40cm以上の視距離が確保できるようにし、画面の上端が、眼と同じ高さか、やや下になるようにしている。
  - ディスプレイ画面上における照度は、500ルクス以上としている。
  - 書類上及びキーボード上における照度は、300ルクス以上になるようにしている。
  - 単純入力型及び拘束型に該当するVDT作業では、一連続作業時間を50分間とし、次の連続作業までの間に15分間の作業休止時間を設けている。
