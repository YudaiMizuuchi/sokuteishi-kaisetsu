  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対する発がん性が疑われている。
  - カドミウムは、主として腎臓皮質に蓄積し、腎機能障害を起こす。
  - フッ化水素による慢性中毒では、骨の硬化や斑状歯がみられる。
  - 高濃度の硫化水素による中毒では、脳神経細胞の障害による意識消失や呼吸麻痺がみられる。
  - メタノールによる健康障害として顕著なものは、網膜細動脈瘤を伴う脳血管障害である。
  answer: 5
  choice_notes: []
  explanation: 網膜細動脈瘤を伴う脳血管障害は、**二硫化炭素**の慢性中毒の特徴です。メタノールで顕著なのは視神経の障害なので、選択肢5は誤りです。
