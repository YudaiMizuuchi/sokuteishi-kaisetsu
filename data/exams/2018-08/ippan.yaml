  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - テトラクロロエチレンは、体内で代謝されて、トリクロロ酢酸などの三塩化物として排泄される。
  - n-ヘキサンは、体内で代謝されて、2,5-ヘキサンジオンとなる。
  - トルエンの生物学的モニタリングの指標である尿中馬尿酸量は、飲食物中の安息香酸の影響を受けると低くなる。
  - スチレンは、代謝されて、尿中にマンデル酸やフェニルグリオキシル酸が排泄される。
  - 尿中の総三塩化物の量は、1,1,1-トリクロロエタンの生物学的モニタリングの指標として利用される。
  answer: 3
  choice_notes: []
  explanation: '安息香酸は体内で馬尿酸に変わるので、飲食物中の安息香酸を摂ると、尿中の馬尿酸量は**高く**なります。「低くなる」とする選択肢3は誤りです。


