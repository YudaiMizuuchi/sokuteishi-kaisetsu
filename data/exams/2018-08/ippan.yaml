  stem: 金属などによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉛中毒では、貧血、末梢神経障害、腹部の疝痛などがみられる。
  - 金属熱は、金属を溶融する高温作業などに従事する際に、体温調節機能が障害を受けることにより発生する。
  - コバルト及びその無機化合物は、アレルギー性皮膚炎、気管支ぜんそくなどを引き起こすほか、ヒトに対する発がん性が疑われている。
  - 塩化ビニルでは、指の骨の溶解(指端骨溶解)や肝血管肉腫などがみられる。
  - 金属水銀中毒では、感情不安定、幻覚などの精神障害や手指の震えなどがみられる。
  answer: 2
  choice_notes: []
  explanation: '金属熱は、亜鉛や銅などの金属の**ヒュームを吸入**して起こる疾病で、高温作業で体温調節機能が障害されて起こるもの（熱中症）ではありません。選択肢2は誤りです。


