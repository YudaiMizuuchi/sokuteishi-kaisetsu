  stem: 環境空気中の有機溶剤の直接捕集法とその試料の取扱いに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集びんに試料を採取する際の空気吸引流量は一定ではない。
  - 新しい捕集袋を使用する場合、内面からの分析妨害物質の発生を考慮する。
  - 捕集袋の内容積は、5 L 以上とする。
  - 個人サンプリング法に用いるキャニスターは、一般に容量 400 ～ 600 mLのものが使用される。
  - オリフィス式抵抗を利用したキャニスターは、空気吸引流量は一定に保たれる。
  answer: 5
  choice_notes: []
  explanation: 'オリフィス式抵抗を用いるキャニスターは、オリフィスの抵抗を利用するという原理上、**キャニスターの減圧度が下がるにつれて、吸引流量が徐々に落ちる**ことがあります。吸引流量が一定に保たれるのは、機械式マスフローコントローラを使うタイプです。選択肢5は誤りです。


    捕集袋の内容積は5 L以上（選択肢3）、個人サンプリング法のキャニスターは400〜600 mL程度（選択肢4）です。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
