  stem: 次の有機溶剤のうち、25 ℃における飽和蒸気圧が最も小さいものはどれか。
  columns: null
  choices:
  - エチレングリコールモノメチルエーテル
  - 1,1,1-トリクロロエタン
  - 二硫化炭素
  - n-ヘキサン
  - メチルエチルケトン
  answer: 1
  choice_notes: []
  explanation: '飽和蒸気圧は、沸点が高い物質ほど小さくなります。沸点は、エチレングリコールモノメチルエーテルが約124℃、メチルエチルケトンが約80℃、1,1,1-トリクロロエタンが約74℃、n-ヘキサンが約69℃、二硫化炭素が約46℃です。よって、最も蒸気圧が小さいのは（1）です。


    （沸点は、一般的な化学便覧の概数です。）'
