  stem: 有機溶剤の受動型試料採取機器（パッシブサンプラー）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - サンプリング原理は、拡散現象を利用している。
  - サンプリング速度は、拡散係数（cm²・min⁻¹）に比例する。
  - サンプリング速度は、温度や気流の影響を受けない。
  - サンプリング速度は、サンプラーの構造により異なる。
  - サンプリング開始時刻は、捕集面開口部を開放した時刻とする。
  answer: 3
  choice_notes: []
  explanation: '受動型試料採取機器（パッシブサンプラー）は、拡散現象を利用して捕集します。捕集面が開放されているので、気流が当たると拡散部の濃度勾配が崩れ、サンプリング速度が安定しなくなります。温度が変わると拡散係数も変わるので、サンプリング速度は温度の影響も受けます。「温度や気流の影響を受けない」とする選択肢3は誤りです。


    サンプリング速度は拡散係数に比例し、サンプラーの構造ごとに異なります。サンプリングは、捕集面の開口部を開放した時刻から始まります。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
