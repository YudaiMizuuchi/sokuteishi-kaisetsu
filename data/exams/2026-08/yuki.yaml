  explanation: '水素炎イオン化検出器（FID）は、検量線の直線範囲が広い検出器ですが、標準試料の濃度範囲を超える高濃度のときに、検量線を**延長して定量してはいけません**。試料を希釈して、検量線の範囲内で測定し直します。選択肢4は誤りです。


