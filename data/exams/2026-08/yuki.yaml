  stem: 検知管法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 主成分の検知管のみを用いた混合有機溶剤の測定が許可されている場合の濃度の換算値は、検知管の指示値に換算値変換係数を乗じて求める。
  - 主成分の検知管のみを用いた混合有機溶剤の測定が許可されている場合、主成分の管理濃度の1/10が精度よく測定できるものを選定する。
  - クロム（Ⅵ）の還元反応を用いた酢酸エチルの検知管は、アセトンが共存すると妨害となる。
  - 試料空気の吸引に電動吸引ポンプを用いる検知管の使用は認められていない。
  - 検知管法は有機溶剤による脱着操作が不要である。
  answer: 4
  choice_notes: []
  explanation: '検知管法で、試料空気の吸引に**電動式の吸引ポンプを用いる検知管**（連続吸引式検知管など）も使えます。「認められていない」とする選択肢4は誤りです。


    混合有機溶剤を主成分の検知管だけで測るときは、検知管の指示値に換算値変換係数を掛けて換算値を求めます（選択肢1）。検知管法は、活性炭管のように有機溶剤で脱着する操作が不要です（選択肢5）。'
