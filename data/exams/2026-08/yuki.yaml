  stem: 固体捕集法に用いられる捕集剤に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - シリカゲルは、極性物質の捕集に適している。
  - 活性炭は、無極性物質に対する吸着力が強い。
  - 活性炭は、湿度の影響を受けにくい。
  - ポーラスポリマービーズは、活性炭に比べて捕集容量が小さい。
  - ポーラスポリマービーズでは、活性炭に比べて、不安定な化合物の変質が起こりやすい。
