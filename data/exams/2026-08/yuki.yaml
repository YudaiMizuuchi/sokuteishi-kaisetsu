  explanation: '次の順で計算します。


    1. 脱着液中の量：1750.0 µg/mL × 2 mL ＝ 3500 µg

    2. 脱着率90％で補正した捕集量：3500 ÷ 0.90 ≒ 3889 µg

    3. 吸引した空気の体積：0.1 L/min × 360 min ＝ 36 L

    4. 濃度：3889 µg ÷ 36 L ≒ 108 µg/L ＝ 108 mg/m³

    5. ppmに換算（25℃、1気圧のモル体積24.45 L/mol）：108 ×（24.45／88.1）≒ 30 ppm


