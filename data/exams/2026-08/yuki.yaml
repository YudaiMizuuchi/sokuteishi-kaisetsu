  stem: ガスクロマトグラフ分析法に用いる検量線に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 内標準法で用いられる内標準物質には、目的物質と物理的・化学的によく似ており、実際の試料中に含まれず、かつ、測定を妨害しない物質を選択する。
  - 内標準法では、ガスクロマトグラフに導入した試料の体積を厳密に測定する必要がない。
  - 標準溶液は、対象の標準物質を脱着溶媒で適切な濃度範囲内に希釈したものを用いる。
  - 水素炎イオン化検出器（FID）は検量線の直線範囲が広いため、標準試料の濃度範囲を超える高濃度の際は、検量線を延長して定量を行う。
  - 比較的高濃度の溶液を標準原液として冷暗所に保管し、検量線作成の都度、適切に希釈して標準系列液を調製する。
  answer: 4
