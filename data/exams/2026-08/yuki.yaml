    電子捕獲検出器（ECD）には窒素を使えます。内径3 mmの充填カラムでは、キャリアガス流量は20〜30 mL/min程度が最適です。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
