  answer: 5
  choice_notes: []
  explanation: '発色反応を促進するために加熱した試料は、**室温まで冷やしてから**測定します。加熱直後は、温度の影響で吸光度が変わるうえ、発色の状態も安定していないことがあります。「発色後、直ちに測定する」とする選択肢5は誤りです。


    石英セルは、紫外部から可視部までの全波長領域で使えます。可視部の光源はタングステンランプです。感度は、モル吸光係数が大きいほど高く、モル吸光係数は波長に依存します。


    この選択肢と同様の記述は、平成27年度第1回、平成30年度第1回の問題でも出題され、誤りとして扱われています。この問題の正誤は、出題実績にもとづいて判断しています。'
