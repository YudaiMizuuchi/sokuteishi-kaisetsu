  columns: null
  choices:
  - ろ過捕集された金属カドミウムは、希硝酸に溶ける。
  - カドミウムの APDC 錯体は、pH 4以上で不安定となる。
  - 中空陰極ランプは、感度を良くするために高電流で使用する。
  - 塩化ナトリウムが共存すると、分光学的干渉が起こりやすい。
  - 吸光度が検量線の直線領域を超えている場合には、MIBK で希釈して測定する。
  answer: 3
  choice_notes: []
  explanation: '中空陰極ランプには、指定された**至適電流値**があります。至適電流値より大きな電流を流すと、中空陰極内やその前面に未発光の金属原子が増え、自己吸収を起こして共鳴線の形が悪くなり、**吸収感度が悪くなります**。ランプの寿命も、電流値が大きいほど短くなります。「感度を良くするために高電流で使用する」とする選択肢3は誤りです。


    溶媒抽出（キレート剤で金属を有機溶媒に抽出する方法）は、金属が濃縮されて感度が良くなる、キレートをつくらないアルカリ金属などの妨害イオンを除ける、という特徴があります。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
