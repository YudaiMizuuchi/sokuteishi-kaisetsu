  stem: 次の金属化合物又はイオンⒶとその金属元素の酸化数Ⓑとの組合せのうち、酸化数が誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - V₂O₅ ／ +5
  - Cr₂O₇²⁻ ／ +6
  - MnO₄⁻ ／ +7
  - \[Ni( NH₃)₆\]²＋ ／ +2
  - Hg₂Cl₂ ／ +2
  answer: 5
  choice_notes: []
  explanation: 'それぞれの金属元素の酸化数を、全体の電荷から求めます（酸素は−2、塩素は−1、アンモニアは0）。


    - V₂O₅：2x ＋ 5×(−2) ＝ 0 → x ＝ **+5**

    - Cr₂O₇²⁻：2x ＋ 7×(−2) ＝ −2 → x ＝ **+6**

    - MnO₄⁻：x ＋ 4×(−2) ＝ −1 → x ＝ **+7**

    - [Ni(NH₃)₆]²⁺：x ＋ 6×0 ＝ +2 → x ＝ **+2**

    - Hg₂Cl₂（塩化水銀(Ⅰ)）：2x ＋ 2×(−1) ＝ 0 → x ＝ **+1**


    Hg₂Cl₂の水銀の酸化数は +1 で、「+2」は誤りです。よって（5）です。'
