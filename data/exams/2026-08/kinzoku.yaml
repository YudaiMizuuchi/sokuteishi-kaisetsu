  stem: 金属元素の性質に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 金属元素の原子半径は、周期表の横の列（周期）にそって左から右へとしだいに増大するわけではない。
  - アルカリ金属元素のイオン化エネルギーは、原子番号が大きくなるにつれて減少する傾向がある。
  - すべての金属元素において、その電気陰性度の値はフッ素の電気陰性度の値よりも小さい。
  - 遷移元素には、金属元素ではないものがある。
  - ナトリウムよりもマグネシウムの方がその原子半径は小さい。
  answer: 4
  choice_notes: []
  explanation: '遷移元素は、すべて金属元素です。「金属元素ではないものがある」とする選択肢4は誤りです。


    - アルカリ金属のイオン化エネルギーは、原子番号が大きくなるほど減少します（選択肢2）。

    - 原子半径は、周期表の同じ周期では、左から右へ向かってしだいに減少する傾向があり、必ずしも単調ではありません（選択肢1）。

    - ナトリウムよりマグネシウムのほうが、原子核の正電荷が大きく、原子半径は小さいです（選択肢5）。

    - フッ素は、全元素のうちで電気陰性度が最大なので、すべての金属元素はフッ素より小さくなります（選択肢3）。'
