  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 電気加熱原子化法の再現性は、一般にフレーム法より劣る。
  - 電気加熱原子化法は、少量の溶液試料（10 ～ 50 µL 程度）を電気加熱して原子化する方法である。
  - 原子吸光分析法は、誘導結合プラズマ発光分析法よりも全ての金属元素で定量下限濃度が高い。
  - 還元気化法は、フレーム法では原子化が困難であり、電気加熱原子化法では揮散しやすいような As、Sb、Sn、Te や Se などの化合物に用いられる。
  - 原子吸光での吸光度は、フレーム中を通過する光路の長さに比例する。
  answer: 3
  choice_notes: []
  explanation: 'ICP発光分析法は、多くの元素で、フレーム原子吸光法と同程度かそれ以上の感度をもちますが、**すべての金属元素で原子吸光分析法より定量下限濃度が低い**わけではありません。元素によっては、原子吸光分析法（特に電気加熱原子化法）のほうが感度が高い場合があります。選択肢3は誤りです。


    原子吸光の吸光度は、光路長に比例します（ランベルトの法則）。電気加熱原子化法は、少量の溶液（10〜50 µL程度）を電気で加熱して原子化し、感度は高いものの、再現性はフレーム法より劣ります。還元気化法（水素化物発生法）は、As、Sb、Sn、Te、Seなどに用います。


    （参考：『機器分析の実務』）'
