  stem: 作業環境空気中の金属の分析法Ⓐとその分析原理の基礎となる現象Ⓑとの次の組合せのうち、誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 吸光光度分析法 ／ 基底状態の分子、イオンの光吸収
  - 蛍光光度分析法 ／ 基底状態の分子、イオンの発光
  - 原子吸光分析法 ／ 基底状態の原子の光吸収
  - 誘導結合プラズマ発光分析法（ICP-AES） ／ 励起状態の原子、イオンの発光
  - 誘導結合プラズマ質量分析法（ICP-MS） ／ 原子のイオン化
  answer: 2
  choice_notes: []
  explanation: '蛍光光度分析法は、物質が光を吸収して**励起状態**になり、そこから再び光を放出する（蛍光）現象を利用します。基底状態の分子やイオンが発光するわけではないので、選択肢2は誤りです。


    吸光光度分析法は基底状態の分子・イオンの光吸収、原子吸光分析法は基底状態の原子の光吸収、ICP-AESは励起状態の原子・イオンの発光、ICP-MSは原子のイオン化を利用します。


    （参考：『機器分析の実務』）'
