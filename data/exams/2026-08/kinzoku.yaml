  columns: null
  choices:
  - 試料液をアルカリ性にした後、モリンを加えて、最終試料液とする。
  - 蛍光の波長は、励起光の波長より長い。
  - 入射光に対して直角方向の蛍光を測定する。
  - 試料溶液の pH や温度は、蛍光強度に影響を及ぼす。
  - 吸光光度分析法に比べ、定量下限濃度が高い。
  answer: 5
  choice_notes: []
  explanation: 'ベリリウムの蛍光光度分析法は、次のとおりです。


    - グラスファイバーフィルターに捕集し、硫酸で処理した試料液を**アルカリ性**にして、**モリン**を加えます（選択肢1）。

    - 紫外線を当てて、発生する蛍光の強度を測定して定量します。蛍光の波長は、励起光の波長より長くなります（選択肢2）。蛍光は、入射光に対して直角方向で測ります（選択肢3）。

    - 試料溶液のpHや温度は、蛍光強度に影響します（選択肢4）。


    蛍光光度分析法は、一般に吸光光度分析法より**高感度**で、定量下限濃度は低くなります。「高い」とする選択肢5は誤りです。


