  stem: 誘導結合プラズマ発光分析法（ICP-AES）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - アルゴンプラズマの温度は、フレーム原子吸光法の空気-アセチレン炎の温度よりも低温である。
  - 試料溶液の粘性は、測定値に影響を与える。
  - アルカリ金属等、イオン化しやすい元素が試料溶液のマトリックス元素として存在する場合は、イオン化干渉が起こる。
  - 発光の観測方向に軸方向と横方向があり、一般にダイナミックレンジが広いのは横方向観測である。
  - シーケンシャル型の分光測定部を用いた装置は、測定元素数により試料溶液の必要量が変化する。
  answer: 1
  choice_notes: []
  explanation: 'ICP-AESのアルゴンプラズマの温度は、**6000〜10000 K程度**で、フレーム原子吸光法の空気-アセチレン炎（約2300℃）より高温です。「低温」とする選択肢1は誤りです。


    観測方向は、軸方向観測のほうが高感度ですが、高濃度側では検量線が曲がりやすく、ダイナミックレンジが広いのは横方向観測です。イオン化しやすい元素が共存すると、イオン化干渉が起こります。シーケンシャル型の分光測定部は、波長を順にスキャンするので、測定元素数が増えると測定時間も試料の消費量も増えます。


    （参考：『機器分析の実務』）'
