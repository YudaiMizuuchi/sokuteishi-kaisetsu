    - ジチゾン：カドミウムなどの金属の発色（抽出）試薬（選択肢2）

    - N-ベンゾイル-N-フェニルヒドロキシルアミン：バナジウム（選択肢4）。クロロホルム溶液で抽出して、橙黄色になります。

    - モリブデン酸アンモニウム：ヒ素（選択肢5）。生成するヒ-モリブデン酸を抽出し、塩化スズ(Ⅱ)で還元して青色にします。

    - **ホルムアルドキシム**：**マンガン**の発色試薬です。ニッケルの発色試薬ではないので、選択肢3は誤りです。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
