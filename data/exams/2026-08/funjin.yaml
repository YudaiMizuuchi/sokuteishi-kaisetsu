  stem: 石綿粉じんの捕集及び分析に用いるセルローズエステルメンブランフィルターに関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - フィルターのごく表面に粒子が捕集されるので、顕微鏡で計数するのに都合が良い。
  - フィルターの孔径は、水の表面張力を利用したバブルポイントテスト法によって求められた値である。
  - フィルターの屈折率はおよそ 1.5であり、同程度の屈折率の不揮発性の液に浸すと透明になり、粒子が計数しやすくなる。
  - フィルターの透明化には、トリアセチン蒸気が用いられる。
  - 格子（グリッド）の入ったフィルターを用いると検鏡の際、採じん面を容易に特定できるという利点があるが、細い繊維が格子の線に重なると見えにくいという欠点もある。
  answer: 4
  choice_notes: []
  explanation: 'メンブランフィルターは、アセトン・トリアセチン法で透明にします。**アセトンの蒸気**でフィルターを透明にしたあと、トリアセチンを滴下して屈折率を合わせます。「トリアセチン蒸気を用いる」とする選択肢4は誤りです。


    フィルターの屈折率はおよそ1.5で、同程度の屈折率の不揮発性の液に浸すと透明になり、粒子を数えやすくなります。粒子はフィルターのごく表面に捕集されるので、顕微鏡での計数に都合がよいです。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
