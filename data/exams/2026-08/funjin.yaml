  stem: 位相差顕微鏡に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 位相差顕微鏡は、無色透明な検体を染色しなくても、試料によって生じる光の位相差を回折光と光の干渉現象を利用して明暗の差に変換して、観察する光学顕微鏡である。
  - 対物レンズ内には位相板が、コンデンサー部分には環状（リング）絞りが組み込まれており、直接光と回折光の干渉を生じさせている。
  - 直接光と回折光の位相差が1 / 2波長（逆位相）又は 0 （同位相）になるようにして干渉させる。
  - 試料を通過した光は、直接光と回折光に分かれ、直接光は回折光に比べて 1/4 波長の遅れた位相を生じる。
  - 位相差顕微鏡による観察でのコントラストには、像が背景よりも暗く見えるダークコントラストと像が背景よりも明るく見えるブライトコントラストの2種類がある。
  answer: 4
  choice_notes: []
  explanation: '位相差顕微鏡では、試料を通った光が、**直接光**と**回折光**に分かれます。このとき、**回折光が直接光に比べて約1/4波長遅れます**。「直接光は回折光に比べて1/4波長遅れた位相を生じる」とする選択肢4は、遅れる側が逆なので誤りです。


    位相板で、直接光と回折光の位相差を1/2波長（逆位相）か0（同位相）にそろえて干渉させ、位相の違いを明暗の差に変えます。像が背景より暗いダークコントラストと、明るいブライトコントラストがあります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
