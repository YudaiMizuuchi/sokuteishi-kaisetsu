  stem: '密度 2.65 g・cm⁻³、粒径 10.0 µmの球形粒子について、18.0 ℃ の水中において 10 cm の距離を沈降する時間として、正しい値に最も近いものは次のうちどれか。ただし、粒子の沈降時間はストークスの式に従い、水の密度と粘性係数は、15 ℃ と 20 ℃ ではそれぞれ以下のとおりとする。また、重力加速度は 980 cm・s⁻²とする。


    | 温度 | 水の密度（g･cm⁻³） | 水の粘性係数（g･cm⁻¹･s⁻¹） |

    |---|---|---|

    | 15 ℃ | 0.99913 | 0.01138 |

    | 20 ℃ | 0.99823 | 0.01006 |'
  columns: null
  choices:
  - 18 分 40 秒
  - 19 分 10 秒
  - 19 分 40 秒
  - 20 分 10 秒
  - 20 分 40 秒
  answer: 3
  choice_notes: []
  explanation: 'ストークスの式 v ＝ g・d²・（ρ − ρ₀）／（18η）で、18.0℃の水の値を、15℃と20℃の値から直線で補間して求めます。


    - 密度：0.99913 − 0.6 ×（0.99913 − 0.99823）＝ 0.99859 g/cm³

    - 粘性係数：0.01138 − 0.6 ×（0.01138 − 0.01006）＝ 0.010588 g/(cm・s)


    粒径 d ＝ 10.0 µm ＝ 1.0 × 10⁻³ cm、ρ − ρ₀ ＝ 2.65 − 0.99859 ＝ 1.6514 g/cm³ なので、


    v ＝ 980 × （1.0 × 10⁻³）² × 1.6514 ／（18 × 0.010588）≒ 8.49 × 10⁻³ cm/s


    10 cm 沈降する時間 ＝ 10 ÷ 8.49 × 10⁻³ ≒ 1178 s ≒ **19分38秒**


    最も近いのは（3）の19分40秒です。'
