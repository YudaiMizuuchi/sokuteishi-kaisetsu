  stem: '鉱物性粉じんの質量濃度を測定するために、読取り限度が0.001 mgの天秤を使用して、1枚のろ紙について3回繰り返し秤量を行った結果、得られたデータは次の表のとおりであった。


    |  |  |

    |---|---|

    | 1回目 | 44.301 mg |

    | 2回目 | 44.306 mg |

    | 3回目 | 44.302 mg |


    このろ紙の秤量値の標本標準偏差として、正しい値に最も近いものは下のうちどれか。'
  columns: null
  choices:
