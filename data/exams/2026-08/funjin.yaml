  explanation: '遠心力場の加速度は、回転半径を r、角速度を ω とすると、rω² で表されます。回転半径が同じなら、加速度は角速度の**2乗**に比例します。「角速度に比例する」とする選択肢1は誤りです。


    空気力学相当径は、密度1 g/cm³の球で、終末沈降速度が同じになる粒子の径です。密度4 g/cm³、直径1 µmの粒子では、1 × √4 ＝ 2 µm になります（選択肢5）。ブラウン運動による拡散係数は、粒径が小さいほど大きくなります（選択肢4）。'
