  stem: 空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 繊維層フィルターの繊維間の距離は繊維径に比べ長いが、フィルター中に空気とともに送られてきた粒子は、1本1本の繊維に衝突して捕集される。
  - 粒径が 0.1 µmより小さな微細粒子の捕集に有効な拡散効果とは、ブラウン運動のため流線から外れた粒子が、ろ過材の繊維に衝突捕捉される現象である。
  - メンブランフィルターは、繊維層フィルターに比べて圧力損失は小さいという特徴がある。
  - 平均孔径が 0.8 µmのメンブランフィルターは、粒径が 0.3 µmの粒子を99.5 ％ 以上捕集できる。
  - メンブランフィルターは、帯電しやすいので質量濃度を求めるためのろ過材としては不向きである。
  answer: 3
  choice_notes: []
  explanation: 'メンブランフィルターは、グラスファイバーフィルターなどの繊維層フィルターと比べて、**圧力損失が非常に大きい**フィルターです。「圧力損失は小さい」とする選択肢3は誤りです。メンブランフィルターを使うときは、規定の流量で吸引を続けるのに十分な流量と静圧をもつ吸引ポンプが必要です。


    拡散効果は、0.1 µmより小さい微細粒子が、ブラウン運動で流線から外れて、繊維に衝突して捕捉される現象です。メンブランフィルターは、帯電しやすいので、質量濃度を求めるためのろ過材には不向きです。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
