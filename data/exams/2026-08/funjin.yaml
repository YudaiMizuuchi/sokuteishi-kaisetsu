  - 0.0020 mg
  - 0.0023 mg
  - 0.0026 mg
  - 0.0029 mg
  answer: 4
  choice_notes: []
  explanation: '3回の値の平均は（44.301 ＋ 44.306 ＋ 44.302）／3 ＝ 44.303 mg です。


    平均からの差の2乗の和は、（−0.002）² ＋ 0.003² ＋（−0.001）² ＝ 4 ＋ 9 ＋ 1 ＝ 14 × 10⁻⁶ mg² です。


    標本標準偏差は、自由度 n − 1 ＝ 2 で割って、


    s ＝ √（14 × 10⁻⁶ ／ 2）＝ √（7 × 10⁻⁶）≒ 0.00265 mg


    最も近いのは（4）の0.0026 mgです。'
