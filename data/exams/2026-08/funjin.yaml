  - 金属基底標準板には、石英の測定回折線より高角度側のそれに近い回折線を持つ材料を選ぶ。
  - 粉じん試料を採取する前のフィルターを載せた金属基底標準板の回折強度と、粉じん採取後のフィルターを載せた金属基底標準板及び石英の回折線強度を計測する。
