  explanation: 'X線回折の定性分析で、**炭酸カルシウム（CaCO₃）**の存在が確認された試料では、亜鉛板を基底標準板に使うと、亜鉛の回折線が炭酸カルシウムの第2強線の回折線と重なって、吸収補正に影響します。そのため、亜鉛板は使わず、**アルミニウム板**などを基底標準板として使います。「アルミニウム板を用いてはならない」とする選択肢3は誤りです。


