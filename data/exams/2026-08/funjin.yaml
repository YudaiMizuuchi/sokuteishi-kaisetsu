  - 遠心力場の加速度は、回転半径が同じであれば、角速度に比例する。
  - 帯電している粒子は、それぞれ反対の極性に向かって移動し、帯電量が同じであれば、電界強度が大きいほどその移動速度は大きい。
  - 拡散効果の影響は、0.1 µmより小さな粒子に対して粒径が小さくなるほど顕著であるが、1 µmより大きな粒子ではほとんど無視できる。
  - ブラウン運動をしている粒子の拡散係数は、粒径が小さいほど大きくなる。
  - 密度 4 g･cm⁻³、直径 1 µmの球形粒子の空気力学相当径は 2 µmである。
  answer: 1
