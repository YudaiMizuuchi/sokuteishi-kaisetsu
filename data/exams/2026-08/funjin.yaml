  stem: X線回折基底標準吸収補正法により、粉じん中の石英の定量を行ったところ、次のような測定結果が得られた。有効直径 20 mm のフィルターに、再発じん法により 1.26 mg の粉じんを捕集した。このフィルターの石英の主回折線強度は 280 cps であった。粉じん中の石英含有率（％）として、正しい値は下のうちどれか。ただし、X線吸収補正係数は 1.25、石英の回折線強度は石英が 1 mg・cm⁻²のとき 7000 cps とする。
  columns: null
  choices:
  - 3.2 ％
  - 4.0 ％
  - 7.6 ％
  - 10.0 ％
  - 12.5 ％
  answer: 5
  choice_notes: []
  explanation: 'フィルターの有効面積は、有効直径20 mm（半径1 cm）なので、π × 1² ＝ 3.14 cm² です。


    吸収補正をした石英の回折線強度は、280 cps × 1.25 ＝ 350 cps です。石英が1 mg/cm²のとき7000 cpsなので、フィルター上の石英の面密度は、350／7000 ＝ 0.050 mg/cm² です。


    石英の量は、0.050 mg/cm² × 3.14 cm² ＝ 0.157 mg です。


    石英含有率 ＝ 0.157 ÷ 1.26 ≒ 0.1247 ＝ **12.5％**


    よって（5）です。'
