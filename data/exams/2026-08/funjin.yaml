  stem: '次の表は、繊維層フィルターによる粒子の捕集原理別に、粒径、ろ過速度、繊維径の捕集率に与える影響をまとめたものである。表中のⒶ、Ⓑ、Ⓒに入る語句の組合せとして、正しいものは下のうちどれか。


    |  | 粒径 | ろ過速度 | 繊維径 |

    |---|---|---|---|

    | さえぎり効果 | Ⓐ | — | 小さいほど捕集率大 |

    | 重力効果 | 大きいほど捕集率大 | 小さいほど捕集率大 | Ⓒ |

    | 慣性効果 | 大きいほど捕集率大 | 大きいほど捕集率大 | 小さいほど捕集率大 |

    | 静電沈着 | — | Ⓑ | 小さいほど捕集率大 |'
  columns:
  - Ⓐ
  - Ⓑ
  - Ⓒ
  choices:
  - 小さいほど捕集率大 ／ 大きいほど捕集率大 ／ 小さいほど捕集率大
  - 小さいほど捕集率大 ／ 大きいほど捕集率大 ／ 大きいほど捕集率大
  - 大きいほど捕集率大 ／ 小さいほど捕集率大 ／ 小さいほど捕集率大
  - 大きいほど捕集率大 ／ 小さいほど捕集率大 ／ 大きいほど捕集率大
  - 大きいほど捕集率大 ／ 大きいほど捕集率大 ／ 小さいほど捕集率大
  answer: 3
  choice_notes: []
  explanation: '繊維層フィルターが粒子を捕集する効果は、原理ごとに、粒径・ろ過速度・繊維径への依存のしかたが異なります。


    - **さえぎり効果**：粒子の重心の軌跡は繊維に触れなくても、粒子の端が繊維に触れて捕集される現象です。粒径が**大きい**ほど捕集率が大きくなります（Ⓐ）。繊維径が小さいほど捕集率が大きくなります。

    - **重力効果**：粒径が大きいほど、ろ過速度が小さい（ゆっくり通る）ほど、沈降する時間が確保できて捕集率が大きくなります。繊維径が**小さい**ほど、繊維の間隔が狭く、沈降する距離が短くなるので捕集率が大きくなります（Ⓒ）。

    - **慣性効果**：粒径が大きいほど、ろ過速度が大きいほど、捕集率が大きくなります。

    - **静電沈着**：ろ過速度が**小さい**ほど、粒子が電荷の影響を受ける時間が長くなり、捕集率が大きくなります（Ⓑ）。


    よって（3）の「大きいほど／小さいほど／小さいほど」です。


    （参考：粒径が1 µmより大きいときは、慣性・重力・さえぎり効果が有効で、粒径が大きいほど捕集効率が上がるとされます。出典：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
  figures: []
  law_note: null
  _review: true
