  stem: 慣性衝突式分粒装置（インパクター）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - ハイボリウムエアサンプラーの分粒装置の衝突板に付着する粉じんが一定の量を超えると、測定値は大きくなる。
  - 円形ノズル式インパクターのノズル孔に汚れが付着すると、分粒装置を通過する粒子の50 ％分粒粒径は小さい方へ移行する。
  - 円形ノズル式インパクターで所定の流量より大きな流量で吸引すると、測定値は小さくなる。
  - 円形ノズル式インパクターの 50 ％分粒粒径は、ノズルを通過する粒子の密度の平方根に比例する。
  - 通気の際の流速が速くなるほど、分粒装置を通過する粒子の 50 ％分粒粒径は小さい方へ移行する。
  answer: 4
  choice_notes: []
  explanation: '慣性衝突式分粒装置（インパクター）の50％分粒粒径は、粒子の密度が大きいほど**小さく**なります。粒子の密度の平方根に**反比例**します。「平方根に比例する」とする選択肢4は誤りです。


    流速が速いほど（吸引流量が大きいほど）、50％分粒粒径は小さいほうへ移ります。したがって、所定より大きい流量で吸引すると、分粒装置を通過する粒子が少なくなり、測定値は小さくなります（選択肢3、5）。ノズル孔が汚れて小さくなると、流速が速くなり、50％分粒粒径は小さいほうへ移ります（選択肢2）。衝突板に付着した粉じんが一定量を超えると、粒子が跳ね返って通り抜け、測定値が大きくなります（選択肢1）。


    この選択肢と同様の記述は、令和4年度第1回の問題でも出題され、誤りとして扱われています。この問題の正誤は、出題実績にもとづいて判断しています。'
