  stem: X線回折分析で得られた回折図形に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 受光スリットの幅を広くすると、回折図形の幅は広くなる。
  - 結晶度の低いクリストバライトでは、回折図形の幅は広くなる。
  - トリジマイトは、石英やクリストバライトと同様に、画一的な回折パターンを示す。
  - 石英の主回折線を妨害する物質には、正長石、グラファイト、硫化亜鉛等がある。
  - 分析試料に玉ずいが多く含まれていると、尖鋭な回折ピークが得られない。
  answer: 3
  choice_notes: []
  explanation: 'トリジマイトは、結晶系が複数あって（単斜晶系や斜方晶系など）、回折図形が一定ではありません。石英やクリストバライトのように、「画一的な回折パターンを示す」とする選択肢3は誤りです。


    石英の主回折線（2θ＝26.66°、d＝3.34 Å）を妨害する物質には、雲母鉱物、正長石、ムライト、シリマナイト、グラファイト、ジルコン、硫化亜鉛などがあります。受光スリットを広くすると、回折図形の幅も広くなります。玉ずいは石英の微結晶と非晶質シリカの集合体なので、尖鋭なピークは得られず、ブロードな回折線になります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
