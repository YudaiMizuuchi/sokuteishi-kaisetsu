  columns: null
  choices:
  - 対陰極が Cu の X 線管球を用いて分析した場合、石英の主回折線（d：3.34 Å）は、2θ：26.66 °に出現する。
  - 特性 X 線の波長は、K、L 系列ごとに異なるが、原子番号が大きくなると短くなる。
  - 受光スリットの幅を広くすると、回折線強度は増大する。
  - モノクロメーターによってK<sub>β</sub>線はほとんど除去されるが、K<sub>β</sub>除去フィルターを用いた場合より回折X線の強度は弱くなる。
  - X線の単色化のために用いられるK<sub>β</sub>除去フィルターとしては、対陰極物質より、原子番号が1又は2大きな物質が用いられる。
  answer: 5
  choice_notes: []
  explanation: 'Kβ除去フィルターには、対陰極物質より、原子番号が**1〜2小さい**物質を使います。たとえば、銅（29）にはニッケル（28）、コバルト（27）には鉄（26）、モリブデン（42）にはジルコニウム（40）です。「原子番号が1又は2大きな物質」とする選択肢5は誤りです。


    銅対陰極のとき、石英の主回折線（d＝3.34 Å）は、2θ＝26.66°に出ます。受光スリットを広くすると強度は増しますが、回折線はブロードになります。モノクロメーターを使うと、Kβ線がほとんど除去され、蛍光X線によるバックグラウンドも減りますが、フィルターを使うときより強度は弱くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
