  stem: 次の記述の㋑及び㋺の［　］に入る語句の組合せとして、正しいものは下のうちどれか。ただし、粒子の密度は媒質の密度より十分大きいものとする。「粒径 2 ～ 5 µm の球形粒子が静止した媒質中を落下する際の終末速度は、［㋑］に比例し、［㋺］に反比例する。」
  columns:
  - ㋑
  - ㋺
  choices:
  - 粒子の密度 ／ 媒質の粘性係数
  - 粒子の密度の2乗 ／ 媒質の粘性係数
  - 粒子の直径 ／ 媒質の粘性係数
  - 粒子の直径 ／ 重力加速度
  - 粒子の直径の2乗 ／ 重力加速度
  answer: 1
  choice_notes: []
  explanation: '球形粒子が静止した媒質中を落下するときの終末沈降速度は、ストークスの式で表されます。


    v ＝（ρ − ρ₀）× g × d² ／（18 η）


    ρは粒子の密度、ρ₀は媒質の密度、gは重力加速度、dは粒子の直径、ηは媒質の粘性係数です。粒子の密度が媒質の密度より十分大きいときは、ρ − ρ₀ ≒ ρ なので、終末速度は**粒子の密度に比例**し、**媒質の粘性係数に反比例**します。よって（1）です。


    （参考：『労働衛生の知識』）'
