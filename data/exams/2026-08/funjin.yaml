  stem: 電子天秤に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 電子天秤は、直示天秤に比べて温度変化による感度の変化が小さい。
  - 帯電した試料を秤量すると真値と異なった値を表示することがある。
  - 零位（電磁力平衡）方式の電子天秤は、荷重の変化による可動部の微小変位を差動トランス、光電素子等により検出し、変位がゼロになるよう、電磁力により平衡をとる方式である。
  - 力測定方式の電子天秤は、荷重を加えることによって生じる力の変化を弾性体のひずみとして測定する。
  - 一般に使用されている読取り限度が 1 mg 以下の電子天秤の多くは、力計（ロードセル）を利用した力測定方式である。
  answer: 1
  choice_notes: []
  explanation: '電子天びんは、使い方が簡単で読み取りも楽ですが、**温度変化による感度の変化は、直示天びんに比べて大きい**ので、しばしば較正を行い、感度を調べる必要があります。「直示天びんに比べて小さい」とする選択肢1は誤りです。


    電子天びんには、零位方式、力測定方式、偏位方式があります。零位方式は、荷重による可動部の微小変位を検出し、変位がゼロになるよう電磁力で平衡をとります。力測定方式は、荷重による力の変化を弾性体のひずみ（ロードセル）として測ります。読取限界1 mg以下の電子天びんの多くは、力測定方式です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
