  explanation: '基底標準吸収補正法は、試料による吸収の影響を、試料の後ろに置いた基底標準物質の回折線強度の変化から補正する方法です。このような吸収補正を行うことで、**定量範囲は広くなり**、マトリックスの吸収の影響が少なくなります。「定量範囲は狭くなる」とする選択肢5は誤りです。


