  stem: 遊離けい酸を分析するための粒度調整に用いられる液相沈降法に関する次の記述の㋑から㋩の［　］に入る数値又は語句の組合せとして、最も適当なものは下のうちどれか。「単位作業場所で採取した堆積粉じんのうち目開き［㋑］µm のふるいを通過した堆積粉じんを試料とし、約 500 mL の精製水に対し約［㋺］g の試料を加え、懸濁液を作製する。この懸濁液をピペット型液相沈降試験器に移し、精製水で所定の目盛り線に合わせた後に十分に振とうしてから静置する。所定時間静置した後にピペット型液相沈降試験器のコックを回し、得られた所定粒度以下の粒子を含む懸濁液をろ過・乾燥して、多くの場合［㋩］の分析試料とする。」
  columns:
  - ㋑
  - ㋺
  - ㋩
  choices:
  - 75 ／ 1 ／ X 線回折分析法
  - 75 ／ 5 ／ りん酸法
  - 90 ／ 1 ／ X 線回折分析法
  - 90 ／ 5 ／ りん酸法
  - 90 ／ 5 ／ X 線回折分析法
  answer: 2
  choice_notes: []
  explanation: '液相沈降法（ピペット法）の手順は、次のとおりです。


    1. 単位作業場所で採取した堆積粉じんのうち、**目開き75 µm**のふるいを通過したものを試料とし、乾燥後、円すい四分法で分けます。

    2. 約**500 mL**の精製水が入っている1 Lビーカーに、試料を約**5 g**加え、超音波洗浄器などで十分にかくはんします（粒子濃度が高いと凝集しやすく、低いと測定精度が悪くなるため、質量比で約1％にします）。

    3. ピペット型液相沈降試験器で、ストークスの式から求めた沈降時間だけ静置し、所定の粒度以下の粒子を含む懸濁液を取り出します。

    4. 取り出した懸濁液をろ過・乾燥し、多くの場合、**りん酸法**の分析試料とします。


    よって（2）です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
