  - 労働者が、5年間につき 100 mSv又は1年間につき 50 mSvを超えて実効線量を受けた場合には、速やかに、医師の診察又は処置を受けさせるとともに、所轄労働基準監督署長に報告しなければならない。
  answer: 1
  choice_notes: []
  explanation: '密封されていない放射性物質を取り扱う作業では、専用の放射性物質取扱作業室を設けることが求められますが、その作業場所に発散源を密閉する設備・局所排気装置・プッシュプル型換気装置を設けることを一律に義務づける、という定めにはなっていません。選択肢1は誤りです。


    電離放射線障害防止規則では、放射性物質による汚染を広げないために、作業室の構造や汚染の検査などが定められています。有機則や特化則の発散抑制措置の書き方と混同させる問題なので、規則ごとの違いに注意しましょう。


    根拠：電離放射線障害防止規則第22条（専用の作業室を設ける）、第3条の2（遮蔽物の設置、局所排気装置や発散源を密閉する設備の設置「等により」、労働者が常時立ち入る場所の実効線量を1週間につき1 mSv以下にする）。局所排気装置などは線量限度を守るための手段の例として挙げられているもので、一律の設置義務ではありません。'
  figures: []
  law_note: null
  _key_choice: 密封されていない放射性物質を取り扱う作業に労働者を従事させるときは、専用の作業室を設け、当該作業を行う作業場所に、放射性物質のガス、蒸気又は粉じんの発散源を密閉する設備、局所排気装置又はプッシュプル型換気装置を設けなければならない。
