  stem: 作業主任者に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業主任者技能講習のうち、酸素欠乏危険作業主任者技能講習においては、学科講習及び実技講習が行われる。
  - 作業環境測定を行うべき指定作業場で行われる作業のうち、放射性物質取扱作業室における作業については、作業主任者を選任する必要はない。
  - 作業の区分が同一である作業を同一の場所において行う場合、当該区分に係る作業主任者を2人以上選任することができる。
  - 作業主任者は、作業の区分にかかわらず、作業主任者としての業務に従事するときは、その資格を証する書面を携帯していなければならない。
  - 作業主任者を選任したときに、所轄労働基準監督署長に報告する必要はない。
  answer: 4
  choice_notes: []
  explanation: '資格を証する書面の携帯が義務づけられているのは、クレーンの運転などの就業制限業務に就く者です。作業主任者については、選任した事業者が氏名と行わせる事項を作業場の見やすい箇所に掲示するなどして周知することになっており、「作業の区分にかかわらず書面を携帯しなければならない」という定めはありません。選択肢4は誤りです。


    作業主任者は、作業を直接指揮する立場の人です。周りの労働者が「誰が作業主任者か」を分かるようにすることが重視されていて、それが掲示による周知の義務になっています。


    根拠：労働安全衛生規則第18条（作業主任者の氏名と行わせる事項を作業場の見やすい箇所に掲示する等により周知）。'
  figures: []
  law_note: null
  _key_choice: 作業主任者は、作業の区分にかかわらず、作業主任者としての業務に従事するときは、その資格を証する書面を携帯していなければならない。
