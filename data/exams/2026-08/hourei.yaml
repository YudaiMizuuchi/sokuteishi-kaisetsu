  - 正しい。面体の装着の確認の結果は記録し、3年間保存する。
  - 正しい。保護具着用管理責任者を選任し、所定の事項を行わせる。
  - 正しい。所定の措置を講じたら、第3管理区分措置状況届を提出する。
  explanation: '第3管理区分の場所で、第1・第2管理区分にできるかどうかの意見を聴く作業環境管理専門家は、**当該事業場に属さない**（外部の）者でなければなりません。「当該事業場に専属の」とする選択肢1は誤りです。


    改善できるかどうかを、事業場の内部の判断に任せず、外部の専門家の目で確認させるための仕組みです。化学物質の自律的管理で、適用除外の認定に「専属の化学物質管理専門家」が求められるのとは、向きが逆になっている点に注意しましょう。'
