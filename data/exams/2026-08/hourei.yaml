  stem: 次の呼吸用保護具のうち、厚生労働大臣が定める規格を具備しなければ、譲渡し、又は貸与してはならないものに該当しないものはどれか。
  choices:
  - 亜硫酸ガス用防毒マスク
  - 硫化水素用防毒マスク
  - 使い捨て式防じんマスク
  - 防じん機能を有する電動ファン付き呼吸用保護具
  - 有機ガス用の防毒機能を有する電動ファン付き呼吸用保護具
  answer: 2
  choice_notes: []
  explanation: '厚生労働大臣が定める規格を備えなければ譲渡・貸与してはならない防毒マスクは、ハロゲンガス用、有機ガス用、一酸化炭素用、アンモニア用、亜硫酸ガス用の5種類です。硫化水素用の防毒マスクはこれに含まれないので、答えは（2）です。


    防じんマスク（使い捨て式を含む）と、防じん機能をもつ電動ファン付き呼吸用保護具、有機ガス用などの防毒機能をもつ電動ファン付き呼吸用保護具も、規格を備える必要があるものです。'
