  stem: 有機溶剤中毒予防規則、特定化学物質障害予防規則、鉛中毒予防規則又は粉じん障害防止規則に基づく作業環境測定結果の評価により、第3管理区分に区分された場所であって、特段の措置を講じていないものに関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境を改善するために必要な措置を講ずることにより、第1管理区分又は第2管理区分とすることの可否について、当該事業場に専属の作業環境管理専門家の意見を聴かなければならない。
  - 作業環境管理専門家が第1管理区分又は第2管理区分とすることが可能と判断した場合、直ちに、当該場所について、作業環境管理専門家の意見を踏まえた、第1管理区分又は第2管理区分とするために必要な措置を講じ、その効果を確認するため、当該場所における対象有害物質の濃度を測定し、その結果を評価しなければならない。
  - 作業環境管理専門家が第1管理区分又は第2管理区分とすることが困難と判断し、個人サンプリング測定等の結果に応じて、面体を有する呼吸用保護具を使用させることとした場合、当該呼吸用保護具が適切に装着されていることを確認し、その結果を記録し、これを3年間保存しなければならない。
  - 作業環境管理専門家が第1管理区分又は第2管理区分とすることが困難と判断し、個人サンプリング測定等の結果に応じて、呼吸用保護具を使用させることとした場合、保護具に関する知識及び経験を有すると認められる者のうちから保護具着用管理責任者を選任し、呼吸用保護具を常時有効かつ清潔に保持することなど所定の事項を行わせなければならない。
  - 作業環境管理専門家が第1管理区分又は第2管理区分とすることが困難と判断した場合で、所定の措置を講じたときは、遅滞なく、第3管理区分措置状況届を所轄労働基準監督署長に提出しなければならない。
  answer: 1
