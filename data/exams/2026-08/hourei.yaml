  stem: 石綿障害予防規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石綿の分析の作業を行うときは、あらかじめ、所定の届書に当該作業の概要を示す書面及び作業場所の図面を添えて、所轄労働基準監督署長に提出しなければならない。
  - 石綿等の取扱いに伴い石綿等の粉じんを発散する場所において常時作業に従事する労働者については、1か月を超えない期間ごとに、所定の事項を記録し、これを当該労働者が当該事業場において常時当該作業に従事しないこととなった日から40年間保存するものとされている。
  - 石綿等を取り扱う屋内作業場については、6か月以内ごとに1回、定期に、石綿の空気中における濃度を測定し、その都度、所定の事項を記録し、これを40年間保存しなければならない。
  - 石綿等の取扱いに伴い石綿の粉じんを発散する場所における業務に常時従事させたことのある労働者を使用している場合には、当該業務に現に従事させていなくても、当該労働者に対し、6か月以内ごとに1回、定期に、石綿健康診断を行わなければならない。
  - 法令に基づき設置した局所排気装置を1年を超える期間使用しない場合、当該期間を経過後、その使用を再び開始する際に、所定の事項について自主検査を行い、その結果等を記録し、これを3年間保存しなければならない。
  answer: 1
  choice_notes: []
  explanation: '石綿の分析の作業そのものについて、作業の概要を示す書面や作業場所の図面を添えて事前に届け出る、という定めはありません。選択肢1は誤りです。


    石綿障害予防規則で事前の届出が求められるのは、主に次の2つです。


    - 一定の建築物等の解体等の作業（第5条）

    - 石綿の分析のための試料の用に供される石綿など（労働安全衛生法施行令第16条第1項第4号に掲げるもの）を製造し、輸入し、又は使用しようとする場合の、所轄労働基準監督署長への届出（第46条の3）


    令和5年度第2回 法令 問20の選択肢2（分析の試料に用いる石綿等は、届出によって製造等の禁止の対象から除外される）は、後者の規定です。「分析の作業」ではなく「分析用の石綿を製造・輸入・使用すること」の届出である点に注意しましょう。


    根拠：石綿障害予防規則第5条・第46条の3、労働安全衛生法施行令第16条第1項第4号。'
