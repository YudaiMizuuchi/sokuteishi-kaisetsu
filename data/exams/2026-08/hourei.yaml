  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 雇入時の健康診断を行ったときは、常時使用する労働者数にかかわらず、その結果について、所轄労働基準監督署長に報告する必要はない。
  - 雇入時の健康診断において、医師による健康診断を受けた後3か月を経過しない者が、当該健康診断の結果を証明する書面を提出したときは、当該健康診断の項目に相当する項目については省略することができる。
  - 雇入時及び定期健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 事業場で行った定期健康診断の結果、異常の所見があると診断された労働者については、その健康を保持するために必要な措置について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。
  - 定期健康診断を行ったときは、常時使用する労働者数にかかわらず、遅滞なく、その結果を所轄労働基準監督署長に報告しなければならない。
  answer: 5
  choice_notes:
  - 正しい。雇入時の健康診断の結果は報告不要。
  - 正しい。3か月以内に受けた健康診断の結果を証明する書面を出せば、相当する項目は省略できる。
  - 正しい。健康診断個人票の保存は5年間。
  - 正しい。異常の所見がある者について、3か月以内に医師の意見を聴く。
  - 誤り。定期健康診断の結果報告は、常時50人以上の事業場。
  explanation: '定期健康診断の結果報告書を所轄労働基準監督署長に提出しなければならないのは、**常時50人以上**の労働者を使用する事業場です（労働安全衛生規則第52条）。「労働者数にかかわらず」とする選択肢5は誤りです。


    雇入時の健康診断は報告不要、定期健康診断は50人以上で報告、と区別して覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 定期健康診断を行ったときは、常時使用する労働者数にかかわらず、遅滞なく、その結果を所轄労働基準監督署長に報告しなければならない。
