  - 第2種酸素欠乏危険作業には、硫化水素を製造し、又は取り扱う屋内作業場における作業がある。
  - 酸素欠乏危険作業に労働者を従事させるときは、労働者を当該作業を行う場所に入場させ、及び退場させる時に、人員を点検しなければならない。
  - 腐敗しやすい物質を入れたことのある配管を清掃する場合で、これを分解する作業に労働者を従事させるときは、作業の方法及び順序を決定し、あらかじめ、これらを作業に従事する労働者に周知しなければならない。
  - 酸素欠乏危険作業を行う作業場について、作業環境測定を行ったときは、そのつど、所定の事項を記録して、これを3年間保存しなければならない。
