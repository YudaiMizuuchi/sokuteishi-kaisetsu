  stem: 粉じん障害防止規則及びじん肺法に関する次の記述のうち、誤っているものはどれか。ただし、同規則に定める適用除外及び特例はないものとする。
  choices:
  - 法令に基づき設置した局所排気装置については、1年を超える期間使用しない場合を除き、1年以内ごとに1回、定期に、所定の事項について自主検査を行い、その結果等を記録して、これを3年間保存しなければならない。
  - 常時特定粉じん作業に係る業務に労働者を就かせるため、法定の科目について特別の教育を行ったときは、当該特別の教育の受講者、科目等の記録を作成して、これを3年間保存しておかなければならない。
  - 作業環境測定結果の評価が2年以上行われ、その間、第1管理区分に区分されることが継続した単位作業場所については、作業環境測定を、1年以内ごとに1回、定期に行うこととすることができる。
  - 常時粉じん作業に従事する労働者で、じん肺管理区分が管理2又は管理3であるものについては、1年以内ごとに1回、定期的に、じん肺健康診断を行わなければならない。
  - じん肺健康診断の結果、じん肺管理区分が管理4と決定された者は、療養を要するものとされている。
  answer: 3
  choice_notes:
  - 正しい。局所排気装置の定期自主検査は1年以内ごとに1回、記録は3年間保存。
  - 正しい。特別教育の記録は3年間保存。
  - 誤り。第1管理区分の継続で測定頻度を1年以内ごとにできる定めはない。
  - 正しい。管理2・管理3の者は1年以内ごとに1回、じん肺健康診断を行う。
  - 正しい。管理4は療養を要する。
  explanation: '粉じん障害防止規則では、作業環境測定の評価で第1管理区分が2年以上続いた単位作業場所について、所轄労働基準監督署長の**許可**を受けた場合に、粉じんの濃度の測定を「別に厚生労働大臣の定めるところ」（測定方法の特例）によることができる、とされています（第26条第3項）。これは測定の方法についての特例で、測定の頻度を「1年以内ごとに1回」に緩和するものではなく、許可も必要です。選択肢3は誤りです。


    粉じんの濃度の測定は、6か月以内ごとに1回です（同条第1項）。じん肺健康診断は、管理2・管理3の者は1年以内ごと、管理4は療養を要する、という区分ごとの扱いもあわせて覚えておきましょう。


    根拠：粉じん障害防止規則第26条第1項・第3項。'
  figures: []
  law_note: null
  _key_choice: 作業環境測定結果の評価が2年以上行われ、その間、第1管理区分に区分されることが継続した単位作業場所については、作業環境測定を、1年以内ごとに1回、定期に行うこととすることができる。
