  explanation: '硫化水素を製造したり取り扱ったりする屋内作業場での作業は、特定化学物質障害予防規則の対象であり、酸素欠乏症等防止規則でいう第2種酸素欠乏危険作業には当たりません。選択肢2は誤りです。


    第2種酸素欠乏危険作業は、酸素欠乏に加えて、汚水や腐泥などから**自然に発生する**硫化水素による中毒のおそれがある場所での作業です。硫化水素を原料などとして扱う作業とは、規則が違います。'
