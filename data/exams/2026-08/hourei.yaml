  stem: 労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 常時80人の労働者を使用する事業場においては、総括安全衛生管理者を選任する必要はないが、衛生管理者及び産業医を選任しなければならない。
  - 常時600人の労働者を使用する事業場で、多量の高熱物体を取り扱う業務に常時40人の労働者を従事させるものにあっては、3人以上の衛生管理者を選任し、そのうち1人を衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。
  - 常時1500人の労働者を使用する事業場においては、総括安全衛生管理者、衛生管理者を4人以上及び専属の産業医を選任しなければならない。
  - 2人以上の衛生管理者を選任する必要がある場合において、そのうち1人を医師、歯科医師又は労働衛生コンサルタントのうちから選任するときは、当該者については、当該事業場に専属でない者とすることができる。
  - 衛生委員会の委員には、衛生管理者及び産業医のそれぞれのうちから事業者が指名した者を含まなければならない。
  answer: 4
  choice_notes:
  - 正しい。常時50人以上で衛生管理者・産業医が必要。80人では総括安全衛生管理者は不要。
  - 正しい。501〜1,000人は3人以上。500人超で多量の高熱物体を取り扱う業務に30人以上なら、1人を衛生工学衛生管理者免許を受けた者から選ぶ。
  - 正しい。1,001〜2,000人は衛生管理者4人以上、1,000人以上で専属の産業医と総括安全衛生管理者が必要。
  - 誤り。専属でなくてよいのは労働衛生コンサルタントだけ。
  - 正しい。衛生委員会には、衛生管理者と産業医のうちから指名した者を含める。
  explanation: '衛生管理者を2人以上選任する場合に、そのうち1人を専属でない者とできるのは、**労働衛生コンサルタント**を選任するときだけです（労働安全衛生規則第7条）。医師や歯科医師を衛生管理者に選任する場合には、この例外はありません。選択肢4は誤りです。


    衛生管理者は、事業場に常駐して日常の衛生管理を担う役割なので、原則は専属です。外部の専門家である労働衛生コンサルタントだけが例外として認められている、と理由とセットで覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 2人以上の衛生管理者を選任する必要がある場合において、そのうち1人を医師、歯科医師又は労働衛生コンサルタントのうちから選任するときは、当該者については、当該事業場に専属でない者とすることができる。
