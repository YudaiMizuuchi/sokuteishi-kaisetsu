  stem: 事業場における化学物質管理に関する次の記述の㋑から㋥までの［　］に入る語句の組合せとして、法令上、正しいものは下のうちどれか。「化学物質による労働災害が発生した事業場のうち、化学物質の管理が適切に行われていない疑いがあるものとして［㋑］から化学物質の管理の状況について改善すべき旨を指示されたものは、遅滞なく、［㋺］から当該事業場における化学物質の管理の状況についての確認及び当該事業場が実施しうる望ましい改善措置に関する助言を受けなければならない。一方、事業場に専属の［㋩］が配置され、有機溶剤中毒予防規則、特定化学物質障害予防規則、鉛中毒予防規則又は粉じん障害防止規則が対象とする物質に関し、リスクアセスメントの実施に関することを管理していること、過去3年間において、労働者が死亡する労働災害又は休業の日数が4日以上の労働災害が発生していないこと、作業環境測定の評価結果が全て第1管理区分に区分されることなど、これらの規則に係る管理が一定の水準にあるものとして、規則ごとに［㋥］の認定を受けることにより、当該規則については、一部を除きその適用を除外される。」
  choices:
  - 所轄都道府県労働局長 ／ 化学物質管理者 ／ 化学物質管理専門家 ／ 厚生労働大臣
  - 所轄都道府県労働局長 ／ 化学物質管理専門家 ／ 化学物質管理者 ／ 所轄労働基準監督署長
  - 所轄労働基準監督署長 ／ 化学物質管理者 ／ 化学物質管理者 ／ 所轄都道府県労働局長
  - 所轄労働基準監督署長 ／ 化学物質管理専門家 ／ 化学物質管理者 ／ 所轄労働基準監督署長
  - 所轄労働基準監督署長 ／ 化学物質管理専門家 ／ 化学物質管理専門家 ／ 所轄都道府県労働局長
  answer: 5
  choice_notes: []
  explanation: '化学物質による労働災害が発生し、管理が適切でない疑いがある事業場は、**所轄労働基準監督署長**から改善を指示されると、外部の**化学物質管理専門家**から管理状況の確認と改善措置の助言を受けなければなりません。


    一方、**専属の化学物質管理専門家**が配置されていて、一定期間重い労働災害がなく、作業環境測定の結果が全て第1管理区分であるなど、化学物質管理の水準が一定以上の事業場は、**所轄都道府県労働局長**の認定を受けると、特化則・有機則・鉛則・粉じん則の規定の一部が適用除外になります。


    よって、㋑ 所轄労働基準監督署長、㋺ 化学物質管理専門家、㋩ 化学物質管理専門家、㋥ 所轄都道府県労働局長の組合せ（5）が正しいものです。化学物質管理者（事業場ごとに選任する担当者）と化学物質管理専門家（高度な知識をもつ専門家）の違いと、指示は監督署長・認定は労働局長という役割の違いがポイントです。'
  figures: []
  law_note: null
  _key_choice: ㋑所轄労働基準監督署長 ㋺化学物質管理専門家 ㋩化学物質管理専門家 ㋥所轄都道府県労働局長
