  stem: 有害物質、有害要因等の測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 加硫がまによりゴムを加硫する業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該作業場における気温及び湿度を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 第2種酸素欠乏危険作業を行う作業場については、その日の作業を開始する前に、当該作業場における酸素及び硫化水素の濃度を測定しなければならない。
  - 高圧室内業務を行う作業室については、その日の作業を開始する前に、当該作業室における気温、湿度及び気圧を測定しなければならない。
  - 廃棄物の焼却施設に設置された廃棄物焼却炉の解体等の業務に係る作業を行うときは、当該作業を開始する前に、当該作業に係る焼却炉の内部に付着した物に含まれるダイオキシン類の含有率を測定しなければならない。
  answer: 4
  choice_notes: []
  explanation: '高圧室内業務の作業室について、その日の作業開始前に気温・湿度・気圧を測定しなければならない、という定めはありません。選択肢4は誤りです。


    ほかの選択肢は、いずれも頻出の測定です。暑熱の屋内作業場（加硫がまなど）の気温・湿度と、坑内の通気量はいずれも半月以内ごとに1回、第2種酸素欠乏危険作業は作業開始前に酸素と硫化水素、廃棄物焼却炉の解体等は作業開始前にダイオキシン類の含有率を測ります。


    根拠：高気圧作業安全衛生規則には、作業室の気温・湿度・気圧を作業開始前に測定する定めはなく、有害ガスの測定や、作業主任者に携帯式の圧力計や酸素・炭酸ガス・有害ガスの測定器具を携行させること（第26条）などが定められています。'
