  stem: 作業環境評価基準では、有機溶剤を2種類以上含有する混合物に係る単位作業場所においては、測定点ごとに計算して得た換算値C を当該測定点における測定値とみなして、管理区分の区分を行うこととされているが、換算値C を計算する式として、正しいものは次のうちどれか。ただし、C₁、C₂、… は有機溶剤の種類ごとの測定値、E₁、E₂、… は有機溶剤の種類ごとの管理濃度、R₁、R₂、… は有機溶剤の種類ごとの測定値がそれらの合計値に占める割合とする。
  choices:
  - C ＝（E₁/C₁）+（E₂/C₂）＋…
  - C ＝（C₁/E₁）+（C₂/E₂）＋…
  - C ＝（C₁＋ C₂＋…）/（E₁＋ E₂＋…）
  - C ＝（R₁C₁/E₁）+（R₂C₂/E₂）＋…
  - C ＝（R₁C₁＋ R₂C₂＋…）/（E₁＋ E₂＋…）
  answer: 2
  choice_notes: []
  explanation: '有機溶剤を2種類以上含む混合物の評価では、測定点ごとに、各有機溶剤の測定値をそれぞれの管理濃度で割って足し合わせた換算値 C を求めます。


    C ＝ C₁/E₁ ＋ C₂/E₂ ＋ …


    この換算値を測定値とみなし、管理濃度を 1 として管理区分を決めます。よって、正しい式は（2）です。


    各成分が「管理濃度の何倍か」を合計すると考えれば、式の形を覚えていなくても組み立てられます。分母と分子が逆の（1）や、割合 R を掛けた（4）（5）を選ばないように注意しましょう。'
  figures: []
  law_note: null
  _key_choice: C=(C_1/E_1)+(C_2/E_2)+\cdots
