  stem: 法令により、定期に作業環境測定を行うべき作業環境測定対象Ⓐ、測定頻度Ⓑ及び記録の保存期間Ⓒの組合せとして、誤っているものはどれか。
  choices:
  - 放射性物質の濃度 ／ 1か月以内ごとに1回 ／ 5年
  - 五酸化バナジウムの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - トリレンジイソシアネートの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - オルト-ジクロルベンゼンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - ナフタレンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  answer: 4
  choice_notes:
  - 正しい。放射性物質の濃度は1か月以内ごとに1回、記録は5年間保存。
  - 正しい。五酸化バナジウムは第2類物質で、6か月以内ごと、3年間保存。
  - 正しい。トリレンジイソシアネートは第2類物質で、6か月以内ごと、3年間保存。
  - 誤り。オルト-ジクロルベンゼンは第2種有機溶剤で、記録の保存は3年間。
  - 正しい。ナフタレンは特別管理物質なので、記録は30年間保存。
  explanation: 'オルト-ジクロルベンゼンは第2種有機溶剤で、作業環境測定は6か月以内ごとに1回、記録の保存は**3年間**です。30年間保存が必要なのは特別管理物質などに限られるので、選択肢4は誤りです。


    ナフタレンは特定化学物質の第2類物質で、特別管理物質に当たるため、記録は30年間保存します。名前が似た「ジクロルベンゼン」と「ジクロルベンジジン（第1類物質）」も混同しやすいので注意しましょう。'
  figures: []
  law_note: null
  _key_choice: Ⓐオルト-ジクロルベンゼンの濃度 Ⓑ6か月以内ごとに1回 Ⓒ30年
