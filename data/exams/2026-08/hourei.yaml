  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 「鉱物性粉じん」（作業環境測定法施行規則別表第1号の作業場）に係る登録を受けた第1種作業環境測定士は、リフラクトリーセラミックファイバーに係る作業環境測定を行うことができる。
  - 「特定化学物質」（作業環境測定法施行規則別表第3号の作業場）に係る登録を受けた第1種作業環境測定士は、クロム酸及びその塩に係る作業環境測定を行うことができる。
  - 「有機溶剤」（作業環境測定法施行規則別表第5号の作業場）に係る登録のみを受けた第1種作業環境測定士は、エチルベンゼンに係る作業環境測定を行うことができない。
  - 二酸化硫黄を取り扱う事業場における二酸化硫黄の濃度の測定は、作業環境測定士ではない者が行うことができる。
  - 指定作業場について行った作業環境測定の結果の評価は、作業環境測定士ではない者が行うことができる。
  answer: 2
  choice_notes: []
  explanation: '作業環境測定士の登録は、作業場の種類ごとに分かれています。クロム酸及びその塩は「金属類」（作業環境測定法施行規則別表第4号）に当たるため、「特定化学物質」（同第3号）の登録だけでは測定できません。選択肢2は誤りです。


    第3号の特定化学物質の作業場には、金属類に当たる物質を除く、という区分があります。クロム酸のような金属化合物の特定化学物質は、第4号の登録で扱う、と区分の境目を押さえておきましょう。


    選択肢4の二酸化硫黄は第3類物質で、作業環境測定の義務がある指定作業場には当たらないため、測定士でなくても測定できます。選択肢5の評価は事業者が行うもので、測定士の独占業務ではありません。'
  figures: []
  law_note: null
  _key_choice: 「特定化学物質」（作業環境測定法施行規則別表第3号の作業場）に係る登録を受けた第1種作業環境測定士は、クロム酸及びその塩に係る作業環境測定を行うことができる。
