  stem: 化合物Ⓐとその構造式Ⓑとの次の組合せのうち、誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - ベンゾトリクロリド ／ 図の1
  - エチレンオキシド ／ 図の2
  - p-ジメチルアミノアゾベンゼン ／ 図の3
  - クロロメチルメチルエーテル ／ 図の4
  - β-プロピオラクトン ／ 図の5
  answer: 1
  choice_notes: []
  explanation: '各物質の構造式を、図と照らし合わせます。


    - 1 ベンゾトリクロリド：ベンゼン環に **−CCl₃** がついた化合物（C₆H₅−CCl₃）です。図の1は、ベンゼン環の隣り合う3つの炭素に塩素が直接ついた**トリクロロベンゼン**で、別の物質です。組合せは誤りです。

    - 2 エチレンオキシド：C−C−O の三員環（エポキシド）で、正しい組合せです。

    - 3 p-ジメチルアミノアゾベンゼン：アゾ基（−N＝N−）でつないだ2つのベンゼン環の一方に −N(CH₃)₂ がついた構造で、正しい組合せです。

    - 4 クロロメチルメチルエーテル：CH₃−O−CH₂Cl で、正しい組合せです。

    - 5 β-プロピオラクトン：O＝C−CH₂−CH₂−O の四員環（β-ラクトン）で、正しい組合せです。


    よって（1）です。'
