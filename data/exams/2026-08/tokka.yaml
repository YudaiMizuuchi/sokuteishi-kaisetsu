  stem: 特定化学物質Ⓐと、その分析を吸光光度分析法を用いて行う場合の標準原液の調製に用いる溶媒Ⓑとの次の組合せのうち、誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - フッ化水素 ／ アセトン
  - ペンタクロロフェノール ／ 水酸化ナトリウム溶液
  - クロロメチルメチルエーテル ／ アセトン
  - オーラミン ／ メタノール
  - ニトログリコール ／ 精製水
  answer: 1
  choice_notes: []
  explanation: '吸光光度分析法での標準原液（標準液）の調製に使う溶媒は、物質によって異なります。


    - **フッ化水素**：フッ化ナトリウムを**精製水**に溶かして標準原液（80 µg HF/mL）とします。アセトンは使いません。選択肢1は誤りです。

    - ペンタクロロフェノール：水酸化ナトリウム溶液に溶かします（選択肢2）。

    - クロロメチルメチルエーテル：アセトンに溶かします（選択肢3）。

    - オーラミン：メタノールに溶かします（選択肢4）。

    - ニトログリコール：精製水に溶かします（選択肢5）。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
