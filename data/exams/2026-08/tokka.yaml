  stem: シアン化水素の吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - シアン化水素は、硫酸を含浸したろ紙を使用して捕集し、精製水を加えて試料溶液とする。
  - 標準原液は、シアン化カリウムを精製水に溶解して調製する。
  - 標準原液のシアン化物イオン濃度は、硝酸銀溶液で滴定して標定する。
  - 試料溶液は中和し、緩衝液で pH を調整する。
  - クロラミン T を加えた後、ピリジン-ピラゾロンを加えて発色させる。
  answer: 1
  choice_notes: []
  explanation: '環境空気中のシアン化水素の吸光光度分析法（液体捕集法）の手順は、次のとおりです。


    1. **水酸化ナトリウム溶液**を入れたミゼットインピンジャーに試料空気を吸引して捕集します。

    2. 酢酸で中和し、緩衝液（pH6.8）で調整します。

    3. クロラミンTを加えたあと、ピリジン-ピラゾロンを加えて発色させます（青色）。620 nm付近で吸光度を測定します。

    4. 標準原液は、シアン化カリウムを精製水に溶かして調製し、シアン化物イオンの濃度を硝酸銀滴定法で標定します。


    「硫酸を含浸したろ紙で捕集し、精製水を加えて試料溶液とする」とする選択肢1は誤りです。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
