  stem: 有機化合物の官能基の名称Ⓐとそれを表す式Ⓑとの次の組合せのうち、誤っているものはどれか。
  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - フェニル基 ／ 図の1
  - アミド基 ／ 図の2
  - カルボニル基 ／ 図の3
  - シアノ基 ／ 図の4
  - ニトロ基 ／ 図の5
  answer: 1
  choice_notes: []
  explanation: '各選択肢の図を、官能基の名称と照らし合わせます。


    - 1 フェニル基：図の1は、ベンゼン環に**酸素原子（−O−）**がついた構造で、これは**フェノキシ基**（−O−C₆H₅）です。フェニル基は、ベンゼン環が直接結合した −C₆H₅ なので、組合せは誤りです。

    - 2 アミド基：−CONH₂ で、正しい組合せです。

    - 3 カルボニル基：＞C＝O で、正しい組合せです。

    - 4 シアノ基：−C≡N で、正しい組合せです。

    - 5 ニトロ基：−NO₂ で、正しい組合せです。


    よって（1）です。'
