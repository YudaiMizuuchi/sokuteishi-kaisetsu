  stem: 環境空気中のエチレンイミンの吸光光度分析法に関する次の記述の㋑から㋩の［　］に入る用語又は数値の組合せとして、正しいものは下のうちどれか。「環境空気中のエチレンイミンを精製水中に捕集し、捕集液を［㋑］にしてナフトキノンスルホン酸と反応させる。生成する黄色色素を［㋺］に抽出し、［㋩］nm 付近の波長での吸光度から定量を行う。」
