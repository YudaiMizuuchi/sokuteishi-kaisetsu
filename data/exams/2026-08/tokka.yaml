  stem: 環境空気（25 ℃、1気圧）中の p-ニトロクロロベンゼンの濃度を測定するため、2本のミゼットインピンジャーの各々に捕集液 10 mL を入れて直列に連結し、試料空気を流量 1.0 L･min⁻¹ で10分間捕集した。捕集後の捕集液は合わせてメスフラスコに入れ、さらに捕集液で 25 mL に定容したものを試料液とした。ガスクロマトグラフで分析した結果、試料液のピーク面積は 1700 であった。p-ニトロクロロベンゼン濃度が、0.25 µg･mL⁻¹ の標準液を試料液と同様に分析したところ、ピーク面積は 5300 であった。環境空気中の p-ニトロクロロベンゼン濃度として、正しい値に最も近いものは次のうちどれか。
