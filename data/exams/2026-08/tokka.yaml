  stem: 環境空気中のエチレンオキシドの測定方法に関する次の記述の㋑から㋩のに入る用語の組合せとして、正しいものは下のうちどれか。「活性炭に［㋑］を含浸・乾燥させたものを充塡した捕集管に試料空気を通気し、エチレンオキシドを誘導体化して 2-ブロモエタノールとして捕集する。この2-ブロモエタノールをトルエン／アセトニトリルで抽出し、［㋺］を加えて1時間以上放置した後、［㋩］で分析する。」
  columns:
