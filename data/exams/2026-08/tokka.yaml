    拡散セルでは、液体だめの表面が飽和蒸気圧で、拡散チューブ内に濃度勾配ができ、蒸気が出口に向かって移動します。拡散チューブの上端で希釈用ガスと混合し、液体の減少量から拡散速度（標準ガスの濃度）を求めます。恒温槽の温度が高いほど、拡散速度が大きくなり、標準ガスの濃度は高くなります。


