  stem: 作業環境測定の一般的事項に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 25 ℃、1気圧におけるガス又は蒸気の1モルの体積は、22.4 L である。
  - 空気中に存在する有害物質の濃度は、質量濃度又は体積分率で表す。
  - 空気中の有害物質は、粒子、ガス又は蒸気の状態で存在する。
  - 標準液の濃度は、所定の濃度に厳密に合わせる必要はない。
