  stem: 硫化水素を液体捕集し、得られた試料液に塩化鉄（Ⅲ）と p-アミノジメチルアニリンを加えて、生成する物質の吸光度を測定して定量した。この分析に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集液の調製には硫酸亜鉛七水和物を用いる。
  - 塩化鉄（Ⅲ）は酸化剤として働く。
  - 生成する物質はメチレンブルーである。
  - 標準原液は硫化ナトリウムから調製する。
  - 標準原液の濃度の標定に中和滴定法を用いる。
  answer: 5
  choice_notes: []
  explanation: '硫化水素の液体捕集法―吸光光度分析法（メチレンブルー法）は、次のとおりです。


    - 捕集液は、**硫酸亜鉛**（七水和物）を含む溶液で、硫化水素を硫化亜鉛として捕集します（選択肢1）。

    - 試料液に、p-アミノジメチルアニリンと塩化鉄(Ⅲ)を加えると、鉄(Ⅲ)イオンが**酸化剤**として働き、**メチレンブルー**が生成して青色になります（選択肢2、3）。670 nm付近で吸光度を測ります。

    - 標準原液は、**硫化ナトリウム**（九水和物）から調製します（選択肢4）。硫化ナトリウムは潮解性が強いので、濃度の標定には、**ヨウ素滴定法**（ヨウ素とチオ硫酸ナトリウムによる酸化還元滴定）を使います。「中和滴定法」とする選択肢5は誤りです。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
