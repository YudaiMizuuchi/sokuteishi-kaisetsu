  stem: ガスクロマトグラフ分析法の検出器に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 水素炎イオン化検出器は、水素炎中で燃焼しイオン化する物質のみを検出する。
  - 電子捕獲型検出器は、電子親和力の強い物質が高感度で検出される。
  - 電子捕獲型検出器の直線性を示す測定範囲は、水素炎イオン化検出器よりも狭い。
  - 炎光光度検出器は、窒素や硫黄を含む化合物に選択性がある。
  - 質量分析計は、分子構造情報を収集できる。
  answer: 4
  choice_notes: []
  explanation: '炎光光度検出器（FPD）は、**硫黄**や**リン**を含む化合物に選択性がある検出器です。「窒素や硫黄を含む化合物に選択性がある」とする選択肢4は誤りです。窒素やリンに選択性があるのは、窒素リン検出器（NPD）です。


    水素炎イオン化検出器（FID）は、水素炎で燃焼してイオン化する有機化合物を検出します。電子捕獲型検出器（ECD）は、電子親和力の強い（ハロゲンなどを含む）物質を高感度で検出しますが、直線範囲はFIDより狭い検出器です。質量分析計は、分子構造の情報が得られます。'
