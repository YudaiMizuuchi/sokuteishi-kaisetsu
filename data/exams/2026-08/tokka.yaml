  stem: ある化合物の水溶液を吸光光度分析法で測定したところ、測定波長における透過率は 80 ％であった。その波長におけるモル吸光係数を 8.26 × 10³cm⁻¹･mol⁻¹･L、セルの光路長を 2.0 cm とすると、この化合物のモル濃度に最も近いものは次のうちどれか。ただし、log₁₀2 = 0.301 とする。
  columns: null
  choices:
  - 1.3 × 10 ⁻⁶ mol･L⁻¹
  - 2.0 × 10 ⁻⁶ mol･L⁻¹
  - 2.9 × 10 ⁻⁶ mol･L⁻¹
  - 5.9 × 10 ⁻⁶ mol･L⁻¹
  - 11.7 × 10 ⁻⁶ mol･L⁻¹
  answer: 4
  choice_notes: []
  explanation: '吸光度 A ＝ −log₁₀（透過率）です。透過率が80％（0.8）のとき、


    A ＝ −log₁₀0.8 ＝ 1 − 3 × log₁₀2 ＝ 1 − 3 × 0.301 ＝ 0.097


    ランベルト・ベールの法則 A ＝ ε・c・l から、


    c ＝ A／（ε・l）＝ 0.097 ／（8.26 × 10³ × 2.0）≒ 5.9 × 10⁻⁶ mol/L


    よって（4）です。


    （参考：『機器分析の実務』）'
