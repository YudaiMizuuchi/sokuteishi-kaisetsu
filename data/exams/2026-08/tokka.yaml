  stem: ガスクロマトグラフ分析法において、キャピラリーカラムを使用する場合に用いる次の試料導入法のうち、高濃度試料の分析に最も適しているものはどれか。
  columns: null
  choices:
  - 加熱脱着法
  - プログラム昇温気化注入法
  - スプリット注入法
  - スプリットレス注入法
  - 直接注入法
  answer: 3
  choice_notes: []
  explanation: 'キャピラリーカラムは試料の許容量が小さいので、高濃度の試料を入れると、カラムが過負荷になります。**スプリット注入法**は、気化した試料の一部だけをカラムに導入し、残りを系外へ捨てる方法なので、高濃度試料に適しています。


    スプリットレス注入法は、試料の全量に近い量をカラムに導入するので、低濃度の試料に向きます。加熱脱着法は、固体捕集管から試料を熱で脱着して導入する方法です。


    同様の出題は、平成28年度第1回、令和2年度第1回、令和6年度第1回の問題にもあり、いずれも「スプリット注入法」が答えとされています。この問題の答えは、出題実績にもとづいて判断しています。'
