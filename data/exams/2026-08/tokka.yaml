  stem: ガスクロマトグラフ分析法で、ある化合物をカラムA を用いて測定したときと、カラム B を用いて測定したときの保持時間が同じであった。カラム A の理論段数が 5000 、カラム B の理論段数が 9000 の場合、カラム B におけるピーク幅（WB）とカラム A におけるピーク幅（WA）の比（WB／WA）の値として、正しい値に最も近いものは次のうちどれか。
  columns: null
  choices:
  - '0.38'
  - '0.56'
  - '0.75'
  - '1.34'
  - '1.80'
  answer: 3
  choice_notes: []
  explanation: 'ピーク幅 W と理論段数 n、保持時間 tR の関係は、n ＝（4tR／W）² です。同じ化合物で、保持時間が同じなら、


    W ＝ 4tR／√n


    となるので、W は √n に反比例します。


    WB／WA ＝ √（nA／nB）＝ √（5000／9000）＝ √0.556 ≒ 0.75


    よって（3）です。


    （参考：『機器分析の実務』）'
