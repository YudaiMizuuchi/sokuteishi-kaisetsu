  - ㋺
  - ㋩
  choices:
  - 臭化水素酸 ／ 塩化ナトリウム ／ 高速液体クロマトグラフ分析法
  - 臭化水素酸 ／ 炭酸ナトリウム ／ 高速液体クロマトグラフ分析法
  - 臭化水素酸 ／ 炭酸ナトリウム ／ ガスクロマトグラフ質量分析法
  - 臭化カリウム溶液 ／ 塩化ナトリウム ／ ガスクロマトグラフ質量分析法
  - 臭化カリウム溶液 ／ 炭酸ナトリウム ／ 高速液体クロマトグラフ分析法
  answer: 3
  choice_notes: []
  explanation: 'エチレンオキシドの固体捕集法―ガスクロマトグラフ質量分析法（GC-MS法）は、次のとおりです。


    - 活性炭に**臭化水素酸**を含浸させて乾燥させた捕集管に、試料空気を通し、エチレンオキシドを誘導体化して2-ブロモエタノールとして捕集します。

    - 2-ブロモエタノールを、トルエン／アセトニトリルで抽出します。**炭酸ナトリウム**を加えて1時間以上放置します。

    - **ガスクロマトグラフ質量分析法**（GC-MS）で分析します（イオン化は電子イオン化法、SIM検出）。


    よって（3）です。高速液体クロマトグラフ分析法は、この方法では使いません。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
