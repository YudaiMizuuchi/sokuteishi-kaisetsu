  - o-フタロジニトリル
  - 塩化ビニル
  - o-トルイジン
  answer: 3
  choice_notes: []
  explanation: 'オルト-フタロジニトリルは、粒子とガスの両方の状態で存在するため、**固体捕集方法とろ過捕集方法**を組み合わせて捕集します（ろ過材で捕集した粒子から揮発する分を、後ろの固体捕集剤で補う方法）。よって（3）です。


    エチルベンゼン、アクリロニトリル、塩化ビニルは、固体捕集方法（または直接捕集方法）、o-トルイジンは、固体捕集方法または液体捕集方法です。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
