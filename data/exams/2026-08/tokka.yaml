  stem: 直接捕集法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集瓶のコックのすり合わせ部には、グリースを使用しない。
  - 捕集袋の内容積は、試料採取から分析までの間の濃度減衰を考慮して、5L 以上とする。
  - 捕集袋は、清浄な乾燥空気又は窒素を用いて洗浄する。
  - 試料空気から水分を取り除く場合には、ガラス管にシリカゲルなどの乾燥剤を詰めて、試料採取口の前に接続する。
  - 電動ポンプを通して、捕集袋内に試料空気を送り採取する場合、ポンプ内の吸着に注意する必要がある。
  answer: 4
  choice_notes: []
  explanation: '試料空気から水分を取り除くときは、ガラス管に、**無水炭酸カリウム粒や無水硫酸カルシウム粒**などの乾燥剤を詰めて、試料採取口の前に接続します。シリカゲルは、極性のある物質を吸着するので、測定対象物質が失われるおそれがあります。選択肢4は誤りです。いずれの乾燥剤も、対象物質に対して吸着や反応がないことを確認して使います。


    真空捕集瓶のコックのすり合わせ部には、グリースを使いません。捕集袋は5 L以上とし、使用前に清浄な空気か窒素で洗浄します。電動ポンプで袋に送るときは、ポンプ内の吸着に注意します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
