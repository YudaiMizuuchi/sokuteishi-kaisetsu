    ただし、アクリロニトリル、酸化プロピレン、ヨウ化メチルの物性等は次の表のとおりとする。


    |  | モル質量（g・mol⁻¹） | 20 ℃における飽和蒸気圧 |

    |---|---|---|

    | アクリロニトリル（A） | 53 | 15 kPa |

    | 酸化プロピレン（B） | 58 | 59 kPa |

