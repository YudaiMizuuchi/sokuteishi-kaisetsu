  stem: '液体捕集法を用いて環境空気試料を捕集する際の、必要最小吸引空気量 Q（L）を求める次の式中のA、B、Cが表すものの組合せとして、正しいものは下のうちどれか。


    ただし、単位は次のとおりとする。


    吸引流量（L・min⁻¹）


    捕集時間（min）


    捕集液の量（mL）


    最終試料液の総量（mL）


    検出下限濃度（μg・mL⁻¹）


    定量下限濃度（μg・mL⁻¹）


    管理濃度（mg・m<sup>-3</sup>）


    抑制濃度（mg・m<sup>-3</sup>）


    Q=(A× B)/(0.1× C)'
  columns:
  - Ⓐ
  - Ⓑ
  - Ⓒ
  choices:
  - 定量下限濃度 ／ 最終試料液の総量 ／ 管理濃度
  - 定量下限濃度 ／ 最終試料液の総量 ／ 抑制濃度
  - 検出下限濃度 ／ 最終試料液の総量 ／ 管理濃度
  - 吸引流量 ／ 捕集時間 ／ 管理濃度
  - 吸引流量 ／ 捕集液の量 ／ 抑制濃度
  answer: 1
  choice_notes: []
  explanation: '液体捕集法で、測定に必要な最小の吸引空気量 Q（L）は、次の式で求めます。


    Q ＝（定量下限濃度 × 最終試料液の総量）／（0.1 × 管理濃度）


    - A：定量下限濃度（µg/mL）

    - B：最終試料液の総量（mL）

    - C：管理濃度（mg/m³）


    分母の 0.1 × 管理濃度は、管理濃度の1/10の濃度です。管理濃度の1/10まで測れるように、定量下限から必要な空気量を求めます。単位は（µg/mL × mL）／（mg/m³）＝ µg／（mg/m³）＝ 10⁻³ m³ ＝ L になります。よって（1）です。'
