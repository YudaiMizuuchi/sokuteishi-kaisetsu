  explanation: 'ヨウ化メチルについて、ヒトに甲状腺がんを生じるという知見は確立されていません。選択肢5は誤りです。


    ほかの組合せは、職業がんの代表例です。カドミウム化合物とニッケル化合物は肺がん（ニッケルは鼻腔・副鼻腔のがんも）、無機ヒ素化合物は肺がん・皮膚がん・膀胱がん、オーラミンは膀胱がんです。職業がんは、物質とがんの部位を対応表で一度に覚えるのが効率的です。'
