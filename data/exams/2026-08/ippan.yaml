  stem: 化学物質等の性質及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中に浮遊する粉じんは、粒径が同じであれば密度が小さくなるほど、沈降速度は遅くなる。
  - 一定量の気体の体積は、圧力に反比例し、絶対温度に比例する。
  - クロロホルムの蒸気密度はキシレンの蒸気密度より大きく、また、25℃における蒸気圧はキシレンの蒸気圧より大きい。
  - テトラヒドロフランの極性は、テトラクロロエチレンの極性より大きい。
  - クレゾールは、水に溶けるとアルカリ性を示す。
  answer: 5
  choice_notes:
  - 正しい。粒径が同じなら、密度が小さいほど沈降速度は遅い。
  - 正しい。ボイル・シャルルの法則。
  - 正しい。クロロホルムは分子量が大きく蒸気は重く、沸点が低いので蒸気圧は高い。
  - 正しい。テトラヒドロフランは極性があり、テトラクロロエチレンはほぼ無極性。
  - 誤り。クレゾールの水溶液は弱い酸性。
  explanation: 'クレゾールは、ベンゼン環にヒドロキシ基（-OH）とメチル基が付いたフェノール類です。フェノール類の水溶液は弱い**酸性**を示すので、選択肢5は誤りです。


    -OH が付いていても、アルコールのように中性になるのではなく、ベンゼン環に直接付いた -OH は水素イオンをわずかに放出します。フェノール類は酸性、アニリンのようなアミン類はアルカリ性、と官能基で整理しておきましょう。'
  figures: []
  law_note: null
  _key_choice: クレゾールは、水に溶けるとアルカリ性を示す。
