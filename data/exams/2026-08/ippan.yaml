  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」で定める絵表示に関する次の記述において、㋑から㋩の［　］に入る絵表示の組合せとして、正しいものは下のうちどれか。ただし、絵表示の枠は赤色とする。「複数の危険有害性を有する化学品の場合、複数の絵表示を付すことが原則であるが、「健康に対する有害性」の絵表示には優先順位がある。例えば、急性毒性（区分1～区分3）に関する［㋑］の絵表示を付した場合、他に特定標的臓器毒性（反復ばく露）があれば［㋺］の絵表示は付すが、急性毒性（区分4）のほか皮膚刺激性や眼刺激性などを表す［㋩］の絵表示は、急性毒性（区分4）、皮膚刺激性、眼刺激性などがあっても付さない。」
  choices:
  - 図の1
  - 図の2
  - 図の3
  - 図の4
  - 図の5
  answer: 4
  choice_notes: []
  explanation: 'GHS の健康有害性の絵表示には優先順位があり、より重い絵表示を付けたときは、軽い区分を表す絵表示を省きます。


    ㋑ 急性毒性（区分1〜3）は「どくろ」、㋺ 特定標的臓器毒性（反復ばく露）は「健康有害性（人の上半身）」、㋩ 急性毒性（区分4）や皮膚刺激性・眼刺激性は「感嘆符」です。どくろを付けたときは感嘆符を付けませんが、健康有害性の絵表示は表す内容が違うので併せて付けます。よって、正しい組合せは（4）です。


    腐食性（試験管から液が垂れる絵）は、皮膚腐食性や眼に対する重篤な損傷を表す絵表示で、刺激性の感嘆符とは別物です。選択肢に混ぜてあるので取り違えに注意しましょう。'
  figures:
  - file: 2026-08-ippan-02-fig.png
    alt: 選択肢1〜5それぞれに、左から㋑・㋺・㋩の順で3つのGHS絵表示（ひし形）が並ぶ。1＝㋑健康有害性、㋺どくろ、㋩腐食性　2＝㋑健康有害性、㋺腐食性、㋩どくろ　3＝㋑どくろ、㋺腐食性、㋩感嘆符　4＝㋑どくろ、㋺健康有害性、㋩感嘆符　5＝㋑どくろ、㋺健康有害性、㋩腐食性
  law_note: null
  _key_choice: ㋑どくろ ㋺健康有害性（人体の胸部に星型の図） ㋩感嘆符
  columns: null
