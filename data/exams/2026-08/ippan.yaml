  stem: 化学物質等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アクリロニトリルは、皮膚に触れると水疱を生じ、蒸気を吸入すると頭痛、めまい、ふるえなどの中枢神経症状を生じる。
  - トリレンジイソシアネート（TDI）は、眼やのどの刺激、炎症などの症状を起こし、低濃度ばく露が続くとぜんそく様発作を呈するようになる。
  - フェノールは、蛋白変成作用を有し、皮膚に付着すると深部に浸透し、疼痛や灼熱感を生じるが、やがて知覚神経末端の局所麻酔作用により無感覚になることがある。
  - フッ化水素による慢性中毒では、骨の硬化や斑状歯がみられるほか、がんを生じることがある。
  - 濃硫酸は、皮膚に付着すると激しい痛みを生じ、また、脱水及び炭化作用があるため、受傷面は黒褐色となる。
  answer: 4
  choice_notes: []
  explanation: 'フッ化水素の慢性中毒では、骨の硬化（骨フッ素症）や斑状歯がみられますが、がんを生じることは知られていません。選択肢4は誤りです。


    フッ化水素で押さえる症状は、急性では皮膚に付くと深部まで浸透して激しい痛みと組織の壊死を起こすこと、慢性ではフッ素が骨や歯に沈着することです。「骨と歯」がキーワードで、発がん性の物質の一覧には入っていません。'
  figures: []
  law_note: null
  _key_choice: フッ化水素による慢性中毒では、骨の硬化や斑状歯がみられるほか、がんを生じることがある。
  text_note: 選択肢3の「蛋白変成作用」は、一般には「蛋白変性」と表記されますが、原本の印字のとおり掲載しています。
