    点音源からの距離が2倍になると約 6 dB 下がる（逆二乗則）、0 dB は 20 µPa でそれより小さい音はマイナスになる、騒音性難聴は内耳の障害による感音性難聴で 4,000 Hz 付近から聞こえにくくなる、という点も頻出です。'
