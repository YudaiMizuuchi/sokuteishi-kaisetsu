  - ヒトが聴くことができる最も小さな音圧とされる20 μPaを音圧レベルで表すと0dBとなり、これより小さい音圧の音圧レベルはマイナスの値となる。
  - 騒音の作業環境測定において、A 測定及び B 測定を行った結果、第Ⅰ管理区分となるのは、A 測定平均値及び B 測定値がいずれも 85 dB未満の場合のみである。
  - 難聴には、感音性難聴と伝音性難聴があるが、騒音性難聴は、内耳の障害によって起こる感音性難聴である。
