  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - N,N-ジメチルホルムアミドは、体内で代謝されて、尿中に N-メチルホルムアミドとして排泄される。
  - 1,2-ジクロロエタンの生物学的モニタリング指標となる物質は、尿中のトリクロロ酢酸又は総三塩化物である。
  - o-トルイジンや3,3'-ジクロロ-4,4'-ジアミノジフェニルメタン（MOCA）は、皮膚刺激性はないが、皮膚から体内に吸収される物質であり、発がん性がある。
  - インジウム及びその化合物の生物学的モニタリング指標として、血清インジウムの量がある。
  - 鉛が体内に取り込まれ骨に蓄積された場合は、排泄される速度は極めて遅く、生物学的半減期は10年に及ぶ。
  answer: 2
  choice_notes:
  - 正しい。N,N-ジメチルホルムアミドの尿中代謝物は N-メチルホルムアミド。
  - 誤り。トリクロロ酢酸・総三塩化物はトリクロロエチレンなどの指標。
  - 正しい。o-トルイジンや MOCA は皮膚から吸収され、発がん性がある。
  - 正しい。インジウムの指標は血清インジウム。
  - 正しい。骨に蓄積した鉛は排泄が非常に遅い。
  explanation: '尿中のトリクロロ酢酸や総三塩化物は、トリクロロエチレン、テトラクロロエチレン、1,1,1-トリクロロエタンといった、塩素を3つもつ構造の有機溶剤の代謝物です。1,2-ジクロロエタンの生物学的モニタリングの指標ではないので、選択肢4は誤りです。


    「三塩化物」という名前のとおり、代謝されて塩素3つの化合物になる物質の指標です。塩素が2つの 1,2-ジクロロエタンとは結びつかない、と名前から判断できます。'
  figures: []
  law_note: null
  _key_choice: 1,2-ジクロロエタンの生物学的モニタリング指標となる物質は、尿中のトリクロロ酢酸又は総三塩化物である。
