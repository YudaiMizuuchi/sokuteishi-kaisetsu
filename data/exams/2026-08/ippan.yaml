    振動障害は、末梢循環障害（レイノー現象など）、末梢神経障害（しびれ、感覚の鈍り）、運動器障害の3つに分けて整理します。寒冷で発作が起こりやすく、喫煙が血管を収縮させて悪化要因になることも、あわせて押さえておきましょう。'
