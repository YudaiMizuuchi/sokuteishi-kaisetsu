  stem: 作業環境評価基準に定める「評価値」及び「管理濃度」並びにリスクアセスメント対象物について厚生労働大臣が定める「濃度基準値」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 第1評価値とは、単位作業場所において考え得るすべての測定点の作業時間における気中有害物質の濃度のうち、高濃度側から5％に相当する濃度の推定値であり、A 測定又は C 測定の測定結果から算出する。
  - 混合有機溶剤の管理濃度は、混合有機溶剤に含まれる各有機溶剤の管理濃度に、それぞれの含有率を乗じて得た値の総和とすることとされている。
  - 8時間濃度基準値は、長期間ばく露により健康障害が生じることが知られている物質について定められている。
  - 短時間濃度基準値には、15分間時間加重平均値と、いかなる短時間ばく露においても超えてはならない天井値がある。
  - ヒトに対する発がん性が明確な物質については、濃度基準値は定められていない。
  answer: 2
  choice_notes:
  - 正しい。第1評価値は、高濃度側から5％に相当する濃度の推定値。
  - 誤り。混合有機溶剤は換算値 C（Σ測定値／管理濃度）で評価する。
  - 正しい。8時間濃度基準値は、長期間のばく露で健康障害が生じる物質に定められる。
  - 正しい。短時間濃度基準値には、15分間時間加重平均値と天井値がある。
  - 正しい。発がん性が明確な物質には、濃度基準値は定められていない。
  explanation: '混合有機溶剤の評価では、管理濃度を合成するのではなく、測定点ごとに各成分の「測定値 ÷ 管理濃度」を足し合わせた換算値 C を求め、管理濃度を 1 とみなして評価します。「各有機溶剤の管理濃度に含有率を掛けた値の総和」とする選択肢2は誤りです。


    換算値 C ＝ C₁/E₁ ＋ C₂/E₂ ＋ … は、各成分が管理濃度に対してどれだけの割合を占めるかを合計したものです。同じ式は法令でも出題されるので、式の形で覚えておきましょう。'
