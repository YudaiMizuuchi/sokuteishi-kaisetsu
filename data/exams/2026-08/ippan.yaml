  stem: 化学物質Ⓐとそれによってヒトに生じる主要ながんⒷとの次の組合せのうち、誤っているものはどれか。
  choices:
  - カドミウム化合物 ／ 肺がん
  - ニッケル化合物 ／ 肺がん
  - 無機ヒ素化合物 ／ 膀胱がん
  - オーラミン ／ 膀胱がん
