  explanation: '型式検定合格標章の「国（''26）検」の数字は、型式検定に合格した年（西暦の下2桁）を表すもので、その呼吸用保護具の使用期限ではありません。選択肢1は誤りです。


    標章の3段目は種類と性能を表します。「DR」は取替え式防じんマスク、「直」は直結式（ろ過材が面体に直接付いたもの）を表し、「RS3」は取替え式（R）で固体粒子（S）用、粒子捕集効率の区分が最も高い3（99.9％以上）であることを表します。S はオイルミストを含まない固体粒子用なので、オイルミストのある場所では L（液体粒子用）の区分のものを使います。'
