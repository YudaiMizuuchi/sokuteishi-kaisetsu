  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」及び「化学物質による健康障害防止のための濃度の基準の適用等に関する技術上の指針」に定めるリスクの見積りに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度が定められている物質については、作業環境測定による幾何平均値を当該物質の管理濃度と比較する方法がある。
  - 濃度基準値が定められている物質については、個人ばく露測定による濃度を当該物質の濃度基準値と比較する方法があるが、呼吸用保護具を使用している場合には、呼吸用保護具の内側の濃度を算定し濃度基準値と比較する。
  - 管理濃度又は濃度基準値が定められていない物質については、気中濃度等を日本産業衛生学会の許容濃度やACGIH（米国産業衛生専門家会議）のTLV-TWAなど当該物質のばく露限界と比較してリスクを見積もる方法がある。
  - CREATE-SIMPLE や ECETOC TRA などを用いて、対象の業務に係る作業条件やリスクアセスメント対象物に関する情報を入力することにより、リスクを見積もる方法がある。
  - リスクアセスメント対象物への労働者のばく露の程度及び当該物質による有害性の程度を相対的に尺度化し、それらを縦軸と横軸とし、あらかじめばく露の程度及び有害性の程度に応じてリスクが割り付けられた表を使用してリスクを見積もる方法がある。
  answer: 1
  choice_notes:
  - 誤り。管理濃度と比べるのは、作業環境測定の第一評価値。
  - 正しい。呼吸用保護具を使っている場合は、保護具の内側の濃度を算定して比べる。
  - 正しい。許容濃度や TLV-TWA などのばく露限界と比べる方法がある。
  - 正しい。CREATE-SIMPLE などの数理モデルで見積もる方法がある。
  - 正しい。ばく露と有害性の程度を尺度化したマトリクスで見積もる方法がある。
  explanation: 'リスクアセスメント指針では、管理濃度が定められている物質について、作業環境測定で求めた**第一評価値**を管理濃度と比べる方法が示されています。幾何平均値を管理濃度と比べる方法ではないので、選択肢1は誤りです。


    指針で示されている「ばく露の程度を数値で比べる」方法は、比べる相手によって使う測定値が決まっています。管理濃度には作業環境測定の第一評価値、濃度基準値には個人ばく露測定の結果、それ以外のばく露限界には気中濃度など、という組合せで整理しておきましょう。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(1)イ(ア)（「管理濃度が定められている物質については、作業環境測定により測定した当該物質の第一評価値を当該物質の管理濃度と比較する方法」）。'
  figures: []
  law_note: null
  _key_choice: 管理濃度が定められている物質については、作業環境測定による幾何平均値を当該物質の管理濃度と比較する方法がある。
