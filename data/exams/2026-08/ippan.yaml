  stem: 化学物質による健康影響及びその管理指標等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 実質安全量（VSD）は、しきい値がないとされる発がん物質のリスク評価に用いられる指標であり、当該物質へのばく露によるがんのリスクの増加が、ある限られた確率以下にとどまると考えられる量である。
  - 半数致死量（LD₅₀）は、急性毒性を評価する指標で、試験動物の致死量の1／2に相当する投与量である。
  - 最小影響量（LOEL）及び無影響量（NOEL）は、いずれも慢性毒性を評価する指標である。
  - 生殖毒性とは、性機能及び生殖能に対する悪影響並びに子の発生に対する悪影響をいう。
  - 変異原性試験は、化学物質が細胞内の遺伝子に突然変異を引き起こすかどうかを調べる発がん性のスクリーニングのための試験で、細菌を用いたものが広く利用されている。
  answer: 2
  choice_notes: []
  explanation: '半数致死量（LD₅₀）は、試験動物の**半数（50％）が死亡する**と推定される投与量です。「致死量の1/2の量」ではありません。選択肢2は誤りです。


    LD₅₀ は値が小さいほど少ない量で死亡するので、急性毒性が強いことを表します。「半数」が指しているのは量ではなく、死亡する動物の割合だ、と押さえておきましょう。'
  figures: []
  law_note: null
  _key_choice: 半数致死量（LD₅₀）は、急性毒性を評価する指標で、試験動物の致死量の1/2に相当する投与量である。
