  stem: 粉じん及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんは、その粒径により、10 μm以下の吸入性粉じん、10 μm～100 μm程度の咽頭通過性粉じん、100 μmを超える吸引性粉じんに分けられる。
  - ヒュームの一次粒子の粒径は、一般に、1 μm以下である。
  - 溶接ヒュームは、溶接によって生じた固体の蒸気が空気中で凝固した粒子で、じん肺の原因になるほか、発がん性が指摘されている。
  - じん肺の合併症として、肺結核、気管支炎、肺がんなどを生じることがある。
  - 石綿のうち、青石綿（クロシドライト）や茶石綿（アモサイト）は、白石綿（クリソタイル）に比較して有害性が高い。
  answer: 1
  choice_notes:
  - 誤り。吸入性粉じんはおおむね 4 µm 付近以下、吸引性粉じんはおおむね 100 µm 以下。
  - 正しい。ヒュームの一次粒子は、一般に 1 µm 以下。
  - 正しい。溶接ヒュームはじん肺の原因になり、発がん性も指摘されている。
  - 正しい。じん肺の合併症には、肺結核、続発性気管支炎、肺がんなどがある。
  - 正しい。角閃石系の青石綿・茶石綿は、白石綿より有害性が高い。
  explanation: '粉じんの粒径の区分は、体のどこまで入るかで分けられています。肺の奥（肺胞）まで達する**吸入性粉じん**は、おおむね 4 µm 付近より小さい粒子、鼻や口から吸い込まれる**吸引性粉じん**は、おおむね 100 µm 以下の粒子です。選択肢1は、10 µm を境に吸入性粉じんとし、100 µm を超えるものを吸引性粉じんとしているので誤りです。


    「吸引性」は吸い込める粒子全体、「吸入性」はそのうち肺胞まで届く細かい粒子、と言葉の違いで区別すると覚えやすくなります。'
  figures: []
  law_note: null
  _key_choice: 粉じんは、その粒径により、10 µm以下の吸入性粉じん、10 µm～100 µm程度の咽頭通過性粉じん、100 µmを超える吸引性粉じんに分けられる。
