  stem: 金属及びその化合物による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金属クロムは、接触皮膚炎や気道への刺激症状を生じるが、クロム酸や重クロム酸と異なり、発がん性はないとされている。
  - コバルト及びその無機化合物は、気管支ぜんそく、アレルギー性皮膚炎等の疾患を引き起こす。
  - 水銀は、金属水銀、無機水銀、有機水銀に大別されるが、いずれも経口的に人体に取り込まれた場合は、消化管から吸収され、精神障害や聴覚障害、腎機能障害を起こす。
  - バナジウム中毒では、粘膜刺激症状、呼吸器症状や舌の緑着色が特徴的で、その他、心悸亢進、手指のふるえ等が見られる。
  - 金属熱は、主として亜鉛や銅のヒュームを吸入して発症する疾病で、吸入から数時間後に悪寒や発熱、関節痛などの症状がみられるが、発症の数時間から数日後には発汗とともに解熱し、多少の疲労感を残し回復する。
  answer: 3
  choice_notes: []
  explanation: '金属水銀は、口から入っても消化管からはほとんど吸収されません。金属水銀で問題になるのは、蒸気を**吸い込んだ**場合です。「いずれも消化管から吸収される」とする選択肢3は誤りです。


