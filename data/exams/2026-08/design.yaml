  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の発生源の位置や環境への発散の状況から、一定の場所が他の場所に比べて、常に、濃度が高かったり、低かったりすることが予測されるときは、それらの場所は別の単位作業場所とする。
  - 測定対象物質を取り扱う作業者の行動範囲が当該工場内全体であるが、測定対象物質の分布が発生源周辺に限定されると考えられる場合には、発生源周辺の区域を単位作業場所としてよい。
  - A 測定で、単位作業場所の測定点の数が多いため、1作業日中にサンプリングを終了できない場合には、測定点の数が1日におけるサンプリング可能な数より多くならないよう、単位作業場所の範囲をさらにいくつかの単位作業場所に区分けする。
  - C 測定の単位作業場所の設定に当たっては、測定対象物質へのばく露の程度が異なると見込まれる作業を選定し、それらの作業に従事する労働者の行動範囲を単位作業場所とする。
  - A 測定における単位作業場所よりも、C 測定における単位作業場所の方が、広範囲となる場合がある。
  answer: 4
  choice_notes:
  - 正しい。濃度の傾向が明らかに違う場所は、別の単位作業場所にする。
  - 正しい。有害物質が発生源周辺にしか分布しないなら、その区域を単位作業場所としてよい。
  - 正しい。1日で測り切れない場合は、単位作業場所を分ける。
  - 誤り。ばく露の程度が均等と見込まれる作業ごとに設定する。
  - 正しい。C 測定は労働者の行動範囲で決めるので、A 測定より広くなることがある。
  explanation: 'C 測定の単位作業場所は、ばく露の程度が**同じ**と見込まれる作業（均等ばく露作業）ごとに決め、その作業に従事する労働者の行動範囲を単位作業場所とします。選択肢4は「ばく露の程度が異なると見込まれる作業」としているので誤りです。


    個人サンプリング法は「同じようなばく露を受けている労働者の集団」からサンプラーを着ける人を選び、その集団のばく露を評価する方法です。ばく露の程度が違う作業を一つにまとめてしまうと、評価の対象がぼやけてしまいます。A 測定で「濃度がほぼ同じ区域」を単位作業場所にするのと、考え方は同じです。'
  figures: []
  law_note: null
  _key_choice: C測定の単位作業場所の設定に当たっては、測定対象物質へのばく露の程度が異なると見込まれる作業を選定し、それらの作業に従事する労働者の行動範囲を単位作業場所とする。
