  stem: 作業環境測定における有害物質の空気中の濃度、管理濃度に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中の有害物質の濃度 100 ppmは、0.01 ％ に相当する。
  - 有機溶剤の管理濃度は、全て体積分率で表されている。
  - 特定化学物質の中には、管理濃度が定められていないものがある。
  - リフラクトリーセラミックファイバーの濃度を求める場合、長さ5 µm未満の繊維を計数する。
  - 石綿の管理濃度は、本／cm³で表されている。
  answer: 4
  choice_notes:
  - 正しい。1％＝10,000 ppm なので、100 ppm は 0.01％。
