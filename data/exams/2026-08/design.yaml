  stem: 有害物質の物性に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化ビニルは、常温、常圧で気体である。
  - 1,4-ジオキサンは、水に任意の割合で溶解する。
  - ナフタレンは、常温、常圧で固体であるが、昇華性があり、1気圧下で常温から温度を上げていっても、液体となることはない。
  - 二硫化炭素は、水より密度が大きい。
  - 玉ずいやメノウは、石英の微細結晶が集まったものであり、その粉じんは遊離けい酸含有率の測定対象である。
  answer: 3
  choice_notes:
  - 正しい。塩化ビニルは沸点が約 −13℃で、常温では気体。
  - 正しい。1,4-ジオキサンは水と任意の割合で混ざる。
  - 誤り。ナフタレンは約 80℃で融けて液体になる。
  - 正しい。二硫化炭素の密度は約 1.26 g/cm³ で、水より大きい。
  - 正しい。玉ずいやメノウは石英の微細な結晶の集まりで、遊離けい酸の測定対象になる。
  explanation: 'ナフタレンは融点が約 80℃なので、1気圧のもとで温度を上げていくと、80℃付近で融けて液体になります。常温でも昇華するので防虫剤のにおいがしますが、「加熱しても液体にならない」わけではありません。選択肢3は誤りです。


    1気圧で液体を経ずに固体から気体になるのは、ドライアイス（二酸化炭素）のように、固体・液体・気体が共存する点（三重点）の圧力が1気圧より高い物質です。ナフタレンの三重点の圧力は1気圧よりずっと低いので、1気圧では普通に融けます。'
  figures: []
  law_note: null
  _key_choice: ナフタレンは、常温、常圧で固体であるが、昇華性があり、1気圧下で常温から温度を上げていっても、液体となることはない。
