  stem: 次の有害物質のうち、25℃において飽和蒸気圧が最も高いものはどれか。
  choices:
  - アクリルアミド
  - アセトン
  - クロロホルム
  - テトラヒドロフラン
  - ホルムアルデヒド
  answer: 5
  choice_notes: []
  explanation: 'ホルムアルデヒドは沸点が約 −19℃で、常温では気体（ガス）です。25℃での飽和蒸気圧は1気圧を大きく超えるので、5つの中で最も高くなります。


    残りの4つは常温で液体または固体です。アセトン（沸点約 56℃）、クロロホルム（約 61℃）、テトラヒドロフラン（約 66℃）はいずれも揮発しやすい液体ですが、沸点が 25℃より高いので、飽和蒸気圧は1気圧に届きません。アクリルアミドは常温で固体で、蒸気圧はごくわずかです。


    飽和蒸気圧の大小は、まず「常温でガスか、液体か、固体か」で大きく分け、液体どうしは沸点が低いほど蒸気圧が高い、と考えると判断できます。'
  figures: []
  law_note: null
  _key_choice: ホルムアルデヒド
