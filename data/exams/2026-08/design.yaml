  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定は、A 測定を補完するための測定であり、有害物質の発生源に近接する場所において作業が行われない場合は、B 測定を実施しなくてもよい。
  - 測定点の高さは、A 測定同様、作業中の労働者の呼吸域における有害物質の濃度を把握することを考慮し、床上 50 cm以上 150 cm以下とする。
  - 分粒装置を使用して捕集することとされている特定化学物質は、B 測定においても分粒装置を使用して捕集する。
  - 検知管5本を用いても測定時間の合計が 10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値のうち、最大値をB 測定値とする。
  - B 測定を行う必要がある単位作業場所で、連続する2作業日にわたって測定を行う場合は、第1日目と第2日目ともに B 測定を行い、最大値を B測定値とする。
  answer: 4
  choice_notes:
  - 正しい。A 測定を補うための測定なので、発生源の近くで作業がなければ不要。
  - 正しい。呼吸域を想定し、A 測定と同じく床上 50〜150 cm。
  - 正しい。分粒装置を使う物質は、B 測定でも同じ方法で捕集する。
  - 誤り。10 分間に均等な間隔で測った5本の算術平均値を B 測定値とする。
  - 正しい。2日間測定では、それぞれの B 測定値のうち大きい方を採る。
  explanation: '検知管で B 測定を行うときは、1本の測定時間が短いので、10 分間に均等な間隔で5本以上を測り、その**算術平均値**を B 測定値とします。選択肢4は「最大値」としているので誤りです。


    B 測定は「発生源の近くで作業する人が、濃度が最も高くなる時間帯に吸う空気」を、A 測定と同じく **10 分間の値**として捉える測定です。短時間の測定を積み上げるのは 10 分間値を再現するためなので、まとめ方は平均になります。最大値を採るのは、測定位置が複数ある場合や、2日間測定した場合のように「どこ（いつ）が一番高いか」を選ぶ場面です。この2つを混同させるのが、この問題のねらいです。'
  figures: []
  law_note: null
  _key_choice: 検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値のうち、最大値をB測定値とする。
