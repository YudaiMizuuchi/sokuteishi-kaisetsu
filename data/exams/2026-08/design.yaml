  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - グラスファイバーフィルターは、メンブランフィルターに比べて、粉じんの堆積による通気抵抗の増加が大きい。
  - ポアサイズの異なるメンブランフィルターを同じ吸引速度でサンプリングした場合、ポアサイズが小さいほど圧力損失は大きい。
  - ろ過材によっては、素材の中に金属が含まれていることがあるので、金属類をろ過捕集する場合には、測定対象である金属が含まれる量が少ないろ過材を用いる。
  - 鉱物性粉じんの捕集には、遊離けい酸の分析に用いるサンプルを捕集する場合も含めて、分粒装置付きホルダーを用いる。
  - 石綿の捕集には、セルロースエステルメンブランフィルターを用い、ホルダーは、オープンフェース型のものを用いる。
  answer: 1
  choice_notes:
  - 誤り。粉じんの堆積で通気抵抗が大きく増えるのは、メンブランフィルターの方。
  - 正しい。孔が小さいほど空気が通りにくく、圧力損失は大きい。
  - 正しい。ろ過材に含まれる金属が分析値に上乗せされるのを避ける。
  - 正しい。鉱物性粉じんの測定は吸入性粉じんが対象なので、分粒装置付きで捕集する。
  - 正しい。石綿は表面の繊維を顕微鏡で数えるため、メンブランフィルターとオープンフェース型ホルダーを使う。
  explanation: 'グラスファイバーフィルターは、繊維の層の内部で粒子を捕らえる「深層ろ過」なので、粉じんがたまっても通気抵抗はあまり増えません。一方、メンブランフィルターは表面の細かい孔で粒子を捕らえる「表面ろ過」なので、表面に粉じんがたまると孔がふさがり、通気抵抗が大きく増えます。選択肢1は、この関係が逆になっているので誤りです。


    鉱物性粉じんのように捕集量が多くなる測定にグラスファイバーフィルターが使われ、石綿のように顕微鏡で表面の繊維を数える測定にメンブランフィルターが使われるのも、この性質の違いによります。'
