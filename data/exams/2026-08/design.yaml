  explanation: 'リフラクトリーセラミックファイバー（RCF）の濃度は、石綿と同じく繊維の本数で表し、**長さ 5 µm 以上**（幅 3 µm 未満、長さと幅の比が3以上）の繊維を数えます。選択肢4は「5 µm 未満」としているので誤りです。


