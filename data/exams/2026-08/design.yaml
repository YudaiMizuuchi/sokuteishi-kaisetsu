  explanation: '個人サンプリング法による測定（C・D 測定）は、有機溶剤、鉛、粉じん、特定化学物質の多くが対象ですが、特定化学物質のうち一部の物質は対象から除かれています。コールタールはその一つなので、答えは（2）です。


    C・D 測定の対象は、制度の導入以降に段階的に広げられてきたため、出題のたびに「対象になっていないもの」を問われやすい分野です。対象外の物質は数が限られているので、個別に覚えておくのが確実です。'
