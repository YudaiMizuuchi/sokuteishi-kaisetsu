  stem: '作業環境評価に関する次の記述の㋑から㋥の［　］に入る数値又は語句の組合せとして、正しいものは下のうちどれか。


    「作業環境測定においては、有害物質の濃度の日間変動も考慮する必要があるため、2日間測定が望ましいが、1日測定においては、濃度の日間変動に相当する値として定められた値を用いて評価を行う。1日測定の幾何標準偏差を σ₁、日間変動を表わす幾何標準偏差を σ<sub>D</sub> とすると、1日測定で日間変動を考慮した場合の幾何標準偏差 σ は、log σ ＝ √(log²σ₁ ＋ log²σ<sub>D</sub>) で表される。ここで、σ<sub>D</sub> としては、経験的に得られた日間変動の上側 90 ％ の推定値である［㋑］を用いることとされており、log²［㋑］＝ 0.084 なので、log σ ＝ √(log²σ₁ ＋ 0.084) となる。


    一方、気中有害物質の濃度の 95 ％上限値の推定値である第1評価値 E<sub>A1</sub> は、1日測定の場合、幾何平均 M と幾何標準偏差 σ から、log E<sub>A1</sub> ＝ log M ＋［㋺］log σ と表され、この式から第1評価値 E<sub>A1</sub> を求め、また、別途、気中有害物質の［㋩］平均濃度の推定値である第2評価値 E<sub>A2</sub> を求める。


    ある有害物質を使用している単位作業場所で1日測定の作業環境測定を行ったところ、測定結果及び上記による評価値の計算結果は下表のとおりであったので、この単位作業場所の管理区分は、第［㋥］管理区分となる。」


    （単位：ppm）


    <table>

    <thead><tr><th colspan="5">A測定の測定値</th><th>B測定値</th><th>第1評価値</th><th>第2評価値</th><th>管理濃度</th></tr></thead>

    <tbody><tr><td>5.0</td><td>11.2</td><td>6.6</td><td>9.3</td><td>4.3</td><td>13.5</td><td>24.6</td><td>9.2</td><td>10</td></tr></tbody>

    </table>'
  choices:
  - 1.645 ／ 1.95 ／ 算術 ／ 2
  - 1.645 ／ 1.95 ／ 幾何 ／ 3
  - 1.95 ／ 1.645 ／ 算術 ／ 2
  - 1.95 ／ 1.645 ／ 幾何 ／ 2
  - 1.95 ／ 1.645 ／ 幾何 ／ 3
  answer: 3
  choice_notes: []
  explanation: '1日測定の評価で使う数値と、管理区分の決め方を順に確認します。


    日間変動の幾何標準偏差 σ<sub>D</sub> には **1.95** を使います（log 1.95 ≒ 0.290 なので、log²1.95 ≒ 0.084）。第1評価値は「95％上限値」の推定値なので、正規分布の上側5％点である **1.645** を掛けて、log E<sub>A1</sub> ＝ log M ＋ 1.645 log σ となります。第2評価値は**算術**平均濃度の推定値です。


    表の値で管理区分を判断すると、第1評価値 24.6 ppm は管理濃度 10 ppm を超えていますが、第2評価値 9.2 ppm は管理濃度以下です。さらに B 測定値 13.5 ppm は管理濃度の 1.5 倍（15 ppm）以下なので、管理区分は**第2管理区分**になります。


    よって、㋑ 1.95、㋺ 1.645、㋩ 算術、㋥ 2 の組合せ（3）が正しいものです。1.95 と 1.645 の入れ替えは繰り返し出題されているので、「日間変動は 1.95、上側5％は 1.645」とセットで覚えておきましょう。'
