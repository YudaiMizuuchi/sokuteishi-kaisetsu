  stem: 次の図のイからホの区域を単位作業場所とし、●を A 測定の測定点とした。A 測定の測定点の設定方法として、誤っているもののみの組合せは下のうちどれか。ただし、斜線箇所は生産設備であって、労働者の呼吸域とならず、点線の間隔は全て6 m 以下とする。
  choices:
  - イ、ロ
  - イ、ハ
  - ロ、ニ
  - ハ、ホ
  - ニ、ホ
  answer: 3
  choice_notes: []
  explanation: 'A 測定の測定点は、単位作業場所の床面に、6 m 以下の**等間隔**で縦の線と横の線を引き、その**交点**に置きます。この2つの条件に照らして、各図を確認します。


    ロは、縦の線は等間隔ですが、横の線の間隔が上と下で違っています。縦方向と横方向で間隔が違うのは構いませんが、それぞれの方向の中では等間隔でなければならないので、誤りです。


    ニは、設備（斜線部）に重なった交点を除く代わりに、線の上の別の位置に測定点を移しています。設備などで測定できない交点は**除くだけ**で、近くに移して補うことはしないので、誤りです。


    イは、設備に重なる交点を除いているだけなので正しい設定です。ハは、交点が5未満になる狭い単位作業場所で、4つの交点に対角線の交点を加えて5点にしたもので、認められている方法です。ニとホのように、建屋の形に合わせて線が直交していなくても構いません。


    よって、誤っているのはロとニの組合せ（3）です。'
  figures:
  - file: 2026-08-design-03-1.png
    alt: 問3の図
  law_note: null
  _key_choice: （図問題）A測定の測定点の設定として誤っているものの組合せ
  review_note: ロが誤りである理由を「横の線の間隔が上下で違う」と図から読み取って説明しています。出題の意図と合っているか確認中です。
