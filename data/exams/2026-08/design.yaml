  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石けん膜流量計は、所定の区間を石けん膜が移動する時間と、石けん膜をつくる石けん液の密度との関係から、流量を求めるものである。
  - 面積式流量計では、吸引試料空気の温度が標準状態よりも高くなるに従って、流量計の指示値は真の流量より大きくなる。
  - ハイボリウムエアサンプラーの校正には、ルーツメーターによって校正された絞り式流量計を用いることができる。
  - ローボリウムエアサンプラーに用いる流量計を校正する場合、ガスメーターを基準とする押し込み方式や、校正された面積式流量計を基準とする吸引方式が用いられる。
  - サンプリングに用いる流量計の校正は、捕集装置を取り付けた状態で行う。
  answer: 1
  choice_notes: []
  explanation: '石けん膜流量計は、目盛りの付いた管の中を石けん膜が一定の体積だけ移動する時間を測り、「体積 ÷ 時間」で流量を求めます。石けん液の密度は計算に使いません。選択肢1は誤りです。


    石けん膜流量計は構造が単純で、流量を体積と時間から直接求められるので、ほかの流量計を校正するときの基準としても使われます。


    選択肢2の面積式流量計は、空気の密度によって浮子の止まる位置が変わります。温度が高くなると空気の密度が小さくなるので、標準状態に換算した流量で比べると、指示値は真の流量より大きめに出ます。選択肢5のとおり、流量計の校正を捕集装置を取り付けた状態で行うのは、捕集装置による圧力損失も含めて実際の使用状態に合わせるためです。'
