  stem: 個人サンプリング法による測定（C・D 測定）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - C 測定において、作業に従事する労働者が1人である場合、労働者の作業時間を5等分し、試料空気の採取等の数を5とすることができる。
  - C 測定と D 測定は同じ時間帯に実施することができるが、C 測定に係る個人サンプラーを装着する労働者とD測定に係る個人サンプラーを装着する労働者は、別の労働者としなければならない。
  - 有害物質の発生源に近接する場所において作業が行われる単位作業場所であって、気中濃度が最も高くなると思われる作業に従事する時間が15分未満で複数回生じる場合は、その時間を合わせて15分間サンプリングしても、D 測定とすることはできない。
  - 個人サンプラーを装着した労働者が、単位作業場所外に出る場合であっても、測定結果に影響を与えない場合には、吸引ポンプを停止する必要はないが、その場合の測定値は、単位作業場所の滞在時間での時間加重平均値とする。
  - 分粒装置を使用する場合は、サイクロン式のものを使用することができる。
  answer: 2
  choice_notes:
  - 正しい。労働者が1人なら、作業時間を5等分して試料の数を5とする。
  - 誤り。同じ労働者に C 測定用と D 測定用のサンプラーを着けてよい。
  - 正しい。D 測定は連続した 15 分間で行うもので、短い時間を足し合わせることはできない。
  - 正しい。単位作業場所の外に出ても影響がなければポンプは止めなくてよく、滞在時間での時間加重平均値とする。
  - 正しい。分粒装置にはサイクロン式も使える。
  explanation: 'C 測定と D 測定は同じ時間帯に行うことができ、その場合、同じ労働者に C 測定用と D 測定用のサンプラーを両方着けても構いません。選択肢2は「別の労働者としなければならない」としているので誤りです。


    D 測定は「発生源の近くで作業する労働者が、最も濃度が高くなる 15 分間に受けるばく露」を測るものです。濃度が最も高くなる作業をしている人が、その単位作業場所の C 測定の対象者でもあることはよくあるので、1人の労働者で両方を測ることが認められています。'
  figures: []
  law_note: null
  _key_choice: C測定とD測定は同じ時間帯に実施することができるが、C測定に係る個人サンプラーを装着する労働者とD測定に係る個人サンプラーを装着する労働者は、別の労働者としなければならない。
  review_note: 選択肢2が誤りであることから「同じ労働者に C 測定用と D 測定用のサンプラーを着けてよい」と説明しています。測定基準・ガイドラインの表現と合っているか確認中です。
