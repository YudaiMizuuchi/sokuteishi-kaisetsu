  stem: 25℃、1気圧における環境空気中のメタノールの質量濃度が 130 mg･m⁻³ であるとき、その体積分率（ppm）に最も近いものは、次のうちどれか。
  choices:
  - 50 ppm
  - 100 ppm
  - 200 ppm
  - 300 ppm
  - 400 ppm
  answer: 2
  choice_notes: []
  explanation: 'ppm は体積の比なので、質量濃度（mg/m³）から求めるときは「質量 → 物質量（mol） → 気体の体積」の順に直します。25℃、1気圧では、気体 1 mol の体積は 24.45 L です。


    メタノール（CH₃OH）の分子量は 32.04 なので、


    C [ppm] ＝ C [mg/m³] × 24.45 ÷ 分子量 ＝ 130 × 24.45 ÷ 32.04 ≒ 99.2


    となり、最も近いのは 100 ppm です。


    逆向きの換算 C [mg/m³] ＝ C [ppm] × 分子量 ÷ 24.45 と取り違えると、130 × 32.04 ÷ 24.45 ≒ 170 となり、選択肢の 200 ppm を選んでしまいます。「ppm にするときは 24.45 を掛ける」と覚えておくと、向きを間違えません。'
  figures: []
  law_note: null
  _key_choice: 100ppm
