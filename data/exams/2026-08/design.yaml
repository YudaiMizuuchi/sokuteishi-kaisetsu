  stem: 放射性物質を取り扱っている作業場において、取扱い核種の濃度限度の100分の1の空気中放射性物質の濃度を測定するために必要な最小試料採取時間に最も近い値は次のうちどれか。ただし、取扱い核種の濃度限度は 2.0×10⁻⁵ Bq･cm⁻³、測定装置の検出下限計数率は 2.3 s⁻¹ 、測定装置の計数効率は 35 ％ 、試料空気の吸引流量は 60 L･min⁻¹ 、使用する捕集材の捕集率は 85 ％とする。
  choices:
  - 57 分
  - 79 分
  - 8 時間
  - 11 時間
  - 644 時間
  answer: 4
  choice_notes: []
  explanation: '測りたい濃度の試料を採取したとき、測定装置の計数率が検出下限計数率に届くまでの時間を求めます。


    測りたい濃度は、濃度限度の 100 分の1なので、2.0 × 10⁻⁵ ÷ 100 ＝ 2.0 × 10⁻⁷ Bq/cm³ です。吸引流量は 60 L/min ＝ 1,000 cm³/s なので、採取時間を t 秒とすると、捕集材に集まる放射能と計数率は次のようになります。


    計数率 ＝ 2.0 × 10⁻⁷ × 1,000 × t × 0.85（捕集率）× 0.35（計数効率）＝ 5.95 × 10⁻⁵ × t [s⁻¹]


    これが検出下限計数率 2.3 s⁻¹ 以上になればよいので、


    t ＝ 2.3 ÷ (5.95 × 10⁻⁵) ≒ 3.9 × 10⁴ 秒 ≒ 10.7 時間


    となり、最も近いのは 11 時間です。


    流量の単位（L/min を cm³/s に直す）と、捕集率・計数効率を両方掛けることを落とすと、別の選択肢になります。式を立てる前に、単位をそろえておくのがポイントです。'
