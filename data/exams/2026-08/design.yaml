  law_note: null
  _key_choice: 石けん膜流量計は、所定の区間を石けん膜が移動する時間と、石けん膜をつくる石けん液の密度との関係から、流量を求めるものである。
  review_note: 選択肢2（面積式流量計の温度の影響）を「標準状態に換算した流量で比べると」という前提で説明しています。実際の体積流量で比べると向きが逆になるため、説明の仕方を確認中です。
