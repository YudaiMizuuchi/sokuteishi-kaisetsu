  stem: 液体の純物質 2.3 gを 1.23 Lの真空容器に入れて加熱すると完全に気化し、温度が 97 ℃ になったときに圧力が 1.0 気圧になった。この物質の分子量として、正しい値に最も近いものは次のうちどれか。なお、気体定数は 0.082 atm･L･K⁻¹･mol⁻¹とする。
  choices:
  - '20'
  - '23'
  - '46'
  - '57'
  - '69'
  answer: 4
  choice_notes: []
  explanation: '気体の状態方程式 PV ＝ nRT から物質量 n を求め、質量を n で割って分子量を出します。温度は必ず絶対温度（K）に直します。


    T ＝ 97 ＋ 273 ＝ 370 K


    n ＝ PV ÷ RT ＝ 1.0 × 1.23 ÷ (0.082 × 370) ≒ 0.0405 mol


    分子量 ＝ 2.3 ÷ 0.0405 ≒ 57


    よって、最も近いのは 57 です。


    温度を 97 のまま計算すると、n が大きくなりすぎて分子量は約 15 になります。気体の計算では、セ氏温度を絶対温度に直すことを最初に確認しましょう。'
