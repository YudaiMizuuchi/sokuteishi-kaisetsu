  stem: 物理量又は物理定数Ⓐとその単位記号Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 絶対温度 ／ K
  - アボガドロ定数 ／ mol⁻¹
  - 圧力 ／ m kg s⁻²
  - エネルギー ／ m²kg s⁻²
  - 電荷 ／ s A
  answer: 3
  choice_notes:
  - 正しい。絶対温度はSI基本単位の K（ケルビン）。
  - 正しい。アボガドロ定数は 1 mol あたりの粒子の数なので mol⁻¹。
  - 誤り。m kg s⁻² は力（N）の単位。圧力は m⁻¹ kg s⁻²。
  - 正しい。エネルギー（J）＝ 力 × 距離 ＝ m² kg s⁻²。
  - 正しい。電荷（C）＝ 電流 × 時間 ＝ s A。
  explanation: '圧力は「単位面積あたりの力」です。力の単位 N（ニュートン）は kg・m・s⁻² なので、それを面積 m² で割ると、


    Pa ＝ N/m² ＝ kg・m・s⁻² ÷ m² ＝ m⁻¹ kg s⁻²


    となります。選択肢3の m kg s⁻² は力（N）の単位で、圧力ではないので誤りです。


    組立単位は、暗記するより「定義の式」から組み立てる方が確実です。力 ＝ 質量 × 加速度、圧力 ＝ 力 ÷ 面積、エネルギー ＝ 力 × 距離、電荷 ＝ 電流 × 時間、という関係を押さえておけば、この種の問題はすべて導けます。'
