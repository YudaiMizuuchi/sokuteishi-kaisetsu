  stem: '水素 H₂ 1.0 mol と臭素 Br₂ 1.0 mol を 10 L の容器に入れて、一定温度に保ったところ、次の反応により、臭化水素 HBr が 1.2 mol 生成して平衡状態となった。


    H₂ ＋ Br₂ ⇄ 2HBr


    この反応の平衡定数として、正しい値は次のうちどれか。'
  choices:
  - '3'
  - '6'
  - '9'
  - '12'
  - '15'
  answer: 3
  choice_notes: []
  explanation: '平衡状態での各物質の量を求め、濃度に直して平衡定数の式に入れます。


    HBr が 1.2 mol 生成したので、反応式の係数から、H₂ と Br₂ はそれぞれ 0.6 mol ずつ減っています。平衡状態の量は、H₂ 0.4 mol、Br₂ 0.4 mol、HBr 1.2 mol です。容器は 10 L なので、濃度はそれぞれ 0.04、0.04、0.12 mol/L になります。


    K ＝ [HBr]² ÷ ([H₂][Br₂]) ＝ 0.12² ÷ (0.04 × 0.04) ＝ 0.0144 ÷ 0.0016 ＝ 9


    よって、正しい値は 9 です。


    この反応は、左辺と右辺で分子の数の合計がどちらも2なので、体積は計算の途中で打ち消し合います。物質量のまま計算しても同じ答えになります。初期量と平衡時の量を取り違えないことと、HBr の濃度を2乗することがポイントです。'
