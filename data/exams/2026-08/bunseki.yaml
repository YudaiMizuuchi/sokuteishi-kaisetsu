  stem: '分析値とそのばらつきに関する次の記述の㋑及び㋺の［　］に入る式の組合せとして、正しいものは下のうちどれか。


    「n 回の分析で分析値 x₁, x₂, x₃, …, x<sub>n</sub> を得た時、その平均値を x̄ とすると、分析値のばらつきの程度は［㋑］（分散）で表され、その母集団のばらつきの程度は［㋺］で表される不偏分散を用いる。」'
  choices:
  - 図の1
  - 図の2
  - 図の3
  - 図の4
  - 図の5
  answer: 5
  choice_notes: []
  explanation: 'n 個の分析値そのもののばらつき（分散）は、平均値からのずれを2乗して合計し、**n** で割ったものです。一方、手元の n 個の値から母集団のばらつきを推定するときは、合計を **n − 1** で割った不偏分散を使います。


    よって、㋑ は Σ(xᵢ − x̄)² ÷ n、㋺ は Σ(xᵢ − x̄)² ÷ (n − 1) で、この組合せは（5）です。


    n − 1 で割るのは、平均値 x̄ を同じデータから計算しているため、ずれの2乗の合計が母集団の本来の値より小さめに出るからです。その分を補うために、割る数を1つ減らします。選択肢には「2乗していない式」や「n − 1 を Σ の範囲に入れた式」が混ぜてあるので、2乗の有無と、割る数の位置の両方を確認することが大切です。'
