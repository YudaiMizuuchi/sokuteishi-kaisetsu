  explanation: 'ビュレットは、細長い目盛り付きの管の下に**コック（活栓）**が付いた器具で、滴定のときに溶液を少しずつ滴下し、滴下した体積を目盛りで読み取ります。図の中でコックが付いているのは（2）です。


