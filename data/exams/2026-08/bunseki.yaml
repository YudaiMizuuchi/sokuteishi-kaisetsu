  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 中空陰極ランプは、光源として用いられる。
  - 重水素ランプは、バックグラウンド吸収の補正に用いられる。
  - フレーム法における目的原子の原子蒸気は、ほとんどが基底状態にある。
  - グラファイト炉法では、炉に通電することで生じるジュール熱で原子化を行う。
  - 吸光度は、原子の原子番号に比例する。
  answer: 5
  choice_notes:
  - 正しい。測定元素に固有の波長の光を出す中空陰極ランプを使う。
  - 正しい。重水素ランプの連続光で、分子による吸収などのバックグラウンドを補正する。
  - 正しい。フレームの温度では、ほとんどの原子は基底状態にある。
  - 正しい。グラファイト炉に電流を流し、ジュール熱で加熱して原子化する。
  - 誤り。吸光度は原子の数（濃度）に比例し、原子番号とは関係ない。
  explanation: '原子吸光分析法の吸光度は、光の通り道にある**目的元素の原子の数（濃度）**に比例します。原子番号とは関係がないので、選択肢5は誤りです。


    原子吸光は、基底状態の原子が、その元素に固有の波長の光を吸収する現象を利用します。光源には、測定する元素と同じ元素でできた中空陰極ランプを使い、その元素だけが吸収する波長の光を当てます。吸収の大きさで濃度を求めるので、元素の種類による違いは検量線で補正されます。'
  figures: []
