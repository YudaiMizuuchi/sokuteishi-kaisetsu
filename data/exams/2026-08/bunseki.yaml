  stem: 化学物質Ⓐとその使用例Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - フェノールフタレイン ／ pH 指示薬
  - メチルイソブチルケトン ／ キレート滴定
  - 活性炭 ／ 有機溶剤の捕集
  - 二硫化炭素 ／ 有機溶剤の脱着
  - 重水素化トルエン-d₈ ／ GC / MS 分析の内標準
  answer: 2
  choice_notes: []
  explanation: 'メチルイソブチルケトン（MIBK）は、水と混ざりにくい有機溶媒で、原子吸光分析などの前処理で、金属をキレート化合物にして水溶液から抽出する**溶媒抽出**に使われます。キレート滴定（EDTA などを使う滴定）に使う試薬ではないので、選択肢2は誤りです。


    「キレート」という言葉が共通しているので混同しやすいところです。キレート滴定は EDTA で金属イオンを滴定する容量分析、MIBK はキレート化合物を抽出する溶媒、と役割を分けて覚えておきましょう。


    金属類の選択科目でも、溶媒抽出-原子吸光分析法に用いる MIBK の性質（金属キレートの溶解度が大きい、比較的安定な炎が得られる）が繰り返し出題されています。'
