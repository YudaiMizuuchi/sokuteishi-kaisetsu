    X線回折は、多数の小さな結晶がいろいろな向きを向いていて、その一部がちょうど回折の条件を満たすことを利用しています。粒子が大きいと「いろいろな向き」がそろわず、同じ試料でも測るたびに強度が変わってしまいます。作業環境測定で捕集する吸入性粉じんは、もともと十分に細かい粒子です。'
