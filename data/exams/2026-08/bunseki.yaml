  explanation: 'アセトン（CH₃COCH₃）は、炭素原子に酸素原子が二重結合したカルボニル基（＞C＝O）を、2つのメチル基ではさんだ構造の**ケトン**です。-CHO（ホルミル基）はアルデヒドがもつ官能基なので、選択肢4は誤りです。


    アセトンとアセトアルデヒド（CH₃CHO）は名前も構造も似ていますが、カルボニル基が分子の端にあって水素と結合しているものがアルデヒド（-CHO）、炭素ではさまれているものがケトン（-CO-）です。'
