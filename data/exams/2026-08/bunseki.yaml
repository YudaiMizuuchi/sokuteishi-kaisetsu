  - 30％
  answer: 2
  choice_notes: []
  explanation: '吸光度 A は透過率 T を使って A ＝ −log T と表され、濃度に比例します。


    濃度 2.0 × 10⁻⁵ mol/L のとき、T ＝ 0.50 なので、A ＝ −log 0.50 ≒ 0.301 です。濃度が半分の 1.0 × 10⁻⁵ mol/L では、吸光度も半分の約 0.150 になります。


    T ＝ 10⁻⁰·¹⁵⁰ ≒ 0.71


    よって、最も近いのは 70 ％ です。


    濃度が半分になっても、透過率は2倍（100 ％）にはなりません。比例するのは吸光度で、透過率ではないことがこの問題のポイントです。濃度が半分になると、透過率は元の透過率の平方根になる（√0.50 ≒ 0.71）と覚えておくと、計算も速くなります。'
