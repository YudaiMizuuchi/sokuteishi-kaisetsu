  stem: 物質 A の濃度が 2.0 × 10⁻⁵ mol･L⁻¹ の溶液に、波長 550 nmの光を当てたところ、透過率は50％であった。同様の方法で、物質 A の濃度が 1.0 × 10⁻⁵mol･L⁻¹の溶液に、波長 550 nmの光を当てたとき、その透過率に最も近い値は次のうちどれか。
