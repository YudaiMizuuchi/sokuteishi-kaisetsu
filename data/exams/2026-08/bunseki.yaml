  stem: 拡散セルを用いた有機溶剤の標準ガス発生に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 拡散チューブの内径が大きいほど濃度が高くなる。
  - 有機溶剤量をセルごと秤量し、蒸発量を求めることにより濃度を計算できる。
  - 拡散速度は、温度が高いほど大きくなる。
  - 飽和蒸気圧が同じなら、異なる物質でも濃度が等しくなる。
  - 拡散チューブの有効長が長いほど濃度が低くなる。
  answer: 4
  choice_notes:
  - 正しい。内径が大きいほど断面積が大きく、拡散する量が多くなる。
  - 正しい。一定時間ごとにセルごと秤量して減った量から、発生量と濃度を求める。
  - 正しい。温度が高いほど蒸気圧と拡散係数が大きくなる。
  - 誤り。拡散係数が違えば、蒸気圧が同じでも濃度は異なる。
  - 正しい。有効長が長いほど拡散しにくく、濃度は低くなる。
  explanation: '拡散セルから発生する蒸気の量（拡散速度）は、飽和蒸気圧だけでなく、その物質の**拡散係数**、拡散チューブの寸法、温度によって決まります。飽和蒸気圧が同じでも、物質が違えば拡散係数が違うので、発生する濃度は等しくなりません。選択肢4は誤りです。


    拡散速度は、おおまかに「拡散係数 × 断面積 × 蒸気圧 ÷ チューブの長さ」に比例します。この関係から、内径が大きいほど濃度は高く、有効長が長いほど低く、温度が高いほど大きくなる、という他の選択肢も説明できます。'
  figures: []
  law_note: null
  _key_choice: 飽和蒸気圧が同じなら、異なる物質でも濃度が等しくなる。
