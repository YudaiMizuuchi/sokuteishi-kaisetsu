  - エチレンの完全燃焼に必要な酸素の物質量は、エチレンの物質量の3倍である。
  - エタンの完全燃焼に必要な酸素の物質量は、エタンの物質量の5倍である。
  - エチレンの完全燃焼で生成する二酸化炭素と水の物質量は等しい。
  - エタンの完全燃焼で生成する二酸化炭素の物質量は、エタンの物質量の2倍である。
