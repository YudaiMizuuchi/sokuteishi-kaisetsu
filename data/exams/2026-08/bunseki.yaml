  stem: キャピラリーガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キャリヤーガスの流速には、最適値がある。
  - カラムの内径が小さいほど、理論段数は大きくなる。
  - カラムの長さが長いほど、理論段相当高さは大きくなる。
  - 極性液相を用いると、極性官能基を有する化合物の保持時間は大きくなる。
  - 無極性液相を用いると、飽和炭化水素化合物は、ほぼ炭素数が少ないものから順に溶出する。
  answer: 3
  choice_notes:
  - 正しい。流速には、HETP が最小になる最適値がある（ファン・デームター式）。
  - 正しい。内径が小さいほど、理論段数は大きくなる。
  - 誤り。カラムを長くしても HETP は大きくならない。長くなるのは理論段数。
  - 正しい。極性液相では、極性官能基をもつ化合物ほど強く保持される。
  - 正しい。無極性液相では、飽和炭化水素はほぼ沸点の順（炭素数の少ない順）に出てくる。
  explanation: '理論段相当高さ（HETP）は、カラムの長さを理論段数で割ったもので、カラムの分離効率を「長さ1単位あたり」で表す値です。カラムを長くすると理論段数は増えますが、HETP はカラムの充填状態や内径、流速などで決まり、長さによって大きくはなりません。選択肢3は誤りです。


    カラムの性能を比べるとき、理論段数は「カラム全体」、理論段相当高さは「単位長さあたり」の指標、と区別して覚えておきましょう。HETP は小さいほど分離能が高いカラムです。'
  figures: []
  law_note: null
  _key_choice: カラムの長さが長いほど、理論段相当高さは大きくなる。
  _stem_head: キャピラリーガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
