  stem: 検知管に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 検知管は、通常20℃で校正されており、使用温度と検知管の種類によっては温度補正が必要なことがある。
  - 検知剤の変色層の長さは、担体粒子径の影響を受ける。
  - 検知剤は、対象ガス以外の物質とは反応しない。
  - 変色層が斜めに現れたときは、変色した部分の最先端と斜めに変色が生じ始めた点との中央値を読み取る。
  - 検知管は冷凍保存してはならない。
  answer: 3
  choice_notes: []
  explanation: '検知管の検知剤は、対象ガスと同じような反応をする物質とも反応することがあり、共存すると指示値が高めや低めにずれることがあります。そのため、各検知管には妨害する物質（干渉成分）が示されています。「対象ガス以外とは反応しない」とする選択肢3は誤りです。


    検知管は、特定の化学反応による変色を利用する簡便な方法なので、選択性には限界があります。使う前に、その作業場に妨害物質が共存していないかを確認することが、正しい測定の前提になります。'
