  explanation: 'モル濃度を質量パーセント濃度に直すには、溶液 1 L について「溶質の質量」と「溶液の質量」を比べます。


    溶質（NaOH）の質量 ＝ 0.5 mol × 40.0 g/mol ＝ 20 g


    溶液の質量 ＝ 1,000 cm³ × 1.0 g/cm³ ＝ 1,000 g


    質量パーセント濃度 ＝ 20 ÷ 1,000 × 100 ＝ 2 ％


    よって、正しいのは 2 ％ です。


    1 L の質量を 100 g と取り違えると 20 ％（選択肢4）を選んでしまいます。「1 L ＝ 1,000 cm³」と密度から、まず溶液の質量を出すのが確実です。'
