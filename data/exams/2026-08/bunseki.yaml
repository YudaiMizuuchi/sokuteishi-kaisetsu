  stem: ガスクロマトグラフ分析法に用いられる検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 水素炎イオン化検出器（FID）では、水素炎中で試料がイオン化される。
  - 電子捕獲検出器（ECD）では、β線照射で生じた二次電子が測定対象化合物に捕獲されることを利用する。
  - 光イオン化検出器 （PID） では、グロー放電で放射される紫外線で試料がイオン化される。
  - 炎光光度検出器（FPD）では、水素炎中で臭素又は塩素に特有な発光を利用する。
  - 熱イオン化検出器 （TID、FTD） では、窒素やリンを含む化合物の一部が熱イオン化し、増加するイオン電流の値を利用する。
  answer: 4
  choice_notes: []
  explanation: '炎光光度検出器（FPD）は、水素炎の中で**硫黄**や**リン**を含む化合物が出す特有の発光を測る検出器です。臭素や塩素（ハロゲン）に選択的な検出器ではないので、選択肢4は誤りです。


    ガスクロマトグラフの検出器は、「何に強いか」でまとめて覚えます。FID はほとんどの有機化合物、ECD はハロゲンを含む化合物、FPD は硫黄・リン化合物、TID（FTD）は窒素・リン化合物、PID は芳香族などイオン化しやすい化合物、が目安です。'
