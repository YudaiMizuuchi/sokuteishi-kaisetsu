  stem: りん酸法により、石英含有率を求めるため、液相沈降法により 10 µm以下に粒度調整した試料200.00 mg を熱リン酸で処理し、りん酸残渣として 44.00 mgを得た。このりん酸残渣を白金るつぼに移し、フッ化水素酸で処理したところ、フッ化水素酸残渣 0.20 mg が得られた。石英含有率（％）の値に最も近いものは次のうちどれか。ただし、標準石英について求めたりん酸残渣率は 96.0 ％であったものとする。
  columns: null
  choices:
  - '20.7'
  - '21.0'
  - '22.0'
  - '22.4'
  - '22.8'
  answer: 5
  choice_notes: []
  explanation: '次の順で計算します。


    1. りん酸残渣中の石英の量：りん酸残渣（44.00 mg）から、フッ化水素酸残渣（0.20 mg）を引くと、44.00 − 0.20 ＝ 43.80 mg

    2. 標準石英のりん酸残渣率が96.0％なので、もとの石英の量は、43.80 ÷ 0.960 ≒ 45.63 mg

    3. 石英含有率 ＝ 45.63 ÷ 200.00 ≒ 0.228 ＝ **22.8％**


    よって（5）です。


