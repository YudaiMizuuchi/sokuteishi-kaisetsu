  stem: 吸入性粉じん濃度の測定に用いられる分粒装置に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 測定に用いられる分粒装置は、規定の流量で使用するとき空気力学相当径 4 µmの粒子を 50 ％除去する。
  - ノズル式インパクターで分粒される粒子の粒径は、ノズルを通過する空気の速度の 1/2 乗に反比例する。
  - 慣性衝突式分粒装置では、粗大粉じんを除去するための捕集板には、粘着剤を規定の厚みとなるように塗布する。
  - サイクロン式分粒装置では、流速が速くなるほど、通過する粒子の 50 ％分粒粒径は小さくなる。
  - 多段平行板式分粒装置の吸引流量を所定の流量より大きくすると、分粒装置を通過する粒子の 50 ％ 分粒粒径は小さくなる。
  answer: 5
  choice_notes: []
  explanation: '多段平行板式分粒装置は、重力沈降を利用して、粗大粒子を除きます。吸引流量を所定より**大きく**すると、空気が平行板の間を通る時間が短くなり、沈降する粒子が減るので、通過する粒子の50％分粒粒径は**大きく**なります。「小さくなる」とする選択肢5は誤りです。


    分粒装置は、規定の流量で使うとき、空気力学相当径4 µmの粒子を50％除去します。サイクロン式では、流速が速くなるほど、50％分粒粒径は小さくなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
