  stem: X 線回折基底標準吸収補正法により、以下のような手順で粉じん中の石英の定量操作を行ったところ、粉じん中の石英含有率として 12.0 ％ が得られた。有効直径 20 mm のフィルターに、再発じん法により 1.20 mg の粉じんを捕集した。このフィルターの石英の主回折強度は 280 cps であった。石英の回折強度は石英が 1 mg･cm⁻² のとき 7000 cps に相当する。このフィルターの定量操作に用いた X 線吸収補正係数として、最も近い値はどれか。
  columns: null
