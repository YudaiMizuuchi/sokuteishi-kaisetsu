  - 空気の密度 ／ 反比例
  - 空気の粘性係数 ／ 反比例
  answer: 4
  choice_notes: []
  explanation: 'ストークスの式は、v ＝（ρ − ρ₀）× g × d² ／（18 η）です。粒子の密度が空気の密度より十分大きいときは、終末速度は、粒子の直径の2乗、重力加速度、粒子の密度に**比例**し、空気の粘性係数に**反比例**します。空気の密度は、粒子の密度に比べて無視できるほど小さいので、終末速度は、空気の密度に反比例しません。選択肢4は誤りです。


    （参考：『作業環境測定のための労働衛生の知識』）'
