  columns: null
  choices:
  - 研磨作業における質量濃度変換係数は、発生源からの距離によって異なることが多い。
  - 併行測定は、粉じんの発生状況や気流の影響等を考慮して、A 測定を実施した測定点のうちのいずれか一点で行わなければならない。
  - 併行測定で得られた粉じん濃度が 1.50 mg･m⁻³ で圧電天秤方式の粉じん計の5回の平均濃度が 1.20 mg･m⁻³ の場合の質量濃度変換係数は、1.25である。
  - 光散乱方式の相対濃度計では、同じ粉じんで、粒径が 0.5 µm 程度より大きいと、粒径が大きくなるほど質量濃度変換係数は大きくなる。
  - 光散乱方式の相対濃度計では、粒度分布が同じであっても、石英粉じんと酸化鉄粉じんの質量濃度変換係数は同じになるとは限らない。
