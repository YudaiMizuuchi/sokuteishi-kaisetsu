  stem: X 線回折基底標準吸収補正法による、粉じん中の石英の定量方法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 基底標準吸収補正法は、試料による吸収の影響を補正して、遊離けい酸含有率の多少にかかわらず、標準試料で作った検量線をそのまま適用できるようにした方法である。
  - 吸収補正を行うことにより、定量範囲はやや狭くなるが、夾雑物の吸収の影響を少なくして精度を向上させることができる。
  - 金属基底標準板には、石英の測定回折線より高角度側でそれに近い回折線をもつ材質を選ぶ。
  - 検量線用標準試料は、フィルター上に 0.2 mg･cm⁻² から 1.2 mg･cm⁻²くらいまでの間で質量が7段階程度になるように標準石英を採取する。
  - 検量線は、縦軸に X 線吸収補正係数で補正した石英の回折線強度をとり、横軸に石英量をとって作成する。
  answer: 2
  choice_notes: []
  explanation: '基底標準吸収補正法では、吸収補正を行うことで、**定量範囲は広くなり**、夾雑物の吸収の影響が少なくなります。「定量範囲はやや狭くなる」とする選択肢2は誤りです。


    金属基底標準板には、石英の測定回折線より高角度側で、それに近い回折線をもつ材質（亜鉛かアルミニウム）を選びます。検量線は、縦軸にX線吸収補正係数で補正した石英の回折線強度、横軸に石英量をとって作成します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
