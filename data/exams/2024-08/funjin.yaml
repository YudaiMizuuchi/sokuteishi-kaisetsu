  stem: '密度2.60 g･cm⁻³、粒径5.0 µmの球形粒子について、25 ℃ の水中で終末沈降速度を測定して 2.5 × 10⁻³ cm･s⁻¹を得た。この粒子を 5 ℃ の水中で終末沈降速度を測定した場合に期待される値に最も近いものは次のうちどれか。ただし、粒子の終末沈降速度はストークスの式に従い、水の密度と粘性係数は、25 ℃ と 5 ℃ ではそれぞれ以下のとおりとする。


    | 温度 | 水の密度（g･cm⁻³） | 水の粘性係数（g･cm⁻¹･s⁻¹） |

    |---|---|---|

    | 25 ℃ | 0.9970 | 0.00895 |

    | 5 ℃ | 0.9999 | 0.01525 |'
  columns: null
  choices:
  - 3.0 × 10⁻⁴ cm･s⁻¹
  - 5.0 × 10⁻⁴ cm･s⁻¹
  - 1.5 × 10⁻³ cm･s⁻¹
  - 3.0 × 10⁻³ cm･s⁻¹
  - 5.0 × 10⁻³ cm･s⁻¹
  answer: 3
  choice_notes: []
  explanation: '終末沈降速度は、ストークスの式から、（ρ − ρ₀）／ηに比例します。25℃と5℃で、粒子の密度（2.60）と粒径は同じなので、比をとります。


    - 25℃：（2.60 − 0.9970）／0.00895 ＝ 179.1

    - 5℃：（2.60 − 0.9999）／0.01525 ＝ 104.9


    5℃の速度 ＝ 2.5 × 10⁻³ × 104.9／179.1 ≒ 1.46 × 10⁻³ ≒ **1.5 × 10⁻³ cm/s**


    水温が低いと、粘性係数が大きくなり、沈降速度が小さくなります。よって（3）です。'
  figures: []
  law_note: null
