  explanation: '逆算します。


    1. フィルターの有効面積：直径20 mm（半径1 cm）なので、π × 1² ＝ 3.14 cm²

    2. フィルター上の石英の量：粉じん1.20 mgの12.0％なので、1.20 × 0.120 ＝ 0.144 mg、面密度は 0.144 ÷ 3.14 ≒ 0.0458 mg/cm²

    3. 補正後の回折線強度：石英が1 mg/cm²のとき7000 cpsなので、0.0458 × 7000 ≒ 321 cps

    4. 測定強度が280 cpsなので、X線吸収補正係数 ＝ 321 ÷ 280 ≒ **1.15**


    よって（3）です。'
