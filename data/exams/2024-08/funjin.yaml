  stem: 作業環境測定に用いる圧電天秤方式の粉じん計に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 試料空気は吸入口から規定流量で吸引され、慣性衝突式の分粒装置（インパクター）により粗大粒子が除かれる。
  - 受感部（センサー）上に粉じんを捕集するため、直前にコロナ放電により粒子に荷電している。
  - 圧電結晶板が一定の周波数で振動しているとき、その表面に粉じんが捕集されると、捕集粉じんの増加質量に比例して周波数も増加する。
  - 圧電結晶板の周波数の変化量と捕集される粉じん質量の間には、約 2000 Hz 以内の範囲で比例関係がある。
  - 表示された値は、直接当該粉じんの質量濃度を示すものではなく、質量濃度は、質量濃度変換係数を乗じて求めなければならない。
  answer: 3
