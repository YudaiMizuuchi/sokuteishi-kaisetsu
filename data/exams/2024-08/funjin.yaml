  - ピペット型液相沈降試験器に懸濁液を移し、所定の目盛り線の位置まで精製水を加えた後、よく振とうし静置する。
  - 所定の時間が経過した後、ピペット型液相沈降試験器の排出口（0目盛り線）より上方の懸濁液を排出し、残った懸濁液に含まれる粒子を試料とする。
  answer: 5
  choice_notes: []
  explanation: '液相沈降法（ピペット法）の手順は、次のとおりです。


    1. 堆積粉じんを、目開き75 µmのふるいを通して試料とします（選択肢1）。

    2. 試料の比重を、石英の2.65と仮定し、限界径10 µmで沈降時間を求めます（選択肢2）。

    3. 約500 mLの精製水に約5 gの試料を加えて、粒子濃度が質量比で約1％になるようにします（選択肢3）。

    4. 懸濁液を試験器に移し、所定の目盛り線に精製水を加えて、よく振とうして静置します（選択肢4）。

    5. 所定の時間が経過したら、試験器のコックを回して、**所定の粒度以下の粒子を含む懸濁液を取り出し**、それを試料とします。排出口より上方を捨てて、残った懸濁液を使うのではないので、選択肢5は誤りです。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
