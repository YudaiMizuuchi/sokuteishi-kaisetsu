  - 二硫化炭素の捕集には、シリカゲル管は適さない。
  - 活性炭管に同一濃度のトルエンとアセトンの混合物を捕集する場合、アセトンの方が早く破過する。
  - ポーラスポリマービーズは、活性炭に比べ、表面が不活性である。
  - 混合有機溶剤を捕集する場合、含まれる有機溶剤の種類によっては、異なる種類の捕集管を用意し、同時に捕集することが必要になる。
