  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点を決めるために等間隔で引いた縦の線と横の線は、建屋の形状などにより、直交しなくてもよい。
  - 測定点を決めるために引いた縦の線と横の線との交点のうち、生産設備などと重なり労働者の呼吸域とならない交点は、これを測定点から除く。
  - 単位作業場所における有害物質の濃度がほぼ均一であることが明らかなときは、測定点は、6 m を超える等間隔で引いた縦の線と横の線との交点としてよい。
  - 単位作業場所の範囲が狭く、縦の線と横の線の交点の数が5未満になるときは、測定点の数が5となるよう、下図のように測定点を設定してもよい。
  - 単位作業場所が著しく狭く、かつ、単位作業場所における空気中の有害物質の濃度がほぼ均一であることが明らかなため、測定点の数を4点とした場合には、4点のうちいずれか1点で2回繰り返し測定を行うことによって、測定値の総数を5とする。
  answer: 5
