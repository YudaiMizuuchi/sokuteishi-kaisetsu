  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定は、測定時に労働者がいない場合でも、立ち入ることがあるならば、その作業位置で測定を行う。
  - 発生源とともに労働者が移動しながら行う作業、原材料の投入、設備の点検等間欠的に有害物が発散する作業、有害物を発散するおそれのある装置や設備に近接して行う作業のいずれかが行われる単位作業場所では、B測定を行う。
  - B 測定のサンプリング時間は継続した 10 分間であるが、検知管を用いて B 測定を行う場合には、10 分の間に測定時間を均等に分散させて5本程度の検知管を用いて断続的に測定してよい。
  - 圧電天秤方式の相対濃度計を用いて鉱物性粉じんの B 測定を行う場合は、測定時間を2分に合わせて、連続して5回の測定を行い、指示値の最大値を B 測定値とする。
  - B 測定の試料採取方法と分析方法は、A 測定と同じ方法を用いる。
  answer: 4
  choice_notes: []
  explanation: '圧電天秤方式の相対濃度計で B 測定を行うときは、2分間の測定を連続して5回行い、その**算術平均値**を B 測定値とします。最大値とする選択肢4は誤りです。


    B 測定値は「10分間の値」として求めるので、短い測定を積み上げたときは平均をとります。検知管を10分間に5本使う場合と同じ考え方です。'
