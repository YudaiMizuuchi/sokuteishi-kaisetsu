  stem: 有害物質の A・B 測定における単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 同一の区域でも、時間帯によって異なる有害要因が存在する場合には、それらの時間帯をそれぞれ別の単位作業場所とする。
  - 単位作業場所が広く測定点の数が多いため、1作業日中にサンプリングを終了できない場合には、測定を2作業日に分けて行うようにする。
  - 単位作業場所の測定点は、他の単位作業場所の測定点と重複してもよい。
  - 有害物質の環境空気中濃度の分布は、作業場の気流によって大きな影響を受けるため、単位作業場所の範囲を決める際には、作業場内の気流の影響を考慮する必要がある。
  - 有機溶剤による金属の洗浄を行う工場で働く作業者の行動範囲が当該工場内全体であるが、有機溶剤の分布が発生源周辺に限定されると考えられる場合には、発生源周辺の区域を単位作業場所としてよい。
