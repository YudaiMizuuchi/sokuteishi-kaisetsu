  stem: 個人サンプリング法による測定（C・D 測定）に関する次の記述のうち、誤っているものはどれか。ただし、「均等ばく露作業」とは、労働者がばく露する測定対象物質の量がほぼ均一であると見込まれる作業をいう。
  choices:
  - 均等ばく露作業に該当するかどうかは、事前調査等により、作業中の労働者の行動範囲、測定対象物質の分布状況等を踏まえて判断する。
  - 同一の測定対象物質に係る均等ばく露作業が複数行われる作業場であって、労働者の行動範囲が同じで、作業の時間帯が異なる場合には、時間帯ごとに単位作業場所を別々に設定する。
  - 個人サンプリングであっても分粒装置を使用しなければならない場合があり、その場合は、サイクロン式か慣性衝突式のものを使用する。
  - 単位作業場所における作業時間が2時間以下の場合には、C 測定の試料空気の採取等の時間は全作業時間とする。
  - 有害物質の発生源に近接する場所において作業が行われる場合であって、気中濃度が最も高くなると思われる時間が 15 分未満で複数回生じるときは、その時間の合計が 15 分となるように D 測定の試料空気の採取を行う。
  answer: 5
  choice_notes: []
  explanation: 'D 測定の試料空気の採取は、濃度が最も高くなると思われる時間に、**連続した15分間**で行います。濃度が高い時間が15分未満で複数回ある場合でも、その時間を合計して15分とすることはできないので、選択肢5は誤りです。


    令和8年度第1回でも、合わせて15分としても D 測定とはできない、という形で出題されています。'
