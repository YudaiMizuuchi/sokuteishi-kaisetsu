  stem: 個人サンプリング法による測定（C・D 測定）の対象に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの測定は、個人サンプリング法による測定の対象とはならない。
  - 有機溶剤の測定は、作業方法、対象物質にかかわらず、個人サンプリング法による測定の対象となる。
  - 特別有機溶剤の測定は、作業方法、対象物質にかかわらず、個人サンプリング法による測定の対象となる。
  - 特定化学物質の中には、個人サンプリング法による測定の対象とならない物質がある。
  - 鉛及びその化合物の測定は、作業方法、対象物質にかかわらず、個人サンプリング法による測定の対象となる。
