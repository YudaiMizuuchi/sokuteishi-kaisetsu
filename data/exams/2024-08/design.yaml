  stem: 25℃、1気圧における環境空気中のメチルイソブチルケトン（CH₃COC₄H₉）の質量濃度が 100 mg･m⁻³ であるとき、その体積分率（ppm）に最も近いものは、次のうちどれか。
  choices:
  - 22 ppm
  - 25 ppm
  - 28 ppm
  - 220 ppm
  - 250 ppm
  answer: 2
  choice_notes: []
  explanation: 'mg/m³ を ppm に直すときは、24.45 を掛けて分子量で割ります。メチルイソブチルケトン（CH₃COC₄H₉）の分子量は 100.2 です。


    C [ppm] ＝ 100 × 24.45 ÷ 100.2 ≒ 24.4


    よって、最も近いのは 25 ppm です。分子量がほぼ100なので、ppm と mg/m³ の値の比が 24.45 にほぼ等しくなる、と気づけば計算が楽になります。'
  figures: []
  law_note: null
  _key_choice: 25 ppm
