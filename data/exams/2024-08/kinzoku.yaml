  - Ⓑ
  choices:
  - 過マンガン酸カリウム ／ KMnO₄
  - 塩化カドミウム ／ CdCl₂
  - 三酸化二ヒ素 ／ As₂O₃
  - 硝酸鉛 ／ PbNO₃
  - クロム酸カリウム ／ K₂CrO₄
  answer: 4
  choice_notes: []
  explanation: '硝酸鉛の化学式は、鉛が2価の陽イオン（Pb²⁺）、硝酸イオンが1価の陰イオン（NO₃⁻）なので、**Pb(NO₃)₂**です。「PbNO₃」とする選択肢4は誤りです。


    過マンガン酸カリウムはKMnO₄、塩化カドミウムはCdCl₂、三酸化二ヒ素はAs₂O₃、クロム酸カリウムはK₂CrO₄で、いずれも正しい化学式です。'
