  stem: 誘導結合プラズマ発光分光分析法（ICP-AES 法）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - フレーム原子吸光分析法に比べ、検量線の直線範囲が広い。
  - プラズマの生成には、アルゴンガスが用いられる。
  - 試料溶液の粘性は、測定値に影響しない。
  - 目的元素の発光線付近の分光干渉に注意する。
  - プラズマ中の目的元素の発光線の中で、発光強度が最大の発光線が常に定量に用いられるとは限らない。
  answer: 3
  choice_notes: []
  explanation: 'ICP-AES法では、試料溶液の**粘性**（粘度）が、ネブライザーの吸い上げ量に影響するので、スペクトル線強度に影響します。「粘性は測定値に影響しない」とする選択肢3は誤りです。対策として、酸濃度を一定にする、内標準法を使うなどがあります。


    プラズマの生成には、アルゴンガスを使います。検量線の直線範囲は、フレーム原子吸光法より広く、分光干渉には注意が必要です。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
