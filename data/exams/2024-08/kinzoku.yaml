  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 重量分析法や容量分析法に比べて、感度が低い。
  - 発色試薬には、無機試薬と有機試薬がある。
  - 発色反応を促進するために加熱操作を行った試料は、発色後、常温に戻してから測定する。
  - プラスチック製セルを使用する場合には、適応波長域、使用可能な溶媒に注意する。
  - モル吸光係数は、pH により変わることがある。
