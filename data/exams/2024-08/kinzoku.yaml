  columns:
  - Ⓐ
  - Ⓑ
  choices:
  - 吸光光度分析法 ／ 電子エネルギー準位
  - 蛍光光度分析法 ／ 励起スペクトル
  - 原子吸光分析法 ／ ランベルト-ベールの法則
  - 誘導結合プラズマ発光分光分析法 ／ ラマン線
  - 誘導結合プラズマ質量分析法 ／ 分子イオン干渉
  answer: 4
  choice_notes: []
  explanation: 'ラマン線は、溶媒の分子による散乱光で、**蛍光光度分析法**で、蛍光と区別が必要な現象です。励起光の波長を変えても、ラマン線は、励起光とのエネルギー間隔が一定のまま出現します。誘導結合プラズマ発光分光分析法との組合せは、不適切です。よって（4）です。


    吸光光度分析法は電子エネルギー準位、蛍光光度分析法は励起スペクトル、原子吸光分析法はランベルト・ベールの法則、ICP-MSは分子イオン干渉（多原子イオンによる妨害）に関係します。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』、『機器分析の実務』）'
