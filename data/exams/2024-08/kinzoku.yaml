  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 光源の輝線の線幅は、吸収線の線幅よりも広い。
  - 電気加熱原子化法は、フレーム法に比べて測定感度が高い。
  - 吸光度は、光路長と基底状態の金属原子の濃度の積に比例する。
  - 中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して発光する。
  - フレームに送り込まれるミストの粒径が小さく、分布幅が狭いほど、ノイズは減少する。
  answer: 1
  choice_notes: []
  explanation: '原子吸光分析法では、光源の輝線の線幅は、吸収線の線幅より**狭く**なければなりません。そうでないと、吸収が小さくなり、感度も検量線の直線性も悪くなります。そのため、線幅の狭い中空陰極ランプなどが使われます。「光源の輝線の線幅は吸収線の線幅より広い」とする選択肢1は誤りです。


    電気加熱原子化法は、フレーム法より感度が高い方法です。中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して励起され、発光します。


    （参考：『機器分析の実務』）'
