    バブラーの内壁を捕集液で洗い、洗液を合わせて試料液とします。塩化スズ(Ⅱ)を用いると、不溶性のオキシクロライドが生じることがあり、アスコルビン酸を還元剤に使うと、その発生を抑制できます。


