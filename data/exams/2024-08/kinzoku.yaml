  stem: 金属の定量に用いられる試薬に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - ジフェニルカルバジドは、硫酸酸性でクロム(Ⅲ)と反応する。
  - ブロムフェノールブルー溶液は、pH 4.6 以上で青紫色を示す。
  - N-ベンゾイル-N-フェニルヒドロキシルアミン（NBPHA）は、バナジウムの発色試薬として用いられる。
  - 水素化ホウ素ナトリウムは、ヒ素(Ⅲ)から水素化ヒ素を発生させるのに用いられる。
  - 硫酸ナトリウムは、水と MIBK 層との分配比を大きくして良好な層分離のために添加される。
  answer: 1
  choice_notes: []
  explanation: 'ジフェニルカルバジドは、硫酸酸性で、**クロム(Ⅵ)**と反応して、赤紫色の錯体をつくります（ジフェニルカルバジド自身は酸化されます）。クロム(Ⅲ)とは反応しないので、選択肢1は誤りです。


    NBPHAは、バナジウムの発色（抽出）試薬です。水素化ホウ素ナトリウムは、ヒ素(Ⅲ)から水素化ヒ素を発生させるのに使います。硫酸ナトリウムは、水とMIBK層の分離をよくするために加えます。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
