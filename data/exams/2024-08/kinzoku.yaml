  stem: 誘導結合プラズマ発光分光分析法（ICP-AES 法）に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - フレーム原子吸光分析法に比べ、検量線の直線範囲が広い。
  - プラズマの生成には、アルゴンガスが用いられる。
  - 試料溶液の粘性は、測定値に影響しない。
  - 目的元素の発光線付近の分光干渉に注意する。
  - プラズマ中の目的元素の発光線の中で、発光強度が最大の発光線が常に定量に用いられるとは限らない。
