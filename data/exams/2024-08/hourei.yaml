  explanation: '分粒装置を用いて捕集しなければならないのは、鉱物性粉じん、マンガン及びその化合物、インジウム化合物などで、ベリリウム及びその化合物は含まれません。選択肢5は誤りです。


    令和6年度第1回のデザイン・サンプリングでも、分粒装置が必要な物質がマンガン、インジウム、鉱物性粉じんであることが出題されています。'
