  stem: 作業環境測定士及び作業環境測定機関に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業場の労働者で、作業環境測定を実施している作業環境測定士を当該事業場の衛生委員会の委員として指名することができる。
  - 粉じん作業を行う坑内作業場のうち、ずい道等の内部において、ずい道等の建設の作業を行うものについて、空気中の粉じんの濃度を測定するときは、第1種作業環境測定士に行わせなければならない。
  - 作業環境測定士は、作業環境測定を実施するときは、作業環境測定基準に従って実施しなければならず、これに違反した場合には、登録の取消し、指定作業場についての作業環境測定の業務の停止等を命ぜられることがある。
  - 第1種作業環境測定士が置かれなければ、作業環境測定機関としての登録を受けることができない。
  - 作業環境測定機関は、作業環境測定を行ったときは、当該作業環境測定を行った作業場の名称及び所在地、測定年月日、当該作業環境測定を実施した作業環境測定士の氏名、測定方法並びに測定結果を記載した書類を作成し、3年間保存しなければならない。
