  stem: 常時 800 人の労働者を使用する製造業の事業場における労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 総括安全衛生管理者を選任しなければならない。
  - 衛生管理者を3人以上選任しなければならない。
  - 著しく暑熱な場所における業務に常時 50 人の労働者を従事させる場合は、衛生管理者のうち1人を専任の衛生管理者としなければならない。
  - エックス線にさらされる業務に常時 50 人の労働者を従事させる場合は、衛生管理者のうち1人を衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。
  - クロムの粉じんを発散する場所における業務に常時 50 人の労働者を従事させる場合は、その事業場に専属の産業医を選任しなければならない。
  answer: 5
  choice_notes: []
  explanation: '専属の産業医が必要になるのは、常時1,000人以上の事業場か、クロムの粉じんを発散する場所での業務など法令で定める有害業務に、常時**500人以上**を従事させる事業場です。800人の事業場で、有害業務に50人を従事させているだけでは、専属の産業医は必要ありません。選択肢5は誤りです。


    一方、500人を超える事業場で、暑熱の業務などの一定の有害業務に常時30人以上を従事させる場合は、衛生管理者のうち1人を専任にします（選択肢3）。「専属の産業医は500人」「専任の衛生管理者は30人」と数字を区別しましょう。'
