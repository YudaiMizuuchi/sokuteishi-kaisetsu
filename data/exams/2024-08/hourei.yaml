  - 2種類以上の有機溶剤を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を当該測定点における測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - A測定とB測定を行った単位作業場所において、第1評価値及び B 測定の測定値がいずれも管理濃度に満たない場合は、第1管理区分に区分される。
  - A 測定を行った場合には、計算により第1評価値及び第2評価値を求めて管理区分に区分するが、C 測定を行った場合には、測定値のうちの最大値及び最小値をもとに管理区分に区分する。
  - C測定とD 測定を行った単位作業場所において、C 測定の第2評価値が管理濃度を超える場合は、D 測定の測定値に関係なく、第3管理区分に区分される。
  answer: 4
