  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 深夜業を含む業務に常時従事する労働者に対しては、6か月以内ごとに1回、定期に、医師による健康診断を行わなければならない。
  - 海外に6か月以上派遣して帰国した労働者を、国内の業務に就かせるときは、一時的に就かせるときを除き、医師による健康診断を行わなければならない。
  - 事業場において実施した定期健康診断の結果、健康診断項目に異常の所見があると診断された労働者については、健康を保持するために必要な措置について、健康診断を実施した日から3か月以内に、医師から意見聴取を行わなければならない。
  - 事業場において実施した定期健康診断を受けた労働者に対しては、異常の所見の有無にかかわらず、遅滞なく、健康診断の結果を通知しなければならない。
  - 50 人以上の労働者に対し、雇入時の健康診断を行った場合、その結果を所轄労働基準監督署長に報告しなければならない。
