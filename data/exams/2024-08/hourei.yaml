  choices:
  - 空気調和設備を設けている場合は、当該設備により室に流入する空気が、特定の労働者に直接、継続して及ばないようにし、かつ、室の気流を毎秒0.5 m以下としなければならない。
  - 気流の測定は、室の通常の使用時間中に、当該室の中央部の床上 75 cm以上 120 cm 以下の位置において行う。
  - 空気調和設備を設けている場合は、室に供給される空気中のホルムアルデヒドの量が、1気圧、25 ℃において、0.1 mg / m³以下となるよう当該設備を調整しなければならない。
