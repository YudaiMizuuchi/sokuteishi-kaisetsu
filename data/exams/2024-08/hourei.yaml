  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 労働者を雇い入れたときは、原則として、その労働者が従事する業務に関する安全又は衛生のため必要な事項についての教育を行わなければならない。
  - 法令で定める危険又は有害な業務に労働者をつかせるときは、原則として、その労働者が従事する業務に関する安全又は衛生のための特別の教育を行わなければならない。
  - 法令で定める業種の事業場においては、新たに職務につくこととなった職長に対し、原則として、安全又は衛生のための教育を行わなければならない。
  - 法令で定める教育のうち、特別の教育の講師は、法令で定める要件を満たす者でなければならない。
  - 法令で定める教育のうち、特別の教育を行ったときは、その受講者、科目等の記録を作成して、これを3年間保存しておかなければならない。
  answer: 4
  choice_notes: []
  explanation: '特別の教育の講師について、法令で資格などの要件は定められていません。講師は、教育の科目について十分な知識と経験をもつ者であればよいとされています。「法令で定める要件を満たす者でなければならない」とする選択肢4は誤りです。


    特別教育の記録の3年間保存（選択肢5）は、繰り返し出題されている数字です。


    根拠：労働安全衛生規則第36条〜第39条には、特別教育の講師の資格要件は定められていません（第38条で記録の3年保存、第39条で細目は厚生労働大臣が定めるとされています）。'
  figures: []
  law_note: null
  _key_choice: 法令で定める教育のうち、特別の教育の講師は、法令で定める要件を満たす者でなければならない。
