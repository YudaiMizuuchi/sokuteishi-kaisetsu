  stem: 次の業務又は作業を行うとき、法令上、作業主任者の選任が規定されていないものはどれか。
  choices:
  - セメント製造工程においてセメントを袋詰めする作業
  - 石炭を入れてあるホッパーの内部における作業
  - ドライアイスを使用して冷蔵を行っている冷蔵庫の内部における作業
  - 圧気工法により、大気圧を超える気圧下の作業室において行う作業
  - 鉛蓄電池を解体する工程における鉛等の溶融の業務に係る作業
