  explanation: 'マンガンは特定化学物質の第2類物質（管理第2類物質）で、特別管理物質に当たらないので、作業環境測定の記録は**3年間**保存します。30年とする選択肢4は誤りです。


    1,2-ジクロロエタンは特別有機溶剤で、記録は30年間保存します（選択肢2）。1,2-ジクロルエチレンは第1種有機溶剤で3年間です（選択肢1）。名前の似た2つの物質で、区分と保存期間が違う点が罠です。'
