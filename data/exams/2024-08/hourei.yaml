  - 炭酸ガスが停滞するおそれのある坑内の作業場においては、半月以内ごとに1回、定期に、炭酸ガス濃度を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものにおいては、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の濃度を測定しなければならない。
  - 法令で定める著しい騒音を発する屋内作業場においては、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
