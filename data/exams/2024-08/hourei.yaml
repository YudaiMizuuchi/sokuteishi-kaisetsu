  stem: 個人サンプリング法に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 個人サンプリング法について登録を受けようとする作業環境測定機関には、指定作業場の種類ごとに、少なくとも1人、個人サンプリング法について登録を受けた第1種作業環境測定士が置かれなければならない。
  - 個人サンプリング法について登録を受けた作業環境測定機関が、事業者の委託を受けて指定作業場において個人サンプリング法によるデザイン及びサンプリングを行う場合、個人サンプリング法について登録を受けた作業環境測定士に行わせなければならない。
  - 作業環境測定士として登録を受けるに当たっては、個人サンプリング法のみを実施する作業環境測定士として登録を受けることはできない。
  - 個人サンプリング法における試料採取機器等の装着は、単位作業場所において、労働者にばく露される測定対象物質の量がほぼ均一であると見込まれる作業ごとに行う。
  - 作業の実情にかかわらず、A 測定の評価値及びD 測定の測定値をもとに管理区分の区分を行うことはできない。
  answer: 1
  choice_notes: []
  explanation: '個人サンプリング法について登録を受けようとする作業環境測定機関に求められるのは、個人サンプリング法について登録を受けている作業環境測定士（第1種・第2種を問わない）が置かれることです（作業環境測定法施行規則第54条第1号）。これとは別に、分析を行う作業場の種類ごとに、その種類について登録を受けた第1種作業環境測定士が置かれることも求められます（同条第2号）。「指定作業場の種類ごとに、個人サンプリング法について登録を受けた第1種作業環境測定士を少なくとも1人」とする選択肢1は、2つの基準を混ぜた誤りです。


    個人サンプリング法の登録はデザイン・サンプリングに関わるもので、第2種の測定士も受けることができます（令和5年度第2回 法令 問11）。


    根拠：作業環境測定法施行規則第54条。'
