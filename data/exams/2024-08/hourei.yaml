  stem: 作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める寒冷の屋内作業場においては、半月以内ごとに1回、定期に、当該作業場における気温及び湿度を測定しなければならない。
  - 炭酸ガスが停滞するおそれのある坑内の作業場においては、半月以内ごとに1回、定期に、炭酸ガス濃度を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものにおいては、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の濃度を測定しなければならない。
  - 法令で定める著しい騒音を発する屋内作業場においては、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 第2種酸素欠乏危険作業を行う場合には、その日の作業を開始する前に、当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。
  answer: 2
  choice_notes: []
  explanation: '炭酸ガスが停滞するおそれのある坑内の作業場の炭酸ガス濃度の測定は、**1か月以内ごとに1回**です。半月以内ごととする選択肢2は誤りです。


    坑内の作業場の測定は、炭酸ガス濃度が1か月以内ごと、気温（28℃を超えるおそれのある場合）と通気量が半月以内ごとです。令和6年度第2回でも、同じ数字が出題されています。'
  figures: []
  law_note: null
  _key_choice: 炭酸ガスが停滞するおそれのある坑内の作業場においては、半月以内ごとに１回、定期に、炭酸ガス濃度を測定しなければならない。
