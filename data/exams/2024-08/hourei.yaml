  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 暑熱の屋内作業場における気温及び湿度の測定は、0.5 ℃目盛のアスマン通風乾湿計又はこれと同等以上の性能を有する測定機器を用いて行わなければならない。
  - 騒音の測定点は、原則として、単位作業場所の床面上に 6 m 以下の等間隔で引いた縦の線と横の線との交点の床上 120 cm 以上 150 cm 以下の位置としなければならない。
  - 有害物質の A 測定において、直接捕集方法により試料空気を採取する場合、採取時間は、10 分間以上の継続した時間とする必要はない。
  - 有害物質の A 測定は、作業が定常的に行われている時間に行わなければならない。
  - ベリリウム及びその化合物の捕集には、鉱物性粉じんを捕集する場合と同じ特性を有する分粒装置を用いなければならない。
