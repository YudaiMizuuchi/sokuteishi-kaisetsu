  stem: 化学物質等の性状及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 岩石を切断や研磨した際に生じる粉じんの遊離けい酸含有率を知るためには、もとの岩石の遊離けい酸含有率を測定する。
  - 粒子状物質の空気中での沈降速度は、粒径の2乗に比例する。
  - めっきや充電などの電解を伴う工程では、ミストが発生することが多い。
  - 1,4-ジオキサンは、脂溶性と水溶性をともに有している。
  - クロロホルムの極性は、四塩化炭素の極性より大きい。
  answer: 1
  choice_notes: []
  explanation: '岩石を切断・研磨したときに生じる粉じんの遊離けい酸含有率は、もとの岩石の含有率と同じとは限りません。岩石の成分によって砕けやすさが違い、粉じんになる成分の割合が変わるためです。粉じんそのものを捕集して測定する必要があるので、選択肢1は誤りです。


    作業環境測定で遊離けい酸の含有率を測るのも、空気中に浮遊している粉じんを捕集して分析するためです。


    花崗岩を破砕すると、硬度の小さい長石の方が硬度の大きい石英より微粒子になりやすく、粒径の小さい浮遊粉じんの遊離けい酸含有率は、堆積粉じんより小さいことが多いとされています。


    （参考：『作業環境測定のための労働衛生の知識』）'
