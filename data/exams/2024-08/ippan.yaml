  stem: 粉じんによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病で、その種類には、COPD（慢性閉塞性肺疾患）、間質性肺炎などが含まれる。
  - 結晶質シリカを主たる原因として発症するじん肺をけい肺、石綿を主たる原因として発症するじん肺を石綿肺という。
  - 遊離けい酸は、肺の線維化を起こす作用が強い。
  - じん肺の合併症としては、肺結核、結核性胸膜炎、続発性気管支炎などがある。
  - じん肺は、ある程度進行すると、粉じんへのばく露を中止しても、更に肺の線維化が進行することがある。
  answer: 1
