  stem: 化学物質等による健康障害等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 一酸化炭素は、赤血球中のヘモグロビンと強く結合し、体内組織の酸素欠乏状態を起こす。
  - 二酸化炭素は、気中濃度が 3 ％程度になると呼吸数の増加、脈拍や血圧の上昇が起こり、10 ％以上では数分間で意識不明となり、致命的となる。
  - 二酸化窒素による急性中毒では、粘膜刺激症状がみられ、慢性中毒では、歯牙酸蝕症、慢性気管支炎、胃腸障害などがみられる。
  - 窒素は、空気の約8割を占める無色、無臭の気体であるが、圧気作業や潜水作業などで高分圧の窒素を吸入すると、窒素酔いと言われる飲酒時と似た症状を呈する。
  - ガスや蒸気である有害物質のうち、水への溶解度が高いものは、吸入すると肺胞まで到達しやすい。
  answer: 5
  choice_notes: []
  explanation: '水に溶けやすいガスや蒸気は、吸い込むと上気道（鼻やのど）の粘膜の水分に溶けて、そこで吸収されたり刺激したりします。そのため、肺胞まで到達しにくくなります。「肺胞まで到達しやすい」とする選択肢5は誤りです。


    アンモニアや塩化水素のような水溶性の高いガスは上気道を、二酸化窒素やホスゲンのような水に溶けにくいガスは肺の奥を障害しやすい、と溶けやすさと障害部位を結びつけて覚えましょう。'
