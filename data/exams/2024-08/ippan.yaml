  stem: 振動に対するばく露量を示す指標である日振動ばく露量 A(8) を表す式として、正しいものは次のうちどれか。ただし、周波数補正振動加速度実効値の3軸合成値を a<sub>hv</sub>、1日の振動ばく露時間を T とする。
