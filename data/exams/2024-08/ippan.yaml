  explanation: '鉱物性粉じんの管理濃度は、遊離けい酸の含有率を Q（％）としたとき、


    E ＝ 3.0 ÷ (1.19Q ＋ 1)


    で求めます。1.49Q とする選択肢1は誤りです。


    遊離けい酸の含有率が高いほど、管理濃度は小さく（厳しく）なります。遊離けい酸を含まない（Q ＝ 0）とき、管理濃度は 3.0 mg/m³ です。'
