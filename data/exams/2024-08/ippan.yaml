  choices:
  - 防毒マスクは、その形状及び使用の範囲により、隔離式、直結式、直結式小型の3種類に区分され、隔離式のものが最も高濃度下で使用することができる。
  - 有機ガス用吸収缶には活性炭が使用されているが、メタノールは活性炭にほとんど吸収されないため、有機ガス用吸収缶の除毒能力試験に使われるシクロヘキサンと比べて破過時間が著しく短くなる。
  - 一酸化炭素用吸収缶は、触媒作用により、一酸化炭素を二酸化炭素に変化させている。
  - 防じん機能を有する防毒マスクの粒子捕集効率の区分は、防じんマスクの粒子捕集効率の区分と同じである。
  - 防毒マスクを着用するときは、ヘルメットの上からしめひもを使用するようにすると、面体と顔との密着性を高めることができる。
  answer: 5
  choice_notes: []
  explanation: '防毒マスクのしめひもをヘルメットの上から使うと、面体を顔に押し付ける力が弱くなったり、ずれたりして、密着性が**悪く**なります。しめひもは頭に直接かけるので、選択肢5は誤りです。


    密着性の確認には、陰圧法や陽圧法などのフィットチェックを使います。面体と顔の間にタオルなどを挟むのも、密着性を損なうので避けます。


