  choices:
  - 酸素欠乏症の症状は、酸素を大量に必要とする大脳皮質の機能低下から始まる。
  - 第一鉄化合物の含有量が多い水が流入している排水暗渠やマンホール内の空気は、酸素欠乏状態になっていることがある。
