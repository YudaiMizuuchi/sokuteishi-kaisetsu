  - クロム酸及び三酸化ヒ素は、いずれも鼻中隔穿孔を引き起こす。
  - 無機水銀は、気道からのほか消化管からも吸収され、腎機能障害を引き起こし、血尿、蛋白尿、無尿などを発症する。
  - 鉛中毒では、ヘモグロビンの構成要素であるヘムの合成に関与する酵素の阻害による貧血、伸筋麻痺による垂れ手、腎機能障害などが生じる。
  - 金属熱は、亜鉛や銅などのヒュームを吸入して発生する疾病で、悪寒や発熱、関節痛などの症状がみられ、記憶障害や脱力感などの後遺症が出ることが多い。
