  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」で定められた危険有害性クラスⒶとその内容を表す絵表示Ⓑとの次の組合せのうち、誤っているものはどれか。ただし、絵表示の枠は赤色とする。
  choices:
  - 金属腐食性 ／ 図の1
  - 皮膚感作性 ／ 図の2
  - 呼吸器感作性 ／ 図の3
  - 発がん性 ／ 図の4
  - 酸化性固体 ／ 図の5
  answer: 4
  choice_notes: []
  explanation: '発がん性を表す絵表示は「健康有害性」（人の上半身）です。「どくろ」は急性毒性（区分1〜3）を表すので、発がん性とどくろを組み合わせた（4）が誤りです。


    金属腐食性は腐食性、皮膚感作性は感嘆符、呼吸器感作性は健康有害性、酸化性固体は円上の炎の絵表示で、いずれも正しい組合せです。皮膚感作性は感嘆符、呼吸器感作性は健康有害性と、同じ感作性でも絵表示が違う点に注意しましょう。'
  figures:
