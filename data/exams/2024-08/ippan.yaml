  stem: 作業環境評価基準に定める「管理濃度」及び日本産業衛生学会の「許容濃度等の勧告」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じんの管理濃度 E（mg /m³）は、その遊離けい酸の含有率をQ（％）とした場合、E ＝3.0 ／（1.49Q＋1）により算定される。
  - D 測定を行った場合は、D 測定値を管理濃度と直接比較して、管理区分の決定に用いる。
  - 許容濃度を利用するにあたっては、労働強度、温熱条件、気圧などを考慮する必要がある。
  - 許容濃度等の勧告において、ヒトに対する生殖毒性については、第1群、第2群、第3群の3種類に分類されており、ヒトに対して生殖毒性を示すことが知られている物質は、第1群に分類されている。
  - 許容濃度等の勧告における感作性物質には、アレルギー性呼吸器疾患を誘発する気道感作性物質と、アレルギー性皮膚反応を誘発する皮膚感作性物質がある。
  answer: 1
