  stem: リスクアセスメントに関する次の記述のうち、誤っているものはどれか。ただし、指針とは、厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」をいう。
  choices:
  - 厚生労働省版コントロールバンディングでは、液体である化学物質を取り扱う作業については、化学物質の有害性、揮発性・飛散性及び取扱量の3つの要素によって化学物質のランク及びリスクレベルが表示され、リスクレベルに応じたリスク低減措置が決定される。
  - CREATE-SIMPLE（クリエイト・シンプル）は、あらゆる業種に向けたリスクアセスメント支援ツールで、吸入ばく露に加えて、経皮ばく露を考慮したリスク評価を行うことができる。
  - 指針では、リスクアセスメントの実施時期として、リスクアセスメント実施体制に変更があったとき、総括安全衛生管理者、衛生管理者、化学物質管理者等に異動があったとき、があげられている。
  - 指針では、健康障害に係るリスクを見積もる方法として、発生可能性及び重篤度を一定の尺度によりそれぞれ数値化し、それらを加算又は乗算等する方法、があげられている。
  - 指針では、リスク低減措置の検討において、より優先順位の高い措置を実施すれば十分にリスクが低減される場合には、その措置よりも優先順位の低い措置の検討は必要ない、とされている。
  answer: 3
  choice_notes: []
  explanation: '指針で示されているリスクアセスメントの実施時期は、化学物質等を新たに採用・変更するとき、作業方法や手順を新たに採用・変更するときなど、リスクが変わるおそれのあるときです。実施体制の変更や、衛生管理者などの担当者の異動は、実施時期には挙げられていないので、選択肢3は誤りです。


    リスクアセスメントは「リスクが変わるとき」に行うもので、「担当する人が変わるとき」に行うものではありません。'
  figures: []
  law_note: null
