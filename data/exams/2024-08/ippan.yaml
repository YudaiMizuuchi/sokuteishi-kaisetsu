  stem: 化学物質による健康影響等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 量-影響関係とは、個体について、有害物質へのばく露量と、ある生体影響の大きさとの関係を示したものである。
  - 無影響量（NOEL）とは、毒性試験において影響が認められなかった最高のばく露量をいう。
  - 最小影響量（LOEL）とは、毒性試験において何らかの影響が認められた最低のばく露量をいう。
  - 半数致死濃度（LC₅₀）とは、短時間の吸入ばく露で一群の実験動物の50 ％を死亡させると予想される濃度である。
  - 変異原性試験は、化学物質による胎児期の臓器・組織形成への影響を見るためのものである。
