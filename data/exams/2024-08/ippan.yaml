  choices:
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対しておそらく発がん性があると考えられている。
  - クロム酸及び三酸化ヒ素は、いずれも鼻中隔穿孔を引き起こす。
  - 無機水銀は、気道からのほか消化管からも吸収され、腎機能障害を引き起こし、血尿、蛋白尿、無尿などを発症する。
