  explanation: 'ガラス製の試料セルは、**可視部の光を吸収しません**。ガラスセルは、可視部の測定に使えます。紫外部の光は吸収するので、紫外部の測定には石英セルを使います。「可視光を吸収するため、可視光の測定には使用しない」とする選択肢4は誤りです。


    吸光度は、試料液の濃度と光路長に比例します（ランベルト・ベールの法則）。試料に照射する光は単色光で、吸光度は入射光の強度に依存しません。モル吸光係数は、物質が特定の波長の光を吸収する程度を示します。


    （参考：『機器分析の実務』）'
