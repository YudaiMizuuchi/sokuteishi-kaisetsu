  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 吸光度は、試料液の濃度と光路長に比例する。
  - 試料溶液に照射する光は、単色光である。
  - モル吸光係数は、ある物質が特定の波長の光を吸収する程度を示す。
  - ガラス製の試料セルは可視光を吸収するため、可視光の測定には使用しない。
  - 吸光度は、入射光の強度に依存しない。
  answer: 4
