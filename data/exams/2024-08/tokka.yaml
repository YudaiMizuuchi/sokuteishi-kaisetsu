  stem: ある化合物の水溶液を吸光光度分析法で測定したところ、測定波長における透過率は 60 ％であった。その波長におけるモル吸光係数を 8.26 × 10³ cm⁻¹･mol⁻¹･L、セルの光路長を 1.0 cmとすると、この化合物のモル濃度に最も近いものは次のうちどれか。ただし、log₁₀2 = 0.301、log₁₀3 = 0.477 とする。
  columns: null
  choices:
  - 1.3 × 10 ⁻⁵ mol･L⁻¹
  - 2.0 × 10 ⁻⁵ mol･L⁻¹
  - 2.7 × 10 ⁻⁵ mol･L⁻¹
  - 3.6 × 10 ⁻⁵ mol･L⁻¹
  - 5.8 × 10 ⁻⁵ mol･L⁻¹
  answer: 3
  choice_notes: []
  explanation: '吸光度 A ＝ −log₁₀（透過率）です。透過率が60％（0.6）のとき、


    A ＝ −log₁₀0.6 ＝ −（log₁₀6 − 1）＝ 1 −（log₁₀2 ＋ log₁₀3）＝ 1 −（0.301 ＋ 0.477）＝ 0.222


    ランベルト・ベールの法則 A ＝ ε・c・l から、


    c ＝ A／（ε・l）＝ 0.222／（8.26 × 10³ × 1.0）≒ 2.7 × 10⁻⁵ mol/L


    よって（3）です。'
