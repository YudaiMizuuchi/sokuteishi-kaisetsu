  stem: ガスクロマトグラフ分析法による環境空気中のアクリルアミド濃度の測定に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 捕集には、グラスファイバーろ紙及び活性炭フェルトを用いる。
  - 捕集は、30 L･min⁻¹ の一定流量で試料空気を吸引する。
  - 捕集材からの脱着には、プロピオンアミド（内部標準物質）入りメタノールが用いられる。
  - 捕集後の捕集材は、共栓付試験管に入れ-20 ℃で保存する。
  - 検出器には、炎光光度検出器（FPD）を使用する。
  answer: 5
  choice_notes: []
  explanation: 'アクリルアミドのガスクロマトグラフ分析法は、次のとおりです。


    - 捕集：グラスファイバーろ紙と活性炭フェルトを装着したサンプラーで、30 L/minの一定流量で吸引します（選択肢1、2）。

    - 保存：ろ紙とフェルトは、共栓付き試験管に入れて密栓し、−20℃で保存します（選択肢4）。

    - 抽出：プロピオンアミド（内部標準物質）入りメタノールで抽出します（選択肢3）。

    - 検出器：**FTD**（フレーム熱イオン化検出器）を使います。「炎光光度検出器（FPD）」とする選択肢5は誤りです。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
