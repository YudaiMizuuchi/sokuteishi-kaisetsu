  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 逆相クロマトグラフ法では、イオンに解離している試料であっても分析が可能である。
  - 移動相の脱気には、超音波処理や減圧処理が用いられる。
  - 移動相の粘性が高いとカラム圧力は低くなる。
