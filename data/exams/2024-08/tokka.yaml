  stem: 液体捕集法の捕集率に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 気体と捕集液との接触面積が大きいほど、捕集率は高くなる。
  - 捕集液内での気体の滞留時間が長いほど、捕集率は高くなる。
  - 化学反応によって捕集する場合は、捕集液の温度が低いと捕集率が低下することがある。
  - 揮発性物質を単に捕集液に溶解させて捕集する場合は、捕集液の温度が高いほど、捕集率は高くなる。
  - 捕集率は、捕集器具を2組直列に連結して通気し、それぞれの器具での捕集量を用いて算出することができる。
