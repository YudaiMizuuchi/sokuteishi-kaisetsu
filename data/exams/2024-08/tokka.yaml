  stem: ガスクロマトグラフ分析法の検出器に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 検出器温度は、検出器の汚染を防止し感度を安定させるため、カラム温度より高温に保つ。
  - キャリアガスの種類又は流量が検出器に適さない場合には、検出器にメイクアップガスを追加する。
  - 水素炎イオン化検出器（FID）は、ハロゲン化炭化水素を検出できない。
  - 電子捕獲検出器（ECD）の検量線の直線範囲は、水素炎イオン化検出器（FID）よりも狭い。
  - 炎光光度検出器（FPD）では、還元炎を用いる。
  answer: 3
  choice_notes: []
  explanation: '水素炎イオン化検出器（FID）は、有機化合物全般を検出するので、**ハロゲン化炭化水素も検出できます**（ハロゲンに特に高感度なのは、電子捕獲検出器（ECD）です）。「ハロゲン化炭化水素を検出できない」とする選択肢3は誤りです。


    検出器の温度は、カラム温度より高く保って、汚染を防ぎます。キャリアガスの種類や流量が検出器に適さないときは、メイクアップガスを追加します。ECDの検量線の直線範囲は、FIDより狭いです。


    （参考：『機器分析の実務』）'
