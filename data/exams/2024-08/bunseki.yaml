  stem: 分析に使用するガラス製体積計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ビュレットは最小目盛の 1/ 10までを読みとる。
  - ホールピペットの容量に対する許容誤差の割合は、一般に、容量が小さいものの方が大きい。
  - メスフラスコの容量の検定は、標線まで水を入れた後、排出した水の質量と温度を精密に測定して行われる。
  - 一般的なマイクロシリンジでは、針の内容積は目盛りが示す体積に含まれない。
  - マイクロシリンジは、体積計としての基準はなく、その精度はメーカーが独自に制定したものである。
  answer: 3
  choice_notes: []
  explanation: 'メスフラスコは、標線まで入れたときの**中身の体積**が正しくなるように作られた「受用」の体積計です。容量の検定は、標線まで入れた水の質量と温度から行い、排出した水で量るものではないので、選択肢3は誤りです。


    排出した量が正しくなるように作られた「出用」の体積計は、ホールピペットやビュレットです。メスフラスコとピペットでは、量る体積の意味が違います。'
