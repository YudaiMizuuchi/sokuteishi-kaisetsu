  stem: ICP 発光分析法について、その分析に関する項目Ⓐとそれに関連する事項又は記述Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 測定波長の選択 ／ 回折格子
  - イオン化干渉 ／ 軸方向観察に比べ横方向観察の方が、より影響が大きい
  - 検量線の直線範囲 ／ 原子吸光分析法に比べ広い
  - プラズマ中で発光する測定対象原子 ／ 中性原子又はイオンの励起状態
  - 多元素の同時測定 ／ 可能
  answer: 2
  choice_notes: []
  explanation: 'ICP 発光分析法で、アルカリ金属などのイオン化しやすい元素が共存することで起こるイオン化干渉は、プラズマの中心部の光を長い光路で取り込む**軸方向観測**の方が影響を受けやすいとされています。横方向観測の方が影響が大きいとする選択肢2は誤りです。


    軸方向観測は感度が高い代わりに干渉を受けやすく、横方向観測は感度は下がるが干渉が少ない、という関係です。令和5年度第2回の解説とあわせて押さえておきましょう。


    （参考：『作業環境測定のための機器分析の実務［特定化学物質・金属類・有機溶剤］』（2019年 初版） 「分析法の種類」のICP発光分析法（観測方向））'
