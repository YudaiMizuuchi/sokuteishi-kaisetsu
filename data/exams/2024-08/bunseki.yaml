  - ジメチルエーテルは酢酸の酸化で得られる。
  - キノンはフェノールの酸化で得られる。
  answer: 4
  choice_notes: []
  explanation: 'ジメチルエーテルは、メタノール2分子から水がとれる脱水反応などで得られる物質で、酢酸を酸化して得られるものではありません。選択肢4は誤りです。


    アルコールを酸化すると、第一級アルコールはアルデヒド → カルボン酸に、第二級アルコール（イソプロピルアルコール）はケトン（アセトン）になります。酢酸はエタノールの酸化の行き着く先で、さらに酸化してもエーテルにはなりません。'
