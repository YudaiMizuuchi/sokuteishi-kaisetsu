  stem: 物理量又は物理定数Ⓐとその SI 単位記号Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 電気量（電荷） ／ C
  - エネルギー ／ J
  - 光度 ／ cd
  - 圧力 ／ N･m⁻³
  - 気体定数 ／ J･K⁻¹･mol⁻¹
  answer: 4
  choice_notes: []
  explanation: '圧力の SI 単位は Pa（パスカル）で、N・m⁻²（1 m² あたりの力）です。N・m⁻³ とする選択肢4は誤りです。


    圧力は「力 ÷ 面積」なので、面積の m² で割ります。m³ で割ると、体積あたりの量になってしまいます。'
  figures: []
  law_note: null
