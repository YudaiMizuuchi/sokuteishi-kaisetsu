  stem: 'CuSO₄･5 H₂Oのモル質量を有効数字で表した場合、正しいものは下のうちどれか。ただし、各元素の原子量は次のとおりとする。


    Cu 63.546、S 32.059、O 15.9994、H 1.0079'
  choices:
  - 249 g･mol⁻¹
  - 249.7 g･mol⁻¹
  - 249.68 g･mol⁻¹
  - 249.679 g･mol⁻¹
  - 249.6786 g･mol⁻¹
  answer: 4
  choice_notes: []
  explanation: '原子量を足し合わせるときは、足し算の有効数字のルール（小数点以下の桁数が最も少ないものに合わせる）を使います。


    63.546 ＋ 32.059 ＋ 15.9994 × 9 ＋ 1.0079 × 10 ＝ 63.546 ＋ 32.059 ＋ 143.9946 ＋ 10.079 ＝ 249.6786


    小数点以下の桁数が最も少ないのは、63.546、32.059、10.079 の3桁なので、結果も小数点以下3桁に丸めて **249.679 g/mol** です。よって（4）が正しいものです。


    掛け算・割り算は「有効数字の桁数」、足し算・引き算は「小数点以下の桁数」で合わせる、と区別して覚えましょう。'
  figures: []
  law_note: null
  _key_choice: ･5H
  _stem_head: CuSO
