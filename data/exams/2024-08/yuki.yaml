  stem: ある有機溶剤5.00 mLを精製水で 100 mLとし、この溶液1.00 mLをはかりとり、発色させた上で、更に精製水で100 mLとした。この溶液を波長420 nm で光路長 1.00 cmのセルを用いて吸光度を測定したところ 0.600 となった。発色した物質のモル吸光係数の値に最も近いものは次のうちどれか。ただし、有機溶剤の密度は 0.900 g･cm⁻³（25 ℃）、モル質量は88.1 g･mol⁻¹とする。
  columns: null
  choices:
  - 1.17 × 10² cm⁻¹･mol⁻¹･L
  - 1.33 × 10² cm⁻¹･mol⁻¹･L
  - 2.26 × 10² cm⁻¹･mol⁻¹･L
  - 4.50 × 10² cm⁻¹･mol⁻¹･L
  - 5.11 × 10² cm⁻¹･mol⁻¹･L
  answer: 1
  choice_notes: []
  explanation: '次の順で計算します。


    1. 有機溶剤の物質量：5.00 mL × 0.900 g/cm³ ＝ 4.50 g、4.50 ÷ 88.1 ＝ 0.0511 mol

    2. 100 mLにしたときの濃度：0.0511 mol ÷ 0.100 L ＝ 0.511 mol/L

    3. 1.00 mLを100 mLに薄めたときの濃度：0.511 × 1.00／100 ＝ 5.11 × 10⁻³ mol/L

    4. モル吸光係数：ε ＝ A／（c・l）＝ 0.600／（5.11 × 10⁻³ × 1.00）≒ 117 ＝ **1.17 × 10²** cm⁻¹・mol⁻¹・L


    よって（1）です。'
