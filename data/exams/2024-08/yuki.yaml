  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集瓶は、捕集瓶内の圧力を 13.3 kPa以下にしたものを使用する。
  - 真空捕集瓶のコックには、グリースは使用しない。
  - 流量計の校正には、基準流量計として、石けん膜流量計を用いることができる。
  - 校正した流量計を用いても、捕集装置の圧力損失が著しく大きいと、差圧計の値を用いた流量補正が必要な場合がある。
  - 捕集袋により試料を採取する場合には、内容積 5 L以上のものを用いる。
  answer: 1
  choice_notes: []
  explanation: '真空捕集瓶は、瓶内の圧力を**1.33 kPa以下**に減圧して使います。「13.3 kPa以下」とする選択肢1は誤りです。


    コックのすり合わせ部には、グリースを使いません。流量計の校正には、石けん膜流量計を基準流量計として使えます。捕集装置の圧力損失が著しく大きいときは、差圧計の値による流量補正が必要になることがあります。捕集袋は、5 L以上のものを使います。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
