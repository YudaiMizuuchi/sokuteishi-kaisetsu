    吸光度Aと透過率T（％）の関係は、A ＝ −log₁₀（T／100）＝ 2 − log₁₀T なので、log₁₀T ＝ 2 − A です。通常、青色溶液は、赤色溶液より長波長側の光を吸収します。'
