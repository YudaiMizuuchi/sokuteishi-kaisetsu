  stem: ガスクロマトグラフ分析法に用いる検量線に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 標準溶液は、対象の標準物質を脱着溶媒で適切な濃度範囲内に希釈したものを用いる。
  - 内標準法で用いられる内標準物質には、目的物質と物理的・化学的によく似ているが、実際の試料中に含まれず、かつ、測定を妨害しない物質を選択する。
  - 比較的高濃度の溶液を標準原液として冷暗所に保管し、検量線作成の都度、適切に希釈して標準系列液を調製する。
  - 内標準法では、ガスクロマトグラフに導入した試料の体積を正確に測定する必要はない。
  - 検量線範囲を超えた高濃度の試料液については、検量線を外挿して定量値を求める。
  answer: 5
  choice_notes: []
  explanation: '検量線の範囲を超える高濃度の試料液は、検量線を**外挿して定量してはいけません**。試料液を希釈して、検量線の範囲内に入る濃度にして、測定し直します。選択肢5は誤りです。


    標準溶液は、対象の標準物質を脱着溶媒で希釈して調製します。内標準物質は、目的物質に物理的・化学的に似ていて、試料中に含まれず、測定を妨害しないものを選びます。内標準法では、導入した試料の体積を、正確に測る必要がありません。標準原液は、高濃度で冷暗所に保管し、検量線作成のたびに希釈します。'
