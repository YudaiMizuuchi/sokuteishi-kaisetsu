  stem: 有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  columns: null
  choices:
  - 真空捕集瓶による試料空気の採取には、内容積が 1 L 以上のガラス製の捕集瓶が用いられるが、その内面は測定対象物質に対して不活性でなければならない。
  - 真空捕集瓶に試料空気を採取する際の吸引空気流量は一定である。
  - 活性炭管に試料空気を捕集する際は、前もって活性炭管を接続した状態で電動ポンプの流量を、石けん膜流量計で校正する。
  - 小型バブラーに試料空気を捕集する際は、吸引する電動ポンプの流量を石けん膜流量計で校正する。
  - ミゼットインピンジャーに粒径 3 ～ 5 mmのグラスビーズを入れておくと、ガス状物質の捕集率が高まるのは、試料空気と液体の接触面積が大きくなるからである。
  answer: 2
  choice_notes: []
  explanation: '真空捕集瓶に試料空気を採取するときは、コックを開いて徐々に吸引し、瓶内の圧力が大気圧と等しくなるまで続けます。瓶内の圧力が上がるにつれて、吸引される流量は**減っていく**ので、吸引流量は一定ではありません。「一定である」とする選択肢2は誤りです。そのため、コックの開き具合を一定にして、吸引に要する時間をあらかじめ測定しておきます。


    活性炭管を接続した状態で、電動ポンプの流量を石けん膜流量計で校正します。ミゼットインピンジャーにグラスビーズを入れると、試料空気と液体の接触面積が大きくなり、捕集率が高まります。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
