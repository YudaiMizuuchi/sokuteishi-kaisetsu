  stem: 次の記述のうち、労働安全衛生関係法令上、誤っているものはどれか。
  choices:
  - はんだ付けの業務を行う自然換気が不十分な屋内作業場に設ける全体換気装置は、その業務に従事する労働者1人について100m³/h以上の換気能力を有するものでなければならない。
  - 事業者は、屋内のセメントを袋詰めする箇所に設置する局所排気装置の排風機については、原則として、除じんした後の空気が通る位置に設けなければならない。
  - 第二種有機溶剤等に係る有機溶剤業務に労働者を従事させるために、当該有機溶剤業務を行う屋内作業場に設けた局所排気装置で空気清浄装置を設けていないものの排気口の高さは、排気口から排出される有機溶剤の濃度が厚生労働大臣が定める濃度に満たない場合を除き、屋根から1.5m以上としなければならない。
  - 事業者は、硫化水素を含有する気体を排出するために設置すべき局所排気装置には、吸収方式若しくは酸化・還元方式による排ガス処理装置又はこれらと同等以上の性能を有する排ガス処理装置を設けなければならない。
  - 事業者は、石綿等の取扱いに伴い、石綿を発散する場所については、原則として、局所排気装置、プッシュプル型換気装置又は全体換気装置を設けなければならない。
  answer: 5
  choice_notes: []
  explanation: '石綿等を発散する場所には、原則として、発散源を密閉する設備、局所排気装置又はプッシュプル型換気装置を設けなければならず、全体換気装置では足りません。選択肢5は誤りです。


    根拠：石綿障害予防規則第12条（石綿等の粉じんが発散する屋内作業場には、発散源を密閉する設備、局所排気装置又はプッシュプル型換気装置を設ける。全体換気装置は、これらの設置が著しく困難なときなどに限って講じる措置）。'
