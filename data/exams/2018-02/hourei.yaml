  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、定期健康診断を行ったときは、事業場の規模にかかわらず、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 事業者は、定期健康診断の結果、異常の所見があると診断された労働者については、その健康を保持するために必要な措置について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に報告する必要はない。
  - 事業者は、定期健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 事業者は、深夜業を含む業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、法令で定める健康診断を行わなければならないが、その項目のうち、胸部エックス線検査については、1年以内ごとに1回、定期に、行えばよい。
