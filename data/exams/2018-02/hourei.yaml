  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、常時使用する労働者の数が10人以上50人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に関係なく産業医を選任しなければならない。
  - 衛生管理者は、少なくとも毎週1回作業場等を巡視し、設備、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  - 事業者は、常時1,000人を超える労働者を使用する事業場においては、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 事業者は、総括安全衛生管理者には、事業場においてその事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
  answer: 5
  choice_notes: []
  explanation: 総括安全衛生管理者には、その事業場で事業の実施を統括管理する者を充てます。「これに準ずる者」を充てることはできないので、選択肢5は誤りです。
