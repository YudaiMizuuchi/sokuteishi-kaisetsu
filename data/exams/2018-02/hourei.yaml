  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始する前に、当該作業場における空気中の酸素の濃度を測定しなければならない。
  - 多量の蒸気を使用して金属の洗浄の業務を行う多湿な屋内作業場については、1か月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 多量のドライアイスを取り扱う業務を行う寒冷な屋内作業場については、半月以内ごとに1回、定期に、気温及び湿度を測定しなければならない。
  answer: 2
  choice_notes: []
  explanation: '多量の蒸気を使用する多湿な屋内作業場の気温・湿度の測定は、**半月以内ごとに1回**です。1か月以内ごととする選択肢2は誤りです。


    暑熱・寒冷・多湿の屋内作業場の気温・湿度の測定は、いずれも半月以内ごとです。'
