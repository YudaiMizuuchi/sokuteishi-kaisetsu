  - 第2種酸素欠乏危険場所において作業を行う場合の当該作業場について法令に基づき行う硫化水素の濃度の測定は、作業環境測定士ではない者に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場については、デザイン及びサンプリングの業務を行うことができない。
