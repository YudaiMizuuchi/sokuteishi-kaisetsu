  - 第二鉄塩類を含有している地層に接する井戸の内部における作業は、第1種酸素欠乏危険作業である。
  - 海水が滞留しているピットの内部における作業は、第2種酸素欠乏危険作業である。
  - 乾性油その他空気中の酸素を吸収する物質を入れてあるタンクの内部における作業は、第1種酸素欠乏危険作業である。
  - し尿又は汚水を入れてあるタンクの内部における作業は、第2種酸素欠乏危険作業である。
  answer: 2
  choice_notes: []
  explanation: '**第二鉄塩類**は既に酸化された状態で酸素を消費しないので、第二鉄塩類を含む地層に接する井戸の内部は、酸素欠乏危険場所には当たりません。第1種酸素欠乏危険作業に当たるのは、**第一鉄塩類**を含む地層に接する井戸などの内部です。選択肢2は誤りです。


    根拠：労働安全衛生法施行令別表第六第一号ロ。'
