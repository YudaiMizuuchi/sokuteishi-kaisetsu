  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求められる。
  - 遊離けい酸を含まない鉱物性粉じんの管理濃度は、3.0mg/m³である。
  - アルミニウムを含む粉じんや炭素を含む粉じんは、じん肺を起こすことがある。
  - 吸入性粉じんの分粒装置は、空気力学相当径4μmの粉じん粒子を50%透過する性能を有する。
  - 鋼板のアーク溶接で発生するヒュームの主成分は、一般に、酸化鉄である。
