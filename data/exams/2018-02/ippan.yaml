  stem: 労働安全衛生マネジメントシステムに関する指針(厚生労働省)に関する次の記述のうち、誤っているものはどれか。
  choices:
  - この指針は、法令の規定に基づき、機械や化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めている。
  - 事業者は、安全衛生方針を表明し、労働者及び関係請負人その他の関係者に周知させる。
  - 労働安全衛生マネジメントシステムの全般的な見直しとは、事業場の安全衛生水準の向上の状況、社会情勢の変化等を考慮して、事業者自らがシステムの妥当性及び有効性を評価し、その結果を踏まえて必要な改善を実施することをいう。
  - 労働安全衛生マネジメントシステムに従って行う措置が適切に実施されているかどうかについて、安全衛生計画の期間を考慮して事業者が行う調査及び評価をシステム監査という。
  - システム監査の実施者は、必要な能力を有し、監査の対象となる部署に所属していない等、システム監査の実施に当たって公平かつ客観的な立場にある者であれば、企業内部の者、企業外部の者のいずれが実施しても差し支えない。
  answer: 1
  choice_notes: []
  explanation: '労働安全衛生マネジメントシステムに関する指針は、事業者が安全衛生方針の表明から計画・実施・評価・改善までを自主的に回すための基本的な事項を定めたもので、機械や化学物質による危険・健康障害を防止する具体的な措置を定めるものではありません。選択肢1は誤りです。


