  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多くの有機化合物は、肝臓で代謝されて排泄される。
  - テトラクロロエチレンの代謝物としてトリクロロ酢酸がある。
  - 粒子状物質が経気道的に侵入した場合、空気力学相当径が1～2μmの大きさの粒子は肺胞に沈着しやすい。
  - 鉛の生物学的モニタリングの指標として、血液中の鉛、尿中のδ-アミノレブリン酸の量などがある。
  - キシレンの生物学的モニタリングの指標として、尿中の馬尿酸が用いられる。
