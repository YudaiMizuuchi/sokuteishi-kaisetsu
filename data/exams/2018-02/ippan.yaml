  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 一酸化炭素用防毒マスクの吸収缶は、使用する環境の湿度が高いほど破過時間が短くなる傾向にある。
  - 作業環境中に粉じん等に混じってオイルミスト等が存在する場合にあっては、液体の試験粒子を用いた粒子捕集効率試験に合格した吸収缶を選ぶ、
  - 有機ガス用防毒マスクの吸収缶の色は黒色であり、一酸化炭素用防毒マスクの吸収缶の色は赤色である。
  - 直結式防毒マスクは、隔離式防毒マスクより使用できる環境空気中の対象ガス濃度の範囲が広い。
  - 防毒マスクの使用中に臭気等を感知した場合を使用限度時間の到来として吸収缶の交換時期とする方法は、有害物質の臭気等を感知できる濃度がばく露限界濃度より著しく小さい物質に限り行うことができる。
  answer: 4
  choice_notes: []
  explanation: '直結式防毒マスクは、隔離式防毒マスクより吸収缶が小さく、使用できる対象ガスの濃度の範囲は**狭く**なります。「直結式の方が広い」とする選択肢4は誤りです。


    令和4年度第2回にも、同じ論点があります。'
  figures: []
  law_note: 令和5年5月25日の通達（基発0525第3号）で、吸収缶の破過を知るために、有毒ガス等の臭いに頼るのは適切ではないとされました（第3の2(1)ウ）。あわせて、旧通達（平成17年の防毒マスク通達）は廃止されています。この問題は旧通達のもとでの出題で、『臭気を感知できる濃度がばく露限界濃度より著しく低い物質に限り、臭気を感知した時点を交換時期にできる』という記述を、正しいものとして扱っています。現行の通達では、臭いで交換時期を決めず、取扱説明書・破過曲線図・使用時間記録カードなどにもとづいて、使用限度時間をあらかじめ設定し、その時間を限度に使います（同2(1)ア・イ）。
