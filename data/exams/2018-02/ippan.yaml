  stem: 化学物質等による危険性又は有害性等の調査等に関する指針(厚生労働省)に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 「危険性又は有害性」とは、ILO等において、「危険有害要因」、「ハザード」等の用語で表現されているものである。
  - リスクの見積りは、数値化して行わなければならない。
  - リスクは、ILOの化学物質リスク簡易評価法(コントロール・バンディング)等を用いて見積もることができる。
  - 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、(ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - リスクの低減措置の検討においては、化学物質等の有害性に応じた有効な保護具の使用よりも、作業手順の改善、立入禁止等の管理的対策を優先する。
  answer: 2
  choice_notes: []
  explanation: 'リスクアセスメント指針では、リスクの見積りは、マトリクス法や数値化法、枝分かれ図を用いる方法、コントロール・バンディングなど、さまざまな方法で行うことができ、数値化して行わなければならないわけではありません。選択肢2は誤りです。


