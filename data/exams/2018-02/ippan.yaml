  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 窒素は、無色、無臭の気体であるが、高気圧作業においては麻酔作用などが現れる。
  - 一酸化炭素は、ヘモグロビンの合成を阻害し、貧血の原因となる。
  - メチル水銀の慢性中毒では、視野狭窄などの症状が現れる。
  - マンガンによる慢性中毒では、筋のこわばり、歩行困難、発語障害などの症状がみられる。
  - 石綿粉じんは、胸膜肥厚、肺がんなどを生じる。
  answer: 2
  choice_notes: []
  explanation: '一酸化炭素は、ヘモグロビンと強く**結合**して、酸素を運べなくします。ヘモグロビンの合成を阻害して貧血を起こすのは鉛の特徴なので、選択肢2は誤りです。


    令和2年度第2回・令和元年度第2回にも、同じ論点があります。'
