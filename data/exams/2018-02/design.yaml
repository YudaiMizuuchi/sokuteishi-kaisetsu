  stem: 作業環境測定基準に基づいて行われる作業環境測定における有害物質の空気中の濃度等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中における有害物質の濃度は、通常、25℃、1気圧の条件下における環境空気中濃度として示している。
  - 水銀の管理濃度は、ppmで表されている。
  - 石綿の管理濃度は、繊維数濃度で表されている。
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が低いほど大きな値となる。
  - 空気中の有機溶剤蒸気の体積分率0.1%は、1,000ppmに相当する。
  answer: 2
  choice_notes: []
  explanation: '水銀の管理濃度は、**mg/m³**（水銀として 0.025 mg/m³）で表されています。ppm とする選択肢2は誤りです。


    ガス・蒸気でも、金属の蒸気である水銀は、他の金属と同じく質量濃度で管理します。'
  figures: []
  law_note: null
  _key_choice: 水銀の管理濃度は、ppmで表されている。
