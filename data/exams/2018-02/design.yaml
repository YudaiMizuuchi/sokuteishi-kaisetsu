  stem: 有害物質のA測定の測定点の設定方法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の発生源が等間隔で配列されている場合には、測定点の縦あるいは横の線の間隔が発生源の間隔と一致しないようにする。
  - 測定点を決めるために等間隔で引いた縦の線と横の線は、一般に直交するが、建屋の形状などにより直交しない場合もある。
  - 「床上」の「床」とは、建物の床とは別に作業床がある場合には、その作業床をいう。
  - 測定点と測定点の間隔は、原則として、6m以下の等間隔であれば、縦方向と横方向の間隔は異なっていてもよい。
  - 測定点は、隣接する他の単位作業場所の測定点と重複してはならない。
  answer: 5
