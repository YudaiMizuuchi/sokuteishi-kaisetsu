  stem: 相対濃度指示方法における鉱物性粉じんの測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの質量濃度をC、相対濃度をR、質量濃度変換係数をKとすると、K=C/Rという関係が成り立つ。
  - 相対濃度指示方法における相対濃度は、光散乱方式では［cpm］、圧電天秤方式では［mg/m³］で示される。
  - 相対濃度計を用いてA測定を行う場合、1測定点におけるサンプリング時間は10分未満でもよい。
  - 散乱光検出部を通過する空気の速度と散乱光の強さとは無関係である。
  - 光散乱方式の粉じん計において、粒子の組成と粒径分布が一定で、濃度に変動がなければ、相対濃度の値は、測定時間に比例する。
