  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場の区域を、労働者の行動範囲、有害物質の分布状況などの判断基準によって層別化を行う。
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間なども考慮する必要がある。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は同一とする。
  - 塗料の調合の作業とそこで調合された塗料を用いる塗装作業が同時に行われる区域を、1つの単位作業場所として設定することができる。
  - クロム酸鉛を取り扱う作業場では、同一の区域をクロム酸と鉛のそれぞれ別の単位作業場所として設定する。
  answer: 2
  choice_notes: []
  explanation: '単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間は考慮しません。選択肢2は誤りです。


