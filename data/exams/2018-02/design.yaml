  explanation: 繊維ろ紙による粒子の捕集では、繊維径が**小さい**ほど捕集率を高めることができます。細い繊維ほど、粒子が繊維に近づいて付着する機会が増えるからです。「繊維径が大きいほど」とする選択肢4は誤りです。
