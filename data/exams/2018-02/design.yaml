  stem: 環境空気中の有害物質の捕集及び分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 繊維ろ紙による粒子の捕集では、ろ過流速が遅いほど、拡散効果による捕集率は増大する。
  - ミゼットインピンジャーに粒径3～5mmのガラスビーズを入れると、ガス状物質の捕集率を高めることができる。
  - ポーラスポリマービーズは、表面が不活性なため、捕集された物質の化学反応による変質が起こりにくい。
  - 繊維ろ紙による粒子の捕集では、繊維径が大きいほど捕集率を高めることができる。
  - 慣性衝突を利用した鉱物性粉じんの捕集装置では、ノズルを通過する気流の速度を高くすると、衝突板上での再飛散率が高くなる。
  answer: 4
