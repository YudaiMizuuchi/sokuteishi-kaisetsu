  explanation: '水素炎イオン化検出器（FID）は、水素炎の中で燃焼してイオン化する物質を検出するもので、ほとんどの有機化合物を検出しますが、例外的に、ホルムアルデヒド、ギ酸、二硫化炭素などは検出されません。（2）が不適切です。


