  stem: 騒音に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音性難聴では、内耳の有毛細胞が変性して聴力低下が起こる。
  - 騒音性難聴は、感音性難聴である。
  - 騒音の測定は、騒音計の周波数補正回路のA特性で行う。
  - 等価騒音レベルは、変動する騒音のある時間範囲について、1,000,2,000,4,000及び8,000Hzの音圧レベルの平均値として表した量である。
  - A測定の平均値の算定には、80dB(A)未満の測定値は含めない。
  answer: 4
  choice_notes: []
  explanation: 等価騒音レベルは、変動する騒音のエネルギーを時間で平均した値で、特定の周波数の音圧レベルの平均値ではありません。選択肢4は誤りです。
