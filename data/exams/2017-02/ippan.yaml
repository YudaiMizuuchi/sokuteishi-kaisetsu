  stem: 厚生労働省の「VDT作業における労働衛生管理のためのガイドライン」に基づく措置に関し、次のうち不適当なものはどれか。
  choices:
  - ディスプレイは、おおむね40～50cmの視距離が確保できるようにし、画面の上端が、眼と同じ高さか、やや下になるようにしている。
  - 反射防止型ディスプレイは使用していないが、間接照明を用いてグレアを防いでいる。
  - 書類上及びキーボード上における照度を、300ルクス以上にしている。
  - 単純入力型及び拘束型に該当するVDT作業において、一連続作業時間を1時間とし、次の連続作業までの間に5分間の作業休止時間を設けている。
  - VDT作業健康診断は、一般健康診断を実施する際に、併せて実施している。
  answer: 4
  choice_notes: []
  explanation: 単純入力型・拘束型の VDT 作業では、一連続作業時間が1時間を超えないようにし、次の連続作業までの間に **10〜15分**の作業休止時間を設けることとされていました。作業休止時間を5分間とする選択肢4は不適当です。
  figures: []
  law_note: この問題の「VDT作業における労働衛生管理のためのガイドライン」は、令和元年7月12日に「情報機器作業における労働衛生管理のためのガイドライン」（基発0712第3号）に改められています。
  _key_choice: 単純入力型及び拘束型に該当するVDT作業において、一連続作業時間を1時間とし、次の連続作業までの間に5分間の作業休止時間を設けている。
