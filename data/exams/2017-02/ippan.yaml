  stem: 「労働安全衛生マネジメントシステムに関する指針(厚生労働省)」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - この指針は、法令の規定に基づき、機械や化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めている。
  - 事業者は、安全衛生方針を表明し、労働者及び関係請負人その他の関係者に周知させる。
  - 安全衛生計画には、日常的な安全衛生活動として、危険予知(KY)活動、ヒヤリ・ハット事例の収集などを盛り込むことができる。
  - 労働安全衛生マネジメントシステムに従って行う措置が適切に実施されているかどうかについて、安全衛生計画の期間を考慮して事業者が行う調査及び評価をシステム監査という。
  - 事業者は、その妥当性及び有効性を確保するため、手順の見直し等労働安全衛生マネジメントシステムの全般的な見直しを定期的に行う。
  answer: 1
  choice_notes: []
  explanation: 労働安全衛生マネジメントシステムに関する指針は、安全衛生管理の仕組みについての基本的な事項を定めたもので、機械や化学物質による危険・健康障害を防止するための具体的な措置を定めるものではありません。選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: この指針は、法令の規定に基づき、機械や化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めている。
