  stem: 管理濃度及び日本産業衛生学会の許容濃度等の勧告に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度は、単位作業場所ごとに有害物質に係る作業環境の状態を評価するための指標として定められている。
  - 管理濃度が天井値として定められている物質がある。
  - 許容濃度の数値を労働の場以外での環境要因の許容限界値として用いてはならない。
  - 許容濃度等の勧告において、ヒトに対する発がん性については、第1群、第2群A及び第2群Bに分類されている。
  - 許容濃度は、作業中のばく露濃度の変動があまり大きくない場合に利用される。
  answer: 2
  choice_notes: []
  explanation: '管理濃度を天井値として定めている物質はありません。管理濃度は、単位作業場所の作業環境の状態を評価するための指標で、評価値と比べて使うものです。「天井値として定められている物質がある」とする選択肢2は誤りです。


    平成29年度第2回にも、「管理濃度が天井値として定められている有害物質はない」という正しい記述があります。'
  figures: []
