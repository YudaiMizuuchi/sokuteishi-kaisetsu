  stem: 有害因子に関する次の記述のうち、誤っているものはどれか。
  choices:
  - レーザー光線は、誘導放出による光の増幅作用により作られた人工の光であり、一定の波長を持ち、指向性と集束性に優れている。
  - 窒素は、常温・常圧では安定な無色、無臭の気体であり、潜水作業においては減圧症などの原因となる。
  - ノロウイルスによる食中毒は、主として夏季に集団食中毒として多発する。
  - 腰痛予防のために、成人男子の労働者では、人力のみにより取り扱う物の重量は、体重のおおむね40%以下となるようにする。
  - 熱痙攣は、多量の発汗により体内の水分と塩分が失われたところへ水分だけが補給されたとき、血液中の塩分濃度が低下することにより発生する。
  answer: 3
  choice_notes: []
