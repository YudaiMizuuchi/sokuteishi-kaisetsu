  stem: 酸素欠乏及び硫化水素に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 硫化水素は、し尿、腐泥などから発生する刺激性の気体で、高濃度では、意識消失、呼吸麻痺などが生じる。
  - 空気中の酸素濃度が16%程度以下になると、頭痛、吐き気などの自覚症状が現れ、10%程度以下になると、意識喪失や痙攣が現れる。
  - 相当期間密閉されていた鋼製のタンクの内部での作業では、酸素欠乏症の危険がある。
  - 海水が滞留している暗きょの内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  - 酸素欠乏症の危険のある場所で作業を行うときは、空気呼吸器、送気マスク又は防毒マスクを使用する。
  answer: 5
  choice_notes: []
  explanation: 酸素欠乏症の危険のある場所では、**空気呼吸器、酸素呼吸器又は送気マスク**を使用します。防毒マスクは、周りの空気をろ過して使うものなので、酸素欠乏の場所では使えません。選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 酸素欠乏症の危険のある場所で作業を行うときは、空気呼吸器、送気マスク又は防毒マスクを使用する。
