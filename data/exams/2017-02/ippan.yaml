  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病である。
  - じん肺の合併症としては、肺結核、続発性気管支炎、原発性肺がんなどがある。
  - じん肺の呼吸器症状は、喫煙によって悪化する。
  - 鉱物性粉じんの有害性は、粉じん中の遊離けい酸の含有率によって異なる。
  - 鉱物性粉じんに含まれる遊離けい酸は、胸膜の中皮腫を生じさせる。
  answer: 5
  choice_notes: []
  explanation: 胸膜の中皮腫を起こすのは石綿です。遊離けい酸はけい肺の原因なので、選択肢5は誤りです。
