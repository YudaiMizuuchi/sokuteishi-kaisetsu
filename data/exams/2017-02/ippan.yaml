  stem: 局所排気装置等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 外付け式フードの開口部の周囲にフランジを設けると、フランジがないときに比べ、少ない排風量で所要の効果を上げることができる。
  - 外付け式フードでは、熱による上昇気流がある場合などを除き、一般に、上方吸引型より下方吸引型の方が有効である。
  - 囲い式フードの制御風速とは、フード開口面における平均風速をいう。
  - 外付け式フードの制御風速は、有害物質を吸引しようとする飛散限界(捕捉点)における最小風速である。
  - ダクトの断面積が同じである場合、断面が長方形のダクトは円形のダクトに比べて圧力損失が大きい。
  answer: 3
  choice_notes: []
  explanation: 囲い式フードの制御風速は、フード開口面における**最小**の風速です。平均風速とする選択肢3は誤りです。
