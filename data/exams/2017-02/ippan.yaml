  stem: 化学物質等の性状及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 気体の液体への溶解度は、一般に、液体の温度が高いほど大きい。
  - 混合有機溶剤から発生する蒸気の組成は、一般に、元の混合有機溶剤の組成とは異なる。
  - 昇華性を有する化学物質は、作業環境空気中では気体及び固体粒子として存在する。
  - 空気中に浮遊する粉じんは、密度が同じであれば粒径が小さくなるほど、沈降速度は遅くなる。
  - ヒュームの一次粒子の粒径は、一般に、1μm以下である。
  answer: 1
  choice_notes: []
  explanation: 気体の液体への溶解度は、一般に、液体の温度が**低い**ほど大きくなります。「温度が高いほど大きい」とする選択肢1は誤りです。
  figures: []
