  stem: 「化学物質等による危険性又は有害性等の調査等に関する指針(厚生労働省)」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - リスクアセスメントは、化学物質等を原材料等として新規に採用し、又は変更するときのほか、化学物質等の製造又は取扱い業務に係る作業の方法又は手順を新規に採用し、又は変更するときなどに実施する。
  - 化学物質等による危険性又は有害性の特定は、化学物質等について、リスクアセスメント等の対象となる業務を洗い出した上で、「化学品の分類及び表示に関する世界調和システム(GHS)」等に即して行う。
  - ハザードは、労働災害発生の可能性と負傷又は疾病の重大性(重篤度)の組合せであると定義される。
  - 化学物質等による疾病のリスク低減措置の検討では、個人用保護具の使用よりも局所排気装置の設置等の衛生工学的対策を優先する。
  - リスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ずしも数値化する必要はなく、相対的な分類でも差し支えない。
  answer: 3
  choice_notes: []
  explanation: ハザード（危険性又は有害性）は、労働者に負傷や疾病を生じさせる潜在的な根源です。労働災害発生の可能性と重篤度の組合せは「リスク」の定義なので、選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: ハザードは、労働災害発生の可能性と負傷又は疾病の重大性（重篤度）の組合せであると定義される。
