  stem: 電離放射線及びその影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - X線とγ線は、エネルギーの大小ではなく、その発生過程の違いによって区別される。
  - α線、β線及びX線の中で、透過力が最も弱いものはα線である。
