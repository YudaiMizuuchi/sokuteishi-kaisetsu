  stem: 労働衛生保護具に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気呼吸器は、酸素濃度が18%未満の空気中でも使用することができる。
  - 電動ファン付き呼吸用保護具は、ろ過式呼吸用保護具の一種である。
  - 防じんマスクの使用後、再使用のためには、圧縮空気を用いて、ろ過材上に付着した粉じんを吹き飛ばすことによって、十分払い落とす必要がある。
  - 防じんマスクの装着の際、面体と顔面の密着性を高めるため、面体の接顔部に、接顔メリヤスを装着して使用してはならない。
  - 耳栓は、1種及び2種に区分されるが、2種の耳栓は、高音域を遮音し、会話域程度の低音域は比較的通すものである。
  answer: 3
  choice_notes: []
  explanation: 防じんマスクのろ過材に付着した粉じんを、圧縮空気で吹き飛ばしてはいけません。ろ過材が傷んだり、粉じんを吸い込んだりするおそれがあるからです。選択肢3は誤りです。
