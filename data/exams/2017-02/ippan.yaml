  stem: 金属等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ヒ素の慢性中毒による皮膚症状としては、黒皮症、角化症などのほか、皮膚がんを生じることがある。
  - カドミウムの主な健康障害は、肝臓障害である。
  - クロム酸は、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって鼻中隔穿孔、肺がんなどを生じる。
  - 鉛中毒では、貧血、末梢神経障害、腹部の疝痛などがみられる。
  - 無機水銀中毒では、腎臓の障害がみられる。
