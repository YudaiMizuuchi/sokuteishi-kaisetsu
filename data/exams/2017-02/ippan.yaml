  stem: 有機溶剤の性質及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤の蒸気は空気より軽いので、蒸発しやすく、かつ拡散しやすい。
  - 有機溶剤は一般に可燃性であるが、ハロゲン化炭化水素の中には難燃性のものがある。
  - 有機溶剤による皮膚又は粘膜の障害としては、皮膚の角化、結膜炎などがある。
  - 二硫化炭素の高濃度ばく露では、精神障害を生じる。
  - n-ヘキサンによる健康障害として顕著なものは、末梢神経障害(多発性神経炎)である。
  answer: 1
  choice_notes: []
  explanation: 有機溶剤の蒸気は、ほとんどが空気より**重い**ので、低いところに滞留しやすくなります。「空気より軽い」とする選択肢1は誤りです。
  figures: []
