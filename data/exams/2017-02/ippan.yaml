  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害ガスと粉じんが混在している場合は、防じん機能を有する防毒マスクを用いる。
  - 吸収缶の交換時期を臭気を感知した時点とすることができるのは、臭気を感知できる濃度がばく露限界濃度より著しく低い物質に限られる。
  - 隔離式防毒マスクは、直結式防毒マスクより使用できる環境空気中の対象ガス濃度の範囲が広い。
  - 有機ガス用防毒マスクの吸収缶の色は黒色であり、一酸化炭素用防毒マスクの吸収缶の色は赤色である。
  - 2種類以上の有害ガスが混在している場合には、最も毒性の強いガス用の防毒マスクを使う。
  answer: 5
  choice_notes: []
  explanation: 2種類以上の有害ガスが混在している場合は、全てのガスに対応した吸収缶を用いるか、送気マスクなどを使います。最も毒性の強いガス用の防毒マスクだけでは、他のガスを防げません。選択肢5は誤りです。
  figures: []
  law_note: null
