  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化ビニルでは、指の骨の溶解（指端骨溶解）、肝血管肉腫などがみられる。
  - N,N-ジメチルホルムアミドは、肝臓障害を起こす。
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対する発がん性が疑われている。
  - ナフタレンは、皮膚感作性のほか、ヒトに対する発がんの可能性があるとされている。
  - 一酸化炭素は、無色、無臭の気体で、赤血球中のヘモグロビンの合成を阻害する。
  answer: 5
  choice_notes: []
  explanation: 一酸化炭素は、ヘモグロビンの合成を阻害するのではなく、ヘモグロビンと強く**結合**して酸素を運べなくします。選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 一酸化炭素は、無色、無臭の気体で、赤血球中のヘモグロビンの合成を阻害する。
