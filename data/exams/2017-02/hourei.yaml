  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第2評価値が管理濃度以下であり、かつ、B測定の測定値が管理濃度の1.0倍以上1.5倍以下である場合は、第2管理区分に区分される。
  - A測定の第2評価値が管理濃度を超える単位作業場所の管理区分は、B測定の測定値に関係なく、第3管理区分である。
  - 連続する2作業日について作業環境測定を行った場合の評価は、それぞれの日についてのA測定の測定値に基づいて求めた幾何標準偏差のうち、大きい値を用いて行うものとする。
  - 測定点における測定対象物の濃度がその測定で採用した試料採取方法及び分析方法で求められる定量下限の値に満たない場合には、当該定量下限の値をその測定点の測定値とみなして、管理区分の区分を行うものとする。
  - 評価値の計算式は、1作業日について測定した場合と連続する2作業日について測定した場合とでは異なる。
  answer: 3
  choice_notes: []
  explanation: '連続する2作業日に測定したときの評価値は、2日分の幾何平均値と幾何標準偏差を組み合わせた式で計算します。2日の幾何標準偏差のうち大きい方を用いるとする選択肢3は誤りです。


    根拠：作業環境評価基準第3条第2項。'
