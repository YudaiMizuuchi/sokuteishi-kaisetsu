  stem: 安全又は衛生のための教育に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、労働者を雇い入れたときは、原則として、その従事する業務に関する安全又は衛生のための教育を行わなければならない。
  - 事業者は、その事業場の属する業種にかかわらず、新たに職務に就くこととなった職長に対し、安全又は衛生のための教育を行わなければならない。
  - 事業者は、労働者の作業内容を変更したときは、原則として、その労働者に対し、法令で定める安全又は衛生のための教育を行わなければならない。
  - 事業者は、衛生管理者、安全衛生推進者等、労働災害の防止のための業務に従事する者に対し、その業務に関する能力の向上を図るための教育等を行い、又はこれらを受ける機会を与えるように努めなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、その科目についての特別教育を省略することができる。
  answer: 2
  choice_notes: []
  explanation: '職長等の教育は、建設業、製造業（一部を除く）、電気業、ガス業、自動車整備業、機械修理業の事業場で行うもので、業種にかかわらず必要なものではありません。選択肢2は誤りです。


    根拠：労働安全衛生法施行令第19条。'
