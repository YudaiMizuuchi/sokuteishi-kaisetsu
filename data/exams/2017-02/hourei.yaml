  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所とは、作業環境測定を行うべき作業場の区域のうち労働者の作業中の行動範囲、有害物の分布等の状況等に基づき定められる作業環境測定のために必要な区域をいう。
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 騒音の測定点は、原則として、単位作業場所の床面上に6m以下の等間隔で引いた縦の線と横の線との交点の床上50cm以上150cm以下の位置としなければならない。
  - 鉱物性粉じんの発散源に近接する場所において作業が行われる単位作業場所にあっては、当該作業が行われる時間のうち、粉じんの濃度が最も高くなると思われる時間に、当該作業が行われる位置においても測定を行わなければならない。
  - ろ過捕集方法に用いるろ過材は、0.3μmの粒子を95%以上捕集する性能を有するものに限られる。
  answer: 3
  choice_notes: []
  explanation: 騒音の測定点の高さは、床上 **120 cm 以上 150 cm 以下**です。50 cm 以上 150 cm 以下とする選択肢3は誤りです。
  figures: []
  law_note: null
