  stem: 労働安全衛生規則の衛生基準に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、強烈な騒音を発する屋内作業場における業務に労働者を従事させるときは、強烈な騒音を発する場所であることを容易に知ることができるよう、標識によって明示する等の措置を講ずるものとする。
  - 事業者は、タンクの内部その他の場所で、自然換気が不十分なところにおいては、原則として、内燃機関を有する機械を使用してはならない。
  - 事業者は、労働者を常時就業させる屋内作業場の気温が10℃以下であるときは、換気に際し、労働者を1m/s以上の気流にさらしてはならない
  - 事業者は、著しく暑熱、寒冷又は多湿の作業場その他有害な作業場においては、原則として、その作業場内に休憩の設備を設けなければならない。
  - 事業者は、日常行う清掃のほか、大掃除を、6か月以内ごとに1回、定期に、統一的に行わなければならない。
  answer: 4
  choice_notes: []
  explanation: '著しく暑熱・寒冷・多湿の作業場や有害な作業場では、原則として、休憩の設備を**作業場外**に設けなければなりません。「作業場内に」とする選択肢4は誤りです。


    根拠：労働安全衛生規則第614条。'
  figures: []
  law_note: null
