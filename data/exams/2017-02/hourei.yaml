  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、常時使用する労働者の数が10人以上50人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  - 事業者は、当該事業場の労働者で、作業環境測定を実施している作業環境測定士であるものを衛生委員会の委員として指名することができる。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に関係なく、産業医を選任しなければならない。
  - 事業者は、常時300人以上の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、衛生委員会又は安全衛生委員会を設けなければならない。
  answer: 4
  choice_notes: []
  explanation: 総括安全衛生管理者を選任しなければならない規模は、業種によって違います（林業・建設業などは100人以上、製造業などは300人以上、その他の業種は1,000人以上）。「業種に関係なく300人以上」とする選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: 事業者は、常時300人以上の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
