  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定基準に基づいて行う指定作業場についての作業環境測定結果の作業環境評価基準に基づく評価は、作業環境測定士ではない者に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる。
  - 第2種作業環境測定士は、指定作業場についての作業環境測定の業務のうち、簡易測定機器以外の機器を用いて行う分析の業務を行うことができない。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
  - 法令で定める著しい騒音を発する屋内作業場における等価騒音レベルの測定は、作業環境測定士ではない者に行わせることができる。
  answer: 4
  choice_notes: []
  explanation: '管理区域の外部放射線による線量当量率又は線量当量の測定は、指定作業場の作業環境測定ではないので、作業環境測定士に行わせなければならないものではありません。選択肢4は誤りです。


    根拠：作業環境測定法施行令第1条第1項、作業環境測定法施行規則第1条。'
  figures: []
  law_note: null
