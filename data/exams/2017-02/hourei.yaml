  stem: 事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。ただし、含有率とは、1気圧、25℃とした場合の空気中に占める当該ガスの容積の割合（ppm）をいうものとする。
  choices:
  - 事業者は、空気調和設備を設けている場合は、室に供給される空気中の二酸化炭素の含有率を1,000ppm以下としなければならない。
  - 事業者は、室における二酸化炭素の含有率を5,000ppm以下としなければならない。
  - 事業者は、室における一酸化炭素の含有率を10ppm以下としなければならない。
  - 事業者は、室の照明設備については、6か月以内ごとに1回、定期に、点検しなければならない。
  - 事業者は、空気調和設備を設けている場合は、室の気温が17℃以上28℃以下となるように努めなければならない。
  answer: 3
  choice_notes: []
  explanation: '室の一酸化炭素の含有率は、**50 ppm 以下**としなければなりません。10 ppm 以下とする選択肢3は誤りです。


    根拠：事務所衛生基準規則第3条第2項。10 ppm は、空気調和設備で室に供給される空気についての値です。'
