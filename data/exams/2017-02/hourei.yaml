  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 多量のドライアイスを取り扱う業務を行い、著しく寒冷な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 動力により駆動されるハンマーを用いる金属の鍛造の業務を行い、著しい騒音を発する屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 廃棄物の焼却施設において焼却灰を取り扱う業務(設備の解体等に伴うものを除く。)を行う作業場については、6か月以内ごとに1回、定期に、当該作業場における空気中のダイオキシン類の濃度を測定しなければならない。
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始する前に、当該作業場における空気中の酸素の濃度を測定しなければならない。
  answer: 2
