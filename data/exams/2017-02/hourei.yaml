  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、弗化水素ガスを発散する場所における業務に常時従事している労働者に対し、6か月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に報告する必要はない。
  - 事業者は、雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 事業者は、深夜業を含む業務に常時従事する労働者に対し、原則として、6か月以内ごとに1回、定期に、法令で定められた項目について医師による健康診断を行わなければならない。
  answer: 4
  choice_notes: []
  explanation: 貧血検査や肝機能検査などを医師が必要でないと認めるときに省略できるのは、**定期**健康診断です。雇入時の健康診断では省略できないので、選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: 事業者は、雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
