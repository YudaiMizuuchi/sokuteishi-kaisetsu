  stem: 簡易測定機器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - シアン化水素については、妨害物質がない場合は、検知管で測定することができる。
  - 検知管には、前処理管(除去管、除湿管、反応管など)を接続して使用するものもある。
  - 検知管の変色層が斜めに現れたときは、変色した部分の先端部の値を読み取る。
  - 粉じんの相対濃度測定における質量濃度変換係数(K値)は、発生源の近くでは大きく、発生源から離れるに従って小さくなる傾向がある。
  - 相対濃度計の吸引口に分粒装置を接続しても、質量濃度を求めることはできない。
  answer: 3
  choice_notes: []
  explanation: 検知管の変色層が斜めに現れたときは、変色した部分の最先端と、斜めに変色が始まった点との**中央**の値を読み取ります。先端部の値とする選択肢3は誤りです。
