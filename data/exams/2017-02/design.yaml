  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - サンプリングに用いる流量計の較正は、捕集装置を取り付けた状態で行わなければならない。
  - 面積式流量計は、テーパー管内の浮子が停止したとき、浮子とテーパー管の間隙の面積とそこを流れている流量とが比例することを利用している。
  - 面積式流量計では、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より小さくなる。
  - 湿式ガスメータは、押し込み方式で使用する。
  - 絞り式(オリフィス)流量計は、オリフィス板の上流側と下流側との間に生じる圧力差が流量と一定の関係にあることを利用している。
