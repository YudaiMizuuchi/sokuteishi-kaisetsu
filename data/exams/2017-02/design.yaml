  stem: 有害物質のA測定の測定点の設定方法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の発生源が規則正しい間隔で配列されている場合には、測定点の縦あるいは横の線の間隔が発生源の間隔と一致しないようにする。
  - 単位作業場所が直線で区切れない場合にあっては、測定点を定める線は単位作業場所の形に沿って曲率をもってもよい。
  - 「床上」の「床」とは、建物の床とは別に作業床がある場合には、その作業床をいう。
  - 測定点と測定点の間隔は、原則として、6m以下の等間隔であれば、縦方向と横方向の間隔は異なっていてもよい。
  - 測定点は、隣接する他の単位作業場所の測定点と重複してはならない。
  answer: 5
  choice_notes: []
  explanation: '測定点は、隣接する他の単位作業場所の測定点と**重複してもよい**とされています。「重複してはならない」とする選択肢5は誤りです。


    平成29年度第2回にも、同じ選択肢があります。'
  figures: []
  law_note: null
  _key_choice: 測定点は、隣接する他の単位作業場所の測定点と重複してはならない。
