  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ポアサイズが同じメンブランフィルターでもポリエステル製とナイロン製とでは、捕集率に差が生ずる。
  - ポアサイズの小さなメンブランフィルターほど、同じ吸引速度でサンプリングした場合の圧力損失は小さい。
