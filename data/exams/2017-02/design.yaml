  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 最大濃度を示す可能性のある作業位置が複数あって、どの作業位置で最大濃度になるか予測できない場合には、それらのすべての作業位置で測定を行い、最大の測定値をB測定の測定値とする。
  - 環境空気中の濃度が最大になると考えられる作業が、A測定の実施時間内に行われない場合には、B測定はA測定の実施時間とは別に、その作業が行われる時間に実施してもよい。
  - 発散源に近接する場所で作業が行われている場合、B測定が必要である。
  - 発散源とともに作業者が移動しながら行う作業がある場合には、B測定が必要である。
  - B測定の試料採取方法と分析方法は、必ずしもA測定と一致しなくてもよい。
  answer: 5
  choice_notes: []
  explanation: 'B 測定の試料採取方法と分析方法は、A 測定と**同じ方法**で行うのが原則です。「必ずしも一致しなくてもよい」とする選択肢5は誤りです。


    令和7年度第1回にも、B 測定でも分粒装置を使う（A 測定と同じ方法）という論点があります。'
  figures: []
  law_note: null
  _key_choice: B測定の試料採取方法と分析方法は、必ずしもA測定と一致しなくてもよい。
