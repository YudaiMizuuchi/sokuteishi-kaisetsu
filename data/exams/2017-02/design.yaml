  stem: '有害物質Ⓐと、その常温・常圧（25℃、1気圧）における環境空気中の状態Ⓑとの次の組合せのうち、誤っているものはどれか。


    ただし、ここで、ガスとは常温・常圧において気体のものをいい、蒸気とは常温・常圧において液体又は個体の物質がその蒸気圧に応じて蒸発又は昇華して気体となっているものをいう。'
  choices:
  - 水銀 ／ 蒸気
  - 臭化メチル ／ ガス
  - エチレンオキシド ／ 蒸気
  - ヨウ化メチル ／ 蒸気
  - 塩化ビニル ／ ガス
  answer: 3
  choice_notes: []
  explanation: 'エチレンオキシドは沸点が約 11℃で、常温では気体なので**ガス**です。蒸気とする選択肢3は誤りです。


    水銀とヨウ化メチルは常温で液体なので蒸気、臭化メチル（沸点約 4℃）と塩化ビニルはガスです。'
  figures: []
