  stem: 有害物質の作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 作業環境測定は、作業環境の実態を把握するため空気環境その他の作業環境について行う測定である。
  - A測定は、当該単位作業場所における空気中の濃度の平均とばらつきを求めるための測定である。
  - A測定点の設定は、等間隔系統抽出法の原則に従って行う。
  - A測定の第1評価値は、空気中濃度の幾何平均と幾何標準偏差により求められる。
  - A測定の第2評価値とは、空気中の濃度の幾何平均値をいう。
  answer: 5
  choice_notes: []
  explanation: 'A 測定の第2評価値は、単位作業場所の気中有害物質の**算術平均濃度の推定値**です。幾何平均値そのものではないので、選択肢5は誤りです。


    第1評価値も第2評価値も、幾何平均値と幾何標準偏差から計算します（選択肢4）。'
  figures: []
  law_note: null
  _key_choice: A測定の第2評価値とは、空気中の濃度の幾何平均値をいう。
  columns: null
