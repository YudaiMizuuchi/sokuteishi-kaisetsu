  stem: '次の記述の［　］に入る数値として適切なものは下のうちどれか。


    「光散乱方式の相対濃度計により、鉱物性粉じんのB測定を10分間行った。バックグラウンド値は3cpmであり、この測定器による1cpmに対する質量濃度は、0.008mg/m³である。管理濃度を1.00mg/m³とした場合、相対濃度計の計数値が、［　］カウントを超えていなければ第3管理区分とはならない。ただし、A測定の第2評価値は、管理濃度を超えていないものとする。」'
  choices:
  - '188'
  - 1,250
  - 1,280
  - 1,875
  - 1,905
  answer: 5
  choice_notes: []
  explanation: 'B 測定値が管理濃度の1.5倍（1.50 mg/m³）を超えなければ、第3管理区分にはなりません（A 測定の第2評価値は管理濃度以下とする）。


    1.50 mg/m³ に当たる正味の相対濃度 ＝ 1.50 ÷ 0.008 ＝ 187.5 cpm


    バックグラウンド 3 cpm を加えた計数率 ＝ 190.5 cpm、10分間の計数値 ＝ 190.5 × 10 ＝ 1,905 カウント


    よって（5）が適切です。バックグラウンド値を加え忘れると 1,875（選択肢4）になります。'
  figures: []
  law_note: null
  _key_choice: 1,905
