  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 初めての測定で、有害物質の濃度分布等が予測できなかったので、当該作業場で働く作業者の行動範囲を単位作業場所の範囲とした。
  - 手持ち式と固定式グラインダーによる研磨作業が行われている作業場で、固定式グラインダーを粉じん発生源として単位作業場所を設定した。
  - トルエンによる抽出作業とキシレンによる抽出作業が同一の場所で別々に行われている作業場を、トルエンとキシレンの混合有機溶剤を使用する作業場とみなして一つの単位作業場所として設定した。
  - 塗料の調合と調合された塗料を用いて塗装が行われている作業場で、両者の作業場所を一つの単位作業場所とした。
  - クロム酸鉛を取り扱っている作業場で、同一の区域を、クロム酸と鉛のそれぞれの単位作業場所として設定した。
  answer: 3
  choice_notes: []
  explanation: 同じ場所でトルエンとキシレンの抽出作業が別々に行われている場合は、混合溶剤を使う作業場とみなして1つの単位作業場所とすることはできません。選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: トルエンによる抽出作業とキシレンによる抽出作業が同一の場所で別々に行われている作業場を、トルエンとキシレンの混合有機溶剤を使用する作業場とみなして一つの単位作業場所として設定した。
