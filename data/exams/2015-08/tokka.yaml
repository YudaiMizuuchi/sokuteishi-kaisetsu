  stem: 環境空気（25℃、1気圧）中のフッ化水素の濃度を吸光光度分析法で測定した。捕集液に1.0 L・min⁻¹の流量で試料空気を10分間吸引して得られた試料液10 mLについて定量操作を行い、その吸光度をブランクを対照として測定したところ0.100であった。フッ化水素の濃度が、4.58×10⁻⁵ mol・L⁻¹の標準溶液10 mLにつき試料液と同様の定量操作を行って測定した吸光度は0.320であった。フッ化水素の環境空気中濃度（体積分率）として、正しい値に最も近いものは次のうちどれか。ただし、捕集率は100%とする。
  choices:
  - 0.15ppm
  - 0.25ppm
  - 0.35ppm
  - 0.45ppm
  - 0.55ppm
  columns: null
  answer: 3
  choice_notes: []
  explanation: '次の順で計算します。


    1. 標準溶液10 mL中のフッ化水素の量：4.58 × 10⁻⁵ mol/L × 0.010 L ＝ 4.58 × 10⁻⁷ mol（吸光度0.320）

    2. 試料液中のフッ化水素の量：4.58 × 10⁻⁷ × 0.100／0.320 ≒ 1.43 × 10⁻⁷ mol

    3. 気体の体積（25℃、1気圧のモル体積24.45 L/mol）：1.43 × 10⁻⁷ × 24.45 ≒ 3.50 × 10⁻⁶ L

    4. 吸引した空気の量：1.0 L/min × 10 min ＝ 10 L

    5. 体積分率：3.50 × 10⁻⁶ ÷ 10 ≒ 3.5 × 10⁻⁷ ＝ **0.35 ppm**


    よって（3）です。'
