  stem: '体積2 Lの3個の真空の容器に、エチレンイミン（A）、シアン化水素（B）、ヨウ化メチル（C）をそれぞれ下表に示す質量ずつ別々に入れて密封して蒸発させた。定常状態になったときの各容器中のそれぞれの物質の気体の圧力（P<sub>A</sub>、P<sub>B</sub>、P<sub>C</sub>）を大きい順に並べたものは下のうちどれか。ただし、それぞれの物質のモル質量及び飽和蒸気圧は下表のとおりとし、温度は20℃とする。


    |  | 容器に入れた質量（g） | モル質量（g・mol⁻¹） | 20℃における飽和蒸気圧（kPa） |

    |---|---|---|---|

    | エチレンイミン（A） | 1.0 | 43 | 21 |

