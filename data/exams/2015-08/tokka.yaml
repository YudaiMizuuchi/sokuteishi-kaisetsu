  stem: '吸光光度分析法における検量線に関する次の記述の㋑と㋺の［　］に入る語句の組合せとして、正しいものは下のうちどれか。


    「［㋑］は、検量線の傾きに関係するが、［㋺］は関係しない。」'
  choices:
  - 発色試薬の濃度 ／ 入射光の強度
  - 発色試薬の濃度 ／ セルの光路長
  - セルの光路長 ／ 溶質のモル吸光係数
  - 溶質のモル吸光係数 ／ 入射光の強度
  - 入射光の強度 ／ 発色試薬の濃度
  columns:
  - ㋑
  - ㋺
  answer: 4
  choice_notes: []
  explanation: '検量線は、濃度と吸光度の関係を表す直線で、傾きは、ランベルト・ベールの法則 A ＝ ε・c・l から、**ε・l**（モル吸光係数 × セルの光路長）です。したがって、㋑には、検量線の傾きに関係する**溶質のモル吸光係数**、㋺には、関係しない**入射光の強度**が入ります。よって（4）です。同様の問題は、令和2年度第1回などにも出題されています（出題実績）。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
