  stem: ピリジン-ピラゾロン法による環境空気中のシアン化水素濃度の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - シアン化水素の捕集液として、水酸化ナトリウム水溶液を用いる。
  - 標準物質として、シアン化カリウムを用いる。
  - 捕集液に酢酸を加え中和した後、発色試薬を加える。
  - 最終試料液の色は、赤色である。
  - 試料空気中に臭素ガスが共存すると、分析の妨害となる。
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'ピリジン-ピラゾロン法で、クロラミンT、ピリジン-ピラゾロンを加えて発色させた最終試料液の色は、**青色**です。「赤色である」とする選択肢4は誤りです。同様の記述は、令和4年度第1回にも出題されています（出題実績）。


    シアン化水素の捕集液には、水酸化ナトリウム水溶液を使います。標準物質には、シアン化カリウムを使います。捕集液に酢酸を加えて中和したあと、発色試薬を加えます。試料空気中に臭素ガスが共存すると、分析の妨害になります。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
