  stem: 吸光光度分析法で測定する場合に、ジアゾカップリング反応による発色を利用する物質は次のうちどれか。
  choices:
  - 塩素化ビフェニル
  - オーラミン
  - コールタール
  - 3,3'-ジクロロ-4,4'-ジアミノジフェニルメタン
  - ニトログリコール
  columns: null
  answer: 4
  choice_notes: []
  explanation: '**ジアゾカップリング反応**で発色させるのは、芳香族アミンです。芳香族アミンは、亜硝酸ナトリウムでジアゾ化され、カップリング試薬と反応して、アゾ色素をつくります。**3,3''-ジクロロ-4,4''-ジアミノジフェニルメタン（MOCA）**は、アミノ基をもつ芳香族アミンなので、この反応を利用します。よって（4）です。


    塩素化ビフェニルとコールタールは、ガスクロマトグラフ分析法や重量分析法、オーラミンは、それ自体が色素なので、発色操作が不要です。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
