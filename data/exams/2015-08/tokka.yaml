  stem: 環境空気(25℃、1気圧)中のフッ化水素の濃度を吸光光度分析法で測定した。捕集液に1.0L·min⁻¹の流量で試料空気を10分間吸引して得られた試料液10mLについて定量操作を行い、その吸光度をブランクを対照として測定したところ0.100であった。フッ化水素の濃度が、4.58×10⁻³mol·L⁻¹の標準溶液10mLにつき試料液と同様の定量操作を行って測定した吸光度は0.320であった。フッ化水素の環境空気中濃度(体積分率)として、正しい値に最も近いものは次のうちどれか。ただし、捕集率は100%とする。
