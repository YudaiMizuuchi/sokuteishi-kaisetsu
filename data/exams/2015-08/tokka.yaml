  stem: 環境空気(25℃、1気圧)中のトルエンジイソシアネート(TDI)の濃度を測定するため、1.0L·min⁻¹で10分間試料空気を2-PP含浸ろ紙に通気した。得られたTDI-2-PP誘導体を抽出液4.0mLで抽出し試料液とした。高速液体クロマトグラフで分析した結果、試料液中のこの誘導体の濃度は0.16μg·mL⁻¹であった。環境空気中のTDI濃度として、正しい値に最も近いものは次のうちどれか。ただし、TDI-2-PP誘導体のモル質量は501g·mol⁻¹、ろ紙への捕集率は100%とし、TDIは全て2,4-TDIの形で存在しているものとする。
  choices:
  - 1ppb
  - 2ppb
  - 3ppb
  - 4ppb
  - 5ppb
  columns: null
  answer: 3
  choice_notes: []
  explanation: '次の順で計算します。


    1. 試料液中の誘導体の量：0.16 µg/mL × 4.0 mL ＝ 0.64 µg

    2. TDIの量に換算：0.64 µg × 174／501 ≒ 0.222 µg

    3. 吸引した空気の量：1.0 L/min × 10 min ＝ 10 L

    4. 濃度：0.222 µg ÷ 10 L ≒ 0.0222 µg/L ＝ 0.0222 mg/m³

    5. ppbに換算（25℃、1気圧）：0.0222 × 24.45／174 × 1000 ≒ 3.1 ppb


    よって（3）の3 ppbです。同じ型の問題は、令和7年度第1回にも出題されています（出題実績）。'
