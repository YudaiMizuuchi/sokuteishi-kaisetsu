    - 2 β-プロピオラクトン：四員環（O＝C−CH₂−CH₂−O）の化合物で、環の炭素に**メチル基はついていません**。図の2は、環にメチル基（H₃C）がついた構造で、**β-ブチロラクトン**に当たる別の物質です。組合せは誤りです。

    - 1 クロロメチルメチルエーテル（H₃C−O−CH₂Cl）、3 アクリロニトリル（H₂C＝CH−CN）、4 α-ナフチルアミン（ナフタレンの1位にNH₂）、5 p-ニトロクロロベンゼン（ベンゼン環の対位にClとNO₂）は、正しい組合せです。


    よって（2）です。'
