  stem: ガスクロマトグラフ分析法による環境空気中のベンゼン濃度の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 直接捕集法には、捕集袋又は真空捕集びんを用いる。
  - 固体捕集法には、活性炭管を用いる。
  - 活性炭からのベンゼンの脱着には、二硫化炭素が用いられる。
  - 直接捕集した試料ガスは、ガスタイトシリンジでガスクロマトグラフに導入する。
  - 検出器には、電子捕獲検出器(ECD)を用いる。
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'ベンゼンのガスクロマトグラフ分析法では、検出器に、**水素炎イオン化検出器（FID）**を使います。「電子捕獲検出器（ECD）を用いる」とする選択肢5は誤りです（ECDは、ハロゲンなど、電子親和力の強い物質に高感度な検出器です）。同様の記述は、令和元年度第1回、平成29年度第1回にも出題されています（出題実績）。


    直接捕集法には、捕集袋または真空捕集びんを使います。固体捕集法には、活性炭管を使い、脱着には、二硫化炭素を使います。直接捕集した試料ガスは、ガスタイトシリンジでガスクロマトグラフに導入します。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
