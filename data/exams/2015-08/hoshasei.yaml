  stem: 次の記述のうち、誤っているものはどれか。
  choices:
  - α崩壊は、原子核からヘリウムの原子核が放出される現象で、原子の原子番号は2つ減少する。
  - β⁻崩壊は、原子核から電子が放出される現象であり、原子の原子番号は1つ増加する。
  - 電子捕獲は、原子核が軌道電子を捕獲し陽子が中性子に変わる現象で、質量数は1つ増加する。
  - γ線は、原子核の励起状態の遷移に伴って放出される光子であり、放出に伴って原子番号は変化しない。
  - 半減期とは、対象となる放射性核種が崩壊して、はじめの原子数の半分になるまでに要する時間である。
  columns: null
