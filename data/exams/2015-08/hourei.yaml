  stem: 粉じん障害防止規則等に関する次の記述のうち、誤っているものはどれか、ただし、同規則に定める適用除外及び特例はないものとする。
  choices:
  - 除じん装置を付設すべき局所排気装置の排風機については、原則として、除じんした後の空気が通る位置に設けなければならない。
  - 常時特定粉じん作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の項目について特別の教育を行わなければならない。
  - 特定粉じん作業を行う屋内作業場については、全体換気装置による換気の実施又はこれと同等以上の措置を講じなければならない。
  - 法令に基づき局所排気装置に付設する除じん装置は、粉じんの種類がヒュームである場合には、ろ過除じん方式若しくは電気除じん方式又はこれらと同等以上の性能を有する除じん方式による除じん装置としなければならない。
  - 法令に基づき鉱物性粉じんに係る作業環境測定を行ったときは、所定の事項を記録して、これを7年間保存しなければならない。
