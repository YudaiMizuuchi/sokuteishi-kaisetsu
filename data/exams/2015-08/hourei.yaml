  - 屋内作業場において、第2種有機溶剤等を用いて洗浄の業務を行う場合には、当該業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、医師による所定の項目についての健康診断を行わなければならない。
  - 屋内作業場において、第2種有機溶剤等を用いて洗浄の業務を行う場合には、当該業務を行う作業場に、全体換気装置を設けなければならない。
  - 屋内作業場において、第3種有機溶剤等を用いて洗浄の業務を行う場合には、有機溶剤作業主任者を選任しなければならない。
