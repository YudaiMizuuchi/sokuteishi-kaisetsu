  stem: 事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。ただし、含有率及び量とは、それぞれ1気圧、25℃とした場合の空気中に占める当該ガスの容積の割合(ppm)及び1m³中の当該物質の質量をいうものとする。
  choices:
  - 事業者は、室における一酸化炭素の含有率を50ppm以下としなければならない。
  - 事業者は、室における二酸化炭素の含有率を1,000ppm以下としなければならない。
  - 事業者は、空気調和設備を設けている場合は、室に供給される空気中のホルムアルデヒドの量を0.1mg以下としなければならない。
  - 事業者は、空気調和設備を設けている場合は、その設備より室に流入する空気が特定の労働者に直接、継続して及ばないようにしなければならない。
  - 事業者は、空気調和設備を設けている場合は、室の気流を0.5m/s以下としなければならない。
  answer: 2
