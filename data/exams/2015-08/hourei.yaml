  stem: 作業環境測定基準に従って行う作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 鋲打ち機等圧縮空気により駆動される機械又は器具を取り扱う業務を行い、著しい騒音を発する屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 焼鈍炉、加熱炉等により鉱物、金属又はガラスを加熱する業務を行う暑熱の屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始した直後に、当該作業場における空気中の酸素の濃度を測定しなければならない。
  - 放射線業務を行う作業場のうち管理区域に該当する部分については、原則として、1か月以内ごとに1回、定期に、外部放射線による線量当量率又は線量当量を放射線測定器を用いて測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  answer: 3
  choice_notes: []
  explanation: '第1種酸素欠乏危険作業では、その日の作業を**開始する前**に、空気中の酸素の濃度を測定しなければなりません。「作業を開始した直後」とする選択肢3は誤りです。


    作業を始めてから測っては、酸素欠乏の空気に入った後になってしまいます。'
  figures: []
  law_note: null
  _key_choice: 第1種酸素欠乏危険作業を行うときは,その日の作業を開始した直後に,当該作業場における空気中の酸素の濃度を測定しなければならない.
