  stem: 衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、常時50人以上の労働者を使用する事業場については、その業種に関係なく、産業医を選任しなければならない。
  - 衛生管理者は、少なくとも毎月1回作業場等を巡視し、設備、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、衛生委員会又は安全衛生委員会を設けなければならない。
  - 常時1,000人を超える労働者を使用する事業場では、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 事業者は、当該事業場の労働者で、作業環境測定を実施している作業環境測定士であるものを衛生委員会の委員として指名することができる。
  answer: 2
  choice_notes: []
  explanation: '衛生管理者は、少なくとも**毎週1回**作業場等を巡視しなければなりません。毎月1回とする選択肢2は誤りです。


    毎月1回（一定の条件で2か月に1回）の巡視が定められているのは、産業医です。'
  figures: []
  law_note: null
