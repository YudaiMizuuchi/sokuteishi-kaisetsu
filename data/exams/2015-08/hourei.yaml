  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時50人以上の労働者を使用する事業者は、雇入れ時の健康診断を行ったときは、遅滞なく、健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 事業者は、深夜業を含む業務に常時従事する労働者に対し、原則として、6か月以内ごとに1回、定期に、一定の項目について医師による健康診断を行わなければならない。
  - 事業者は、6か月以上の期間海外に労働者を派遣するときは、原則として、あらかじめ当該労働者に対し一定の項目について医師による健康診断を行わなければならない。
  - 事業者は、常時使用する労働者に対し、原則として、1年以内ごとに1回、法令で定める項目について医師による定期健康診断を行わなければならない。
  - 事業者は、弗化水素ガスを発散する場所における業務に常時従事している労働者に対し、6か月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。
  answer: 1
  choice_notes: []
  explanation: 雇入時の健康診断の結果は、労働者数にかかわらず、所轄労働基準監督署長に報告する必要はありません。選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: 常時50人以上の労働者を使用する事業者は,雇入れ時の健康診断を行ったときは、遅滞なく,健康診断結果報告書を所轄労働基準監督署長に提出しなければならない.
  columns: null
