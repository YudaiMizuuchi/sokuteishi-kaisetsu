  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 石綿等を取り扱う屋内作業場における空気中の石綿の濃度の測定は、ろ過捕集方法及び計数方法によらなければならない。
  - ろ過捕集方法に用いるろ過材は、0.5μmの粒子を95%以上捕集する性能を有するものでなければならない。
  - 騒音の測定点は、原則として単位作業場所の床面上に6m以下の等間隔で引いた縦の線と横の線との交点の床上120cm以上150cm以下の位置としなければならない。
  - ろ過捕集方法による鉱物性粉じんの濃度の測定のための一つの測定点における試料空気の採取時間は、原則として10分間以上の継続した時間としなければならない。
  answer: 3
  choice_notes: []
  explanation: 'ろ過捕集方法に用いるろ過材は、**0.3 µm** の粒子を95％以上捕集する性能を有するものに限られます。0.5 µm とする選択肢3は誤りです。


    根拠：作業環境測定基準第1条第5号。'
  figures: []
  law_note: null
  _key_choice: ろ過捕集方法に用いるろ過材は,0.5μmの粒子を95%以上捕集する性能を有するものでなければならない.
