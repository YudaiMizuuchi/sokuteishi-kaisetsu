  stem: '電離放射線障害防止規則に関する次の記述の㋑及び㋺の［　］に入る数値の組合せとして、正しいものは下のうちどれか。ただし、放射線業務従事者は、緊急作業には従事しないものとする。


    「事業者は、男性の放射線業務従事者の受ける実効線量が5年間につき100mSvを超えず、かつ、1年間につき［㋑］mSvを超えないようにしなければならない。事業者は、放射線業務従事者の受ける等価線量が、眼の水晶体に受けるものについては1年間につき150mSv、皮膚に受けるものについては1年間につき［㋺］mSvを、それぞれ超えないようにしなければならない。」'
  choices:
  - 20 ／ 300
  - 20 ／ 500
  - 30 ／ 300
  - 50 ／ 500
  - 50 ／ 1,000
  answer: 4
  choice_notes: []
  explanation: '放射線業務従事者の実効線量の限度は、5年間につき 100 mSv、かつ1年間につき **50 mSv**（㋑）です。皮膚に受ける等価線量の限度は、1年間につき **500 mSv** です。よって（4）が正しい組合せです。


    眼の水晶体の等価線量限度は、令和3年4月の改正で「1年間につき 150 mSv」から「5年間につき 100 mSv、かつ1年間につき 50 mSv」に変わっています。'
