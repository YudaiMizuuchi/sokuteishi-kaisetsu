  explanation: '室の二酸化炭素の含有率は、**5,000 ppm 以下**としなければなりません。1,000 ppm 以下とする選択肢2は誤りです。


    根拠：事務所衛生基準規則第3条第2項。1,000 ppm は、空気調和設備で室に供給される空気についての値です。'
