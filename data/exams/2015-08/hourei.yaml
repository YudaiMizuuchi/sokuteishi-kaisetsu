  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についてのデザイン及びサンプリングの業務を行うことができない。
  - 第2種作業環境測定士は、指定作業場の作業環境測定において、粉じんの相対濃度計、検知管等の簡易測定機器を用いる分析を行うことができる。
  - 指定作業場の作業環境測定結果についての作業環境評価基準に基づく評価は、作業環境測定士ではない者に行わせることができる。
  - 溶融ガラスからガラス製品を成型する業務を行う暑熱の屋内作業場についての気温、湿度及びふく射熱の測定は、作業環境測定士でない者に行わせることができる。
  - 著しい騒音を発する屋内作業場についての等価騒音レベルの測定は、作業環境測定士でない者に行わせることができる。
  answer: 1
  choice_notes: []
  explanation: 作業環境測定士のデザイン・サンプリングの業務には、作業場の種類による制限はありません。第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングを行うことができます。選択肢1は誤りです。
  figures: []
