  stem: 労働安全衛生規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、日常行う清掃のほか、大掃除を、6か月以内ごとに1回、定期に、統一的に行わなければならない。
  - 事業者は、労働者を常時就業させる屋内作業場の気積を、設備の占める容積及び床面から3mをこえる高さにある空間を除き、労働者1人について、10m³以上としなければならない。
  - 事業者は、硫化水素濃度が10ppmを超える場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 事業者は、強烈な騒音を発する屋内作業場においては、その伝ばを防ぐため、隔壁を設ける等必要な措置を講じなければならない。
  - 事業者は、タンクの内部その他の場所で、自然換気が不十分なところにおいては、当該場所を換気するときを除き、内燃機関を有する機械を使用してはならない。
  answer: 2
  choice_notes: []
  explanation: '屋内作業場の気積は、設備の占める容積と、床面から **4 m**を超える高さにある空間を除いて計算します。3 m とする選択肢2は誤りです。


    根拠：労働安全衛生規則第600条。'
  figures: []
  law_note: null
