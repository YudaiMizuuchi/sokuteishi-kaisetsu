  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キシレンとトルエンを含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - 測定点における測定対象物質の濃度がその測定で採用した試料採取方法及び分析方法で求められる定量下限の値に満たない場合には、当該定量下限の値をその測定点の測定値とみなして、管理区分の区分を行う。
  - 測定値が管理濃度の5分の1に満たない測定点がある単位作業場所にあっては、管理濃度の5分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - 2作業日に測定を行う場合において、連続する2作業日について測定を行うことができない合理的な理由があるときは、必要最小限の間隔を空けた2作業日に測定を行うことができる。
  - 第1評価値及び第2評価値は、1作業日について測定を行った場合と連続する2 作業日について測定を行った場合とでは、異なった計算式により計算する。
  answer: 3
  choice_notes: []
  explanation: '測定値が管理濃度の **10分の1**に満たない測定点がある場合に、管理濃度の10分の1をその測定点の測定値とみなすことができます。5分の1とする選択肢3は誤りです。


    根拠：作業環境評価基準第2条第3項。'
  figures: []
  law_note: null
  _key_choice: 測定値が管理濃度の5分の1に満たない測定点がある単位作業場所にあっては,管理濃度の5分の1を当該測定点における測定値とみなして,管理区分の区分を行うことができる.
