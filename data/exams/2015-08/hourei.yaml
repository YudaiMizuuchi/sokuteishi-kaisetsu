  - 海水が滞留している暗きょの内部における作業は、第2種酸素欠乏危険作業である。
  - し尿又は汚水を入れたことのある槽の内部における作業は、第2種酸素欠乏危険作業である。
  - 酸素欠乏危険作業に労働者を従事させる場合に、作業の性質上、当該作業を行う場所を換気することが著しく困難なときには、労働者に空気呼吸器又は電動ファン付き呼吸用保護具を使用させなければならない。
