  stem: ベリリウムの分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 試料の捕集には、グラスファイバーろ紙又はメンブランフィルターを用いる。
  - 吸光光度分析法では、ベリロン(Ⅲ)を発色試薬として用いる。
  - モリン試薬を用いる蛍光光度分析法では、反応液のアルカリ濃度の影響を強く受ける。
  - 電気加熱式原子吸光分析法では、灰化温度を1,000℃以上に設定する。
  - 蛍光光度分析法において、塩化スズ(Ⅱ)溶液を加えるのは、蛍光を安定に保ち、モリンの酸化を防止するためである。
