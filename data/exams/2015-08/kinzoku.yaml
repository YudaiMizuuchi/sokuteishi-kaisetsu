  stem: 水銀の測定法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金を用いる固体捕集法では、金に捕集された水銀を加熱脱着した後、原子吸光分析法で分析する。
  - 液体補集-還元気化原子吸光分析法では、分析の際、過マンガン酸の色が消えるまで、塩酸ヒドロキシルアミン溶液を捕集液に加える。
  - 原子吸光分析法では、測定波長253.7nmの紫外吸収を用いる。
  - 塩化スズ(Ⅱ)による還元を行う際には、試料液を弱アルカリ性とする。
  - 循環方式還元気化法で気化した水銀は、ヨウ素-ヨウ化カリウム溶液中に回収する。
