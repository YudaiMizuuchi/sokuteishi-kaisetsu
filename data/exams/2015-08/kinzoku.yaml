  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石英セルは、全ての測定波長領域に用いることができる。
  - 測定波長が紫外部にある場合は、光源に重水素放電管を用いる。
  - 吸光度の測定には、通常、極大吸収波長を選定する。
  - モル吸光係数は、波長に依存する。
  - 発色反応を促進するために、加熱操作を行った試料は、発色後、直ちに測定する。
