  stem: 原子吸光分析法によるクロム酸及びその塩の分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 試料の捕集には、液体捕集法又はろ過捕集法を用いる。
  - クロム(Ⅵ)の標準液は、二クロム酸カリウムを精製水に溶かして調製する。
  - フィルター上に捕集したクロム酸及びその塩は、炭酸ナトリウム溶液を用いて抽出する。
  - 液体捕集法での捕集液体中のクロム(Ⅵ)は、APDC錯体とした後、MIBKに抽出する。
  - 測定感度は、酸化炎よりも多燃料炎の方が高く、共存するニッケル、マグネシウムなどの干渉も抑制できる。
