  stem: 金属類の分析に用いる試薬等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ジフェニルカルバジドによるクロム(Ⅵ)の測定では、硫酸酸性の硫酸濃度は0.1mol·L⁻¹以上がよい。
  - APDC-Cd錯体は、pH4以上では不安定で、有機溶媒層への抽出率は低くなる。
  - 過酸化水素水には、安定剤としてスズを含んでいるものがある。
  - 塩酸(1＋5)の濃度は、約2mol·L⁻¹である。
  - 抽出溶媒として用いるMIBKは、およそ3%までの水を溶解する。
