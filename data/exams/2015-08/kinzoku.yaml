  stem: APDC錯体を用いる溶媒抽出-原子吸光分析法によるカドミウムの分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 試料液の調製には、硝酸を用いる。
  - 標準液は、硝酸カドミウムを精製水に溶かして調製する。
  - MIBKを用いて抽出する場合、あらかじめ水を飽和させたものを用いる。
  - カドミウムのAPDC錯体をMIBKで抽出して最終試料液とする。
  - MIBK試料液では、水溶液試料に比べて、アセチレン流量を小さくする。
