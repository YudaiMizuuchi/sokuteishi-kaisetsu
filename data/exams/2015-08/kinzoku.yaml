  stem: 金属の定量に用いる試薬に関する次の記述のうち、誤っているものはどれか。
  choices:
  - pH指示薬のチモールブルーは、アルカリ性側では黄色から青色に変色する。
  - EDTAは、金属のキレート剤として用いられる。
  - 酒石酸ナトリウムカリウムは、マスキング剤として用いられる。
  - 塩酸は、グラスファイバーろ紙のケイ酸を溶出させることなく金属を溶出できる。
  - アスコルビン酸は、還元剤として使用される。
