  stem: ジチゾン(ジフェニルチオカルバゾン)を用いた溶媒抽出法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ジチゾンは、水に不溶である。
  - ジチゾンをクロロホルム、ベンゼンなどに溶解し、ジチゾン溶液を調製する。
  - 分液ロート中で金属の水溶液にジチゾン溶液を加えて激しく振とうし、金属キレートを生成する。
  - 静置後、分液ロート中の溶液は、上下2層に分離する。
  - 抽出溶媒としてクロロホルムを用いた場合、生成した金属キレートは、上層に存在する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'ジチゾンを使う溶媒抽出法で、抽出溶媒に**クロロホルム**を使った場合、クロロホルムは**水より重い**（比重約1.48）ので、生成した金属キレートは、**下層**に存在します。「上層に存在する」とする選択肢5は誤りです。


    ジチゾンは、水に不溶です。ジチゾンをクロロホルムやベンゼンなどに溶解して、ジチゾン溶液を調製します。分液ロート中で、金属の水溶液にジチゾン溶液を加えて激しく振とうして、金属キレートを生成させます。静置後、溶液は、上下2層に分離します。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
