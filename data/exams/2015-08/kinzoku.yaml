  answer: 1
  choice_notes: []
  explanation: 'ジフェニルカルバジドによるクロム(Ⅵ)の測定では、試料液の硫酸濃度は、**0.025〜0.1 mol/L**がよいとされます。「0.1 mol/L以上がよい」とする選択肢1は誤りです。同様の記述は、令和元年度第1回、平成30年度第1回などにも出題されています（出題実績）。


    APDC-Cd錯体は、pH4以上では不安定で、有機溶媒層への抽出率が低くなります。過酸化水素水には、安定剤としてスズを含んでいるものがあります。塩酸（1＋5）の濃度は、約2 mol/Lです。MIBKは、およそ3％までの水を溶解します。


