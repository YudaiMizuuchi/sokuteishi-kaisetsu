  stem: 誘導結合プラズマ原子発光分光光度法(ICP-AES)に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 原子吸光分析法に比べ、定量濃度範囲(ダイナミックレンジ)が広い。
  - プラズマ中では、金属原子及びイオンが発光している。
  - 試料溶液と標準液の酸濃度は、一致させる必要はない。
  - 定量法として、絶対検量線法、標準添加法のいずれも使用できる。
  - 内標準には、測定元素に対する分光干渉のないものを選択する。
