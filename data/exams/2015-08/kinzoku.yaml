  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 光源の輝線幅やフレームの燃焼状態は、経時的に変化する。
  - 光源の電流値を大きくするほど、吸収感度が高くなる。
  - 可燃性有機溶媒を使用する場合、燃料ガスの流量を少なくして測定する。
  - 金属の種類によって、検量線の直線性を示す濃度範囲は異なる。
  - 電気加熱原子化法(グラファイト炉法)は、フレーム原子化法に比べて測定感度は高いが、再現性は低い。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '中空陰極ランプの電流値は、**至適電流値より大きくすると**、自己吸収を起こして、吸収感度が**低下**します。「電流値を大きくするほど、吸収感度が高くなる」とする選択肢2は誤りです。同様の記述は、令和8年度第1回などにも出題されています（出題実績）。


    光源の輝線幅やフレームの燃焼状態は、経時的に変化します。可燃性有機溶媒を使うときは、燃料ガスの流量を少なくして測定します。金属の種類によって、検量線の直線性を示す濃度範囲は異なります。電気加熱原子化法は、フレーム原子化法に比べて、感度は高いですが、再現性は低いです。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
