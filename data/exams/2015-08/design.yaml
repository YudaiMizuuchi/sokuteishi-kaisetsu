  stem: 有害物質のA測定及びB測定が行われた場合の作業環境評価に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第1評価値が管理濃度と等しく、かつ、B測定値が管理濃度を超えていない場合は、管理区分は第2管理区分になる。
  - 管理濃度が10ppmの測定対象物質の濃度を測定して、測定値が0.1ppmとなる測定点があった場合は、その測定点については測定値を1ppmとみなして管理区分を決定できる。
  - 1日測定では、測定結果の評価に際して、日間変動を考慮するために、経験的に得られた推定値が用いられている。
  - A測定の第1評価値が管理濃度より小さければ、管理区分は必ず第1管理区分になる。
  - A測定の第2評価値が管理濃度を超えていれば、管理区分は必ず第3管理区分になる。
  answer: 4
