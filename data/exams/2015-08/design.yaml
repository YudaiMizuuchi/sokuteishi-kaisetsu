  stem: 環境空気中の有害物質の捕集及び分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多段平行板式分粒装置を用いて、所定の吸引流量より大きい流量で吸引すると、分粒装置を通過する粒子の50%分粒粒径は小さくなる。
  - 活性炭管に同一濃度のトルエンとアセトンの混合溶剤を捕集する場合、アセトンの方が早く破過する。
  - 直示天秤の感度は、測定する物の質量に関係なく一定である。
  - 慣性衝突式分粒装置を用いて、所定の吸引流量より大きい流量で吸引すると、分粒装置を通過する粒子の50%分粒粒径は小さくなる。
  - 慣性衝突式分粒装置では、衝突捕集板上で再飛散を生ずることがある。
  answer: 1
