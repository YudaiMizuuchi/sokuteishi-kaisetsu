  stem: '粉じんの光散乱に関する次の記述の［　　］に入る語句として、正しいものは下のうちどれか。


    「粉じん粒子に光を照射したときの光散乱の強度は、粒子の［　　］に影響されない。」'
  choices:
  - 化学組成
  - 形状
  - 平均粒径
  - 粒径分布の分散
  - 真密度
  columns: null
  answer: 5
  choice_notes: []
  explanation: '粒子に光を照射したときの光散乱の強度は、**粒子の化学組成（屈折率）、形状、平均粒径、粒径分布**などに影響されます。**真密度**（粒子の密度）には、影響されません（光散乱は、粒子の光学的な性質によるもので、質量とは直接関係しません）。よって（5）です。同様の問題は、平成29年度第1回にも出題されています（出題実績）。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
