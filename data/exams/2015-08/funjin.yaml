  stem: 粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フロート型面積式流量計に、あらかじめ刻まれている目盛りは、使用する前に使用条件に合わせた状態で流量の較正を行う。
  - 石けん膜流量計は、ローボリウムエアサンプラー用流量計の較正には用いることができない。
  - ハイボリウムエアサンプラーの捕集流量の較正は、ルーツメーターによって較正されたオリフィス流量計を用いてもよい。
  - フロート型面積式流量計の指示が脈動して読み取りが難しい場合は、流量計と吸引ポンプの間に空気だめを設けると脈動を少なくすることができる。
  - フロート型面積式流量計は、使用により内部に汚れが付くと不正確になることがある。
