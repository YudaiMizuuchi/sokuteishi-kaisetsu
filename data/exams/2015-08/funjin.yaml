  explanation: '粒子の帯電量が同じであれば、電界中での粒子の移動速度は、粒径が**小さい**ほど**速く**なります（粒径が大きいほど、受ける空気の抵抗が大きいためです）。「粒径が大きいほど速い」とする選択肢4は誤りです。同じ記述は、令和元年度第1回にも出題されています（出題実績）。


    微小粒子がブラウン運動で衝突・凝集して減る速度は、粒子の個数濃度に依存します。拡散係数は、温度が高いほど大きくなります。粒径5 µm以上の粒子では、ブラウン運動による拡散は、無視できます。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
