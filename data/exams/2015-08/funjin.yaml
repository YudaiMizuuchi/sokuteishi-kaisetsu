  rank: null
  stem: X線回折基底標準吸収補正法により、粉じん中の石英の定量を行ったところ、次のような測定結果が得られた。φ25mmのフィルター(有効直径20mm)に再発じん法により1.57mgの粉じんを捕集した。このフィルターの石英の主回折線強度は640cpsであった。粉じん中の石英含有率(%)は、下のうちどれか。ただし、X線吸収補正係数は1.20、石英の回折線強度は石英が1mg/cm²のとき6,400cpsとする。
  choices:
  - 13.0%
  - 16.7%
  - 20.0%
  - 24.0%
  - 28.2%
  columns: null
  answer: 4
  choice_notes: []
  explanation: '次の順で計算します。


    1. 採じん面の面積：有効直径20 mm（半径1 cm）なので、π × 1² ＝ 3.14 cm²

    2. 吸収補正をした回折線強度：640 cps × 1.20 ＝ 768 cps

    3. 石英が1 mg/cm²のとき6400 cpsなので、768 ÷ 6400 ＝ 0.120 mg/cm²

    4. 石英の量：0.120 × 3.14 ≒ 0.377 mg

    5. 含有率：0.377 ÷ 1.57 ≒ 0.240 ＝ **24.0％**


    よって（4）です。'
