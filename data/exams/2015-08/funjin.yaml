  stem: 粉じんのろ過捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ろ過材を構成する繊維が細いほど、粒子の捕集効率は低くなる。
  - ろ過材の空隙率が小さくなるほど、粒子の捕集効率は高くなる。
  - 粒径が1μmより大きい粒子は、主として重力、慣性力及びさえぎりによってろ過材に捕集される。
  - 粒径が0.1μmより小さい粒子は、主として拡散作用によってろ過材に捕集される。
  - 同じ流速で吸引した際の圧力損失は、ポアサイズ0.8μmのセルローズエステルメンブランフィルターの方がフッ素樹脂加工グラスファイバーろ紙よりも大きい。
