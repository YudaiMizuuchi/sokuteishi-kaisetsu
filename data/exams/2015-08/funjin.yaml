  stem: '粉じんの相対濃度計の質量濃度変換係数（K値）を求めるため、サンプリング時間を60 minとして併行測定を行い、次の結果を得た。これらの値から求められたK値の誤差として、正しい値に最も近いものは下のうちどれか。


    【結果】


    捕集された粉じんの質量：0.95 mg


    相対濃度計の計数値：2,260カウント


    【ただし】


    粉じんの捕集流量：20 L/min


    粉じん捕集前後のろ紙の秤量誤差：それぞれ0.005 mg


    吸引空気量の測定誤差：4%


    計数値の誤差：10カウント'
  choices:
  - 4.5%
  - 5.0%
  - 5.5%
  - 6.0%
  - 6.5%
  columns: null
  answer: 3
  choice_notes: []
  explanation: '質量濃度変換係数 K ＝ 質量濃度／相対濃度 の誤差は、各誤差を足し合わせて求めます。


    1. 秤量誤差による相対誤差：捕集前後の2回分なので、2 × 0.005／0.95 ≒ 1.05％

    2. 吸引空気量の測定誤差：4％

    3. 計数値の誤差：10／2260 ≒ 0.44％

    4. 合計：1.05 ＋ 4 ＋ 0.44 ≒ **5.5％**


    よって（3）です。同じ型の問題は、平成28年度第1回にも出題されています（出題実績）。'
