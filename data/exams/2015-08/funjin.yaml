  stem: 密度2.6g/cm³、粒径10.0μmの球形粒子の水中における自由落下の終末速度を測定して8.7×10⁻³cm/sを得た。同じ条件で、別に密度4.4g/cm³の粒子を測定したところ4.4×10⁻³cm/sを得た。この粒子の推定される粒径に最も近いものは、次のうちどれか。ただし、粒子は球形とし、終末速度はストークスの式に従い、また、水の密度は1.0g/cm³とする。
  choices:
  - 2.0μm
  - 3.0μm
  - 5.0μm
  - 7.0μm
  - 8.0μm
  columns: null
  answer: 3
  choice_notes: []
  explanation: '終末沈降速度は、ストークスの式から、（ρ − ρ₀）× d² に比例します（水中なので、ρ₀＝1.0 g/cm³）。


    1. 1つ目の粒子：（2.6 − 1.0）× 10.0² ＝ 1.6 × 100 ＝ 160、速度は 8.7 × 10⁻³ cm/s

    2. 2つ目の粒子：（4.4 − 1.0）× d² ＝ 3.4 d²、速度は 4.4 × 10⁻³ cm/s


    比をとると、3.4 d²／160 ＝ 4.4／8.7


    d² ＝ 160 × 4.4／（8.7 × 3.4）≒ 23.8


    d ≒ √23.8 ≒ **4.9 µm** ≒ 5.0 µm


    よって（3）です。'
