  stem: 気中の粒子のブラウン運動及び帯電粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 微小粒子がブラウン運動で衝突・凝集して粒子の個数が減少する速度は、粒子の個数濃度に依存する。
  - 粒子のブラウン運動による拡散係数は、温度が高いほど大きい。
  - 粒径5μm以上の粒子では、ブラウン運動による拡散は、無視できる。
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は、粒径が大きいほど速い。
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は、電界強度が大きいほど速い。
  columns: null
