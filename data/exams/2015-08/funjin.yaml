  stem: 光散乱方式の相対濃度計の構成及び取扱いに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 光源が白色光の場合とレーザー光の場合では、粒子による光散乱特性が異なるため、同じ粉じんであっても質量濃度変換係数に差違が生じる。
  - 相対濃度計の光学系には、前方散乱光や側方散乱光を計測する方式のものがある。
  - 質量濃度変換係数は、併行測定によって得られた相対濃度を質量濃度で除した値である。
  - 相対濃度計の指示値は、清浄空気においてもゼロではないので、この数値を差し引いたものを相対濃度とする。
  - 相対濃度計に付属する質量濃度変換係数は、平均粒子径0.3μmのステアリン酸粒子で値付けられたものである。
