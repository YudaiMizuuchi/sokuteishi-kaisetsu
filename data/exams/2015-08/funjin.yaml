  stem: 粉じんのろ過捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フッ素樹脂加工グラスファイバーろ紙の吸湿性は、石英繊維ろ紙よりも小さい。
  - ろ過材を通して空気を吸引した場合におけるろ過材の圧力損失は、流速にほぼ比例する。
  - 石英繊維フィルターでは、粒子はフィルター表面だけでなく内部でも捕集される。
  - ろ過材の捕集効率が90%のフィルターを2枚重ねて使用しても、99%の捕集効率が得られるとは限らない。
  - 多段平行板式分粒装置の50%分粒粒径は、流量の2乗に比例する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '多段平行板式分粒装置の50％分粒粒径は、流量の**1/2乗**（平方根）に比例します。「流量の2乗に比例する」とする選択肢5は誤りです。同様の記述は、令和7年度第1回にも出題されています（出題実績）。


    フッ素樹脂加工グラスファイバーろ紙の吸湿性は、石英繊維ろ紙よりも小さいです。ろ過材の圧力損失は、流速にほぼ比例します。石英繊維フィルターでは、粒子は、表面だけでなく、内部でも捕集されます。捕集効率90％のフィルターを2枚重ねて使用しても、99％の捕集効率が得られるとは限りません。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
