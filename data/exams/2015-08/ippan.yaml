  stem: 化学物質の性状及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中に浮遊する粉じんは、密度が同じであれば粒径が小さくなるほど、沈降速度は小さくなる。
  - 昇華性を有する化学物質は、環境空気中では気体及び固体粒子として存在する。
  - 金属の蒸気などが空気中で凝固や化学変化を起こし、固体の粒子として空気中に浮遊しているものをヒュームという。
  - 有機溶剤は脂溶性であり、水に溶ける有機溶剤は、ほとんどない。
