  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ヒ素では、角化症、黒皮症などの皮膚障害がみられる。
  - 二硫化炭素では、網膜の微細動脈瘤などがみられる。
  - 一酸化炭素では、ヘモグロビン合成の障害による貧血や溶血がみられる。
  - 硫化水素では、意識消失、呼吸麻痺などがみられる。
  - 金属水銀では、感情不安定、幻覚などの精神症状や手指の震えがみられる。
  answer: 3
  choice_notes: []
  explanation: 一酸化炭素は、ヘモグロビンの合成を阻害するのではなく、ヘモグロビンと強く**結合**して酸素を運べなくします。ヘモグロビン合成の障害による貧血は鉛、溶血はヒ化水素の特徴なので、選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: 一酸化炭素では,ヘモグロビン合成の障害による貧血や溶血がみられる.
  columns: null
