  stem: 金属などによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - メチル水銀は、脳が標的臓器で、慢性中毒では、視野狭窄などの症状が現れる。
  - 金属熱は、亜鉛、銅などのヒュームを吸入して発生する疾病で、悪寒、発熱、関節痛などの症状がみられる。
  - カドミウムでは、接触性皮膚炎や鼻中隔穿孔がみられる。
  - 鉛中毒では、貧血、末梢神経障害、腹部の疝痛などがみられる。
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対する発がん性が疑われている。
  answer: 3
  choice_notes: []
  explanation: 接触性皮膚炎や鼻中隔穿孔は、**6価クロム**（クロム酸など）の特徴です。カドミウムの主な健康障害は腎臓障害なので、選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: カドミウムでは,接触性皮膚炎や鼻中隔穿孔がみられる.
