  stem: 温熱条件及びその生体影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 屋外で太陽照射のある場合は、WBGTの値は自然湿球温度及び乾球温度の数値から算出される。
  - 熱痙攣は、大量の発汗があり、水のみを補給した場合に血液の塩分濃度が低下して生じる。
  - 実効温度とは、気温、湿度及び気流の総合効果を示す温度感覚を表す指標である。
  - 熱の放散は、放射(ふく射)、伝導、蒸発などの物理的な過程で行われる。
  - 相対湿度とは、ある温度における飽和水蒸気量に対する空気中の水蒸気量の比を百分率で示したものである。
  answer: 1
  choice_notes: []
  explanation: 屋外で日射がある場合の WBGT は、自然湿球温度・**黒球温度**・乾球温度の3つから算出します（0.7 × 自然湿球温度 ＋ 0.2 × 黒球温度 ＋ 0.1 × 乾球温度）。黒球温度を含めていない選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: 屋外で太陽照射のある場合は,WBGTの値は自然湿球温度及び乾球温度の数値から算出される.
