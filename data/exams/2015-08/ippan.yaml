  stem: 局所振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 機械的な振動に寒冷ばく露が重なると、振動による健康障害を起こしやすい。
  - 振動障害は、振動の周波数が高いほど起こりやすい。
  - チェーンソーの周波数補正振動加速度実効値の3軸合成値に応じて、振動ばく露時間が制限されている。
  - レイノー現象は、血管の攣縮により血流が減少するために生じる。
  - 局所振動により、手指のしびれ感などの末梢神経障害、関節痛などの筋骨格系障害を生じる。
  answer: 2
  choice_notes: []
  explanation: 局所振動障害は、周波数が高いほど起こりやすいわけではありません。影響が大きいのは比較的低い周波数で、1,000 Hz を超えるとほとんど影響しないとされています。選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: 振動障害は,振動の周波数が高いほど起こりやすい.
