  stem: 騒音に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 内耳の有毛細胞が変性し、聴力障害が生じると、騒音ばく露を中止しても聴力の回復は難しい。
  - 騒音のA測定の平均値の算定には、80dB(A)未満の測定値は含めない。
  - 騒音性難聴の初期には、4,000Hz付近に聴力低下がみられる。
  - 騒音による聴力低下は、進行しても老人性の聴力低下との区別は容易である。
  - 等価騒音レベルは、時間とともに変動する騒音がある場合、そのレベルをある時間の範囲内でこれと等しいエネルギーをもつ定常騒音の騒音レベルで表したものである。
  answer: 4
  choice_notes: []
  explanation: 騒音による聴力低下が進行すると、4,000 Hz 付近の低下（C⁵ dip）がはっきりしなくなり、老人性の聴力低下との区別は**難しく**なります。「区別は容易」とする選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: 騒音による聴力低下は,進行しても老人性の聴力低下との区別は容易である.
  columns: null
