  stem: 「労働者の心の健康の保持増進のための指針(厚生労働省)」に基づくメンタルヘルス対策に関する次の記述のうち、誤っているものはどれか。
  choices:
  - メンタルヘルスケアを中長期的視点に立って継続的かつ計画的に行うため策定する「心の健康づくり計画」は、各事業場における労働安全衛生に関する計画の中に位置付けることが望ましい。
  - 「心の健康づくり計画」の策定に当たっては、衛生委員会等において十分調査審議を行う。
  - 事業者がメンタルヘルスケアを積極的に推進する旨の表明に関することは、「心の健康づくり計画」で定めるべき事項に含まれる。
  - メンタルヘルスケアは、「セルフケア」、「家族によるケア」及び「事業場内産業保健スタッフ等によるケア」の3つのケアを効果的に推進することをいう。
  - 「セルフケア」とは、労働者自身がストレスや心の健康について理解し、自らのストレスを予防、軽減する、あるいはこれに対処することである。
  answer: 4
  choice_notes: []
  explanation: 「労働者の心の健康の保持増進のための指針」のメンタルヘルスケアは、「セルフケア」「ラインによるケア」「事業場内産業保健スタッフ等によるケア」「事業場外資源によるケア」の**4つのケア**です。「家族によるケア」を含めた3つとする選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: メンタルヘルスケアは,「セルフケア」,「家族によるケア」及び「事業場内産業保健スタッフ等によるケア」の3つのケアを効果的に推進することをいう.
