  stem: 「化学物質等による危険性又は有害性等の調査等に関する指針(厚生労働省)」に従って実施するリスクアセスメントに関する次の記述のうち、誤っているものはどれか。
  choices:
  - リスクアセスメントは、化学物質等である原材料を新規に採用し、又は変更するときのほか、化学設備等に係る作業方法や作業手順を新規に採用し、又は変更するときなどに実施する。
  - 化学物質等による危険性又は有害性の特定は、一般に、作業標準等に基づき、必要な単位で作業を洗い出した上で、国連勧告の「化学品の分類及び表示に関する世界調和システム(GHS)」で示されている危険性又は有害性の分類等に則して行う。
  - ハザードは、労働災害発生の可能性と負傷又は疾病の重大性(重篤度)の組合せであると定義される。
  - 化学物質等による疾病のリスク低減措置の検討では、個人用保護具の使用よりも局所排気装置の設置等の工学的対策を優先する。
  - 化学物質等への労働者のばく露濃度の評価を行う場合に活用できる情報の一つとして、生物学的モニタリングの結果がある。
  answer: 3
