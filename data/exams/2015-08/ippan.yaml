  stem: 電離放射線及びその影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電離放射線の被ばくによる身体的影響には、早期障害と晩発障害があり、早期障害としては皮膚障害など、晩発障害としては白内障などがある。
  - 電離放射線を放出する元素には、ウラン、ラジウムなど天然に存在するものと、コバルト60、イリジウム192など人工的につくられるものがある。
  - 電離放射線の生体に与える影響には、確率的影響と確定的影響がある。
  - X線は、通常、X線装置を用いて発生させる人工の電離放射線で、放射性物質から放出されるγ線と同様に電磁波である。
  - 白血病は、晩発障害に分類される確定的影響である。
  answer: 5
  choice_notes: []
  explanation: 白血病は、晩発障害で、しきい値がないとされる**確率的影響**に分類されます。確定的影響とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 白血病は,晩発障害に分類される確定的影響である.
