  stem: 有機溶剤による健康障害等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は脂溶性が高いので、中枢神経系などの脂肪に富んだ組織に蓄積しやすい。
  - 生物学的モニタリングの指標としての尿中馬尿酸量は、検査前に摂取した飲食物の影響を受けることがある。
  - n-ヘキサンは、多発性神経炎を起こすことがある。
  - N,N-ジメチルホルムアミドは、長期ばく露により、肝機能障害を引き起こす。
  - 有機溶剤は、呼吸器から吸収され、皮膚からは吸収されない。
  answer: 5
  choice_notes: []
  explanation: 有機溶剤は、呼吸器から吸収されるだけでなく、脂溶性があるため**皮膚からも吸収されます**。選択肢5は誤りです。
  figures: []
  law_note: null
