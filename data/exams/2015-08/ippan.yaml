  stem: 「労働安全衛生マネジメントシステムに関する指針(厚生労働省)」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - この指針は、法令の規定に基づき機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものではない。
  - 事業者は、安全衛生方針を表明し、労働者及び関係請負人その他の関係者に周知させる。
  - 定期的なシステム監査の計画を作成するとともに、その定められた手順に基づいて、システム監査を適切に実施する。
  - マネジメントシステムの中における安全衛生活動としては、従来型の危険予知(KY)活動、ヒヤリ・ハット事例の収集などを盛り込むべきではない。
  - 事業者は、その妥当性及び有効性を確保するため、手順の見直し等マネジメントシステムの全般的な見直しを定期的に行う。
  answer: 4
  choice_notes: []
  explanation: '労働安全衛生マネジメントシステムの中に、従来から行われてきた危険予知（KY）活動やヒヤリ・ハット事例の収集などの安全衛生活動を盛り込むことは差し支えなく、むしろ活用することが望まれます。「盛り込むべきではない」とする選択肢4は誤りです。


    マネジメントシステムは、既存の安全衛生活動を、計画・実施・評価・改善の仕組みの中に位置付けて回していくものです。'
  figures: []
  law_note: null
  _key_choice: マネジメントシステムの中における安全衛生活動としては,従来型の危険予知(KY)活動,ヒヤリ・ハット事例の収集などを盛り込むべきではない.
  columns: null
