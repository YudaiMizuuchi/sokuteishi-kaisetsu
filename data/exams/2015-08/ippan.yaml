  stem: 鉱物性粉じんなどに関する次の記述のうち、誤っているものはどれか。
  choices:
  - じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病で、けい肺、石綿肺、炭素肺などがある。
  - じん肺の合併症としては、肺結核、続発性気管支炎、原発性肺がんなどがある。
  - アーク溶接作業で発生するヒュームの1次粒子の粒径は、多くが10μm以上である。
  - じん肺は、ある程度進行すると、粉じんへのばく露を中止しても肺に生じた病変は治らず、さらに進行することがある。
  - 石綿粉じんに長期間ばく露されると、胸膜の中皮腫を生じることがある。
  answer: 3
  choice_notes: []
  explanation: ヒュームの一次粒子の粒径は、一般に **1 µm 以下**です。アーク溶接のヒュームの一次粒子の多くが 10 µm 以上とする選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: アーク溶接作業で発生するヒュームの1次粒子の粒径は,多くが10μm以上である.
