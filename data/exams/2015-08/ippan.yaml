  stem: 管理濃度に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度は、許容濃度の値や作業環境管理技術などを考慮して定められたものである。
  - 測定対象物質の中には、管理濃度が定められていないものがある。
  - 管理濃度は、作業環境測定で得られた個々の測定値を統計的に処理して得た評価値と比較して用いる指標である。
  - 測定対象物質の中には、管理濃度が天井値として定められているものがある。
  - 鉱物性粉じんの管理濃度は、その粉じん中の遊離けい酸含有率を用いて算出される。
