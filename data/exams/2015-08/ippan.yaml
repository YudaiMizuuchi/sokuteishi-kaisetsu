  stem: 日本産業衛生学会の許容濃度に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 許容濃度の数値は、経皮吸収がないことを前提として勧告されているものである。
  - 許容濃度の数値を労働の場以外での環境要因の許容限界値として用いてはならない。
  - 許容濃度を利用するに当たっては、労働強度、温熱条件、気圧などを考慮する必要がある。
  - 許容濃度は、作業中のばく露濃度の変動があまり大きくない場合に利用される。
  - 許容濃度は、その値を作業環境測定の結果から得られる第1評価値及び第2評価値と比較して用いる指標である。
