  stem: 有機溶剤の標準液に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸光光度分析法では、検量線上で吸光度0.03に相当する分析対象物質の標準溶液濃度を定量下限とする。
  - 有機溶剤の標準液を調製する場合は、密栓付きの容器を使用する。
  - 標準液を質量で調製する場合、質量モル濃度(mol·kg⁻¹)は、温度の影響を受けない。
  - 標準液を容量で調製する場合、モル濃度(mol·L⁻¹)は、温度の影響を受ける。
  - 標準液の保存可能期間は、濃度にかかわらず一定である。
