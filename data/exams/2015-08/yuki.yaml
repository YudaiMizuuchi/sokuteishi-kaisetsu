  - 酢酸イソペンチル
  columns: null
  answer: 2
  choice_notes: []
  explanation: '分子中の酸素原子の有無を確認します。


    - クレゾール（C₇H₈O）、テトラヒドロフラン（C₄H₈O）、シクロヘキサノン（C₆H₁₀O）、酢酸イソペンチル（C₇H₁₄O₂）は、酸素原子を含みます。

