  stem: '有機溶剤に関する次の記述の［　］に入る溶剤名として、適当なものは下のうちどれか。


    「［　］は60℃で気体であり、その25℃における液体の密度は1g·cm⁻³より大きい。」'
  choices:
  - エチルエーテル
  - 二硫化炭素
  - イソプロピルアルコール
  - 酢酸メチル
  - クロロベンゼン
  columns: null
  answer: 2
  choice_notes: []
  explanation: '60℃で気体であるためには、沸点が60℃より低い必要があります。さらに、25℃での液体の密度が1 g/cm³より大きいものを選びます。


    - 1 エチルエーテル：沸点約35℃（気体）、密度約0.71 g/cm³（1より小さい）

    - 2 **二硫化炭素**：沸点約46℃（60℃で気体）、密度約1.26 g/cm³ → 条件に合います。

    - 3 イソプロピルアルコール：沸点約82℃で、60℃では液体です。

    - 4 酢酸メチル：沸点約57℃（気体）、密度約0.93 g/cm³（1より小さい）

    - 5 クロロベンゼン：沸点約132℃で、60℃では液体です。


    よって（2）です。同様の問題は、令和5年度第1回にも出題されています（出題実績）。（沸点・密度は、一般的な化学便覧の概数です。）'
