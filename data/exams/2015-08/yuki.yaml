  stem: キャピラリーカラムを用いたガスクロマトグラフ分析法における試料注入法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キャピラリーカラム注入口には、不活性ライナーが用いられる。
  - スプリット注入法では、試料の一部がキャピラリーカラムに導入される。
  - スプリットレス注入法では、試料のほぼ全量がキャピラリーカラムに導入される。
  - スプリットレス注入法は、スプリット注入法と比較すると溶媒ピークの影響を受けにくい。
  - スプリット注入法は、ダイレクト注入法と比較すると再現性が低い。
