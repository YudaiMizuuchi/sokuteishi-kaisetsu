  stem: 次のⒶ及びⒷの有機溶剤の組合せのうち、両方とも水と混和するものはどれか。
  choices:
  - アセトン ／ キシレン
  - 1,1,1-トリクロロエタン ／ エチレングリコールモノエチルエーテル
  - テトラヒドロフラン ／ N,N-ジメチルホルムアミド
  - n-ヘキサン ／ メチル-n-ブチルケトン
  - クロロベンゼン ／ シクロヘキサノール
  columns:
  - Ⓐ
  - Ⓑ
  answer: 3
  choice_notes: []
  explanation: '水と混和する（任意の割合で混ざり合う）有機溶剤は、アセトン、テトラヒドロフラン、N,N-ジメチルホルムアミド、エチレングリコールモノエチルエーテルなどです。


    - 1 アセトン／キシレン：キシレンは、水にほとんど溶けません。

    - 2 1,1,1-トリクロロエタン／エチレングリコールモノエチルエーテル：1,1,1-トリクロロエタンは、水にほとんど溶けません。

    - 3 **テトラヒドロフラン／N,N-ジメチルホルムアミド**：どちらも、水と混和します。

    - 4 n-ヘキサン／メチル-n-ブチルケトン：どちらも、水にほとんど溶けません。

    - 5 クロロベンゼン／シクロヘキサノール：どちらも、水に限られた量しか溶けません。


    よって（3）です。（溶解度は、一般的な化学便覧の概数です。）'
