  stem: 次の有機溶剤のうち、25℃における飽和蒸気圧が最も小さいものはどれか。
  choices:
  - 酢酸エチル
  - アセトン
  - メタノール
  - 1,2-ジクロロエチレン
  - トルエン
  columns: null
  answer: 5
  choice_notes: []
  explanation: 飽和蒸気圧は、沸点が高い物質ほど小さくなります。沸点は、アセトンが約56℃、1,2-ジクロロエチレンが約48〜60℃、メタノールが約65℃、酢酸エチルが約77℃、**トルエンが約111℃**です。トルエンが最も高く、蒸気圧は最も小さいので、（5）です。同じ問題は、令和6年度第1回にも出題されています（出題実績）。（沸点は、一般的な化学便覧の概数です。）
