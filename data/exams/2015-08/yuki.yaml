  stem: キャピラリーカラムを用いたガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 内径が細いカラムの方が、単位長さ当たりの理論段数が大きい。
  - カラムの長さが2倍になると、保持時間及び理論段数はいずれも約2倍になる。
  - 試料中の成分のカラム内の移動速度は、成分ごとに異なる。
  - 移動相と固定相との分配平衡は、速やかに成立する。
  - カラムの液相の膜厚が厚くなると、保持時間は短くなる。
