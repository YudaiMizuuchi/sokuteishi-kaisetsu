  stem: 個人サンプリング法による測定（C・D 測定）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - C 測定では、均等ばく露作業に従事する労働者が5人以上の場合は、5人以上の労働者を選定し、サンプラーを装着する。
  - 均等ばく露作業に従事する労働者が5人未満の場合には、作業時間を分割してサンプリングを行い、C 測定の測定値の数を5以上とする。
  - C 測定におけるサンプリング時間は、サンプラーを装着する労働者が単位作業場所において作業に従事する全時間としなければならない。
  - D 測定は、有害物質の発生源に近接する場所において作業が行われる場合、気中濃度が最大になると考えられる時間に行う。
  - D 測定のサンプリング時間は、連続した 15 分間である。
  answer: 3
  choice_notes: []
  explanation: 'C 測定のサンプリング時間は、原則として労働者が単位作業場所で作業に従事する全時間ですが、作業時間が2時間を超える場合は、2時間を下回らない範囲で採取時間を短くすることができます。「全時間としなければならない」とする選択肢3は誤りです。


    作業時間が2時間以下の場合は、全時間を採取時間とします。「2時間」を境に扱いが変わる点を押さえておきましょう。'
  figures: []
  law_note: null
  _key_choice: C測定におけるサンプリング時間は、サンプラーを装着する労働者が単位作業場所において作業に従事する全時間としなければならない。
