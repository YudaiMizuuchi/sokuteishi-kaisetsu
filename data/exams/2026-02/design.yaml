  rank: null
  summary: null
  stem: A・B 測定の単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の人数や作業時間などを考慮する必要はない。
  - 単位作業場所の設定に当たっては、作業場の区域を、労働者の行動範囲、有害物質の分布状況などの判断基準によって層別化を行う。
  - 単位作業場所の範囲を決める際には、作業場内の気流の影響を考慮しなくてもよい。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は同一とする。
  - 有機溶剤による金属の洗浄を行う工場で働く労働者の行動範囲が当該工場内全体であるが、有機溶剤の分布が発生源周辺に限定されると考えられる場合には、発生源周辺の区域を単位作業場所としてよい。
  answer: 3
  choice_notes: []
  explanation: '単位作業場所は、有害物質の濃度分布と労働者の行動範囲から決めます。作業場内の気流は、有害物質がどの範囲に広がるかを左右するので、単位作業場所を決めるときには考慮しなければなりません。選択肢3は誤りです。


    一方、選択肢1のとおり、作業場で働く労働者の人数や作業時間は考慮しません。単位作業場所は「濃度がほぼ同じとみなせる区域」なので、濃度分布に関係する気流は考え、濃度分布に関係しない人数や時間は考えない、と理由で区別しておきましょう。'
  figures: []
  law_note: null
  _key_choice: 単位作業場所の範囲を決める際には、作業場内の気流の影響を考慮しなくてもよい。
