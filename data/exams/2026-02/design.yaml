  stem: 次の有害物質のうち、個人サンプリング法による測定（C・D 測定）の対象となっていないものはどれか。
  choices:
  - カドミウム
  - 三酸化二アンチモン
  - 粉状の硫酸ニッケル
  - 溶接ヒューム
  - 鉛
  answer: 4
  choice_notes: []
  explanation: '溶接ヒュームは、作業環境測定（A・B 測定や C・D 測定）の対象ではありません。金属アーク溶接等作業では、特定化学物質障害予防規則に基づいて、労働者の個人ばく露濃度を測る別の仕組み（溶接ヒュームの濃度の測定）が定められています。よって、答えは（4）です。


    溶接は屋外や移動しながらの作業も多く、場所の濃度を測る作業環境測定ではばく露をとらえにくいため、個人のばく露を測る方法がとられています。'
  figures: []
  law_note: null
