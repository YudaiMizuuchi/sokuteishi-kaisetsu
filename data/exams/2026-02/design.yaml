  explanation: '対数正規分布で、値の範囲が −∞〜∞ になるのは幾何平均値の**対数**です。幾何平均値そのものは濃度と同じ単位をもち、必ず0より大きい値になります。選択肢2は誤りです。


    対数正規分布は、濃度の対数をとると正規分布になる分布です。「対数の世界」では正規分布と同じように −∞〜∞ を考えますが、元の濃度の世界に戻すと必ず正の値になります。幾何標準偏差が必ず1以上になる（選択肢3）のも、同じ考え方で説明できます。'
