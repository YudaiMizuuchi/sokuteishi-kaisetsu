  stem: 固体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭の活性化は、乾燥した空気又は窒素の気流中で、約200℃での加熱、脱水により行うことができる。
  - シリカゲルは、100～110℃で約1時間加熱して活性化したものを用いる。
  - ポーラスポリマー管に捕集した試料は、活性炭管に捕集した試料に比べて、加熱脱着が容易である。
  - 捕集剤には、シリカゲル、活性炭などの吸着剤、ガスクロマトグラフ分析用のカラム充填剤が使用されるが、金属繊維を捕集剤として使用することもある。
  - 固体捕集-加熱脱着-パージトラップ法は、熱分解する可能性のある物質などに適している。
  answer: 5
  choice_notes: []
  explanation: '固体捕集-加熱脱着-パージトラップ法は、捕集した物質を加熱して脱着させる方法なので、熱で分解しやすい物質には向きません。「熱分解する可能性のある物質に適している」とする選択肢5は誤りです。


    加熱脱着法は、溶媒で薄めないので低濃度の物質を高感度で測れるのが長所です。その反面、加熱に弱い物質には使えない、と長所と短所をセットで覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 固体捕集-加熱脱着-パージトラップ法は、熱分解する可能性のある物質などに適している。
