  - 5.9 × 10⁻⁶ Bq･cm⁻³
  - 1.5 × 10⁻⁵ Bq･cm⁻³
  - 4.9 × 10⁻⁵ Bq･cm⁻³
  - 5.8 × 10⁻⁵ Bq･cm⁻³
  answer: 5
  choice_notes: []
  explanation: '空気中の放射性物質の濃度は、正味計数率を「計数効率 × 捕集率 × 吸引した空気の体積」で割って求めます。


    吸引した空気の体積 ＝ 90 L/min × 40 時間 × 60 分 ＝ 216,000 L ＝ 2.16 × 10⁸ cm³


    濃度 ＝ 3.4 × 10³ ÷ (0.32 × 0.85 × 2.16 × 10⁸) ≒ 5.8 × 10⁻⁵ Bq/cm³


    よって、最も近いのは（5）です。


    単位は Bq/cm³ なので、空気の体積を L から cm³ に直す（1 L ＝ 1,000 cm³）ことを忘れないようにしましょう。計数効率と捕集率の片方だけを掛けると、別の選択肢の値になります。'
