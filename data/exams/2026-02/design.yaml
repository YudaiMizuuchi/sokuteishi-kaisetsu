  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B 測定を行う必要がある単位作業場所で、連続する2作業日にわたって測定を行う場合は、第1日目と第2日目ともに、B 測定を行う。
  - B 測定に圧電天秤方式の粉じん計を用いる場合は、測定時間を2分に合わせて連続して5回測定し、各測定値の算術平均値を B 測定値とする。
  - 相対濃度指示方法によって B 測定を行った場合、質量濃度変換係数はA 測定で用いる係数と同じものを用いる。
  - 検知管5本を用いても、測定時間の合計が10 分に満たない場合は、10 分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値をB 測定値とする。
  - 有害物質の濃度が高くなると考えられる作業位置が複数あり、どの作業位置が最大濃度になるか予測できない場合には、それらの全ての作業位置で測定を行い、各測定値の算術平均値を B 測定値とする。
  answer: 5
  choice_notes: []
  explanation: 'B測定で、濃度が高くなると考えられる作業位置が複数あり、どこが最大になるか予測できない場合は、それらの全ての位置で測定し、そのうちの**最大値**をB測定値とします。算術平均値とする選択肢5は誤りです。


    B測定は「最も濃度が高くなる位置と時間」を押さえるための測定です。複数の位置を測るのはその最大を見落とさないためなので、平均してしまっては目的に合いません。'
  figures: []
  law_note: null
  _key_choice: 有害物質の濃度が高くなると考えられる作業位置が複数あり、どの作業位置が最大濃度になるか予測できない場合には、それらの全ての作業位置で測定を行い、各測定値の算術平均値をB測定値とする。
