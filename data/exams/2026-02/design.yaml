  stem: 常温・常圧（25 ℃、1気圧）の環境空気中における有害物質Ⓐと、その物質の状態Ⓑとの次の組合せのうち、誤っているものはどれか。ただし、ここで、ガスとは常圧下における沸点が常温よりも低いものをいい、蒸気とは常圧下における沸点が常温よりも高いもので気体となっているものをいうこととする。
  choices:
  - ヨウ化メチル ／ 蒸気
  - 二硫化炭素 ／ 蒸気
  - 硫化水素 ／ ガス
  - ホルムアルデヒド ／ ガス
  - 1,2-ジクロロプロパン ／ ガス
  answer: 5
  choice_notes: []
  explanation: '1,2-ジクロロプロパンは沸点が約 96℃で、常温（25℃）では液体です。問題文の定義では、沸点が常温より高い物質が気体になっているものは「蒸気」なので、ガスとする選択肢5は誤りです。


    ヨウ化メチル（沸点約 42℃）と二硫化炭素（約 46℃）は沸点が常温より高いので蒸気、硫化水素（約 −60℃）とホルムアルデヒド（約 −19℃）は沸点が常温より低いのでガスです。ガスか蒸気かは、沸点が常温より上か下かで判断します。'
  figures: []
  law_note: null
  _key_choice: 1,2-ジクロロプロパンガス
  columns:
  - Ⓐ
  - Ⓑ
