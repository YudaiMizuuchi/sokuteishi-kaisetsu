  stem: 作業環境測定の対象物質の状態に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガス状物質には、ガス及び蒸気がある。
  - 固体に研磨、切削などの機械的な作用を加えて発生した固体の微粒子が、空気中に浮遊しているものは、粉じんである。
  - 気体が空気中で凝固し、固体の微粒子となって空気中に浮遊しているものは、ヒュームである。
  - 液体の微粒子が空気中に浮遊しているものは、ミストである。
  - ミストの粒径は、一般に、ヒュームの一次粒子よりも小さい。
  answer: 5
  choice_notes: []
  explanation: 'ミストは液体の微粒子で、粒径は一般に数 µm から数十 µm 程度です。一方、ヒュームは気化した物質が空気中で凝固した固体の微粒子で、一次粒子は 1 µm 以下と非常に小さいものです。ミストの方がヒュームの一次粒子より大きいので、選択肢5は誤りです。


    粒子の大きさは「どうやってできたか」で覚えると整理できます。固体を削ったり砕いたりしてできる粉じん、液体が飛び散ってできるミストは比較的大きく、蒸気が冷えて固まってできるヒュームは細かくなります。'
  figures: []
  law_note: null
  _key_choice: ミストの粒径は、一般に、ヒュームの一次粒子よりも小さい。
- num: 2
