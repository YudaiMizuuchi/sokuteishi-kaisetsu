  stem: 作業環境測定の対象物質の状態に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガス状物質には、ガス及び蒸気がある。
  - 固体に研磨、切削などの機械的な作用を加えて発生した固体の微粒子が、空気中に浮遊しているものは、粉じんである。
  - 気体が空気中で凝固し、固体の微粒子となって空気中に浮遊しているものは、ヒュームである。
  - 液体の微粒子が空気中に浮遊しているものは、ミストである。
  - ミストの粒径は、一般に、ヒュームの一次粒子よりも小さい。
  answer: 5
