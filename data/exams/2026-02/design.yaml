  stem: 騒音の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定点の位置は、単位作業場所の床面上に任意の基点を定め、原則として、この基点を軸として6m 以下の等間隔で引いた縦の線と横の線との交点のうちから5個の点を選び、測定点とする。
  - 縦の線の間隔と横の線の間隔は必ずしも同一とする必要はない。
  - 測定点の高さは床上1.2 m以上1.5 m以下とするが、作業者が作業台等に乗って作業をする場合は、当該作業が行われる作業床から1.2 m以上1.5 m以下とする。
  - 1測定点における測定時間は10分間以上の継続した時間とし、各測定点の測定時間は等しくする。
  - A 測定のみを実施した場合の管理区分の決定は、A 測定の算術平均値は用いるが、標準偏差は用いない。
  answer: 1
  choice_notes: []
  explanation: '騒音の A 測定の測定点は、粉じんなどの A 測定と同じく、6 m 以下の等間隔で引いた縦の線と横の線の**交点を全て**測定点とします。交点の中から5個を選んで測定点にする、という方法ではないので、選択肢1は誤りです。


    交点を測定者が選ぶと、測る場所に偏りが入るおそれがあります。等間隔の線の交点を全て測るのは、測定者の判断を入れずに場を代表させるためです。'
  figures: []
  law_note: null
  _key_choice: A測定点の位置は、単位作業場所の床面上に任意の基点を定め、原則として、この基点を軸として6m以下の等間隔で引いた縦の線と横の線との交点のうちから5個の点を選び、測定点とする。
