  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石けん膜流量計は、石けん膜が所定の体積を通過する時間から流量を求める流量計である。
  - 面積式流量計は、テーパー管内の浮子が停止したとき、浮子とテーパー管の間隙の面積とそこを流れている流量とが比例することを利用している。
  - 湿式ガスメーターを用いて流量計の校正を行う場合には、湿式ガスメーターは、ポンプより上流側に接続する。
  - オリフィス流量計は、オリフィス板の上流側と下流側との間に生じる圧力差が流量と一定の関係を示すことを利用している。
  - ハイボリウムエアサンプラーの流量校正は、設置型のルーツメーターを用いると精度よく行うことができるが、測定現場では、ルーツメーターによって校正されたオリフィス流量計を二次的な基準流量計として用いることが多い。
