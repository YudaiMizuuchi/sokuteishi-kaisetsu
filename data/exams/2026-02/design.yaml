  stem: 放射性物質を取り扱っている作業場において、試料空気をサンプリングし、その試料を測定した結果、測定装置の正味計数率は、3.4× 10³ s⁻¹であった。そのときの空気中の放射性物質の濃度として、正しい値に最も近いものは次のうちどれか。ただし、測定装置の計数効率は 32 ％、試料空気の吸引流量は毎分 90 L、試料採取時間は 40 時間、使用する捕集材の捕集率は 85 ％ とする。
