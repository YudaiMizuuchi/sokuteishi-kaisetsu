  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石綿粉じんの捕集には、オープンフェース型ホルダーを用いる。
  - 鉱物性粉じん中に含まれる遊離けい酸の分析に用いるサンプルの捕集には、分粒装置付きホルダーを用いる。
  - グラスファイバーフィルターによる微細粒子の捕集では、ろ過流速が速いほど、拡散作用による捕集率は増加する。
  - 一般に、フィルターによる粒子の捕集率は、粒径が 0.1 ～ 0.3 µm程度の粒子で最も低くなる。
  - 石綿粉じんの捕集にはメンブランフィルターが、鉱物性粉じんの捕集にはグラスファイバーフィルターが用いられる。
  answer: 3
  choice_notes: []
