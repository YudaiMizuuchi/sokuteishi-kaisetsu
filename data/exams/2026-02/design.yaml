  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点を決めるために等間隔で引いた縦の線と横の線は、建屋の形状などにより、直交しなくてもよい。
  - 有害物質の発生源の間隔が等間隔で配置されている場合は、測定点の縦又は横の線の間隔が発生源の間隔と一致しないようにする。
  - 単位作業場所における有害物質の濃度がほぼ均一であることが明らかなときは、測定点は、6 mを超える等間隔で引いた縦の線と横の線との交点としてよい。
  - 単位作業場所の範囲が狭く、縦の線と横の線の交点の数が5未満になるときは、測定点の数が5となるよう、下図のように測定点を設定してもよい。
  - 単位作業場所が著しく狭く、かつ、単位作業場所における空気中の有害物質の濃度がほぼ均一であることが明らかなため、測定点の数を3点とした場合には、3点のうちいずれか2点で2回繰り返し測定を行うことによって、測定値の総数を5とする。
  answer: 5
  choice_notes: []
  explanation: '測定点が5未満になる場合に、同じ測定点で繰り返し測定して測定値の総数を5以上にするときは、**各測定点の繰り返しの回数を同じ**にします。3点のうち2点だけを2回測るという方法では、一部の点の重みだけが大きくなり、単位作業場所の濃度を偏りなく代表できません。選択肢5は誤りです。


    3点の場合は、各点で2回ずつ測って総数を6とします。A測定は「場を偏りなく代表させる」測定なので、点ごとの扱いを変えないのが原則です。'
  figures:
  - file: 2026-02-design-03-1.png
    alt: 問3の図
  law_note: null
  _key_choice: 単位作業場所が著しく狭く、かつ、単位作業場所における空気中の有害物質の濃度がほぼ均一であることが明らかなため、測定点の数を3点とした場合には、3点のうちいずれか2点で2回繰り返し測定を行うことによって、測定値の総数を5とする。
- num: 4
