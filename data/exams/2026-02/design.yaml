  explanation: 'ヨウ化メチルの捕集には、シリカゲル管ではなく活性炭管などの吸着剤を用います。選択肢3は不適当な組合せとして誤りです。


    この組合せは繰り返し出題されている型です。物質と捕集器具の組合せは、まず「粒子かガス・蒸気か」で捕集方法を絞り、ガス・蒸気なら吸着剤の種類まで覚える、という順で整理しましょう。'
