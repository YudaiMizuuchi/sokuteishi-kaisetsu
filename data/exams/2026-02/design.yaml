  stem: 検知管に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 検知管法では、測定対象ガスを含む試料空気の一定量が検知管内に吸引されることが求められるので、実測前に真空法ガス採取器（ガス採取器）の空気漏れ試験を行う。
  - ガス採取器から漏れが確認された場合には、ピストン及びシリンダー内部のグリースや検知管取付口のゴムの劣化を確認し、必要に応じてグリースの塗布やゴムの交換を行う。
  - 通気終了後、時間の経過とともに着色が変化する場合があるので、濃度の読み取りは速やかに行う。
  - 検知限度とは、変色がわずかに認められる最低濃度のことである。
  - 検知管の濃度目盛は、25℃、1気圧を基準にして目盛付けがされている。
  answer: 5
