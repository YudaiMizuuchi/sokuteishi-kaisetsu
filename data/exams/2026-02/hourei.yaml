  stem: 国内で使用される次の呼吸用保護具を製造したとき、法令上、厚生労働大臣の登録を受けた者が行う型式検定を受けなければならないものに該当しないものはどれか。
  choices:
  - 使い捨て式防じんマスク
  - 吸気補助具付き防じんマスク
  - 有機ガス用防毒マスク
  - ハロゲンガス用の防毒機能を有する電動ファン付き呼吸用保護具
  - 送気マスク
  answer: 5
  choice_notes: []
  explanation: '送気マスクは、型式検定の対象となっている呼吸用保護具ではありません。よって答えは（5）です。


    型式検定の対象は、防じんマスク（使い捨て式、吸気補助具付きを含む）、一定の防毒マスク（ハロゲンガス用、有機ガス用、一酸化炭素用、アンモニア用、亜硫酸ガス用）、電動ファン付き呼吸用保護具です。送気マスクは、外部から空気を送る構造で、ろ過によって有害物質を除く保護具とは仕組みが違います。'
  figures: []
  law_note: null
  _key_choice: 送気マスク
