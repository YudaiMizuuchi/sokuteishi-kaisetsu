  stem: 酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 炭酸水を湧出している地層に接しているたて坑の内部における作業は、第1種酸素欠乏危険作業である。
  - 硫化鉱を入れてある貯蔵施設の内部における作業は、第2種酸素欠乏危険作業である。
  - 第1種酸素欠乏危険作業に労働者を従事させるときは、当該作業を行う作業場における空気中の酸素の濃度を測定するため必要な測定器具を備え、又は容易に利用できるような措置を講じておかなければならない。
  - 第2種酸素欠乏危険作業に係る酸素欠乏危険作業主任者が行わなければならない事項には、第2種酸素欠乏危険作業を行う場所について、その日の作業を開始する前に、当該作業を行う場所の空気中の酸素及び硫化水素の濃度を測定することがある。
  - 通風が不十分な場所において、アルゴン、ヘリウム等を使用して行う溶接の作業に労働者を従事させるときは、作業を行う場所の空気中の酸素の濃度を18％以上に保つよう換気し、又は労働者に空気呼吸器等を使用させなければならない。
  answer: 2
  choice_notes: []
  explanation: '硫化鉱を入れてある貯蔵施設の内部は、硫化鉱が酸化して酸素を消費するため、酸素欠乏のおそれがある場所です。硫化水素中毒のおそれまである場所ではないので、ここでの作業は**第1種**酸素欠乏危険作業です。第2種とする選択肢2は誤りです。


    第2種酸素欠乏危険作業は、し尿・汚水・腐泥などがあって、酸素欠乏に加えて硫化水素中毒の危険もある場所での作業です。「硫化」という言葉に引きずられないよう、硫化水素が発生する場所かどうかで判断しましょう。'
