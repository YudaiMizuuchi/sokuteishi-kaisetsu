  stem: 労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 医師、歯科医師及び労働衛生コンサルタントについては、衛生管理者免許を有していない者であっても、衛生管理者として選任することができる。
  - 常時使用する労働者数が、2000人を超え3000人以下である事業場においては、衛生管理者を5人以上選任しなければならない。
  - 2人以上の衛生管理者を選任する必要がある事業場においては、そのうち1人を専任の衛生管理者としなければならない。
  - 多量の高熱物体を取り扱う業務及び著しく暑熱な場所における業務に常時500人以上の労働者を従事させる事業場においては、その事業場に専属の産業医を選任しなければならない。
  - 常時3000人を超える労働者を使用する事業場においては、2人以上の産業医を選任しなければならない。
  answer: 3
  choice_notes: []
  explanation: '専任の衛生管理者が必要になるのは、常時1,000人を超える労働者を使用する事業場と、常時500人を超え、そのうち一定の有害業務に常時30人以上を従事させる事業場です（労働安全衛生規則第7条）。衛生管理者を2人以上選任する事業場の全てが該当するわけではないので、選択肢3は誤りです。


    衛生管理者の「人数」は事業場の規模で決まり、「専任」が必要かどうかは、さらに規模や有害業務の人数で決まります。2つを混同させる問題です。'
