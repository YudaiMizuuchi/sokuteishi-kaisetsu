  stem: 次の有害物質、有害要因等の測定のうち、法令上、誤っているものはどれか。
  choices:
  - 溶融ガラスからガラス製品を成型する業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 冷凍庫で、労働者がその内部で作業を行うものについては、半月以内ごとに1回、定期に、当該作業場における気温及び湿度を測定しなければならない。
  - 気温が28℃をこえ、又はこえるおそれのある坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における気温を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率を測定しなければならない。
  - 著しい振動を発生させる振動工具については、6か月以内ごとに1回、定期に、当該振動工具の周波数補正振動加速度実効値の3軸合成値を測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: '振動工具の周波数補正振動加速度実効値の3軸合成値を、6か月以内ごとに定期に測定しなければならない、という法令の定めはありません。選択肢5は誤りです。


    振動工具の振動の値は、工具のメーカーが表示した値などを使って、作業者の日振動ばく露量を管理するのが基本です。ほかの選択肢の、暑熱・寒冷の作業場の気温・湿度（半月以内ごと）、坑内の気温（半月以内ごと）、事務所の空気環境（2か月以内ごと）は、いずれも法令で定められた測定です。


    根拠：作業環境測定を行うべき作業場を定めた労働安全衛生法施行令第21条にも、労働安全衛生規則にも、振動工具の振動値の定期測定の定めはありません。'
  figures: []
  law_note: null
  _key_choice: 著しい振動を発生させる振動工具については、6か月以内ごとに1回、定期に、当該振動工具の周波数補正振動加速度実効値の3軸合成値を測定しなければならない。
- num: 9
