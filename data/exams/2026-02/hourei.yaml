  stem: 鉛中毒予防規則に関する次の記述のうち、誤っているものはどれか。ただし、同規則に定める適用除外及び特例はないものとする。
  choices:
  - 鉛化合物とは、鉛と鉛以外の化学物質との化合物で、鉛を当該化合物の重量の10％以上含有するものをいう。
  - 鉛業務に労働者を従事させるときは、硝酸水溶液その他の手洗い用溶液、爪ブラシ、石けん及びうがい液を作業場ごとに備え、作業終了後及び必要に応じ、当該労働者にこれらを使用させなければならない。
  - 法令に基づき設置する局所排気装置の除じん装置は、ろ過除じん方式又はこれと同等以上の性能を有するものとしなければならない。
  - 鉛作業主任者の職務には、法令に基づき設置した局所排気装置を毎週1回以上点検することが含まれる。
  - 鉛業務に係る健康診断結果に基づき作成した鉛健康診断個人票については、5年間保存しなければならない。
