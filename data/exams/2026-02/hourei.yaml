  stem: 事業場における化学物質管理に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - リスクアセスメント対象物を製造し、又は取り扱う事業場においては、常時使用する労働者数にかかわらず、化学物質管理者を選任しなければならない。
  - リスクアセスメント対象物を製造している事業場において選任する化学物質管理者は、都道府県労働局長の免許を受けた者又はこれと同等以上の能力を有すると認められる者のうちから選任しなければならない。
  - 化学物質管理者の選任は、化学物質管理者を選任すべき事由が発生した日から14日以内に行わなければならない。
  - 化学物質による災害が発生した事業場のうち、化学物質の管理が適切に行われていない疑いがあるものとして所轄労働基準監督署長から化学物質の管理の状況について改善すべき旨を指示されたものは、遅滞なく、化学物質管理専門家から当該事業場における化学物質の管理の状況についての確認及び当該事業場が実施しうる望ましい改善措置に関する助言を受けなければならない。
  - 作業環境測定士として登録を受け、その後6年以上作業環境測定士としてその業務に従事した経験を有し、かつ、厚生労働省労働基準局長が定める講習を修了した者は、化学物質管理専門家となることができる。
  answer: 2
  choice_notes: []
  explanation: 'リスクアセスメント対象物を製造する事業場の化学物質管理者は、厚生労働大臣が定める専門的な講習を修了した者などから選任します。都道府県労働局長の免許を受けた者から選ぶ、という定めではないので、選択肢2は誤りです。


    化学物質管理者には免許の制度はありません。製造する事業場では講習の修了が求められ、取り扱うだけの事業場では、講習の受講が推奨されるにとどまります。'
  figures: []
  law_note: null
  _key_choice: リスクアセスメント対象物を製造している事業場において選任する化学物質管理者は、都道府県労働局長の免許を受けた者又はこれと同等以上の能力を有すると認められる者のうちから選任しなければならない。
