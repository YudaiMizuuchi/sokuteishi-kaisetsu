    - それに当たらず、第1種と第2種の合計が5％を超えれば、第2種有機溶剤等

    - どちらにも当たらず、有機溶剤の合計が5％を超えれば、第3種有機溶剤等


    （5）は、第1種が1％で第1種有機溶剤等には当たりませんが、第1種と第2種の合計が6％で5％を超えるので、**第2種有機溶剤等**です。第3種有機溶剤等とする選択肢5は誤りです。


    （4）は第1種と第2種の合計が4％なので第2種に当たらず、第3種有機溶剤等で正しい判定です。'
