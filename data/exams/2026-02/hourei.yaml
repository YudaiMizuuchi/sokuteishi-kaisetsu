  explanation: '鉛中毒予防規則でいう「鉛化合物」は、鉛と鉛以外の物質との化合物で、鉛の含有率による限定はありません。「鉛を重量の10％以上含有するもの」という定めは、**鉛合金**の定義です。選択肢1は誤りです。


    鉛合金は「鉛と鉛以外の金属の合金で、鉛を重量の10％以上含有するもの」、鉛化合物は「鉛の化合物」と、定義の違いを押さえておきましょう。鉛健康診断個人票の保存は5年間です。'
