  stem: 石綿障害予防規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石綿の分析の業務に労働者をつかせるときに、当該業務に関する安全又は衛生のための特別の教育を行う必要はない。
  - 石綿作業主任者の職務には、作業に従事する労働者が石綿等の粉じんにより汚染されないように、作業の方法を決定し、労働者を指揮すること、保護具の使用状況を監視することが含まれる。
  - 石綿等を常時取り扱う作業場の床等については、水洗する等粉じんの飛散しない方法によって、毎日1回以上、掃除を行わなければならない。
  - 石綿等を取り扱う屋内作業場について作業環境測定を行うときは、取り扱う石綿の種類が明らかな場合を除き、エックス線回折分析法により石綿の種類を分析しなければならない。
  - 石綿健康診断を受診した労働者に係る石綿健康診断個人票については、当該労働者が当該事業場において、石綿等の取扱いに伴い石綿の粉じんを発散する場所における業務に、常時従事しないこととなった日から40年間保存しなければならない。
  answer: 4
  choice_notes: []
  explanation: '石綿等を取り扱う屋内作業場の作業環境測定では、取り扱う石綿の種類が明らかでない場合に、エックス線回折分析法で石綿の種類を分析しなければならない、という定めはありません。選択肢4は誤りです。


    石綿の空気中の濃度は、ろ過捕集した試料の繊維を顕微鏡で数えて求めます。種類の同定は、建材などの石綿含有の分析で使われる手法で、作業環境測定の手順とは別のものです。


