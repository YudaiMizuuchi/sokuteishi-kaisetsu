  stem: 作業主任者に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業主任者のうち、高圧室内作業主任者は、都道府県労働局長の免許を受けた者でなければならない。
  - 作業主任者となるための技能講習には、学科講習のみによって行われるものと、学科講習及び実技講習によって行われるものがある。
  - エックス線作業主任者及びガンマ線透過写真撮影作業主任者は、管理区域ごとに選任しなければならない。
  - 新たに職長として職務につくこととなった作業主任者に対しては、安全又は衛生のための教育を行う必要はない。
  - 作業主任者のうちから事業者が指名した者を衛生委員会の委員としなければならない。
  answer: 5
  choice_notes: []
  explanation: '衛生委員会の委員に、作業主任者の中から指名した者を含めなければならない、という定めはありません。選択肢5は誤りです。


    衛生委員会の委員として含めなければならないのは、総括安全衛生管理者など（議長）、衛生管理者、産業医と、衛生に関する経験を有する者です。事業場の労働者である作業環境測定士は、委員に指名することが「できる」とされています。'
  figures: []
  law_note: null
  _key_choice: 作業主任者のうちから事業者が指名した者を衛生委員会の委員としなければならない。
