  stem: 次の業務に労働者をつかせるとき、法令に基づく安全又は衛生のための特別の教育を行わなければならないものに該当しないものはどれか。
  choices:
  - 設備による注水又は注油をしながら行う作業を除く特定粉じん作業に係る業務
  - 石綿使用建築物等解体等作業に係る業務
  - 廃棄物の焼却施設に設置された集じん機等の設備の保守点検等の業務
  - 特定化学物質を製造し、又は取り扱う業務
  - 酸素欠乏危険場所における作業に係る業務
  answer: 4
  choice_notes: []
  explanation: '特定化学物質を製造し、または取り扱う業務は、労働安全衛生規則で定める特別教育の対象業務ではありません。よって答えは（4）です。


    特定化学物質や有機溶剤の業務は、特別教育ではなく、技能講習を修了した作業主任者の選任によって管理する仕組みになっています。特定粉じん作業、石綿の解体等の作業、ダイオキシン類に関わる廃棄物焼却施設の業務、酸素欠乏危険作業は、特別教育の対象です。'
  figures: []
  law_note: null
  _key_choice: 特定化学物質を製造し、又は取り扱う業務
