  - 常時特定粉じん作業を行う屋内作業場について、法令に基づく作業環境測定を行ったときは、その都度、所定の事項を記録して、これを7年間保存しなければならない。
  - 粉じん作業を行う坑内作業場のうち、ずい道等の内部において、ずい道等の建設の作業を行うものにおいては、ずい道等の長さが短いこと等により、空気中の粉じんの濃度の測定が著しく困難な場合を除き、半月以内ごとに1回、定期に、当該坑内作業場の切羽に近接する場所の空気中の粉じんの濃度を測定し、その都度、所定の事項を記録して、これを7年間保存しなければならない。
