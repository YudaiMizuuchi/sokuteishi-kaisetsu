  stem: 個人サンプリング法に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定士試験に合格した者が、個人サンプリング法について登録を受けるためには、登録講習機関が行う講習において、個人サンプリング法に係る講習の科目を受講しなければならない。
  - 有機溶剤に係る登録のみを受けた第1種作業環境測定士であって、個人サンプリング法について登録を受けた者は、特定化学物質に係る個人サンプリング法によるデザイン及びサンプリングを行うことができない。
  - 特定化学物質の濃度の測定のうち、特別有機溶剤は、その種類及び作業方法にかかわらず個人サンプリング法の対象となるが、その他の特定化学物質の中には、個人サンプリング法の対象とならないものがある。
  - 放射性物質取扱作業室における放射性物質の濃度の測定は、個人サンプリング法の対象とならない。
  - 測定対象物以外の物が測定値に影響を及ぼすおそれがない場合には、個人サンプリング法においても検知管方式による測定機器を使用することができる測定対象物がある。
  answer: 2
  choice_notes: []
  explanation: '個人サンプリング法による「デザイン及びサンプリング」は、作業場の種類による制限がありません。有機溶剤の登録だけを受けた第1種測定士でも、個人サンプリング法の登録を受けていれば、特定化学物質に係る個人サンプリング法のデザイン・サンプリングを行えます。選択肢2は誤りです。


    作業環境測定士の登録区分による制限は、主に「分析」の業務の範囲にかかるものです。デザイン・サンプリングと分析で、資格の範囲の考え方が違う点を押さえておきましょう。'
  figures: []
  law_note: null
  _key_choice: 有機溶剤に係る登録のみを受けた第1種作業環境測定士であって、個人サンプリング法について登録を受けた者は、特定化学物質に係る個人サンプリング法によるデザイン及びサンプリングを行うことができない。
