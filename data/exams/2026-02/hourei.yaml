  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 炭酸ガスが停滞するおそれのある坑内の作業場において、炭酸ガス濃度を測定する際の測定点は、切羽と坑口との間に坑の分岐点がある場合を除き、切羽と坑口との中間の位置及び切羽に、それぞれ1以上としなければならない。
  - 暑熱の屋内作業場における気温及び湿度の測定の測定点は、単位作業場所について、当該単位作業場所の中央部の床上50 cm以上150 cm以下の位置に、1以上としなければならない。
  - 著しい騒音を発する屋内作業場における等価騒音レベルの測定においては、単位作業場所が著しく狭い場合であって、当該単位作業場所における等価騒音レベルがほぼ均一であることが明らかなときは、測定点を5未満とすることができる。
  - 一つの測定点における鉱物性粉じんの試料空気の採取時間は、測定方法にかかわらず、10分間以上でなければならない。
  - 冷却凝縮捕集方法は、ガス状の放射性物質を捕集する場合のみに行うことができる捕集方法である。
  answer: 4
  choice_notes: []
  explanation: '1つの測定点における試料空気の採取時間は、原則として10分間以上ですが、相対濃度指示方法による測定や、直接捕集方法、検知管方式による測定などは例外とされています。「測定方法にかかわらず10分間以上」とする選択肢4は誤りです。


    例外になる方法は、いずれも短い時間で測定値が得られるものです。相対濃度計を使う場合は、1点あたりの時間を短くできる代わりに、単位作業場所全体の採取時間を1時間以上にします。'
  figures: []
  law_note: null
  _key_choice: 一つの測定点における鉱物性粉じんの試料空気の採取時間は、測定方法にかかわらず、10分間以上でなければならない。
