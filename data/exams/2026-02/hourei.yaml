  stem: 法令により、定期に作業環境測定を行うべき作業環境測定対象Ⓐ、測定頻度Ⓑ及び記録の保存期間Ⓒの組合せとして、誤っているものはどれか。
  choices:
  - 空気中の鉛の濃度 ／ 1年以内ごとに1回 ／ 3年
  - 空気中のニッケル化合物の濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中の二硫化炭素の濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中のメチルエチルケトンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中のベンゼンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  answer: 4
  choice_notes: []
  explanation: 'メチルエチルケトンは第2種有機溶剤で、作業環境測定の記録の保存期間は**3年間**です。30年間とする選択肢4は誤りです。


    30年間保存するのは、ニッケル化合物やベンゼンのような特別管理物質の記録です。鉛は1年以内ごとに1回・3年間、二硫化炭素（第1種有機溶剤）は6か月以内ごとに1回・3年間です。'
  figures: []
  law_note: null
  _key_choice: Ⓐ空気中のメチルエチルケトンの濃度 Ⓑ6か月以内ごとに1回 Ⓒ30年
