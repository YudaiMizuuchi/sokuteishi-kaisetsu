  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定と B 測定を行った場合、第1管理区分となるのは、A 測定の第1評価値とB測定の測定値がいずれも管理濃度よりも小さい場合のみである。
  - 連続する2作業日について、2作業日ともに2以上の測定点において B測定を行った場合、1日目の最大値と2日目の最大値の算術平均値をB 測定の測定値とする。
  - C 測定のみを行った場合、C 測定の第2評価値が管理濃度を超えていれば、第1評価値にかかわらず、第3管理区分となる。
  - C測定とD 測定を行った場合、C 測定の第1評価値が管理濃度以上であり、第2評価値が管理濃度以下であれば、D 測定値が管理濃度よりも小さくても、第2管理区分となる。
  - 石綿は、5 μm 以上の繊維のみが作業環境評価の対象となる。
  answer: 2
