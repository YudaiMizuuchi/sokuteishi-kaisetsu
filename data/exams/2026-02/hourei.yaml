  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定士試験に合格し、かつ、登録講習機関が行う講習を修了した者は、作業環境測定士となる資格を有する。
  - 作業環境測定士となる資格を有する者が作業環境測定士となるには、指定登録機関に備えられた作業環境測定士名簿に、所定の事項について登録を受けなければならない。
  - 放射性物質に係る登録のみを受けた第1種作業環境測定士は、光散乱方式による相対濃度計を用いた鉱物性粉じんに係る作業環境測定を行うことはできない。
  - 第2種作業環境測定士は、検知管方式による測定機器を用いた分析の業務を行うことができる。
  - 著しい騒音を発する屋内作業場における等価騒音レベルに係る作業環境測定は、作業環境測定士でない者が行うことができる。
  answer: 3
  choice_notes: []
  explanation: '第1種作業環境測定士は、第2種作業環境測定士が行うことのできる業務（デザイン・サンプリングと、簡易測定機器による分析）を全て行うことができます。放射性物質の登録だけを受けた第1種測定士でも、相対濃度計を用いた鉱物性粉じんの測定は行えるので、選択肢3は誤りです。


    第1種の登録区分（鉱物性粉じん、放射性物質など）は、分析機器を使う「分析」の業務の範囲を決めるものです。簡易測定機器による測定は、第2種の資格の範囲として、作業場の種類にかかわらず行えます。'
  figures: []
  law_note: null
  _key_choice: 放射性物質に係る登録のみを受けた第1種作業環境測定士は、光散乱方式による相対濃度計を用いた鉱物性粉じんに係る作業環境測定を行うことはできない。
