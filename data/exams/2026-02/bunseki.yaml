  - 2.5 気圧
  answer: 2
  choice_notes: []
  explanation: '炭素の燃焼は C ＋ O₂ → CO₂ で、酸素 1 mol から二酸化炭素 1 mol ができます。反応の前後で気体の物質量は変わらないので、温度が 25℃ に戻れば、圧力も燃焼前の酸素と同じ 1.0 気圧になります。よって（2）が正しいものです。


    気体の圧力は、温度と体積が同じなら気体の物質量に比例します。反応式で気体の分子の数がどう変わるかを見れば、計算をしなくても答えが出ます。'
