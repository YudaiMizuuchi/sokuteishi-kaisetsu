  stem: 作業環境測定における X 線回折分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 定性分析の試料には、乳鉢ですり潰した粉末などが用いられる。
  - 結晶物質の定量は、回折線の強度測定で行う。
  - X 線検出器は、X 線のスペクトル分析ができるものでなければならない。
  - 内標準物質を混合することで、試料の質量吸収係数の影響をなくして定量を行うことができる。
  - 定量成分と同一の純物質を既知量添加して、その回折線強度の増加分と元の回折線強度から定量を行うことができる。
  answer: 3
  choice_notes: []
  explanation: '作業環境測定の X 線回折分析法では、単一の波長の特性 X 線を使い、回折線が現れる角度で物質を見分けます。そのため、X 線検出器に X 線のスペクトル（波長の分布）を分析する機能は必要ありません。選択肢3は誤りです。


    回折角は、X 線の波長と結晶の面の間隔で決まります。波長が1つに決まっていれば、角度を測るだけで結晶面の間隔がわかり、物質を同定できます。'
