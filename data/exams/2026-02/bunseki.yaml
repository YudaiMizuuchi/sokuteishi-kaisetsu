  stem: ディフュージョンチューブ（拡散セル）を用いた標準ガスの調製に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ディフュージョンチューブは液体溜めと拡散管からできている。
  - ディフュージョンチューブはテフロンなどのガス透過性材料でできている。
  - 希釈空気の流量、あるいはディフュージョンチューブの温度を変えることにより標準ガスの濃度を変えることができる。
  - ディフュージョンチューブを用いる際は、チューブ全体を一定の温度に保つ。
  - ディフュージョンチューブの一方の端は解放した状態で使用する。
  answer: 2
  choice_notes: []
  explanation: 'ディフュージョンチューブ（拡散セル）は、液体溜めの液面から出た蒸気が、細い拡散管の中を拡散して外に出てくる仕組みです。容器の壁を透過させる仕組みではないので、ガス透過性の材料で作る必要はありません。選択肢2は誤りです。


    テフロンなどのガス透過性の材料で作られ、壁を通して物質を少しずつ出すのは、パーミエーションチューブです。「拡散管を通る」拡散セルと、「壁を透過する」パーミエーションチューブの違いが、繰り返し問われています。'
  figures: []
  law_note: null
