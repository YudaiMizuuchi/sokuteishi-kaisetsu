  stem: 濃度 0.1 mol･L⁻¹の次の水溶液のうち、そのpHの値が最も大きいものはどれか。
  choices:
  - 塩酸
  - 硝酸
  - 硫酸
  - フッ化水素酸
  - ヨウ化水素酸
  answer: 4
  choice_notes: []
  explanation: '同じ濃度の酸では、弱い酸ほど水素イオン濃度が小さく、pH が大きくなります。選択肢のうち、塩酸、硝酸、硫酸、ヨウ化水素酸は強酸ですが、フッ化水素酸は弱酸なので、pH が最も大きいのは（4）です。


    ハロゲン化水素酸のうち、フッ化水素酸だけが弱酸で、塩酸・臭化水素酸・ヨウ化水素酸は強酸です。フッ素と水素の結合が非常に強く、水中で電離しにくいためです。'
  figures: []
  law_note: null
  _key_choice: フッ化水素酸
