  explanation: '図で、Ⓐは電子励起状態（三重項）から基底状態への下向きの遷移なので**りん光**、Ⓑは電子励起状態（一重項）から基底状態への下向きの遷移なので**蛍光**、Ⓒは基底状態から励起状態への上向きの遷移なので**吸光**です。よって（5）が正しい組合せです。


    上向きの矢印は光を吸収してエネルギーの高い状態に上がる過程、下向きの矢印は光を出して下がる過程です。下向きのうち、一重項から出るものが蛍光、いったん三重項に移ってから出るものがりん光です。'
