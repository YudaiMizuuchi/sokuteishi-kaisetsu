  stem: ガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - カラム温度が高いほど、ピークの分離度は小さくなる。
  - カラム温度が高いほど、保持時間は短くなる。
  - カラム温度が高いほど、キャリヤーガスの粘度は小さくなる。
  - 試料気化室の温度は、通常、カラム温度よりも高めに設定される。
  - 検出器の温度は、通常、カラム温度よりも高めに設定される。
  answer: 3
  choice_notes: []
  explanation: '気体の粘度は、液体とは逆に、温度が高いほど**大きく**なります。「カラム温度が高いほどキャリヤーガスの粘度は小さくなる」とする選択肢3は誤りです。


    液体は温度が上がるとさらさらになりますが、気体は分子の運動が激しくなって互いにぶつかる回数が増え、流れにくくなります。そのため、昇温分析ではカラム温度が上がるにつれてキャリヤーガスの流量が減ることがあります。'
