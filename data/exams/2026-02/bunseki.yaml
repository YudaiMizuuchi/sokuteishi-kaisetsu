  stem: 次の物理量、物理定数又は単位名称Ⓐとその SI 基本単位による表現Ⓑとの組合せのうち、誤っているものはどれか。
  choices:
  - 圧力 ／ m⁻¹kg s⁻²
  - 気体定数 ／ J K mol
  - ヘルツ ／ s⁻¹
  - クーロン ／ s A
  - オーム ／ m²kg s⁻³A⁻²
  answer: 2
  choice_notes: []
  explanation: '気体定数の単位は J・K⁻¹・mol⁻¹ で、J（ジュール）は SI 組立単位です。SI 基本単位で表すと m² kg s⁻² K⁻¹ mol⁻¹ になるので、「J K mol」とする選択肢2は誤りです。


    組立単位は定義の式から組み立てます。圧力 ＝ 力 ÷ 面積 なので m⁻¹ kg s⁻²、ヘルツは1秒あたりの回数なので s⁻¹、クーロン ＝ 電流 × 時間 なので s A です。オーム（電気抵抗）は m² kg s⁻³ A⁻² で、ここは暗記で構いません。'
  figures: []
  law_note: null
  _key_choice: Ⓐ気体定数 ⒷJ K mol
  _stem_head: 次の物理量、物理定数又は単位名称AとそのSI基本単位による表現Bとの組合せのうち、誤っているものはどれか。AB
