  stem: 分析に使用するガラス製体積計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ビュレットは最小目盛の 1/ 10までを読みとる。
  - ホールピペットの容量に対する許容誤差の割合は、一般に、容量が小さいものの方が大きい。
  - ホールピペットに溶液を吸引する際には、中間の膨らんだ部分を持つのがよい。
  - 同じ容量のメスピペットとホールピペットでは、メスピペットの方が許容誤差が大きく設定されている。
  - 洗浄後、乾燥器で加熱すると、ガラスが膨張し変形するため正しく体積が測定できなくなる場合がある。
  answer: 3
  choice_notes: []
  explanation: 'ホールピペットに溶液を吸い上げるときは、中央の膨らんだ部分ではなく、**上部の細い部分**を持ちます。膨らんだ部分を手で握ると、体温でガラスや溶液が温まって体積が変わり、正確な量が量れなくなるためです。選択肢3は誤りです。


    ガラス製体積計は、温度による体積の変化を避けることが基本です。乾燥器で加熱すると変形して体積が狂うことがある（選択肢5）のも、同じ理由です。'
  figures: []
  law_note: null
  _key_choice: ホールピペットに溶液を吸引する際には、中間の膨らんだ部分を持つのがよい。
  _stem_head: 分析に使用するガラス製体積計に関する次の記述のうち、誤っているものはどれか。
