  stem: 質量パーセント濃度が 40.0 ％の硫酸（密度 1.30 g･cm⁻³）100 mLを精製水（密度 1.00 g･cm⁻³）で希釈し、質量パーセント濃度を 10.0 ％としたい。このときに必要な精製水の量として、正しい値は次のうちどれか。
  choices:
  - 195 mL
  - 300 mL
  - 390 mL
  - 420 mL
  - 442 mL
  answer: 3
  choice_notes: []
  explanation: '薄めても溶質（硫酸）の質量は変わらない、という関係を使います。


    40.0 ％ 硫酸 100 mL の質量 ＝ 100 mL × 1.30 g/cm³ ＝ 130 g


    その中の硫酸の質量 ＝ 130 g × 0.400 ＝ 52.0 g


    10.0 ％ にしたときの溶液の質量 ＝ 52.0 g ÷ 0.100 ＝ 520 g


    加える精製水 ＝ 520 g − 130 g ＝ 390 g ＝ 390 mL


    よって（3）が正しい値です。


    溶液の量を体積（100 mL）のまま計算すると 300 mL（選択肢2）になります。質量パーセント濃度の計算は、必ず密度を使って質量に直してから行いましょう。'
