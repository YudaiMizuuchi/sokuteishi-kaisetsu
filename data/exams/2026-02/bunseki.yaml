  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 透過率（透過光の強さ / 入射光の強さ）の逆数の対数が吸光度である。
  - 透過率は、光路の長さに反比例する。
  - 吸光度は、測定対象物質の濃度に比例する。
  - 測定対象物質の濃度の異なる溶液の吸光度を測定して、検量線を作成する。
  - 定量分析は、検量線の直線範囲内で行う。
  answer: 2
  choice_notes: []
  explanation: '吸光度は光路の長さに比例しますが、透過率は光路の長さに反比例するわけではありません。吸光度 A ＝ −log T なので、光路長が2倍になると吸光度は2倍、透過率は2乗（たとえば 0.5 が 0.25）になります。選択肢2は誤りです。


    「比例するのは吸光度、透過率は指数的に減る」と覚えておけば、光路長や濃度を変えたときの問題にも対応できます。'
