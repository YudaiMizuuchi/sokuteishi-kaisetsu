  stem: 精製水の製造に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金属製やガラス製の蒸留水製造装置からは、イオンの溶出がある。
  - ろ過に用いるメンブランフィルターは、孔径 0.1 ～ 0.2 µmのものを用いる。
  - 逆浸透法では、原料水中の不純物のイオンを除去できる。
  - 逆浸透法における加圧は、原料水の浸透圧を超えてはならない。
  - イオン交換法では、中性の有機成分を除くことはできない。
  answer: 4
  choice_notes: []
  explanation: '逆浸透法では、原料水側に**浸透圧を超える**圧力をかけて、水だけを膜の反対側に押し出し、イオンなどの不純物を除きます。「浸透圧を超えてはならない」とする選択肢4は誤りです。


    浸透は、本来、濃度の低い側から高い側へ水が移動する現象です。これと逆向きに水を動かすので「逆浸透」と呼び、そのためには浸透圧より大きな圧力が必要になります。'
  figures: []
