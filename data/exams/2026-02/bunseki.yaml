  stem: 容量分析に用いる試薬に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 硫酸溶液の標定には、炭酸ナトリウムが用いられる。
  - 水酸化ナトリウム溶液の標定には、アミド硫酸（スルファミン酸）が用いられる。
  - 硝酸銀溶液の標定には、塩化ナトリウムが用いられる。
  - エチレンジアミン四酢酸二ナトリウム溶液の標定には、チオ硫酸ナトリウムが用いられる。
  - 標定に用いる反応は、平衡定数が大きく、反応速度が大きいことが必要である。
  answer: 4
  choice_notes: []
  explanation: 'エチレンジアミン四酢酸二ナトリウム（EDTA）溶液の標定には、亜鉛や炭酸カルシウムなどの金属を含む標準物質を用います。チオ硫酸ナトリウムはヨウ素滴定で使う滴定液で、EDTA の標定には用いないので、選択肢4は誤りです。


    標定は「濃度を正確に知りたい溶液」を、その溶液と確実に反応する標準物質で滴定して濃度を決める操作です。EDTA は金属イオンと反応するので、標準物質も金属を含むものになります。'
