  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フレーム法では、一般に、アセチレンを燃料ガスとし空気を助燃ガスとした化学炎が目的元素の原子化に用いられる。
  - フレーム法では、吸引して噴霧された試料溶液のうち数％から10％程度がフレームに送られる。
  - グラファイト炉法では、試料導入の後、炉の温度を100℃程度の乾燥、500～600℃の灰化と段階的に上昇させてから1000～3000℃で原子化を行う。
  - グラファイト炉法で共存元素による化学干渉の影響を受けるときは、重水素ランプを用いたバックグラウンド補正が行われる。
  - 還元気化法では、水銀イオンを塩化スズ（Ⅱ）などの還元剤で還元して水銀の原子化を行う。
  answer: 4
