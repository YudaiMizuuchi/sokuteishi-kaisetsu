  stem: 有機化合物に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フェノールの水溶液は、酸性を示す。
  - アニリンの水溶液は、アルカリ性を示す。
  - プロピオン酸の水溶液は、酸性を示す。
  - トルエンは水によく溶ける。
  - アセトンは水によく溶ける。
  answer: 4
  choice_notes: []
  explanation: 'トルエンはベンゼン環にメチル基が付いた炭化水素で、極性がほとんどないため、水にはほとんど溶けません。選択肢4は誤りです。


    アセトンは極性の大きいカルボニル基をもつので、水とよく混ざります。「似たもの同士が溶け合う」（極性のあるものは水に、極性のないものは油に溶ける）という原則で判断できます。フェノールとプロピオン酸は酸性、アニリンはアルカリ性（塩基性）を示します。'
  figures: []
  law_note: null
  _key_choice: トルエンは水によく溶ける。
