  stem: 捕集材に空気を流量 100 mL･min⁻¹で 60.0 分間通気して物質 A を 50.30 µg捕集した。捕集材の物質 A に対する捕集効率が 75 ％であるとき、物質 A の空気中濃度（µg･L⁻¹）の数値として適切なものは次のうちどれか。
  choices:
  - '6.3'
  - '6.29'
  - '11'
  - '11.2'
  - '11.18'
  answer: 3
  choice_notes: []
  explanation: '捕集量を捕集効率で割って空気中にあった量に直し、通気量で割ります。


    通気量 ＝ 100 mL/min × 60.0 分 ＝ 6,000 mL ＝ 6.00 L


    空気中の量 ＝ 50.30 µg ÷ 0.75 ≒ 67.1 µg


    濃度 ＝ 67.1 µg ÷ 6.00 L ≒ 11.2 µg/L


    ただし、計算に使った値のうち、捕集効率 75 ％ は有効数字が2桁しかありません。掛け算・割り算の結果は、有効数字が最も少ない値に合わせるので、答えは2桁の 11 です。よって（3）が適切です。


    計算そのものだけでなく、有効数字の扱いまで問われている問題です。選択肢に同じ値の桁違い（11、11.2、11.18）が並んでいたら、有効数字を確認しましょう。'
  figures: []
  law_note: null
  _key_choice: '11'
  _stem_head: 捕集材に空気を流量100mL・min-1で60.0分間通気して物質Aを50.30μg捕集した。捕集材の物質Aに対する捕集効率が75%であるとき、物質Aの空気中濃度(μg・L-1)の数値として適切なものは次のうちどれか。
