  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 総括安全衛生管理者が選任されている場合には、当該者がリスクアセスメント及びリスク低減措置の実施を統括管理する。
  - リスクアセスメント及びリスク低減措置の実施に当たり、必要に応じ入手すべき情報として、個人ばく露測定の結果、特殊健康診断の結果、生物学的モニタリングの結果がある。
  - 危険性又は有害性の特定方法として、リスクアセスメント対象物について、リスクアセスメント及びリスク低減措置の対象となる業務を洗い出した上で、リスクアセスメント対象物の管理濃度及び濃度基準値が設定されている場合は、これらに即して行う方法がある。
  - リスクの見積り方法として、CREATE-SIMPLE や ECETOC TRA を用いて、リスクアセスメント対象物の性状や作業方法等に関する情報と濃度基準値又はばく露限界に関する情報を入力して見積もる方法がある。
  - リスクアセスメント対象物に係る労働災害が発生した場合には、休業の有無や日数にかかわらず、必ずリスクアセスメントを行う。
  answer: 5
  choice_notes: []
  explanation: '指針では、リスクアセスメント対象物による労働災害が発生した場合に、過去に行ったリスクアセスメントの内容に問題があるときに、リスクアセスメントを行うこととされています。休業の有無などにかかわらず「必ず」行う、とする選択肢5は誤りです。


    リスクアセスメントを行う時期の基本は、化学物質を新たに採用・変更するとき、作業方法や作業手順を新たに採用・変更するときなど、リスクが変わるきっかけがあったときです。'
  figures: []
  law_note: null
  _key_choice: リスクアセスメント対象物に係る労働災害が発生した場合には、休業の有無や日数にかかわらず、必ずリスクアセスメントを行う。
