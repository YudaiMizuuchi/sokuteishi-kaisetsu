  - ヒュームは、固体が蒸発しその後凝縮した固体粒子で、空気中に浮遊している液体の微粒子であるミストに比べ、その粒径は小さい。
  - アクリルアミドは、25℃、1気圧下において固体である。
  - ジクロロメタンの蒸気密度はトルエンの蒸気密度より小さく、また、25℃における蒸気圧はトルエンの蒸気圧より小さい。
  - N,N-ジメチルホルムアミドは、脂溶性と水溶性をともに有している。
  answer: 4
  choice_notes: []
  explanation: 'ジクロロメタン（分子量約 85）の蒸気密度は、トルエン（分子量約 92）より小さい点は正しいのですが、25℃ の蒸気圧は、沸点が約 40℃ と低いジクロロメタンの方がトルエン（沸点約 111℃）よりはるかに大きくなります。蒸気圧も小さいとする選択肢5は誤りです。


    蒸気密度は分子量で、蒸気圧は沸点で比べるのが基本です。分子量が近い物質どうしでも、沸点が大きく違えば蒸気圧は大きく違います。'
