  stem: 化学物質による健康影響及びその管理指標等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 半数致死濃度（LC₅₀）と半数致死量（LD₅₀）は、いずれも急性毒性を評価する指標である。
  - 一般に、しきい値がないとされる発がん物質のリスク評価には無毒性量（NOAEL）が、しきい値があるとされる物質のリスク評価には最小毒性量（LOAEL）が用いられる。
  - ばく露限界は、ほとんど全ての労働者がばく露されても健康に影響を受けないと考えられる濃度又は量のしきい値であり、量-影響関係や量-反応関係から導かれる。
  - 変異原性試験とは、化学物質が細胞の遺伝子に突然変異を引き起こすかどうかを調べるもので、発がん性のスクリーニング試験として利用される。
  - BEI（生物学的ばく露指標）は、ACGIH（米国産業衛生専門家会議）が、生物学的モニタリングの結果を評価する際の指標として示した値である。
  answer: 2
  choice_notes: []
  explanation: 'しきい値がないとされる発がん物質では、どんなに少ない量でもリスクがゼロにならないと考えるため、無毒性量（NOAEL）のような「影響が出ない量」を決めることができません。この場合は、がんのリスクが一定の確率以下にとどまる量（実質安全量など）で評価します。NOAEL や LOAEL は、しきい値がある物質の評価に用いる指標なので、選択肢2は誤りです。


    「しきい値あり → NOAEL・LOAEL」「しきい値なし（発がん性） → リスクの確率で評価」と、指標の使い分けを整理しておきましょう。'
  figures: []
  law_note: null
  _key_choice: 一般に、しきい値がないとされる発がん物質のリスク評価には無毒性量(NOAEL)が、しきい値があるとされる物質のリスク評価には最小毒性量(LOAEL)が用いられる
