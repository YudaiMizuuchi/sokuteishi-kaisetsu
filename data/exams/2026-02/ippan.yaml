  explanation: '赤血球のヘモグロビンをメトヘモグロビンに変え、チアノーゼを起こすのは、アニリンやニトロベンゼンなどの芳香族アミノ化合物・ニトロ化合物です。トリレンジイソシアネート（TDI）の代表的な健康障害は、眼や気道への刺激と、感作による職業性ぜんそくです。選択肢3は誤りです。


