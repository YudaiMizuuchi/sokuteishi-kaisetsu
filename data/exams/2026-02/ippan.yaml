  stem: 有機溶剤による人体への影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は脂溶性が高く、中枢神経系など脂肪に富んだ組織に蓄積しやすい。
  - 酢酸メチルによる健康障害では、視力低下や視野狭窄などを生じる。
  - トルエンによる健康障害では、再生不良性貧血などの造血器障害を生じる。
  - ハロゲン化炭化水素系有機溶剤は、一般に、肝臓に対する毒性が強い。
  - n-ヘキサンによる健康障害としては、多発性神経炎がある。
  answer: 3
  choice_notes: []
  explanation: '再生不良性貧血などの造血器障害を起こす有機溶剤は、ベンゼンです。トルエンは、中枢神経系への作用（頭痛、めまい、意識障害など）が中心で、造血器障害は起こしません。選択肢3は誤りです。


    トルエンは、毒性の強いベンゼンの代わりとして広く使われるようになった溶剤です。名前と構造が似ているので、「造血障害はベンゼンだけ」とはっきり区別しておきましょう。'
  figures: []
  law_note: null
  _key_choice: トルエンによる健康障害では、再生不良性貧血などの造血器障害を生じる。
