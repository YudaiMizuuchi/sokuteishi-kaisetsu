  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 各危険有害性クラスには、危険有害性の大きさにより区分された、区分1から区分4までの4つの危険有害性区分がある。
  - 危険有害性を表す絵表示には9種類あるが、このうち、健康に対する有害性に関するものは4種類である。
  - 複数の危険有害性を持つ化学品の場合、複数の絵表示を表示することが原則であるが、健康に対する有害性の絵表示を付す場合には優先順位があり、下の㋑の絵表示を付した場合には、下の㋺の絵表示は付さない。（図を参照）
  - ラベルに記載する注意喚起語には、「警告」と「危険」の2種類があるが、「危険」を適用する場合には、「警告」は使用しない。
  - 安全データシート（SDS）に記載すべき事項には「その他の情報」を含む16項目あり、これらの項目の番号、項目名及び順序を変更してはならない。
  answer: 1
  choice_notes: []
  explanation: 'GHS の危険有害性区分の数は、危険有害性クラスごとに違います。急性毒性のように区分1〜5まであるもの、発がん性のように区分1（1A、1B）と区分2のもの、区分が1つしかないものなどがあり、全てのクラスが区分1〜4の4つに分かれているわけではありません。選択肢1は誤りです。


    どのクラスでも、区分1が最も危険で、数字が大きくなるほど危険性は小さくなります。区分の数と、数字の向きをあわせて押さえておきましょう。'
  figures:
  - file: 2026-02-ippan-02-1.png
    alt: 選択肢3の絵表示（㋑ どくろ、㋺ 感嘆符）
  law_note: null
  _key_choice: 各危険有害性クラスには、危険有害性の大きさにより区分された、区分1から区分4までの4つの危険有害性区分がある。
