  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - マンガンの生物学的モニタリングの指標として、尿中又は血液中のマンガンの量がある。
  - 鉛にばく露された場合、血液中の鉛濃度の上昇は速やかにみられ、尿中δ-アミノレブリン酸の量の上昇はこれより遅れてみられる。
  - フェノールは代謝されて、尿中にベンゼンとして排泄される。
  - 有機溶剤へのばく露を示す指標物質を含む尿の採取は、当該有機溶剤を取り扱う作業日が連続している場合は、連続した作業日のうちで後半の作業日の取扱い作業終了時に行うのがよい。
  - 体内に取り込まれた有害物質は、代謝過程を経て無害になることもあるが、代謝産物が毒性を示し障害の原因となることもある。
  answer: 3
  choice_notes: []
  explanation: 'ベンゼンが体内で代謝されるとフェノールなどになり、尿中に排泄されます。向きが逆で、フェノールが代謝されてベンゼンになるわけではありません。選択肢3は誤りです。


    体内の代謝は、多くの場合、物質を水に溶けやすい形に変えて尿として出しやすくする方向に進みます。ベンゼンにヒドロキシ基を付けたフェノールの方が水に溶けやすいので、代謝の向きは「ベンゼン → フェノール」です。'
  figures: []
  law_note: null
  _key_choice: フェノールは代謝されて、尿中にベンゼンとして排泄される。せつ
