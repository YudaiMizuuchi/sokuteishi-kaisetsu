  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 二酸化窒素は、赤褐色の気体（25℃、1気圧下）で、急性中毒では粘膜刺激症状が、慢性中毒では歯牙酸蝕症や慢性気管支炎がみられる。
  - エチレンイミンは、強いアンモニア臭を有する液体で、眼に対する重篤な損傷性や皮膚感作性があるほか、腎臓や肝臓に障害を引き起こす。
  - トリレンジイソシアネート（TDI）は、赤血球中のヘモグロビンを酸素の運搬機能がないメトヘモグロビンに変化させるため、呼吸器や皮膚から体内に入ると、チアノーゼや貧血を起こす。
  - ナフタレンは、特徴的な臭気のある昇華性を有する固体で、眼の痛みやかすみ、流涙などの眼の障害を起こすほか、皮膚炎を引き起こす。
  - ベンゾトリクロリドは、無色の液体で、皮膚や粘膜への強い刺激性があり、肺がんを起こすおそれがある。
  answer: 3
