  stem: 金属及びその化合物による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アルキル水銀化合物が経口的に摂取された場合の標的臓器は脳で、視野狭窄、聴覚障害、運動障害などが生じる。
  - カドミウムにばく露されると、腎機能障害を起こし、通常は尿中に排泄されない低分子たんぱく質が排泄されるようになるため、低分子たんぱく質である β₂-ミクログロブリンの尿中の量は、カドミウムばく露の生物学的モニタリング指標として用いられる。
  - クロム化合物のうち、クロムが6価のものは、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって、鼻中隔穿孔、肺がんなどを生じる。
  - コバルト及びその化合物は、体内に入ると、貧血、末梢神経障害、腎機能障害を生じるほか、生殖毒性がある。
  - ニッケルは、呼吸器や皮膚に対する感作性があるほか、腎臓に対し障害を引き起こす。
  answer: 4
  choice_notes: []
  explanation: 'コバルトとその化合物の代表的な健康障害は、気管支ぜんそくや接触皮膚炎などのアレルギー性の疾患と、超硬合金を扱う作業での肺の線維化（いわゆる超硬合金肺）です。貧血や末梢神経障害を生じる物質としては扱われていないので、選択肢4は誤りです。


    金属の健康障害は、金属ごとに代表的なものを1つずつ押さえるのが効率的です。アルキル水銀は中枢神経、カドミウムは腎臓、6価クロムは鼻中隔穿孔と肺がん、ニッケルは感作性と肺がん、コバルトは感作性、と対応させて覚えましょう。'
  figures: []
  law_note: null
  _key_choice: コバルト及びその化合物は、体内に入ると、貧血、末梢神経障害、腎機能しょう障害を生じるほか、生殖毒性がある。
  review_note: コバルトの代表的な健康障害を、アレルギー性疾患と超硬合金肺と説明しています。確認中です。
