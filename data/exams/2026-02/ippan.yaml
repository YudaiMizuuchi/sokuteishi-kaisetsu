  stem: 粉じん及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度1g・cm⁻³ の球形粒子の直径である。
  - 吸引性粉じんの空気力学相当径は、100 μm程度以下である。
  - 作業環境測定において鉱物性粉じんをろ過捕集法で捕集する場合、分粒装置を使用することにより、吸入性粉じんを捕集する。
  - 肺胞に到達し、沈着した粉じん粒子は、肺組織に線維増殖性変化を起こし、肺機能の低下を起こす。
  - 石綿を主たる原因として発症する、じん肺、肺がん、胸膜中皮腫などの肺の障害を総称して、石綿肺という。
  answer: 5
  choice_notes: []
  explanation: '石綿肺は、石綿を吸い込んで起こるじん肺（肺の線維化）のことです。肺がんや胸膜中皮腫まで含めた石綿による肺の障害の総称ではないので、選択肢5は誤りです。


    石綿による疾病は、石綿肺（じん肺）、肺がん、中皮腫（胸膜・腹膜など）、良性石綿胸水、びまん性胸膜肥厚などに分けて覚えます。中皮腫は胸膜だけでなく腹膜にも生じます。'
  figures: []
  law_note: null
  _key_choice: 石綿を主たる原因として発症する、じん肺、肺がん、胸膜中皮腫などの肺の障害を総称して、石綿肺という。
