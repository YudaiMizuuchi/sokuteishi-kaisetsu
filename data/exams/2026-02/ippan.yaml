    肝臓のがんで覚える物質は、塩化ビニル（肝血管肉腫）や 1,2-ジクロロプロパン（胆管がん）です。オーラミンの膀胱がん、トリクロロエチレンの腎臓がん、無機ヒ素化合物の皮膚がん・肺がん、ベリリウムの肺がんは、いずれも正しい組合せです。'
