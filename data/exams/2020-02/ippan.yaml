  stem: 鉱物性粉じん等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 遊離けい酸を含まない鉱物性粉じんの管理濃度は、3.0 mg/m³ である。
  - ヒュームの一次粒子の粒径は、一般に、1 µm 以下である。
  - アーク溶接ヒュームは、じん肺を引き起こす原因となる。
  - 鉱物性粉じん中の遊離けい酸は、胸膜プラークの主要な原因である。
  - 吸入性粉じんの捕集には、空気力学相当径 4 µm の粉じん粒子を 50％透過する性能を有する分粒装置を用いる。
