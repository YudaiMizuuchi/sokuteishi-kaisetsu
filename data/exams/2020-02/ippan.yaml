  stem: 電離放射線及びその影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電離放射線の被ばくによる生体影響は、遺伝的影響と身体的影響に大きく分類される。
  - α線は、電離作用を有する粒子線である。
  - 白血病は、確率的影響であり、かつ、晩発障害である。
  - β線は、電離作用を有する電磁波である。
  - 放射線皮膚炎は、確定的影響であり、かつ、早期障害である。
  answer: 4
  choice_notes: []
  explanation: 'β 線は、電子（または陽電子）の流れで、電離作用を有する**粒子線**です。電磁波とする選択肢4は誤りです。


