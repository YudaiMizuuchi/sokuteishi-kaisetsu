  stem: 温熱環境及び熱中症に関する次の記述のうち、誤っているものはどれか。
  choices:
  - WBGT基準値は、同一作業であっても、熱に順化していない人の方が熱に順化している人よりも、大きい値となる。
  - WBGT基準値は、身体に対する負荷が大きな作業の方が、負荷が小さな作業より小さい値となる。
  - 高温環境下での熱けいれんは、塩分喪失と水分過剰補給によって起こる。
  - 実効温度は、人の温熱感に基礎を置いた指標で、気温、湿度及び気流の総合効果を温度目盛りで表したものである。
  - 放熱は、ふく射、伝導、蒸発などの物理的な過程で行われ、蒸発には発汗と不感蒸泄によるものがある。
  answer: 1
  choice_notes: []
  explanation: 'WBGT 基準値は、同じ作業でも、暑熱に順化していない人の方が**小さい**（厳しい）値になります。順化していない人ほど熱中症になりやすいからです。「大きい値となる」とする選択肢1は誤りです。


    実効温度は、気温・湿度・気流の総合効果を温度の目盛りで表した指標です（選択肢4）。'
  figures: []
  law_note: null
  _key_choice: WBGT基準値は、同一作業であっても、熱に順化していない人の方が熱に順化している人よりも、大きい値となる。
