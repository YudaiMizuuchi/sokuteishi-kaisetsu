  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化ビニルによる中毒では、レイノー現象、指端骨溶解や肝血管肉腫などがみられる。
  - 1,2-ジクロロプロパンは、肝臓及び腎臓の障害などのほか、長期間の高濃度ばく露により胆管がん発症につながる蓋然性が高い。
  - ジメチル-2,2-ジクロロビニルホスフェイト（DDVP）は、神経系や肝臓の障害などのほか、ヒトに対する発がん性が疑われている。
  - 一酸化炭素は、無色、無臭の気体で、赤血球中のヘモグロビンの合成を阻害する。
  - フッ化水素による慢性中毒では、骨の硬化や斑状歯がみられる。
  answer: 4
  choice_notes: []
  explanation: '一酸化炭素は、赤血球中のヘモグロビンと強く**結合**して、酸素を運べなくします。ヘモグロビンの合成を阻害するのではないので、選択肢4は誤りです。


    令和2年度第2回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 一酸化炭素は、無色、無臭の気体で、赤血球中のヘモグロビンの合成を阻害する。
