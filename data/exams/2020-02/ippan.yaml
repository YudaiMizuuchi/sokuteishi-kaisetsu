  stem: 騒音等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ヒトが感じることのできる音の周波数の範囲は、20 Hz から 20,000 Hz程度で、会話領域は 500 Hz から 2,000 Hz 程度である。
  - 等価騒音レベルの測定は、A測定、B測定のいずれも各測定点で10分間以上連続して行う。
  - 騒音の A 測定の平均値の算定には 80 dB(A)未満の測定値は含めない。
  - 騒音性難聴の初期に認められる 4,000 Hz 付近の音から始まる聴力低下の型を c⁵ dip という。
  - 騒音性難聴は、中耳の障害による感音性難聴である。
  answer: 5
