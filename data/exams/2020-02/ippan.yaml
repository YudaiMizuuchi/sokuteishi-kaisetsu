  stem: 金属等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉛による慢性中毒では､中枢神経障害を生じ、歩行困難、発語障害などのパーキンソン病に似た症状を呈する。
  - カドミウム中毒では、上気道炎、肺炎、腎機能障害などがみられる。
  - 粉状のニッケル化合物は、生殖毒性、皮膚感作性のほか、ヒトに対する発がん性があるとされている。
  - 金属熱は、亜鉛や銅などのヒュームを吸入して発生する疾病で、悪寒や発熱、関節痛などの症状がみられる。
  - クロム酸は、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって鼻中隔穿孔や肺がんなどを生じる。
  answer: 1
  choice_notes: []
  explanation: 歩行困難や発語障害などのパーキンソン病に似た症状は、**マンガン**の慢性中毒の特徴です。鉛の慢性中毒では、貧血、末梢神経障害、腹部の疝痛などがみられるので、選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: 鉛による慢性中毒では、中枢神経障害を生じ、歩行困難、発語障害などのパーキンソン病に似た症状を呈する。
