  explanation: '騒音性難聴は、**内耳**の蝸牛の有毛細胞の障害による感音性難聴です。中耳の障害とする選択肢5は誤りです。


    中耳の障害で起こるのは、音が内耳まで伝わりにくくなる伝音性難聴です。'
