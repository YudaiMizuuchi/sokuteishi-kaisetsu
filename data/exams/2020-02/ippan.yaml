  stem: 酸素欠乏症及び硫化水素中毒に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 海水が滞留している暗きょの内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  - 空気中の酸素濃度が 16％程度以下になると、頭痛、吐き気などの自覚症状が現れ、10％程度以下になると、意識喪失やけいれんなどが現れる。
  - 第一鉄塩類を含有している地層に接するたて坑の内部での作業では、酸素欠乏症の危険がある。
  - 酸素欠乏症発生時の救助活動では、救出作業に従事する労働者に電動ファン付き呼吸用保護具、酸素呼吸器又は送気マスクを使用させる。
  - 硫化鉱や魚油を入れてある貯蔵施設の内部での作業では、酸素欠乏症の危険がある。
  answer: 4
