  - 粒子状物質が経気道的に侵入した場合、空気力学相当径が 1～ 2 µm の大きさの粒子は肺胞に沈着しやすい。
  - メタノールは、脂溶性及び水溶性を共に有しており、トルエンは脂溶性は有しているが水溶性は有していない。
