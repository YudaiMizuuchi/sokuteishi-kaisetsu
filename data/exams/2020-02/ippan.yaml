  explanation: 酸素欠乏症が発生したときの救助作業では、救出する労働者に、空気呼吸器・酸素呼吸器又は送気マスクを使用させます。電動ファン付き呼吸用保護具は、周りの空気をろ過して供給するものなので使えません。選択肢4は誤りです。
  figures: []
  law_note: null
