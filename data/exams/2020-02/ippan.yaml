  stem: 厚生労働省の「情報機器作業における労働衛生管理のためのガイドライン」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ディスプレイ画面上における照度は500ルクス以下、書類上及びキーボード上における照度は300ルクス以上を目安とする。
  - 一連続作業時間が1時間を超えないようにし、次の連続作業までの間に10分～15分の作業休止時間を設け、かつ、一連続作業時間内において1回～2回程度の小休止を設けるようにする。
  - ディスプレイは、おおむね 40 cm 以上の視距離が確保できるようにし、その画面の上端が眼の高さとほぼ同じか、やや下になる高さにする。
  - 新たに情報機器作業を行うこととなった作業者に対する配置前健康診断における視力検査として、遠見視力及び近見視力の検査を行う。
  - ディスプレイ画面の明るさ、書類及びキーボード面における明るさと、周辺の明るさの差は、なるべく大きく明瞭にする。
  answer: 5
  choice_notes: []
  explanation: 情報機器作業のガイドラインでは、ディスプレイ画面の明るさ、書類・キーボード面の明るさと、周辺の明るさの差は、**なるべく小さく**するとされています。明るさの差が大きいと、視線を動かすたびに目が順応し直す必要があり、目が疲れるからです。「なるべく大きく」とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: ディスプレイ画面の明るさ、書類及びキーボード面における明るさと、周辺の明るさの差は、なるべく大きく明瞭にする。
