  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - 個人用保護具の使用によるばく露低減対策は、機械設備の密閉化等の衛生工学的対策、マニュアルの整備等の管理的対策等、より優先順位の高い対策を講じても十分にリスクを低減できない場合に行うべき対策である。
  - 負傷又は疾病の重篤度の見積りでは、過去に実際に発生した負傷又は疾病の重篤度を、最も重篤な負傷又は疾病の重篤度として見積もる。
  - 化学物質等の適切な管理について必要な能力を有する者のうちから、化学物質管理者を指名してリスクアセスメント等に関する技術的業務を行わせる。
  - リスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ずしも数値化する必要はない。
  answer: 3
  choice_notes: []
  explanation: '負傷又は疾病の重篤度は、過去に実際に起きた負傷・疾病の程度ではなく、**予想される**最も重篤な負傷・疾病の程度として見積もります。選択肢3は誤りです。


    過去にたまたま軽い被害で済んでいても、同じ状況でより重い被害が起こりうるからです。'
  figures: []
  law_note: null
  _key_choice: 負傷又は疾病の重篤度の見積りでは、過去に実際に発生した負傷又は疾病の重篤度を、最も重篤な負傷又は疾病の重篤度として見積もる。
- num: 2
