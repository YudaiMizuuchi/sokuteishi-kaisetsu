  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - スチレンは、代謝されて、尿中にマンデル酸やフェニルグリオキシル酸が排泄される。
  - m-キシレンや p-キシレンは、体内で代謝されてメチル馬尿酸となる。
  - トルエンの生物学的モニタリングでは、飲食物中の安息香酸の影響を受けると、尿中馬尿酸量は減少する。
  - 化学物質の生物学的半減期とは、体内に吸収された化学物質の量が半分に減るのに要する時間である。
  - 体内に取り込まれた有機溶剤の生物学的半減期は比較的短いので、有機溶剤等健康診断における尿中代謝物の検査のための採尿時刻は、正確にチェックする必要がある。
  answer: 3
  choice_notes: []
  explanation: null
  figures: []
  law_note: null
