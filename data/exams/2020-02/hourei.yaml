  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じんに係る単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、相対濃度指示方法のみによる測定が認められている。
  - ろ過捕集方法による鉱物性粉じんの濃度の測定のための一つの測定点における試料空気の採取時間は、10分間以上の継続した時間とする。
  - 第1種酸素欠乏危険作業に係る作業場の酸素濃度測定における測定点は、作業場における適当な位置に、5以上としなければならない。
  - 一つの測定点における鉱物性粉じんの試料空気の採取時間は、相対濃度指示方法による測定の場合には、10分間未満であってもよい。
  - 騒音の測定点は、原則として、単位作業場所の床面上に 6 m 以下の等間隔で引いた縦の線と横の線との交点の床上 120 cm 以上 150 cm 以下の位置としなければならない。
  answer: 1
  choice_notes: []
  explanation: '鉱物性粉じんの濃度の測定で相対濃度指示方法を用いるときは、単位作業場所の1以上の測定点で、ろ過捕集方法と重量分析方法による測定を同時に行わなければなりません。単位作業場所が著しく狭く濃度がほぼ均一であれば相対濃度指示方法のみで測定できる、という定めはないので、選択肢1は誤りです。


    根拠：作業環境測定基準第2条第1項第4号ロ。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんに係る単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、相対濃度指示方法のみによる測定が認められている。
- num: 10
  status: published
  chapters:
  - evaluation
  traps:
  - lw-law-evaluation-03
  rank: null
  summary: null
  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - 連続する二作業日について作業環境測定を行った場合の評価は、それぞれの日についてのA測定の測定値に基づいて求めた幾何標準偏差のうち、大きい値を用いて行うことができる。
  - A測定のみを行った場合、第1評価値が管理濃度以上であり、かつ、第2評価値が管理濃度以下である単位作業場所の管理区分は第2管理区分である。
  - B測定の測定値が管理濃度の1.5倍を超えるときは、A測定の第1評価値及び第2評価値の値にかかわらず、第3管理区分に区分される。
  - 2以上の測定点においてB測定を実施した場合には、そのうちの最大値をB測定の測定値とする。
  answer: 2
  choice_notes: []
  explanation: '連続する二作業日に測定を行ったときの評価値は、2日分の幾何平均値と幾何標準偏差を組み合わせた式で計算します。2日の幾何標準偏差のうち大きい方を用いる、という方法は定められていないので、選択肢2は誤りです。


    根拠：作業環境評価基準第3条第2項。'
  figures: []
  law_note: null
  _key_choice: 連続する二作業日について作業環境測定を行った場合の評価は、それぞれの日についてのA測定の測定値に基づいて求めた幾何標準偏差のうち、大きい値を用いて行うことができ
