  stem: 作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務（設備の解体等に伴うものを除く。）を行う作業場については、6か月以内ごとに1回、定期に、その作業場における空気中のダイオキシン類の濃度を測定しなければならない。
  - 多量のドライアイスを取り扱う業務を行う寒冷の屋内作業場については、半月以内ごとに1回、定期に、その作業場における気温及び湿度を測定しなければならない。
  - 多量の蒸気を使用する金属の洗浄の業務を行う多湿の屋内作業場については、半月以内ごとに1回、定期に、その作業場における気温及び湿度を測定しなければならない。
  - 放射線業務を行う作業場のうち管理区域に該当する部分については、原則として、1か月以内ごとに1回、定期に、外部放射線による線量当量率又は線量当量を放射線測定器を用いて測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、6か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: 中央管理方式の空気調和設備を設けている事務所の室の空気環境の測定は、**2か月以内ごとに1回**です。6か月以内ごととする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、6か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有
