  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる。
  - 作業環境測定士ではない者に、作業環境評価基準に基づいて、指定作業場についての作業環境測定結果の評価を行わせることができる。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
  - 第2種作業環境測定士は、指定作業場についての作業環境測定の業務のうち、簡易測定機器以外の機器を用いて行う分析の業務を行うことができない。
  - 指定作業場について、作業環境測定機関等への委託によらず作業環境測定を行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  answer: 3
  choice_notes: []
  explanation: '管理区域の外部放射線による線量当量率又は線量当量の測定は、指定作業場の作業環境測定ではないので、作業環境測定士に行わせなければならないものではありません。選択肢3は誤りです。


    根拠：作業環境測定法施行令第1条第1項、作業環境測定法施行規則第1条（放射線業務の指定作業場は、電離放射線障害防止規則第53条第2号・第2号の2の作業場に限られる）。'
  figures: []
  law_note: null
  _key_choice: 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
