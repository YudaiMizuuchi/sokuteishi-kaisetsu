  stem: 法令に基づく安全又は衛生のための特別教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 常時特定粉じん作業に係る業務に労働者を就かせるときは、その者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、その者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - エックス線装置を用いて行う透過写真撮影の業務に労働者を就かせるときは、その者に対し、原則として、法定の科目について特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別教育を省略することができる。
  - 特別教育の講師は、法令で定める資格を有する者のうちから選任しなければならない。
  answer: 5
  choice_notes: []
  explanation: '特別教育の講師について、法令で資格は定められていません。選択肢5は誤りです。


    根拠：労働安全衛生規則第36条〜第39条（講師の資格要件の定めはない）。'
  figures: []
  law_note: null
  _key_choice: 特別教育の講師は、法令で定める資格を有する者のうちから選任しなければならない。
