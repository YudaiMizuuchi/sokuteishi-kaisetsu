  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時使用する労働者の数が10人以上50人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  - 常時1,000人以上の労働者を使用する事業場においては、その業種に関係なく、事業場に専属の産業医を選任しなければならない。
  - 常時50人以上の労働者を使用する事業場においては、その業種に応じて、衛生委員会又は安全衛生委員会を設けなければならない。
  - 常時1,000人を超える労働者を使用する事業場においては、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 総括安全衛生管理者には、当該事業場において、その事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
  answer: 5
  choice_notes: []
  explanation: '総括安全衛生管理者には、その事業場で事業の実施を統括管理する者を充てます。「これに準ずる者」を充てることはできないので、選択肢5は誤りです。


    令和2年度第2回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 総括安全衛生管理者には、当該事業場において、その事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
