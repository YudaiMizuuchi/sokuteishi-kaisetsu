  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 雇入時の健康診断を行ったときは、その結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 弗化水素ガスを発散する場所における業務に常時従事している労働者に対しては、6か月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。
  - 雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 事業場で行った定期健康診断の結果、異常の所見があると診断された労働者については、その健康を保持するために必要な措置について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。
  - 常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に報告する必要はない。
  answer: 3
  choice_notes: []
  explanation: '貧血検査や肝機能検査などを医師が必要でないと認めるときに省略できるのは、**定期**健康診断です。雇入時の健康診断では省略できないので、選択肢3は誤りです。


    令和5年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができ
