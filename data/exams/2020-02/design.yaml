  stem: 空気中の有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定は、当該単位作業場所の中で、有害物質の発散源に近接する場所において作業が行われる場合に、有害物質の濃度が最も高くなると考えられる作業位置とその時間に行う測定である。
  - B測定は、測定時に労働者がいなくても、労働者が立ち入るならば、その作業位置で行う。
  - 発生源とともに労働者が移動しながら行う作業の場合には、労働者の作業位置が変わるので、B測定は、作業位置の移動に沿って行う。
  - 5本の検知管を用いてB測定を行った場合は、10分間に均等な間隔で測定した検知管指示値の幾何平均値を測定値とする。
  - 相対濃度指示方法を用いてB測定を行う場合の質量濃度変換係数は、その単位作業場所で行われた併行測定の質量濃度変換係数を用いる。
  answer: 4
  choice_notes: []
  explanation: '検知管を10分間に均等な間隔で5本使って B 測定を行った場合は、5本の指示値の**算術平均値**を B 測定値とします。幾何平均値とする選択肢4は誤りです。


    短時間の測定を積み上げて「10分間の値」を求めるときは、算術平均をとります。圧電天秤方式で2分間の測定を5回行う場合も同じです。'
  figures: []
  law_note: null
  _key_choice: 5本の検知管を用いてB測定を行った場合は、10分間に均等な間隔で測定した検知管指示値の幾何平均値を測定値とする。
