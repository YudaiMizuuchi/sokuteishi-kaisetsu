  stem: 25 ℃、1気圧における環境空気中のメチルエチルケトン（CH₃COC₂H₅）の体積分率が 50 ppm であるとき、その質量濃度（mg･m⁻³）に最も近いものは、次のうちどれか。
  choices:
  - 100 mg･m⁻³
  - 150 mg･m⁻³
  - 200 mg･m⁻³
  - 250 mg･m⁻³
  - 300 mg･m⁻³
  answer: 2
  choice_notes: []
  explanation: 'ppm を mg/m³ に直すときは、ppm に分子量を掛けて 24.45 で割ります。メチルエチルケトン（CH₃COC₂H₅）の分子量は 72.1 です。


    C [mg/m³] ＝ 50 × 72.1 ÷ 24.45 ≒ 147


    よって、最も近いのは 150 mg/m³ です。'
  figures: []
  law_note: null
  _key_choice: 150mg・m-3
