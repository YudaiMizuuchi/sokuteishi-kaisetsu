  stem: 測定誤差に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定誤差は、系統誤差、偶然誤差及び過失誤差の3種類に分けることができる。
  - 系統誤差には、個人の習慣により、常に目盛りを大きめに読むことによる誤差も含まれる。
  - 系統誤差は、その原因を明らかにしても補正することができない。
  - 一つのサンプルを同一条件で繰り返し測定したとき、測定値がばらつくのは、偶然誤差のためである。
  - 偶然誤差の大きさは、一般に、測定値の標準偏差の大きさで評価される。
