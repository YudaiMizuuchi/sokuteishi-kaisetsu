  stem: 有害物質の物性、空気中における挙動等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩素系有機溶剤には、空気中で加熱されるとホスゲンを発生するものがある。
  - 混合した有機溶剤から蒸発する蒸気の成分の組成比は、必ずしもその混合有機溶剤の混合割合とは一致しない。
  - メッキ、充電などの電解を伴う工程では、ミストが発生する。
  - 鉛の蒸気は、空気中で冷却され、酸化物の微細な粒子となる。
  - ヒュームの一次粒子は、球形のものよりも不規則な形状をしたものが多い。
  answer: 5
  choice_notes: []
  explanation: 'ヒュームの一次粒子は、気化した物質が空気中で冷やされて固まったもので、表面張力のために**球形**に近いものが多くなります。不規則な形状のものが多いとする選択肢5は誤りです。


    不規則な形の粒子が多いのは、固体を砕いたり削ったりしてできる粉じんです。ヒュームの一次粒子は球形でも、それがつながった凝集体（二次粒子）は不規則な形になります。'
  figures: []
  law_note: null
  _key_choice: ヒュームの一次粒子は、球形のものよりも不規則な形状をしたものが多い。
  review_note: ヒュームの一次粒子は表面張力のために球形に近いものが多い、と説明しています。確認中です。
