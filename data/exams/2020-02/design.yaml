  stem: '次の有害物質㋑～㋭について、常温･常圧（25 ℃、1気圧）において環境空気中に蒸気の状態で存在する物質の組合せとして、正しいものは下のうちどれか。ただし、ここで、ガスとは常温･常圧において気体のものをいい、蒸気とは常温･常圧において液体又は固体の物質がその蒸気圧に応じて蒸発又は昇華して気体となっているものをいう。


    ㋑ エチレンオキシド


    ㋺ 塩化ビニル


    ㋩ 水銀


    ㋥ フッ化水素


    ㋭ 硫酸ジメチル'
  choices:
  - ㋑ ㋺
  - ㋑ ㋭
  - ㋺ ㋥
  - ㋩ ㋥
  - ㋩ ㋭
  answer: 5
  choice_notes: []
  explanation: '常温・常圧で液体の水銀（㋩）と硫酸ジメチル（㋭）は、蒸気として存在します。エチレンオキシド（沸点約 11℃）、塩化ビニル（約 −13℃）、フッ化水素（約 20℃）は、25℃では気体（ガス）です。よって（5）が正しい組合せです。


    フッ化水素は沸点がほぼ常温なので迷いやすいですが、25℃では沸点を超えているのでガスです。'
  figures: []
  law_note: null
  _key_choice: ハホ
