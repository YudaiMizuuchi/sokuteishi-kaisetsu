  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場内で働く労働者の保護具の使用状況や作業時間の長さなども考慮する必要がある。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致しなければならない。
  - 塗料の調合の作業とそこで調合された塗料を用いる塗装作業が同時に行われる区域を、1つの単位作業場所として設定することができる。
  - 初めての測定で有害物質の濃度分布が予測できなかったので、当該作業場で働く労働者の行動範囲を単位作業場所として設定した。
  - 有機溶剤の発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  answer: 1
  choice_notes: []
  explanation: '単位作業場所は、有害物質の濃度分布と労働者の行動範囲から決めるもので、保護具の使用状況や作業時間の長さは考慮しません。「考慮する必要がある」とする選択肢1は誤りです。


    連続する2作業日に測定する場合は、2日とも同じ範囲の単位作業場所で測ります（選択肢2）。範囲が違うと、2日分の結果をまとめて評価できないからです。'
  figures: []
  law_note: null
  _key_choice: 単位作業場所の設定に当たっては、作業場内で働く労働者の保護具の使用状況や作業時間の長さなども考慮する必要がある。
