  stem: 理想気体の体積に関する次の記述の㋑及び㋺の［　］に入る語句の組合せとして、正しいものは下のうちどれか。「圧力一定では、絶対温度を2倍にすると体積は［㋑］。また、温度一定で圧力を2倍にすると体積は［㋺］。」
  choices:
  - 2倍になる ／ 2倍になる
  - 2倍になる ／ 0.5倍になる
  - 変化しない ／ 変化しない
  - 0.5倍になる ／ 2倍になる
  - 0.5倍になる ／ 0.5倍になる
  answer: 2
  choice_notes: []
  explanation: 圧力が一定なら、体積は絶対温度に比例するので、温度を2倍にすると体積は**2倍**（シャルルの法則）です。温度が一定なら、体積は圧力に反比例するので、圧力を2倍にすると体積は**0.5倍**（ボイルの法則）です。よって（2）が正しい組合せです。
  figures: []
