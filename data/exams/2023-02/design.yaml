  stem: '次の記述の㋑及び㋺の［　　］に入る用語の組合せとして、正しいものは下のうちどれか。


    「作業環境空気中の放射性物質の濃度を測定するために用いられる試料の採取方法として、［㋑］に対してはろ過捕集法、［㋺］に対しては固体捕集法が用いられる。」'
  choices:
  - 放射性コバルト ／ 放射性ナトリウム
  - 放射性ヨウ素 ／ 放射性アルゴン
  - 放射性水銀 ／ トリチウム化水蒸気
  - 放射性水銀 ／ 放射性ヨウ素
  - プルトニウム ／ トリチウム化水蒸気
  columns:
  - ㋑
  - ㋺
  answer: 5
  choice_notes: []
  explanation: '放射性物質の捕集方法は、空気中でどんな状態にあるかで選びます。粒子状の**プルトニウム**はろ過捕集法、水蒸気として存在する**トリチウム化水蒸気**は、シリカゲルなどによる固体捕集法（又は液体捕集法、冷却凝縮捕集法）で捕集します。正しい組合せは選択肢5です。


    ほかの選択肢を見ると、放射性ヨウ素は、活性炭などによる固体捕集法で捕集するガス状の物質なので、㋑（ろ過捕集法）には入りません。放射性アルゴンは希ガスで、直接捕集法で捕集するので、㋺（固体捕集法）には入りません。放射性水銀も、蒸気として存在するので、ろ過捕集法には向きません。放射性コバルトは粒子状で、ろ過捕集法です。


    「粒子にはフィルター、ガス・蒸気にはフィルター以外」という原則は、放射性でない物質と同じです。令和7年度第2回にも、㋑をウランにした同じ形の問題があります。


    根拠：作業環境測定基準第9条。'
