  stem: 有害物質のA・B測定における単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致していなければならない。
  - 必ずしも、平面的な場所だけでなく、装置の周囲に設けられた作業足場のような立体的な作業場も単位作業場所となり得る。
  - 有害物質の発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  - 単位作業場所の設定にあたっては、作業場内で働く労働者の保護具の使用状況や作業時間の長さなども考慮する必要がある。
  - 初めての測定で、有害物質の濃度分布が予測できなかったので、当該作業場で働く労働者の行動範囲を単位作業場所の範囲とした。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '単位作業場所は、**労働者の作業中の行動範囲**と**有害物質の分布の状況**から決めます。保護具の使用状況や作業時間の長さは、場の濃度とは関係がないので、考慮しません。選択肢4は誤りです。


    連続する2作業日に測定するときは、2日とも同じ範囲で測ります（選択肢1）。作業足場のような立体的な作業場も、単位作業場所になります（選択肢2）。発散の状況が時間帯で違うことが明らかなときは、時間帯ごとに別の単位作業場所とします（選択肢3）。濃度の分布が予測できないときは、労働者の行動範囲を単位作業場所の範囲としてかまいません（選択肢5）。


    令和元年度第2回にも、同じ誤りの選択肢があります。


    根拠：『デザイン・サンプリングの実務（A・B測定編 上）』。'
