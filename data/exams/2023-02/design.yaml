  choice_notes: []
  explanation: '相対濃度計を使うA測定では、1つの測定点の採取時間を10分未満にできますが、測定点の数は「10分間 ÷ 1測定点の採取時間」以上でなければなりません。測定点が6個なら、1測定点あたり 10 ÷ 6 ≒ 1.7 分以上が必要です。「1分間以上であればよい」とする選択肢5は誤りです（1分でよいのは、測定点が10個以上の場合です）。


    測定の前には、光散乱部を清浄空気で満たして、零点調整と感度合わせを行います（選択肢1）。光源には、半導体レーザーが使われています（選択肢2）。散乱光の強さは、検出部を通る空気の速度とは関係がなく（選択肢3）、粉じんの種類や粒径によって変わります（選択肢4）。そのため、併行測定で質量濃度変換係数を求めます。


    令和元年度第2回・令和4年度第1回・令和7年度第2回では、「測定点が10個の場合は1分以上であればよい」という正しい記述が出題されています。測定点の数を変えて誤りにしたのが、この選択肢です。


