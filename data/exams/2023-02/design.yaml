  stem: 有機溶剤を対象とした作業環境測定を実施しなければならない次の作業のうち、個人サンプリング法による測定（C・D 測定）の対象とならないものはどれか。
  choices:
  - 労働者が塗装ブース前の定点で移動せずに行う吹付塗装作業
  - 労働者が作業場内を移動しながら行う吹付塗装作業
  - 労働者が作業場内を移動しながら行う手塗り補修塗装（タッチアップ）作業
  - 印刷機の幅の広いロールを労働者が作業場内を移動しながら洗浄剤で拭き取る作業
  - 労働者が作業場内を移動しながら行う塗型剤を鋳型に塗布する作業
  answer: 1
  choice_notes: []
  explanation: '個人サンプリング法（C・D 測定）は、有機溶剤の場合、塗装作業などで発散源とともに労働者が移動しながら作業する場合などに対象とされています。塗装ブースの前の定点で移動せずに行う吹付塗装作業は対象とならないので、答えは（1）です。


    発散源とともに移動する作業では、場所を固定した A・B 測定ではばく露をとらえにくいので、個人に機器を着ける測定が向いています。


    （参考：『作業環境測定のためのデザイン・サンプリングの実務―C・D測定編―』）'
