  stem: 有害物質の作業環境評価に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第1評価値とB測定値が、共に管理濃度より小さければ、管理区分は第1管理区分になる。
  - B測定を複数回行った場合、全ての測定値の平均値をB測定値として管理濃度と比較する。
  - A測定の第2評価値とは気中有害物質濃度の算術平均値の推定値をいう。
  - 1日測定の場合には、日間変動を表すσ<sub>D</sub>については、σ<sub>D</sub>=1.95とみなして、評価を行う。
  - A測定の第1評価値は、気中有害物質濃度の幾何平均値と幾何標準偏差より求められる。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'B測定を複数行った場合は、測定値の**最大値**をB測定値とします。「全ての測定値の平均値」とする選択肢2は誤りです。B測定は、ばく露が最も高くなる場面をとらえる測定だからです。


    A測定の第1評価値とB測定値が、ともに管理濃度より小さければ、第1管理区分です（選択肢1）。第2評価値は、算術平均濃度の推定値です（選択肢3）。1日測定の場合は、日間変動を σ<sub>D</sub> ＝ 1.95 とみなして評価します（選択肢4）。第1評価値は、幾何平均値と幾何標準偏差から求めます（選択肢5）。


    平成29年度第1回・令和元年度第2回にも、「平均値をB測定値とする」という誤りの選択肢があります。なお、検知管などで10分間に均等な間隔で何回か測って1つのB測定値を求めるときは、算術平均をとります。「複数の位置・複数の日＝最大値」「10分間の中の繰り返し＝平均値」を区別します。


    根拠：作業環境評価基準第2条・第3条。'
