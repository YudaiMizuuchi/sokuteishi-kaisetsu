  stem: 正規分布、対数正規分布及び環境空気中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 横軸を変数とし、縦軸を確率密度とすると、正規分布の曲線の形は、平均を中心として左右対称になる。
  - 正規分布の平均値（算術平均値）及び標準偏差をそれぞれμ及びσとすると、この分布に従う変数がμ-σからμ+σの範囲に入る確率は、およそ68%である。
  - 変数Xの対数変換値が正規分布に従うとき、変数Xの分布は対数正規型である。
  - 対数正規分布の幾何平均値と幾何標準偏差は同じ次元を持つ。
  - 作業環境中の有害物質の濃度分布は、多くの場合、対数正規分布で近似される。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '幾何平均値は、測定値と同じ単位（次元）をもちますが、幾何標準偏差は、倍率を表す数値で、**無次元**です。「同じ次元を持つ」とする選択肢4は誤りです。


    正規分布の曲線は、平均を中心に左右対称で（選択肢1）、変数が μ−σ から μ＋σ の範囲に入る確率は、およそ 68 ％ です（選択肢2）。変数 X の対数が正規分布に従うとき、X の分布を対数正規分布といいます（選択肢3）。作業環境中の有害物質の濃度分布は、多くの場合、対数正規分布で近似されます（選択肢5）。


    正規分布の平均と標準偏差は同じ次元、対数正規分布の幾何平均と幾何標準偏差は違う次元、という対比で覚えます。平成30年度第2回にも、同じ誤りの選択肢があります。'
