  rank: null
  stem: 25℃、1気圧における環境空気中のN,N-ジメチルホルムアミド（(CH₃)₂NCHO）の体積分率が10 ppmであるとき、その質量濃度（mg・m⁻³）に最も近いものは、次のうちどれか。
  choices:
  - 10 mg・m⁻³
  - 20 mg・m⁻³
  - 30 mg・m⁻³
  - 40 mg・m⁻³
  - 50 mg・m⁻³
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'ppm を mg/m³ に直すには、分子量を掛けて、1 mol の気体の体積（25℃・1気圧で 24.47 L）で割ります。


    N,N-ジメチルホルムアミド（C₃H₇NO）の分子量は、12 × 3 ＋ 1 × 7 ＋ 14 ＋ 16 ＝ 73 です。


    質量濃度 ＝ 10 × 73 ÷ 24.47 ≒ 29.8 mg/m³


    最も近いのは 30 mg/m³ で、正答は選択肢3です。


    25℃・1気圧のモル体積 24.47 L（0℃なら 22.4 L）は、覚えておく数値です。分子量が 24.47 に近い物質では ppm と mg/m³ がほぼ同じ数値になり、分子量がその3倍なら、mg/m³ は ppm の約3倍になります。'
