  - ds-radiation-02
  rank: null
  stem: '放射性物質を取り扱っている作業場において、取扱い核種の濃度限度の100分の1の空気中放射性濃度を測定するために必要な最小試料採取時間に最も近い値は次のうちどれか。


    ただし、取扱い核種の濃度限度は3.0×10⁻⁵ Bq・cm⁻³、測定装置の検出下限計数率は2.8 s⁻¹、測定装置の計数効率は35%、試料空気の吸引流量は90 L・min⁻¹、使用する捕集材の捕集率は100%とする。'
  choices:
  - 1時間
  - 3時間
  - 5時間
  - 10時間
  - 13時間
  columns: null
  answer: 3
  choice_notes: []
  explanation: '計数率が検出下限に届くだけの放射能を、ろ紙に集めるのに必要な時間を求めます。


    - 測りたい濃度：濃度限度の100分の1 ＝ 3.0 × 10⁻⁵ ÷ 100 ＝ 3.0 × 10⁻⁷ Bq/cm³

    - 吸引流量：90 L/min ＝ 90,000 cm³/min ＝ 1,500 cm³/s

    - 必要な放射能：検出下限計数率 ÷ 計数効率 ＝ 2.8 ÷ 0.35 ＝ 8.0 Bq


    採取時間を t（秒）とすると、集まる放射能は、濃度 × 流量 × t × 捕集率なので、


    3.0 × 10⁻⁷ × 1,500 × t × 1.0 ＝ 8.0


    t ＝ 8.0 ÷（4.5 × 10⁻⁴）≒ 17,800 秒 ≒ 4.9 時間


    最も近いのは5時間で、正答は選択肢3です。


    解き方は、「必要な放射能（Bq）＝ 検出下限計数率 ÷ 計数効率」を先に出し、それを「濃度 × 流量 × 捕集率」で割る、の2段階です。流量の単位（L/min）を cm³/s に直すところで、間違えやすいので注意します。'
