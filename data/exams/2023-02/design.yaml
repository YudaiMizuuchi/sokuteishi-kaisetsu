  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の濃度が高くなると考えられる作業位置が複数ある場合は、それらの全ての作業位置で測定を行い、各々の測定値の算術平均値を B 測定値とする。
  - 検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値を B測定値とする。
  - 相対濃度指示方法によって B 測定を行った場合、質量濃度変換係数はA 測定で用いる係数と同じものを用いる。
  - 圧電天秤方式の相対濃度計を用いて鉱物性粉じんの B 測定を行う場合は、測定時間を2分に合わせて、連続して5回の測定を行い、指示値の算術平均値を B 測定値とする。
  - B 測定に真空捕集びんを用いる場合には、真空捕集びんの本数は5本程度を目安にする。
  answer: 1
  choice_notes: []
  explanation: 'B 測定で、濃度が高くなると考えられる作業位置が複数ある場合は、全ての位置で測定し、そのうちの**最大値**を B 測定値とします。算術平均値とする選択肢1は誤りです。


    短時間の測定を積み上げる場合（検知管5本、圧電天秤5回）は平均、複数の位置や複数の日のまとめは最大、と使い分けます。'
