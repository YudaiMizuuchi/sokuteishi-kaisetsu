  stem: 液体捕集法及び直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 小型ガス吸収管による有機溶剤などの揮発性物質の捕集では、捕集液の温度が低いほど捕集率は高くなる。
  - ミゼットインピンジャーによる粒子状物質の捕集は、慣性衝突効果によるものである。
  - 真空捕集瓶は、1.33 kPa以下の圧力にして使用する。
  - 直接捕集法では、一般に捕集器具の容積が大きいものほど濃度減衰が速いので、真空捕集瓶は1 L以下の容積のもの、捕集袋は5 L以下のものを使用する必要がある。
  - バブラーによるガス状物質の捕集では、気泡が小さいほど気体と液体の接触面積が大きくなり、捕集効率は高くなる。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '直接捕集法では、捕集器具の容積が**小さい**ほど、内面への吸着などによる濃度の減衰が速くなります。そこで、真空捕集瓶は 1 L **以上**、捕集袋は 5 L **以上**のものを使います。選択肢4は、大小が逆になっていて誤りです。容積が小さいほど、試料の量に対して内面の面積の割合が大きくなるからです。


