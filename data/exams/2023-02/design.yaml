  stem: 騒音の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定は、周波数重み付け特性としてA特性を用いる。
  - 測定点の高さは、指定作業場での有害物質と異なり、床上1.2 m以上1.5 m以下の範囲とする。
  - 管理区分の決定においては、A測定の各測定点における騒音レベルの測定結果の中に80 dB以下の測定点があった場合は、その測定点の値を除く。
  - A測定の平均値が82 dB、B測定の測定値が93 dBの単位作業場所は、第Ⅲ管理区分に区分される。
  - B測定の測定値が85 dB以上の単位作業場所は、第Ⅱ又は第Ⅲ管理区分に区分される。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'A測定の平均値を求めるときに除くのは、**80 dB 未満**の測定値です。「80 dB 以下」とする選択肢3は、80 dB ちょうどの測定値まで除くことになるので、誤りです。


    騒音の測定には、周波数重み付け特性のA特性を用います（選択肢1）。測定点の高さは、床上 1.2 m 以上 1.5 m 以下です（選択肢2。有害物質は 50 cm 以上 150 cm 以下）。管理区分は、A測定の平均値とB測定値を、85 dB と 90 dB の境目で区分します。B測定値が 90 dB 以上なら、A測定の平均値にかかわらず第Ⅲ管理区分です（選択肢4）。B測定値が 85 dB 以上なら、第Ⅰ管理区分にはなりません（選択肢5）。


    令和2年度第2回では「80 dB 未満の測定点の値を除く」、令和3年度第1回では「80 dB 未満の測定値は含めない」という正しい記述が出題されています。「未満」と「以下」の違いだけの、細かいひっかけです。


    根拠：騒音障害防止のためのガイドライン、作業環境測定基準第4条。'
