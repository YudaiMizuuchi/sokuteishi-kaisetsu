  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ハイボリュームエアサンプラーは、指示される流量が、汚染により、製造時に校正した値と異なることがあるため、事前に校正する必要がある。
  - 石けん膜流量計は、所定の距離を石けん膜が移動する時間を測定して流量を求める。
  - ローボリュームエアサンプラーの流量校正では、組み込まれた捕集器具の圧力損失は無視できるので、捕集器具を装着しない状態で行う必要がある。
  - 面積式流量計は、テーパー管内の浮子が停止したとき、浮子とテーパー管内の間隙の面積とそこを流れている流量とが比例することを利用している。
  - 絞り式（オリフィス）流量計は、オリフィス板の上流側と下流側との間に生じる圧力差が流量と一定の関係にあることを利用している。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'ローボリュームエアサンプラーの流量校正は、ろ過材や分粒装置などの捕集器具を**装着した状態**で行います。捕集器具には圧力損失があり、付けたときと付けないときで、流量計の指示と実際の流量の関係が変わるからです。「圧力損失は無視できるので、装着しない状態で行う」とする選択肢3は誤りです。


    ハイボリュームエアサンプラーは、汚れなどで指示が製造時の校正値と違ってくることがあるので、事前に校正します（選択肢1）。石けん膜流量計は、石けん膜が所定の距離を移動する時間から流量を求めます（選択肢2）。面積式流量計は、浮子とテーパー管のすき間の面積と流量が比例することを（選択肢4）、絞り式（オリフィス）流量計は、オリフィス板の前後の圧力差が流量と一定の関係にあることを（選択肢5）、利用しています。


    令和5年度第2回では、「捕集器具を付けない状態で校正した面積式流量計は、捕集器具を付けて使うと、指示が実際の流量より高くなる」という形で、同じ考え方が問われています。


    根拠：『デザイン・サンプリングの実務（A・B測定編 上）』。'
