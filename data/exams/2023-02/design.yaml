  columns: null
  answer: 5
  choice_notes: []
  explanation: '溶接ヒュームは、作業環境測定（A・B測定、C・D測定）の対象ではありません。正答は選択肢5です。金属アーク溶接等作業では、特定化学物質障害予防規則にもとづいて、労働者の身体に装着した試料採取機器で濃度を測る、別の仕組み（溶接ヒュームの濃度の測定）が定められています。


    コバルト及びその無機化合物、クロム酸及びその塩、マンガン及びその化合物は、管理濃度の低い特定化学物質として、鉛とともに、個人サンプリング法による測定の対象です（選択肢1〜4）。


    令和7年度第2回にも、「溶接ヒューム」を正答とする同じ形の問題があります。


    根拠：作業環境測定基準第10条第5項、第11条第3項（令和8年9月30日までの規定）。'
