  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  - 測定時間が10分間未満の検知管を使用する場合には、各測定点において複数の検知管を使用して10分間以上連続して測定を行わなければならない。
  - 測定点の高さは、床上 50 cm 以上 150 cm 以下の位置とする。
