  - 小型ガス吸収管によるガス状物質の捕集では、流量が大きいほど捕集率は低くなる。
  - インピンジャーによる粒子状物質の捕集では、流量が大きいほど捕集率は低くなる。
  - 慣性衝突式分粒装置を用いて鉱物性粉じんの測定を行う場合、吸引流量が所定の値よりも小さいと、測定値は高くなる。
  - 捕集装置とポンプとの間に接続された面積式流量計は、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より大きくなる。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'インピンジャーで粒子を捕集するのは、空気を捕集液に勢いよく吹き付けたときの、慣性衝突の作用です。流量が大きいほど、噴出の勢いが増して粒子がぶつかりやすくなり、捕集率は**高く**なります。「流量が大きいほど捕集率は低くなる」とする選択肢3は誤りです。


    ガス状物質の捕集では逆に、流量が大きいほど、捕集液と接する時間が短くなって、捕集率は低くなります（選択肢2）。ミゼットインピンジャーにガラスビーズを入れると、気体と液体の接触がよくなり、ガス状物質の捕集率が上がります（選択肢1）。慣性衝突式の分粒装置は、流量が所定の値より小さいと、大きな粒子まで通り抜けてしまい、測定値が高くなります（選択肢4）。捕集装置とポンプの間に付けた面積式流量計は、圧力損失が大きいほど、指示値が真の流量より大きくなります（選択肢5）。


    粒子とガスで、流量の影響が逆になる点がひっかけです。令和元年度第1回・令和5年度第1回にも、同じ誤りの選択肢があります。'
