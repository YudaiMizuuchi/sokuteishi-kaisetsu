  traps:
  - ds-a-b-measurement-07
  rank: null
  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定は、単位作業場所の中で、有害物質の発散源に近接する場所において作業が行われる場合に、有害物質の濃度が最も高くなると考えられる作業位置とその時間にサンプリングを行う。
  - B測定はA測定を補完するための測定であり、全ての単位作業場所で実施する必要がある。
  - B測定のサンプリング時間は継続した10分間とする。
  - 有害物質の発散源とともに労働者が移動しながら行う作業がある場合には、作業位置の移動に沿って測定を行う。
  - 相対濃度指示方法を用いてB測定を行う場合の質量濃度変換係数は、その単位作業場所で行われたA測定における併行測定の質量濃度変換係数を用いる。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'B測定は、有害物質の**発散源に近接する場所で作業が行われる**単位作業場所で行う測定です。そのような作業がなければ、行う必要はありません。「全ての単位作業場所で実施する必要がある」とする選択肢2は誤りです。


    B測定は、濃度が最も高くなると考えられる作業位置と時間に行います（選択肢1）。サンプリング時間は、継続した10分間です（選択肢3）。発散源とともに労働者が移動する作業では、作業位置の移動に沿って測ります（選択肢4）。相対濃度指示方法でB測定を行うときは、その単位作業場所の併行測定で求めた質量濃度変換係数を使います（選択肢5）。


    令和5年度第2回・令和8年度第1回では、「発生源に近接する場所で作業が行われない場合は、B測定を実施しなくてもよい」という正しい記述が出題されています。


    根拠：作業環境測定基準第2条第1項。'
