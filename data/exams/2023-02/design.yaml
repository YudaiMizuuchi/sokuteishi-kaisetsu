  explanation: '塩化ビニルは、常温で気体（ガス）です。作業環境測定基準では、**固体捕集方法**（活性炭管など）又は**直接捕集方法**（捕集袋など）で捕集します。液体捕集に使うミゼットインピンジャーとの組合せは不適当なので、正答は選択肢3です。


    リフラクトリーセラミックファイバーは、繊維を顕微鏡で数えるので、メンブランフィルターで捕集します（選択肢1）。p-ニトロクロロベンゼンは、固体捕集方法（シリカゲル管）でも捕集できます（選択肢2）。アクリルアミドは、粒子と蒸気が共存するので、ろ過材（グラスファイバーフィルター）と固体捕集（活性炭フェルト）を組み合わせます（選択肢4）。トリクロロエチレンは、活性炭管で捕集します（選択肢5）。


