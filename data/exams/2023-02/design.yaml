  - 半導体レーザー（レーザーダイオード）は、光源として用いられている。
  - 散乱光検出部を通過する空気の速度と散乱光の強度とは無関係である。
  - 相対濃度計における散乱強度は、測定する粉じんの種類や粒径により異なる。
  - A測定の測定点の数を6個と設定した場合の1測定点当たりのサンプリング時間は1分間以上であればよい。
  columns: null
