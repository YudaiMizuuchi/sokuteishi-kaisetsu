  rank: null
  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所における気中有害物質濃度の平均的な状態とその変動を求めるための測定である。
  - 粉じんを対象とした測定で相対濃度計を使用する場合には、各測定点において10分間以上連続して測定を行わなくてもよい。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下であることが明らかであって、かつ、施設又は作業工程等の変更がない場合は、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 測定点と測定点との間隔は、原則として6 m以下の等間隔とし、縦方向と横方向の間隔は同一とする。
  - 測定点の数を5未満とすることができる単位作業場所でも、各測定点で繰り返し測定を行うことによって、測定値の総数は5以上とする。
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'A測定の測定点の間隔は、6 m 以下の等間隔であれば、縦方向と横方向で**違っていてもかまいません**。「縦方向と横方向の間隔は同一とする」とする選択肢4は誤りです。


    A測定は、単位作業場所の平均的な濃度とその変動を求める測定です（選択肢1）。相対濃度計を使うときは、1つの測定点で10分間以上続けて測らなくてもかまいません（選択肢2）。過去の測定で幾何標準偏差がおおむね 1.2 以下で、施設や作業工程に変更がなければ、濃度はほぼ均一とみなせます（選択肢3）。測定点の数を5未満にできる場合でも、繰り返し測定をして、測定値の総数は5以上にします（選択肢5）。


    「縦と横で間隔を同じにする」という誤りは、令和2年度第1回にも出題されています。


    根拠：作業環境測定基準第2条第1項。'
