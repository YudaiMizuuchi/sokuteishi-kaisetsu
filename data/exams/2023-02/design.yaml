- num: 5
  status: published
  chapters: []
  traps:
  - ds-properties-01
  rank: null
  stem: '有害物質Ⓐと、その常温・常圧（25℃、1気圧）における環境空気中の状態Ⓑとの次の組合せのうち、誤っているものはどれか。


    ただし、ここで、ガスとは常温・常圧において気体のものをいい、蒸気とは常温・常圧において液体又は固体の物質がその蒸気圧に応じて蒸発又は昇華して気体となっているものをいう。'
  choices:
  - 塩化ビニル ／ 蒸気
  - エチルベンゼン ／ 蒸気
  - 硫化水素 ／ ガス
  - ホルムアルデヒド ／ ガス
  - 1,2-ジクロロプロパン ／ 蒸気
  columns:
  - Ⓐ
  - Ⓑ
  answer: 1
  choice_notes: []
  explanation: '塩化ビニルは、沸点が約 −13℃で、常温・常圧では**気体**です。問題文の定義では「ガス」に当たるので、蒸気とする選択肢1は誤りです。


    エチルベンゼン（沸点約 136℃）と 1,2-ジクロロプロパン（約 96℃）は、常温で液体なので、蒸気です（選択肢2・5）。硫化水素（約 −60℃）とホルムアルデヒド（約 −19℃）は、常温で気体なので、ガスです（選択肢3・4）。


    ガスか蒸気かは、沸点が常温（25℃）より下か上かで判断します。沸点が常温より低い物質として、塩化ビニル、エチレンオキシド、臭化メチル、ホルムアルデヒド、硫化水素を覚えておきます。平成28年度第2回では、「塩化ビニル／ガス」が正しい組合せとして出題されています。'
