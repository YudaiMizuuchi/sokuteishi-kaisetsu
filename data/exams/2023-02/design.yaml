  stem: 騒音の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の範囲は、作業者が常時作業するために立ち入る場所で、おおむね 80 dB(A) 以上の騒音レベルの範囲とする。
  - A 測定点の位置は、単位作業場所の床面上に任意の基点を定め、原則として、この基点を軸として 6 m 以下の等間隔で引いた縦の線と横の線との交点の全てを測定点とする。
  - 測定点の高さは床上 1.2 m 以上 1.5 m 以下とするが、作業者が上下方向に作業の位置を移動する場合は、当該作業が行われる作業床から 1.2 m以上 1.5 m 以下とする。
  - A 測定点が5に満たない場合は、縦の線若しくは横の線の間隔の変更又は基点の移動を行うことにより、測定点を5以上になるようにする。
  - A 測定及び B 測定を実施した場合の管理区分の決定は、A 測定の算術平均値及び標準偏差並びに B 測定値を用いる。
  answer: 5
  choice_notes: []
  explanation: '騒音の管理区分の決定には、A 測定平均値（算術平均）と B 測定値を用い、標準偏差は用いません。選択肢5は誤りです。


    単位作業場所をおおむね 80 dB(A) 以上の範囲とする（選択肢1）ことも、騒音の測定の基本として押さえておきましょう。'
