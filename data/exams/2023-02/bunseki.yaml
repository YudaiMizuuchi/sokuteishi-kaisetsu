  traps: []
  rank: null
  stem: 'n回の測定により、測定値$x_1, x_2, x_3, \cdots, x_n$が得られたとき、この測定値の標準偏差を求める式は次のうちどれか。


    ただし、n回の測定値の平均を$\bar{x}$とする。'
  choices:
  - $\sqrt{n\times\sum_{i=1}^{n}(x_i+\bar{x})^2}$
  - $\sqrt{n\times\sum_{i=1}^{n}(x_i-\bar{x})^2}$
  - $\sqrt{\dfrac{\sum_{i=1}^{n}(x_i+\bar{x})^2}{n}}$
  - $\sqrt{\dfrac{\sum_{i=1}^{n}(x_i-\bar{x})^2}{n}}$
  - $\dfrac{\sum_{i=1}^{n}(x_i-\bar{x})}{n}$
  columns: null
  answer: 4
  choice_notes: []
  explanation: '標準偏差は、各測定値と平均との差（偏差）を2乗して合計し、測定の回数で割って、平方根をとったものです。選択肢の中でこの形になっているのは、選択肢4です。


    $s=\sqrt{\dfrac{\sum_{i=1}^{n}(x_i-\bar{x})^2}{n}}$


    ほかの選択肢は、偏差ではなく和（$x_i+\bar{x}$）を使っている（選択肢1・3）、$n$ で割らずに掛けている（選択肢1・2）、2乗も平方根もない（選択肢5。偏差をそのまま合計すると、必ず0になります）ので、誤りです。


    なお、限られた回数の測定から、もとの集団のばらつきを推定するときは、$n$ のかわりに $n-1$ で割る式を使います。この問題の選択肢には $n-1$ の式がないので、$n$ で割る選択肢4を選びます。'
  figures: []
