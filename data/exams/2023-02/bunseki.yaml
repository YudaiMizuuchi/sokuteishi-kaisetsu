  stem: 濃度12 mol・L⁻¹の濃塩酸を水で希釈してpHが1.00となる溶液250 mLをつくるのに必要な濃塩酸の体積として、正しい値に最も近いものは次のうちどれか。
  choices:
  - 0.6 mL
  - 1.1 mL
  - 1.6 mL
  - 2.1 mL
  - 2.6 mL
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'pH が 1.00 の溶液は、水素イオン濃度が $10^{-1}$ ＝ 0.10 mol/L です。塩酸は強酸で、完全に電離するので、塩酸の濃度も 0.10 mol/L です。


    - 必要な塩化水素の量：0.10 mol/L × 0.250 L ＝ 0.025 mol

    - 必要な濃塩酸の体積：0.025 mol ÷ 12 mol/L ＝ 0.00208 L ≒ 2.1 mL


    正答は選択肢4です。


    希釈の計算は、「うすめる前後で、溶質の物質量は変わらない」（濃度 × 体積 ＝ 一定）で解きます。12 × V ＝ 0.10 × 250 から、V ≒ 2.1 mL と求めても同じです。'
