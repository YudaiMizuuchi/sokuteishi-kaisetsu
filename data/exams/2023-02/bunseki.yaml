  stem: '液体のメチルエチルケトン3.0 mgを捕集袋内の清浄空気中で完全に気化させて、メチルエチルケトンの標準ガス100 Lを調製した。その濃度として、正しい値に最も近いものは次のうちどれか。


    ただし、メチルエチルケトンのモル質量は72 g・mol⁻¹とする。また、調製した標準ガスの温度は25℃、圧力は1気圧とする。'
  choices:
  - 2 ppm
  - 5 ppm
  - 10 ppm
  - 15 ppm
  - 20 ppm
  columns: null
  answer: 3
  choice_notes: []
  explanation: '物質量を求め、25℃・1気圧での体積に直して、全体の体積で割ります。


    - 物質量：3.0 mg ÷ 72 g/mol ＝ 0.0417 mmol

    - 気体の体積：0.0417 mmol × 24.47 mL/mmol ≒ 1.02 mL

    - 濃度：1.02 mL ÷ 100 L ＝ 1.02 × 10⁻³ L ÷ 100 L ≒ 10 × 10⁻⁶ ＝ 10 ppm


    正答は選択肢3です。


    25℃・1気圧では、1 mol の気体は 24.47 L（1 mmol は 24.47 mL）です。ppm は体積の比（100万分の1）なので、「気化したあとの体積（mL）÷ 全体の体積（L）× 1,000」で求められます。'
