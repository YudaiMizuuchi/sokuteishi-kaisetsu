  stem: 精製水の製造に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金属製やガラス製の蒸留水製造装置からは、イオンの溶出がある。
  - メンブランフィルターは、水中の粒子の除去に用いる。
  - イオン交換水の純度は、電気伝導度で評価できる。
  - 逆浸透法では、原料水中の不純物のイオンを除去できる。
  - 逆浸透法における加圧の上限は原料水の浸透圧と一致する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '逆浸透法では、原料水の側に**浸透圧を超える**圧力をかけて、水だけを膜の反対側に押し出します。浸透圧は、加える圧力の上限ではなく、これを超えなければ水が出てこない下限です。選択肢5は誤りです。


    金属製やガラス製の蒸留装置からは、イオンが溶け出します（選択肢1）。メンブランフィルターは、水中の粒子を除きます（選択肢2）。イオン交換水の純度は、電気伝導度で評価できます（選択肢3）。逆浸透法では、イオンを除くことができます（選択肢4）。


    浸透は、本来、濃度の低い側から高い側へ水が移る現象です。これと逆向きに水を動かすので「逆浸透」と呼びます。令和7年度第2回にも、「浸透圧を超えてはならない」とする誤りの選択肢があります。


    根拠：『分析概論』。'
