  stem: 'X線回折分析法に関する次の記述の㋑から㋩の［　　］に入る語句の組合せとして、正しいものは下のうちどれか。


    「X線回折分析法は、ブラッグの法則を用いて［㋑］を求めることにより、鉱物の同定・定量などの手段として使われている。そのためX線回折装置には、X線を発生させるX線管球、発生したX線のうち［㋺］のみを測定試料に照射するための除去フィルターやモノクロメーター、試料から回折したX線の回折角を測定するための［㋩］が備わっている。」'
  choices:
  - 粒子数濃度 ／ 連続X線 ／ コリメーター
  - 粒子数濃度 ／ 連続X線 ／ ゴニオメーター
  - 格子面間隔 ／ 連続X線 ／ ゴニオメーター
  - 格子面間隔 ／ 特性X線 ／ コリメーター
  - 格子面間隔 ／ 特性X線 ／ ゴニオメーター
  columns:
  - ㋑
  - ㋺
  - ㋩
  answer: 5
  choice_notes: []
  explanation: '正しい組合せは、㋑ 格子面間隔、㋺ 特性X線、㋩ ゴニオメーターで、正答は選択肢5です。


    - ㋑：ブラッグの法則（2d sin θ ＝ nλ）は、X線の波長 λ と回折角 θ から、結晶の**格子面間隔** d を求める式です。格子面間隔は、鉱物ごとに決まっているので、同定に使えます。

    - ㋺：試料に当てるのは、波長のそろった**特性X線**です。フィルターやモノクロメーターで、連続X線などを除きます。

    - ㋩：回折角を測る装置が、**ゴニオメーター**（測角器）です。コリメーターは、X線の束を細く平行にするための部品です。


    粒子数濃度は、X線回折とは関係のない量です。X線回折分析法は、遊離けい酸の定量に使われる方法で、選択科目の鉱物性粉じんでも問われます。'
