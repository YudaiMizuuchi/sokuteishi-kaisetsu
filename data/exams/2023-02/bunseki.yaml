  stem: 半減期8.0日の放射性核種の放射能が500 Bqであるとき、4.0日後の放射能として正しい値に最も近いものは次のうちどれか。
  choices:
  - 450 Bq
  - 400 Bq
  - 350 Bq
  - 250 Bq
  - 125 Bq
  columns: null
  answer: 3
  choice_notes: []
  explanation: '放射能は、半減期ごとに 1/2 になります。経過した時間が半減期の何倍かを、1/2 の指数にします。


    $A=500\times\left(\dfrac{1}{2}\right)^{4.0/8.0}=500\times\left(\dfrac{1}{2}\right)^{0.5}=\dfrac{500}{\sqrt{2}}$


    $\sqrt{2}$ ≒ 1.41 なので、500 ÷ 1.41 ≒ 354 Bq です。


    最も近いのは 350 Bq で、正答は選択肢3です。


    半減期の半分の時間がたっても、減る量が半分（375 Bq）になるわけではなく、放射能は $1/\sqrt{2}$ ≒ 0.71 倍になります。8.0 日後に 250 Bq になる途中なので、4.0 日後は 250 と 500 の間で、直線の中間（375）より少し小さい値、と見当をつけられます。'
