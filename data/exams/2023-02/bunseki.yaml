  columns: null
  answer: 4
  choice_notes: []
  explanation: '塩の水溶液の性質は、もとの酸と塩基の強さで決まります。**弱酸と強塩基**の塩は、塩基性を示します。酢酸ナトリウムは、弱酸の酢酸と、強塩基の水酸化ナトリウムの塩なので、水溶液は塩基性で、pH が最も高くなります。正答は選択肢4です。


    酢酸イオンが水と反応して（加水分解）、水酸化物イオンを生じるからです。


    $\mathrm{CH_3COO^- + H_2O \rightleftarrows CH_3COOH + OH^-}$


    塩化ナトリウム・硝酸ナトリウム・過塩素酸ナトリウムは、強酸と強塩基の塩で、水溶液は中性です（選択肢1・3・5）。硫酸水素ナトリウムは、水素イオンを出すので、酸性です（選択肢2）。


