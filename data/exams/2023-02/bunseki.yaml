  explanation: '理論段相当高さ H は、ファン・デームター式 H ＝ A ＋ B/v ＋ Cv で表されます。第1項（渦流拡散）は流速によらない定数、第2項（分子の拡散）は流速が大きいほど小さくなるので v に反比例、第3項（平衡の遅れ）は流速が大きいほど大きくなるので v に比例します。よって（5）が正しい式です。


