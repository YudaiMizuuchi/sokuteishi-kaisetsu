  stem: 検量線に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定結果が検量線の濃度範囲を超えた場合は、試料溶液を希釈して再測定する。
  - 標準添加法を用いる場合は、検量線は直線でなくてはならない。
  - 検量線の標準液は、分析試料の成分組成と近くなるようにする。
  - 内標準物質としては、測定対象物質と物理的、化学的によく似た物質を選択する。
  - 検量線の直線範囲内であれば、測定結果の誤差は一定である。
  answer: 5
  choice_notes: []
  explanation: '検量線の直線範囲内でも、測定結果の誤差が一定になるわけではありません。一般に、濃度が低いほど、測定値に対する誤差の割合は大きくなります。選択肢5は誤りです。


    検量線の両端に近いところでは誤差が大きくなりやすいので、試料の濃度が検量線の中ほどに来るように調製するのが望ましいとされています。'
