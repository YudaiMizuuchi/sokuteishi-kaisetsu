  stem: 圧力が1.0気圧、絶対温度が300 K、体積が3.0 Lの理想気体を、2.0気圧、360 Kにしたときのこの気体の体積は、次のうちどれか。
  choices:
  - 1.0 L
  - 1.2 L
  - 1.4 L
  - 1.6 L
  - 1.8 L
  columns: null
  answer: 5
  choice_notes: []
  explanation: '理想気体では、$\dfrac{PV}{T}$ が一定です（ボイル・シャルルの法則）。


    $\dfrac{1.0\times 3.0}{300}=\dfrac{2.0\times V}{360}$


    $V=3.0\times\dfrac{1.0}{2.0}\times\dfrac{360}{300}=1.8\ \mathrm{L}$


    正答は選択肢5です。


    圧力が2倍になると体積は 1/2 に、絶対温度が 1.2 倍になると体積は 1.2 倍になります。「圧力は反比例、絶対温度は比例」と、別々に掛けると間違えません。'
