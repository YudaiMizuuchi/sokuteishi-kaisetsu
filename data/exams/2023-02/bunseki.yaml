  - カラム内径が小さいほど、理論段数は大きくなる。
  - カラムの液相の膜厚が小さいほど、理論段数は大きくなる。
  - 液相の極性が大きいほど、極性物質の保持時間が長くなる。
  - 無極性液相を用いると、無極性物質は沸点の低い順に溶出する。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '理論段数は、キャリヤーガスの**種類によって変わります**。ガスの種類（窒素・ヘリウム・水素）によって、試料の分子の拡散のしやすさが違い、理論段数が最大になる流速も、その前後での下がり方も違うからです。「流速が同じなら、ガスの種類によらない」とする選択肢1は誤りです。


    カラムの内径が小さいほど（選択肢2）、液相の膜厚が小さいほど（選択肢3）、理論段数は大きくなります。極性の大きい液相は、極性物質を長く保持します（選択肢4）。無極性の液相では、無極性物質は、沸点の低い順に出てきます（選択肢5）。


