  rank: null
  stem: '有機化合物Aを0.060 g含む水溶液50 mLからヘキサン5.0 mLにAを抽出した。水溶液中に残ったAの質量として、正しい値は次のうちどれか。


    ただし、水とヘキサン間のAの分配係数（K）は次式で表される。


    $K=\dfrac{[\mathrm{A}]_{\text{ヘキサン}}}{[\mathrm{A}]_{\text{水}}}=50$'
  choices:
  - 0.010 g
  - 0.020 g
  - 0.030 g
  - 0.040 g
  - 0.050 g
  columns: null
  answer: 1
  choice_notes: []
  explanation: '分配係数は、ヘキサン中の濃度と水中の濃度の比です。質量の比に直すときは、体積を掛けます。


    $\dfrac{\text{ヘキサン中の質量}}{\text{水中の質量}}=K\times\dfrac{V_{\text{ヘキサン}}}{V_{\text{水}}}=50\times\dfrac{5.0}{50}=5$


    A は、ヘキサンと水に 5：1 の割合で分かれるので、水に残るのは、全体の 1/6 です。


    $0.060\times\dfrac{1}{6}=0.010\ \mathrm{g}$


    正答は選択肢1です。


    分配係数が 50 でも、ヘキサンの体積が水の 1/10 しかないので、1回の抽出では 1/6 が水に残ります。分配係数（濃度の比）を、そのまま質量の比と読まないことが大事です。'
  figures: []
  law_note: null
