  stem: 分析に使用するガラス製体積計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ホールピペットの容量に対する許容誤差の割合は、一般に、容量の小さなものの方が大きい。
  - 同じ容量のホールピペットとメスピペットでは、一般に、メスピペットの方が許容誤差は大きい。
  - メスフラスコで水溶液を定容するときは、標線の下端とメニスカスの下端を合わせる。
  - ビュレットは、最小目盛の1/10までを読み取る。
  - 日本では、ガラス製体積計に表記されている体積は、液温20℃の液体の体積である。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'メスフラスコで定容するときは、メニスカスの下端（水際の最深部）を、標線の**上端**（上縁）に合わせます。「標線の下端」とする選択肢3は誤りです。


    ホールピペットの許容誤差の、容量に対する割合は、容量の小さいものほど大きくなります（選択肢1）。同じ容量なら、メスピペットの方がホールピペットより許容誤差が大きくなります（選択肢2）。ビュレットは、最小目盛の 1/10 まで読みます（選択肢4）。ガラス製体積計の目盛は、20℃の水の体積を表しています（選択肢5）。


    平成28年度第2回・平成30年度第2回・令和元年度第2回では、「標線の上端とメニスカスの下端を合わせる」という正しい記述が出題されています。


    根拠：JIS R 3505:1994（箇条6）、『分析概論』。'
