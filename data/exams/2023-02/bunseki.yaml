  explanation: 'トルエンは、無極性の物質なので、極性の大きい水にはほとんど溶けず、同じく極性の小さいクロロホルムにはよく溶けます。「水に対する溶解度の方が大きい」とする選択肢3は誤りです。


    「似たもの同士が溶け合う」が原則です。塩化ナトリウムや酢酸ナトリウムのようなイオン性の物質（選択肢1・2）、ヒドロキシ基をたくさんもつグルコース（選択肢4）、アミノ酸のグリシン（選択肢5）は、水によく溶け、エタノールや無極性の四塩化炭素には溶けにくい物質です。


