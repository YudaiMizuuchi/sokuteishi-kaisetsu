  stem: ガスクロマトグラフ分析に用いるカラムの理論段高さHを表す式として、正しいものは次のうちどれか。ただし、右辺の第1項はカラム内の渦流拡散に起因する項、第2項は成分分子がカラム中で拡散移動することに起因する項、第3項は移動相と固定相間の平衡の遅れに起因する項である。また、A、B、Cは定数、vは移動相の平均線速度である。
  choices:
  - H ＝ Av ＋ B/v ＋ C
  - H ＝ A ＋ Bv ＋ C
  - H ＝ Av ＋ B ＋ C/v
  - H ＝ A/v ＋ B ＋ Cv
  - H ＝ A ＋ B/v ＋ Cv
  answer: 5
