- num: 14
  status: published
  chapters: []
  traps:
  - an-logarithm-02
  rank: null
  stem: '測定対象物質の水溶液に、ある波長の光を当てたところ、入射光の強さ（I₀）に対する透過光の強さ（I）の比（I/I₀）が0.2であった。このときの測定対象物質の吸光度として正しい値に最も近いものは次のうちどれか。


    ただし、log₁₀2=0.301とする。'
  choices:
  - '0.1'
  - '0.3'
  - '0.5'
  - '0.7'
  - '0.9'
  columns: null
  answer: 4
  choice_notes: []
  explanation: '吸光度 $A$ は、透過率（$I/I_0$）の逆数の常用対数です。


    $A=-\log_{10}\dfrac{I}{I_0}=-\log_{10}0.2=\log_{10}5$


    $\log_{10}5=\log_{10}\dfrac{10}{2}=1-\log_{10}2=1-0.301=0.699$


    最も近いのは 0.7 で、正答は選択肢4です。


    0.2 ＝ 2 ÷ 10 と見て、$\log_{10}0.2=0.301-1=-0.699$ としても同じです。透過率が 10 ％（0.1）なら吸光度は 1、1 ％ なら 2、という目安も覚えておくと、検算に使えます。'
