  stem: 拡散セルを用いた標準ガスの調製に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 気体の標準試料の調製方法には静的な方法と動的な方法があるが、拡散セルを用いる方法は動的な方法の一つである。
  - 拡散セルでは、一定温度に保つと内部の液体が一定速度で壁面を透過して蒸発してくることを利用する。
  - 標準ガスの濃度は拡散セルの温度が高いほど高くなる。
