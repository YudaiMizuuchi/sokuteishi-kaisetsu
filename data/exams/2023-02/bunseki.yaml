  stem: 物理量又は物理定数Ⓐとその単位記号Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 圧力 ／ N・m⁻²
  - 粒子数濃度 ／ mg・cm⁻³
  - 気体定数 ／ J・K⁻¹・mol⁻¹
  - アボガドロ定数 ／ mol⁻¹
  - 電流 ／ A
  columns:
  - Ⓐ
  - Ⓑ
  answer: 2
  choice_notes: []
  explanation: '粒子数濃度は、単位体積あたりの粒子の**個数**なので、単位は cm⁻³（個/cm³）や m⁻³ です。mg・cm⁻³ は、単位体積あたりの質量（質量濃度、密度）の単位なので、選択肢2は誤りです。


    圧力は、単位面積あたりの力で、N・m⁻²（＝ Pa。選択肢1）です。気体定数は J・K⁻¹・mol⁻¹（選択肢3）、アボガドロ定数は、1 mol あたりの個数なので mol⁻¹（選択肢4）、電流は A（選択肢5）です。


    単位の問題は、その量が「何を何で割ったものか」を考えると、判断できます。'
  figures: []
  law_note: null
  freq:
    kind: question
    denom: 23
