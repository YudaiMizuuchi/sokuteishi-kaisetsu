  explanation: '拡散セルは、液体が蒸発してできた蒸気が、細い拡散チューブの中を**拡散**して出てくる仕組みです。液体が壁面を透過して蒸発するのはパーミエーションチューブの仕組みなので、選択肢2は誤りです。


