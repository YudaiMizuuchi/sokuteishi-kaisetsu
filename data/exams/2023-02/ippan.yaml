- num: 17
  status: published
  chapters: []
  traps: []
  rank: null
  stem: 労働衛生保護具に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アーク溶接作業に用いられる遮光保護具は、レーザー機器取扱作業において保護めがねとして使用してはならない。
  - 使い捨て式防じんマスクは、厚生労働大臣の規格が定められており、国家検定の対象である。
  - 送気マスクは、酸素濃度が18%未満の空気中でも使用することができる。
  - 防じんマスクの装着の際、面体と顔面の密着性を高めるため、原則として、面体の接顔部に接顔メリヤスを使用してはならない。
  - 放射性物質による汚染のある区域内の作業で、オイルミストが混在する場合に使用する防じんマスクの区分はRS3である。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '放射性物質による汚染のおそれのある区域で使う防じんマスクは、取替え式の区分3（RS3 又は RL3）です。このうち、オイルミストが混在する場合に使えるのは、液体の試験粒子で性能を確かめた **RL3** です。RS3 とする選択肢5は誤りです。


    アーク溶接用の遮光保護具は、レーザー用の保護めがねとして使ってはいけません（選択肢1）。使い捨て式防じんマスクも、規格が定められていて、検定の対象です（選択肢2）。送気マスクは、酸素濃度 18 ％ 未満の場所でも使えます（選択肢3）。接顔メリヤスは、面体と顔面の密着性を下げるので、原則として使いません（選択肢4）。


    区分の記号は、1文字目が R＝取替え式・D＝使い捨て式、2文字目が S＝固体の試験粒子・L＝液体の試験粒子、数字が捕集効率です。「オイルミストがあれば L」と覚えます。平成30年度第2回・令和元年度第2回・令和2年度第1回では、「RL3 である」という正しい記述が出題されています。


    根拠：防じんマスク、防毒マスク及び電動ファン付き呼吸用保護具の選択、使用等について（令和5年5月25日 基発0525第3号）、防じんマスクの規格。'
