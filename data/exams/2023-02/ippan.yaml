  stem: 温熱環境及び人体の適応等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 熱けいれんは、高温の環境下での大量の発汗により、体内の水分が急激に減少したときに生ずる。
  - 日射がない場合のWBGTは、自然湿球温度及び黒球温度の数値から算出される。
  - WBGT基準値は、同一作業であっても、熱に順化していない人の方が熱に順化している人よりも、小さい値となる。
  - WBGT基準値は、身体に対する負荷が大きい作業の方が、負荷が小さい作業より小さい値となる。
  - 発汗のうちで、高温環境下で体温調節のために発生するものは温熱性発汗と呼ばれ、手のひら、足の裏を除く全身にみられる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '熱けいれんは、大量に汗をかいて水分と塩分が失われたところへ、**水分だけ**を補給して、血液中の**塩分濃度が低下**したときに起こります。「体内の水分が急激に減少したとき」とする選択肢1は誤りです。


    日射がない場合の WBGT は、自然湿球温度と黒球温度から算出します（0.7 × 自然湿球温度 ＋ 0.3 × 黒球温度。選択肢2）。WBGT 基準値は、熱に順化していない人の方が小さく（選択肢3）、身体への負荷が大きい作業の方が小さくなります（選択肢4）。体温調節のための発汗は温熱性発汗と呼ばれ、手のひらと足の裏を除く全身にみられます（選択肢5）。


    熱けいれんは「塩分の不足」、熱虚脱（熱失神）は「脳への血流の不足」、熱射病は「体温調節機能の失調」と、原因で区別して覚えます。'
