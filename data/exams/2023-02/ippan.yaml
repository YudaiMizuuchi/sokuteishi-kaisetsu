  stem: 作業環境評価基準に定める「管理濃度」及び日本産業衛生学会の「許容濃度等の勧告」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤の管理濃度は、全てppmで表記されている。
  - A測定においては、管理濃度は、測定値を統計的に処理したものと対比するもので、個々の測定値と直接対比するものではない。
  - 粉じんの管理濃度は、その粉じんに含まれる吸入性粉じんの含有率（%）を用いて算出される。
  - 許容濃度の数値は、経皮吸収がないことを前提として定められたものである。
  - 許容濃度等の勧告において、ヒトに対する発がん性については、第1群、第2群A及び第2群Bの3種類に分類されている。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '鉱物性粉じんの管理濃度は、その粉じんに含まれる**遊離けい酸の含有率**（％）を用いて算出します（E ＝ 3.0 ／（1.19Q ＋ 1）。Q が遊離けい酸含有率）。「吸入性粉じんの含有率」とする選択肢3は誤りです。


    有機溶剤の管理濃度は、全て ppm で表されています（選択肢1）。管理濃度は、測定値を統計的に処理した評価値と比べるもので、個々の測定値と直接比べるものではありません（選択肢2）。許容濃度は、経皮吸収がないことを前提にした数値です（選択肢4）。許容濃度等の勧告では、発がん性を、第1群・第2群A・第2群Bの3つに分類しています（選択肢5）。


    平成30年度第1回にも、同じ誤りの選択肢があります。


    根拠：作業環境評価基準 別表、許容濃度等の勧告（日本産業衛生学会）。'
