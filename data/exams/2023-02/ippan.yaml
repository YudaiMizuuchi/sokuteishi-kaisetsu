- num: 6
  status: published
  chapters: []
  traps: []
  rank: null
  stem: '鉱物性粉じんに関する次の㋑から㋥の記述について、誤っているものの組合せは下のうちどれか。


    ㋑ 鉱物性粉じん中の遊離けい酸は、胸膜プラーク（肥厚斑）の主要な原因である。


    ㋺ 吸入性粉じんの分粒装置は、空気力学相当径4 µmの粉じん粒子を50%透過する性能を有する。


    ㋩ 同一鉱物の破砕による堆積粉じんと浮遊粉じんでは、遊離けい酸の含有率は必ずしも同じではない。


    ㋥ 粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求められる。'
  choices:
  - ㋑ ㋺
  - ㋑ ㋥
  - ㋺ ㋩
  - ㋺ ㋥
  - ㋩ ㋥
  columns: null
  answer: 2
  choice_notes: []
  explanation: '誤っているのは㋑と㋥で、正答は選択肢2です。


    - ㋑（誤り）：胸膜プラーク（肥厚斑）の主要な原因は、**石綿**です。遊離けい酸は、けい肺（じん肺）の原因です。

    - ㋺（正しい）：吸入性粉じんの分粒装置は、空気力学相当径 4 µm の粒子を 50 ％ 透過する特性のものを使います。

    - ㋩（正しい）：同じ鉱物でも、堆積粉じんと浮遊粉じんでは、粒径の分布が違うので、遊離けい酸の含有率は同じとは限りません。

    - ㋥（誤り）：空気力学相当径は、その粒子と**同じ沈降速度**をもつ、密度 1 g/cm³ の球の直径です。空気中での動き方から決まる径なので、顕微鏡で大きさを見ても求められません。光学顕微鏡で測れるのは、形から決まる幾何学的な径です。


    根拠：『デザイン・サンプリングの実務（A・B測定編 上）』（4 µm の粒子を 50 ％ 透過する分粒特性）。㋩と㋥は、過去問の正答にもとづく判断です。'
