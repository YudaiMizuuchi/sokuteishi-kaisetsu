  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩素は、黄緑色の刺激臭のある気体で、吸入した場合、粘膜や呼吸器が刺激され、肺水腫に至ることもある。
  - 硫化水素による中毒では、意識消失、呼吸麻痺などを生じる。
  - エチレンオキシドは、眼、上部気道、皮膚を刺激したり、肺水腫を起こすほか、ヒトに対する発がん性が知られている。
  - 窒素は、無色、無臭の気体であるが、高気圧作業においては麻酔作用などが現れる。
  - 一酸化炭素による中毒では、ヘモグロビン合成の阻害による貧血がみられる。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '一酸化炭素は、ヘモグロビンの合成を阻害するのではなく、ヘモグロビンと強く**結合**して、酸素を運べなくします。ヘモグロビン（ヘム）の合成が阻害されて貧血になるのは、鉛中毒の特徴なので、選択肢5は誤りです。


    塩素は、黄緑色で刺激臭のある気体で、粘膜や呼吸器を刺激し、肺水腫に至ることもあります（選択肢1）。硫化水素は、意識消失や呼吸麻痺を起こします（選択肢2）。エチレンオキシドは、眼・上部気道・皮膚を刺激し、ヒトに対する発がん性も知られています（選択肢3）。窒素は、無色・無臭の気体ですが、高気圧下では麻酔作用（窒素酔い）が現れます（選択肢4）。


    平成27年度第1回・平成29年度第2回などにも、一酸化炭素を「ヘモグロビン合成の阻害」とする誤りの選択肢があります。'
