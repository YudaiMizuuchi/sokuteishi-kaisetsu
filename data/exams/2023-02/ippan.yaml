  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - リスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ずしも数値化する必要はなく、相対的な分類でも差し支えない。
  - 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - 個人用保護具の使用によるばく露低減対策は、機械設備の密閉化等の衛生工学的対策、マニュアルの整備等の管理的対策等、より優先順位の高い対策を講じても十分にリスクを低減できない場合に行うべき対策である。
  - リスク低減措置の検討において、より優先順位の高い措置を実施すれば十分にリスクが低減される場合には、その措置よりも優先順位の低い措置の検討は必要ない。
  - 過去に実際に発生した負傷又は疾病のうち、最も重篤であったものの重篤度を、リスクの見積りの際における重篤度として見積もる。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '負傷又は疾病の重篤度は、過去に実際に起きたものの程度ではなく、**最悪の状況を想定した、最も重篤な負傷又は疾病**の程度で見積もります。「過去に実際に発生したもののうち、最も重篤であったもの」とする選択肢5は誤りです。過去にたまたま軽い被害で済んでいても、同じ状況で、より重い被害が起こりうるからです。


    リスクの見積りは、低減の優先度を決めるためのものなので、数値にしなくても、相対的な分類でかまいません（選択肢1）。ばく露濃度がばく露限界を相当程度下回るときは、リスク低減措置の検討は要りません（選択肢2）。個人用保護具は、衛生工学的対策や管理的対策を講じても、リスクを十分に下げられないときの対策で（選択肢3）、優先順位の高い措置で十分にリスクが下がるなら、それより低い措置の検討は要りません（選択肢4）。


    令和元年度第2回・令和3年度第2回でも、重篤度の見積りが問われています。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針。'
