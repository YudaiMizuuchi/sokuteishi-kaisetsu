  stem: 厚生労働省の「情報機器作業における労働衛生管理のためのガイドライン」に基づいて行う次の措置のうち、誤っているものはどれか。
  choices:
  - 書類上及びキーボード上における照度は、300ルクス以上になるようにする。
  - 一連続作業時間が1時間を超えないようにし、次の連続作業までの間に10分～15分の作業休止時間を設け、かつ、一連続作業時間内において1回～2回程度の小休止を設ける。
  - ディスプレイ画面の明るさ、書類及びキーボード面における明るさと、周辺の明るさの差は、なるべく大きく明瞭にする。
  - 情報機器作業を行う作業者の健康診断は、一般健康診断を実施する際に、併せて実施することができる。
  - 新たに情報機器作業を行うこととなった作業者に対する配置前健康診断における視力検査として、遠見視力及び近見視力の検査を行う。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'ガイドラインでは、ディスプレイ画面の明るさ、書類・キーボード面の明るさと、周辺の明るさの差は、**なるべく小さく**するとされています。明るさの差が大きいと、視線を動かすたびに目が順応し直すことになり、目が疲れるからです。「なるべく大きく明瞭にする」とする選択肢3は誤りです。


    書類上・キーボード上の照度は 300 ルクス以上にします（選択肢1）。一連続作業時間は1時間以内とし、次の連続作業までに 10〜15 分の作業休止時間を設け、一連続作業時間内にも1〜2回程度の小休止を設けます（選択肢2）。情報機器作業の健康診断は、一般健康診断と併せて実施してかまいません（選択肢4）。配置前健康診断の視力検査は、遠見視力と近見視力の両方です（選択肢5）。


    令和元年度第2回にも、同じ誤りの選択肢があります。


    根拠：情報機器作業における労働衛生管理のためのガイドライン。'
