  - 外付け式フードの制御風速とは、作業者の呼吸位置において必要となる最小の風速である。
  - ダクトの断面積が同じである場合、断面が長方形のダクトは円形のダクトに比べて圧力損失が大きい。
  - 一定の排風量のもとでは、ダクトの断面積を大きくすると、圧力損失は小さくなり、搬送速度は遅くなる。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '制御風速は、フードが有害物質を捕らえて吸い込むために必要な、最小の風速です。外付け式フードでは、**発散源のうち、フードの開口面から最も離れた作業位置**での風速で表します。「作業者の呼吸位置」とする選択肢3は誤りです。


    囲い式フードの排風量は、開口面の平均風速と開口面積の積です（選択肢1）。外付け式フードは、熱による上昇気流がある場合などを除き、一般に、上方吸引型より下方吸引型の方が有効です（選択肢2）。断面積が同じなら、長方形のダクトは、円形のダクトより圧力損失が大きくなります（選択肢4）。排風量が一定なら、ダクトの断面積を大きくすると、圧力損失は小さくなり、搬送速度は遅くなります（選択肢5）。


    制御風速の基準の位置は、囲い式は「開口面」、外付け式は「発散源の側」です。令和3年度第1回・令和8年度第1回にも、「作業者の呼吸位置」とする誤りの選択肢があります。'
