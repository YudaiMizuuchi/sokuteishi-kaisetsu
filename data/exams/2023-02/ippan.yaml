  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - アンモニア用防毒マスクの吸収缶の色は緑色であり、硫化水素用防毒マスクの吸収缶の色は黄色である。
  - 防毒マスクのアンモニア用吸収缶は、アンモニアの濃度が低いと触媒作用が緩慢になり、効率が低い。
  - シアン化水素用防毒マスクの吸収缶の色は、青色である。
  - 一酸化炭素用防毒マスクは、ホプカライトを使用し、触媒作用により一酸化炭素を無害化している。
  - 有機ガス用防毒マスクの吸収缶は、使用する環境の温度が高いほど破過時間が短くなる傾向がある。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '触媒作用を使うので、濃度が低いと除毒の効率が下がるのは、**一酸化炭素用**の吸収缶です。アンモニア用の吸収缶には、当てはまりません。選択肢2は誤りです。


    吸収缶の色は、アンモニア用が緑色、硫化水素用が黄色（選択肢1）、シアン化水素用が青色（選択肢3）です。一酸化炭素用は、ホプカライトの触媒作用で、一酸化炭素を無害化します（選択肢4）。有機ガス用の吸収缶は、温度が高いほど、破過時間が短くなる傾向があります（選択肢5）。


    吸収缶の色は、有機ガス用＝黒色、一酸化炭素用＝赤色、ハロゲンガス用＝灰色と黒色も、あわせて覚えます。令和元年度第2回・令和5年度第2回では、「一酸化炭素用は、低濃度では除毒効率が低くなる」という正しい記述が出題されています。


    根拠：防毒マスクの規格、JIS T 8152:2012（吸収缶の色）。アンモニア用の吸収缶の記述は、過去問の正答にもとづく判断です。'
