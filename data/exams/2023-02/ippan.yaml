  stem: 酸素欠乏症及び硫化水素中毒に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中の酸素濃度が15～16%程度の酸素欠乏状態では、一般に頭痛、吐き気などの症状がみられる。
  - 海水が滞留している暗きょの内部での作業では、硫化水素中毒の危険がある。
  - 石炭、硫化鉱又は魚油を入れてあるタンクの内部での作業では、硫化水素中毒の危険がある。
  - 酸素欠乏危険作業を行う場所において、爆発、酸化等を防止するため換気を行うことができない場合には、空気呼吸器、酸素呼吸器又は送気マスクを備え、労働者に使用させる。
  - 第一鉄塩類を含有している地層に接するたて坑の内部での作業では、酸素欠乏症の危険がある。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '石炭・硫化鉱・魚油などを入れてあるタンクの内部は、これらの物質が空気中の酸素を吸収する（酸化される）ので、**酸素欠乏症**の危険がある場所です。硫化水素中毒の危険がある場所（第二種酸素欠乏危険作業の場所）には当たらないので、選択肢3は誤りです。


    酸素濃度が 15〜16 ％ 程度でも、頭痛や吐き気がみられます（選択肢1）。海水が滞留している暗きょの内部は、硫化水素中毒の危険もある場所です（選択肢2）。爆発や酸化を防ぐために換気できないときは、空気呼吸器・酸素呼吸器・送気マスクを備えて使用させます（選択肢4）。第一鉄塩類を含む地層に接するたて坑の内部は、酸素欠乏症の危険がある場所です（選択肢5）。


    硫化水素中毒の危険もあるのは、「海水が滞留している場所」と「し尿・汚水など、腐敗・分解しやすい物質を入れてある場所」です。それ以外の場所で「硫化水素中毒」と書いてあれば、誤りを疑います。平成30年度第2回・令和3年度第2回にも、同じひっかけがあります。


