  - 有機溶剤の管理濃度の値は、全て ppm で表記されている。
  - 許容濃度の数値は、種類の異なる物質の毒性の強さの相対的な尺度に用いることができる。
  - 許容濃度は、作業中のばく露濃度の変動があまり大きくない場合に利用される。
  - 許容濃度等の勧告における発がん性分類表で「第2群」とされた物質は、おそらく人に対して発がん性があると判断できる物質である。
