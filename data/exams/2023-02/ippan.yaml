  stem: '職場における健康障害及びその要因等に関する次の㋑から㋥の記述について、誤っているものの組合せは下のうちどれか。


    ㋑ ノロウイルスは、ベロ毒素を産生するウイルスで、腹痛や出血を伴う水様性の下痢などを起こす。


    ㋺ 感染型食中毒は、食物に付着している細菌そのものの感染によって起こる食中毒で、サルモネラ菌によるものなどがある。


    ㋩ 潜水業務における減圧症は、浮上による急激な減圧に伴い、血液中や組織中に溶け込んでいた二酸化炭素が気泡となり、血管を閉塞したり組織を圧迫することによって発生する。


    ㋥ インフルエンザウイルスにはA型、B型及びC型の三つの型があるが、流行するのは、主として、A型及びB型である。'
  choices:
  - ㋑ ㋺
  - ㋑ ㋩
  - ㋺ ㋩
  - ㋺ ㋥
  - ㋩ ㋥
  columns: null
  answer: 2
  choice_notes: []
  explanation: '誤っているのは㋑と㋩で、正答は選択肢2です。


    - ㋑（誤り）：ベロ毒素を産生するのは、**腸管出血性大腸菌**（O-157 など）で、ウイルスではなく細菌です。ノロウイルスは、ベロ毒素を作りません。主な症状は、嘔吐、下痢、腹痛です。

    - ㋺（正しい）：感染型食中毒は、食物に付いた細菌そのものの感染で起こり、サルモネラ菌によるものなどがあります。

    - ㋩（誤り）：減圧症の原因は、血液や組織に溶け込んでいた**窒素**が、急な減圧で気泡になることです。二酸化炭素ではありません。

    - ㋥（正しい）：インフルエンザウイルスには、A型・B型・C型があり、流行するのは、主にA型とB型です。


    根拠：『衛生管理（上）—第1種用—』（ベロ毒素産生性大腸菌）。㋺・㋥は、過去問の正答にもとづく判断です。'
