  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キシレンは、代謝されて、尿中にメチル馬尿酸として排泄される。
  - テトラクロロエチレンの生物学的モニタリングの指標として、尿中のテトラクロロエタンの濃度がある。
  - スチレンは、代謝されて、尿中にマンデル酸が排泄される。
  - 鉛の生物学的モニタリングの指標として、赤血球中のプロトポルフィリンの濃度がある。
  - トルエンの生物学的モニタリングの指標である尿中馬尿酸の濃度は、飲食物中の安息香酸の量が増加すると高くなることがある。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'テトラクロロエチレンの生物学的モニタリングの指標は、尿中の**トリクロロ酢酸**又は**総三塩化物**です。「テトラクロロエタン」は、名前の似た別の有機溶剤で、代謝物ではありません。選択肢2は誤りです。


    キシレンはメチル馬尿酸（選択肢1）、スチレンはマンデル酸（選択肢3）として、尿中に排泄されます。鉛の指標には、血液中の鉛、尿中のデルタアミノレブリン酸のほか、赤血球中のプロトポルフィリンがあります（選択肢4）。トルエンの指標である尿中馬尿酸は、飲食物に含まれる安息香酸（保存料など）からも生じるので、安息香酸を多く摂ると高くなります（選択肢5）。


    溶剤と代謝物の組合せは、「トルエン＝馬尿酸、キシレン＝メチル馬尿酸、スチレン＝マンデル酸、塩素系（トリクロロエチレン・テトラクロロエチレン・1,1,1-トリクロロエタン）＝トリクロロ酢酸・総三塩化物、n-ヘキサン＝2,5-ヘキサンジオン」とまとめて覚えます。'
