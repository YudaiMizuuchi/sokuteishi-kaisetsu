  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定士ではない者に、作業環境評価基準に基づいて、指定作業場についての作業環境測定結果の評価を行わせることができる。
  - 放射性物質取扱作業室における空気中の放射性物質の濃度の測定は、作業環境測定士ではない者に行わせることはできない。
  - 作業環境測定の業務に関する不正の行為により、作業環境測定士の登録を取り消された者は、その日から起算して1年間は、作業環境測定士となることができない。
  - 指定作業場以外の作業場における作業環境測定については、作業環境測定士以外の者に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリング（個人サンプリング法を除く。）の業務を行うことができる。
  answer: 3
  choice_notes: []
  explanation: '作業環境測定の業務に関する不正の行為などで登録を取り消された者は、取消しの日から起算して**2年**を経過しない間は、作業環境測定士となることができません。1年とする選択肢3は誤りです。


    根拠：作業環境測定法第6条第2号。'
