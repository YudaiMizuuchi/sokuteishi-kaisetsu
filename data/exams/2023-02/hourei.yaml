  stem: 酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 乾性油その他空気中の酸素を吸収する物質を入れてあるタンクの内部における作業は、第1種酸素欠乏危険作業である。
  - 酸素欠乏危険作業に係る業務に労働者を就かせるときは、当該労働者に対し、法定の科目について特別の教育を行わなければならない。
  - 腐泥層に通ずるたて坑の内部における作業は、第1種酸素欠乏危険作業である。
  - 酸素等の濃度が法定の基準を満たすようにするために酸素欠乏危険作業を行う場所を換気するときは、純酸素を使用してはならない。
  - 第二鉄塩類を含有している地層に接する井戸の内部における作業は、第1種酸素欠乏危険作業である。
  answer: 5
  choice_notes: []
  explanation: '第1種酸素欠乏危険作業に当たるのは、**第一鉄塩類**を含有している地層に接する井戸などの内部です。第一鉄塩類は空気中の酸素と反応して酸化されるため、酸素欠乏を起こします。第二鉄塩類とする選択肢5は誤りです。


    第二鉄塩類はすでに酸化された状態なので、さらに酸素を消費しません。


