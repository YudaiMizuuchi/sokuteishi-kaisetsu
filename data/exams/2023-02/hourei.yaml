  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについての一酸化炭素の含有率の測定の測定点は、建築物の室の中央部の床上 75 cm 以上 120 cm 以下の位置に、1以上としなければならない。
  - 鉱物性粉じんに係る単位作業場所が著しく狭ければ、単位作業場所における測定点の数を5未満とすることができる。
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 鉱物性粉じんの濃度の測定を相対濃度指示方法によって行う場合には、原則として、当該単位作業場所における1箇所以上の測定点において、同時に分粒装置を用いるろ過捕集方法及び重量分析方法による測定を行わなければならない。
  - 溶融金属の運搬又は鋳込みの業務を行う暑熱の屋内作業場における気温及び湿度の測定の測定点は、当該単位作業場所の中央部の床上 50 cm 以上150 cm 以下の位置に、1以上としなければならない。
  answer: 2
  choice_notes: []
  explanation: 'A 測定の測定点を5未満にできるのは、単位作業場所が著しく狭く、**かつ**、濃度がほぼ均一であることが明らかな場合です。著しく狭いだけでは5未満にできないので、選択肢2は誤りです。


    令和6年度第2回にも、2つの条件がそろわない形の誤りがあります。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんに係る単位作業場所が著しく狭ければ、単位作業場所における測定点の数を5未満とすることができる。
