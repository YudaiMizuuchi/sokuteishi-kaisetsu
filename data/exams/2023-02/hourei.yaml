  - 法令に基づき局所排気装置に設ける除じん装置は、粉じんの種類がヒュームである場合は、スクラバによる除じん方式による除じん装置としなければならない。
  - 常時特定粉じん作業が行われる屋内作業場については、6か月以内ごとに1回、定期に、当該作業場における空気中の粉じんの濃度を測定し、その都度、所定の事項を記録して、これを7年間保存しなければならない。
