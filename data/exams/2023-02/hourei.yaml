  choices:
  - 法令で定める業種に属する事業場においては、新たに職務に就くこととなった職長に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 労働者の作業内容を変更したときは、その労働者に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
