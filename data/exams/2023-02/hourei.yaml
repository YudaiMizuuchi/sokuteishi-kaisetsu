  stem: 作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 気温が 28 ℃ をこえ、又はこえるおそれのある坑内の作業場については、半月以内ごとに1回、定期に当該作業場における気温を測定しなければならない。
  - 動力によりチェーン等を用いてドラムかんを洗浄する業務を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 海水が滞留している暗きょの内部における作業に係る作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。
  - 熱源を用いる乾燥室により物を乾燥する業務を行う屋内作業場については、半月以内ごとに1回、定期に当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  answer: 4
  choice_notes: []
  explanation: '熱源を用いる乾燥室での乾燥の業務を行う屋内作業場では、気温と湿度を測定しますが、ふく射熱の測定は求められていません。選択肢4は誤りです。


    令和6年度第2回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 熱源を用いる乾燥室により物を乾燥する業務を行う屋内作業場については、半月以内ごとに1回、定期に当該屋内作業場における気温、湿度及びふく射熱を測定しなければならな
