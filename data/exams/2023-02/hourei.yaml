  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 雇入時の健康診断の結果については、使用する労働者数にかかわらず、所轄労働基準監督署長に報告する必要はない。
  - 医師による定期健康診断を行ったときは、使用する労働者数にかかわらず、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
