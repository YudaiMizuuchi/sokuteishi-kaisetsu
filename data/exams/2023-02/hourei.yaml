  stem: 電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。ただし、放射線業務従事者は、緊急作業には従事しないものとし、また、被ばく限度に関する経過措置の適用はないものとする。
  choices:
  - 管理区域内において男性の放射線業務従事者の受ける実効線量は、5年間につき 100 mSv を超えず、かつ、1年間につき 50 mSv を超えないようにしなければならない。
  - 放射線業務に常時従事する労働者で管理区域に立ち入るものに対し、雇入れ又は当該業務に配置替えの際及びその後6か月以内ごとに1回、定期に、所定の項目について医師による健康診断を行わなければならない。
  - 放射線業務従事者の皮膚に受ける等価線量については、1年間につき500 mSv を超えないようにしなければならない。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分については、原則として、3か月以内ごとに1回、定期に外部放射線による線量当量率又は線量当量を測定しなければならない。
  - 放射線業務従事者が眼の水晶体に受ける等価線量は、5年間につき100 mSv 及び1年間につき 50 mSv を超えないようにしなければならない。
