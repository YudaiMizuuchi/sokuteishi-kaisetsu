  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 雇入時の健康診断において、医師による健康診断を受けた後3か月を経過しない者が、その健康診断結果を証明する書面を提出したときは、その健康診断の項目については省略することができる。
  - 定期健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 定期健康診断における45歳未満の者(35歳及び40歳の者を除く。)についての聴力の検査は、1000ヘルツ及び4000ヘルツの音に係る聴力の検査に代えて医師が適当と認める聴力の検査を実施することができる。
  - 深夜業を含む業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、法令で定める健康診断を行わなければならないが、胸部エックス線検査については、1年以内ごとに1回、定期に行えばよい。
  - 定期健康診断を行ったときは、事業場の規模にかかわらず、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  answer: 5
  choice_notes: []
  explanation: 定期健康診断の結果報告書の提出が必要なのは、常時**50人以上**の労働者を使用する事業場です。「事業場の規模にかかわらず」とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 定期健康診断を行ったときは、事業場の規模にかかわらず、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
