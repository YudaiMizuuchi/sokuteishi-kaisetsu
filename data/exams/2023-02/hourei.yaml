  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定と B 測定を行った場合、B 測定値が A 測定の第1評価値の1.5倍を超えている単位作業場所の管理区分は、第3管理区分である。
  - A 測定の第2評価値が管理濃度を超える単位作業場所の管理区分は、B測定の測定値に関係なく、第3管理区分である。
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - 2種類の有機溶剤を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を当該測定点における測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - 遊離けい酸を含まない鉱物性粉じんの管理濃度は、3.0 mg/m³ である。
  answer: 1
  choice_notes: []
  explanation: B 測定値が**管理濃度**の1.5倍を超えれば第3管理区分です。比べる相手は第1評価値ではないので、選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: A測定とB測定を行った場合、B測定値がA測定の第1評価値の1.5倍を超えている単位作業場所の管理区分は、第3管理区分である。
