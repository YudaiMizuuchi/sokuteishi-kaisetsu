  stem: '拡散チューブを用い一定濃度の標準ガスを発生させるとき、チューブの選定に必要となる定常状態で拡散チューブから流出する標準物質の流出速度は、あらかじめ次の式により推定することができる。


    この標準ガス発生法に関する以下の記述のうち、誤っているものはどれか。


    m=DS/L(C-C<sub>l</sub>)


    ただし、C\gg C<sub>l</sub>なのでC<sub>l</sub>=0として計算して良い。


    m：流出速度（ng・s⁻¹）


    D：拡散係数


    S：拡散チューブの断面積（cm²）


    L：拡散チューブの長さ（cm）


    C：液だめ内の蒸気濃度（ng・cm⁻³）


    C<sub>l</sub>：拡散チューブ出口の蒸気濃度（ng・cm⁻³）'
  choices:
  - 流出速度は、拡散チューブの断面積に比例する。
  - 流出速度は、拡散チューブの長さに反比例する。
  - 流出速度の計算には、標準物質の蒸気圧の値が必要である。
  - 拡散係数の次元は、体積/時間である。
  - 拡散係数は、物質によって異なる。
