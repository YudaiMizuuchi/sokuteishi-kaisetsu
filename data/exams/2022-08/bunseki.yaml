  stem: フレーム原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 原子蒸気は、その原子に固有の波長の光を吸収する。
  - フレーム中における目的原子の原子蒸気は、ほとんどが基底状態にある。
  - 吸光度は、光源光がフレーム中を通過する位置に影響される。
  - 吸光度は、光源光の強度に比例する。
  - 中空陰極ランプの陰極には、測定対象金属と同一の金属、又はこの金属を含む合金が用いられる。
