    フレーム中の原子はほとんどが基底状態で（選択肢2）、その原子に固有の波長の光を吸収します（選択肢1）。光源光がフレームを通る位置で原子の量が違うので、吸光度は通る位置に影響されます（選択肢3）。中空陰極ランプの陰極には、測定対象と同じ金属か、それを含む合金を使います（選択肢5）。'
