    ただし、物理量1及び物理量2の測定値の標準偏差をそれぞれσ₁及びσ₂とする。'
  choices:
  - '|σ₁-σ₂|'
  - √(σ<sub>1</sub>² ＋ σ<sub>2</sub>²)
  - σ₁+σ₂
  - √(|σ<sub>1</sub>² ＋ σ<sub>2</sub>²|)
  - √(σ<sub>1</sub> × σ<sub>2</sub>)
  columns: null
  answer: 2
  choice_notes: []
  explanation: '互いに独立な2つの量の差（または和）の標準偏差は、それぞれの標準偏差を2乗して足し、平方根をとった √(σ₁² ＋ σ₂²) です。よって（2）が正しい式です。


    ばらつきは打ち消し合わないので、差をとっても分散（標準偏差の2乗）は足し算になります。「差だから引き算」と考えて |σ₁ − σ₂| を選ばないようにしましょう。'
