  - ㋑ ㋥
  - ㋺ ㋩
  - ㋺ ㋥
  - ㋩ ㋥
  columns: null
  answer: 4
  choice_notes: []
  explanation: '検量線は、濃度と吸光度の関係を表す直線で、傾きは、ランベルト・ベールの法則 A ＝ ε・c・l から、**ε・l**（モル吸光係数 × セルの光路長）です。したがって、検量線の傾きに関係があるのは、**㋺ セルの光路長**と、**㋥ 測定物質のモル吸光係数**です。よって（4）です。


    光源の光の強度は、吸光度（入射光と透過光の比）には影響しません。発色試薬の濃度は、十分に過剰であれば、傾きに影響しません。'
