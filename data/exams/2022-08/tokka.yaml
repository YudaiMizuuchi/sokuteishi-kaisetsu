  choice_notes: []
  explanation: '各物質の構造式を、図と照らし合わせます。


    - 3 p-ジメチルアミノアゾベンゼン：アゾ基（−N＝N−）でつないだ2つのベンゼン環の一方に、**ジメチルアミノ基（−N(CH₃)₂）**がついた構造です。図の3は、一方のベンゼン環に、**アミノ基（−NH₂）とメチル基2個**がついた別の物質（アミノアゾ化合物）で、組合せは誤りです。

    - 1 アクリロニトリル（CH₂＝CH−C≡N）、2 クロロメチルメチルエーテル（CH₃−O−CH₂Cl）、4 o-トルイジン（ベンゼン環に隣り合ってNH₂とCH₃）、5 β-プロピオラクトン（四員環のラクトン）は、正しい組合せです。


    よって（3）です。'
