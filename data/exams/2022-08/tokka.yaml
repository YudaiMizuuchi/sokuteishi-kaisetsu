  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 分配クロマトグラフ法に用いる固定相の性質は、担体表面に存在する官能基で決まる。
  - イオン交換クロマトグラフ法では、移動相のpHやイオン強度が分離効率に大きく影響する。
  - 移動相として用いる溶液は、化学的に安定で、粘度の高いものを選ぶ。
  - 汎用的な分離カラムは、内径1～8 mm、長さ15～30 cmである。
  - 移動相は、通常0.1～5 mL・min⁻¹の一定流量とする。
