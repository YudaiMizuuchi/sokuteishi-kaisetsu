  explanation: '**アクリルアミド**は、粒子と蒸気の両方で存在するので、**ガラス繊維ろ紙（ろ過捕集）と活性炭フェルト（固体捕集）**を組み合わせた**相補型ろ過捕集法**で捕集します。よって（2）です。


