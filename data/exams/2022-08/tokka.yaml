  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 分配クロマトグラフ法に用いる固定相の性質は、担体表面に存在する官能基で決まる。
  - イオン交換クロマトグラフ法では、移動相のpHやイオン強度が分離効率に大きく影響する。
  - 移動相として用いる溶液は、化学的に安定で、粘度の高いものを選ぶ。
  - 汎用的な分離カラムは、内径1～8 mm、長さ15～30 cmである。
  - 移動相は、通常0.1～5 mL・min⁻¹の一定流量とする。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '高速液体クロマトグラフ分析法で、移動相に使う溶液は、化学的に安定で、**粘度の低い**ものを選びます。粘度が高いと、カラム圧が高くなります。「粘度の高いものを選ぶ」とする選択肢3は誤りです。


    分配クロマトグラフ法の固定相の性質は、担体表面の官能基で決まります。イオン交換クロマトグラフ法では、移動相のpHやイオン強度が分離効率に大きく影響します。汎用的な分離カラムは、内径1〜8 mm、長さ15〜30 cmで、移動相は、通常0.1〜5 mL/minの一定流量とします。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
