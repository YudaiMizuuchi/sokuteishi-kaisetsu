  stem: '吸光光度分析法における次の㋑から㋥までの項目のうち、検量線の傾きに関係があるものの組合せは下のうちどれか。


    ㋑　光源の光の強度


    ㋺　セルの光路長


    ㋩　発色試薬の濃度


    ㋥　測定物質のモル吸光係数'
  choices:
