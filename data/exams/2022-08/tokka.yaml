  stem: 試料溶液中のベンゼン濃度の測定をガスクロマトグラフ分析法で行い、ベンゼンのピーク面積4.0×10⁴を得た。この溶液4.0 mLと、ベンゼン濃度15 µg・mL⁻¹の標準溶液2.0 mLを混合し、同様に分析したところ、ベンゼンのピーク面積は6.0×10⁴であった。試料溶液中のベンゼン濃度として、正しい値は次のうちどれか。
  choices:
  - 1.0 µg・mL⁻¹
  - 2.0 µg・mL⁻¹
  - 4.0 µg・mL⁻¹
  - 6.0 µg・mL⁻¹
  - 8.0 µg・mL⁻¹
  columns: null
  answer: 4
  choice_notes: []
  explanation: '標準添加法の考え方で計算します。ピーク面積は、濃度に比例します。


    試料溶液のベンゼン濃度をx µg/mLとすると、混合溶液（試料4.0 mL ＋ 標準溶液2.0 mL ＝ 6.0 mL）の濃度は、（4.0x ＋ 2.0 × 15）／6.0 µg/mL です。


    試料溶液のピーク面積が 4.0 × 10⁴ で、混合溶液が 6.0 × 10⁴ なので、面積比は 1.5 倍です。


    （4.0x ＋ 30）／6.0 ＝ 1.5x

    4.0x ＋ 30 ＝ 9.0x

    x ＝ **6.0 µg/mL**


    よって（4）です。'
