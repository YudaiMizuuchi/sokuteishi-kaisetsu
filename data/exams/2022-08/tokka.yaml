  rank: null
  stem: '液体捕集法を用いて環境空気試料を捕集する際の、必要最小吸引空気量Q（L）を求める次の式中のA、B、Cが表すものの組合せとして、正しいものは下のうちどれか。


    ただし、単位は次のとおりとする。


    吸引流量（L・min⁻¹）


    捕集時間（min）


    捕集液の量（mL）


    最終試料液の総量（mL）


    検出下限濃度（µg・mL⁻¹）


    定量下限濃度（µg・mL⁻¹）


    管理濃度（mg・m⁻³）


    Q=(A× B)/(C×管理濃度)'
  choices:
  - 吸引流量 ／ 捕集時間 ／ 0.01
  - 吸引流量 ／ 捕集液の量 ／ 0.1
  - 定量下限濃度 ／ 最終試料液の総量 ／ 0.1
  - 定量下限濃度 ／ 捕集時間 ／ 0.01
  - 検出下限濃度 ／ 最終試料液の総量 ／ 0.1
  columns:
  - Ⓐ
  - Ⓑ
  - Ⓒ
  answer: 3
  choice_notes: []
  explanation: '液体捕集法で、測定に必要な最小の吸引空気量 Q（L）は、次の式で求めます。


    Q ＝（定量下限濃度 × 最終試料液の総量）／（0.1 × 管理濃度）


    - A：定量下限濃度（µg/mL）

    - B：最終試料液の総量（mL）

    - C：0.1（管理濃度の1/10）


    管理濃度の1/10の濃度まで測れるように、必要な空気量を求めます。よって（3）です。'
