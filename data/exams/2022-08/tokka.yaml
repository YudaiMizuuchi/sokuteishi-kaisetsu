  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 光電子増倍管は、光の強度を電気信号に変換し、増幅する。
  - 試料溶液に照射する光は、単色光である。
  - 試料液を透過した光の強さは、試料液の濃度に比例する。
  - ガラス製のセルは、可視部の吸収の測定に用いる。
  - 着色液は、時間の経過とともに退色することがある。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '吸光光度分析法で、試料液を透過した光の強さ（透過光強度）は、試料液の濃度が増えると、**指数関数的に減少**します。濃度に比例するのは、透過光の強さではなく、**吸光度**です。「透過した光の強さは、試料液の濃度に比例する」とする選択肢3は誤りです。


    光電子増倍管は、光の強度を電気信号に変換して増幅します。試料に照射する光は単色光です。ガラス製のセルは、可視部の測定に使います。着色液は、時間の経過とともに退色することがあります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
