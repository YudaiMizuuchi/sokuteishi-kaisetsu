  stem: 正規分布、対数正規分布及び作業環境中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 正規分布の平均値と標準偏差とは同じ次元を持つ。
  - 正規分布では、平均値と標準偏差は互いに従属している。
  - 横軸を変数の対数変換値とし、縦軸を確率密度とすると、対数正規分布の曲線の形は、幾何平均の対数変換値を中心として左右対称になる。
  - 一般に、環境中の有害物質の濃度の算術平均値が高くなるにしたがって、濃度の標準偏差も大きくなる。
  - 正規分布の算術平均と標準偏差をそれぞれμ、σとすると、この分布に従う変数がμ-2σからμ+2σの範囲に入る確率は、およそ95%である。
