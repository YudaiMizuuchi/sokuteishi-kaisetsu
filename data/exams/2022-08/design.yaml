  explanation: '第1評価値は、単位作業場所の気中濃度の分布のうち**上側5％の値**の推定値です。「算術平均値の推定値」とする選択肢4は誤りです。算術平均濃度の推定値は第2評価値です。


    第1評価値は第2評価値より大きくなるのが一般的で（選択肢3）、第1評価値が管理濃度より小さければ、管理濃度を超える確率は5％未満です（選択肢5）。A 測定値の全てが管理濃度を超えれば第3管理区分（選択肢1）、B 測定値が管理濃度の1.5倍ちょうどなら「1.5倍を超える」に当たらないので第2管理区分です（選択肢2）。


