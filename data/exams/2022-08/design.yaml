  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点は、床上50 cm以上150 cm以下の高さとする。
  - 単位作業場所の広さが、おおむね30 m²以下の場合は、著しく狭い単位作業場所と見なすことができる。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下であることが明らかなときは、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 単位作業場所が著しく狭く、かつ単位作業場所における空気中の粉じんの濃度がほぼ均一であることが明らかなときは、測定値の総数を5未満とすることができる。
  - 測定点と測定点の間隔は、6 mを超えない等間隔であれば、縦方向と横方向は異なってもよい。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '単位作業場所が著しく狭く、かつ濃度がほぼ均一であることが明らかなときに5未満にできるのは、**測定点の数**です。「測定値の総数」を5未満にできるとする選択肢4は誤りです。


    測定点を5未満にした場合でも、同じ測定点で繰り返し測定して、測定値の総数は5以上とします。測定点は床上 50 cm 以上 150 cm 以下（選択肢1）、間隔は 6 m 以下の等間隔であれば縦横で違ってもよく（選択肢5）、幾何標準偏差がおおむね 1.2 以下なら濃度はほぼ均一とみなせます（選択肢3）。


    根拠：作業環境測定基準第2条第1項第1号・第1号の2。'
