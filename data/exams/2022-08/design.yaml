  - A測定値の第1評価値が管理濃度を超えておらず、B測定の測定値が管理濃度の1.5倍であった場合の管理区分は、第2管理区分となる。
  - A測定の第1評価値は、一般に、第2評価値より大きくなる。
  - A測定の第1評価値は、気中有害物質濃度の算術平均値の推定値である。
  - A測定の第1評価値が管理濃度より小さい単位作業場所内の気中有害物質濃度が管理濃度を超える確率は、5%未満である。
