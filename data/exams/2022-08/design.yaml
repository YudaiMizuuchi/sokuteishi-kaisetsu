  - 有機溶剤の管理濃度は、質量濃度として示されている。
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が大きいほど小さな値となる。
  - 空気中の有機溶剤の体積分率1%は、10,000 ppmに相当する。
  - 空気中の石綿の濃度は、繊維数濃度として表される。
