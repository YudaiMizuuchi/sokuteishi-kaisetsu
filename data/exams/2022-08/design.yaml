  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 初めての測定で、有害物の濃度分布等が予測できなかったので、当該作業場における労働者の行動範囲を単位作業場所の範囲とした。
  - 単位作業場所の区域は、著しい濃度変動がないか、濃度変動があってもランダムであるような範囲とする。
  - 単位作業場所の設定に当たっては、作業場の区域を、労働者の行動範囲、有害物質の分布状況などの判断基準によって層別化を行う。
  - クロム酸鉛を取り扱っている作業場において、同一の区域をクロム酸と鉛とで別々の単位作業場所として設定した。
  - 単位作業場所内の測定点は、隣接する他の単位作業場所の測定点と重複してはならない。
