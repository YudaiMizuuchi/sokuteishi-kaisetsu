  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 捕集装置とポンプの間に接続した面積式流量計では、捕集装置の圧力損失が大きくなるにしたがって、流量計の指示値は真の流量より大きくなる。
  - 流量計の指示が脈動して読み取りが難しい場合は、流量計と吸引ポンプの間に空気だめを設けるとよい。
  - 湿式ガスメーターを用いて流量計の校正を行う場合には、湿式ガスメーターは、ポンプより上流側に接続する。
  - ハイボリウムエアサンプラーの流量計の校正には、ルーツメータによって校正された絞り式（オリフィス）流量計を用いることができる。
  - 面積式流量計は、テーパー管内の浮子が停止したとき、浮子とテーパー管の間隙の面積とそこを流れている流量とが比例することを利用している。
