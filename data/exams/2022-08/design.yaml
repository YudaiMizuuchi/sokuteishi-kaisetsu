  rank: null
  stem: 指定作業場における次の作業環境測定のうち、個人サンプリング法による測定（C・D測定）の対象でないものはどれか。
  choices:
  - 労働者が作業場内を移動しながら、イソプロピルアルコールを含有する塗型剤を鋳型に塗布する作業を行う単位作業場所におけるイソプロピルアルコールの濃度の測定
  - 労働者が作業場内を移動しながら、エチルベンゼンを含有する塗料を用いて、吹付塗装作業を行う単位作業場所におけるエチルベンゼンの濃度の測定
  - 労働者がトリクロロエチレンの洗浄槽で金属部品の脱脂作業を行う単位作業場所におけるトリクロロエチレンの濃度の測定
  - 鉛蓄電池を製造する工程において、鉛等を溶融する作業を行う単位作業場所における鉛の濃度の測定
  - クロムメッキを行う工程において、クロム酸ミストが発生する単位作業場所におけるクロム酸及びその塩の濃度の測定
  columns: null
  answer: 3
  choice_notes: []
  explanation: '個人サンプリング法（C・D 測定）は、労働者が作業場内を移動しながら作業して、発散源の場所が一定しない作業などを対象とします。トリクロロエチレンの**洗浄槽**で脱脂する作業は、発散源の位置が固定されているので、この試験の時点では対象でなく、A・B 測定で測ります。よって答えは（3）です。


    移動しながらの塗布・吹付塗装（選択肢1・2）、鉛の溶融（選択肢4）、クロム酸及びその塩（選択肢5）は、いずれも個人サンプリング法の対象です。


