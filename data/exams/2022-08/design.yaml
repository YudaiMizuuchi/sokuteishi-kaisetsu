  stem: 作業環境測定における有害物質の空気中の濃度、管理濃度等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中における有害物質の濃度は、通常、25℃、1気圧の条件下における環境空気中濃度として表される。
  - 有機溶剤の管理濃度は、質量濃度として示されている。
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が大きいほど小さな値となる。
  - 空気中の有機溶剤の体積分率1%は、10,000 ppmに相当する。
  - 空気中の石綿の濃度は、繊維数濃度として表される。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '有機溶剤の管理濃度は、質量濃度（mg/m³）ではなく、**体積分率（ppm）**で示されています。選択肢2は誤りです。


    ガス・蒸気は ppm、鉱物性粉じんなどの粒子は mg/m³、石綿のような繊維は本/cm³（繊維数濃度）と、物質の状態で単位が決まっています。鉱物性粉じんの管理濃度は E ＝ 3.0 ÷ (1.19Q ＋ 1)（Q は遊離けい酸の含有率 ％）なので、含有率が大きいほど小さな値になります（選択肢3は正しい）。1 ％ は 10,000 ppm です（選択肢4は正しい）。'
