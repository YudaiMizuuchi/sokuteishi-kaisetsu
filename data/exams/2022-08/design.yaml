  stem: 個人サンプリング法による測定（C・D測定）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - C測定の試料空気の採取等の時間は、各労働者の作業時間の全てとするが、作業時間が2時間を超える場合であって、測定対象物質の濃度がほぼ均一であることが明らかなときは、2時間まで短縮することができる。
  - C測定において、作業に従事する労働者数が5人を下回る場合は、1人の労働者の作業時間を均等に分割し、試料空気の採取等を行うことにより、分割した数と同数の労働者が個人サンプラーを装着したものとみなすことができる。
  - C測定において、作業に従事する労働者数が5人を下回る場合は、1人の労働者に複数の個人サンプラーを装着し、同時に試料空気の採取等を行うことにより、装着した個人サンプラーの数と同数の労働者が個人サンプラーを装着したものとみなすことができる。
  - C測定に係る個人サンプラーを装着する労働者とD測定に係る個人サンプラーを装着する労働者を同一の労働者とすることができるが、その場合は、C測定用とD測定用の2つの個人サンプラーを装着する必要がある。
  - D測定の対象となる作業が行われる単位作業場所であって、その労働者が作業に従事する時間が15分未満である場合、個人サンプリング法による測定を行うことはできない。
