    個人のばく露を測るのは、個人サンプリング法の D 測定です。B 測定は、複数の候補位置があれば全てで測って最大値を測定値とし（選択肢4）、相対濃度計で行うときは A 測定の質量濃度変換係数を使います（選択肢2）。'
