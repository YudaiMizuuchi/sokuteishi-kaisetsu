  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 直接捕集法において、真空捕集瓶5本を用いても捕集時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて捕集したそれぞれの真空捕集瓶内の有害物質の濃度の算術平均値を測定値とする。
  - 相対濃度指示方法を用いてB測定を行う場合の質量濃度変換係数は、その単位作業場所で行われたA測定の質量濃度変換係数を用いる。
  - B測定は短時間高濃度の個人ばく露の評価のために行う。
  - 最大濃度を示す可能性のある作業位置が複数あって、どの作業位置で最大濃度になるか予測できない場合には、それらのすべての作業位置で測定を行い、最大の測定値をB測定の測定値とする。
  - 光散乱方式の相対濃度計を用いてB測定を行う場合には、10分間連続して作動させる。
  columns: null
