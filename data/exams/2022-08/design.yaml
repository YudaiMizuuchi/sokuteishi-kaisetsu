    単位作業場所は物質ごとに設定するので、区域や測定点が重なることがあります。クロム酸鉛のように、1つの物質から2種類の測定対象物（クロム酸と鉛）が出る場合は、同じ区域でもそれぞれ別の単位作業場所とします（選択肢4は正しい）。濃度分布が予測できない初めての測定では、労働者の行動範囲を単位作業場所とします（選択肢1は正しい）。'
