  stem: 温熱環境及び人体の適応等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 熱中症は、高温多湿な環境下において、体内の水分及びナトリウム等の塩分のバランスが崩れたり、体内の調整機能が破綻するなどして、発症する障害の総称である。
  - 日射がある場合のWBGT値は、次の式で求められる。　WBGT値 = 0.7×自然湿球温度 + 0.2×黒球温度 + 0.1×乾球温度
  - 熱へのばく露が中断すると、4日程度で順化の顕著な喪失が始まり、3～4週間後には熱への順化は完全に失われる。
  - WBGT基準値は、同一作業であっても、熱に順化していない人では、熱に順化している人より小さい値となる。
  - 高温環境下での熱けいれんは、水分の摂取不足によって起こる。
