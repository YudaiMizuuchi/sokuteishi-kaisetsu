  stem: 厚生労働省の「労働者の心の健康の保持増進のための指針」に基づくメンタルヘルスケアの実施に関する次の記述のうち、不適切なものはどれか。
  choices:
  - 心の健康については、客観的な測定方法が十分確立しておらず、また、心の健康問題の発生過程には個人差が大きく、そのプロセスの把握が難しいという特性がある。
  - 労働者の心の健康は、職場配置、人事異動、職場の組織等の要因によって影響を受けるため、メンタルヘルスケアは、人事労務管理と連携しなければ、適切に進まない場合が多いことに留意する。
  - メンタルヘルスケアは、「セルフケア」、「ラインによるケア」、「家族によるケア」及び「事業場外資源によるケア」の「4つのケア」が継続的かつ計画的に行われることが重要である。
  - 労働者の心の健康は、職場のストレス要因のみならず、家庭・個人生活等の職場外のストレス要因の影響を受けている場合も多いことに留意する。
  - メンタルヘルスケアを推進するに当たって、労働者の個人情報を主治医等の医療職や家族から取得する際には、あらかじめこれらの情報を取得する目的を労働者に明らかにして承諾を得るとともに、これらの情報は労働者本人から提出を受けることが望ましい。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'メンタルヘルスケアの「4つのケア」は、「セルフケア」「ラインによるケア」「事業場内産業保健スタッフ等によるケア」「事業場外資源によるケア」です。「家族によるケア」は含まれないので、選択肢3は不適切です。


    心の健康は客観的な測定方法が十分に確立していないこと（選択肢1）、職場配置や人事異動などの影響を受けるので人事労務管理との連携が必要なこと（選択肢2）、職場外のストレス要因の影響も受けること（選択肢4）は、指針の考え方です。主治医などから個人情報を取得するときは、目的をあらかじめ労働者に明らかにします（選択肢5）。'
