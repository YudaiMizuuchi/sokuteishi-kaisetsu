  stem: 電離放射線及びその生体影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 白血病は、晩発障害に分類される確率的影響である。
  - 遺伝的影響には、影響を起こす被ばく線量に一定のしきい値がある。
  - X線とγ線は、エネルギーの大小ではなく、その発生過程の違いによって区別される。
  - β線とγ線では、γ線の方が透過力が大きい。
  - 放射線宿酔は、急性影響であり、かつ、確定的影響である。
  columns: null
  answer: 2
