    許容濃度は、ばく露濃度の変動があまり大きくない場合に利用され（選択肢1）、経皮吸収がないことを前提に定められた数値です（選択肢3）。鉱物性粉じんの管理濃度は遊離けい酸の含有率で変わり（選択肢4）、測定対象物質の中には管理濃度が定められていないものもあります（選択肢5）。'
