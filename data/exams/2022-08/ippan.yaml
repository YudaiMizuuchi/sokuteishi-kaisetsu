  stem: 作業環境評価基準に定める「管理濃度」及び日本産業衛生学会の「許容濃度等の勧告」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 許容濃度は、作業中のばく露濃度の変動があまり大きくない場合に利用される。
  - 許容濃度等の勧告において、ヒトに対する発がん性については、第1群、第2群A、第2群B及び第3群の4種類に分類されている。
  - 許容濃度の数値は、経皮吸収がないことを前提として定められたものである。
  - 鉱物性粉じんの管理濃度は、遊離けい酸の含有率により異なる。
  - 測定対象物質の中には、管理濃度が定められていない物質がある。
  columns: null
