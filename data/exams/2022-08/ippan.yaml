  explanation: '電離放射線の影響のうち、**遺伝的影響**は、しきい値のない確率的影響です。「一定のしきい値がある」とする選択肢2は誤りです。


    白血病は、晩発障害に分類される確率的影響です（選択肢1）。X線とγ線は、エネルギーの大小ではなく、発生過程の違い（原子核の外からか、原子核からか）で区別されます（選択肢3）。透過力はγ線のほうがβ線より大きく（選択肢4）、放射線宿酔は急性影響であり、かつ、確定的影響です（選択肢5）。


    （参考：環境省「放射線による健康影響等に関する統一的な基礎資料」。確率的影響は、がん・白血病・遺伝性影響などで、しきい線量がないと仮定して管理します。確定的影響は、脱毛・白内障・皮膚障害・不妊などで、しきい線量があります。）'
