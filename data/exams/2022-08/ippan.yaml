  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 膵臓から分泌されるインスリンは、主として血糖値を調節する作用があり、不足すると血糖値が高くなる。
  - ベンゼンの生物学的モニタリングの指標として、尿中のフェノールの濃度がある。
  - スチレンは、代謝されて、尿中にマンデル酸が排泄される。
  - トリクロロエチレンの生物学的モニタリングの指標として、尿中のフェニルグリオキシル酸の濃度がある。
  - N,N-ジメチルホルムアミドの生物学的モニタリングの指標として、尿中のN-メチルホルムアミドの濃度がある。
