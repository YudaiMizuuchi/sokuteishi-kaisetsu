  - 配置前の健康診断においては、自覚症状の有無の調査として、眼疲労を主とする視器に関する症状のほか、ストレスに関する症状なども調査する。
  - 配置前の健康診断において視力検査として、遠見視力及び近見視力の検査を行う。
