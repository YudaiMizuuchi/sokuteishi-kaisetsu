  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 災害の発生可能性と重篤度を組み合わせた概念であるリスクの見積りは、双方を一定の尺度により数値化した後、それらを加算ではなく乗算して行う必要がある。
  - 対象の業務について作業環境測定により測定した作業場所における化学物質等の気中濃度等を、当該化学物質等のばく露限界と比較することによってリスクを見積もることができる。
  - 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。
  - 個人用保護具の使用によるばく露低減対策は、機械設備の密閉化等の衛生工学的対策、マニュアルの整備等管理的対策等、より優先順位の高い対策を講じても十分にリスクを低減できない場合に行うべき対策である。
  - 「危険性又は有害性」とは、労働者に負傷又は疾病を生じさせる潜在的な根源であり、ハザードともいわれる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: 'リスクの見積りで発生可能性と重篤度を数値化する場合は、それらを**加算又は乗算等**してリスクを見積もります。「加算ではなく乗算して行う必要がある」とする選択肢1は誤りです。


    指針は、リスクの見積りの方法として、リスクを割り付けた表を使う方法、数値化して加算又は乗算する方法、段階的に分岐していく方法、コントロール・バンディングなどを示しています。ばく露の程度が濃度基準値やばく露限界を十分に下回ることが確認できれば、追加のリスク低減措置は検討しなくてよく（選択肢3）、保護具の使用は、代替・工学的対策・管理的対策を講じても十分にリスクを低減できないときの最後の対策です（選択肢4）。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(1)ア(イ)、同イ(ウ)、10(1)。'
