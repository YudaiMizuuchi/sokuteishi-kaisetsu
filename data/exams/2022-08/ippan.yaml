  stem: 職場における健康障害及びその要因等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ノロウイルスによる食中毒は、ウイルスに汚染された食品等を摂取することで発症し、主として冬季に発生する。
  - 窒素は、無色、無臭の気体であるが、高気圧作業においては麻酔作用などが現れる。
  - 人間の地上における呼気中には、酸素が約16%、二酸化炭素が約4%含まれている。
  - 吸入空気中の二酸化炭素の濃度が高くなり、体内に蓄積が起こると、呼吸中枢が刺激され、呼吸が速く深くなる。
  - サルモネラ菌は、腸内で毒素（エンテロトキシン）を産生し、毒素型食中毒を引き起こす。
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'サルモネラ菌による食中毒は、菌が増えた食品を食べ、腸内で菌が増えて起こる**感染型**の食中毒です。毒素型は、食品の中で毒素ができる食物内毒素型（ボツリヌス菌、黄色ブドウ球菌など）と、腸内で毒素をつくる生体内毒素型（ウェルシュ菌、腸管出血性大腸菌など）に分かれます。サルモネラ属菌は感染型なので、選択肢5は誤りです。


    （参考：厚生労働省「食中毒原因物質の分類」）


    ノロウイルスによる食中毒は、主として冬季に発生します（選択肢1）。窒素は高気圧作業で麻酔作用を示し（選択肢2）、地上の呼気中には酸素が約 16 ％、二酸化炭素が約 4 ％含まれます（選択肢3）。吸入空気中の二酸化炭素の濃度が高くなると、呼吸中枢が刺激されて呼吸が速く深くなります（選択肢4）。'
