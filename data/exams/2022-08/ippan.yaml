  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒子状物質の沈降速度は、粒径に比例する。
  - 同一鉱物の粉じんでも、粒径により遊離けい酸の含有率が異なることがある。
  - ヒュームの一次粒子の粒径は、一般に、1 µm以下である。
  - じん肺の合併症としては、肺結核、続発性気管支炎、原発性肺がんなどがある。
  - 石綿粉じんへの長期間ばく露により、胸膜プラークが生じる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '粒子の沈降速度は、粒径に**比例**するのではなく、粒径の**2乗に比例**します（ストークスの法則）。選択肢1は誤りです。


    同じ鉱物の粉じんでも、粒径によって遊離けい酸の含有率が違うことがあります（選択肢2）。ヒュームの一次粒子は 1 µm 以下（選択肢3）、じん肺の合併症には肺結核・続発性気管支炎・原発性肺がんなどがあり（選択肢4）、石綿への長期間のばく露で胸膜プラークができます（選択肢5）。'
