  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - ジクロロメタンについては、有機ガス用防毒マスクの吸収缶の破過時間は、試験用ガスに比べて著しく短くなる。
  - 酸性ガス用防毒マスクの吸収缶の色は灰色である。
  - 臭気を感知できる濃度がばく露限界濃度より著しく低い物質に限って、吸収缶の交換時期を臭気を感知した時点とすることができる。
  - 一酸化炭素用防毒マスクは、吸収缶に充填された活性炭により、一酸化炭素を吸着して取り除く。
  - 隔離式防毒マスクは、直結式防毒マスクより使用できる環境空気中の対象ガス濃度の範囲が広い。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '一酸化炭素用の防毒マスクの吸収缶は、**触媒**（ホプカライトなど）で一酸化炭素を酸化して無害にします。活性炭で吸着するのではないので、選択肢4は誤りです。


    ジクロロメタンでは、有機ガス用吸収缶の破過時間が試験用ガスより著しく短くなります（選択肢1）。酸性ガス用吸収缶の色は灰色（選択肢2）、臭気を感知できる濃度がばく露限界濃度より著しく低い物質に限って、臭気を感知した時点を交換時期にできます（選択肢3）。隔離式は、直結式より使える対象ガスの濃度の範囲が広くなります（選択肢5）。'
  figures: []
  law_note: 令和5年5月25日の通達（基発0525第3号）で、吸収缶の破過を知るために、有毒ガス等の臭いに頼るのは適切ではないとされました（第3の2(1)ウ）。あわせて、旧通達（平成17年の防毒マスク通達）は廃止されています。この問題は旧通達のもとでの出題で、『臭気を感知できる濃度がばく露限界濃度より著しく低い物質に限り、臭気を感知した時点を交換時期にできる』という記述を、正しいものとして扱っています。現行の通達では、臭いで交換時期を決めず、取扱説明書・破過曲線図・使用時間記録カードなどにもとづいて、使用限度時間をあらかじめ設定し、その時間を限度に使います（同2(1)ア・イ）。
