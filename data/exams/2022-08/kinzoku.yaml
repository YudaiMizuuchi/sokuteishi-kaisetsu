  stem: '金属の分析に用いられる次の㋑から㋥までの試薬とその化学式のうち、化学式が誤っているものの組合せは下のうちどれか。


    ㋑　過マンガン酸カリウム　KMnO₃


    ㋺　リン酸　H₃PO₄


    ㋩　硫酸アンモニウム　(NH₃)₂SO₄


    ㋥　臭素酸カリウム　KBrO₃'
  choices:
  - ㋑ ㋺
  - ㋑ ㋩
  - ㋺ ㋩
  - ㋺ ㋥
  - ㋩ ㋥
  columns: null
  answer: 2
  choice_notes: []
  explanation: '試薬の化学式を確認します。


    - ㋑ 過マンガン酸カリウム：正しくは **KMnO₄** です（KMnO₃ではありません）。

    - ㋺ リン酸：H₃PO₄ で正しいです。

    - ㋩ 硫酸アンモニウム：正しくは **(NH₄)₂SO₄** です（(NH₃)₂SO₄ ではありません）。

    - ㋥ 臭素酸カリウム：KBrO₃ で正しいです。


    化学式が誤っているのは、㋑と㋩で、（2）です。'
