  stem: 誘導結合プラズマ発光分光分析法（ICP-AES）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 物理干渉が発生する要因としては、試料液の酸濃度や塩の濃度などがあり、補正には一般的に内標準法が用いられる。
  - アルゴンプラズマの温度は、フレーム原子吸光の空気-アセチレン炎の温度よりも高温である。
  - 分析には、励起状態の中性原子の発光のみを利用する。
  - 多元素同時分析が可能である。
  - プラズマの測光方式には、ラジアル（径方向）測光とアクシャル（軸方向）測光がある。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'ICP-AES法では、**励起状態の中性原子と、イオン（励起状態のイオン）**の発光を利用します。「励起状態の中性原子の発光のみを利用する」とする選択肢3は誤りです。


    物理干渉は、試料液の酸濃度や塩濃度などで生じ、内標準法で補正します。アルゴンプラズマの温度は、空気-アセチレン炎より高温です。多元素の同時分析ができ、測光方式には、ラジアル（径方向）とアキシャル（軸方向）があります。


    （参考：『作業環境測定ガイドブック4 金属類 物質別各論』）'
