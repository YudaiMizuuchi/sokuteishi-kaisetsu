  - カドミウムは、遷移元素である。
  - ベリリウムは、軽金属元素である。
  - 水銀は、常温で液体である。
  - 鉛は、両性金属である。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'カドミウムは、周期表の12族の元素で、d軌道が満たされているため、IUPACの定義では**遷移元素に含めません**（典型元素として扱われます）。「カドミウムは、遷移元素である」とする選択肢2は誤りです。


    ヒ素は典型元素、ベリリウムは軽金属元素です。水銀は、常温で唯一の液体の金属です。鉛は、酸にもアルカリにも溶ける両性金属です。'
