  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 中空陰極ランプは、陰極が測定対象金属又はその合金からなり、金属固有の輝線スペクトルを発する。
  - 試料液に高濃度のハロゲン化アルカリ金属が共存すると、その分子吸収のため、負の誤差が生じる。
  - 検量線が直線性を示す吸光度の範囲は、吸光光度分析法に比べて狭く、その範囲も金属の種類により異なる。
  - 測定中の吸光度の時間的変動は、吸光光度分析法と比べて大きい。
  - 吸光度は以下の式で示される。吸光度＝吸光係数×光路長×基底状態の金属原子の濃度
  columns: null
  answer: 2
  choice_notes: []
  explanation: '試料液に、高濃度のハロゲン化アルカリ金属（NaClなど）が共存すると、その**分子吸収や光の散乱**によって、見かけの吸光度が大きくなり、**正の誤差**が生じます。「負の誤差が生じる」とする選択肢2は誤りです。


    中空陰極ランプは、陰極が測定対象金属（またはその合金）で、金属固有の輝線スペクトルを発します。検量線の直線範囲は、吸光光度分析法より狭く、金属の種類により異なります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
