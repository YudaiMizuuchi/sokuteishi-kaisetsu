  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 感度は、モル吸光係数が大きいほど高い。
  - 吸光度は、値が大きいほど測定誤差が小さい。
  - セルの光路長が長くなると、吸光度は大きくなる。
  - 測定誤差は、透過率が37%付近で最小となる。
  - 測定誤差は、吸光度が0.43付近で最小となる。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '吸光度の測定誤差は、透過率が約37％（吸光度が約0.43）のときに**最小**になります。吸光度が大きすぎると、透過光が弱くなって、測定誤差が大きくなります。「吸光度は、値が大きいほど測定誤差が小さい」とする選択肢2は誤りです。


    感度は、モル吸光係数が大きいほど高くなります。セルの光路長が長くなると、吸光度は大きくなります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
