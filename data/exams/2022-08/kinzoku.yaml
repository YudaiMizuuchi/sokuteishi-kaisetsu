  stem: 作業環境測定におけるカドミウムの分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 誘導結合プラズマ発光分光分析法（ICP-AES）において、波長226.502 nmを使用するが、共存物質の干渉などがある場合は、228.802 nmなど他の波長を使用してもよい。
  - 誘導結合プラズマ質量分析法（ICP-MS）において、試料液にモリブデンが大量に存在する場合は、ICP内で生成するモリブデン酸化物により、カドミウムの測定に正の誤差を生じる。
  - 原子吸光分析法において、APDC-カドミウム錯体は、pH4未満では不安定となり、有機溶媒層への抽出率が低くなる。
  - 原子吸光分析法において、APDC-カドミウム錯体を抽出したMIBK溶液を最終試料液とする。
  - 原子吸光分析法において、バーナーを点火した後、抽出に用いた溶媒を噴霧しながら、青白い酸化炎が得られるように燃料ガス及び助燃ガスの流量を調整する。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'APDC-カドミウム錯体は、**pH4以上**で不安定になり、有機溶媒層への抽出率が低くなります。pH3.5〜4.0で抽出します。「pH4未満では不安定」とする選択肢3は誤りです。同様の記述は、令和5年度第1回の問題にも、「pH4以上では抽出率が低くなる」の形で出題されています（出題実績）。


    MIBKの抽出液は、最終試料液にします。バーナーを点火して、青白い酸化炎が得られるよう、燃料ガスと助燃ガスの流量を調整します。


