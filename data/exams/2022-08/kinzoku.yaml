  - 吸光光度分析法において、石英セルは可視光の波長では、使用することはできない。
  - ろ過捕集法においては、フィルターの空試験が必要である。
  - 使用するガラス容器は、硝酸酸性溶液に浸した後、精製水で十分に洗浄してから用いる。
  - ろ過捕集後の金属の溶出には、アルカリを用いる場合がある。
