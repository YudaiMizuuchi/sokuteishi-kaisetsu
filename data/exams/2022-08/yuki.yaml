  stem: ガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定により求められた数値は有効数字を考慮して表す。
  - 検量線範囲を超えた高濃度の試料液については、検量線を外挿して定量値を求める。
  - 内標準物質には、目的物質と物理的・化学的によく似ており、測定を妨害しない物質を選択する。
  - GC-MSを用いる場合には、定性された対象成分のマススペクトルから代表的なイオンを選んで、検量線を作成する。
  - 検量線は、測定の都度、作成する。
