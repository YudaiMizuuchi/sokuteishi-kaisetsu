  stem: '作業者は、酢酸エチルを含む塗料が入ったスプレーガンを持って、製品の周囲を移動しながら吹付塗装作業を行っていた。そこで、作業者に能動型試料採取機器（アクティブサンプラー）を装着して、3時間のサンプリングを行った。捕集された酢酸エチルを溶媒2 mLで脱着し、ガスクロマトグラフで分析したところ、酢酸エチル520 µg・mL⁻¹の結果が得られた。C測定値として、正しい値に最も近いものは次のうちどれか。


    ただし、吸引流量：0.1 L・min⁻¹、酢酸エチルのモル質量：88.1 g・mol⁻¹、脱着率：100%とする。また、25℃、1気圧下とする。'
  choices:
  - 6 ppm
  - 8 ppm
  - 12 ppm
  - 16 ppm
  - 18 ppm
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'C測定値は、次の順で求めます。


    1. 脱着液中の量：520 µg/mL × 2 mL ＝ 1040 µg（脱着率100％）

    2. 吸引した空気の量：0.1 L/min × 180 min（3時間）＝ 18 L

    3. 濃度：1040 µg ÷ 18 L ≒ 57.8 µg/L ＝ 57.8 mg/m³

    4. ppmに換算（25℃、1気圧）：57.8 × 24.45／88.1 ≒ 16 ppm


    よって（4）です。'
