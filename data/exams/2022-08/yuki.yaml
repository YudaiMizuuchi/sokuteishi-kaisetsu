  stem: '捕集率が同じ2本のミゼットインピンジャーを直列に連結して、ある有機溶剤蒸気の捕集を行ったところ、1本目には800 µgの有機溶剤が、2本目には120 µgの有機溶剤が捕集された。


    このミゼットインピンジャー1本の捕集率（%）として、正しい値に最も近いものは次のうちどれか。'
  choices:
  - 82%
  - 85%
  - 87%
  - 90%
  - 92%
  columns: null
  answer: 2
  choice_notes: []
  explanation: '直列に連結した2本のインピンジャーの捕集率が同じ（η）のとき、1本目で捕集されなかった（1−η）の割合が、2本目で捕集されます。


    2本目／1本目 ＝ 1 − η ＝ 120／800 ＝ 0.15


    η ＝ 1 − 0.15 ＝ 0.85 ＝ **85％**


    よって（2）です。'
