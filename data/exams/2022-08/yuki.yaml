  stem: 固体捕集法に用いられる捕集剤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭は、窒素又は乾燥空気の加熱気流中で脱水したものが使用されている。
  - 活性炭は、一般に、シリカゲルに比べて単位重量当たりの表面積が小さい。
  - シリカゲルは、水分含有率によって、測定対象物質の吸着容量に差が生じる。
  - ポーラスポリマービーズは反応性が低いので、試料の重合、酸化などが起こりにくい。
  - ポーラスポリマービーズは、活性炭に比べて、加熱脱着が容易である。
