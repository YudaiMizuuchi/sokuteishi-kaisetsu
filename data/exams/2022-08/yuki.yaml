  stem: キャピラリーカラムを用いたガスクロマトグラフ分析法における試料注入法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キャピラリーカラムは、一般に、充填カラムと比較すると導入できる試料は少量である。
  - スプリット注入法では、試料導入部の温度は、目的成分が瞬時に気化し、均一化する温度に設定する。
  - スプリット注入法では、スプリット比は、排出される部分を1として、通常1:10～1:100の任意の比率に設定できる。
  - スプリットレス注入法は、スプリット注入法と比較して低濃度成分分析に向いている。
  - スプリットレス注入法は、スプリット注入法と比較して溶媒ピークの影響を受けやすい。
