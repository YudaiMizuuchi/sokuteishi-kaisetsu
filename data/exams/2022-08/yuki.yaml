  stem: ガスクロマトグラフ分析法に用いられる検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電子捕獲検出器（ECD）は、フィラメントから放出される熱電子を利用する方法で、ハロゲンを含む有機化合物の高感度検出に適している。
  - 水素炎イオン化検出器（FID）は、水素炎中で燃焼しイオン化する物質を検出する方法で、ほとんどの有機化合物は検出するが、ホルムアルデヒドやギ酸などは検出されない。
  - 熱伝導度検出器（TCD）は、キャリアガスと対象物質蒸気の熱伝導度の差を利用した検出器で、物質選択性がない。
  - 炎光光度検出器（FPD）は、水素炎を利用する方法で、リンや硫黄を含む化合物に対して選択性のある検出器である。
  - 光イオン化検出器（PID）は、紫外線を照射して対象物質をイオン化し、イオン電流を検出する方法で、多くの有機化合物を高感度で検出できる。
  columns: null
  answer: 1
