  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 通常、青色溶液の可視部の主な吸収波長域は、赤色溶液のそれより短波長側にある。
  - 定量分析の測定波長は、吸収極大を示す波長のみでなく、共存物質や発色試薬自身による影響のない波長を選ぶこともある。
  - 液層の長さが同一の場合、透過率（%）の値が大きいほど、対象物質の試料液中の濃度は低い。
  - 溶液の濃度1 mol・L⁻¹、かつ、液層の長さ1 cmのときの吸光度の値をモル吸光係数という。
  - 発色させた液は、時間の経過とともに退色することがあるので、発色の状態が安定しているうちに測定する。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '補色の関係から、**青色の溶液**は、赤〜橙色の光（長波長側）を吸収し、**赤色の溶液**は、緑色の光（短波長〜中間の波長）を吸収します。したがって、青色溶液の主な吸収波長域は、赤色溶液のそれより**長波長側**にあります。「短波長側にある」とする選択肢1は誤りです。


    測定波長は、吸収極大のほか、共存物質や発色試薬自身の影響のない波長を選ぶこともあります。透過率が大きいほど、濃度は低いです。モル吸光係数は、濃度1 mol/L、液層1 cmのときの吸光度です。発色後の液は、退色することがあるので、安定しているうちに測定します。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
