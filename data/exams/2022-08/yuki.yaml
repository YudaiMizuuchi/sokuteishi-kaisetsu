  stem: 固体捕集法に用いられる捕集剤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭は、窒素又は乾燥空気の加熱気流中で脱水したものが使用されている。
  - 活性炭は、一般に、シリカゲルに比べて単位重量当たりの表面積が小さい。
  - シリカゲルは、水分含有率によって、測定対象物質の吸着容量に差が生じる。
  - ポーラスポリマービーズは反応性が低いので、試料の重合、酸化などが起こりにくい。
  - ポーラスポリマービーズは、活性炭に比べて、加熱脱着が容易である。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '活性炭は、シリカゲルに比べて、単位重量当たりの表面積が**大きい**捕集剤です。「小さい」とする選択肢2は誤りです。


    活性炭は、窒素または乾燥空気の加熱気流中で脱水したものを使います。シリカゲルは、水分含有率によって吸着容量に差が生じます。ポーラスポリマービーズは、反応性が低いので、試料の重合や酸化が起こりにくく、活性炭に比べて、加熱脱着が容易です。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
