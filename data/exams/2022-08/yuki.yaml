  explanation: 'スプリット比は、**カラムに導入される流量を1**として、排出される部分を、通常**1:10〜1:100**（排出される部分のほうが10〜100倍）に設定します。「排出される部分を1として」とする選択肢3は、基準が逆なので誤りです。


    キャピラリーカラムは、充填カラムより導入できる試料が少量です。スプリット注入法では、試料導入部の温度を、目的成分が瞬時に気化する温度に設定します。スプリットレス注入法は、低濃度成分の分析に向き、溶媒ピークの影響を受けやすいです。


