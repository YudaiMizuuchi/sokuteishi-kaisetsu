  stem: 次の有機溶剤の組合せのうち、25℃において、一方だけが水に限りなく溶解するものはどれか。
  choices:
  - アセトン　イソプロピルアルコール
  - エチルエーテル　テトラヒドロフラン
  - イソブチルアルコール　酢酸イソプロピル
  - メタノール　N,N-ジメチルホルムアミド
  - メチルエチルケトン　o-ジクロロベンゼン
  columns: null
  answer: 2
  choice_notes: []
  explanation: '水に限りなく（任意の割合で）溶解する有機溶剤は、アセトン、イソプロピルアルコール、テトラヒドロフラン、メタノール、N,N-ジメチルホルムアミドなどです。


    - 1 アセトンとイソプロピルアルコール：どちらも限りなく溶解します。

    - 2 エチルエーテルとテトラヒドロフラン：テトラヒドロフランは限りなく溶解しますが、エチルエーテルは約7 g/100 mLで、限りなくは溶けません。**一方だけ**が限りなく溶解します。

    - 3 イソブチルアルコールと酢酸イソプロピル：どちらも限りなくは溶解しません。

    - 4 メタノールとN,N-ジメチルホルムアミド：どちらも限りなく溶解します。

    - 5 メチルエチルケトンとo-ジクロロベンゼン：どちらも限りなくは溶解しません。


    よって（2）です。（溶解度は、一般的な化学便覧の概数です。）'
