  choice_notes: []
  explanation: '発色反応のために加熱した試料液は、**常温に戻してから**吸光度を測定します。加熱直後は、温度の影響で吸光度が変わり、発色も安定していないことがあります。「できるだけ早く測定する」とする選択肢5は誤りです。


    吸収極大波長や吸光度は、pHや呈色後の時間などで変わることがあります。石英セルは、全波長領域で使えます。吸収極大が2つ以上あるときは、モル吸光係数の大きい方を選びます。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
