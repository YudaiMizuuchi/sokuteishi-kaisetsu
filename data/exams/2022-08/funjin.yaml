  stem: 空気中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 温度の偏りがある空間では、高温側及び低温側の空気分子の運動量の違いにより、粒子は高温側に向かう力を受ける。
  - 流体とともに運動している粒子のブラウン運動による拡散効果は、粒径5 µm以上では無視できる。
  - 凝集によって粒子数濃度が1/10になる時間は、粒子数濃度が高いほど短い。
  - 多段平行板式分粒装置の50%分粒粒径は、流量の平方根に比例する。
  - 慣性衝突式分粒装置を通過して、フィルター上に捕集される粒子の平均粒径は、ノズルを通過する気流の速度が速いほど小さい。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '温度の偏りがある空間では、高温側の空気分子のほうが運動量が大きいので、粒子は、高温側から押されて、**低温側**に向かう力（熱泳動力）を受けます。「高温側に向かう力を受ける」とする選択肢1は誤りです。


    ブラウン運動による拡散効果は、粒径5 µm以上では無視できます。凝集によって粒子数濃度が1/10になる時間は、粒子数濃度が高いほど短くなります。多段平行板式分粒装置の50％分粒粒径は、流量の平方根に比例します。慣性衝突式分粒装置では、ノズルを通る気流の速度が速いほど、フィルター上に捕集される粒子の平均粒径は小さくなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
