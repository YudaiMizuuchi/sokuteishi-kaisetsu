  choices:
  - リフラクトリーセラミックファイバーは、アルミナ（Al₂O₃）とシリカ（SiO₂）を主成分とする非晶質の人造鉱物繊維である。
  - リフラクトリーセラミックファイバーは、1,000℃以上の高温域で耐火材や断熱材として炉のライニング材、高温用ガスケット・シール材等に使用されている。
  - リフラクトリーセラミックファイバーの管理濃度は、5 µm以上の繊維として0.3 f・cm⁻³である。
  - リフラクトリーセラミックファイバーの捕集・分析方法の手順は、石綿の捕集・分析方法と同じである。
  - 位相差顕微鏡を用いる計数分析法では、石綿の場合と異なり、リフラクトリーセラミックファイバーを他の繊維と区別して計数することができる。
