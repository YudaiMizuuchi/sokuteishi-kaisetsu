  choices:
  - 同じ粉じんであれば、粒径が0.5 µm程度より大きいと、粒径が大きくなるほど質量濃度変換係数は大きくなる。
  - 粒度分布が同じであっても、石英粉じんよりも酸化鉄粉じんの方が質量濃度変換係数は大きくなる。
  - 多段平行板式分粒装置で捕集したフィルターの採じん面に縞模様が見られるような作業場の質量濃度変換係数は大きい傾向がある。
  - 併行測定点は、A測定を実施した測定点のうちのいずれかの一点から、粉じんの発生状況や気流の影響等を考慮して選定される。
  - 研磨作業場での質量濃度変換係数は、発生源の近くでは大きく、発生源から離れると小さくなる傾向がある。
