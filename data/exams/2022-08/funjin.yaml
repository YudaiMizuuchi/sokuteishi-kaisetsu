  stem: 電子天秤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電子天秤は、比較的操作が簡便で、読み取りも容易であるとともに、温度変化による感度の変化も直示天秤に比べ小さい。
  - 試料の温度が天秤の秤量室内の温度よりも高いと秤量値は、真の値よりも小さくなる。
  - 零位（電磁力平衡）方式の電子天秤は、荷重の変化による可動部の微小変位を差動トランス、光電素子等により検出する。
  - 力測定方式の電子天秤は、荷重を加えることによって生じる力の変化を弾性体のひずみとして測定する。
  - 一般に使用されている読取限界が1 mg以下の電子天秤の多くは、力計（ロードセル）を利用した力測定方式である。
