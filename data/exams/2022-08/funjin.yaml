  stem: '密度2.8 g・cm⁻³、粒径12.0 µmの球形粒子の水中における自由落下の終末速度を測定して7.4×10⁻³ cm・s⁻¹を得た。同じ条件のもとで、別に密度4.6 g・cm⁻³、粒径9.0 µmの球形粒子について同様の測定をしたときの終末速度の値に最も近いものは次のうちどれか。


    ただし、粒子の終末速度はストークスの式に従い、また、水の密度は1.0 g・cm⁻³とする。'
  choices:
  - 5.1×10⁻³ cm・s⁻¹
  - 6.7×10⁻³ cm・s⁻¹
  - 8.3×10⁻³ cm・s⁻¹
  - 9.1×10⁻³ cm・s⁻¹
  - 11.1×10⁻³ cm・s⁻¹
  columns: null
  answer: 3
  choice_notes: []
  explanation: '終末沈降速度は、ストークスの式から、（ρ − ρ₀）× d² に比例します。2つの粒子の比をとります。


    - 1つ目：（2.8 − 1.0）× 12.0² ＝ 1.8 × 144 ＝ 259.2

    - 2つ目：（4.6 − 1.0）× 9.0² ＝ 3.6 × 81 ＝ 291.6


    2つ目の速度 ＝ 7.4 × 10⁻³ × 291.6／259.2 ≒ 8.3 × 10⁻³ cm/s


    よって（3）です。'
