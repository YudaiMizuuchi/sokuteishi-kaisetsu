  stem: 慣性衝突式分粒装置（インパクター）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 円形ノズル式インパクターの慣性パラメータ（効率50%の場合）は0.192である。
  - 吸入性粉じん濃度測定用インパクターは、相対沈降径4.0 µmの粒子を50%除去するよう設計・製作されている。
  - 円形ノズル式インパクターで所定の流量より大きな流量で吸引すると測定値は小さくなる。
  - 通気の際の流速が速くなるほど、分粒装置を通過する粒子の50%分粒粒径は小さい方へ移行する。
  - 円形ノズル式インパクターの50%分粒粒径は、ノズルを通過する粒子の密度の平方根に比例する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '円形ノズル式インパクターの50％分粒粒径は、粒子の密度の**平方根に反比例**します（密度が大きいほど、慣性が大きく、小さい粒子まで衝突板に捕集されます）。「平方根に比例する」とする選択肢5は誤りです。


    所定の流量より大きな流量で吸引すると、流速が速くなり、50％分粒粒径は小さいほうへ移行して、通過する粒子が少なくなり、測定値は小さくなります。吸入性粉じん濃度測定用インパクターは、相対沈降径4.0 µmの粒子を50％除去するよう設計されています。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
