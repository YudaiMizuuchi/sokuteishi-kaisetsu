  stem: 遊離けい酸の分析試料の調製に用いる液相沈降法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所で採取した堆積粉じんのうち目開き75 µmのふるいを通過した粉じんを粒度調整のための試料とする。
