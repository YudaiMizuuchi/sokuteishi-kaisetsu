  - Ⓑ
  answer: 3
  choice_notes: []
  explanation: 'ストークスの式は、終末速度 v ＝（ρ − ρ₀）× g × d² ／（18 η）です。終末速度は、**粒子の直径の2乗**と、粒子の密度に**比例**し、**媒質の粘性係数**に**反比例**します。よって（3）です。


    （参考：『労働衛生の知識』）'
