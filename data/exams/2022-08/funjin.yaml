  stem: '次の記述の［　］内に入るⒶ及びⒷの語句の組合せのうち、正しいものはどれか。


    「粒径2～5 µmの球形粒子が媒質中を落下する際の終末速度は、［Ⓐ］に比例し、［Ⓑ］に反比例する。」'
  choices:
  - 粒子の直径 ／ 粒子の密度
  - 粒子の直径の2乗 ／ 媒質の密度
  - 粒子の直径の2乗 ／ 媒質の粘性係数
  - 粒子の密度 ／ 媒質の粘性係数の逆数
  - 粒子の密度の2乗 ／ 媒質の粘性係数
  columns:
