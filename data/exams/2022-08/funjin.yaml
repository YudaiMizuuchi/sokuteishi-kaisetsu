  explanation: '繊維状フィルターの捕集効率は、粒径が**0.1〜0.3 µm付近で最も低く**なります（慣性・重力・さえぎり効果と、拡散効果のどちらも効きにくい粒径です）。「最も高くなる」とする選択肢1は誤りです。


    さえぎり効果は、繊維径が小さいほど高くなります。拡散効果は、ろ過速度が小さいほど高くなります。重力効果は、粒径が大きいほど高くなります。慣性効果は、ろ過速度が大きいほど高くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
