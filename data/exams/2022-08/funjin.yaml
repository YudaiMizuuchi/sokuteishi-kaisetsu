  stem: 'X線回折基底標準吸収補正法により、以下のような手順で粉じん中石英の定量操作を行ったところ、粉じん中の石英含有率として15.0%が得られた。


    有効直径20 mmのフィルターに、再発じん法により1.26 mgの粉じんを捕集した。このフィルターの石英の主回折強度は325 cpsであった。石英の回折強度は石英が1 mg・cm⁻²のとき6,500 cpsに相当する。このフィルターの定量操作に用いたX線吸収補正係数として、最も近い値はどれか。'
  choices:
  - '1.00'
  - '1.10'
  - '1.20'
  - '1.30'
  - '1.40'
  columns: null
  answer: 3
  choice_notes: []
  explanation: '逆算します。


    1. フィルターの有効面積：直径20 mm（半径1 cm）なので、π × 1² ＝ 3.14 cm²

    2. フィルター上の石英の量：粉じん1.26 mgの15.0％なので、1.26 × 0.150 ＝ 0.189 mg、面密度は 0.189 ÷ 3.14 ≒ 0.0602 mg/cm²

    3. 吸収補正をした回折線強度：石英が1 mg/cm²のとき6500 cpsなので、0.0602 × 6500 ≒ 391 cps

    4. X線吸収補正係数 ＝ 391 ÷ 325 ≒ **1.20**


    よって（3）です。'
