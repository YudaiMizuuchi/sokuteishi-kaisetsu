  choices:
  - 金属基底標準板は石英の主回折線より高角度側に回折線のある亜鉛又はアルミニウムが用いられる。
  - X線吸収補正係数は、計測された金属の回折線の強度と石英の回折線の強度との比から求める。
  - 吸収補正法は直接法に比べて定量範囲が広くなり、共存する他の物質の吸収の影響を少なくすることができる。
