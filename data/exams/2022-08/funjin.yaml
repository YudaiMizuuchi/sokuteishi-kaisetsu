  stem: '次の条件で、石綿粉じんを直径25 mmのセルローズエステルメンブランフィルター（採じん面の直径22 mm）上に捕集して位相差顕微鏡を用いて計数を行った。この試料において、50視野を計数して認められた総繊維数が30 fであった。このときの繊維数濃度に最も近いものは下のうちどれか。


