  explanation: '位相差顕微鏡を用いる計数分析法では、リフラクトリーセラミックファイバー（RCF）も、石綿と同様に、他の繊維と**区別して計数することができません**。「石綿の場合と異なり、区別して計数できる」とする選択肢5は誤りです。


    RCFは、アルミナとシリカを主成分とする非晶質の人造鉱物繊維で、高温用の耐火材・断熱材に使われます。管理濃度は、5 µm以上の繊維として0.3 f/cm³です。捕集・分析の手順は、石綿と同じです。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
