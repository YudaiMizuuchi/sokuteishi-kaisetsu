  - 粉じんを採取する前のフィルターを載せた金属板の回折強度と粉じん採取後のフィルターを載せた金属板及び石英の回折強度を計測する。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'X線吸収補正係数は、粉じん**採取前後**の、金属基底標準板の回折線強度の**減少率**から求めます。「計測された金属の回折線の強度と、石英の回折線の強度との比から求める」とする選択肢2は誤りです。


    金属基底標準板には、石英の主回折線より高角度側に回折線のある亜鉛またはアルミニウムを使います。吸収補正法は、直接法より定量範囲が広く、共存物質の吸収の影響が少なくなります。検量線は、横軸に石英量、縦軸にX線吸収補正係数で補正した石英の回折強度をとって作成します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
