  stem: 粉じんのろ過捕集に用いるろ過材に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多孔状メンブランフィルターでは、粒子のほとんどはフィルター表面で捕集されるが、繊維状フィルターでは、フィルターの表面だけでなく内部でも捕集される。
  - ろ過材を通して空気を吸引した場合におけるろ過材の圧力損失は、流量にほぼ反比例する。
  - 粒径0.3 µmの粒子を95%以上捕集する性能を有するものであれば、吸湿量の小さなフィルターの方がよい。
  - フッ素樹脂加工グラスファイバーフィルターは、加湿空気を通してもほとんど吸湿しない。
  - 初期圧力損失が低く、粉じんの堆積による圧力損失の増加が少ないものがよい。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'ろ過材の圧力損失は、流量（ろ過速度）に**ほぼ比例**します。「流量にほぼ反比例する」とする選択肢2は誤りです。


    メンブランフィルターは、粒子のほとんどをフィルター表面で捕集し、繊維状フィルターは、表面と内部で捕集します。吸湿量の小さなフィルターが良く、フッ素樹脂加工グラスファイバーフィルターは、ほとんど吸湿しません。初期圧力損失が低く、粉じんの堆積による圧力損失の増加が少ないものが適しています。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
