  stem: 電子天秤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電子天秤は、比較的操作が簡便で、読み取りも容易であるとともに、温度変化による感度の変化も直示天秤に比べ小さい。
  - 試料の温度が天秤の秤量室内の温度よりも高いと秤量値は、真の値よりも小さくなる。
