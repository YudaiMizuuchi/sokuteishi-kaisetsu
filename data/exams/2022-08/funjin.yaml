  - 対陰極物質がCr、Fe、CuのそれぞれのK<sub>α</sub>X線の波長は、短い方からCu、Fe、Crの順である。
  - X線の単色化のために用いられるK<sub>β</sub>X線除去フィルターとしては、対陰極物質より、原子番号が1小さな物質が用いられる。
  - 対陰極物質がCuのX線回折分析法で測定されるトリジマイト（単斜晶系）の主回折線の回折角度（2θ）は、20.5°である。
  - 炭酸カルシウムは、石英の定量の妨害となる回折線をもつ。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '炭酸カルシウムは、石英の主回折線を妨害するものではなく、**金属基底標準板の亜鉛の回折線と重なる**ので、亜鉛板の使用に注意が必要な物質です。「石英の定量の妨害となる回折線をもつ」とする選択肢5は、誤りです。


    走査速度が速すぎると、ピーク位置のずれや強度の低下が起こります。Kα線の波長は、Cu、Fe、Crの順に長くなります。Kβ除去フィルターには、対陰極物質より、原子番号が1小さい物質（Cuに対してNi）を使います。トリジマイト（単斜晶系）の主回折線は、Cu対陰極のとき2θ＝20.5°付近です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
