  stem: 繊維状フィルターによる捕集原理に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 捕集効率は、粒径0.1～0.3 µmの付近で最も高くなる。
  - さえぎり効果による捕集効率は、繊維径が小さいほど高くなる。
  - 拡散効果による捕集効率は、ろ過速度が小さいほど高くなる。
  - 重力効果による捕集効率は、粒径が大きいほど高くなる。
  - 慣性効果による捕集効率は、ろ過速度が大きいほど高くなる。
  columns: null
