  explanation: '次の順で計算します。


    1. 捕集した空気の量：1 L/min × 20 min ＝ 20 L ＝ 20000 cm³

    2. 採じん面の面積：直径22 mm（半径1.1 cm）なので、π × 1.1² ≒ 3.80 cm²

    3. 1視野の面積：直径300 µm（0.03 cm）なので、π × 0.015² ≒ 7.07 × 10⁻⁴ cm²、50視野の面積は 3.53 × 10⁻² cm²

    4. フィルター全体の繊維数：30 f × 3.80／3.53 × 10⁻² ≒ 3230 f

    5. 繊維数濃度：3230 f ÷ 20000 cm³ ≒ **0.16 f/cm³**


    よって（2）です。'
