  stem: 粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 面積式流量計は、浮子とテーパー管との間隙の面積と、そこを流れる試料空気の体積流量が反比例することを利用した流量計である。
  - ローボリウムエアサンプラーに用いる流量計の校正に用いられる湿式ガスメーターは、通常、押し込み方式で使用する。
  - 絞り式流量計には、管路中にオリフィス板やベンチュリー管が設けられているものがある。
  - 絞り式流量計は、管内の絞り部分の上流側と下流側の圧力差が流量と一定の関係を示すことを利用している。
  - 20 L・min⁻¹の流量で空気（25℃）を吸引する場合において、捕集装置の圧力損失が25 kPaのとき、組み込まれた面積式流量計の指示値は約23 L・min⁻¹となる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '面積式流量計は、浮子とテーパー管との間隙の面積と、そこを流れる試料空気の体積流量が**比例**することを利用した流量計です。「反比例する」とする選択肢1は誤りです。


    ローボリウムエアサンプラーの流量計の校正に使う湿式ガスメーターは、通常、押し込み方式で使います。絞り式流量計は、管路中のオリフィス板やベンチュリー管の、上流側と下流側の圧力差が、流量と一定の関係を示すことを利用します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
