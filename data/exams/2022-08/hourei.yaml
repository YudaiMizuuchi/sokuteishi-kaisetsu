  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質のA測定において、直接捕集方法により試料空気を採取する場合、採取時間は、10分間以上の継続した時間としなければならない。
  - 第1種酸素欠乏危険作業に係る作業場の酸素濃度測定における測定点は、作業場における適当な位置に、5以上としなければならない。
  - 一つの測定点における鉱物性粉じんの試料空気の採取時間は、相対濃度指示方法による測定の場合には、10分間未満であってもよい。
  - 暑熱の屋内作業場における気温及び湿度の測定の測定点は、単位作業場所について、当該単位作業場所の中央部の床上50 cm以上150 cm以下の位置に、1以上としなければならない。
  - 作業環境測定基準で定める一定の特定化学物質の濃度を測定する場合、当該化学物質以外の物が測定値に影響を及ぼすおそれがないときは、検知管方式の測定機器により測定することができる。
