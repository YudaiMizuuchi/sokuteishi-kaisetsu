  explanation: '第1種酸素欠乏危険作業の作業主任者は、**酸素欠乏危険作業主任者技能講習**を修了した者から選任します。「酸素欠乏・硫化水素危険作業主任者技能講習」は、硫化水素の危険もある第2種酸素欠乏危険作業のものなので、選択肢1は誤りです。


