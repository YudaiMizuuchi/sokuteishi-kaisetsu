  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第1評価値及びB測定値が管理濃度と等しい場合は、第2管理区分に区分される。
  - 有機溶剤に係る管理濃度は、全て体積分率（ppm）で表されている。
  - A測定の評価値については、1作業日について測定した場合と連続する2作業日について測定した場合とでは計算式が異なる。
  - 遊離けい酸を含まない鉱物性粉じんの管理濃度は、3.0 mg/m³である。
  - 特別有機溶剤を除き、2種類以上の特定化学物質を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
