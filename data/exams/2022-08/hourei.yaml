  stem: 個人サンプリング法による作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 個人サンプリング法の登録を受けた第1種作業環境測定士は、登録を受けた指定作業場の種類にかかわらず、個人サンプリング法の対象となる作業環境測定における個人サンプリングを行うことができる。
  - 個人サンプリング法の登録を受けた作業環境測定機関が、事業者の委託を受けて個人サンプリング法によるデザイン及びサンプリングを行う場合、個人サンプリング法の登録を受けた作業環境測定士に行わせなければならない。
  - 低管理濃度特定化学物質に係る作業環境測定は、発散源の場所が一定しない作業が行われる単位作業場所で行われるものでなくても、個人サンプリング法の対象となる。
  - 個人サンプリング法による作業環境測定結果の評価が2年以上行われ、第1管理区分に区分されることが継続した単位作業場所については、所轄労働基準監督署長の許可を受けることにより、D測定のみによる作業環境測定を行うことができる。
  - 管理濃度の10分の1に満たない測定値がある単位作業場所にあっては、管理濃度の10分の1を当該測定値とみなして、管理区分を決定することができる。
