  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 指定作業場の作業環境測定結果についての作業環境評価基準に基づく管理区分の決定は、作業環境測定士ではない者に行わせることができる。
  - 指定作業場以外の作業場における作業環境測定については、作業環境測定士ではない者に行わせることができる。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士ではない者に行わせることができる。
  - 指定作業場について、作業環境測定機関等への委託によらず、作業環境測定を行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についてのデザイン及びサンプリングの業務を行うことができない。
