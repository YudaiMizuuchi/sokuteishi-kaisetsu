  stem: 事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 機械による換気のための設備については、2か月以内ごとに1回、定期に、異常の有無を点検しなければならない。
  - 室における一酸化炭素の含有率（1気圧、25℃とした場合の空気中に占める一酸化炭素の容積の割合）を、50 ppm以下としなければならない。
  - 空気調和設備を設けている場合は、室に供給される空気中の二酸化炭素の含有率（1気圧、25℃とした場合の空気中に占める二酸化炭素の容積の割合）を、5,000 ppm以下としなければならない。
  - 空気調和設備を設けている場合は、室に供給される空気中の浮遊粉じんの量（1気圧、25℃とした場合の空気1 m³中に含まれる浮遊粉じんの重量）を、0.15 mg以下としなければならない。
  - 室の気積を、設備の占める容積及び床面から4 mをこえる高さにある空間を除き、労働者1人について、10 m³以上としなければならない。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '空気調和設備を設けた場合に、室に供給される空気中の二酸化炭素の含有率は、**1,000 ppm 以下**になるように調整します。「5,000 ppm 以下」とする選択肢3は誤りです。5,000 ppm は、室の二酸化炭素の含有率の基準です。


    室の一酸化炭素は 50 ppm 以下（選択肢2）、供給される空気中の浮遊粉じんは 0.15 mg/m³ 以下（選択肢4）、気積は、床面から 4 m を超える空間などを除いて、労働者1人について 10 m³ 以上です（選択肢5）。機械による換気設備は、2か月以内ごとに異常の有無を点検します（選択肢1）。


