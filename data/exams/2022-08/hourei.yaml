  - Ⓑ
  - Ⓒ
  answer: 4
  choice_notes: []
  explanation: '1,2-ジクロルエチレンは第1種有機溶剤で、有機溶剤の作業環境測定の記録は**3年間**保存します。30年とする選択肢4は誤りです。


    30年間保存するのは、特別管理物質の測定の記録です（ナフタレンは該当、選択肢5）。放射性物質は1か月以内ごと・5年（選択肢1）、1,1,1-トリクロルエタン（第2種有機溶剤）は6か月以内ごと・3年（選択肢2）、鉛は1年以内ごと・3年（選択肢3）です。


    根拠：特定化学物質障害予防規則第36条第2項・第3項、有機溶剤中毒予防規則第28条。'
