  - その事業場の属する業種にかかわらず、新たに職務に就くこととなった職長に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務に労働者を就かせるときは、原則として、法令で定める特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別教育を省略することができる。
