  stem: 法令により、定期に作業環境測定を行うべき作業場に関する測定対象Ⓐ、測定頻度Ⓑ及び記録の保存期間Ⓒの組合せとして、誤っているものはどれか。
  choices:
  - 空気中の放射性物質の濃度 ／ 1か月以内ごとに1回 ／ 5年
  - 空気中の1,1,1-トリクロルエタンの濃度 ／ 6か月以内ごとに1回 ／ 3年
  - 空気中の鉛の濃度 ／ 1年以内ごとに1回 ／ 3年
  - 空気中の1,2-ジクロルエチレンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - 空気中のナフタレンの濃度 ／ 6か月以内ごとに1回 ／ 30年
  columns:
