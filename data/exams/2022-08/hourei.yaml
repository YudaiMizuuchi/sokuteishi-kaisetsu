  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 高圧室内作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法令で定める特別教育を行わなければならない。
  - その事業場の属する業種にかかわらず、新たに職務に就くこととなった職長に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 法令で定める廃棄物の焼却施設において焼却灰を取り扱う業務に労働者を就かせるときは、原則として、法令で定める特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、当該科目についての特別教育を省略することができる。
  - 衛生管理者、安全衛生推進者等、労働災害の防止のための業務に従事する者に対し、その業務に関する能力の向上を図るための教育等を行い、又はこれらを受ける機会を与えるよう努めなければならない。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '職長等の教育は、建設業、製造業（一部を除く）、電気業、ガス業、自動車整備業、機械修理業の事業場で行うもので、業種にかかわらず必要なものではありません。選択肢2は誤りです。


    高圧室内作業や、廃棄物焼却施設の焼却灰を取り扱う業務は特別教育の対象で（選択肢1・3）、十分な知識・技能のある科目は特別教育を省略できます（選択肢4）。衛生管理者などには、能力向上教育を行うか、受ける機会を与えます（選択肢5）。


    根拠：労働安全衛生法施行令第19条。'
  figures: []
  law_note: null
