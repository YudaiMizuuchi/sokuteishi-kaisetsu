  - 相当期間密閉されていた鋼製のボイラー、タンクその他その内壁が酸化されやすい施設の内部における酸素欠乏危険作業は、第1種酸素欠乏危険作業である。
  - 第一鉄塩類を含有している地層に接する井戸の内部における作業は、第1種酸素欠乏危険作業である。
  - 酸素欠乏危険作業に係る業務に労働者を就かせるときは、原則として、法定の科目について特別の教育を行わなければならない。
  - 酸素等の濃度が法定の基準を満たすようにするために酸素欠乏危険作業を行う場所を換気するときは、純酸素を使用してはならない。
