  stem: '電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。


    ただし、放射線業務従事者は、緊急作業には従事しないものとし、また、被ばく限度に関する経過措置の適用はないものとする。'
  choices:
  - 放射線業務従事者が眼の水晶体に受ける等価線量は、5年間につき100 mSv及び1年間につき50 mSvを超えないようにしなければならない。
  - 管理区域内において女性の放射線業務従事者（妊娠する可能性がないと診断されたもの及び妊娠と診断されたものを除く。）の受ける実効線量は、3か月間につき5 mSvを超えないようにしなければならない。
  - 放射線業務従事者の皮膚に受ける等価線量については、1年間につき500 mSvを超えないようにしなければならない。
  - 妊娠と診断された女性の放射線業務従事者の腹部表面に受ける等価線量は、妊娠と診断されたときから出産までの間につき2 mSvを超えないようにしなければならない。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分については、原則として、3か月以内ごとに1回、定期に、外部放射線による線量当量率又は線量当量を測定しなければならない。
