  - 指定作業場以外の作業場における作業環境測定については、作業環境測定士ではない者に行わせることができる。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士ではない者に行わせることができる。
  - 指定作業場について、作業環境測定機関等への委託によらず、作業環境測定を行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についてのデザイン及びサンプリングの業務を行うことができない。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '第1種作業環境測定士は、登録を受けた作業場の種類にかかわらず、指定作業場のデザインとサンプリングを行うことができます。「登録を受けた種類以外は行えない」とする選択肢5は誤りです。作業場の種類は、分析の業務の範囲を表すものです。


    作業環境評価基準による管理区分の決定は、測定士でなくてもできます（選択肢1）。指定作業場以外の作業場の測定も、測定士でなくてよく（選択肢2）、管理区域の外部放射線の測定は指定作業場の測定ではないので、測定士でなくてもできます（選択肢3）。


