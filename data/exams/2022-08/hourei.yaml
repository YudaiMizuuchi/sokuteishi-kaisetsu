  choices:
  - 法令に基づき設置される局所排気装置の除じん装置は、ヒューム以外の粉じんである場合は、スクラバによる除じん方式とすることができる。
  - 常時特定粉じん作業が行われる屋内作業場については、6か月以内ごとに1回、定期に、当該作業場における空気中の粉じんの濃度を測定し、その都度、所定の事項を記録して、7年間保存しなければならない。
  - 特定粉じん作業以外の粉じん作業を行う屋内作業場については、当該粉じん作業に係る粉じんを減少させるため、局所排気装置による換気の実施又はこれと同等以上の措置を講じなければならない。
  - 粉じん作業を行う屋内の作業場所については、毎日1回以上、清掃を行わなければならない。
  - 常時特定粉じん作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目についての特別教育を行わなければならない。
