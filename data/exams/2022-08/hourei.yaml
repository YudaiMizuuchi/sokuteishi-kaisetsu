  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時50人以上の労働者を使用する事業場においては、その業種に応じて、衛生委員会又は安全衛生委員会を設けなければならない。
  - 常時50人以上の労働者を使用する事業場においては、その業種にかかわらず、衛生管理者を選任しなければならない。
  - 総括安全衛生管理者には、当該事業場においてその事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
  - 深夜業を含む業務に常時500人以上の労働者を従事させる事業場では、その事業場に専属の産業医を選任しなければならない。
  - 衛生委員会の議長は、原則として、総括安全衛生管理者又は総括安全衛生管理者以外の者で当該事業場においてその事業の実施を統括管理するもの若しくはこれに準ずる者のうちから事業者が指名した者がなるものとされている。
