  rank: null
  stem: 作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 中央管理方式の空気調和設備を設けている建築物の室で事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、浮遊粉じん量を測定しなければならない。
  - 多量の蒸気を使用する金属又は非金属の洗浄又はめっきの業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 硫化鉱、魚油等を入れてあるタンクの内部において作業を行う作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素の濃度を測定しなければならない。
  - 炭酸ガスが停滞し、又は停滞するおそれのある坑内の作業場については、1か月以内ごとに1回、定期に、炭酸ガス濃度を測定しなければならない。
  - ロール機、圧延機等による金属の圧延を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '中央管理方式の空気調和設備を設けた事務所の室で、定期に測定するのは、一酸化炭素・二酸化炭素の含有率、室温・外気温、相対湿度などで、**浮遊粉じん量**は含まれません。選択肢1は誤りです。


    多量の蒸気を使う洗浄・めっきの屋内作業場は、気温・湿度を半月以内ごとに測定します（選択肢2）。硫化鉱や魚油を入れたタンクの内部では、その日の作業開始前に酸素濃度を測定します（選択肢3）。炭酸ガスが停滞するおそれのある坑内は1か月以内ごとに炭酸ガス濃度を測定し（選択肢4）、金属の圧延を行う屋内作業場は、6か月以内ごとに等価騒音レベルを測定します（選択肢5）。


    根拠：作業環境測定基準第6条（建築物の室）。'
