  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 雇入時の健康診断の結果については、使用する労働者数にかかわらず、所轄労働基準監督署長に報告する必要はない。
  - 事業場で行った定期健康診断の結果、異常の所見があると診断された労働者については、その健康を保持するために必要な措置について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。
  - 雇入時の健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 多量の高熱物体を取り扱う業務に常時従事する労働者に対しては、原則として、6か月以内ごとに1回、定期に、法令で定める健康診断を行わなければならない。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '貧血検査や肝機能検査などを、医師が必要でないと認めるときに省略できるのは、**定期**健康診断です。**雇入時**の健康診断では省略できないので、選択肢4は誤りです。


    常時50人以上の労働者を使用する事業者は、定期健康診断結果報告書を所轄労働基準監督署長に提出します（選択肢1）。雇入時の健康診断の結果は報告不要です（選択肢2）。異常の所見がある労働者については、3か月以内に医師の意見を聴きます（選択肢3）。多量の高熱物体を取り扱う業務などの特定業務従事者には、6か月以内ごとに健康診断を行います（選択肢5）。'
  figures: []
  law_note: null
