  stem: 作業環境中の金属類の分析に用いる試薬類に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 精製水には、蒸留水、イオン交換水などがある。
  - 溶媒抽出に用いる有機溶媒の比重は、水より常に小さい。
  - pH指示薬は、種類によって変色するpHが異なる。
  - 錯形成剤のジチゾンは、錯体を作る金属によって反応するpH範囲が異なる。
  - 過マンガン酸カリウムは、反応溶液のpHによって酸化力が異なる
