  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 光源の輝線の線幅は、吸収線の線幅よりも広い。
  - 中空陰極ランプは、至適電流値で作動させる。
  - 吸光度は、光路長と基底状態の金属原子の濃度の積に比例する。
  - 中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して発光する。
  - 電気加熱原子化法(グラファイト炉法)は、フレーム法に比べて測定感度が高い。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '原子吸光分析法では、光源の輝線の線幅は、吸収線の線幅より**狭く**なければなりません。「広い」とする選択肢1は誤りです。同じ記述は、令和2年度第1回、令和6年度第1回などにも出題されています（出題実績）。


    中空陰極ランプは、至適電流値で作動させます。吸光度は、光路長と、基底状態の金属原子の濃度の積に比例します。中空陰極ランプでは、金属原子が封入ガスのイオンと衝突して発光します。電気加熱原子化法は、フレーム法に比べて、測定感度が高いです。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
