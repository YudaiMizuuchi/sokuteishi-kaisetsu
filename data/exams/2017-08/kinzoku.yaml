  stem: 次の金属酸化物のうちで、金属元素の酸化数が最も大きいものはどれか。
  choices:
  - PbO
  - As₂O₃
  - MnO₂
  - V₂O₅
  - CrO₃
  columns: null
  answer: 5
  choice_notes: []
  explanation: '各酸化物の金属元素の酸化数は、酸素を−2として求めます。


    - PbO：Pb は **+2**

    - As₂O₃：As は **+3**

    - MnO₂：Mn は **+4**

    - V₂O₅：V は **+5**

    - CrO₃：Cr は **+6**


    最も大きいのは、CrO₃（クロムの酸化数+6）で、（5）です。'
