  stem: 作業環境中の金属の測定に用いる蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 蛍光は、励起光より波長が短い。
  - 入射光に対して直角方向の蛍光を測定する。
