  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸光度は、値が大きいほど誤差が小さい。
  - 測定波長が紫外部にある場合は、石英セルを用いる。
  - 測定器の読み取り誤差は、透過率が37%付近で最小となる。
  - 感度は、モル吸光係数が大きいほど高い。
  - マスキング剤は、共存物質による妨害の影響を少なくするために加える。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '吸光度の測定誤差は、透過率が約37％（吸光度が約0.43）のときに**最小**になります。吸光度の値が大きすぎると、透過光が弱くなって、誤差が大きくなります。「吸光度は、値が大きいほど誤差が小さい」とする選択肢1は誤りです。同様の記述は、令和4年度第1回にも出題されています（出題実績）。


    測定波長が紫外部にある場合は、石英セルを使います。感度は、モル吸光係数が大きいほど高くなります。マスキング剤は、共存物質による妨害の影響を少なくするために加えます。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
