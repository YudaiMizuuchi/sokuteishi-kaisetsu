  stem: 溶媒抽出原子吸光分析法に用いられるメチルイソブチルケトン(MIBK)に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金属キレートの溶解度が大きい。
  - 溶媒抽出後の層分離に時間を要する。
  - 水とMIBKは、相互に数%程度溶解する。
  - 比較的安定な炎が得られる。
  - ハロゲンを含まない有機溶媒である。
  columns: null
  answer: 2
  choice_notes: []
  explanation: 'メチルイソブチルケトン（MIBK）は、水との**層分離が容易**な溶媒です。「溶媒抽出後の層分離に時間を要する」とする選択肢2は誤りです。


