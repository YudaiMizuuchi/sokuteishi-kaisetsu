  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音の測定点は、原則として、単位作業場所の床面上に6m以下の等間隔で引いた縦の線と横の線との交点の床上120cm以上150cm以下の位置としなければならない。
  - 石綿等を取り扱う屋内作業場における空気中の石綿の濃度の測定は、ろ過捕集方法及び計数方法によらなければならない。
  - ろ過捕集方法による鉱物性粉じんの濃度の測定のための一つの測定点における試料空気の採取時間は、10分間以上の継続した時間とする。
  - ろ過捕集方法に用いるろ過材は、0.5μmの粒子を95%以上捕集する性能を有するものに限られる。
  - トルエンなど一定の有機溶剤の濃度を測定する場合、当該有機溶剤以外の物が測定値に影響を及ぼすおそれがないときは、検知管方式の測定機器により測定することができる。
  answer: 4
  choice_notes: []
  explanation: 'ろ過捕集方法に用いるろ過材は、**0.3 µm** の粒子を95％以上捕集する性能を有するものに限られます。0.5 µm とする選択肢4は誤りです。


    根拠：作業環境測定基準第1条第5号。'
  figures: []
  law_note: null
  _key_choice: ろ過捕集方法に用いるろ過材は、0.5 µmの粒子を95%以上捕集する性能を有するものに限られる。
