  stem: 鉛中毒予防規則に関する次の記述のうち、誤っているものはどれか。ただし、同規則に定める適用除外及び特例はないものとする。
  choices:
  - 鉛ライニングの業務（遠隔操作によって行う隔離室におけるものを除く。）に常時従事する労働者に対し、6か月以内ごとに1回、定期に、所定の項目について、医師による健康診断を行わなければならない。
  - 法令に基づき設置する局所排気装置の除じん装置は、ろ過除じん方式の除じん装置又はこれと同等以上の性能を有するものとしなければならない。
  - 法令に基づき設置した設備のうち、プッシュプル型換気装置については、原則として、1年以内ごとに1回、定期に、法令で定める項目について自主検査を行わなければならない。
  - 鉛業務を行う屋内作業場の床等については、鉛等による汚染を除去するため、毎週1回以上、真空掃除機を用いて、又は水洗によって掃除しなければならない。
  - 鉛業務を行う屋内の作業場所においては、労働者が喫煙し、又は飲食することを禁止しなければならない。
  answer: 4
  choice_notes: []
