  stem: 有機溶剤中毒予防規則に関する次の記述のうち、誤っているものはどれか。ただし、同規則に定める適用除外及び設備の特例はないものとする。
  choices:
  - 屋内作業場において、第3種有機溶剤等を用いて洗浄の業務を行う場合には、有機溶剤作業主任者を選任しなければならない。
  - 屋内作業場において、第2種有機溶剤等を用いて洗浄の業務を行う場合には、当該業務に常時従事する労働者に対し、6か月以内ごとに1回、定期に、医師による所定の項目についての健康診断を行わなければならない。
  - 屋内作業場において、第3種有機溶剤等を用いて洗浄の業務を行う場合には、定期に行う作業環境測定は必要ない。
  - 屋内作業場において、第2種有機溶剤等を用いて洗浄の業務を行う場合には、当該業務を行う作業場に、全体換気装置又は局所排気装置を設けなければならない。
  - 有機溶剤等を入れてあった空容器で有機溶剤の蒸気が発散するおそれのあるものについては、密閉するか、又は屋外の一定の場所に集積しておかなければならない。
  answer: 4
