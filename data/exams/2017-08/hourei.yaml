  stem: 労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 事業者は、第一種衛生管理者の選任を要する業種に属する事業場においては常時50人以上の労働者を使用する場合に、それ以外の業種に属する事業場においては常時100人以上の労働者を使用する場合に、それぞれ衛生委員会を設けなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に関係なく、産業医を選任しなければならない。
  - 事業者は、常時1,000人以上の労働者を使用する事業場においては、その業種に関係なく、事業場に専属の産業医を選任しなければならない。
  - 事業者は、常時1,000人を超える労働者を使用する事業場では、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 事業者は、常時300人以上の労働者を使用する製造業の事業場においては、総括安全衛生管理者を選任しなければならない。
  answer: 1
