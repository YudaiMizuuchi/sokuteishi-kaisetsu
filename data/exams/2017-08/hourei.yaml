  - し尿、汚水その他腐敗し、又は分解しやすい物質を入れてある槽の内部における作業は、第2種酸素欠乏危険作業である。
  - 石炭、原木、乾性油その他空気中の酸素を吸収する物質を入れてあるタンクの内部における作業は、第1種酸素欠乏危険作業である。
  - 酒類その他発酵する物を入れてある醸造槽の内部における作業は、第1種酸素欠乏危険作業である。
  - 海水が滞留している暗きょの内部における作業は、第1種酸素欠乏危険作業である。
