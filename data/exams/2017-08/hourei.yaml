  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 指定作業場について作業環境測定を自ら行う事業者は、その使用する作業環境測定士にこれを実施させなければならない。
  - 第一種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる。
  - 指定作業場の作業環境測定において、鉱物性粉じんの測定用相対濃度計、検知管等の簡易測定機器を用いる分析は、第二種作業環境測定士に行わせることができる。
  - 作業環境評価基準に従って行う指定作業場の作業環境測定結果の評価は、作業環境測定士でなければ行うことができない。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士ではないものに行わせることができる。
  answer: 4
  choice_notes: []
  explanation: 作業環境評価基準に従って行う作業環境測定結果の評価は、事業者が行うもので、作業環境測定士でなければ行えないものではありません。選択肢4は誤りです。
