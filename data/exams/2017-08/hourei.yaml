  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多量の蒸気を使用して金属の洗浄の業務を行い、著しく多湿な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 鋲打ち機等圧縮空気により駆動される機械を取り扱い、著しい騒音を発する屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始する前に、当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 溶融ガラスからガラス製品を成型する業務を行い、暑熱な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  answer: 3
  choice_notes: []
  explanation: '第1種酸素欠乏危険作業では、その日の作業開始前に測定するのは**酸素**の濃度だけです。硫化水素の濃度もあわせて測定するのは、第2種酸素欠乏危険作業です。選択肢3は誤りです。


    平成30年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
