  stem: 事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。ただし、含有率及び量とは、1気圧、25℃とした場合の空気中に占める当該物質の容積の割合（ppm）及び空気1m³中に含まれる当該物質の質量をいうものとする。
  choices:
  - 室における二酸化炭素の含有率を1,000ppm以下としなければならない。
  - 室における一酸化炭素の含有率を50ppm以下としなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の事務室について、原則として、定期に、空気中の一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 空気調和設備を設けている場合は、室に供給される空気中のホルムアルデヒドの量を0.1mg以下としなければならない。
  - 燃焼器具を使用するときは、発熱量が著しく少ないものを除き、毎日、当該器具の異常の有無を点検しなければならない。
  answer: 1
