  stem: 法令に定める安全衛生教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、労働者の作業内容を変更したときは、原則として、その労働者に対し、その従事する業務に関する安全又は衛生のための教育を行わなければならない。
  - 事業者は、労働者を雇い入れたときは、原則として、その労働者に対し、その従事する業務に関する安全又は衛生のための教育を行わなければならない。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、原則として、その者に対し、特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、その科目についての特別教育を省略することができる。
  - 特別教育の講師は、法令で定める資格を有する者のうちから選任しなければならない。
  answer: 5
  choice_notes: []
  explanation: '特別教育の講師について、法令で資格は定められていません。選択肢5は誤りです。


