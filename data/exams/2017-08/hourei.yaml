  stem: 労働安全衛生規則の衛生基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、日常行う清掃のほか、大掃除を、6か月以内ごとに1回、定期に、統一的に行わなければならない。
  - 事業者は、労働者を常時就業させる場所の照明設備について、6か月以内ごとに1回、定期に、点検しなければならない。
  - 事業者は、動力により駆動されるハンマーを用いる金属の鍛造又は成型の業務を行い、著しい騒音を発する屋内作業場の施設を変更した場合には、遅滞なく、等価騒音レベルを測定しなければならない。
  - 事業者は、廃棄物の焼却施設において焼却灰を取り扱う業務に労働者を就かせるときは、原則として、当該労働者に対し、法令に定める科目について、特別教育を行わなければならない。
