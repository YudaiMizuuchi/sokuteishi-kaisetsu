  stem: 粉じん障害防止規則に関する次の記述のうち、誤っているものはどれか。ただし、同規則に定める適用除外及び特例はないものとする。
  choices:
  - 特定粉じん作業以外の粉じん作業を行う屋内作業場については、当該粉じん作業に係る粉じんを減少させるため、全体換気装置による換気の実施又はこれと同等以上の措置を講じなければならない。
  - 粉じん作業を行う屋内の作業場所については、毎日1回以上、清掃を行わなければならない。
  - 除じん装置を付設すべき局所排気装置の排風機については、原則として、除じんした後の空気が通る位置に設けなければならない。
  - 法令に基づき特定粉じん発生源に設けた局所排気装置については、原則として、1年以内ごとに1回、定期に、自主検査を行わなければならない。
  - 法令に基づき設置する除じん装置は、粉じんの種類がヒュームである場合には、サイクロンによる除じん方式、スクラバによる除じん方式又はこれらと同等以上の性能を有する除じん方式のものとしなければならない。
  answer: 5
  choice_notes: []
  explanation: '粉じん障害防止規則で、ヒュームの除じん装置は**ろ過除じん方式又は電気除じん方式**とされ、サイクロンやスクラバは、ヒューム以外の粉じんに認められる方式です。粉じんの種類がヒュームである場合に「サイクロン、スクラバ又は同等以上」でよいとする選択肢5は誤りです。


    根拠：粉じん障害防止規則第13条。'
  figures: []
  law_note: null
  _key_choice: 法令に基づき設置する除じん装置は、粉じんの種類がヒュームである場合には、サイクロンによる除じん方式、スクラバによる除じん方式又はこれらと同等以上の性能を有する除じん方式のものとしなければならない。
