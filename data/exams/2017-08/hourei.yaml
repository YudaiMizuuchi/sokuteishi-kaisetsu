  stem: 電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。ただし、放射線業務従事者は、緊急作業には従事しないものとする。
  choices:
  - 外部放射線による実効線量と空気中の放射性物質による実効線量との合計が3か月間につき1.3mSvを超えるおそれがある区域は、管理区域である。
  - 管理区域内において放射線業務従事者の受ける実効線量が5年間につき50mSvを超えず、かつ、1年間に20mSvを超えないようにしなければならない。
  - 放射線業務従事者の受ける等価線量のうち、眼の水晶体に受けるものについては、1年間につき150mSvを超えないようにしなければならない。
  - 放射線業務従事者の受ける等価線量のうち、皮膚に受けるものについては、1年間につき500mSvを超えないようにしなければならない。
  - 放射線業務以外の業務のため管理区域に一時的に立ち入る労働者についても、管理区域内において受ける外部及び内部被ばくによる線量を測定しなければならない。
  answer: 2
  choice_notes: []
  explanation: '放射線業務従事者の実効線量の限度は、**5年間につき 100 mSv**、かつ **1年間につき 50 mSv** です。「5年間につき 50 mSv、1年間に 20 mSv」とする選択肢2は誤りです。


    なお、選択肢3の眼の水晶体の等価線量限度（1年間につき 150 mSv）は、令和3年4月の改正前の値です。現在は、5年間につき 100 mSv、かつ1年間につき 50 mSv です。'
