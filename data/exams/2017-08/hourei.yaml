  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、深夜業を含む業務に常時従事する労働者に対し、原則として、6か月以内ごとに1回、定期に、法令で定める健康診断を行わなければならないが、その項目のうち、胸部エックス線検査については、1年以内ごとに1回、定期に、行えばよい。
  - 事業者は、労働者を海外に6か月以上派遣しようとするときは、原則として、あらかじめ、当該労働者に対し、一定の項目について、健康診断を行わなければならない。
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 事業者は、雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 常時50人以上の労働者を使用する事業者は、雇入時の健康診断を行ったときは、遅滞なく、雇入時健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  answer: 5
  choice_notes: []
  explanation: 雇入時の健康診断の結果は、労働者数にかかわらず、所轄労働基準監督署長に報告する必要はありません。選択肢5は誤りです。
