  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 溶融ガラスからガラス製品を成型する業務を行い、暑熱な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
