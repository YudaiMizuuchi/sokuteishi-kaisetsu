  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定とB測定を行った場合、A測定の第1評価値及びB測定の測定値が管理濃度に満たない単位作業場所の管理区分は、第1管理区分である。
  - A測定の第1評価値が管理濃度未満で、かつ、B測定の測定値が管理濃度の1.0倍以上1.5倍以下である単位作業場所の管理区分は、第2管理区分である。
  - B測定の測定値が管理濃度の1.5倍を超えるときは、A測定の第1評価値、第2評価値の値にかかわらず、第3管理区分に区分される。
  - 鉱物性粉じんの管理濃度は、遊離けい酸の含有率によって異なる。
  - 測定値が管理濃度の5分の1に満たない測定点がある単位作業場所にあっては、管理濃度の5分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  answer: 5
  choice_notes: []
  explanation: '測定値が管理濃度の **10分の1** に満たない測定点がある場合に、管理濃度の10分の1をその測定点の測定値とみなすことができます。5分の1とする選択肢5は誤りです。


    根拠：作業環境評価基準第2条第3項。'
  figures: []
