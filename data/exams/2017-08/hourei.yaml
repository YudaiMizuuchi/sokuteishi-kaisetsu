  - 第1類物質であるジクロルベンジジンを製造しようとする者は、あらかじめ、厚生労働大臣の許可を受けなければならない。
  - 第2類物質であるベンゼンを取り扱う屋内作業場については、6か月以内ごとに1回、定期に、当該物質の空気中における濃度を測定し、その記録を3年間保存しなければならない。
  - 第2類物質であるシアン化カリウムの粉じんが発散する屋内作業場に設けた局所排気装置については、原則として、1年以内ごとに1回、定期に、法定の項目について自主検査を行わなければならない。
  - 第3類物質であるアンモニアを取り扱う作業についても、試験研究のために取り扱うものを除き、作業主任者を選任しなければならない。
  - 第2類物質であるコールタールを取り扱う業務に常時従事する労働者に対し、雇入れ又は当該業務への配置替えの際及びその後6か月以内ごとに1回、定期に、法定の項目について医師による健康診断を行わなければならない。
  answer: 2
  choice_notes: []
  explanation: 'ベンゼンは特別管理物質なので、作業環境測定の記録は**30年間**保存します。3年間とする選択肢2は誤りです。


    根拠：特定化学物質障害予防規則第36条第3項。'
