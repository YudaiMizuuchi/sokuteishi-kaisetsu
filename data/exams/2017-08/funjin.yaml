  stem: 王水添加りん酸法による遊離けい酸分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 約200 mgの分析対象試料を精秤し、リン酸15 mL、王水5 mLを加えて加熱する。
  - 加熱開始直後から1分ごとに振とうし、所定時間加熱した後、電熱器から降ろし、約40秒間振とうする。
  - 加熱終了後、室温まで冷却し、温湯を加えてよく振とうし、その後希ホウフッ化水素酸を加え、1時間以上静置する。
