  stem: '密度2.6g/cm³、粒径10.0μmの球形粒子について、25℃の水中で終末沈降速度を測定して9.8×10⁻³cm/sを得た。この粒子を10℃の水中で終末沈降速度を測定した場合に期待される値に最も近いものは次のうちどれか。ただし、粒子の終末沈降速度はストークスの式に従い、水の密度と粘性係数は、25℃と10℃ではそれぞれ以下のとおりとする。


    温度／水の密度（g/cm³）／水の粘性係数（g/cm·s）


    25℃／0.9970／0.00895


    10℃／0.9997／0.01301'
  choices:
  - 6.7×10⁻³cm/s
  - 8.1×10⁻³cm/s
  - 1.2×10⁻²cm/s
  - 1.4×10⁻²cm/s
  - 1.6×10⁻²cm/s
  columns: null
  answer: 1
  choice_notes: []
  explanation: '終末沈降速度は、ストークスの式から、（ρ − ρ₀）／ηに比例します（粒径と粒子の密度は、同じです）。


    - 25℃：（2.6 − 0.9970）／0.00895 ≒ 179.1

    - 10℃：（2.6 − 0.9997）／0.01301 ≒ 123.0


    10℃の速度 ＝ 9.8 × 10⁻³ × 123.0／179.1 ≒ **6.7 × 10⁻³ cm/s**


    水温が低いと、粘性係数が大きくなり、沈降速度が小さくなります。よって（1）です。'
