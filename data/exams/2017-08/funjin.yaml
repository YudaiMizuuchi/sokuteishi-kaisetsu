  stem: 粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フロート型面積式流量計は、浮子とテーパー管との間隙の面積と、そこを流れる試料空気の体積流量が反比例することを利用した流量計である。
  - ローボリウムエアサンプラーに用いる流量計の較正に用いられる湿式ガスメーターは、通常、押し込み方式で使用する。
  - ハイボリウムエアサンプラーに表示される流量の較正は、ルーツメーターによって較正されたオリフィス流量計を用いてもよい。
  - メンブランフィルターを用いたサンプリングでは、捕集装置の圧力損失が大きくなるので、組み込まれた流量計の指示値は、真の流量より大きくなる。
  - 流量計の指示が脈動して読み取りが難しい場合は、流量計と吸引ポンプの間にコンデンサー(空気だめ)を設けるとよい。
