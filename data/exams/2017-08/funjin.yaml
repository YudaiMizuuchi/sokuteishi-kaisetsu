  stem: 慣性衝突式分粒装置（インパクター）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - インパクターには、円形ノズル式とスリット式とがある。
  - 円形ノズル式インパクターで分粒される粒子の粒径は、ノズルを通過する粒子の密度の1/2乗に比例する。
  - スリット式インパクターでは、慣性パラメータの値を0.71とすると50%分粒粒径が求められる。
  - ハイボリウムエアサンプラーの分粒装置として、スリット式インパクターが用いられている。
  - 吸入性粉じん濃度測定用インパクターは、50%分粒粒径を4.0μmとして設計・製作されている。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '円形ノズル式インパクターで分粒される粒子の粒径は、粒子の密度の**1/2乗に反比例**します（密度が大きいほど、慣性が大きく、小さい粒子まで捕集されます）。「1/2乗に比例する」とする選択肢2は誤りです。同じ趣旨の記述は、令和4年度第1回にも出題されています（出題実績）。


    インパクターには、円形ノズル式とスリット式があります。スリット式インパクターでは、慣性パラメータの値を0.71とすると、50％分粒粒径が求められます。吸入性粉じん濃度測定用インパクターは、50％分粒粒径を4.0 µmとして設計・製作されています。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
