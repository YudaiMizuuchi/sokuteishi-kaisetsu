  stem: 空気調和されている室内に設置されている電子天秤及びフィルターの秤量操作等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じん濃度の測定に用いる天秤は、読み取り限度0.01mg以下のものを使用する。
  - 天秤の水平が保たれていない状態で秤量すると、秤量値は真値より小さな値を示す。
  - 周囲温度より温度の高い試料を秤量すると、秤量値は真値より小さくなる。
  - 秤量しようとするフィルターは、汚染を防ぐために、秤量の直前までデシケーター等の乾燥剤入りの密閉された容器に保存する。
  - 捕集用フィルターは、同一の手順で秤量を繰り返し、連続した2回の秤量値が同一になった時の値をフィルターの秤量値とする。
  columns: null
  answer: 4
  choice_notes: []
  explanation: 'フィルターは、秤量する**少なくとも2時間前に、天びん室内に静置**して、天びん室の温度・湿度になじませます。「秤量の直前までデシケーター等の乾燥剤入りの密閉容器に保存する」とする選択肢4は誤りです。同じ記述は、令和3年度第1回にも出題されています（出題実績）。


    粉じん濃度の測定に使う天びんは、読み取り限度0.01 mg以下のものを使います。水平が保たれていないと、秤量値は真値より小さくなります。周囲温度より温度の高い試料を秤量すると、秤量値は真値より小さくなります。


