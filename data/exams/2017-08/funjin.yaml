  stem: 粉じんのろ過捕集方法等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多段平行板式分粒装置の50%分粒粒径は、吸引流量の1/2乗に比例する。
  - 慣性衝突式分粒装置の50%分粒粒径は、吸引流量を小さくすると小さくなる。
  - ろ過材を通して空気を吸引する場合、ろ過材の圧力損失は、流速にほぼ比例する。
  - メンブランフィルターは、フッ素樹脂加工グラスファイバーフィルターよりも粉じんの堆積による急速な圧力損失の上昇が起こる。
  - 吸引ポンプは、容量が規定流量より1.5倍程度大きく、静圧が26.7kPa以上のものを使用する。
