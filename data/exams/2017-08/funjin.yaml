  stem: 空気中の粒子のブラウン運動及び帯電粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は電界強度が大きいほど速い。
