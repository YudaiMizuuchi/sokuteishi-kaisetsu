  stem: '粉じんの光散乱に関する次の記述の［　］に入る語句として、正しいものは下のうちどれか。


    「粒子に光を照射したときの光散乱の強度は、［　］に影響されない。」'
  choices:
  - 光源の波長
  - 光源と受光部の配置
  - 粉じんの平均粒径
  - 粉じんの密度
  - 粉じんの屈折率
  columns: null
  answer: 4
  choice_notes: []
  explanation: '粒子に光を照射したときの光散乱の強度は、**光源の波長、光源と受光部の配置（散乱角度）、粉じんの平均粒径、粉じんの屈折率**に影響されます。**粉じんの密度**には、影響されません（光散乱は、粒子の光学的な性質によるもので、質量とは直接関係しません）。よって（4）です。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
