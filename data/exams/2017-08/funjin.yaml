  - 粒子のブラウン運動による拡散係数は、絶対温度に反比例する。
  - 微小粒子がブラウン運動で衝突・凝集して粒子の個数が減少する速度は、粒子の個数濃度によって変化する。
  - 流体とともに運動している粒子のブラウン運動による拡散効果は、粒径0.1μm以下の粒子で顕著となる。
