  stem: 空気中の粒子のブラウン運動及び帯電粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は電界強度が大きいほど速い。
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は粒径が小さいほど速い。
  - 粒子のブラウン運動による拡散係数は、絶対温度に反比例する。
  - 微小粒子がブラウン運動で衝突・凝集して粒子の個数が減少する速度は、粒子の個数濃度によって変化する。
  - 流体とともに運動している粒子のブラウン運動による拡散効果は、粒径0.1μm以下の粒子で顕著となる。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'ブラウン運動による粒子の**拡散係数**は、**絶対温度に比例**します。「絶対温度に反比例する」とする選択肢3は誤りです。同じ記述は、令和6年度第1回にも出題されています（出題実績）。


    粒子の帯電量が同じであれば、電界中での移動速度は、電界強度が大きいほど速く、粒径が小さいほど速くなります。微小粒子がブラウン運動で衝突・凝集して減る速度は、粒子の個数濃度によって変わります。ブラウン運動による拡散効果は、粒径0.1 µm以下の粒子で顕著になります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
