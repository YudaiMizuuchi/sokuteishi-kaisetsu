  stem: 圧電天秤方式の粉じん計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸引した粉じん粒子をコロナ放電により荷電してセンサーである圧電結晶板の上に捕集する。
  - 振動している圧電結晶板に粉じん粒子が付着すると、質量の増加分に比例して周波数が減少することを利用している。
  - 粉じん粒子がセンサー上に均一に捕集された場合、粒子質量1μgの増加に対する周波数変化は約180Hzである。
  - 併行測定で得られた粉じん濃度が1.5mg/m³で、圧電天秤方式の粉じん計の5回の平均濃度が1.1mg/m³の場合は、質量濃度変換係数は0.73である。
  - 圧電結晶板の上に捕集された粒子の質量が10μgを超えると、質量と周波数変化の直線関係は失われ始める。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '質量濃度変換係数は、併行測定で得た質量濃度を、相対濃度で除した値です。選択肢4の条件では、


    K ＝ 1.5 mg/m³ ÷ 1.1 mg/m³ ≒ **1.4**


    であり、「0.73」とする選択肢4は誤りです（0.73は、逆数の1.1／1.5の値です）。


    圧電天びん方式の粉じん計は、吸引した粉じんをコロナ放電で荷電して、圧電結晶板の上に捕集します。粒子の質量が増えると、周波数が質量の増加分に比例して減少します。均一に捕集された場合、質量1 µgに対して、周波数変化は約180 Hzです。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
