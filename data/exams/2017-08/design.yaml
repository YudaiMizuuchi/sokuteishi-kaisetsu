  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致している必要はない
  - 同一建物内にいくつかの単位作業場所を設定する場合、それぞれの単位作業場所の範囲が重なってもよい。
  - 平面的な場所だけでなく、装置の周囲に設けられた作業足場のような立体的な作業場も単位作業場所となり得る。
  - 単位作業場所の設定に当たっては、作業場内の気流、換気設備の稼働状況なども考慮すべきである。
  - 有機溶剤の発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  answer: 1
  choice_notes: []
  explanation: '連続する2作業日にわたって測定を行う場合は、2日とも**同じ範囲**の単位作業場所で測定します。範囲が違うと、2日分の結果をまとめて評価できないからです。「一致している必要はない」とする選択肢1は誤りです。


    令和元年度第2回・平成29年度第2回には、同一とするという正しい記述があります。'
  figures: []
