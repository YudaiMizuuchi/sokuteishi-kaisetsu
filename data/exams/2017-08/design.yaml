  stem: 光散乱方式の相対濃度計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 散乱光の強さは、吸入口から入る試料空気の吸引流量に影響されない。
  - 質量濃度変換係数（K）、相対濃度（R）及び質量濃度（C）の関係は、K＝R/Cで表される。
  - 感度較正には、0.3 µmのステアリン酸粒子が用いられる。
  - 質量濃度が同じであれば、粒径5μmの粉じん粒子の散乱光強度は、粒径0.3μmの粉じん粒子の散乱光強度より小さい。
  - 粉じんの発生源の近くでは質量濃度変換係数（K）の値は大きく、発生源から離れるに従ってKの値が小さくなる傾向がある。
  answer: 2
  choice_notes: []
  explanation: 質量濃度変換係数 K は、質量濃度 C を相対濃度 R で割ったもの（K ＝ C ÷ R）です。K ＝ R ÷ C とする選択肢2は、分子と分母が逆で誤りです。
  figures: []
