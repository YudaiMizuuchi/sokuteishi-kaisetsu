  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定は、始業直後にのみ有害物質の発散があるような特別の場合を除き、作業開始からおおむね1時間を経過した後に行う。
  - 過去に実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.5以下であることが明らかなときは、有害物質の濃度がほぼ均一であるとみなすことができる。
  - 単位作業場所の広さが、おおむね30m2以下の場合は、著しく狭い作業場とみなすことができる。
  - 単位作業場所における有害物質の濃度がほぼ均一であることが明らかなときは、測定点の間隔は、6mを超える等間隔で引いた縦の線と横の線との交点としてもよい。
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  answer: 2
  choice_notes: []
  explanation: '有害物質の濃度がほぼ均一であるとみなせるのは、過去の測定で幾何標準偏差がおおむね **1.2 以下**であることが明らかな場合です。1.5 以下とする選択肢2は誤りです。


    令和元年度第2回にも、同じ選択肢があります。'
