  stem: 25℃、1気圧における環境空気中のイソプロピルアルコール（C3H7OH）の体積分率が200ppmであるとき、その質量濃度（mg/m³）に最も近いものは、次のうちどれか。
  choices:
  - 50mg/m³
  - 90mg/m³
  - 250mg/m³
  - 490mg/m³
  - 980mg/m³
  answer: 4
  choice_notes: []
  explanation: 'ppm を mg/m³ に直すときは、ppm に分子量を掛けて 24.45 で割ります。イソプロピルアルコール（C₃H₇OH）の分子量は 60.1 です。


    C [mg/m³] ＝ 200 × 60.1 ÷ 24.45 ≒ 492


    よって、最も近いのは 490 mg/m³ です。'
  figures: []
  law_note: null
  _key_choice: 490 mg/m³
