  explanation: B 測定は、発散源に近接する場所で作業が行われる場合に、濃度が最も高くなると考えられる作業位置での気中濃度を測る「場」の測定です。局所的短時間の個人ばく露の評価のために行うものではないので、選択肢1は誤りです。
  figures: []
