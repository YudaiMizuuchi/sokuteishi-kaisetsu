  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 面積式流量計(ロータメータ)では、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より小さくなる。
  - 吸引流量が1L/min以下の流量計の較正には、石けん膜流量計を用いることができる。
  - 絞り式(オリフィス)流量計は、管内を流れる気体の中に置いたオリフィス板の上流側と下流側との間に生ずる圧力差が流量と一定の関係を示すことを利用した流量計である。
  - 湿式ガスメーターは、原則として、押し込み方式で使用する。
  - 石けん膜流量計は、所定の区間を石けん膜が移動する時間を測定して、所要時間とその区間の容積から流量を求めるものである。
  answer: 1
  choice_notes: []
  explanation: 面積式流量計では、捕集装置の圧力損失が大きくなるに従って、指示値は真の流量より**大きく**なります。「小さくなる」とする選択肢1は誤りです。
