  - 多段平行板式分粒装置を用いて鉱物性粉じん濃度を測定する場合、吸引流速が所定の値より大きいと測定値は低くなる。
  - 慣性衝突型の分粒装置を用いて鉱物性粉じんの濃度を測定する場合、吸引流速が所定の値より大きいと測定値は低くなる。
  - 捕集袋に採取した試料の濃度は、時間の経過とともに減衰することがある。
