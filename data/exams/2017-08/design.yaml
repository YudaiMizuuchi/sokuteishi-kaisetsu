  stem: 放射性物質を取り扱っている作業場において、取り扱い核種の濃度限度の10分の1の空気中放射能濃度を測定するための最小試料採取時間に最も近い値は次のうちどれか。ただし、取り扱い核種の濃度限度は8.0×10⁻⁷Bq/cm³、測定装置の検出下限計数率は3.0（s⁻¹）、測定装置の計数効率は40%、試料空気の吸引流量は80L/分、使用する捕集材の捕集率は100%とする。
  choices:
  - 90分
  - 110分
  - 160分
  - 12時間
  - 20時間
  answer: 5
  choice_notes: []
  explanation: '測りたい濃度の試料を採取したとき、計数率が検出下限計数率に届くまでの時間を求めます。


    測りたい濃度 ＝ 8.0 × 10⁻⁷ ÷ 10 ＝ 8.0 × 10⁻⁸ Bq/cm³、吸引流量 ＝ 80 L/min ≒ 1,333 cm³/s


    計数率 ＝ 8.0 × 10⁻⁸ × 1,333 × t × 1.00 × 0.40 ≒ 4.27 × 10⁻⁵ × t


    t ＝ 3.0 ÷ (4.27 × 10⁻⁵) ≒ 7.0 × 10⁴ 秒 ≒ 19.5 時間


    よって、最も近いのは（5）の 20 時間です。'
