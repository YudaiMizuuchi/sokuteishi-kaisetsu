  - 環境空気中の有害物質の濃度の分布は、多くの場合、対数正規分布に従う。
  - 正規分布では、平均値と標準偏差は互いに従属している。
  - 横軸に変数の対数をとったとき、対数正規分布の曲線の形は、幾何平均値を中心として左右対称になる。
  - 正規分布の算術平均と標準偏差をそれぞれx̄、σとすると、この分布に従う変数がx̄－2σからx̄＋2σの範囲に入る確率は、およそ95%である。
