  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定は、局所的短時間の個人ばく露の評価のために行う。
  - B測定は、測定時に労働者がいない場合でも、立ち入ることがあるならばその作業位置で測定を行う。
  - 発散源に近接する場所において作業が行われている単位作業場所では、B測定が必要である。
  - 有害物質の発散源とともに労働者が移動しながら行う作業がある場合には、作業位置の移動に沿ってB測定を行う。
  - 環境空気中の濃度が最大になると考えられる作業が、A測定の実施時間内に行われない場合には、B測定はA測定の実施時間とは別に、その作業が行われる時間に実施してもよい。
