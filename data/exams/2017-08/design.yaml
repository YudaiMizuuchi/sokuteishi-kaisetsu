  stem: 有害物質の物性等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 混合した有機溶剤から蒸発する蒸気の成分の組成比は、必ずしもその混合有機溶剤の混合割合とは一致しない。
  - 常温で固体であっても昇華性のある化学物質は、空気中では固体と気体の両方の形で存在することがある。
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度1g/cm³の球形粒子の直径である。
