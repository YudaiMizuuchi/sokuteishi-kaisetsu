  stem: 放射性物質を取り扱っている作業場において、取り扱い核種の濃度限度の10分の1の空気中放射能濃度を測定するための最小試料採取時間に最も近い値は次のうちどれか。ただし、取り扱い核種の濃度限度は8.0×10⁻⁷Bq/cm³、測定装置の検出下限計数率は3.0（s⁻¹）、測定装置の計数効率は40%、試料空気の吸引流量は80L/分、使用する捕集材の捕集率は100%とする。
