  stem: 作業環境中の放射性物質の試料採取方式に関する次の記述のうち、不適当なものはどれか。
  choices:
  - ゼネラルサンプリングは、放射性物質取扱室全体についての空気汚染の検出を目的とし、発生源の位置を確認するためのものではない。
  - セントラルサンプリングは、部屋ごとに空気中放射性物質濃度を測定し、測定データを集中管理する方式である。
  - ローカルサンプリングは、局所的に発生する空気汚染の検出及び室内の空気中放射性物質の濃度分布を知ることを目的とする。
  - スポットサンプリングは、空気汚染が発生するおそれのある特定の作業を行う際に実施する。
  - パーソナルサンプリングは、作業者が吸入する空気中の濃度を知るため、作業者の呼吸域の高さで、携帯型の個人サンプラでサンプリングする。
  columns: null
