  - 放射能は、物質中の原子核が単位時間に壊変する数で、単位はBqである。
  - 照射線量は、X線やγ線に照射された単位質量当たりの空気中で発生した電荷量で、単位はC·kg⁻¹である。
  - 吸収線量は、単位質量当たりに吸収された放射線のエネルギーで、単位はGy·kg⁻¹である。
  - 周辺線量当量率は、作業環境測定等に用いる1cm線量当量率で、単位はSv·h⁻¹である。
  - 放射能表面密度は、単位面積当たりの放射能で、単位はBq·cm⁻²である。
