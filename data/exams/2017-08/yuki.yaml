    捕集液に溶解させて捕集する場合は、捕集液を冷却すると、一般に捕集率を高められます。捕集袋は、5 L以上のものを使います。小型ガス吸収管では、流量が大きいほど、捕集率は低くなります。活性炭は、一般に無極性有機溶剤に対する吸着力が強く、n-ヘキサン、トルエンなどの捕集に適しています。


