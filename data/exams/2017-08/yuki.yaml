    キャピラリーカラム注入口には、不活性ライナーを使います。スプリット注入法では、試料の一部がカラムに導入されます。スプリットレス注入法では、一般に、カラムの初期温度を低く設定して、カラムの入口付近に試料を凝縮させます。


