  stem: ガスクロマトグラフ分析に用いられる検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 水素炎イオン化検出器（FID）は、水素炎を利用する方法で、水素炎中で燃焼し、イオン化する物質の測定に適している。
  - 電子捕獲検出器（ECD）は、放射性同位元素から放出されるβ線を利用する方法で、電子親和力の強い物質の測定に適している。
  - 炎光光度検出器（FPD）は、水素炎を利用する方法で、リンや硫黄を含む化合物の測定に適している。
  - アルカリ熱イオン化検出器（FTD）は、アルカリ金属塩を利用する方法で、リン化合物の測定に適している。
  - 光イオン化検出器（PID）は、赤外線を利用する方法で、赤外線でイオン化できる物質の測定に適している。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '**光イオン化検出器（PID）**は、**紫外線**でイオン化できる物質の測定に適した検出器です。「赤外線を利用する」とする選択肢5は誤りです。


