  stem: 環境空気中の有機溶剤の捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 捕集液に溶解させて捕集する場合は、捕集液を冷却すると、一般に捕集率を高めることができる。
  - 捕集袋は、5L以上のものでフッ素樹脂製バッグなどを用いる。
  - 真空捕集びんのコックには、グリースを塗って空気が漏れないようにする必要がある。
  - 小型ガス吸収管による有機溶剤蒸気の捕集では、流量が大きいほど捕集率は低くなる。
  - 活性炭は一般に無極性有機溶剤に対する吸着力が強く、n-ヘキサン、トルエンなどの捕集に適している。
