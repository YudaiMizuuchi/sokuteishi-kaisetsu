  stem: 固体捕集法に用いられる捕集剤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭は、窒素又は乾燥空気の加熱気流中で脱水したものを使用する。
  - 活性炭は、一般に、シリカゲルに比べて単位重量当たりの表面積が大きい。
  - シリカゲルは、水分含有率によって、測定対象物質の吸着容量に差が生じる。
  - ポーラスポリマービーズ(多孔性プラスチック)は反応性が高いので、試料の重合、酸化などが起こりやすい。
  - ポーラスポリマー捕集管に捕集した試料は、活性炭に比べて、加熱脱着が容易である。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '**ポーラスポリマービーズ**（多孔性プラスチック）は、**反応性が低い**ので、試料の重合や酸化が起こりにくい捕集剤です。「反応性が高いので、試料の重合、酸化などが起こりやすい」とする選択肢4は誤りです。同じ趣旨の記述は、令和4年度第1回にも出題されています（出題実績）。


    活性炭は、窒素または乾燥空気の加熱気流中で脱水したものを使い、シリカゲルに比べて、単位重量当たりの表面積が大きいです。シリカゲルは、水分含有率によって、吸着容量に差が生じます。ポーラスポリマー捕集管に捕集した試料は、活性炭に比べて、加熱脱着が容易です。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
