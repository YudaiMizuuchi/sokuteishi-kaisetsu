  stem: 22℃、100kPaにおいて、有機溶剤Aの蒸気を含む気体620cm³を、活性炭管に通してAを捕集した。活性炭管に通した後の気体の体積を32℃、110kPaにおいて測ったところ、550cm³であった。もとの気体中のAの体積分率として、正しい値に最も近いものは次のうちどれか。ただし、活性炭管の捕集率は0.90であり、気体は理想気体とする。
  choices:
  - '0.05'
  - '0.06'
  - '0.07'
  - '0.08'
  - '0.09'
  columns: null
  answer: 2
  choice_notes: []
  explanation: '活性炭管でAを捕集する前後の気体の物質量の差から、Aの量を求めます（気体の状態方程式 n ＝ PV／RT）。


    1. 捕集前の気体の物質量：n₁ ＝ 100 × 10³ Pa × 620 × 10⁻⁶ m³ ／（8.31 × 295）≒ 0.02529 mol

    2. 捕集後の気体の物質量：n₂ ＝ 110 × 10³ Pa × 550 × 10⁻⁶ m³ ／（8.31 × 305）≒ 0.02387 mol

    3. 活性炭管で捕集されたAの物質量：n₁ − n₂ ≒ 0.00142 mol

    4. 捕集率が0.90なので、もとの気体中のAの物質量：0.00142 ÷ 0.90 ≒ 0.00158 mol

    5. 体積分率：0.00158 ÷ 0.02529 ≒ **0.062**


    よって（2）の0.06です。'
