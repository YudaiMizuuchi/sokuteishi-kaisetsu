  stem: 混合有機溶剤について検知管法の使用が認められている場合において、トルエン、酢酸n-ブチル及びキシレンを含有する混合溶剤を使用している単位作業場所内の併行測定点におけるトルエン用検知管の測定値は、9.5ppmであった。一方、ガスクロマトグラフで分析した測定値は、トルエン5.0ppm、酢酸n-ブチル15ppm及びキシレン3.5ppmであった。換算値変換係数として、正しい値に最も近いものは次のうちどれか。なお、トルエン、酢酸n-ブチル及びキシレンの管理濃度は、それぞれ20ppm、150ppm及び50ppmである。
  choices:
  - 0.040ppm⁻¹
  - 0.041ppm⁻¹
  - 0.042ppm⁻¹
  - 0.043ppm⁻¹
  - 0.044ppm⁻¹
  columns: null
  answer: 5
  choice_notes: []
  explanation: "換算値変換係数は、併行測定で、**換算値を検知管の指示値で割って**求めます。\n\n1. 換算値（作業環境評価基準第2条第4項）＝ Σ（各成分の濃度／その管理濃度）\n ＝ 5.0／20 ＋ 15／150 ＋ 3.5／50 ＝ 0.25 ＋ 0.10 ＋ 0.07 ＝ 0.42\n2. 換算値変換係数 ＝ 0.42 ÷ 9.5 ppm ≒ 0.0442 ppm⁻¹\n\nよって（5）の0.044 ppm⁻¹です。\n\n（参考：『デザイン・サンプリングの実務（C・D測定編）』）"
