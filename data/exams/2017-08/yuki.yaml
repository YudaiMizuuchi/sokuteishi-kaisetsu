  stem: 次の有機溶剤のうち、密度が1g/cm³より大きく、管理濃度が10ppmであるものはどれか。
  choices:
  - シクロヘキサノン
  - N,N-ジメチルホルムアミド
  - クロロベンゼン
  - 二硫化炭素
  - アセトン
  columns: null
  answer: 3
  choice_notes: []
  explanation: '密度が1 g/cm³より大きく、管理濃度が10 ppmの有機溶剤を選びます。


    - シクロヘキサノン：密度約0.95、管理濃度25 ppm

    - N,N-ジメチルホルムアミド：密度約0.94、管理濃度10 ppm

    - **クロロベンゼン**：密度約1.11、管理濃度10 ppm → 条件に合います。

    - 二硫化炭素：密度約1.26、管理濃度1 ppm

    - アセトン：密度約0.79、管理濃度500 ppm


    よって（3）です。（密度は、一般的な化学便覧の概数です。）'
