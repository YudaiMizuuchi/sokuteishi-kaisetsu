  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は脂溶性が高いので、中枢神経系などの脂肪に富んだ組織に蓄積しやすい。
  - 化学物質の生物学的半減期とは、体内に吸収された化学物質の量が半分に減るのに要する時間である。
  - キシレンは、代謝されて、尿中にメチル馬尿酸として排泄される。
  - 多くの有機化合物は、腎臓での解毒作用により、代謝されて排泄される。
  - スチレンは、代謝されて、尿中にマンデル酸として排泄される。
  answer: 4
  choice_notes: []
  explanation: '多くの有機化合物は、**肝臓**で代謝されて、水に溶けやすい形になってから排泄されます。腎臓での解毒作用とする選択肢4は誤りです。


    平成29年度第2回にも、多くの有機化合物は肝臓で代謝される、という正しい記述があります。'
  figures: []
  law_note: null
  _key_choice: 多くの有機化合物は、腎臓での解毒作用により、代謝されて排泄される。
