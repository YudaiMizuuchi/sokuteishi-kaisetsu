  stem: 作業環境評価基準に定める「管理濃度」及び日本産業衛生学会の「許容濃度」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 管理濃度は、許容濃度の値、作業環境管理技術などを考慮して定められた指標である。
  - 許容濃度決定の際に考慮されるばく露濃度とは、呼吸用保護具を装着しない労働者が作業中に吸入するであろう空気中の有害物質の濃度である。
  - 許容濃度の数値は、物質の毒性の強さの相対的な尺度に用いることはできない。
  - 粉じんの管理濃度は、その粉じんに含まれる吸入性粉じんの含有率(%)を用いて算出される。
  - 許容濃度の数値を、労働の場以外での環境要因の許容限界値として用いてはならない。
  answer: 4
  choice_notes: []
  explanation: 粉じんの管理濃度は、その粉じんに含まれる**遊離けい酸の含有率**（％）を用いて算出します。吸入性粉じんの含有率とする選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: 粉じんの管理濃度は、その粉じんに含まれる吸入性粉じんの含有率（%）を用いて算出される。
