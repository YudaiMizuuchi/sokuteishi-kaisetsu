  explanation: '等価騒音レベルは、時間とともに変動する騒音のエネルギーを、測定時間で平均した値です。1,000 Hz と 4,000 Hz の音圧レベルの平均値ではないので、選択肢5は誤りです。


    1,000 Hz と 4,000 Hz は、健康診断の聴力検査で使う周波数です。'
