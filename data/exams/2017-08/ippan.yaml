  stem: 作業環境における有害要因による健康障害に関する次の記述のうち、正しいものはどれか。
  choices:
  - 電離放射線による中枢神経系障害は、確率的影響に分類され、被ばく線量がしきい値を超えると発生率及び重症度が線量に対応して増加する。
  - 熱痙攣は、高温環境下での労働において、皮膚の血管に血液がたまり、脳への血液の流れが少なくなることにより発生し、めまい、失神などの症状がみられる。
  - 金属熱は、金属の溶融作業などで発生する亜鉛、銅などのヒュームを吸入して発生する疾病で、悪寒、発熱、関節痛などの症状がみられる。
  - 凍瘡は、皮膚組織の凍結壊死を伴うしもやけのことで、0℃以下の寒冷下において発生する。
  - 潜水業務における減圧症は、浮上による急激な減圧に伴い、血液中に溶け込んでいた二酸化炭素が気泡となり、血管を閉塞したり組織を圧迫することにより発生する。
  answer: 3
  choice_notes: []
  explanation: '金属熱は、亜鉛や銅などのヒュームを吸入して起こる疾病で、悪寒、発熱、関節痛などの症状がみられます。よって（3）が正しいものです。


    中枢神経系障害は確定的影響（選択肢1は誤り）、めまい・失神は熱失神の症状（選択肢2は誤り）、凍瘡（しもやけ）と凍傷を混同した記述（選択肢4は誤り）、減圧症は窒素の気泡化による（選択肢5は誤り）です。


    凍瘡（しもやけ）は、凍結を伴わない寒冷による障害です。皮膚組織の凍結壊死を伴うのは凍傷なので、「凍結壊死を伴うしもやけ」とする選択肢4は誤りです。'
  figures: []
  law_note: null
  _key_choice: 金属熱は、金属の溶融作業などで発生する亜鉛、銅などのヒュームを吸入して発生する疾病で、悪寒、発熱、関節痛などの症状がみられる。
  columns: null
  review_note: 凍瘡（しもやけ）は凍結を伴わず、凍結壊死を伴うのは凍傷、という説明は、プロジェクトの教科書に記述がなく、未確認です（一般的な医学の知識による説明）。
