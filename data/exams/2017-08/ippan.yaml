  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 化学物質等によるリスクを見積もる方法において使用する情報の一つとして、生物学的モニタリングの結果がある。
  - 化学物質等によるリスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ず数値化する必要がある。
  - 化学物質等によるリスクの見積りには、化学物質等が当該業務に従事する労働者に危険を及ぼし、又は化学物質等により当該労働者の健康障害を生ずるおそれの程度(発生可能性)及び当該危険又は健康障害の程度(重篤度)を考慮する方法がある。
  - 化学物質等の有害性に応じた有効な保護具の使用によるリスク低減措置は、機械設備等の密閉化等の衛生工学的対策、作業手順の改善等の管理的対策など、より優先順位の高い対策を講じても十分にリスクを低減できない場合に行うべき対策である。
  - 化学反応のプロセス等の運転条件の変更、取り扱う化学物質等の形状の変更等によるリスクの低減措置は、機械設備等の防爆構造化、局所排気装置の設置等の対策よりも優先して実施されるべきである。
  answer: 2
  choice_notes: []
  explanation: 'リスクの見積りは、マトリクス法や枝分かれ図を用いる方法など、相対的な尺度で行うこともでき、必ず数値化する必要はありません。選択肢2は誤りです。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(1)。平成29年度第2回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 化学物質等によるリスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ず数値化する必要がある。
