  stem: 労働衛生保護具に関する次の記述のうち、正しいものはどれか。
  choices:
  - 防じんマスクの使用後、再使用のためには、圧縮空気を用いて、ろ過材上に付着した粉じんを吹き飛ばすことによって、十分払い落とす必要がある。
  - 保護めがねは、紫外線など有害な光線による眼の障害を防ぐために使用する。
  - 型式検定合格標章のある防じんマスクでも、ヒュームのような微細な粒子に対しては無効である。
  - 防じんマスクは作業に適したものを選択し、顔面とマスクの面体の高い密着性が要求される有害性の高い物質を取り扱う作業については、取り替え式のものを選ぶ。
  - 送気マスクは、清浄な空気をボンベに詰めたものを空気源として作業者に供給する自給式呼吸器である。
  answer: 4
  choice_notes: []
  explanation: '防じんマスクは作業に適したものを選び、顔面とマスクの高い密着性が求められる有害性の高い物質を取り扱う作業では、取替え式のものを選びます。よって（4）が正しいものです。


    圧縮空気で粉じんを吹き飛ばしてはいけない（選択肢1）、保護めがねは主に飛来物から眼を守るもので有害光線には遮光保護具を使う（選択肢2）、型式検定合格品はヒュームにも有効（選択肢3）、送気マスクは自給式ではない（選択肢5）です。'
