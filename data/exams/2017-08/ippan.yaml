  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - n-ヘキサンは、多発性神経炎を起こす。
  - ヒ素中毒では、角化症、黒皮症などの皮膚障害、末梢神経障害などがみられる。
  - フッ化水素による中毒では、脳神経細胞が侵され、幻覚、錯乱などの精神障害がみられる。
  - シアン化水素は、体の細胞内の酸素の利用を障害し、呼吸困難や呼吸麻痺を起こす。
  - 一酸化炭素中毒では、血液中のヘモグロビンと一酸化炭素が強く結合し、体内の各組織が酸素欠乏状態を起こす。
  answer: 3
  choice_notes: []
  explanation: 幻覚や錯乱などの精神障害は、二硫化炭素や金属水銀などの中毒でみられるもので、フッ化水素の中毒の特徴ではありません。フッ化水素の主な健康障害は、皮膚や粘膜の深い化学熱傷と、慢性の骨・歯の障害です。選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: フッ化水素による中毒では、脳神経細胞が侵され、幻覚、錯乱などの精神障害がみられる。
