  stem: 化学物質等の性状及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 沸点の低い有機溶剤は、常温で飽和蒸気圧が高く、蒸発速度も大きい傾向がある。
  - シンナーは、一般に、複数の有機溶剤を混合したもので、成分である有機溶剤の種類やその成分比は様々である。
  - ミストの粒径は、一般に、ヒュームの一次粒子の粒径より大きい。
  - 空気中に浮遊する粉じんは、粒径が同じであれば、種類が異なっていてもその沈降速度は変わらない。
  - 金属などの蒸気が、空気中で固体の微粒子となったものをヒュームという。
  answer: 4
  choice_notes: []
  explanation: '粉じんの沈降速度は、粒径だけでなく、粒子の**密度**によっても変わります（密度が大きいほど速い）。「種類が異なっていても沈降速度は変わらない」とする選択肢4は誤りです。


    粒径が同じでも密度が違えば沈み方が違うので、粒子の大きさを沈み方で表す空気力学相当径が使われます。'
  figures: []
