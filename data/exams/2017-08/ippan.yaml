  stem: 厚生労働省の「職場における腰痛予防対策指針」に基づく、重量物取扱い作業における腰痛予防対策に関する次の記述のうち、不適当なものはどれか。
  choices:
  - 適切な動力装置等による自動化や、台車、補助機器の使用等により、人力の負担を軽減する。
  - 満18歳以上の男子労働者が人力のみで取り扱う物の重量は、体重の60%以下となるようにする。
  - 取り扱う物の重量を明示し、著しく重心の偏っている荷物は、その旨を明示する。
  - 重量物を取り扱うときは、急激な身体の移動をなくし、前屈やひねり等の不自然な姿勢はとらず、かつ、身体の重心の移動を少なくする等腰部に負担をかけない姿勢で行う。
  - 重量物を持ち上げるときは、身体を対象物に近づけ、重心を低くするような姿勢をとる。
  answer: 2
  choice_notes: []
  explanation: '満18歳以上の男子労働者が人力のみで取り扱う物の重量は、体重のおおむね **40 ％ 以下**となるようにします。60 ％ 以下とする選択肢2は不適当です。


    根拠：職場における腰痛予防対策指針。女子労働者は、さらに男性が取り扱える重量の60％位までとされています。'
