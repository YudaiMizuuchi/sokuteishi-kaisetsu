  stem: 厚生労働省の「VDT作業における労働衛生管理のためのガイドライン」に基づく対応に関し、次のうち、不適当なものはどれか。
  choices:
  - ディスプレイ画面上における照度及びキーボード上における照度を400ルクスにしている。
  - 反射防止型ディスプレイは使用していないが、間接照明を用いてグレアを防いでいる。
  - ディスプレイは、おおむね30cm以上の視距離が確保できるようにし、画面の上端が眼の高さより上になるようにしている。
  - 単純入力型及び拘束型に該当するVDT作業では、一連続作業時間を50分間とし、次の連続作業までの間に15分間の作業休止時間を設けている。
  - 単純入力型のVDT作業を1日4時間以上行っている労働者のVDT作業健康診断において、視力検査、上肢の運動機能検査などを行っている。
  answer: 3
  choice_notes: []
  explanation: ディスプレイは、おおむね **40 cm 以上**の視距離を確保し、画面の上端が眼と同じ高さか、やや**下**になるようにします。「30 cm 以上」「眼の高さより上」とする選択肢3は不適当です。
  figures: []
