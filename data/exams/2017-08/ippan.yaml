  stem: '次の記述の㋑から㋩の［　］に入る用語の組合せとして、正しいものは下のうちどれか。


    暑熱環境による熱ストレスの評価を行うための指標であるWBGT（湿球黒球温度（単位：℃））は、次の式により算出される。


    屋内の場合及び屋外で太陽照射のない場合　WBGT＝0.7×［㋑］＋0.3×［㋺］


    屋外で太陽照射のある場合　WBGT＝0.7×［㋑］＋0.2×［㋺］＋0.1×［㋩］'
  choices:
  - 黒球温度 ／ 実効温度 ／ 自然湿球温度
  - 黒球温度 ／ 自然湿球温度 ／ 乾球温度
  - 自然湿球温度 ／ 黒球温度 ／ 乾球温度
  - 自然湿球温度 ／ 乾球温度 ／ 黒球温度
  - 実効温度 ／ 自然湿球温度 ／ 黒球温度
  answer: 3
  choice_notes: []
  explanation: WBGT は、屋内や日射のない屋外では「0.7 × 自然湿球温度（㋑）＋ 0.3 × 黒球温度（㋺）」、日射のある屋外では「0.7 × 自然湿球温度 ＋ 0.2 × 黒球温度 ＋ 0.1 × 乾球温度（㋩）」で求めます。よって（3）が正しい組合せです。
