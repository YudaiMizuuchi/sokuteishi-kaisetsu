  stem: 酸素欠乏症、硫化水素中毒などに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 硫化水素は、無色、腐卵臭の刺激性の気体で、高濃度では、意識消失、呼吸麻痺などが生じる。
  - 第一鉄塩類を含有している地層に接するたて坑の内部での作業では、酸素欠乏症の危険がある。
  - 汚水その他腐敗しやすい物質を入れてある槽の内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  - 酸素濃度の測定では、測定値の幾何平均を求めて酸素欠乏の状態の有無を判定する。
  - 酸素欠乏症発生時の救助活動では、救出作業に従事する労働者に空気呼吸器、酸素呼吸器又は送気マスクを使用させる必要がある。
  answer: 4
