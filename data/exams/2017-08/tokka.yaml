  stem: ガスクロマトグラフ分析法に用いる充塡カラムのコンディショニング（エージング）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キャリアガスを流して行う。
  - 検出器に接続しないで行う。
  - 室温からカラム最高使用温度まで速やかに昇温させて行う。
  - 通常、一昼夜程度行う。
  - ベースラインが安定するまで行う。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '充填カラムのコンディショニング（エージング）は、室温から、**徐々に**昇温させて行います。「室温からカラム最高使用温度まで速やかに昇温させて行う」とする選択肢3は誤りです。急に昇温すると、固定相液体が突沸したり、劣化したりするおそれがあります。


    キャリアガスを流して行い、検出器に接続しないで行います（検出器の汚染を防ぐためです）。通常、一昼夜程度、ベースラインが安定するまで行います。


    （参考：『機器分析の実務』）'
