  choice_notes: []
  explanation: 'キャピラリーカラムでは、**液相の膜厚が厚い**ほど、試料の保持が強くなり、**低沸点の物質**の分析に適します。高沸点物質の分析には、膜厚が薄いカラムを使います。「液相の膜厚が厚いほど、高沸点物質の分析に適している」とする選択肢5は誤りです。


    キャピラリーカラムは、混合有機溶剤の分析に有効です。FIDを使う場合は、検出器部にメイクアップガスを追加します。キャリアガスは、窒素よりヘリウムを使うほうが、理論段数が大きくなります。試料負荷量が小さいので、多量の試料を導入できません。


