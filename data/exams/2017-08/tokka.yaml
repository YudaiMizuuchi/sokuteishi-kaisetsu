    エチルベンゼンの捕集は、直接捕集法でもできます。活性炭管を使う固体捕集法では、0.2 L/minの流量で吸引し、活性炭からの脱着には、二硫化炭素を使います。石油系合成（球状）活性炭管に捕集した試料は、捕集後2週間程度保存できます。


