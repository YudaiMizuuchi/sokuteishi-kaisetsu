  stem: ガスクロマトグラフ分析法による環境空気中のエチルベンゼン濃度の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - エチルベンゼンの捕集は、直接捕集法で行うことができる。
  - 活性炭管を用いた固体捕集法では、0.2L/minの流量で試料空気を吸引する。
  - 活性炭からの脱着には、二硫化炭素が用いられる。
  - 石油系合成（球状）活性炭管で捕集した試料は、捕集後2週間程度保存できる。
  - 検出器には、電子捕獲検出器（ECD）を用いる。
