  choice_notes: []
  explanation: '**ホルムアルデヒド**は、水素炎イオン化検出器（FID）では**検出されません**（FIDは、ホルムアルデヒドやギ酸などを検出できません）。「ホルムアルデヒド／FID」とする選択肢2は不適切です。同じ問題は、令和3年度第1回にも出題されています（出題実績）。


    アクリルアミドはFTD、MOCAはECD、o-フタロジニトリルは質量分析器（MS）、硫酸ジメチルは炎光光度検出器（FPD）で分析します。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
