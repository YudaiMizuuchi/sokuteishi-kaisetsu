  stem: 環境空気（25℃、1気圧）中のシアン化水素濃度を液体捕集法－吸光光度分析法により測定した。ミゼットインピンジャーに捕集液10mLを入れ、シアン化水素を含む環境空気を、流量0.50L/minで15分間吸引し、シアン化水素を捕集した。捕集後の捕集液10mLのうちの2mLを取り、これに必要な試薬を加え、発色操作を行い15.2mLの最終試料液を調製した。この最終試料液中のシアン化物イオン（CN⁻）の濃度を測定したところ、0.31μg/mLであった。この環境空気中のシアン化水素濃度に最も近いものは、次のうちどれか。ただし、捕集率は100%とする。
  choices:
  - 1ppm
  - 2ppm
  - 3ppm
  - 4ppm
  - 5ppm
  columns: null
  answer: 3
  choice_notes: []
  explanation: '次の順で計算します。


    1. 最終試料液15.2 mL中のシアン化物イオン：0.31 µg/mL × 15.2 mL ＝ 4.71 µg

    2. 捕集液10 mL全体の量（10 mLのうち2 mLを使ったので、5倍）：4.71 × 10／2 ≒ 23.6 µg

    3. 物質量：23.6 µg ÷ 26.02 g/mol（CN⁻）≒ 0.906 µmol

    4. 気体の体積（25℃、1気圧）：0.906 × 10⁻⁶ × 24.45 ≒ 2.21 × 10⁻⁵ L

    5. 吸引した空気の量：0.50 L/min × 15 min ＝ 7.5 L

    6. 濃度：2.21 × 10⁻⁵ ÷ 7.5 ≒ 2.95 × 10⁻⁶ ＝ **約3 ppm**


    よって（3）です。'
