  stem: 蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 蛍光の波長と強度をプロットした図を蛍光スペクトルと呼ぶ。
  - 蛍光の極大波長は、励起光の波長よりも短波長側に現れる。
  - 蛍光強度と濃度との直線関係は、低濃度範囲で成立する。
  - 蛍光の極大波長は、励起光の波長を変えても変わらない
  - 励起光の波長は、溶媒のラマン光が妨害とならないように選択する。
  columns: null
