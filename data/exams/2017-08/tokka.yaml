  stem: ある化合物を含む水溶液の濃度を吸光光度分析法で測定したところ、測定波長における透過率は50%であった。その波長におけるモル吸光係数を8.26×10³cm⁻¹·mol⁻¹·L、セルの光路長を1.0cmとすると、この化合物のモル濃度に最も近いものは次のうちどれか。ただし、log₁₀2＝0.301とする。
  choices:
  - 1.8×10⁻⁵mol·L⁻¹
  - 3.6×10⁻⁵mol·L⁻¹
  - 6.1×10⁻⁵mol·L⁻¹
  - 7.3×10⁻⁵mol·L⁻¹
  - 8.3×10⁻⁵mol·L⁻¹
  columns: null
  answer: 2
  choice_notes: []
  explanation: '吸光度 A ＝ −log₁₀（透過率）です。透過率が50％（0.5）のとき、


    A ＝ −log₁₀0.5 ＝ log₁₀2 ＝ 0.301


    ランベルト・ベールの法則 A ＝ ε・c・l から、


    c ＝ A／（ε・l）＝ 0.301／（8.26 × 10³ × 1.0）≒ 3.6 × 10⁻⁵ mol/L


    よって（2）です。'
  figures: []
