  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 逆相クロマトグラフ法は、順相クロマトグラフ法よりも、分離可能な化合物の種類が多い。
  - 紫外可視吸光光度検出器は、不飽和炭化水素の検出に使用できる。
  - 蛍光光度検出器は、紫外可視吸光光度検出器よりも、選択性が高い。
  - イオン性化合物を分析する際には、移動相に緩衝液を加えることがある。
  - 逆相クロマトグラフ法は、固定相を高極性、移動相を低極性で行う。
