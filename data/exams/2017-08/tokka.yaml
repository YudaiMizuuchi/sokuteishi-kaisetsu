  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸光度は、試料液の濃度と液層の長さの積に比例する。
  - 発色試薬には、無機試薬と有機試薬がある。
  - 着色液は、時間の経過とともに退色することがある。
  - 試料液を透過した光の強さは、試料液の濃度に比例する。
  - ガラス製のセルは、紫外部の光を吸収する。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '吸光光度分析法で、試料液を透過した光の強さは、試料液の濃度が増加するとともに、**指数関数的に減少**します。濃度に比例するのは、透過光の強さではなく、吸光度です。「試料液を透過した光の強さは、試料液の濃度に比例する」とする選択肢4は誤りです。同じ記述は、令和4年度第1回にも出題されています（出題実績）。


    吸光度は、試料液の濃度と液層の長さの積に比例します。発色試薬には、無機試薬と有機試薬があります。着色液は、時間の経過とともに退色することがあります。ガラス製のセルは、紫外部の光を吸収します。


    （参考：『機器分析の実務』）'
