  stem: 環境空気（25℃、1気圧）中のシアン化水素濃度を液体捕集法－吸光光度分析法により測定した。ミゼットインピンジャーに捕集液10mLを入れ、シアン化水素を含む環境空気を、流量0.50L/minで15分間吸引し、シアン化水素を捕集した。捕集後の捕集液10mLのうちの2mLを取り、これに必要な試薬を加え、発色操作を行い15.2mLの最終試料液を調製した。この最終試料液中のシアン化物イオン（CN⁻）の濃度を測定したところ、0.31μg/mLであった。この環境空気中のシアン化水素濃度に最も近いものは、次のうちどれか。ただし、捕集率は100%とする。
  choices:
  - 1ppm
  - 2ppm
  - 3ppm
  - 4ppm
  - 5ppm
