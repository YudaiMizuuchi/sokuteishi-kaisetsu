  stem: ある化合物を含む水溶液の濃度を吸光光度分析法で測定したところ、測定波長における透過率は50%であった。その波長におけるモル吸光係数を8.26×10³cm⁻¹·mol⁻¹·L、セルの光路長を1.0cmとすると、この化合物のモル濃度に最も近いものは次のうちどれか。ただし、log₁₀2＝0.301とする。
