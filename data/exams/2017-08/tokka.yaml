  stem: キャピラリガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 混合有機溶剤の分析に有効である。
  - 水素炎イオン化検出器（FID）を用いる場合は、検出器部にメイクアップガスを追加する。
  - キャリアガスとしては、窒素よりヘリウムを使用する方が理論段数が大きい。
  - 試料負荷量が小さいため、多量の試料を導入することができない。
  - 液相の膜厚が厚いほど、高沸点物質の分析に適している。
  columns: null
