  - ホルムアルデヒド ／ 水素炎イオン化検出器（FID）
  - 3,3'-ジクロロ-4,4'-ジアミノジフェニルメタン（MOCA） ／ 電子捕獲検出器（ECD）
  - o-フタロジニトリル ／ 質量分析器（MS）
  - 硫酸ジメチル ／ 炎光光度検出器（FPD）
