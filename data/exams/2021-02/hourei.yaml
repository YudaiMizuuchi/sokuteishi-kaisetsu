  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 鉱物性粉じんに係る単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、相対濃度指示方法のみによる測定が認められている。
  - 第1種酸素欠乏危険作業に係る作業場における酸素濃度測定の測定点は、当該作業場における空気中の酸素濃度の分布状況を知るために適当な位置に、5以上としなければならない。
  - 騒音の測定点は、原則として、単位作業場所の床面上に 6 m 以下の等間隔で引いた縦の線と横の線との交点の床上 120 cm 以上 150 cm 以下の位置としなければならない。
  - ろ過捕集方法に用いるろ過材は、0.3 μm の粒子を 95 % 以上捕集する性能を有するものに限られる。
  answer: 2
  choice_notes: []
  explanation: '鉱物性粉じんの濃度の測定で相対濃度指示方法を用いるときは、原則として、ろ過捕集方法と重量分析方法による併行測定を行って質量濃度変換係数を求めます。単位作業場所が著しく狭く濃度がほぼ均一であれば相対濃度指示方法のみの測定が認められる、という定めではないので、選択肢2は誤りです。


    「著しく狭く、かつ濃度がほぼ均一」は、A 測定の測定点を5未満にできる条件です。別の規定の条件を組み合わせた誤りです。


    根拠：作業環境測定基準第2条第1項第4号ロ（相対濃度指示方法は「当該単位作業場所における一以上の測定点において」ろ過捕集方法と重量分析方法を同時に行う場合に限る）。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんに係る単位作業場所が著しく狭く、かつ、鉱物性粉じんの濃度がほぼ均一であることが明らかなときは、相対濃度指示方法のみによる測定が認められている。
