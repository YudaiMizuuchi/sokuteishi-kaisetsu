  stem: 法令に基づく安全又は衛生のための教育に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 職長等の教育の事項の全部又は一部について十分な知識及び技能を有していると認められる者については、当該事項に関する教育を省略することができる。
  - 特別教育を行ったときは、当該特別教育の受講者、科目等の記録を作成して、これを3年間保存しておかなければならない。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、原則として、特別教育を行わなければならない。
  - 労働者の作業内容を変更したときは、その労働者に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 特定化学物質を取り扱う業務に労働者を就かせるときは、原則として、特別教育を行わなければならない。
  answer: 5
  choice_notes: []
  explanation: '特定化学物質を取り扱う業務は、特別教育の対象ではありません。選択肢5は誤りです。


    特定化学物質の業務は、技能講習を修了した特定化学物質作業主任者を選任して管理します。酸素欠乏危険作業は特別教育の対象です（選択肢3）。'
  figures: []
  law_note: null
  _key_choice: 特定化学物質を取り扱う業務に労働者を就かせるときは、原則として、特別教育を行わなければならない。
