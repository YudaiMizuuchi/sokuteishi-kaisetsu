  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、指定作業場の作業環境測定結果についての作業環境評価基準に基づく管理区分の決定は、作業環境測定士ではない者に行わせることができる。
  - 事業者は、放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
  - 第2種作業環境測定士は、指定作業場についての作業環境測定の業務のうち、簡易測定機器以外の機器を用いて行う分析の業務を行うことができない。
  - 作業環境測定士が、作業環境測定の実施に関し虚偽の測定結果を表示したときは、その登録を取り消し、又は期間を定めて指定作業場についての作業環境測定の業務の停止等を命ぜられることがある。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングの業務を行うことができる。
  answer: 2
  choice_notes: []
  explanation: '管理区域の外部放射線による線量当量率などの測定は、指定作業場の作業環境測定ではないので、作業環境測定士に行わせなければならないものではありません。選択肢2は誤りです。


    令和5年度第2回でも、同じ論点が出題されています。


    根拠：作業環境測定法施行令第1条第1項、作業環境測定法施行規則第1条。放射線業務に係る指定作業場は、電離放射線障害防止規則第53条第2号（放射性物質取扱作業室）と第2号の2（事故由来廃棄物等取扱施設）の作業場に限られ、管理区域の外部放射線の測定（同条第1号）は含まれていません。'
  figures: []
  law_note: null
  _key_choice: 事業者は、放射線業務を行う作業場のうち、管理区域に該当する部分についての外部放射線による線量当量率又は線量当量の測定は、作業環境測定士に行わせなければならない。
