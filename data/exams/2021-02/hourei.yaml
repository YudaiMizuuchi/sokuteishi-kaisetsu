  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、定期健康診断項目のうち、貧血検査、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 事業者は、雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 事業者は、労働者を海外に6か月以上派遣しようとするときは、原則として、あらかじめ、当該労働者に対し、一定の項目について、健康診断を行わなければならない。
  - 事業者は、弗化水素のガスを発散する場所における業務に常時従事している労働者に対し、6か月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。
  - 常時50人以上の労働者を使用する事業者は、雇入時の健康診断を行ったときは、遅滞なく、雇入時の健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  answer: 5
