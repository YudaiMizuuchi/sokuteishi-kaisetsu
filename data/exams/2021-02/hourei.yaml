  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定とB測定を行った場合、A測定の第1評価値及びB測定の測定値が管理濃度に満たない単位作業場所の管理区分は第1管理区分である。
  - A測定の第2評価値が管理濃度を超える単位作業場所の管理区分は、B測定の測定値に関係なく、第3管理区分である。
  - A測定とB測定を行った場合、B測定の測定値がA測定の第1評価値の1.5倍を超えている単位作業場所の管理区分は、第3管理区分である。
  - 2種類以上の有機溶剤を含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を当該測定点における測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  answer: 3
