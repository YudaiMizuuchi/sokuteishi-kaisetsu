  stem: 労働安全衛生規則の衛生基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 硫化水素濃度が 10 ppm を超える場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 労働者を常時就業させる屋内作業場の気積を、設備の占める容積及び床面から 4 m をこえる高さにある空間を除き、労働者1人について、10 m³以上としなければならない。
  - 労働者を常時就業させる屋内作業場において、換気設備を設けていないときは、窓その他の開口部の直接外気に向かって開放することができる部分の面積が常時床面積の20分の1以上になるようにしなければならない。
  - 強烈な騒音を発する場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 労働者を常時就業させる屋内作業場の気温が 10 ℃ 以下であるときは、換気に際し、労働者を 1 m/s 以上の気流にさらしてはならない。
  answer: 4
  choice_notes: []
  explanation: '強烈な騒音を発する場所については、標識によってその旨を明示する等の措置を講じることとされていますが、関係者以外の立入禁止までは定められていません。選択肢4は誤りです。


    立入禁止が定められているのは、硫化水素 10 ppm 超、酸素 18 ％ 未満、炭酸ガス 1.5 ％ 超、多量の高熱物体を取り扱う場所などです（選択肢1）。'
  figures: []
