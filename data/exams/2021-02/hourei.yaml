  stem: 作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 焼入炉、加熱炉等により鉱物、金属又はガラスを加熱する業務を行う屋内作業場については、半月以内ごとに1回、定期に、気温、湿度及びふく射熱を測定しなければならない。
  - びょう打ち機、はつり機等圧縮空気により駆動される機械又は器具を取り扱う業務を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の事務室については、原則として、1か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温、外気温並びに相対湿度を測定しなければならない。
  - 多量の蒸気を使用する金属又は非金属の洗浄又はめっきの業務を行う屋内作業場については、半月以内ごとに1回、定期に、気温及び湿度を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
