  stem: 労働衛生管理体制に関する次の記述のうち、誤っているものはどれか。ただし、衛生管理者の選任の特例はないものとする。
  choices:
  - 事業者は、常時300人以上の労働者を使用する製造業の事業場においては、総括安全衛生管理者を選任しなければならない。
  - 事業者は、総括安全衛生管理者には、当該事業場においてその事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
  - 事業者は、衛生管理者を選任すべき事由が発生した場合は、その日から14日以内に選任しなければならない。
  - 常時1,000人を超える労働者を使用する事業場では、衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に応じて、衛生委員会又は安全衛生委員会を設けなければならない。
  answer: 2
  choice_notes: []
  explanation: '総括安全衛生管理者には、その事業場で事業の実施を統括管理する者（工場長など）を充てなければなりません。「これに準ずる者」を充てることはできないので、選択肢2は誤りです。


    「これに準ずる者」が出てくるのは、衛生委員会の議長（総括安全衛生管理者、または事業の実施を統括管理する者もしくはこれに準ずる者から指名）の規定です。'
  figures: []
  law_note: null
  _key_choice: 事業者は、総括安全衛生管理者には、当該事業場においてその事業の実施を統括管理する者又はこれに準ずる者をもって充てなければならない。
