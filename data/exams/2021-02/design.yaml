  stem: 有害物質の物性等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 金属の蒸気は、空気中で冷却され、酸化物などの微細な粒子になる。
  - 固体が液体を経ずに、直接気体になることを昇華という。
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度 1 g･cm⁻³ の球形粒子の直径である。
  - 有機溶剤の蒸気は、密度が空気より小さいため、室内では天井付近の上層に滞留しやすい。
  - アルコール系の有機溶剤は、一般に極性が大きい。
  answer: 4
  choice_notes: []
  explanation: '有機溶剤の蒸気は、ほとんどが空気より分子量が大きく、密度が空気より**大きい**ので、床に近い低いところにたまりやすくなります。「天井付近の上層に滞留しやすい」とする選択肢4は誤りです。


    有機溶剤の局所排気で下方吸引型のフードが有効なことが多いのも、蒸気が下にたまりやすいためです。'
  figures: []
  law_note: null
