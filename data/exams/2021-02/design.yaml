  stem: 有害物質のA測定における測定点の位置又は数に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  - 有害物質の発生源の間隔が等間隔で配置されている場合は、測定点の縦又は横の線の間隔が発生源の間隔と一致しないようにする。
  - 測定点の高さの範囲は、床上 120 cm 以上 150 cm 以下である。
  - 測定点を決めるために引いた縦の線と横の線との交点のうち、生産設備などと重なり労働者の呼吸域とならない交点は、これを測定点から除く。
  - 単位作業場所における有害物質の濃度がほぼ均一であることが明らかなときは、測定点は、6 m を超える等間隔で引いた縦の線と横の線との交点とすることができる。
  answer: 3
  choice_notes: []
  explanation: 'A 測定の測定点の高さは、床上 **50 cm 以上 150 cm 以下**です。120 cm 以上 150 cm 以下とする選択肢3は誤りです。


    120〜150 cm は、騒音の測定点の高さです。有害物質と騒音で、測定点の高さが違う点を押さえておきましょう。'
  figures: []
  law_note: null
  _key_choice: 測定点の高さの範囲は、床上120cm以上150cm以下である。
