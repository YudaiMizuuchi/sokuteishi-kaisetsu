  stem: 騒音の測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点の高さは床上 120 cm 以上 150 cm 以下の範囲とし、マイクロホンの向きは原則として上向きとする。
  - A測定の各測定点における騒音レベルの測定結果のなかに 80 dB 未満の測定点があった場合は、その測定点の値を除いて算術平均と標準偏差を求める。
  - 騒音の管理区分の決定には、測定値の算術平均と標準偏差を用いる。
  - 騒音のA測定の単位作業場所における騒音レベルがほぼ均一であることが明らかなときは、測定点は、6 m を超える等間隔で引いた縦の線と横の線との交点とすることができる。
  - 過去の測定結果の記録から、測定値の標準偏差が 3 dB 以下であることが明らかであり、かつ、その測定の実施後、施設又は作業工程等の変更による騒音レベルの分布に変化がないときは、騒音レベルがほぼ均一であるとすることができる。
