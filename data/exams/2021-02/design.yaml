  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 最大濃度を示す可能性のある作業位置が複数あって、どの作業位置で最大濃度になるか予測できない場合は、それらのすべての作業位置で測定を行い、最大の測定値をB測定の測定値とする。
  - B測定はA測定の実施時間内に、実施しなければならない。
  - 発散源に近接する場所で作業が行われている場合は、B測定が必要である。
  - 発散源とともに労働者が移動しながら行う作業がある場合は、B測定が必要である。
  - B測定の試料採取方法と分析方法は、A測定と同じ方法を用いなければならない。
  answer: 2
  choice_notes: []
  explanation: 'B 測定は、有害物質の濃度が最も高くなると考えられる作業位置と時間に行う測定で、A 測定の実施時間内に行わなければならない、という決まりはありません。選択肢2は誤りです。


    濃度が最も高くなる時間（原材料の投入時など）が、A 測定を行っている時間に重なるとは限りません。B 測定は、その時間をねらって行います。'
  figures: []
  law_note: null
  _key_choice: B測定はA測定の実施時間内に、実施しなければならない。
