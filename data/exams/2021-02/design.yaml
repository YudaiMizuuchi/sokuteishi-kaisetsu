  explanation: '光散乱方式の相対濃度計の指示値は、検出部を通る空気の中の粉じんの濃度で決まるので、吸引流量によってはほとんど変わりません。「吸引流量を大きくすると相対濃度も大きくなる」とする選択肢1は誤りです。


