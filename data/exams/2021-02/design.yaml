  stem: 固体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 捕集された物質は、捕集管内で固体捕集剤の未吸着部分へ移動することがある。
  - シリカゲル管は、ミストの捕集には不適当である。
  - ポーラスポリマービーズは、活性炭に比べ、表面が不活性である。
  - シリカゲル管は、活性炭管に比べ、極性の高いガス状物質を捕集するのに適している。
  - ポーラスポリマービーズは、活性炭に比べて有機溶剤蒸気に対する単位重量当たりの捕集容量が大きい。
  answer: 5
  choice_notes: []
  explanation: 'ポーラスポリマービーズは、活性炭に比べて有機溶剤蒸気の捕集容量が**小さい**吸着剤です。「大きい」とする選択肢5は誤りです。


    これも繰り返し出題されている論点です。ポーラスポリマーの長所は、表面が不活性なこと（選択肢3）と加熱脱着しやすいことです。'
  figures: []
