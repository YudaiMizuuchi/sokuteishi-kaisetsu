  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - グラスファイバーフィルターによる微細粒子の捕集では、ろ過流速が速いほど、拡散作用による捕集率は減少する。
  - ポアサイズ 0.8 µm のメンブランフィルターは、粒径 0.3 µm 以下の粒子をほとんど捕集できない。
  - 粒子状の特定化学物質の捕集には、オープンフェース型ホルダーが多く用いられるが、分粒装置付の捕集装置を用いる物質もある。
  - リフラクトリーセラミックファイバー（RCF）の捕集には、セルロースエステルメンブランフィルターが用いられる。
  - 一般に、セルロースエステルメンブランフィルターは、帯電しやすいので重量分析に用いるのは不適当である。
  answer: 2
  choice_notes: []
  explanation: 'ポアサイズ 0.8 µm のメンブランフィルターでも、拡散やさえぎりの作用で、0.3 µm 以下の粒子を高い率で捕集できます。「ほとんど捕集できない」とする選択肢2は誤りです。


    ポアサイズは孔の大きさの目安で、捕集できる粒子の大きさの下限ではありません。令和5年度第2回・令和6年度第1回でも同じ論点が出題されています。'
  figures: []
  law_note: null
  _key_choice: ポアサイズ0.8μmのメンブランフィルターは、粒径0.3μm以下の粒子をほとんど捕集できない。
