  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は一致しなければならない。
  - 同一建屋内にいくつかの単位作業場所を設定する場合、それぞれの単位作業場所の範囲が重なってもよい。
  - 単位作業場所の区域は、著しい濃度変動がないか、濃度変動があってもランダムであるような範囲とする。
  - 単位作業場所の設定に当たっては、作業場内の気流や換気設備の稼働状況について考慮する必要はない。
  - 有害物質の発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  answer: 4
