  stem: 正規分布、対数正規分布及び作業環境中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 横軸を変数とし、縦軸を確率密度とすると、正規分布の曲線の形は、平均を中心として左右対称になる。
  - 正規分布の平均（算術平均）及び標準偏差をそれぞれ μ 及び σ とすると、この分布の 95 ％ 上限値は μ ＋ 3 σ である。
  - 横軸を変数の対数変換値とし、縦軸を確率密度とすると、対数正規分布の曲線の形は、幾何平均の対数変換値を中心として左右対称になる。
  - 対数正規分布の幾何標準偏差は、無次元である。
  - 作業環境中の有害物質の濃度分布は、対数正規分布で近似される。
  answer: 2
  choice_notes: []
  explanation: null
