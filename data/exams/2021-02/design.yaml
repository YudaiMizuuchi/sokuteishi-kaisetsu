  stem: 検知管による測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 直読式検知管の変色層が斜めに現れたときの測定値は、変色した部分の最先端の目盛りの値とする。
  - 検知管に所定の空気を通気した後、時間の経過とともに着色が変化する場合があるので、濃度の読み取りは速やかに行う。
