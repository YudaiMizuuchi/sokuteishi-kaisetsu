  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガスメーターは、経年変化により指示値に誤差を生じることがあるので、定期的に校正する必要がある。
  - 石けん膜流量計は、所定の距離を石けん膜が移動する時間を測定して流量を求める。
  - 捕集装置とポンプの間に接続した面積式流量計では、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より小さくなる。
  - 面積式流量計は、テーパー管内の浮子が停止したとき、浮子とテーパー管の間隙の面積とそこを流れている流量とが比例することを利用している。
  - 絞り式（オリフィス）流量計は、オリフィス板の上流側と下流側との間に生じる圧力差が一定の関係にあることを利用している。
  answer: 3
