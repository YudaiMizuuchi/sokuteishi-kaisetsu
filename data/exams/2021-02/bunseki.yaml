  stem: データの取扱いに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 誤差とは、測定値の平均値と各測定値との差のことである。
  - 精度とは、分析値のバラツキの程度を示すものである。
  - 真度（正確さ）とは、分析を無限回繰り返したとき得られる平均値が真の値にどれだけ近いかを示すものである。
  - 優れた分析方法とは、精度及び真度（正確さ）の両方が高い分析方法のことである。
  - 迅速性のためには、ある程度の精度と真度（正確さ）を犠牲にすることもやむを得ない場合もある。
  answer: 1
  choice_notes: []
  explanation: '誤差とは、測定値と**真の値**との差です。測定値の平均値と各測定値との差は「偏差」なので、選択肢1は誤りです。


    令和5年度第2回でも、同じ論点が出題されています。'
  figures: []
  law_note: null
  _key_choice: 誤差とは、測定値の平均値と各測定値との差のことである。
