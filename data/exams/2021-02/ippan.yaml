  stem: 厚生労働省の「労働安全衛生マネジメントシステムに関する指針」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - この指針は、労働安全衛生法の規定に基づき、機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものである。
  - 事業者は、事業場における安全衛生水準の向上を図るための安全衛生に関する基本的考え方を示すものとして、安全衛生方針を表明し、労働者及び関係請負人その他の関係者に周知させる。
  - このシステムにおける安全衛生計画には、日常的な安全衛生活動として、危険予知（KY）活動、ヒヤリ・ハット事例の収集などを盛り込むことができる。
  - このシステムに従って行う措置が適切に実施されているかどうかについての評価を行うシステム監査は、必ずしも外部の機関によるものでなくてもよい。
  - このシステムの全般的な見直しとは、事業場の安全衛生水準の向上の状況、社会情勢の変化等を考慮して、事業者自らがシステムの妥当性及び有効性を評価し、その結果を踏まえて必要な改善を実施することをいう。
  answer: 1
  choice_notes: []
  explanation: '労働安全衛生マネジメントシステムに関する指針は、事業者が安全衛生方針の表明、計画、実施、評価、改善という一連の仕組みを自主的に回すための基本的な事項を定めたものです。機械や化学物質による危険・健康障害を防ぐための具体的な措置を定めるものではないので、選択肢1は誤りです。


    具体的な措置は、労働安全衛生法や各規則で定められています。マネジメントシステムは、それらを確実に実行し、改善し続けるための「仕組み」です。'
  figures: []
  law_note: null
  _key_choice: この指針は、労働安全衛生法の規定に基づき、機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものである。
