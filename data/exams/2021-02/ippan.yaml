  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 1,2-ジクロロプロパンは、肝臓及び腎臓の障害などのほか、長期間の高濃度ばく露により胆管がん発症につながる蓋然性が高い。
  - ナフタレンは、皮膚感作性のほか、ヒトに対する発がん性を有する可能性がある。
  - 一酸化炭素は、赤血球中のヘモグロビンの合成を阻害し、酸素欠乏を生じさせる。
  - 無機水銀は、腎障害を起こす。
  - シアン化水素は、体の細胞内の酸素の利用を阻害し、呼吸困難や呼吸麻痺を起こす。
  answer: 3
  choice_notes: []
  explanation: '一酸化炭素は、赤血球中のヘモグロビンと強く**結合**して、酸素を運べなくすることで、体内組織を酸素欠乏にします。ヘモグロビンの合成を阻害するのではないので、選択肢3は誤りです。


    一酸化炭素がヘモグロビンと結合する力は、酸素の200倍以上です。ヘモグロビンの合成を妨げて貧血を起こすのは、鉛の特徴です。'
  figures: []
  law_note: null
  _key_choice: 一酸化炭素は、赤血球中のヘモグロビンの合成を阻害し、酸素欠乏を生じさせる。
