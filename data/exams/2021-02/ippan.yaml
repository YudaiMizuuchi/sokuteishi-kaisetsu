  stem: 厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」において示されている化学物質等による健康障害に係るリスクを見積もる方法として、不適切なものは次のうちどれか。
  choices:
  - 対象の化学物質等への労働者のばく露の程度を測定し、測定結果を厚生労働省の「作業環境評価基準」に示されている当該化学物質の管理濃度と比較する方法。
  - 発生可能性及び重篤度を相対的に尺度化し、それらを縦軸と横軸とし、あらかじめ発生可能性及び重篤度に応じてリスクが割り付けられた表を使用する方法。
  - 発生可能性及び重篤度を一定の尺度によりそれぞれ数値化し、それらを加算又は乗算等する方法。
  - 発生可能性及び重篤度を段階的に分岐していく方法。
  - 対象の化学物質等への労働者のばく露の程度及び当該化学物質等による有害性を相対的に尺度化し、それらを縦軸と横軸とし、あらかじめばく露の程度及び有害性の程度に応じてリスクが割り付けられた表を使用する方法。
  answer: 1
