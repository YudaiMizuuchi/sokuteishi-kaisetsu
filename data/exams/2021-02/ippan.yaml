  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉛の生物学的モニタリングの指標として血中の鉛濃度がある。
  - キシレンは、代謝されて、尿中にエチル馬尿酸として排泄される。
  - 有機溶剤は脂溶性が高いので、中枢神経系などの脂肪に富んだ組織に蓄積しやすい。
  - N,N-ジメチルホルムアミドの生物学的モニタリングの指標として、尿中の N-メチルホルムアミドの濃度がある。
  - 体内に取り込まれた有機溶剤の生物学的半減期は比較的短いので、有機溶剤等健康診断における尿中代謝物の検査のための採尿時刻は、正確にチェックする必要がある。
  answer: 2
  choice_notes: []
  explanation: 'キシレンは、体内で代謝されて、尿中に主に**メチル馬尿酸**として排泄されます。エチル馬尿酸とする選択肢2は誤りです。


    トルエンは馬尿酸、キシレンはメチル馬尿酸、エチルベンゼンとスチレンはマンデル酸、と覚えましょう。ベンゼン環にメチル基が2つあるキシレンが、メチルの付いた馬尿酸になる、と構造から結びつけられます。'
  figures: []
  law_note: null
  _key_choice: キシレンは、代謝されて、尿中にエチル馬尿酸として排泄される。せつ
