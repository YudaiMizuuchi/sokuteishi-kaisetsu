  stem: 温熱環境及び人体の適応等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - WBGT基準値は、身体に対する負荷が大きな作業では、負荷が小さな作業より小さい値となる。
  - 熱中症はⅠ度からⅢ度までに分類され、このうちⅢ度が最も重症である。
  - 高温環境下での熱けいれんは、組織液の塩分喪失と水分の過剰補給によって起こる。
  - WBGT基準値は、同一作業であっても、熱に順化していない人では、順化している人より小さい値となる。
  - 算出したWBGTの値が、作業内容に応じて設定されたWBGT基準値未満である場合には、熱中症が発生するリスクが高まる。
  answer: 5
  choice_notes: []
  explanation: '算出した WBGT 値が、作業内容に応じた WBGT 基準値を**超える**と、熱中症のリスクが高まります。基準値未満であればリスクは低いので、「基準値未満である場合にリスクが高まる」とする選択肢5は誤りです。


    WBGT 基準値は、作業の負荷が大きいほど、また暑熱に順化していない人ほど小さい（厳しい）値になります（選択肢1・4）。'
  figures: []
  law_note: null
  _key_choice: 算出したＷＢＧＴの値が、作業内容に応じて設定されたＷＢＧＴ基準値未満である場合には、熱中症が発生するリスクが高まる。
