  stem: 金属等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉状のニッケル化合物は、生殖毒性、皮膚感作性のほか、ヒトに対する発がん性があるとされている。
  - 鉛中毒では、貧血、末梢神経障害、腹部の疝痛などがみられる。
  - クロム酸は、皮膚に接触すると充血や潰瘍を生じるほか、長期間のばく露によって肺がんなどを生じる。
  - カドミウム中毒では、溶血性貧血や鼻中隔穿孔がみられる。
  - マンガンによる慢性中毒では、精神症状、歩行障害、発語障害などパーキンソン病に似た症状がみられる。
  answer: 4
  choice_notes: []
  explanation: 'カドミウム中毒の代表的な症状は、腎障害（低分子蛋白尿）や、歯の黄色環、慢性の肺気腫などです。溶血性貧血はヒ化水素、鼻中隔穿孔は6価クロムやヒ素の症状なので、選択肢4は誤りです。


    溶血性貧血と鼻中隔穿孔は、他の回でも別の物質と組み合わせて出題されています。症状から物質を逆にたどれるようにしておきましょう。'
  figures: []
  law_note: null
  _key_choice: カドミウム中毒では、溶血性貧血や鼻中隔穿孔がみられる。せん
