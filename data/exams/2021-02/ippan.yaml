  stem: 労働衛生保護具に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 防じんマスクの選定では、顔面とマスクの面体との高い密着性が要求される有害性の高い物質を取り扱う作業については、取替え式のものを選ぶ。
