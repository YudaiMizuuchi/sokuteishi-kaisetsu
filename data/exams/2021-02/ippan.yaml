  stem: 鉱物性粉じん等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アーク溶接作業で発生するヒュームの主成分は、一般に、酸化鉄である。
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度 1 g/cm³ の球形粒子の直径である。
  - 鉱物性粉じんに含まれる遊離けい酸は、胸膜の中皮腫を生じさせる。
  - アルミニウムや炭素を含む粉じんは、じん肺を起こすことがある。
  - 吸入性粉じんの捕集には、空気力学相当径 4 µm の粉じん粒子を 50 ％透過する性能を有する分粒装置を用いる。
  answer: 3
  choice_notes: []
  explanation: '胸膜の中皮腫を起こすのは石綿です。遊離けい酸は、肺を線維化させてけい肺を起こす物質で、中皮腫の原因ではないので、選択肢3は誤りです。


    遊離けい酸はけい肺（じん肺）、石綿は石綿肺・肺がん・中皮腫、と原因物質と病気を対で覚えましょう。'
  figures: []
  law_note: null
  _key_choice: の球形粒子の直径である。
