  stem: 騒音等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 音圧レベルは、通常、その音圧と人間が聴くことができる最も小さな音圧(20 µPa)との比の常用対数を20倍して求められ、その単位はデシベル(dB)で表される。
  - ヒトが感じることのできる音の周波数の範囲は、20 Hz から 20,000 Hz程度で、会話領域は 500 Hz から 2,000 Hz 程度である。
  - 騒音性難聴は、内耳の障害による感音性難聴である。
  - 等価騒音レベルは、中心周波数 500 Hz、1,000 Hz、2,000 Hz 及び 4,000 Hz の各オクターブバンドの騒音レベルの平均値である。
  - 騒音の A 測定の平均値の算定には 80 dB 未満の測定値は含めない。
  answer: 4
  choice_notes: []
  explanation: '等価騒音レベルは、時間とともに変動する騒音のエネルギーを、測定時間で平均した値です。特定の周波数帯（オクターブバンド）の騒音レベルを平均したものではないので、選択肢4は誤りです。


    500 Hz〜4,000 Hz の4つの周波数は、聴力検査で使う周波数の話と混同させるための数字です。'
  figures: []
  law_note: null
  _key_choice: 等価騒音レベルは、中心周波数500Hz、1,000Hz、2,000Hz及び4,000Hzの各オクターブバンドの騒音レベルの平均値である。
