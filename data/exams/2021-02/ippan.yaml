  stem: 酸素欠乏症及び硫化水素中毒に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 硫化鉱や魚油を入れてある貯蔵施設の内部での作業では、酸素欠乏症の危険がある。
  - 飼料の貯蔵又は果菜の熟成のために使用している倉庫の内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  - ドライアイスを使用して冷蔵を行っている冷蔵庫の内部での作業では、酸素欠乏症の危険がある。
  - 空気中の酸素濃度が 15 ～ 16 ％ 程度の酸素欠乏症では、一般に頭痛、吐き気などの症状がみられる。
  - 海水が滞留している暗きょの内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
  answer: 2
  choice_notes: []
  explanation: '飼料の貯蔵や果菜の熟成に使う倉庫の内部は、飼料や果菜の呼吸で酸素が消費されるため、酸素欠乏症の危険がある場所ですが、硫化水素中毒の危険がある場所ではありません（第1種酸素欠乏危険作業）。選択肢2は誤りです。


    硫化水素中毒の危険まであるのは、海水が滞留している暗きょや、汚水・腐泥などがある場所です（選択肢5）。「腐敗するもの」があるかで判断しましょう。'
  figures: []
  law_note: null
  _key_choice: 飼料の貯蔵又は果菜の熟成のために使用している倉庫の内部での作業では、酸素欠乏症及び硫化水素中毒の危険がある。
