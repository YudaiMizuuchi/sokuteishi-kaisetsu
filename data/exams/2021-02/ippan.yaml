  stem: 有機溶剤の性質及び人体への影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤の蒸気は、空気より重いため、地下室やピットなどの通気が不十分な場所では滞留しやすい。
  - 有機溶剤による皮膚や粘膜の障害としては、皮膚の角化、結膜炎などがある。
  - アセトンは水溶性を有しているが、トルエンは水溶性を有していない。
  - 酢酸メチルによる健康障害として顕著なものは、網膜微細動脈瘤を伴う脳血管障害である。
  - 二硫化炭素の高濃度ばく露では、精神障害を生じる。
  answer: 4
  choice_notes: []
  explanation: '網膜の微細動脈瘤を伴う脳血管障害は、**二硫化炭素**の慢性中毒の特徴です。酢酸メチルの健康障害として顕著なのは、視神経の障害です。選択肢4は誤りです。


    酢酸メチルは、体内でメタノールを生じるため、メタノールと同じく視神経障害を起こします。'
  figures: []
  law_note: null
  _key_choice: 酢酸メチルによる健康障害として顕著なものは、網膜微細動脈瘤を伴うりゅう脳血管障害である。
