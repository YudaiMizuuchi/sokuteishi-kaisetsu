  stem: 局所振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動障害は、チェーンソーなどの振動工具によって生じる障害で、手のしびれなどの末梢神経障害やレイノー現象などの末梢循環障害がみられる。
  - 振動障害は、振動周波数が 4,000 Hz 以上の振動で発生しやすい。
  - 日振動ばく露限界値は、5.0 m/s² である。
  - 振動工具の取扱いにおける「日振動ばく露量」は、周波数補正振動加速度実効値の3軸合成値及び振動ばく露時間から算出される。
  - 喫煙は、レイノー現象発現の増悪因子である。
  answer: 2
  choice_notes: []
  explanation: '局所振動障害を起こしやすいのは、数 Hz から数百 Hz 程度の比較的低い周波数の振動で、1,000 Hz を超えるとほとんど影響がないとされています。4,000 Hz 以上で発生しやすいとする選択肢2は誤りです。


    令和8年度第1回でも、手腕への影響が最も大きいのは 12 Hz 前後で、1,000 Hz 以上ではほとんど影響しない、という正しい記述が出題されています。'
  figures: []
  law_note: null
  _key_choice: 振動障害は、振動周波数が4,000Hz以上の振動で発生しやすい。
