  stem: 空気中の有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定は、当該単位作業場所における気中有害物質の平均的な濃度とその変動を求めるための測定である。
  - A測定を行うことによって、管理区分を決めるための評価値を求めることができる。
  - 過去において実施した作業環境測定により幾何標準偏差が1.5以下であることが明らかな場合は、有害物質の濃度はほぼ均一であるとみなすことができる。
  - 単位作業場所が著しく狭く、かつ、有害物質の濃度がほぼ均一であることが明らかなときは、測定点の数を5未満とすることができる。
  - 単位作業場所における有害物質の濃度がほぼ均一であることが明らかなときは、測定点の間隔は、6mを超える等間隔で引いた縦の線と横の線との交点としてもよい。
  answer: 3
  choice_notes: []
  explanation: '有害物質の濃度がほぼ均一であるとみなせるのは、幾何標準偏差がおおむね **1.2 以下**であることが明らかな場合です。1.5 以下とする選択肢3は誤りです。


