  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸引流量が1L/min以下の流量計の較正には、石けん膜流量計を用いることができる。
  - 面積式流量計(ロータメータ)は、垂直に立てたテーパー管に浮子(フロート)を入れたものである。
  - 面積式流量計では、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より小さくなる。
  - ハイボリウムエアサンプラーに表示される流量の較正は、ルーツメータを用いて行うとよい。
  - 湿式ガスメータは、原則として、押し込み方式で使用する。
  answer: 3
