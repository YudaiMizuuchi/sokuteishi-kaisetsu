  stem: 光散乱方式の相対濃度計による鉱物性粉じんの測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 質量濃度が同じであれば、粒径5μmの粉じん粒子の散乱光強度は、粒径0.3μmの粉じん粒子の散乱光強度より小さい。
  - 質量濃度変換係数は、粉じんの発生源の近くでは小さく、発生源から離れるに従って大きくなるという傾向がある。
  - 測定値は、鉱物性粉じん以外の煙、ミストなどの影響を受ける。
  - 感度較正には0.3μmのステアリン酸粒子が用いられる。
  - 相対濃度計には、側方散乱光や前方散乱光を計測する方式のものがある。
  answer: 2
  choice_notes: []
  explanation: '質量濃度変換係数は、粉じんの発生源の近くでは**大きく**、発生源から離れるにしたがって**小さく**なる傾向があります。発生源の近くには、散乱光を出しにくい大きな粒子が多いためです。選択肢2は逆になっていて誤りです。


    質量濃度が同じなら、大きな粒子（5 µm）の方が小さな粒子（0.3 µm）より散乱光の強度が小さい（選択肢1）のも同じ理由です。'
