  stem: 25℃、1気圧における環境空気中のトルエン(C₆H₅CH₃)の質量濃度が188mg/m³であるとき、その体積分率(ppm)に最も近いものは、次のうちどれか。
  choices:
  - 25ppm
  - 50ppm
  - 100ppm
  - 125ppm
  - 150ppm
  answer: 2
  choice_notes: []
  explanation: 'mg/m³ を ppm に直すときは、24.45 を掛けて分子量で割ります。トルエンの分子量は 92.1 です。


    C [ppm] ＝ 188 × 24.45 ÷ 92.1 ≒ 49.9


    よって、最も近いのは 50 ppm です。令和5年度第1回では、逆向きに 50 ppm を mg/m³ に直す問題が出ています。'
  figures: []
  law_note: null
  _key_choice: 50 ppm
