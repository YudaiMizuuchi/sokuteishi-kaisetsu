  stem: 液体捕集法及び直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ミゼットインピンジャーによるガス状物質の捕集では、流量が大きいほど捕集率は高くなる。
  - 真空捕集びんの捕集では、捕集びん内の真空度は、1.33kPa以下とする。
  - クロム酸のミストの捕集には、ミゼットインピンジャーを用いることができる。
  - ミゼットインピンジャーによる粒子状物質の捕集では、粒径が小さいほど捕集率は低くなる。
  - 真空捕集びんのコックには、グリースの使用は避ける。
  answer: 1
