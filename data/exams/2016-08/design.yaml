  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - トリジマイトは、遊離けい酸である。
  - 正長石は、遊離けい酸ではない。
  - 石英及びクリストバライトの化学式は、いずれもSiO₂で表される。
  - 遊離けい酸含有率が0%の鉱物性粉じんの管理濃度は、5.0mg/m³である。
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度1g/cm³の球形粒子の直径である。
  answer: 4
  choice_notes: []
  explanation: '遊離けい酸含有率が 0 ％ の鉱物性粉じんの管理濃度は、E ＝ 3.0 ÷ (1.19 × 0 ＋ 1) ＝ **3.0 mg/m³** です。5.0 mg/m³ とする選択肢4は誤りです。


    トリジマイト・石英・クリストバライトはいずれも遊離けい酸（SiO₂）、正長石はけい酸塩で遊離けい酸ではありません。'
