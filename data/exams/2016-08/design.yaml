  stem: 正規分布、対数正規分布及び作業環境中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 正規分布の母平均と母分散とは、互いに独立している。
  - 横軸に変数の対数をとったとき、対数正規分布の曲線の形は、幾何平均値を中心として左右対称になる。
  - 一般に、環境中の有害物質の濃度の算術平均値が高くなるに従って、濃度の標準偏差も大きくなる。
  - 対数正規分布に従う変数の幾何平均値と幾何標準偏差とは、互いに独立している。
  - 正規分布の算術平均と標準偏差をそれぞれx̄、σとすると、この分布に従う変数がx̄－σからx̄＋σの範囲に入る確率は、およそ95%である。
  answer: 5
  choice_notes: []
  explanation: 正規分布で、x̄ − σ から x̄ ＋ σ の範囲に入る確率は、およそ **68 ％**です。約95 ％ になるのは ±2σ の範囲なので、選択肢5は誤りです。
