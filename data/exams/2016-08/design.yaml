  stem: '次の㋑～㋭のうち、単位作業場所の設定に際して考慮する必要のないものの組合せは下のうちどれか。


    ㋑ 作業場で働く労働者の行動範囲


    ㋺ 測定対象物質の物性及び発散状況


    ㋩ 作業場で就業する労働者の数


    ㋥ 作業場所における気流及び局所排気装置の稼働状況


    ㋭ 作業場で働く労働者の就業時間'
