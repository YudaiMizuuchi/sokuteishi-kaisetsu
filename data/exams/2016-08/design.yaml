  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定は、当該単位作業場所の中で、有害物質の濃度が最も高くなると思われる時間に、その作業位置で行う測定である。
  - 単位作業場所の中で最大の測定値を示す箇所については、労働者が立ち入る可能性がなくてもその箇所でB測定を行わなければならない。
  - 発生源とともに作業者が移動しながら行う作業の場合には、B測定は、作業位置の移動に沿って行う。
  - B測定におけるサンプリング時間は、原則として、10分間の継続した時間とする。
  - B測定は、局所的かつ短時間の個人ばく露量を測定するために行うものではない。
