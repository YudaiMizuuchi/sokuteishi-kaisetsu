  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガラス製のセルは、紫外部の光を吸収する。
  - 吸光度は、呈色後の時間によって変化することがある。
  - 吸光度測定は、0.2～0.8程度の吸光度で行うことが望ましい。
  - 検量線の傾きは、入射光の強度に比例する。
  - 液層の長さが一定であれば、吸光度は濃度に比例する。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '検量線の傾きは、ランベルト・ベールの法則 A ＝ ε・c・l から、**ε・l**（モル吸光係数 × 光路長）です。**入射光の強度**には、比例しません（吸光度は、入射光と透過光の強度の比で決まります）。「検量線の傾きは、入射光の強度に比例する」とする選択肢4は誤りです。同じ趣旨の記述は、令和4年度第1回にも出題されています（出題実績）。


    ガラス製のセルは、紫外部の光を吸収します。吸光度は、呈色後の時間によって変化することがあります。吸光度測定は、0.2〜0.8程度で行うのが望ましいです。液層の長さが一定なら、吸光度は濃度に比例します。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
