  stem: 吸光光度分析法による分析において、測定対象物質Ⓐと、標準溶液調製時に標準物質として使用する物質Ⓑとの次の組合せのうち、不適切なものはどれか。
  choices:
  - 塩素 ／ 塩化ナトリウム
  - 臭化メチル ／ 臭化カリウム
  - フッ化水素 ／ フッ化ナトリウム
  - 硫化水素 ／ 硫化ナトリウム
  - 硫酸ジメチル ／ メタノール
  columns:
  - Ⓐ
  - Ⓑ
  answer: 1
  choice_notes: []
  explanation: '吸光光度分析法で、標準溶液の調製に使う標準物質は、測定対象物質によって決まります。**塩素**の標準溶液は、**次亜塩素酸ナトリウム**溶液から調製します。「塩化ナトリウム」とする選択肢1は不適切です。同じ問題は、令和3年度第1回にも出題されています（出題実績）。


    臭化メチルには臭化カリウム、フッ化水素にはフッ化ナトリウム、硫化水素には硫化ナトリウム、硫酸ジメチルにはメタノールを溶媒として使います。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
  figures: []
  law_note: null
- num: 17
  status: published
  chapters: []
  traps: []
  rank: null
  stem: 測定対象物質Ⓐ、分析法Ⓑ及びその標準系列液の調製に用いる溶媒Ⓒの組合せとして、誤っているものは次のうちどれか。
  choices:
  - β-プロピオラクトン ／ ガスクロマトグラフ分析法 ／ ジエチルエーテル
  - シアン化カリウム ／ 吸光光度分析法 ／ 水酸化ナトリウム溶液
  - エチレンイミン ／ 吸光光度分析法 ／ 精製水
  - ペンタクロロフェノール ／ ガスクロマトグラフ分析法 ／ 水酸化ナトリウム溶液
  - α-ナフチルアミン ／ 吸光光度分析法 ／ 硫酸溶液
  columns:
  - Ⓐ
  - Ⓑ
  - Ⓒ
  answer: 4
  choice_notes: []
  explanation: 'ペンタクロロフェノールは、**吸光光度分析法**で測定し、標準系列液は、**水酸化ナトリウム溶液**で調製します。「ガスクロマトグラフ分析法」とする組合せ（選択肢4）は、分析法が誤りです。


    β-プロピオラクトンはガスクロマトグラフ分析法（ジエチルエーテル）、シアン化カリウムは吸光光度分析法（水酸化ナトリウム溶液）、エチレンイミンは吸光光度分析法（精製水）、α-ナフチルアミンは吸光光度分析法（硫酸溶液）で、適切な組合せです。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
  figures: []
  law_note: null
  minor_note: ペンタクロロフェノールを、ガスクロマトグラフ分析法ではなく、吸光光度分析法で測定する、という点は、ガイドブック3で全体を確認できておらず、本問の選択肢の構成からの推定です。根拠の確認は後回しにしています。
