  stem: 蛍光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 蛍光強度は、温度の影響を受ける。
  - 蛍光強度は、溶液のpHにより変化することがある。
  - 一般に、吸光光度分析法に比べて選択性が高い。
  - 蛍光強度と濃度との直線関係は、低濃度範囲で成立する。
  - 飽和炭化水素は、蛍光強度が大きい。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '**飽和炭化水素**は、蛍光を示しません（蛍光を出すのは、共役二重結合をもつ芳香族化合物などです）。「飽和炭化水素は、蛍光強度が大きい」とする選択肢5は誤りです。


    蛍光強度は、温度の影響を受けます。蛍光強度は、溶液のpHによって変化することがあります。蛍光光度分析法は、一般に、吸光光度分析法に比べて、選択性が高いです。蛍光強度と濃度の直線関係は、低濃度範囲で成立します。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
