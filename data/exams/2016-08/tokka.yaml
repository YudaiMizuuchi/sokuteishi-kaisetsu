  stem: シアン化水素及び硫化水素の1気圧における物性に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 両物質とも水に溶け、酸性を呈する。
  - 両物質とも、その融点は水の融点より低い。
  - 両物質とも、その沸点は水の沸点より低い。
  - 硫化水素の方が、シアン化水素より沸点が高い。
  - シアン化水素の方が、硫化水素より融点が高い。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '1気圧での沸点は、**シアン化水素が約26℃**、**硫化水素が約−60℃**で、**シアン化水素のほうが高い**です。「硫化水素の方が、シアン化水素より沸点が高い」とする選択肢4は誤りです。


    両物質とも、水に溶けて酸性を呈します（シアン化水素は弱酸、硫化水素は弱酸）。融点は、シアン化水素が約−13℃、硫化水素が約−86℃で、いずれも水の融点（0℃）より低く、シアン化水素のほうが高いです。沸点は、いずれも水の沸点（100℃）より低いです。（物性値は、一般的な化学便覧の概数です。）'
