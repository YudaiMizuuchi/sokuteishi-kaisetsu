  stem: 特定化学物質用検知管Ⓐと、それに利用される反応Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 四塩化炭素用検知管 ／ 四塩化炭素が酸化剤により酸化されてホスゲンとなる。
  - アクリロニトリル用検知管 ／ アクリロニトリルが酸化剤と反応してシアン化水素を発生する。
  - スチレン用検知管 ／ スチレンが発煙硫酸により重合する。
  - ベンゼン用検知管 ／ ベンゼンがpH指示薬と反応し変色させる。
  - シアン化水素用検知管 ／ シアン化水素が塩化水銀(Ⅱ)と反応して塩化水素を生成する。
  columns:
  - Ⓐ
  - Ⓑ
  answer: 4
  choice_notes: []
  explanation: '**ベンゼン用検知管**は、ベンゼンが**五酸化ヨウ素**と反応して、**ヨウ素**を遊離させ、変色する原理を使います。「ベンゼンがpH指示薬と反応し変色させる」とする選択肢4は誤りです。同様の記述は、令和3年度第1回、令和5年度第1回にも出題されています（出題実績）。


    四塩化炭素用検知管は、酸化剤でホスゲンになる反応、アクリロニトリル用検知管は、酸化剤でシアン化水素を発生する反応、スチレン用検知管は、発煙硫酸による重合、シアン化水素用検知管は、塩化水銀(Ⅱ)との反応による酸の生成を利用します。'
