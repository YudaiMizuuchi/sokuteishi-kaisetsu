  stem: 高速液体クロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 逆相クロマトグラフ法では、固定相より移動相の極性が低い。
  - 移動相中でイオン化する物質の分析には、移動相に緩衝液を加えることがある。
  - 逆相クロマトグラフ法では、一般に、移動相として水と水溶性有機溶媒の混合液が用いられる。
  - 紫外可視吸光光度検出器は、芳香族炭化水素の検出に使用できる。
  - 逆相クロマトグラフ法では、カラム温度を上げるとカラム圧が低くなる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '逆相クロマトグラフ法は、**固定相が低極性**（オクタデシル基など）、**移動相が高極性**（水系の溶媒）の組合せです。つまり、固定相より移動相の極性が**高い**ので、「固定相より移動相の極性が低い」とする選択肢1は誤りです。同様の記述は、令和3年度第1回などにも出題されています（出題実績）。


    移動相中でイオン化する物質の分析には、移動相に緩衝液を加えることがあります。一般に、移動相には、水と水溶性有機溶媒の混合液を使います。紫外可視吸光光度検出器は、芳香族炭化水素の検出に使えます。カラム温度を上げると、移動相の粘性が下がり、カラム圧は低くなります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
