  stem: '次の㋑から㋥の測定対象物質について、相補型ろ過捕集方法(ろ過捕集材と吸着剤とを組み合わせた捕集方法)により捕集することが必要であるものの組合せは下のうちどれか。


    ㋑塩化ビニル


    ㋺ o-フタロジニトリル


    ㋩オーラミン


    ㋥アクリルアミド'
  choices:
  - ㋑㋺
  - ㋑㋥
  - ㋺㋩
  - ㋺㋥
  - ㋩㋥
  columns: null
  answer: 4
  choice_notes: []
  explanation: '相補型ろ過捕集方法（ろ過捕集材と吸着剤の組合せ）が必要なのは、粒子とガス（蒸気）の両方の状態で存在する物質です。


    - ㋺ **o-フタロジニトリル**：ろ紙と固体捕集用充填剤の組合せで捕集します。

    - ㋥ **アクリルアミド**：ガラス繊維ろ紙と活性炭フェルトの組合せで捕集します。

    - ㋑ 塩化ビニルは気体（直接捕集法・固体捕集法）、㋩ オーラミンは粒子（ろ過捕集法）で、相補型は不要です。


    よって（4）の㋺㋥です。同じ問題は、令和4年度第1回にも出題されています（出題実績）。


    （参考：『作業環境測定ガイドブック3 特定化学物質関係（金属類を除く）物質別各論』）'
  figures: []
  law_note: null
