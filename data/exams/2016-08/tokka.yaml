  stem: 塩化ビニル及び臭化メチルの1気圧における物性に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化ビニルの方が、臭化メチルより沸点が高い。
  - 臭化メチルの方が、塩化ビニルより融点が高い。
  - 両物質とも25℃で気体である。
  - 両物質とも、その融点は水の融点より低い。
  - 臭化メチルの沸点は、水の融点より高い。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '1気圧での沸点は、**塩化ビニル**が約−13℃、**臭化メチル**が約4℃で、塩化ビニルのほうが**低い**です。「塩化ビニルの方が、臭化メチルより沸点が高い」とする選択肢1は誤りです。


    臭化メチルの融点（約−94℃）は、塩化ビニルの融点（約−154℃）より高いです。両物質とも、25℃で気体で、融点は水の融点（0℃）より低いです。臭化メチルの沸点（約4℃）は、水の融点（0℃）より高いです。（物性値は、一般的な化学便覧の概数です。）'
