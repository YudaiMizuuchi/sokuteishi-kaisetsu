  stem: キャピラリーカラムを使用するガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キャリアガスの流量は、カラムの理論段数が最小となるように設定するのが望ましい。
  - カラムの内径が小さいほど、理論段数は大きくなる。
  - カラム槽温度が低いほど、保持時間が長くなる。
  - 液相の膜厚が厚いほど、保持時間が長くなる。
  - キャリアガスとして、主にヘリウムが使用されるが、窒素や水素が使用されることもある。
  columns: null
  answer: 1
  choice_notes: []
  explanation: 'キャリアガスの流量は、カラムの**理論段相当高さが最小**（理論段数が最大）となる流速を目安に設定するのが望ましいです。「理論段数が最小となるように設定する」とする選択肢1は誤りです。


    カラムの内径が小さいほど、理論段数は大きくなります。カラム槽温度が低いほど、保持時間は長くなります。液相の膜厚が厚いほど、保持時間は長くなります。キャリアガスには、主にヘリウムを使い、窒素や水素を使うこともあります。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
