  stem: 試料溶液中のベンゼン濃度の測定をガスクロマトグラフ分析法で行い、ベンゼンのピーク面積5.0×10⁴を得た。この溶液4.0mLと、ベンゼン濃度10μg·mL⁻¹の標準溶液1.0mLを混合し、同様に分析したところ、ベンゼンのピーク面積は6.0×10⁴であった。試料溶液中のベンゼン濃度として、正しい値は次のうちどれか。
  choices:
  - 1.0μg·mL⁻¹
  - 2.0μg·mL⁻¹
  - 3.0μg·mL⁻¹
  - 4.0μg·mL⁻¹
  - 5.0μg·mL⁻¹
  columns: null
  answer: 5
  choice_notes: []
  explanation: '標準添加法の考え方で計算します。ピーク面積は、濃度に比例します。


    試料溶液のベンゼン濃度をx µg/mLとすると、混合溶液（試料4.0 mL ＋ 標準溶液1.0 mL ＝ 5.0 mL）の濃度は、（4.0x ＋ 1.0 × 10）／5.0 µg/mL です。


    試料溶液のピーク面積が 5.0 × 10⁴ で、混合溶液が 6.0 × 10⁴ なので、面積比は 1.2 倍です。


    （4.0x ＋ 10）／5.0 ＝ 1.2x

    4.0x ＋ 10 ＝ 6.0x

    x ＝ **5.0 µg/mL**


    よって（5）です。'
