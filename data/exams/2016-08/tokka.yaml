  stem: 次の測定対象物質のうち、固体捕集法による捕集が不適当なものはどれか。
  choices:
  - ベンゼン
  - アクリロニトリル
  - 3,3'-ジクロロ-4,4'-ジアミノジフェニルメタン(MOCA)
  - クロロホルム
  - 酸化プロピレン
  columns: null
  answer: 3
  choice_notes: []
  explanation: '**MOCA**は、粒子状（粉じん）の物質で、**硫酸含浸ろ紙**などの**ろ過捕集**が適した捕集法です。固体捕集法は、ガス状・蒸気状の物質を、活性炭などの捕集剤に吸着させる方法なので、MOCAの捕集は不適当です。よって（3）です。


    ベンゼン、アクリロニトリル、クロロホルム、酸化プロピレンは、固体捕集法で捕集できます。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
  figures: []
  law_note: null
- num: 19
  status: published
  chapters: []
  traps: []
  rank: null
  stem: 環境空気中の測定対象物質の捕集法及び分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩素化ビフェニル(PCB)を、液体捕集法により捕集し、ガスクロマトグラフ分析法により測定する。
  - ヨウ化メチルを、直接捕集法により捕集し、ガスクロマトグラフ分析法により測定する。
  - o-トリジンを、液体捕集法により捕集し、吸光光度分析法により測定する。
  - クロロメチルメチルエーテルを、ろ過捕集法により捕集し、吸光光度分析法により測定する。
  - ベンゾトリクロリドを、固体捕集法により捕集し、ガスクロマトグラフ分析法により測定する。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '**クロロメチルメチルエーテル**は、蒸気状の物質（沸点約59℃）なので、粒子を捕る**ろ過捕集法**には向きません。固体捕集法や液体捕集法で捕集します。「ろ過捕集法により捕集し、吸光光度分析法により測定する」とする選択肢4は誤りです。


    塩素化ビフェニル（PCB）は液体捕集法、ヨウ化メチルは直接捕集法、o-トリジンは液体捕集法、ベンゾトリクロリドは固体捕集法で捕集します。


    （参考：『デザイン・サンプリングの実務（C・D測定編）』）'
