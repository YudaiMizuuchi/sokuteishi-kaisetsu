  stem: 特定化学物質用検知管Ⓐと、それに利用される反応Ⓑとの次の組合せのうち、誤っているものはどれか。
  choices:
  - 四塩化炭素用検知管 ／ 四塩化炭素が酸化剤により酸化されてホスゲンとなる。
