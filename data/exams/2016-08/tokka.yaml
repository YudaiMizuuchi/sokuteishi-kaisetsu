  stem: 次の化合物Ⓐについて、その構造式Ⓑが誤っているものはどれか。
  choices:
  - ニトログリコール ／ 図の1
  - o-フタロジニトリル ／ 図の2
  - アクリルアミド ／ 図の3
  - α-ナフチルアミン ／ 図の4
  - エチレンイミン ／ 図の5
  columns:
  - Ⓐ
  - Ⓑ
  answer: 3
  choice_notes: []
  explanation: '各化合物の構造式を、図と照らし合わせます。


    - 3 アクリルアミド：**CH₂＝CH−CO−NH₂**（末端の二重結合）です。図の3は、**H₃C−CH＝CH−CO−NH₂**で、メチル基が増えた**クロトンアミド**の構造です。別の物質で、組合せは誤りです。

    - 1 ニトログリコール（O₂N−O−CH₂−CH₂−O−NO₂）、2 o-フタロジニトリル（ベンゼン環の隣り合う位置にCN×2）、4 α-ナフチルアミン（ナフタレンの1位にNH₂）、5 エチレンイミン（三員環のアジリジン）は、正しい組合せです。


    よって（3）です。'
  figures:
  - file: 2016-08-tokka-14-fig.png
    alt: Ⓐ（化合物名）とⒷ（構造式）の2列の表。1＝ニトログリコール、Ⓑは、O₂N-O-CH₂-CH₂-O-NO₂。2＝o-フタロジニトリル、Ⓑは、ベンゼン環の隣り合う炭素にそれぞれCNが結合。3＝アクリルアミド、Ⓑは、H₃C-CH=CH-C-NH₂で、末尾側のCの下にOが二重結合で結合。4＝α-ナフチルアミン、Ⓑは、2つの六員環が縮合した環の上部の炭素にNH₂が結合。5＝エチレンイミン、Ⓑは、H₂CとCH₂が結合し、その下側のNH（Hが結合したN）がH₂CとCH₂の両方に結合した三員環
  law_note: null
