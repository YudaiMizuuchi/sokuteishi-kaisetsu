  stem: 環境空気(25℃、1気圧)中のシアン化水素の濃度を測定するため、10mLの捕集液に0.70L·min⁻¹の流量で試料空気を10分間吸引した。この試料液5.0mLをとり、定量操作を行って得られた溶液の吸光度を測定したところ、0.26であった。シアン化カリウム濃度が2.8×10⁻⁴mol·L⁻¹の標準溶液5.0mLを、試料液と同様の操作を行って測定したところ、吸光度は0.48であった。この場合、シアン化水素の環境空気中濃度の値として、正しい値に最も近いものは次のうちどれか。ただし、試料捕集時に捕集液の損失はなく、かつ、捕集率は100%であったとする。
  choices:
  - 1.8ppm
  - 2.7ppm
  - 3.6ppm
  - 4.2ppm
  - 5.3ppm
  columns: null
  answer: 5
  choice_notes: []
  explanation: '次の順で計算します。


    1. 標準溶液5.0 mL中のシアン化カリウム（シアン化物イオン）の量：2.8 × 10⁻⁴ mol/L × 0.0050 L ＝ 1.4 × 10⁻⁶ mol（吸光度0.48）

    2. 試料液5.0 mL中の量：1.4 × 10⁻⁶ × 0.26／0.48 ≒ 7.58 × 10⁻⁷ mol

    3. 捕集液10 mL全体の量（5.0 mLの2倍）：7.58 × 10⁻⁷ × 2 ≒ 1.52 × 10⁻⁶ mol

    4. 気体の体積（25℃、1気圧のモル体積24.45 L/mol）：1.52 × 10⁻⁶ × 24.45 ≒ 3.71 × 10⁻⁵ L

    5. 吸引した空気の量：0.70 L/min × 10 min ＝ 7.0 L

    6. 体積分率：3.71 × 10⁻⁵ ÷ 7.0 ≒ 5.3 × 10⁻⁶ ＝ **5.3 ppm**


    よって（5）です。'
