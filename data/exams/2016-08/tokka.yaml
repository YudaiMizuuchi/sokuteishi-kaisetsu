  stem: 高速液体クロマトグラフ分析法に使用される検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 示差屈折検出器は、溶媒と試料溶液の屈折率の違いを利用している。
  - 紫外可視吸光光度検出器は、紫外可視部に吸収のある物質の分析に用いられる。
  - 蛍光光度検出器は、可視光を照射して励起した物質から発生する紫外光を測定する。
  - 電気化学検出器は、酸化あるいは還元できる物質の分析に用いられる。
  - 電気伝導度検出器は、イオン性物質の分析に用いられる。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '**蛍光光度検出器**は、**紫外光**を照射して励起した物質から発生する、**励起光より長波長の蛍光**を測定する検出器です。「可視光を照射して励起した物質から発生する紫外光を測定する」とする選択肢3は、波長の関係が逆なので誤りです。同じ記述は、令和元年度第1回にも出題されています（出題実績）。


    示差屈折検出器は、溶媒と試料溶液の屈折率の違いを利用します。紫外可視吸光光度検出器は、紫外可視部に吸収のある物質の分析に使います。電気化学検出器は、酸化または還元できる物質の分析に、電気伝導度検出器は、イオン性物質の分析に使います。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
