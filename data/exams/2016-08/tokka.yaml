  choice_notes: []
  explanation: '**スプリット注入法**は、気化した試料の**一部だけ**をカラムに導入し、残りを排出する方法なので、導入量が少なく、**低濃度試料の分析には向きません**（高濃度の試料に向きます）。よって（3）です。同じ問題は、令和2年度第1回、令和6年度第1回などにも出題されています（出題実績）。


    加熱脱着法、クール・オンカラム注入法、スプリットレス注入法、ダイレクト注入法は、試料の大部分を導入できるので、低濃度の分析に使えます。


