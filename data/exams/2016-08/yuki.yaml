  stem: 検知管法に関する次の記述のうち、正しいものはどれか。
  choices:
  - 検知管による測定は、一般に、検知管を10℃以下に冷却してから行う。
  - 検知剤は、測定対象物質以外とは反応しない。
  - 検知剤と測定対象物質との反応は、前処理剤を必要とする場合がある。
  - 検知剤の変色層の長さは、担体粒子径の影響を受けない。
  - 変色層が斜めの場合、最長部の値を測定値とする。
  columns: null
  answer: 3
  choice_notes: []
  explanation: '検知剤と測定対象物質との反応は、前処理剤（前段に酸化剤など）を**必要とする場合があります**。よって（3）が、正しい記述です。


    検知管は、一般に、作業場所の室温にしてから使います（10℃以下に冷却しません）。検知剤は、測定対象物質以外の物質とも反応することがあります。検知剤の変色層の長さは、担体粒子径の影響を受けます。変色層が斜めのときは、変色した部分の最先端と斜めに変色が生じ始めた点の、中央値を読み取ります。'
