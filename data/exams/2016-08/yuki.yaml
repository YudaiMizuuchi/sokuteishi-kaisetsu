  stem: ガスクロマトグラフに利用されている検出器に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電子捕獲検出器は、放射性同位元素から放出されるβ線と電子捕獲型分子の反応を利用している。
  - 質量分析器により、同じ保持時間の有機溶剤でも、定量分析できることがある。
  - 炎光光度検出器は、リン、硫黄などを含む化合物の分析に適している。
  - 熱伝導度検出器は、キャリアガスと対象物質の加熱フィラメントに対する熱伝導度の差を利用している。
  - 水素炎イオン化検出器は、ほとんどの有機化合物を検出できる。
