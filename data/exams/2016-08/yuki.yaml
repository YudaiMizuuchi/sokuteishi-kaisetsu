  stem: 二硫化炭素20mL中にトルエン450μLを含む標準液がある。この標準液2.0μLをマイクロシリンジで採取し、清浄空気の入っている1,000mLの真空捕集びんに完全に蒸発させた場合、真空捕集びん中のトルエン濃度として、正しい値に最も近いものは次のうちどれか。ただし、トルエンの密度を0.86g·cm⁻³、モル質量を92g·mol⁻¹とする。また、真空捕集びんの中は、25℃、1気圧とする。
  choices:
  - 5ppm
  - 10ppm
  - 15ppm
  - 20ppm
  - 25ppm
  columns: null
  answer: 2
  choice_notes: []
  explanation: '次の順で計算します。


    1. 標準液2.0 µLに含まれるトルエン：2.0 µL × 450 µL／20000 µL ＝ 0.045 µL

