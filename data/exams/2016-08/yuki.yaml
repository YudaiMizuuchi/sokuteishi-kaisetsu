  stem: 有機溶剤の液体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 試料空気の気泡を細かくすると、捕集率が高まる。
  - 試料空気との接触面積を大きくするため、ガラスビーズを入れることがある。
  - 捕集液に溶解させて捕集する場合は、捕集液を冷却すると一般に捕集率を高めることができる。
  - 捕集液との化学反応を利用して捕集することがある。
  - 試料空気を液体と接触させ、慣性衝突を利用して捕集する方法である。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '有機溶剤の液体捕集法は、試料空気を、捕集液中で細かい気泡にして接触させ、有機溶剤の**蒸気（ガス）を捕集液に溶解、または反応**させて捕集する方法です。「慣性衝突を利用して捕集する方法」とする選択肢5は誤りです（慣性衝突は、粒子状物質の捕集の原理です）。同様の記述は、令和3年度第1回にも出題されています（出題実績）。


    気泡を細かくすると、捕集率が高まります。接触面積を大きくするために、ガラスビーズを入れることがあります。捕集液に溶解させて捕集するときは、捕集液を冷却すると、一般に捕集率が高まります。捕集液との化学反応を利用して捕集することがあります。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
