  stem: 常温・常圧(25℃、1気圧)において、容積1m³の3つの容器に、アセトン、エチルエーテル、1,1,1-トリクロロエタンそれぞれ1gを、各容器中に完全に気化させた。この場合における各物質の容器中の濃度と管理濃度との関係に関する次の記述のうち、正しいものはどれか。ただし、それぞれの管理濃度は、アセトン500ppm、エチルエーテル400ppm、1,1,1-トリクロロエタン200ppmであり、原子量は、C 12、H 1、O 16、Cl 35.5とする。
  choices:
  - アセトン、エチルエーテル及び1,1,1-トリクロロエタンの3物質とも、容器中の濃度は管理濃度を下回っている。
  - エチルエーテル及び1,1,1-トリクロロエタンの2物質のみが、容器中の濃度が管理濃度を下回っている。
  - アセトンのみが、容器中の濃度が管理濃度を下回っている。
  - エチルエーテルのみが、容器中の濃度が管理濃度を下回っている。
  - 1,1,1-トリクロロエタンのみが、容器中の濃度が管理濃度を下回っている。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '容器1 m³に、各物質1 gを気化させたときの濃度（25℃、1気圧）を、ppmに換算します（1 g/m³＝1000 mg/m³、ppm ＝ mg/m³ × 24.45／分子量）。


    - アセトン（C₃H₆O、58）：1000 × 24.45／58 ≒ 422 ppm（管理濃度500 ppmを**下回る**）

    - エチルエーテル（C₄H₁₀O、74）：1000 × 24.45／74 ≒ 330 ppm（管理濃度400 ppmを**下回る**）

    - 1,1,1-トリクロロエタン（C₂H₃Cl₃、133.5）：1000 × 24.45／133.5 ≒ 183 ppm（管理濃度200 ppmを**下回る**）


    3物質とも、管理濃度を下回っているので、（1）です。'
