  stem: ガスクロマトグラフ分析法の検出下限及び定量下限を求める次の手順のうち、誤っているものはどれか。
  choices:
  - 管理濃度の1/10に相当する標準試料を調製する。
  - 標準試料を5回分析し、濃度を検量線から求める。
  - 標準試料の濃度の測定値から平均値と標準偏差を求める。
  - 標準偏差の3倍に相当する濃度を検出下限とする。
  - 標準偏差の5倍に相当する濃度を定量下限とする。
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'ガスクロマトグラフ分析法の**定量下限**は、管理濃度の1/10に相当する標準試料を、5回以上繰り返し分析して、標準偏差を求め、その**10倍**に相当する濃度です。「標準偏差の5倍に相当する濃度を定量下限とする」とする選択肢5は誤りです。標準偏差の3倍に相当する濃度が、検出下限です。同様の記述は、令和元年度第1回にも出題されています（出題実績）。


