  stem: 有機溶剤の標準液の調製に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 標準液を質量で調製する場合は、秤量容器として小型ビーカーを使用する。
  - 全量ピペットの標線は、20℃を基準に定められている。
  - 標準原液は、室温に戻してから使用する。
  - 標準液を容量で調製する場合、モル濃度(mol·L⁻¹)は、温度の影響を受ける。
  - 標準液を質量で調製する場合、質量モル濃度(mol·kg⁻¹)は、温度の影響を受けない。
