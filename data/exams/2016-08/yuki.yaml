  stem: 有機溶剤の捕集に関する次の記述のうち、正しいものはどれか。
  choices:
  - サンプリング時間は、管理濃度の1/10以下の濃度まで測定可能であれば10分未満でもよい。
  - 較正した流量計を用いても、捕集装置の圧力損失が大きいときは、差圧計で読み取った圧力損失の値を用いて流量補正を行う。
  - 真空捕集びんに試料を採取する際の空気吸引流量は、一定である。
  - 試料空気の採取には、一般に、内容積が1L以下のガラス製の真空捕集びんが用いられる。
  - 種類の異なる活性炭管を使用する場合、電動ポンプの流量較正は、最初に使用する活性炭管を接続した状態で行う。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '校正した流量計を使っても、捕集装置の圧力損失が大きいときは、**差圧計で読み取った圧力損失の値を使って、流量補正を行います**。よって（2）が、正しい記述です。


    サンプリング時間は、管理濃度の1/10以下の濃度まで測定可能であっても、原則として10分以上とします。真空捕集びんの吸引流量は、びん内の圧力が上がるにつれて減るので、一定ではありません。真空捕集びんには、内容積1 L以上のガラス製のものを使います。種類の異なる活性炭管を使う場合は、使う活性炭管ごとに、接続した状態で、流量を校正します。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
