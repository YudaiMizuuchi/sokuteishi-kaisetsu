  stem: ガスクロマトグラフ分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 保持時間が同一の場合、理論段数が大きいほどピーク幅は狭くなり、カラム効率が良い。
  - 充填カラムでは渦流拡散が大きく、キャリアガスの種類による分離度の差は少ない。
  - キャピラリカラム内に流すキャリアガス流量は、検出器にとって適切な流量となるように設定する。
  - 移動相と固定相との分配平衡は、速やかに成立する。
  - カラム長さが2倍になると、保持時間及び理論段数はともに約2倍になる。
  columns: null
  answer: 3
  choice_notes: []
  explanation: 'キャピラリーカラムに流すキャリアガスの流量は、**カラムに適した流量**にし、検出器に必要な流量との差は、メイクアップガスで調整します。「検出器にとって適切な流量となるように設定する」とする選択肢3は、設定の基準が違うので誤りです。


    保持時間が同一の場合、理論段数が大きいほど、ピーク幅は狭くなり、カラム効率がよいです。充填カラムでは、渦流拡散が大きく、キャリアガスの種類による分離度の差は少ないです。移動相と固定相との分配平衡は、速やかに成立します。カラム長さが2倍になると、保持時間と理論段数は、ともに約2倍になります。


