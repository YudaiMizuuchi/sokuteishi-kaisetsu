  stem: 次の有機溶剤のうち、沸点が100℃以上で、かつ、25℃における密度が1.0g·cm⁻³以上のものはどれか。
  choices:
  - m-キシレン
  - 二硫化炭素
  - 1,2-ジクロロエチレン
  - m-クレゾール
  - イソペンチルアルコール
  columns: null
  answer: 4
  choice_notes: []
  explanation: '条件（沸点が100℃以上、かつ、25℃での密度が1.0 g/cm³以上）を、各溶剤に当てはめます。


    - m-キシレン：沸点約139℃、密度約0.86 g/cm³ → 密度が条件に合いません。

    - 二硫化炭素：密度約1.26 g/cm³ですが、沸点が約46℃で、条件に合いません。

    - 1,2-ジクロロエチレン：密度約1.26 g/cm³ですが、沸点が約48〜60℃で、条件に合いません。

    - **m-クレゾール**：沸点約202℃、密度約1.03 g/cm³ → 条件に合います。

    - イソペンチルアルコール：沸点約131℃、密度約0.81 g/cm³ → 密度が条件に合いません。


    よって（4）です。（沸点・密度は、一般的な化学便覧の概数です。）'
