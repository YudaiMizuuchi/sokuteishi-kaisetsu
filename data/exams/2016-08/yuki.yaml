  stem: 固体捕集法に用いる捕集剤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭は、窒素又は乾燥空気の気流の中で加熱脱水したものを用いる。
  - シリカゲルの吸着力は、温度の影響を受ける。
  - 活性炭管の第1層(前層)に捕集された試料は、保存中に第2層(後層)に移動することがある。
  - シリカゲルは、一般に、活性炭に比べて単位質量当たりの表面積は小さい。
  - ポーラスポリマービーズ(多孔性プラスチック)は表面の反応性が高いので、試料の重合、酸化などが生じる可能性がある。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '**ポーラスポリマービーズ**（多孔性プラスチック）は、表面の**反応性が低い**ので、試料の重合や酸化が起こりにくい捕集剤です。「表面の反応性が高いので、試料の重合、酸化などが生じる可能性がある」とする選択肢5は誤りです。同じ趣旨の記述は、平成29年度第1回にも出題されています（出題実績）。


    活性炭は、窒素または乾燥空気の気流中で加熱脱水したものを使います。シリカゲルの吸着力は、温度の影響を受けます。活性炭管の前層に捕集された試料は、保存中に後層に移動することがあります。シリカゲルは、活性炭に比べて、単位質量あたりの表面積が小さいです。


    （参考：『デザイン・サンプリングの実務（A・B測定編 上）』）'
