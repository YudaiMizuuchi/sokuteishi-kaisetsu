  stem: 厚生労働省の「職場における腰痛予防対策指針」に基づく、腰痛予防対策に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 満18歳以上の男子労働者が人力のみにより取り扱う物の重量は、体重のおおむね40%以下とする。
  - 重量物を持ち上げるときには、できるだけ身体を対象物に近づけ、重心を低くするような姿勢をとる。
  - 腰掛け作業では、膝や足先を自由に動かせる空間をとる。
  - 直接床に座る座作業は、腰掛け作業に比べ、仙腸関節、股関節等にかかる負担が少ない。
  - 腰部保護ベルトは、個人により効果が異なるため、一律に使用することは避ける。
  answer: 4
  choice_notes: []
  explanation: '直接床に座る座作業は、腰掛け作業に比べて、仙腸関節や股関節などにかかる負担が**大きく**なります。「負担が少ない」とする選択肢4は誤りです。


    体重のおおむね40％以下（選択肢1）、腰部保護ベルトは一律に使用しない（選択肢5）は、腰痛予防対策指針の正しい内容です。'
