  - gn-risk-assessment-06
  rank: null
  summary: null
  stem: '「化学物質等による危険性又は有害性等の調査等に関する指針(厚生労働省)」に基づいて、有害な化学物質のばく露によるリスクを低減するための措置を検討する場合、次の㋑から㋥について優先度の高い措置から順に並べたものは下のうちどれか。


    ㋑作業手順の改善、立入禁止等の管理的対策


    ㋺化学物質等の有害性に応じた有効な保護具の使用


    ㋩有害性のより低い物質への代替


    ㋥局所排気装置の設置等の衛生工学的対策'
  choices:
  - ㋑―㋩―㋥―㋺
  - ㋩―㋥―㋑―㋺
  - ㋩―㋥―㋺―㋑
  - ㋥―㋩―㋑―㋺
  - ㋥―㋩―㋺―㋑
  answer: 2
  choice_notes: []
  explanation: 'リスク低減措置は、次の優先順位で検討します。


    1. 有害性のより低い物質への代替など、危険性・有害性そのものをなくす・減らす措置（㋩）

    2. 局所排気装置の設置などの衛生工学的対策（㋥）

    3. 作業手順の改善、立入禁止などの管理的対策（㋑）

    4. 有害性に応じた有効な保護具の使用（㋺）


    よって、㋩ → ㋥ → ㋑ → ㋺ の（2）が正しいものです。


    保護具は、ほかの対策を尽くしたうえでの最後の手段です。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 10(1)。'
  figures: []
