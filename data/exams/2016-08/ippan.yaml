  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 無機水銀中毒の症状には、腎障害がある。
  - ベンゼンによる中毒では、再生不良性貧血などの造血器障害が起こる。
  - 二硫化炭素中毒では、微細動脈瘤などの網膜の変化が起こる。
  - 砒素中毒では、角化症、黒皮症などの皮膚障害、末梢神経障害などがみられる。
  - 一酸化炭素中毒では、血液中のグロブリンと一酸化炭素が強く結合し、体内の各組織が酸素欠乏状態を起こす。
  answer: 5
  choice_notes: []
  explanation: '一酸化炭素は、血液中の**ヘモグロビン**と強く結合して、体内の組織を酸素欠乏状態にします。グロブリンとする選択肢5は誤りです。


    平成30年度第1回にも、同じ選択肢があります。'
