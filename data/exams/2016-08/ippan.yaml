  stem: 金属等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - マンガンによる慢性中毒では、筋のこわばり、歩行困難などの症状がみられる。
  - 鉛中毒では、ヘム合成過程の阻害による貧血が起こる。
