  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - アーク溶接ヒュームは、じん肺を引き起こす原因となる。
  - じん肺の合併症としては、肺結核、続発性気管支炎、続発性気胸などがある。
  - 吸入された鉱物性粉じんの各呼吸部位での沈着率は、その空気力学相当径によって異なる。
  - 粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求められる。
  - アルミニウムの粉じんや炭素の粉じんは、じん肺を引き起こす原因となる。
  answer: 4
  choice_notes: []
  explanation: '空気力学相当径は、その粒子と同じ沈降速度を示す、密度 1 g/cm³ の球形粒子の直径で、沈み方から求める値です。光学顕微鏡による粒径測定で求めるものではないので、選択肢4は誤りです。


    （参考：環境省「粒子状物質の特性に関する知見の整理」。空気動力学径（空気力学相当径）は、密度が1で終末沈降速度が問題とする粒子と同じ球形粒子の径として定義され、光学顕微鏡で計測する投影面積粒径とは別のものです。）'
