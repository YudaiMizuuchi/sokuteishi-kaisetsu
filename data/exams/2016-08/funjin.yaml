  stem: 吸入性粉じん濃度の測定に用いられる分粒装置に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定に用いられる分粒装置は、空気力学相当径4μmの粒子を100%除去する。
  - 慣性衝突式分粒装置では、総粉じんと吸入性粉じんの濃度を同時に求めることができる。
  - 慣性衝突式分粒装置は、衝突板上にシリコングリースを円形ノズル孔の面積より大きな面積に塗布する。
  - 多段平行板式分粒装置の吸引口を斜め下方に向けて所定の吸引流量で吸引すると、分粒装置を通過する粒子の50%分粒粒径は小さくなる。
  - ハイボリウムエアサンプラーでは、分粒装置の衝突板の付着粉じんが多くなると、通過する粒子の粒径は大きい方へ移行する。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '吸入性粉じんの測定に使う分粒装置は、**空気力学相当径4 µmの粒子を50％除去**するように設計されています。「100％除去する」とする選択肢1は誤りです。同じ記述は、令和3年度第1回、令和元年度第1回にも出題されています（出題実績）。


    慣性衝突式分粒装置では、総粉じんと吸入性粉じんの濃度を、同時に求められます。衝突板上には、シリコングリースを、円形ノズル孔の面積より大きな面積に塗布します。ハイボリウムエアサンプラーでは、衝突板の付着粉じんが多くなると、通過する粒子の粒径は、大きいほうへ移行します。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
