  stem: '次の記述の［　　］内に入る語句として、正しいものは下のうちどれか。


    「粒径5 µm程度の球形粒子が媒質中を落下する際の終末速度は、［　　］に比例する。」'
  choices:
  - 粒子の直径
  - 粒子の密度
  - 媒質の密度
  - 重力加速度の逆数
  - 媒質の粘性係数の逆数
  columns: null
  answer: 5
  choice_notes: []
  explanation: 'ストークスの式は、終末速度 v ＝（ρ − ρ₀）× g × d² ／（18 η）です。終末速度は、粒子の直径の2乗、粒子の密度、重力加速度に比例し、**媒質の粘性係数の逆数**（粘性係数に反比例）に比例します。よって（5）です。同じ型の問題は、令和元年度第1回にも出題されています（出題実績）。


    （参考：『作業環境測定のための労働衛生の知識』）'
