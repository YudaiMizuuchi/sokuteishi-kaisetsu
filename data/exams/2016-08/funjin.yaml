  stem: りん酸法により、石英含有率を求めるため、液相沈降法により10μm以下に粒度調整した試料200.00mgをりん酸で処理し、りん酸残渣として55.00mgを得た。このりん酸残渣を白金るつぼに移し、フッ化水素酸で処理したところ、フッ化水素酸残渣0.70mgが得られた。石英含有率(%)の値に最も近いものは次のうちどれか。ただし、標準石英について求めたりん酸残渣率は98.0%であったものとする。
  choices:
