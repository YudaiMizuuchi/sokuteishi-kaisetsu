  stem: 密度2.6g/cm³、粒径10.0μmの球形粒子の水中における自由落下の終末速度を測定して8.7×10⁻³cm/sを得た。同じ条件のもとで、別に密度1.8g/cm³、粒径7μmの球形粒子について同様の測定をしたときの終末速度の値に最も近いものは次のうちどれか。ただし、粒子の終末速度はストークスの式に従い、また、水の密度は1.0g/cm³とする。
  choices:
  - 1.1×10⁻³cm/s
  - 2.1×10⁻³cm/s
  - 3.1×10⁻³cm/s
  - 4.1×10⁻³cm/s
  - 5.1×10⁻³cm/s
  columns: null
  answer: 2
  choice_notes: []
  explanation: '終末沈降速度は、ストークスの式から、（ρ − ρ₀）× d² に比例します（水中なので、ρ₀＝1.0 g/cm³）。2つの粒子の比をとります。


    - 1つ目：（2.6 − 1.0）× 10.0² ＝ 1.6 × 100 ＝ 160

    - 2つ目：（1.8 − 1.0）× 7² ＝ 0.8 × 49 ＝ 39.2


    2つ目の速度 ＝ 8.7 × 10⁻³ × 39.2／160 ≒ **2.1 × 10⁻³ cm/s**


    よって（2）です。'
