  stem: 媒質中の粒子の挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 遠心力場における粒子の移動速度は、回転半径の二乗に反比例する。
  - 空気中でブラウン運動する粒子の個数濃度が半減する時間は、濃度が1/10になれば約10倍となる。
  - 空気中に浮遊する粒子を捕集して、それぞれの大きさを計測し、平均粒子径を求める場合、個数基準平均径の方が質量基準平均径より小さくなる。
  - 粒子の帯電量が同じであれば、粒子の電界中での移動速度は小さな粒子の方が速い。
  - 重力による自然沈降の終末速度は、粒径が2倍になれば4倍になる。
  columns: null
  answer: 1
  choice_notes: []
  explanation: '遠心力場における粒子の移動速度は、回転半径に**比例**し、角速度の2乗に比例します。「回転半径の二乗に反比例する」とする選択肢1は誤りです。同じ記述は、令和3年度第1回、令和2年度第1回にも出題されています（出題実績）。


    ブラウン運動によって、粒子の個数濃度が半減する時間は、濃度が1/10になれば、約10倍になります。個数基準平均径は、質量基準平均径より小さくなります。粒子の帯電量が同じであれば、電界中での移動速度は、小さな粒子のほうが速いです。重力による自然沈降の終末速度は、粒径が2倍になれば、4倍になります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
