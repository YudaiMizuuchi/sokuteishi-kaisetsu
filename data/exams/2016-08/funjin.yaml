  stem: '粉じんの相対濃度計の質量濃度変換係数(K値)を求めるため、サンプリング時間を60minとして併行測定を行い、次の結果を得た。これらの値から求められたK値の誤差として、正しい値に最も近いものは下のうちどれか。


    質量濃度：0.35mg/m³


    相対濃度：280cpm


    ただし、粉じんの捕集流量：20L/min、粉じん捕集前後のろ紙の秤量誤差：それぞれ0.005mg、吸引空気量の測定誤差：3.0%、計数値の誤差：20カウントとする。'
  choices:
  - 3.5%
  - 4.0%
  - 4.5%
  - 5.0%
  - 5.5%
  columns: null
  answer: 5
  choice_notes: []
  explanation: '質量濃度変換係数 K ＝ 質量濃度／相対濃度 の誤差は、各誤差を足し合わせて求めます。


    1. 吸引した空気の量：20 L/min × 60 min ＝ 1200 L ＝ 1.2 m³

    2. 捕集した粉じんの質量：0.35 mg/m³ × 1.2 m³ ＝ 0.42 mg

    3. 秤量誤差による相対誤差：捕集前後の2回分なので、2 × 0.005／0.42 ≒ 2.4％

    4. 吸引空気量の測定誤差：3.0％

    5. 計数値の誤差：60分間の総カウント数は 280 × 60 ＝ 16800 なので、20／16800 ≒ 0.12％

    6. 合計：2.4 ＋ 3.0 ＋ 0.12 ≒ **5.5％**


    よって（5）です。同じ型の問題は、平成30年度第1回にも出題されています（出題実績）。'
