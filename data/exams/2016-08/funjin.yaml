  explanation: '**オパール**（たんぱく石）は、石英の微細結晶が集まった鉱物ではなく、**非晶質のシリカ**（SiO₂・nH₂O）です（石英の微細結晶が集まった鉱物は、玉ずい、メノウ、フリントなどです）。「オパールは、石英の微細結晶が集まった鉱物であり」とする選択肢3は誤りです。ただし、オパールは、遊離けい酸含有率の測定の対象に含まれます。


