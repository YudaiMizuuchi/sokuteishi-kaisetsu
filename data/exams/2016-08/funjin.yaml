  explanation: '位相差顕微鏡による石綿粉じんの計数では、**計数視野領域に繊維の片方の端が入っている場合は、1/2本として数えます**。「1本として数える」とする選択肢4は誤りです。


    アイピースグレーティクルの大円内（φ0.3 mm）を計数する場合は、繊維数200本以上、または検鏡した視野の数が50視野になるまで数えます。数本の繊維が交差している場合は、交差している繊維それぞれを1本として数えます。1本の繊維が枝分かれしている場合は、枝分かれした部分を含めて1本として数えます。石綿繊維数濃度の計算では、ブランク値を求めておきます。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
