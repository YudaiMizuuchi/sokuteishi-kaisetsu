  stem: 粉じんのろ過捕集で用いられる流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 面積式流量計は、浮子とテーパー管との間隙の面積と、そこを流れる試料空気の体積流量が比例することを利用した流量計である。
  - 石けん膜流量計を用いてローボリウムエアサンプラーの流量計の較正を行ってもよい。
  - ハイボリウムエアサンプラーに表示される流量の較正は、ルーツメーターによって較正されたオリフィス流量計を用いてもよい。
  - 面積式流量計にはあらかじめ流量目盛りが刻まれているので、流量を計測する際には、目盛りを読み取ればよい。
  - 面積式流量計の指示が脈動して読み取りが難しい場合は、流量計と吸引ポンプの間にコンデンサー(空気だめ)を設けるとよい。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '面積式流量計は、あらかじめ流量目盛りが刻まれていますが、**使用前に、使用条件に合わせた状態で、流量の校正を行う**必要があります。「目盛りを読み取ればよい」とする選択肢4は誤りです。同じ趣旨の記述は、令和3年度第1回にも出題されています（出題実績）。


    面積式流量計は、浮子とテーパー管との間隙の面積と、体積流量が比例することを利用します。石けん膜流量計は、ローボリウムエアサンプラーの流量計の校正に使えます。ハイボリウムエアサンプラーの流量の校正には、ルーツメーターで校正したオリフィス流量計を使えます。指示が脈動するときは、流量計と吸引ポンプの間に空気だめを設けます。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
