  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒径が0.1μmより小さい粒子では、拡散効果が有効であり、粒径が小さくなるほど捕集効率は上昇する。
  - 繊維層フィルターは、1本1本の繊維が独立した平行円柱群モデルフィルターとみなすことができる。
  - 繊維層フィルターの粉じん捕集率は、粒径0.1～0.3 µm付近で最も低くなる。
  - 粉じんを測定する場合には、0.3μmのステアリン酸粒子に対する捕集率が95%以上であれば、吸湿量が小さいろ過材を使用した方がよい。
  - 繊維層フィルターは内部の繊維間の隙間に粒子を捕捉する。
  columns: null
  answer: 5
  choice_notes: []
  explanation: '繊維層フィルターは、1本1本の繊維が独立した平行円柱群とみなせるフィルターで、粒子は、**繊維の表面**で捕集されます（慣性、重力、さえぎり、拡散の各効果による）。「内部の繊維間の隙間に粒子を捕捉する」とする選択肢5は、捕集の機構の説明として誤りです。同様の記述は、令和5年度第1回などにも出題されています（出題実績）。


    粒径が0.1 µmより小さい粒子では、拡散効果が有効で、粒径が小さいほど、捕集効率は上昇します。繊維層フィルターの捕集率は、粒径0.1〜0.3 µm付近で最も低くなります。


    （参考：『作業環境測定ガイドブック1［鉱物性粉じん・石綿・RCF］の測定の実務』（旧版））'
