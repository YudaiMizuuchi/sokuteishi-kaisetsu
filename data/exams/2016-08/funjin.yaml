  stem: 環境空気中に浮遊する粉じん粒子のろ過捕集に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒径が0.1μmより小さい粒子では、拡散効果が有効であり、粒径が小さくなるほど捕集効率は上昇する。
  - 繊維層フィルターは、1本1本の繊維が独立した平行円柱群モデルフィルターとみなすことができる。
  - 繊維層フィルターの粉じん捕集率は、粒径0.1～0.3 µm付近で最も低くなる。
  - 粉じんを測定する場合には、0.3μmのステアリン酸粒子に対する捕集率が95%以上であれば、吸湿量が小さいろ過材を使用した方がよい。
  - 繊維層フィルターは内部の繊維間の隙間に粒子を捕捉する。
