  stem: 吸入性粉じん濃度の測定に用いられる分粒装置に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定に用いられる分粒装置は、空気力学相当径4μmの粒子を100%除去する。
  - 慣性衝突式分粒装置では、総粉じんと吸入性粉じんの濃度を同時に求めることができる。
  - 慣性衝突式分粒装置は、衝突板上にシリコングリースを円形ノズル孔の面積より大きな面積に塗布する。
  - 多段平行板式分粒装置の吸引口を斜め下方に向けて所定の吸引流量で吸引すると、分粒装置を通過する粒子の50%分粒粒径は小さくなる。
  - ハイボリウムエアサンプラーでは、分粒装置の衝突板の付着粉じんが多くなると、通過する粒子の粒径は大きい方へ移行する。
