  stem: X線回折基底標準吸収補正法によって、粉じん中の石英を定量するための方法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 基底標準吸収補正法は、試料の後側に置いた基底標準物質のX線回折強度の変化量を基にして、分析試料のX線吸収量を補正する方法である。
  - 基底標準物質として、フッ素樹脂加工グラスファイバーろ紙中のフッ素樹脂を用いることができる。
  - 吸収補正を行うことにより、定量範囲は狭くなるが、マトリックスの吸収の影響を少なくすることができる。
  - 検量線用標準フィルター試料は、ろ過材上の標準石英粒子の量をおよそ0.2～1.2mg/cm²までの7段階程度になるように作製する。
  - 検量線は、縦軸にX線吸収補正係数を乗じた石英の回折線強度をとり、横軸に石英量をとって作成する。
