  stem: '次の㋑～㋥の作業について、法令上、作業主任者の選任が義務付けられているものの組合せは下のうちどれか。


    ㋑飼料の貯蔵のために使用しているサイロの内部における作業


    ㋺製造工程において硫酸を用いて行う洗浄の作業


    ㋩廃棄物の焼却施設において焼却灰を取り扱う作業


    ㋥屋内作業場におけるアーク溶接の作業'
  choices:
  - ㋑㋺
  - ㋑㋩
  - ㋺㋩
  - ㋺㋥
  - ㋩㋥
  answer: 1
  choice_notes: []
  explanation: '飼料の貯蔵に使うサイロの内部の作業（㋑）は酸素欠乏危険作業で、酸素欠乏危険作業主任者の選任が必要です。硫酸を用いる洗浄の作業（㋺）は、第3類物質の取扱いなので、特定化学物質作業主任者の選任が必要です。よって（1）が正しい組合せです。


    焼却灰の取扱い（㋩）は特別教育の対象で、屋内のアーク溶接（㋥）は、この試験の時点では作業主任者の規定がありませんでした。'
  figures: []
  law_note: 令和4年4月1日以降、屋内での金属アーク溶接等作業（㋥）にも、金属アーク溶接等作業主任者の選任が必要です。現行法では、この問題の答えは変わります。
  _key_choice: ㋑ ㋺
