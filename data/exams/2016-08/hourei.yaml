  stem: 衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、常時50人以上の労働者を使用する事業場については、その業種に関係なく産業医を選任しなければならない。
  - 産業医は、少なくとも毎月1回作業場等を巡視し、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  - 事業者は、常時100人以上の労働者を使用する事業場については、その業種に関係なく総括安全衛生管理者を選任しなければならない。
  - 事業者は、衛生管理者を選任すべき事由が発生した場合は、その日から14日以内に選任しなければならない。
  - 衛生管理者は、少なくとも毎週1回作業場等を巡視し、設備、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  answer: 3
  choice_notes: []
  explanation: 総括安全衛生管理者を選任しなければならない規模は、業種によって違います（林業・建設業などは100人以上、製造業などは300人以上、その他の業種は1,000人以上）。「業種に関係なく100人以上」とする選択肢3は誤りです。
  figures: []
  law_note: null
