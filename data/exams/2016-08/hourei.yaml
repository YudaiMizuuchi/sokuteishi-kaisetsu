  stem: 事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 機械による換気のための設備について、2か月以内ごとに1回、定期に、異常の有無を点検しなければならない。
  - 空気調和設備を設けている場合は、室の気温が17℃以上28℃以下及び相対湿度が40%以上70%以下になるように努めなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室について、原則として、2か月以内ごとに1回、定期に、空気中の一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 空気調和設備を設けている場合は、室に供給される空気中のホルムアルデヒドの量(1気圧、25℃とした場合の空気1m³中に含まれるホルムアルデヒドの質量)を0.1mg以下としなければならない。
  - 燃焼器具(発熱量が著しく少ないものを除く。)を使用するときは、1か月以内ごとに1回、定期に、当該器具の異常の有無を点検しなければならない。
