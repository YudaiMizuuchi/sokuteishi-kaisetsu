  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉱物性粉じんの濃度の測定を相対濃度指示方法によって行う場合には、当該単位作業場所における1か所以上の測定点において、分粒装置を用いるろ過捕集方法及び重量分析方法による測定を同時に行わなければならない。
  - 相対濃度指示方法による鉱物性粉じんの測定においても、一つの測定点における試料空気の採取時間は、10分間以上の継続した時間としなければならない。
  - 作業環境測定基準で定める一定の有機溶剤の濃度を測定する場合、当該有機溶剤以外の物が測定値に影響を及ぼすおそれがないときは、検知管方式の測定機器により測定することができる。
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 石綿等を取り扱う屋内作業場における空気中の石綿の濃度の測定は、ろ過捕集方法及び計数方法によらなければならない。
  answer: 2
  choice_notes: []
  explanation: '相対濃度指示方法による鉱物性粉じんの測定では、1つの測定点での試料採取時間を10分間以上とする必要はありません。選択肢2は誤りです。


    根拠：作業環境測定基準第2条第1項第3号ただし書。'
