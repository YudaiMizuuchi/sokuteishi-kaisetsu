  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 事業者は、雇入時の健康診断の結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 常時50人以上の労働者を使用する事業者は、雇入時の健康診断を行ったときは、遅滞なく、雇入時健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 事業者は、常時使用する労働者に対し、原則として、1年以内ごとに1回、法令で定める項目について医師による定期健康診断を行わなければならない。
  - 事業者は、定期健康診断の結果、異常の所見があると診断された労働者については、その健康を保持するために必要な措置について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。
  answer: 3
  choice_notes: []
  explanation: 雇入時の健康診断の結果は、労働者数にかかわらず、所轄労働基準監督署長に報告する必要はありません。選択肢3は誤りです。
