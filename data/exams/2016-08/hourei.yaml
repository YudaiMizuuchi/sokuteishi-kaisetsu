  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 廃棄物の焼却施設において焼却灰を取り扱う業務(設備の解体等に伴うものを除く。)を行う作業場については、6か月以内ごとに1回、定期に、当該作業場における空気中のダイオキシン類の濃度を測定しなければならない。
  - 電気炉により金属を精錬する業務を行い、著しく暑熱な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 多量のドライアイスを取り扱う業務を行い、著しく寒冷な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始する前に、当該作業場における空気中の硫化水素の濃度を測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: 第1種酸素欠乏危険作業では、その日の作業開始前に測定するのは**酸素**の濃度です。硫化水素の濃度もあわせて測定するのは、第2種酸素欠乏危険作業です。選択肢5は誤りです。
  figures: []
  law_note: null
