  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第1評価値が管理濃度未満で、かつ、B測定の測定値が管理濃度の1.0 倍以上1.5倍以下である単位作業場所の管理区分は、第2管理区分である。
  - 2作業日に測定を行う場合において、連続する2作業日について測定を行うことができない合理的な理由があるときは、必要最小限の間隔を空けた2作業日に測定を行うことができる。
  - 測定値が管理濃度の5分の1に満たない測定点がある単位作業場所にあっては、管理濃度の5分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - A測定のみを行った場合、第1評価値が管理濃度以上であり、かつ、第2評価値が管理濃度以下である単位作業場所の管理区分は、第2管理区分である。
  - トルエン及びキシレンの混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を 1として管理区分の区分を行うものとする。
  answer: 3
  choice_notes: []
  explanation: '測定値が管理濃度の **10分の1**に満たない測定点がある場合に、管理濃度の10分の1をその測定点の測定値とみなすことができます。5分の1とする選択肢3は誤りです。


    根拠：作業環境評価基準第2条第3項。'
