  stem: 次の業務に常時労働者をつかせるとき、法令に基づく安全又は衛生のための特別の教育を行わなければならないものはどれか。
  choices:
  - 有機溶剤等を入れたことがあるタンクの内部における業務
  - 強烈な騒音を発する場所における業務
  - 人力により重量物を取り扱う業務
  - 屋内の、セメントを袋詰めする場所における業務
  - 水深10m以上の場所における潜水業務
  answer: 4
  choice_notes: []
  explanation: '屋内でセメントを袋詰めする場所での業務は、特定粉じん作業に当たり、特別教育が必要です。よって答えは（4）です。


    有機溶剤等を入れたタンク内部の業務（有機溶剤作業主任者）、強烈な騒音、重量物の取扱い、潜水業務（潜水士の免許）には、特別教育の規定はありません。'
