  stem: 労働安全衛生規則の衛生基準に関し、次の措置のうち、法令に違反しているものはどれか。
  choices:
  - 常時50人以上の労働者を使用しているので、労働者が臥床することのできる休養室を男女別に設けている。
  - 労働者を常時就業させる屋内作業場において、直接外気に向かって開放することができる窓の面積を、常時床面積の20分の1としている。
  - 労働者を常時就業させる屋内作業場の気温が10℃以下であるので、換気に際し、労働者がさらされる気流を0.5m/s以下としている。
  - 労働者を常時就業させる場所の照明設備について、6か月以内ごとに1回、定期に、点検している。
  - 労働者を常時就業させる屋内作業場の気積を、設備の占める容積及び床面から5mをこえる高さにある空間を除き、労働者1人について10m³としている。
  answer: 5
