  stem: 環境空気中の金属の分析法Ⓐとその分析原理の基礎となる現象Ⓑの次の組合せのうち、誤っているものはどれか。
  choices:
  - 吸光光度分析法 ／ キレート分子などの光吸収
  - 蛍光光度分析法 ／ 物質による蛍光の発生
  - 原子吸光分析法 ／ 基底状態原子の光吸収
  - 高周波誘導結合プラズマ発光分析法(ICP-AES) ／ 基底状態原子の発光
  - 高周波誘導結合プラズマ質量分析法(ICP-MS) ／ 原子のイオン化
  columns:
  - Ⓐ
  - Ⓑ
  answer: 4
  choice_notes: []
  explanation: 'ICP-AESは、**励起状態の原子およびイオン**の発光を利用します。「基底状態原子の発光」とする選択肢4は誤りです（基底状態の原子が光を吸収するのは、原子吸光分析法です）。同様の記述は、令和3年度第1回などにも出題されています（出題実績）。


    吸光光度分析法はキレート分子などの光吸収、蛍光光度分析法は物質による蛍光の発生、原子吸光分析法は基底状態原子の光吸収、ICP-MSは原子のイオン化を利用します。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
