  stem: 原子吸光分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 中空陰極放電ランプは、陰極が測定対象金属又はその合金からなり、その金属固有の輝線スペクトルを発する。
  - 化学炎、電気加熱などにより測定対象元素を原子化する。
  - フレーム原子吸光分析法における試料液の粘性の影響は、高周波誘導結合プラズマ質量分析法(ICP-MS)よりも大きい。
  - 検量線が直線性を示す吸光度の範囲は、吸光光度分析法に比べて狭い。
  - 測定中の吸光度の時間的変動は、吸光光度分析法に比べて大きい。
