  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガラスセルは、測定波長が可視部にある場合に用いる。
  - 測定波長が紫外部にある場合は、光源にタングステンランプを用いる。
  - 吸光度の測定には、通常、極大吸収波長を用いる。
  - 吸光度が濃度に比例することをベールの法則という。
  - 吸光度の読み取りにおいて誤差が最も小さい吸光度は0.4付近である。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '測定波長が**紫外部**にある場合は、光源に**重水素ランプ**を使います。**タングステンランプ**は、可視部の光源です。「測定波長が紫外部にある場合は、光源にタングステンランプを用いる」とする選択肢2は誤りです。同様の記述は、令和5年度第1回にも出題されています（出題実績）。


    ガラスセルは、測定波長が可視部にある場合に使います。吸光度の測定には、通常、極大吸収波長を使います。吸光度が濃度に比例することを、ベールの法則といいます。吸光度の読み取りの誤差が最も小さいのは、吸光度0.4付近です。


    （参考：『機器分析の実務［特定化学物質・金属類・有機溶剤］』）'
