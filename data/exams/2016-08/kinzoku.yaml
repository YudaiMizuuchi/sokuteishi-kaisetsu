  stem: 溶媒抽出-原子吸光分析法によるカドミウムの分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - キレート剤のAPDCは、あらかじめMIBKで処理して精製する。
  - 抽出溶媒のMIBKは、あらかじめ精製水と振り混ぜ、水を飽和させたものを用いる。
  - カドミウムのAPDC錯体は、アルカリ性溶液からMIBKに抽出する。
  - 検量線の作成には、試料と同様にMIBKに抽出した溶液を用いる。
  - 試料液中に共存して分光学的干渉の原因となる塩化ナトリウムは除去される。
