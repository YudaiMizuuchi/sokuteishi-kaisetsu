  stem: 吸光光度分析法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ガラスセルは、測定波長が可視部にある場合に用いる。
  - 測定波長が紫外部にある場合は、光源にタングステンランプを用いる。
  - 吸光度の測定には、通常、極大吸収波長を用いる。
  - 吸光度が濃度に比例することをベールの法則という。
  - 吸光度の読み取りにおいて誤差が最も小さい吸光度は0.4付近である。
