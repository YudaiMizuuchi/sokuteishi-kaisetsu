  stem: 金属の化学的性質に関する次の記述のうち、誤っているものはどれか。
  choices:
  - カドミウムは、希硝酸に溶ける。
  - クロムは、王水に溶ける。
  - バナジウムは、希硝酸と過酸化水素水の混合液に溶ける。
  - 水銀は、王水に溶ける。
  - 鉛は、硝酸に溶ける。
  columns: null
  answer: 2
  choice_notes: []
  explanation: '**クロム**は、濃硝酸や王水に対しては、表面に緻密な酸化被膜（不動態）ができて、**ほとんど溶けません**（希塩酸には溶けます）。「クロムは、王水に溶ける」とする選択肢2は誤りです。


    カドミウムは希硝酸に、バナジウムは希硝酸と過酸化水素水の混合液に、水銀は王水に、鉛は硝酸に溶けます。'
  figures: []
  law_note: null
  minor_note: クロムが王水に溶けにくい（不動態になる）、という点は、プロジェクトの教科書で確認できておらず、一般的な化学の知識による説明です。根拠の確認は後回しにしています。
