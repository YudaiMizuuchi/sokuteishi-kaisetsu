  stem: 金属酸化物の酸への溶解に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 酸化鉄(Ⅲ)は、塩酸に溶ける。
  - 酸化鉛(Ⅱ)は、硝酸に溶ける。
  - 酸化クロム(Ⅲ)は、塩酸に溶けない。
  - 酸化マンガン(Ⅳ)は、硝酸に溶ける。
  - 酸化バナジウム(Ⅴ)は、硫酸に溶ける。
  columns: null
  answer: 4
  choice_notes: []
  explanation: '**酸化マンガン(Ⅳ)**（MnO₂）は、**塩酸に溶けます**が、硝酸には溶けません。「硝酸に溶ける」とする選択肢4は誤りです。令和元年度第1回の問題では、「酸化マンガン(Ⅳ)は、塩酸に溶ける」が、正しい記述として出題されています（出題実績）。


    酸化鉄(Ⅲ)は塩酸に、酸化鉛(Ⅱ)は硝酸に、酸化バナジウム(Ⅴ)は硫酸に溶けます。酸化クロム(Ⅲ)は、塩酸に溶けません。'
