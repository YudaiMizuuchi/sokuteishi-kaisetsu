  stem: 次の記述のうち、誤っているものはどれか。
  choices:
  - 放射能は、物質中の原子核が単位時間当たりに壊変する数で、単位はBqである。
  - 照射線量は、X線やγ線に照射された単位質量当たりの空気中で発生した正又は負の電荷量で、単位はC·kg⁻¹である。
  - 吸収線量は、放射線の照射により物質の単位質量当たりに吸収されたエネルギーで、単位はJ·kg⁻¹又はGyである。
  - 周辺線量当量率は、単位面積当たりの1cm線量当量で、単位はSv·m⁻²である。
  - 放射能濃度は、物質の単位質量当たりの放射能の量で、単位はBq·kg⁻¹である。
