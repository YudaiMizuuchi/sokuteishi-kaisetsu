  stem: 次の記述のうち、誤っているものはどれか。
  choices:
  - 作業環境測定における1cm線量当量は、均一で単一方向からの平行ビームでICRU球全体を照射したとき、照射軸上の深さ1cmにおける線量当量として定義される。
  - 眼の水晶体の等価線量の算定は、放射線の種類及びエネルギーに応じて、1cm線量当量又は70μm線量当量のうちいずれか適切なものによって行う。
  - 実効線量は、人体の臓器・組織の等価線量に組織加重係数をかけたものの和として定義される。
  - 男性の放射線業務従事者の実効線量限度は、5年間につき100mSv、かつ1年間につき50mSvである。
  - 誘導空気中濃度(DAC)とは、3か月摂取限度を超えることがないように設定された放射性物質の空気中濃度である。
