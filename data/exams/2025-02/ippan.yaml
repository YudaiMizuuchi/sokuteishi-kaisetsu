  stem: 「化学品の分類および表示に関する世界調和システム（GHS）」に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 危険有害性には、「物理化学的危険性」、「健康に対する有害性」、「環境に対する有害性」の三つがあり、このうち、「健康に対する有害性」には、発がん性、生殖毒性、誤えん有害性など10の危険有害性クラスがある。
  - 危険有害性区分が数字で示されているものは、区分の数字が小さい方が危険有害性の程度が大きい。
  - 危険有害性クラスが異なっていても、危険有害性区分が同じものは、人体に対する危険有害性の大きさは同等であると判断できる。
  - 一つの絵表示が、複数の危険有害性クラスや危険有害性区分を表すことがある。
  - 絵表示を付す場合、複数の危険有害性を有する化学品については、複数の絵表示を付すことが原則である。
  answer: 3
  choice_notes: []
  explanation: '危険有害性区分の数字は、同じ危険有害性クラスの中での程度の大小を表すものです。クラスが違えば判定の基準そのものが違うので、区分の数字が同じでも、危険有害性の大きさが同等とはいえません。選択肢3は誤りです。


    たとえば「急性毒性 区分2」と「皮膚刺激性 区分2」は、まったく別の物差しでの区分です。区分の比較は同じクラスの中だけで意味をもちます。'
  figures: []
  law_note: null
  _key_choice: 危険有害性クラスが異なっていても、危険有害性区分が同じものは、人体に対する危険有害性の大きさは同等であると判断できる。
