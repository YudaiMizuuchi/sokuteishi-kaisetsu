  stem: 化学物質の吸収、代謝、蓄積等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 物質による有害作用が生じる最小の細胞内濃度を臨界濃度といい、全身の臓器のうち、最も早く臨界濃度に達する臓器を標的臓器という。
  - ベンゼンを吸入することによる毒性は、ベンゼン自体の毒性のほか、代謝産物であるフェノールやカテコールにより引き起こされるものがある。
  - n-ヘキサンの生物学的モニタリング指標は、尿中の 2,5- ヘキサンジオンである。
  - スチレン、エチルベンゼンは、いずれも代謝されて、尿中にマンデル酸として排泄される。
  - 鉛は、体内に入ると主に腎臓に蓄積された後、尿中に排出されるため、尿中鉛は、鉛の生物学的モニタリング指標の一つとして利用されている。
  answer: 5
  choice_notes: []
  explanation: '体内に取り込まれた鉛は、主に**骨**に蓄積します。骨に入った鉛は排泄が非常に遅く、生物学的半減期は年単位に及びます。主に腎臓に蓄積するとする選択肢5は誤りです。


    鉛の生物学的モニタリングの指標は、血液中の鉛（血中鉛）と、尿中のδ-アミノレブリン酸です。腎臓に蓄積するのはカドミウムの特徴なので、混同しないようにしましょう。'
  figures: []
  law_note: null
  _key_choice: 鉛は、体内に入ると主に腎臓に蓄積された後、尿中に排出されるため、尿中鉛は、鉛の生物学的モニタリング指標の一つとして利用されている。
