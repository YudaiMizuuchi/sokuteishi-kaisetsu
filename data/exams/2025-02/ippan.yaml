  stem: 粉じん及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんは、吸入した場合の呼吸器への到達の程度により、吸引性粉じん、咽頭通過性粉じん、吸入性粉じんに分けられる。
  - 作業環境測定において、空気力学相当径 4 µmの粉じん粒子を 50 ％ 透過する性能を有する分粒装置を用いるのは、吸引性粉じんの濃度を測定するためである。
  - じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病で、原因となった主な粉じんの種類によって、けい肺、炭素肺、アルミニウム肺などと呼ばれることがある。
  - じん肺が進行すると、血中ヘモグロビンの酸素飽和度が低下し、皮膚や唇が青白く見えるチアノーゼがみられる。
  - 石綿粉じんへの長期ばく露では、胸膜などの中皮腫や肺がん、じん肺の一種である石綿肺となることがある。
  answer: 2
  choice_notes: []
  explanation: '空気力学相当径 4 µm の粒子を 50 ％ 透過する分粒装置は、肺胞まで達する**吸入性粉じん**を測定するためのものです。吸引性粉じんの濃度を測定するためとする選択肢2は誤りです。


    吸引性粉じんは鼻や口から吸い込まれる粒子全体、吸入性粉じんはそのうち肺の奥まで届く細かい粒子です。作業環境測定の鉱物性粉じんは、じん肺の原因となる吸入性粉じんを測ります。'
  figures: []
  law_note: null
  _key_choice: 作業環境測定において、空気力学相当径4 µmの粉じん粒子を50 %透過する性能を有する分粒装置を用いるのは、吸引性粉じんの濃度を測定するためである。
