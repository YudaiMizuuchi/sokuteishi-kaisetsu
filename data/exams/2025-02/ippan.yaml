  stem: 化学物質による健康影響及びその管理指標等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 量-反応関係とは、有害物質にばく露した人の集団について、ばく露した有害物質の量と特定の影響を表す人の割合との関係を示したものである。
  - 無毒性量（NOAEL）とは、毒性試験において有害な影響が認められなかった最高のばく露量をいう。
  - 最小毒性量（LOAEL）とは、毒性試験において有害な影響が認められた最小のばく露量をいう。
  - 半数致死量（LD₅₀）とは、急性毒性を評価する指標で、1回の投与で一群の試験動物の 50 ％ が死亡すると予想される投与量をいう。
  - 発がん性のスクリーニング試験には、変異原性試験や催奇形性試験がある。
  answer: 5
  choice_notes: []
  explanation: '催奇形性試験は、化学物質が胎児の臓器や組織の形成に影響するかを調べる生殖発生毒性の試験で、発がん性のスクリーニング試験ではありません。選択肢5は誤りです。


    発がん性のスクリーニングには、細菌を用いる変異原性試験（エームス試験）や、哺乳類の培養細胞を用いる染色体異常試験などが使われます。遺伝子への作用を調べる試験が、発がん性の手がかりになるからです。'
  figures: []
  law_note: null
  _key_choice: 発がん性のスクリーニング試験には、変異原性試験や催奇形性試験がある。
