  - 騒音レベルの 0 dBは、音が全くない状態であり、室外からの音を遮断し室内の音を反響しないようにした無響室でのみ計測される。
  - 等価騒音レベルは、ある時間内において、時間とともに変動する騒音の騒音レベルを、これと等しいエネルギーをもつ定常騒音の騒音レベルとして表したもので、時間平均騒音レベルともいう。
