  stem: 有機溶剤及びそれによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は、引火性であるものが多いが、ハロゲン化炭化水素の中には、難燃性のものがある。
  - 1,2-ジクロロエチレンの密度は水より小さく、蒸気密度は空気より大きい。
  - エチレングリコールモノエチルエーテル（セロソルブ）は、腎臓や肝臓に障害を起こす有機溶剤で、脂溶性及び水溶性を共に有している。
  - 酢酸メチルの長期間ばく露では、視神経障害を生じる。
