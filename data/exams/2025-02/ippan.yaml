  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - アンモニアは、比重が空気より小さい無色・刺激臭の気体（25 ℃ 、1気圧下）で、高濃度のものを吸入すると肺水腫を起こす。
  - フッ化水素は、無色・刺激臭の気体（25 ℃、1気圧下）であり、吸入すると粘膜刺激症状を生じることがあるが、その水溶液であるフッ化水素酸は、弱酸であるため、皮膚や粘膜に直接接触しても重篤な障害を生じることはない。
  - シアン化水素は、細胞内の呼吸酵素と結合して酸素の利用を阻害し、呼吸困難や呼吸麻痺を起こす。
  - エチレンオキシドは、高濃度で皮膚に接触すると水疱を生じ、眼に入ると角膜炎を生じるほか、吸入すると悪心、嘔吐、粘膜刺激症状などを生じる。
  - ホスゲンは、青草のような臭気を有する無色の気体（25 ℃、1気圧下）で、吸入すると肺胞内で加水分解されて塩酸を生じ、肺水腫などの障害を引き起こす。
  answer: 2
  choice_notes: []
  explanation: 'フッ化水素酸は、酸としての強さ（電離の度合い）は弱酸ですが、皮膚や粘膜に付くと深部まで浸透し、組織の壊死や激しい痛みを起こす、きわめて危険な物質です。皮膚に付いても重篤な障害を生じないとする選択肢2は誤りです。


    フッ化物イオンが組織の中のカルシウムと結びつくため、低い濃度でも、付いた直後には痛みが少ないまま、時間がたってから深い障害が現れることがあります。「弱酸だから安全」ではない代表例です。'
  figures: []
  law_note: null
  _key_choice: フッ化水素は、無色・刺激臭の気体（25 ℃、1気圧下）であり、吸入すると粘膜刺激症状を生じることがあるが、その水溶液であるフッ化水素酸は、弱酸であるため、皮膚や粘膜に直接接触しても重篤な障害を生じることはない。
