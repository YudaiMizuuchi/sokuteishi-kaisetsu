  stem: 金属及びその化合物による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ベリリウムは、感作性があり、吸入や接触により、気管支ぜんそくや肺炎、接触皮膚炎を生じるほか、慢性中毒としては肺に肉芽腫を生じる。
  - マンガンは、脳に蓄積し、慢性中毒では、歩行障害、発語障害、筋緊張亢進などの症状が見られる。
  - 自然界に存在するコバルトは全て放射性で、局所被ばくでは、皮膚、粘膜、眼などに障害を起こす。
  - ニッケルは、感作性があり、また、ニッケル化合物は、肺がんや鼻腔がんを引き起こす。
  - 金属水銀は、経口摂取しても消化管からは吸収されないが、蒸発しやすいため、蒸気を気道から吸入すると脳に達し、感情不安定、幻覚などの精神障害や手指の震えなどの症状を生じる。
  answer: 3
  choice_notes: []
  explanation: '自然界に存在するコバルトは、放射性をもたない安定な同位体（コバルト59）です。放射性のコバルト60は、原子炉などで人工的につくられるものなので、選択肢3は誤りです。


    コバルトそのものの健康障害は、気管支ぜんそくやアレルギー性皮膚炎などの感作性によるものです。放射線源としてのコバルト60とは分けて考えましょう。'
  figures: []
  law_note: null
  _key_choice: 自然界に存在するコバルトは全て放射性で、局所被ばくでは、皮膚、粘膜、眼などに障害を起こす。
