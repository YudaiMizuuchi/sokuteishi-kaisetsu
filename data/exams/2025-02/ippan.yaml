  stem: リスクアセスメントに関する次の記述のうち、誤っているものはどれか。ただし、指針とは、厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」をいう。
  choices:
  - 厚生労働省版コントロール・バンディングには、鉱物性粉じん、金属粉じん等を生じる作業に関するものと、それら以外の粉体又は液体を扱う作業に関するものの2つのシステムがある。
  - CREATE-SIMPLE（クリエイト・シンプル）では、有害性のリスク評価に加え、危険性のリスク評価を同時に行うことができる。
  - 指針では、リスクの見積り方法として、管理濃度が定められている物質については、作業環境測定におけるA 測定の最大値を管理濃度と比較する方法、があげられている。
  - 指針では、リスクの見積り結果として、労働者がばく露される程度が濃度基準値等を十分に下回ることが確認できる場合には、リスクは許容範囲内であり、追加のリスク低減措置を検討しなくてよい、とされている。
  - 指針では、リスク低減措置の検討に当たっては、作業手順の改善、立入禁止措置、マニュアルの整備等の対策は、リスクアセスメント対象物の有害性に応じた有効な保護具の選択及び使用よりも高い優先順位とすること、とされている。
  answer: 3
  choice_notes: []
  explanation: 'リスクアセスメント指針では、管理濃度が定められている物質について、作業環境測定で求めた**第一評価値**を管理濃度と比べる方法が示されています。A 測定の最大値をそのまま管理濃度と比べる方法ではないので、選択肢3は誤りです。


    第一評価値は、単位作業場所の濃度分布の上側5％の推定値で、場の濃度を代表させた値です。1点の測定値と比べる使い方はしません。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(1)イ(ア)（「管理濃度が定められている物質については、作業環境測定により測定した当該物質の第一評価値を当該物質の管理濃度と比較する方法」）。'
  figures: []
  law_note: null
  _key_choice: 指針では、リスクの見積り方法として、管理濃度が定められている物質については、作業環境測定におけるA測定の最大値を管理濃度と比較する方法、があげられている。
