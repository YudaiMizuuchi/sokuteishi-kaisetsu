  - 許容濃度とは、労働者が1日8時間、週に40 時間程度、肉体的に激しくない労働強度で有害物質にばく露される場合に、当該有害物質の平均ばく露濃度がその数値以下であれば、ほとんど全ての労働者に健康上の悪い影響がみられないと判断される濃度である。
  - 最大許容濃度とは、作業中のどの時間をとってもばく露濃度がその数値以下であれば、ほとんど全ての労働者に健康上の悪い影響がみられないと判断される濃度である。
