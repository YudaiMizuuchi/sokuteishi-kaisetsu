  rank: null
  summary: null
  stem: 暑熱環境及びその人体への影響などに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 実効温度は、人の温熱感に基礎を置いた指標で、気温、湿度、輻射熱及び気流の総合効果を温度目盛りで表したもので、WBGT 値とも言われる。
  - WBGT 値が、WBGT 基準値よりも大きい場合には、暑熱環境による障害のリスクが増加している。
  - WBGT 基準値は、同一作業であっても、熱に順化していない人の方が熱に順化している人よりも、小さい値となる。
  - 暑熱環境下で水分のみを過剰に摂取すると、かえって、熱中症の症状の一つである熱けいれんを起こすことがある。
  - 糖尿病、高血圧症、心疾患などの基礎疾患は、いずれも熱中症の発症に影響を与えるおそれがある。
  answer: 1
  choice_notes: []
  explanation: '実効温度は、気温・湿度・気流の組合せによる温熱感を、無風で湿度 100 ％ のときの気温に置き換えて表した指標です。WBGT 値は、自然湿球温度・黒球温度・乾球温度から求める別の指標なので、「WBGT 値とも言われる」とする選択肢1は誤りです。


