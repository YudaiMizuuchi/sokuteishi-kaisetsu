  stem: 化学物質等の性質及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 環境空気中の有害物質濃度の分布は、時間的にも空間的にも対数正規型に近い。
  - 空気中における粒子状物質の沈降速度は、粒径が同じであれば、粒子の密度に比例する。
  - 金属の研磨作業では、摩擦熱により溶融した金属がヒュームとして発生する場合がある。
  - 有機溶剤であるテトラヒドロフランは、水にほとんど溶けない。
  - アセトンの極性は、エチルエーテルの極性よりも大きい。
  answer: 4
  choice_notes: []
  explanation: 'テトラヒドロフランは、分子の中に酸素原子をもつ極性のある有機溶剤で、水と任意の割合で混ざります。水にほとんど溶けないとする選択肢4は誤りです。


    1,4-ジオキサンやアセトンなど、酸素原子をもち分子が小さい有機溶剤は、水によく溶けるものが多くあります。水溶性と脂溶性をともにもつ溶剤は、皮膚からも吸収されやすい点にも注意が必要です。'
  figures: []
  law_note: null
  _key_choice: 有機溶剤であるテトラヒドロフランは、水にほとんど溶けない。
