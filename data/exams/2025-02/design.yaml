  explanation: 'ミゼットインピンジャーで粒子を捕集するのは、空気を捕集液に勢いよく吹き付けたときの**慣性衝突**の作用です。慣性衝突は大きく重い粒子ほど起こりやすいので、粒径が小さいほど捕集率は**低く**なります。選択肢1は誤りです。


    小さな粒子は空気の流れに乗って曲がってしまい、捕集液にぶつかりにくくなります。インピンジャーは、ある程度大きな粒子の捕集に向いた器具です。'
