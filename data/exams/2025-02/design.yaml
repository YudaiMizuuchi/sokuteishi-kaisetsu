  stem: 個人サンプリング法による測定（C・D 測定）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - C 測定の試料空気の採取等の時間は、測定対象物質に対する労働者のばく露がほぼ均一であることが明らかなときには、2時間まで短縮することができる。
  - C 測定において、作業に従事する労働者数が5人を下回る場合には、それぞれの労働者の作業時間を均等に分割し、試料空気の採取等を行うことにより、採取した試料の数と同数の労働者が個人サンプラーを装着したものとみなすことができる。
  - 個人サンプラーを装着した労働者が、単位作業場所外に出る場合であっても、測定結果に影響を与えない場合には、吸引ポンプを停止する必要はないが、その場合の測定値は、単位作業場所の滞在時間での時間加重平均値とする。
  - C 測定に係る個人サンプラーを装着する労働者とD測定に係る個人サンプラーを装着する労働者を同一の労働者とする場合には、1つの個人サンプラーを装着すればよい。
  - D 測定の対象となる作業が行われる単位作業場所において、その労働者が単位作業場所内で作業に従事する時間が15分未満の場合には、個人サンプリング法による測定を選択することができない。
  answer: 4
  choice_notes: []
  explanation: 'C 測定と D 測定は、同じ労働者に装着させることができますが、その場合でも、C 測定用と D 測定用のサンプラーはそれぞれ別に装着します。1つの個人サンプラーで済ませるとする選択肢4は誤りです。


    C 測定は作業時間全体のばく露、D 測定は濃度が最も高くなる15分間のばく露をとらえるもので、試料を採る時間がまったく違います。1つのサンプラーでは両方を測ることができません。'
  figures: []
  law_note: null
  _key_choice: C測定に係る個人サンプラーを装着する労働者とD測定に係る個人サンプラーを装着する労働者を同一の労働者とする場合には、1つの個人サンプラーを装着すればよい。
