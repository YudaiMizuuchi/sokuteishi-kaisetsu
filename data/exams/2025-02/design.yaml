  stem: 有害物質の A 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定点の設定方法は、等間隔系統抽出法が採用されている。
  - 測定点と測定点との間隔は、原則として、 6 m 以下の等間隔とするが、縦方向と横方向の間隔は、同一でなくてもよい。
  - 単位作業場所の範囲がおおむね 30m² 以下であって、単位作業場所における有害物の濃度がほぼ均一であることが明らかな場合には、測定点の数を5未満とすることができる。
  - 測定点の数が多く、1作業日中にサンプリングを終了できない場合には、単位作業場所の範囲をいくつかの単位作業場所に区分けし、測定点の数が1日にサンプリング可能な数より多くならないようにする。
  - 粉じんを対象とした測定で相対濃度計を使用する場合には、各測定点において 10 分間以上連続して測定を行わなければならない。
  answer: 5
  choice_notes: []
  explanation: '相対濃度計を使う場合は、1つの測定点での測定時間を10分未満にすることができます。その代わり、単位作業場所全体での測定は1時間以上かけて行います。「各測定点で10分間以上」とする選択肢5は誤りです。


    10分以上連続の例外になるのは、検知管、相対濃度計、直接捕集方法のように、短い時間で測定値が得られる方法です。'
  figures: []
  law_note: null
  _key_choice: 粉じんを対象とした測定で相対濃度計を使用する場合には、各測定点において10分間以上連続して測定を行わなければならない。
