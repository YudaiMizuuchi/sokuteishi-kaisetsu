  - 150 時間
  - 215 時間
  answer: 5
  choice_notes: []
  explanation: '測りたい濃度の試料を採取したとき、計数率が検出下限計数率に届くまでの時間を求めます。


    測りたい濃度 ＝ 7.0 × 10⁻⁷ ÷ 100 ＝ 7.0 × 10⁻⁹ Bq/cm³


    吸引流量 ＝ 95 L/min ＝ 95,000 cm³ ÷ 60 s ≒ 1,583 cm³/s


    計数率 ＝ 7.0 × 10⁻⁹ × 1,583 × t × 1.00（捕集率）× 0.28（計数効率）＝ 3.10 × 10⁻⁶ × t


    t ＝ 2.4 ÷ (3.10 × 10⁻⁶) ≒ 7.7 × 10⁵ 秒 ≒ 215 時間


