  - ベンゼンの捕集には、ミゼットインピンジャーを用いることができる。
  - 小型ガス吸収管によるガス状物質の捕集では、流量が大きいほど捕集率は低くなる。
  - 直接捕集法では、一般に捕集器具の容積が小さいほど濃度減衰が速いので、真空捕集瓶は 1 L 以上のもの、捕集袋は 5 L 以上のものを使用する。
  - 真空捕集瓶に採取した試料空気は、直射日光や高温を避けて保存し、なるべく早く分析する。
  answer: 1
