  explanation: 'クロム酸のミストは粒子なので、ろ過捕集法（メンブランフィルターなど）やインピンジャーで捕集します。ガス・蒸気を吸着するシリカゲル管では捕集できないので、（2）が不適切です。


    「粒子か、ガス・蒸気か」で捕集方法を分けるのが基本です。ミストやヒュームはフィルター、ガス・蒸気は吸着剤や捕集液と覚えましょう。'
