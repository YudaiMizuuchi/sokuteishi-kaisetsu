  stem: 有害物質の B 測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有害物質の濃度が高くなると考えられる作業位置が複数あり、どの作業位置が最大濃度になるか予測できない場合には、それらの全ての作業位置で測定を行い、最大の測定値を B 測定値とする。
  - 検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値を B測定値とする。
  - 相対濃度指示方法によって B 測定を行った場合、質量濃度変換係数は A測定で用いる係数と同じものを用いる。
  - 圧電天秤方式の相対濃度計を用いて鉱物性粉じんの B 測定を行う場合は、測定時間を2分に合わせて、連続して5回の測定を行い、指示値の算術平均値を B 測定値とする。
  - B 測定点の高さは、床上100 cm以上 150 cm以下の範囲で作業の実態に応じて選定する。
  answer: 5
  choice_notes: []
  explanation: 'B 測定点の高さも、A 測定と同じく、作業中の労働者の呼吸域を考えて**床上 50 cm 以上 150 cm 以下**とします。「100 cm 以上」とする選択肢5は誤りです。


    座って作業する人の呼吸域も含めるため、下限は 50 cm です。B 測定も A 測定と同じ方法で測る、という原則に沿って覚えましょう。'
  figures: []
  law_note: null
  _key_choice: B測定点の高さは、床上100cm以上150cm以下の範囲で作業の実態に応じて選定する。
