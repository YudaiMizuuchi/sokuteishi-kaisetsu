  stem: 正規分布、対数正規分布及び環境空気中の有害物質の濃度分布に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 対数正規分布の幾何標準偏差の値が1より小さい場合がある。
  - 対数正規分布の幾何標準偏差は無次元である。
  - 環境空気中の有害物質の濃度の分布は、対数正規分布で近似される。
  - 正規分布の算術平均値と標準偏差をそれぞれ μ、σ とすると、この分布に従う変数が μ - σ から μ ＋ σ の範囲に入る確率は、およそ 68 ％ である。
  - 正規分布では、平均値と標準偏差は、互いに独立している。
  answer: 1
  choice_notes: []
  explanation: '幾何標準偏差は、測定値が幾何平均値の何倍の幅でばらつくかを表す値で、ばらつきがまったくないときに1となり、それより小さくなることはありません。1より小さい場合があるとする選択肢1は誤りです。


    幾何標準偏差が1以上になるのは、対数をとった値の標準偏差（0以上）を、元に戻す（10のべき乗にする）ためです。10⁰ ＝ 1 が下限になります。'
  figures: []
  law_note: null
