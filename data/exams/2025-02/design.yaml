  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鉛ヒュームの捕集には、オープンフェース型ホルダーを用いる。
  - ガラス繊維ろ紙による微細粒子の捕集では、ろ過流速が遅いほど、拡散作用による捕集率は減少する。
  - マゼンタの捕集には、ガラス繊維ろ紙を用いる。
  - 粒径が 0.1 µm よりも小さな粒子では、主として拡散作用によってろ過材に捕集され、粒径が小さいほど捕集率は上昇する。
  - マンガンの捕集には、石英繊維ろ紙を用いる。
  answer: 2
  choice_notes: []
  explanation: 'ガラス繊維ろ紙による微細粒子の捕集では、ろ過流速が**遅い**ほど、粒子がブラウン運動で繊維に付着する機会が増えるので、拡散作用による捕集率は**高く**なります。「減少する」とする選択肢2は誤りです。


    小さな粒子は拡散でとらえられ、流速が遅いほど捕集されやすい。大きな粒子は慣性衝突でとらえられ、流速が速いほど捕集されやすい。この2つの関係をセットで覚えましょう。'
  figures: []
  law_note: null
  _key_choice: ガラス繊維ろ紙による微細粒子の捕集では、ろ過流速が遅いほど、拡散作用による捕集率は減少する。
