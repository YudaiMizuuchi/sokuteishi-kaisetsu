  stem: ある作業場で騒音レベルの測定を行ったところ以下のような結果を得た。この単位作業場所（広さ 3 m ×10 m）の測定結果に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A 測定平均値は、81 dB である。
  - A 測定の測定値の標準偏差は、3 dB より小さい。
  - この単位作業場所は、著しく狭い作業場とみなすことができる。
  - この単位作業場所は、第Ⅱ管理区分に区分される。
  - この単位作業場所を次回測定する際は、測定点の数を5未満とすることができる。
  answer: 1
  choice_notes: []
  explanation: '騒音の A 測定平均値は、80 dB 未満の測定値を除いて算術平均します。この結果では、78 dB の2点を除いた 81、82、83、81、82、83 dB の平均で **82 dB** です。81 dB とする選択肢1は誤りです（78 dB も含めて8点で平均すると 81 dB になります）。


    A 測定平均値 82 dB は 85 dB 未満ですが、B 測定値が 87 dB（85 dB 以上 90 dB 未満）なので、管理区分は第Ⅱ管理区分になります（選択肢4）。80 dB 未満の値を除くのは、聴力への影響を考える必要がない低い騒音で平均を下げないためです。'
  figures:
  - file: 2025-02-design-06-1.png
    alt: 問6の図
  law_note: null
  _key_choice: A測定平均値は、81dBである。
