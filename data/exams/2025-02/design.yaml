  stem: 測定誤差及び真値に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 真値と測定値との差を測定誤差という。
  - 適正な測定を繰り返すことによって得られた測定値の算術平均値のことを真値という。
  - 測定を行うときに、常に一定の偏りを与える原因によって生じる誤差を系統誤差という。
  - 同一条件下で測定を繰り返した場合、測定対象が不変であっても生じる測定値のばらつきを偶然誤差という。
  - 測定機器の指示値を読み間違えることや記録を書き間違えることを過失誤差という。
  answer: 2
  choice_notes: []
  explanation: '真値は、測定しようとしている量の本当の値で、実際には知ることができない値です。適正な測定を繰り返して得た算術平均値は、真値の推定値ではあっても、真値そのものではありません。選択肢2は誤りです。


    測定値には必ず誤差が含まれます。測定の回数を増やして平均すると偶然誤差は小さくなりますが、系統誤差は残るので、平均値が真値に一致するとは限りません。'
  figures: []
  law_note: null
  _key_choice: 適正な測定を繰り返すことによって得られた測定値の算術平均値のことを真値という。
