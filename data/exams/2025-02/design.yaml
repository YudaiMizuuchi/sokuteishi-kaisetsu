  stem: 放射性物質を取り扱っている作業場において、取り扱う放射性同位元素の空気中濃度限度の100 分の1の空気中放射能濃度を測定するために必要な最小試料採取時間に最も近い値は次のうちどれか。ただし、取り扱う放射性同位元素の空気中濃度限度は 7.0 × 10⁻⁷ Bq･cm⁻³、測定装置の検出下限計数率は 2.4 s⁻¹、測定装置の計数効率は 28 ％、試料空気の吸引流量は 95 L･min⁻¹、使用する捕集材の捕集率は 100 ％とする。
