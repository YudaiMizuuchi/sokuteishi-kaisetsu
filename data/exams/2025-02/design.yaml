  stem: 流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 流量計の指示が脈動して読み取りが難しい場合は、流量計と吸引ポンプの間に空気だめを設けるとよい。
  - 石けん膜流量計は、所定の距離を石けん膜が移動する時間を測定して流量を求める。
  - 面積式流量計では、吸引試料空気の温度が標準状態の温度と異なっていても、温度による流量の補正は必要ない。
  - 面積式流量計では、捕集装置の圧力損失が大きくなるに従って、流量計の指示値は真の流量より大きくなる。
  - 絞り式（オリフィス）流量計は、オリフィス板の上流側と下流側との間に生じる圧力差が流量と一定の関係にあることを利用している。
  answer: 3
  choice_notes: []
  explanation: '面積式流量計の指示は、流れる空気の密度によって変わります。吸引する空気の温度が、流量計を校正したときの温度（標準状態）と違えば、温度による補正が必要です。補正は必要ないとする選択肢3は誤りです。


    面積式流量計は、捕集装置の圧力損失によっても指示がずれます（選択肢4）。温度・圧力の条件が校正時と違えば補正する、というのが面積式流量計の基本です。'
  figures: []
  law_note: null
  _key_choice: 面積式流量計では、吸引試料空気の温度が標準状態の温度と異なっていても、温度による流量の補正は必要ない。
