  stem: 固体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭の活性化は、乾燥した空気又は窒素の気流中で、約200℃での加熱、脱水により行うことができる。
  - シリカゲル管は、活性炭管に比べ、極性の大きいガス状物質の捕集に適している。
  - ポーラスポリマービーズは、活性炭に比べて表面の活性が高いため、不安定な化合物の捕集には適さない。
  - 捕集剤には、シリカゲル、活性炭などの吸着剤、ガスクロマトグラフ分析用のカラム充填剤が使用されるが、金属繊維を捕集剤として使用することもある。
  - 活性炭管を用いてガス状物質を捕集するとき、活性炭管は垂直に保つようにする。
  answer: 3
  choice_notes: []
  explanation: 'ポーラスポリマービーズは、活性炭に比べて表面が**不活性**なので、捕集した物質が化学反応で変化しにくく、不安定な化合物の捕集に**適しています**。表面の活性が高く不安定な化合物には適さないとする選択肢3は、性質が逆で誤りです。


    活性炭は吸着力が強い反面、表面での反応や脱着しにくさが問題になることがあります。吸着剤は「吸着力の強さ」と「表面の穏やかさ」のバランスで使い分けます。'
  figures: []
  law_note: null
  _key_choice: ポーラスポリマービーズは、活性炭に比べて表面の活性が高いため、不安定な化合物の捕集には適さない。
