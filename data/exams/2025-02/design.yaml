  stem: 作業環境測定における有害物質の空気中の濃度、管理濃度等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中における有害物質の濃度は、通常、25 ℃、1気圧の条件下における環境空気中濃度として表される。
  - 有機溶剤の管理濃度は、体積分率として示されている。
  - 鉱物性粉じんの管理濃度は、その粉じんの遊離けい酸含有率が大きいほど小さな値となる。
  - 鉱物性粉じんの管理濃度は、粒子数濃度として示されている。
  - 空気中のリフラクトリーセラミックファイバーの濃度は、繊維数濃度として表される。
  answer: 4
  choice_notes: []
  explanation: '鉱物性粉じんの管理濃度は、粒子の数ではなく**質量濃度（mg/m³）**で示されています。粒子数濃度とする選択肢4は誤りです。


    管理濃度の単位は物質によって違います。有機溶剤などのガス・蒸気は体積分率（ppm）、鉱物性粉じんや金属などの粒子は質量濃度（mg/m³）、石綿やリフラクトリーセラミックファイバーのような繊維は繊維数濃度（本/cm³）です。'
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんの管理濃度は、粒子数濃度として示されている。
- num: 2
  status: published
