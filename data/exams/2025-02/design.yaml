  rank: null
  summary: null
  stem: A 測定における単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所は必ずしも平面的な場所だけではなく、化学反応装置の周囲に設けられた作業床のような立体的なものもある。
  - 有害物質の発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  - 単位作業場所の区域は、著しい濃度変動がないか、濃度変動があってもランダムであるような範囲とする。
  - クロム酸亜鉛を含む塗料で吹付け塗装を行う作業場で、同一の区域をクロム酸と有機溶剤とで別々の単位作業場所として設定した。
  - 吹付け塗装作業場所と壁で仕切られた塗料調合場所とがあり、塗料調合と吹付け塗装を作業者1名で行っていたので、吹付け塗装作業場所と塗料調合場所を合わせて一つの単位作業場所とした。
  answer: 5
  choice_notes: []
  explanation: '壁で仕切られた別々の場所は、空気がつながっておらず、有害物質の濃度分布も別々になるので、同じ作業者が両方で作業していても、別の単位作業場所とします。一つの単位作業場所とした選択肢5は誤りです。


    単位作業場所は「濃度がほぼ同じとみなせる区域」で、作業者が誰かでは決まりません。壁で仕切られていれば、まず別の区域と考えます。'
  figures: []
  law_note: null
  _key_choice: 吹付け塗装作業場所と壁で仕切られた塗料調合場所とがあり、塗料調合と吹付け塗装を作業者1名で行っていたので、吹付け塗装作業場所と塗料調合場所を合わせて一つの単位作業場所とした。
