  stem: 有害物質の極性に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 二硫化炭素は、無極性物質である。
  - アセトンは、極性物質である。
  - メタノールは、極性物質である。
  - 四塩化炭素は、クロロホルムより極性が大きい。
  - 酢酸エチルは、ベンゼンより極性が大きい。
  answer: 4
  choice_notes: []
  explanation: '四塩化炭素（CCl₄）は、4つの塩素が正四面体の形に対称に並んでいるため、分子全体では極性が打ち消されて**無極性**になります。クロロホルム（CHCl₃）は水素が1つ入って対称性が崩れているので極性があります。四塩化炭素の方が極性が大きいとする選択肢4は誤りです。


    極性の有無は、結合に偏りがあるかだけでなく、分子の形で打ち消し合うかで決まります。二硫化炭素（直線形）や四塩化炭素（正四面体）は、対称なので無極性です。'
  figures: []
  law_note: null
  _key_choice: 四塩化炭素は、クロロホルムより極性が大きい。
