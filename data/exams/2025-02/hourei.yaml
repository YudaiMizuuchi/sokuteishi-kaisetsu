  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 専属の産業医を選任している事業場においては、健康診断は当該産業医が行わなければならない。
  - 医師による健康診断を受けた後3か月を経過しない者を常時使用する労働者として雇い入れる場合、その者が当該健康診断の結果を証明する書面を提出したときは、当該健康診断の項目に相当する項目については、雇入時の健康診断において、省略することができる。
  - 健康診断項目のうち、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときに省略することができるのは、定期の健康診断におけるものであり、雇入時の健康診断におけるものについては、省略することはできない。
  - 塩化水素を発散する場所における業務に常時従事する労働者に対しては、6か月以内ごとに1回、定期に、医師及び歯科医師による健康診断を行い、その結果に基づき、健康診断個人票を作成して、これを5年間保存しなければならない。
  - 事業場において実施した定期健康診断の結果、健康診断項目に異常の所見があると診断された労働者については、健康を保持するために必要な措置について、健康診断を実施した日から3か月以内に、医師から意見聴取を行い、その意見を健康診断個人票に記載しなければならない。
  answer: 1
  choice_notes: []
  explanation: '健康診断は、医師が行えばよく、専属の産業医が選任されている事業場でも、その産業医が行わなければならない、という定めはありません。選択肢1は誤りです。


    健康診断の実施を健診機関に委託することはよく行われています。産業医の役割は、健康診断の結果に基づく措置について意見を述べることなどです。'
  figures: []
  law_note: null
  _key_choice: 専属の産業医を選任している事業場においては、健康診断は当該産業医が行わなければならない。
