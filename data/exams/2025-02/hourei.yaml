  stem: 次の業務に労働者をつかせるとき、当該業務に関する安全又は衛生のための特別の教育を行わなければならないものとして、法令上、規定されていないものはどれか。
  choices:
  - 高圧室内作業に係る業務
  - 酸素欠乏危険作業に係る業務
  - ダイオキシン類を発生し及び大気中に排出する施設として法令で定める廃棄物焼却炉を有する廃棄物の焼却施設において焼却灰を取り扱う業務
  - 石綿等が使用されている建築物の解体等の作業に係る業務
  - 鉛化合物を製造する工程における鉛等の溶融、粉砕等の業務
  answer: 5
  choice_notes: []
  explanation: '鉛化合物を製造する工程での鉛等の溶融・粉砕などの業務は、特別教育の対象業務ではありません。鉛業務は、技能講習を修了した鉛作業主任者を選任して管理する仕組みです。よって答えは（5）です。


    特別教育の対象は、高圧室内作業、酸素欠乏危険作業、廃棄物焼却施設でのダイオキシン類関係の業務、石綿の解体等の作業などです。特定化学物質・有機溶剤・鉛は、作業主任者による管理、と覚えておきましょう。'
  figures: []
  law_note: null
  _key_choice: 鉛化合物を製造する工程における鉛等の溶融、粉砕等の業務
