  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の床面の大きさが、縦、横ともに6メートル以下である場合には、有害物質の A 測定における測定点の数は、5未満としてよい。
  - 騒音の測定においては、一の測定点における等価騒音レベルの測定時間は、10分間以上の継続した時間としなければならない。
  - 特定化学物質又は有機溶剤の測定において検知管方式による測定機器を使用するときは、一の測定点における試料空気の採取時間は、10分間以上の継続した時間としなくてもよい。
  - マンガン及びその化合物の捕集には、鉱物性粉じんを捕集する場合と同じ特性を有する分粒装置を用いなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについての一酸化炭素の含有率の測定は、検知管方式による一酸化炭素検定器又はこれと同等以上の性能を有する測定機器を用いて行わなければならない。
  answer: 1
  choice_notes: []
  explanation: 'A 測定の測定点を5未満にできるのは、単位作業場所が著しく狭く、**かつ**、濃度がほぼ均一であることが明らかな場合です。床面の大きさが縦横6m以下であるだけでは、5未満にすることはできません。選択肢1は誤りです。


    2つの条件がそろわなければ例外は使えない、という点がこの論点の罠です。5未満にした場合でも、繰り返し測定で測定値の総数は5以上にします。'
  figures: []
  law_note: null
  _key_choice: 単位作業場所の床面の大きさが、縦、横ともに６メートル以下である場合には、有害物質のA測定における測定点の数は、５未満としてよい。
