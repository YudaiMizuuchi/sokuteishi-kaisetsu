  stem: 法令により、定期に作業環境測定を行うべき作業環境測定対象Ⓐ、測定頻度Ⓑ及び記録の保存期間Ⓒの組合せとして、誤っているものはどれか。
  choices:
  - 労働者がその内部で作業を行う冷蔵庫における気温及び湿度 ／ 半月以内ごとに1回 ／ 3年
  - 炭酸ガスが停滞するおそれのある坑内の作業場における炭酸ガス濃度 ／ 1か月以内ごとに1回 ／ 3年
  - 水銀の濃度 ／ 6か月以内ごとに1回 ／ 3年
  - カドミウムの濃度 ／ 6か月以内ごとに1回 ／ 30年
  - リフラクトリーセラミックファイバーの濃度 ／ 6か月以内ごとに1回 ／ 30年
  answer: 4
  choice_notes: []
  explanation: 'カドミウムは特別管理物質に当たらないので、作業環境測定の記録の保存期間は**3年間**です。30年とする選択肢4は誤りです。


    30年間の保存が必要なのは、リフラクトリーセラミックファイバーのような特別管理物質です。冷蔵庫内の気温・湿度は半月以内ごと、坑内の炭酸ガス濃度は1か月以内ごとで、いずれも3年保存です。'
