  stem: 作業環境評価基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  - 第1評価値の計算には、A 測定の測定値の幾何平均値及び幾何標準偏差を用い、第2評価値の計算には、A 測定の測定値の算術平均値及び標準偏差を用いる。
  - A 測定のみを行った場合、第2評価値が管理濃度を超えている単位作業場所の管理区分は、第3管理区分となる。
  - A 測定と B 測定を行った場合、A 測定の第1評価値が管理濃度を超えている単位作業場所の管理区分は、B 測定の結果にかかわらず、第1管理区分となることはない。
  - A 測定と B 測定を行った場合、B 測定値が管理濃度の2倍を超えている単位作業場所の管理区分は、A 測定の結果にかかわらず、第3管理区分となる。
  answer: 2
  choice_notes: []
  explanation: '第1評価値も第2評価値も、A 測定の測定値の**幾何平均値と幾何標準偏差**から計算します。第2評価値に算術平均値と標準偏差を用いるとする選択肢2は誤りです。


    第2評価値は「算術平均濃度の推定値」ですが、計算には幾何平均値と幾何標準偏差を使います。「何の推定値か」と「何から計算するか」を分けて覚えましょう。'
  figures: []
  law_note: null
  _key_choice: 第１評価値の計算には、A測定の測定値の幾何平均値及び幾何標準偏差を用い、第２評価値の計算には、A測定の測定値の算術平均値及び標準偏差を用いる。
