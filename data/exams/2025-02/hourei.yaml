  stem: 作業環境測定を行うべき次の屋内作業場のうち、法令上、ふく射熱を測定する必要がないものはどれか。
  choices:
  - 鉱物の焙焼の業務を行う屋内作業場
  - 加熱された金属の圧延等の加工の業務を行う屋内作業場
  - 溶融金属の鋳込みの業務を行う屋内作業場
  - 溶融ガラスからガラス製品を成型する業務を行う屋内作業場
  - 熱源を用いる乾燥室により物を乾燥する業務を行う屋内作業場
  answer: 5
  choice_notes: []
  explanation: 'ふく射熱の測定が必要なのは、溶融金属や加熱された金属、溶融ガラスなどの強い熱源がある屋内作業場です。熱源を用いる乾燥室での乾燥の業務では、気温と湿度の測定は必要ですが、ふく射熱の測定は求められていません。よって答えは（5）です。


    ふく射熱は、高温の物体から出る赤外線による熱です。「真っ赤な熱源があるか」で、測定が必要かを判断しましょう。'
  figures: []
  law_note: null
