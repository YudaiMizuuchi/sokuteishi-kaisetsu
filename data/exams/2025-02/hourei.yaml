  stem: 労働安全衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、衛生管理者及び産業医の選任の特例はないものとする。
  choices:
  - 総括安全衛生管理者の選任は、選任すべき事由が発生した日から14日以内に行わなければならない。
  - 衛生管理者を選任する場合、事業場の業種の区分及び常時使用する労働者数に関係なく、衛生工学衛生管理者免許を有する者を選任することができる。
  - 労働衛生コンサルタントである者については、衛生管理者免許を有していなくても衛生管理者の資格がある。
  - 常時500人の労働者を使用し、作業環境測定士が作業環境測定を行うべき作業場である指定作業場における業務に、常時100人の労働者を従事させる事業場においては、当該事業場に専属の者を産業医として選任しなければならない。
  - 衛生委員会の委員のうち、議長となる委員以外の委員の半数については、当該事業場に労働者の過半数で組織する労働組合がない場合には、労働者の過半数を代表する者の推薦に基づき指名しなければならない。
  answer: 4
  choice_notes: []
  explanation: '専属の産業医が必要なのは、常時1,000人以上の労働者を使用する事業場と、深夜業や有害な業務など法令で定める業務に常時500人以上を従事させる事業場です。指定作業場での業務に100人を従事させていることは、専属の産業医が必要になる条件ではないので、選択肢4は誤りです。


    専属の産業医の基準になる「有害業務に500人以上」と、専任の衛生管理者の基準になる「一定の有害業務に30人以上（500人超の事業場）」は、数字が似ているので混同しやすいところです。'
  figures: []
  law_note: null
  _key_choice: 常時500人の労働者を使用し、作業環境測定士が作業環境測定を行うべき作業場である指定作業場における業務に、常時100人の労働者を従事させる事業場においては、当該
  review_note: 専属の産業医の要件を「有害業務に常時500人以上」と説明し、指定作業場の業務は要件ではないとしています。条文の業務の範囲を確認中です。
