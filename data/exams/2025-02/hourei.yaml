  stem: 個人サンプリング法に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 第1種作業環境測定士は、個人サンプリング法について登録を受けていなくても、登録を受けている指定作業場の種類に応じ、個人サンプリング法に係る分析の業務を行うことができる。
  - 第1種作業環境測定士は、個人サンプリング法について登録を受けていれば、登録を受けている指定作業場の種類にかかわらず、個人サンプリング法の対象となる作業環境測定における個人サンプリング法を行うことができる。
  - 個人サンプリング法のうち、簡易測定機器を用いて行うものは、個人サンプリング法について登録を受けていない作業環境測定士であっても行うことができる。
  - 粉じん作業を行う坑内作業場について、切羽に近接する場所の空気中の粉じん濃度を測定する場合、作業に従事する労働者の身体に装着する試料採取機器を用いて行う試料空気の採取は、個人サンプリング法について登録を受けていない作業環境測定士であっても行うことができる。
  - C 測定及び D 測定を行った場合は、A 測定及び B 測定を行った場合と同様の方法により管理区分を決定する。
  answer: 3
  choice_notes: []
  explanation: '個人サンプリング法による作業環境測定は、簡易測定機器を用いるものも含めて、個人サンプリング法について登録を受けた作業環境測定士が行います。登録を受けていなくても行えるとする選択肢3は誤りです。


    個人サンプリング法は、デザイン・サンプリングの方法そのものが A・B 測定と違うので、別の登録が必要とされています。'
  figures: []
  law_note: null
  _key_choice: 個人サンプリング法のうち、簡易測定機器を用いて行うものは、個人サンプリング法について登録を受けていない作業環境測定士であっても行うことができる。
  review_note: 簡易測定機器を用いる個人サンプリング法も登録が必要、と説明しています。作業環境測定法の規定を確認中です。
