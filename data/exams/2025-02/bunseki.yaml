  stem: 25 ℃ における物質の溶解に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 塩化ナトリウムの水に対する溶解度は、エタノールに対する溶解度よりも大きい。
  - ベンゼンの水に対する溶解度は、クロロホルムに対する溶解度よりも大きい。
  - 酢酸の水に対する溶解度は、四塩化炭素に対する溶解度よりも大きい。
  - 水酸化ナトリウムの水に対する溶解度は、四塩化炭素に対する溶解度よりも大きい。
  - 硫酸ナトリウムの水に対する溶解度は、四塩化炭素に対する溶解度よりも大きい。
  answer: 2
  choice_notes: []
  explanation: 'ベンゼンは無極性の物質なので、極性の大きい水にはほとんど溶けず、同じく極性の小さいクロロホルムにはよく溶けます。ベンゼンの水への溶解度の方が大きいとする選択肢2は誤りです。


    「似たもの同士が溶け合う」が原則です。塩化ナトリウムや水酸化ナトリウム、硫酸ナトリウムのようなイオン性の物質や、極性の大きい酢酸は水によく溶け、無極性の四塩化炭素にはほとんど溶けません。'
  figures: []
