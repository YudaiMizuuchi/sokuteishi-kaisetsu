  stem: 誘導結合プラズマ発光分光分析法（ICP- AES法）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 試料溶液に懸濁物が含まれる場合は、あらかじめろ過する必要がある。
  - 原子吸光分析と比較して、検量線が直線となる濃度範囲が広い。
  - ネブライザーによる液体試料導入のほか、還元気化による気体試料導入も可能である。
  - 内標準物質として、測定対象物質の安定同位体を使用する。
  - 共存する妨害物質に応じて、測定波長を選択する。
  answer: 4
  choice_notes: []
  explanation: 'ICP 発光分光分析法の内標準物質には、試料に含まれない別の元素（イットリウムなど）を用います。安定同位体を内標準に使うのは、質量の違いを見分けられる ICP 質量分析法などの方法で、発光の波長では同位体を区別できないため、ICP-AES では使えません。選択肢4は誤りです。


    ICP 発光分光分析法は、検量線の直線範囲が広く、多くの元素を同時に測れるのが特徴です。'
  figures: []
  law_note: null
  _key_choice: 内標準物質として、測定対象物質の安定同位体を使用する。
