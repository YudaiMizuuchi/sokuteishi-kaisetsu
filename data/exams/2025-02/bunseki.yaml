  stem: 互いに独立な物理量1と物理量2の差を求める際、その差の標準偏差を示す式は次のうちどれか。ただし、物理量1及び物理量2の測定値の標準偏差をそれぞれ σ₁ 及び σ₂ とする。
  choices:
  - σ<sub>1</sub> ＋ σ<sub>2</sub>
  - '|σ<sub>1</sub>-σ<sub>2</sub>|'
  - √(σ<sub>1</sub>² ＋ σ<sub>2</sub>²)
  - √(|σ<sub>1</sub>²-σ<sub>2</sub>²|)
  - √(σ<sub>1</sub> × σ<sub>2</sub>)
  answer: 3
  choice_notes: []
  explanation: '互いに独立な2つの量の差（または和）の標準偏差は、それぞれの標準偏差を2乗して足し、平方根をとった √(σ₁² ＋ σ₂²) です。よって（3）が正しい式です。


    ばらつきは打ち消し合わないので、差をとっても分散（標準偏差の2乗）は足し算になります。「差だから引き算」と考えて |σ₁ − σ₂| を選ばないようにしましょう。'
  figures: []
  law_note: null
