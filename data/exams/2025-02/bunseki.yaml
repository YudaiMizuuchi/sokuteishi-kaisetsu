  stem: 次の記述のうち、誤っているものはどれか。
  choices:
  - 温度 25 ℃ は、約 298 K である。
  - 電流 1.0 A は、1.0 C･s⁻¹ である。
  - 体積 1.0 L は、1.0 × 10⁻³ m³ である。
  - 濃度 1.0 µmol･g⁻¹ は、1.0 mol･kg⁻¹ である。
  - 気圧 760 mmHg は、約 101.3 kPa である。
  answer: 4
  choice_notes: []
  explanation: '1 µmol/g を mol/kg に直すと、分子は 1 µmol ＝ 10⁻⁶ mol、分母は 1 g ＝ 10⁻³ kg なので、


    1 µmol/g ＝ 10⁻⁶ ÷ 10⁻³ mol/kg ＝ 1.0 × 10⁻³ mol/kg（＝ 1.0 mmol/kg）


    となります。1.0 mol/kg とする選択肢4は誤りです。


    分数の形の単位は、分子と分母を別々に換算してから割るのが確実です。'
  figures: []
  law_note: null
  _key_choice: 濃度1.0 µmol・g⁻¹は、1.0 mol・kg⁻¹である。
  _stem_head: 次の記述のうち、誤っているものはどれか。
