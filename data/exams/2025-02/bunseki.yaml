  stem: '有機化合物 A を 60 mg含む水溶液 100 mLからヘキサン 10 mLに A を抽出した。水溶液中に残った A の質量として、正しい値は次のうちどれか。ただし、水とヘキサン間の A の分配係数（K）は次の式で表される。


    K ＝ [A]<sub>ヘキサン</sub> ÷ [A]<sub>水</sub> ＝ 50'
  choices:
  - 10 mg
  - 20 mg
  - 30 mg
  - 40 mg
  - 50 mg
  answer: 1
  choice_notes: []
  explanation: '水に残る A の質量を x mg とすると、ヘキサン層に移る A は (60 − x) mg です。分配係数は濃度の比なので、


    K ＝ [(60 − x) ÷ 10] ÷ [x ÷ 100] ＝ 50


    これを解くと、(60 − x) × 10 ＝ 50x → 600 ＝ 60x → x ＝ 10 mg


    よって（1）が正しい値です。


    分配係数は「濃度」の比なので、体積の違い（ヘキサン 10 mL、水 100 mL）を必ず入れて計算します。質量の比と取り違えると、答えがずれます。'
  figures: []
  law_note: null
