  stem: 気体用流量計に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 石けん膜流量計は、比較的低流量のガスの流量測定に適している。
  - 石けん膜流量計による測定値は、ガスの種類により換算する必要がある。
  - ローターメーターのテーパー管は垂直に保つ必要がある。
  - 乾式ガスメーターは一定時間に流れる気体の全体積を測定する流量計である。
  - 湿式ガスメーターは、ドラム内のローターの回転数から気体の体積を測定する。
  answer: 2
  choice_notes: []
  explanation: '石けん膜流量計は、石けん膜が一定の体積を通過する時間から流量を求めるので、ガスの種類によらず体積流量がそのまま求められます。ガスの種類による換算が必要なのは、面積式流量計など、ガスの密度や粘度で指示が変わる流量計です。選択肢2は誤りです。


    体積と時間を直接測る石けん膜流量計は、他の流量計の校正の基準にも使われます。'
  figures: []
  law_note: null
  _key_choice: 石けん膜流量計による測定値は、ガスの種類により換算する必要がある。
  _stem_head: 気体用流量計に関する次の記述のうち、誤っているものはどれか。
