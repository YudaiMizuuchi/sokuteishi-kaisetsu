  stem: 拡散セルを用いた有機溶剤の標準ガス発生において、定常状態となったときの標準ガスの濃度（ppm）に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤の拡散係数と飽和蒸気圧が同じなら、分子量の大きな物質ほど高くなる。
  - 拡散チューブの内径が大きいほど高くなる。
  - 使用前後の有機溶剤量をセルごと秤量し、蒸発量を求めることにより計算できる。
  - 飽和蒸気圧が小さいほど低くなる。
  - 拡散チューブの有効長が長いほど低くなる。
  answer: 1
  choice_notes: []
  explanation: '拡散セルから出る標準物質の物質量（mol）は、拡散係数、飽和蒸気圧、拡散チューブの寸法、温度で決まり、分子量にはよりません。体積比である ppm の濃度は物質量で決まるので、拡散係数と飽和蒸気圧が同じなら、分子量にかかわらず濃度は同じです。分子量が大きいほど濃度が高くなるとする選択肢1は誤りです。


    分子量が大きいと、同じ物質量でも蒸発する「質量」は大きくなります。セルごと秤量して求める減少量（質量）と、ppm（物質量の比）を区別しておきましょう。


    拡散セルからの流出速度を質量で表した式には分子量が入りますが、ppm に換算すると分子量は打ち消されます（参考：『作業環境測定のための機器分析の実務［特定化学物質・金属類・有機溶剤］』（2019年 初版） 「分析についての一般的事項」の拡散セルによる標準ガスの調製（拡散速度式））。'
  figures: []
  law_note: null
  _key_choice: 有機溶剤の拡散係数と飽和蒸気圧が同じなら、分子量の大きな物質ほど高くなる。
  _stem_head: 拡散セルを用いた有機溶剤の標準ガス発生において、定常状態となったときの標準ガスの濃度(ppm)に関する次の記述のうち、誤っているものはどれか。
