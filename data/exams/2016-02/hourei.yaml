  stem: 労働衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、常時使用する労働者の数が10人以上50人未満の事業場においては、その業種に応じて、安全衛生推進者又は衛生推進者を選任しなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に関係なく、産業医を選任しなければならない。
  - 事業者は、常時50人以上の労働者を使用する事業場においては、その業種に応じて、衛生委員会又は安全衛生委員会を設けなければならない。
  - 産業医は、少なくとも毎月1回作業場等を巡視し、作業方法等に有害のおそれがあるときは、直ちに、労働者の健康障害防止に必要な措置を講じなければならない。
  - 事業者は、常時300人以上の労働者を使用する事業場においては、その業種に関係なく、総括安全衛生管理者を選任しなければならない。
  answer: 5
  choice_notes: []
  explanation: 総括安全衛生管理者を選任しなければならない規模は、業種によって違い（林業・建設業などは100人以上、製造業などは300人以上、その他の業種は1,000人以上）、業種に関係なく300人以上ではありません。選択肢5は誤りです。
  figures: []
  law_note: null
