  summary: null
  stem: 安全又は衛生のための教育に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 建設業に属する事業の事業者は、新たに職務に就くこととなった職長に対し、原則として、法令で定める安全又は衛生のための教育を行わなければならない。
  - 酸素欠乏危険場所における作業に係る業務に労働者を就かせるときは、当該労働者に対し、原則として、法定の科目についての特別教育を行わなければならない。
  - 特別教育の科目の全部又は一部について十分な知識及び技能を有していると認められる労働者については、その科目についての特別教育を省略することができる。
  - 事業者は、衛生管理者、安全衛生推進者その他労働災害の防止のための業務に従事する者に対し、その業務に関する能力の向上を図るための教育等を行い、又はこれらを受ける機会を与えるように努めなければならない。
  - 事業者は、労働者に対して特別教育を行ったときは、遅滞なく、その実施結果を所轄労働基準監督署長に報告しなければならない。
  answer: 5
  choice_notes: []
  explanation: '特別教育を行ったときに、その実施結果を所轄労働基準監督署長に報告する定めはありません。特別教育の受講者、科目などの記録を作成して、3年間保存します。選択肢5は誤りです。


    根拠：労働安全衛生規則第38条。'
