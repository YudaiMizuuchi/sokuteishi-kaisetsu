  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、海外に6か月以上派遣して帰国した労働者を国内の業務に就かせるときは、一時的な就業の場合を除いて、当該労働者に対し、海外派遣労働者健康診断を行わなければならない。
  - 事業者は、定期健康診断を受けた労働者のうち、無所見と診断された者を除き、遅滞なく、健康診断の結果を通知しなければならない。
  - 事業者は、深夜業を含む業務に常時従事する労働者に対し、原則として、6か月以内ごとに1回、定期に、法令で定められた項目について医師による健康診断を行わなければならない。
  - 定期健康診断項目のうち、肝機能検査については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に報告する必要はない。
  answer: 2
  choice_notes: []
  explanation: 定期健康診断を受けた労働者には、異常の所見の**有無にかかわらず**、遅滞なく結果を通知しなければなりません。「無所見と診断された者を除き」とする選択肢2は誤りです。
  figures: []
