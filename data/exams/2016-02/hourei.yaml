  stem: 電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。ただし、放射線業務従事者は、緊急作業には従事しないものとする。
  choices:
  - 外部放射線による実効線量が3か月間につき1.3mSvを超えるおそれのある区域は、管理区域である。
  - 男性の放射線業務従事者の受ける実効線量は、3年間につき50mSvを超えず、かつ、1年間につき20mSvを超えないようにしなければならない。
  - 放射線業務従事者が眼の水晶体に受ける等価線量は、1年間につき150mSvを超えないようにしなければならない。
  - 放射線業務従事者が皮膚に受ける等価線量は、1年間につき500mSvを超えないようにしなければならない。
  - 妊娠と診断された女性の放射線業務従事者が腹部表面に受ける等価線量は、妊娠中につき2mSvを超えないようにしなければならない。
  answer: 2
