  stem: 作業環境測定基準に従って行う作業環境測定に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 動力により駆動されるハンマーを用いて金属の鍛造の業務を行う屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 溶融ガラスからガラス製品を成型する業務を行う屋内作業場については、1か月以内ごとに1回、定期に、当該作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 酒類その他発酵する物を入れたことのある醸造槽の内部において作業を行う場合の当該作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素の濃度を測定しなければならない。
  - 中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものについては、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。
  - 多量の液体空気、ドライアイス等を取り扱う業務を行う屋内作業場については、半月以内ごとに1回、定期に、当該作業場における気温及び湿度を測定しなければならない。
