  explanation: '固体捕集方法で捕集するのは放射性ヨウ素（活性炭など）、液体捕集方法で捕集するのはトリチウム化水蒸気です。よって（2）が正しい組合せです。


    放射性アルゴンは直接捕集、放射性コバルトやタリウムはろ過捕集です。'
