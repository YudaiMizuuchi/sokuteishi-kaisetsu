  stem: 有害物質のA測定及びB測定が行われた場合の作業環境評価に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第1評価値が管理濃度を超えていれば、管理区分は第2又は第3管理区分になる。
  - A測定の第2評価値とB測定の測定値が、ともに管理濃度より小さければ、管理区分は第1又は第2管理区分になる。
  - 第1評価値とは、気中有害物質の算術平均濃度の推定値をいう。
  - 1日測定では、測定結果の評価に際して、日間変動を考慮するために、経験的に得られた推定値が用いられている。
  - A測定の第1評価値が管理濃度を超えておらず、B測定の測定値が、管理濃度の 1.5倍であった場合の管理区分は第2管理区分になる。
  answer: 3
