  - 放射性ヨウ素 ／ トリチウム化水蒸気
  - 放射性タリウム ／ トリチウム化水蒸気
  - 放射性コバルト ／ 放射性アルゴン
  - 放射性ヨウ素 ／ 放射性アルゴン
  answer: 2
