  stem: '次の記述の㋑及び㋺の［　］に入る用語の組合せとして、正しいものは下のうちどれか。


    「環境空気中の放射性物質の濃度を測定するために用いられる試料の採取方法として、［㋑］に対しては固体捕集方法、［㋺］に対しては液体捕集方法が用いられる。」'
  choices:
