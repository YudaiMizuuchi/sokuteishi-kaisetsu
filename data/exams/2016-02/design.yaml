  choice_notes: []
  explanation: 'ヒュームは、生成の途中で液体の状態を通るので、表面張力によって**球形**のものが多くなります。「球形のものよりも不規則な形状をしたものが多い」とする選択肢5は誤りです。


    令和元年度第2回にも、同じ論点があります。'
  figures: []
