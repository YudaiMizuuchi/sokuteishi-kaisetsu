  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定は、環境空気中の濃度が最大になると考えられる場所と時間で行う。
  - B測定は、測定時に労働者がいなくても立ち入るならば、その作業位置で行う。
  - 圧電天秤方式の測定器を用いてB測定を行う場合は、2分間の測定を連続して5 回行う。
  - 5本の検知管を用いてB測定を行った場合は、10分間に均等な間隔で測定した検知管指示値の幾何平均値を測定値とする。
  - 相対濃度指示方法を用いてB測定を行う場合の質量濃度変換係数は、その単位作業場所で行われた併行測定の質量濃度変換係数を用いる。
  answer: 4
  choice_notes: []
  explanation: 検知管を10分間に均等な間隔で5本使って B 測定を行った場合は、指示値の**算術平均値**を測定値とします。幾何平均値とする選択肢4は誤りです。
  figures: []
