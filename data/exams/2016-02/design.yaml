  stem: 単位作業場所の設定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 単位作業場所の設定に当たっては、作業場内の気流、換気設備の稼働状況なども考慮する必要がある。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は必ずしも一致する必要はない。
  - 塗料の調合の作業とそこで調合された塗料を用いる塗装作業が同時に行われる区域を、1つの単位作業場所として設定することができる。
  - クロム酸鉛を取り扱っている作業場では、同一の区域をクロム酸と鉛のそれぞれの単位作業場所として設定する。
  - 有機溶剤の発散状況が時間帯によって異なることが明らかな場合は、それぞれの時間帯ごとに別の単位作業場所として設定する。
  answer: 2
