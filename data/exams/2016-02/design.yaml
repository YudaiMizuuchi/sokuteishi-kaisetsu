  stem: 光散乱方式の相対濃度計の鉱物性粉じんの測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粉じんの質量濃度(C)、相対濃度(R)及び質量濃度変換係数(K)の関係は、次の式によって表される。 K=C/R
  - 質量濃度変換係数は、発生源の近くでは大きく、発生源から離れるにしたがって小さくなる傾向がある。
  - 質量濃度変換係数は、同一の作業場であっても併行測定を行う時間帯によって変わることがある。
  - 散乱光検出部を通過する空気の速度と散乱光の強さとは無関係である。
  - 粒子の組成と粒径分布が一定で、濃度に変動がなければ、相対濃度の値は、測定時間に比例する。
  answer: 5
  choice_notes: []
  explanation: 光散乱方式の相対濃度計で、測定時間に比例するのはカウント数の**積算値**です。相対濃度は、濃度に変動がなければ測定時間によらず一定です。選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 粒子の組成と粒径分布が一定で,濃度に変動がなければ,相対濃度の値は,測定時間に比例する.
  columns: null
