  stem: 作業環境測定の対象物質の状態に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒子状物質には、粉じん、ミスト及びヒュームがある。
  - 臨界温度以下において気体として存在するものを蒸気という。
  - 固体に研磨、切削などの機械的な作用を加えて発生した固体微粒子が空気中に浮遊しているものは、粉じんである。
  - 液体の微粒子が空気中に浮遊しているものは、ミストである。
  - ヒュームの一次粒子の粒径は、5～10μm程度である。
  answer: 5
  choice_notes: []
  explanation: ヒュームの一次粒子の粒径は、一般に **1 µm 以下**です。5〜10 µm 程度とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: ヒュームの一次粒子の粒径は,5~10μm程度である.
  columns: null
