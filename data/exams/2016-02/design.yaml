  stem: 有害物質の物性、空気中における挙動等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 鋳物工場では、鋳物砂の粘結剤の有機物が注湯作業時に高温で分解して一酸化炭素を発生することがある。
  - 混合有機溶剤の各成分のある温度における蒸気圧は、一般に、等しくないので、蒸気の組成比は液相の組成比とは異なる。
  - メッキ、充電などの電解を伴う工程では、ミストが発散する。
  - ヒュームが凝集する速度は、個数濃度が高いほど速い。
  - ヒュームの一次粒子は、球形のものよりも不規則な形状をしたものが多い。
