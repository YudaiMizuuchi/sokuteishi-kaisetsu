  stem: 液体捕集法及び直接捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ミゼットインピンジャーによる粒子状物質の捕集では、粒径が小さいほど捕集率は高くなる。
  - バブラーによるガス状物質の捕集では、気泡が小さいほど捕集率は高くなる。
  - 小型ガス吸収管による有機溶剤など揮発性物質の捕集では、捕集液の温度が低いほど捕集率は高くなる。
  - 真空捕集びんの洗浄には、窒素や清浄空気を用いる。
  - 捕集袋は、5L以上のものを用いる。
  answer: 1
  choice_notes: []
  explanation: 'ミゼットインピンジャーで粒子を捕集するのは慣性衝突の作用で、粒径が小さいほど捕集液にぶつかりにくく、捕集率は**低く**なります。「高くなる」とする選択肢1は誤りです。


    捕集袋は 5 L 以上のもの（選択肢5）、真空捕集びんは 1 L 以上のものを用います。'
