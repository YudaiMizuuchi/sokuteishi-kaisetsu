  stem: 電離放射線及びその影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 白内障は、晩発障害に分類される確定的影響である。
  - 白血病は、晩発障害に分類される確率的影響である。
  - しきい値は、確率的影響には存在するが、確定的影響には存在しない。
  - X線とγ線は、波長の長短ではなく、その発生過程の違いによって区別される。
  - α線、β線及びX線の中で、透過力が最も強いものはX線である。
  answer: 3
  choice_notes: []
  explanation: しきい値は、**確定的影響**には存在し、確率的影響には存在しないとされています。選択肢3は、逆になっていて誤りです。
