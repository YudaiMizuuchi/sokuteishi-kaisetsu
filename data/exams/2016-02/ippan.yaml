  stem: 有機溶剤による健康障害等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は、主として呼吸器から吸収されるが、皮膚からも吸収される。
  - 有機溶剤は脂溶性が高いので、中枢神経系などの脂肪に富んだ組織に蓄積しやすい。
  - トルエンによる健康障害として顕著なものは、再生不良性貧血などの造血器障害である。
  - 二硫化炭素による健康障害としては、網膜の微細動脈瘤などの血管障害がある。
  - 酢酸メチルによる健康障害では、視神経障害による視力低下などがみられる。
  answer: 3
