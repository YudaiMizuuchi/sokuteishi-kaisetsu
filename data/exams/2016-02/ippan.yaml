  stem: 労働衛生においては、作業環境管理、作業管理及び健康管理の三つの管理を総合的に進めることが重要であるが、次の措置のうち作業管理に該当するものはどれか。
  choices:
  - 鉱物性の粉じんを発散する屋内作業場において、定期的に空気中の粉じんの濃度を測定する。
  - 有機溶剤業務を行う作業場所に設置した局所排気装置のフード付近の気流の風速を測定する。
  - 外部放射線による実効線量が3か月間に一定の線量を超えるおそれのある区域を管理区域として設定し、標識によって明示する。
  - 深夜業に従事する労働者の健康診断の結果、有所見と判断された者の勤務を昼間勤務に転換する。
  - 有害な化学物質の蒸気を発散する屋内作業場にプッシュプル型換気装置を設置し、稼働させる。
  answer: 3
  choice_notes: []
  explanation: '管理区域を設定して標識で明示し、立ち入る人や場所を管理することは、作業者のばく露を防ぐための**作業管理**に当たります。よって答えは（3）です。


    粉じん濃度の測定（1）、局所排気装置の風速の測定（2）、プッシュプル型換気装置の設置（5）は作業環境管理、健康診断の結果に基づく昼間勤務への転換（4）は健康管理です。令和2年度第1回にも、まったく同じ問題があります。'
  figures: []
  law_note: null
  _key_choice: 外部放射線による実効線量が3か月間に一定の線量を超えるおそれのある区域を管理区域として設定し,標識によって明示する.
  columns: null
