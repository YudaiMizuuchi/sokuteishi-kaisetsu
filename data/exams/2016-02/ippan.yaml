  stem: 騒音に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 等価騒音レベルは、ある時間範囲において変動する騒音の250,500,1,000,2,000,4,000及び8,000Hzの音圧レベルの平均値である。
  - 騒音性難聴は、感音性難聴である。
  - 大きな騒音に長期間ばく露されると、内耳の有毛細胞が変性して聴力低下が起こる。
  - 騒音性難聴では、初期には会話領域より高い4,000Hz付近の聴力が低下するため、難聴を自覚しにくい。
  - 騒音のA測定の評価には、80dB(A)以上の測定値の算術平均値を用いる。
  answer: 1
  choice_notes: []
  explanation: 等価騒音レベルは、変動する騒音のエネルギーを時間で平均した値で、特定の周波数の音圧レベルの平均値ではありません。選択肢1は誤りです。
