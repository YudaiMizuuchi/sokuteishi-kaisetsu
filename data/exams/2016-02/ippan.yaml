  stem: 防毒マスクに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸収缶が除毒能力を喪失するまでの時間を破過時間という。
  - 吸収缶の交換時期を臭気を感知した時点とすることができるのは、臭気を感知できる濃度がばく露限界濃度より著しく低い物質に限られる。
  - 有機ガス用防毒マスクの吸収缶は、使用する環境の温度が低いほど破過時間が短くなる傾向がある。
  - 一酸化炭素用防毒マスクの吸収缶は、使用する環境の湿度が高いほど破過時間が短くなる傾向がある。
  - アンモニア用防毒マスクの吸収缶の色は、緑色である。
  answer: 3
