  stem: 局所振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動障害は、振動加速度が大きいほど起こりやすい。
  - 振動工具を使用する作業では、レイノー現象などの末梢神経障害及び手指のしびれなど末梢循環障害が発生するおそれがある。
  - 振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬期に行うとよい。
  - 振動工具の取扱いにおける「日振動ばく露量」は、周波数補正振動加速度実効値の3軸合成値と振動ばく露時間から算出される。
