  stem: 粉じんによる健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 吸入された鉱物性粉じんの各呼吸部位での沈着率は、その空気力学相当径によって異なる。
  - 石綿粉じんは、胸膜肥厚、肺がんなどを生じる。
  - 鉱物性粉じんに含まれる遊離けい酸は、胸膜に悪性の中皮腫を生じる。
  - 炭素の粉じんは、じん肺を生じることがある。
  - じん肺は、続発性気管支炎、肺結核などを合併することがある。
  answer: 3
  choice_notes: []
  explanation: 胸膜の中皮腫を起こすのは石綿です。遊離けい酸はけい肺の原因なので、選択肢3は誤りです。
