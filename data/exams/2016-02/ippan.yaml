  stem: 労働衛生保護具に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 取替え式防じんマスクは、面体及びろ過材に、型式検定合格標章の付されたものを使用する。
  - 防じんマスクは作業に適したものを選択し、高濃度の粉じんのばく露のおそれがあるときは、できるだけ粉じんの捕集効率が高く、かつ、排気弁の動的漏れ率が低いものを選ぶ。
  - 防音保護具として耳覆い(イヤーマフ)と耳栓のどちらを選ぶかは、作業の性質や騒音の特性で決まる。
  - 保護めがねは、紫外線などの有害光線による眼の障害を防ぐ目的で使用するもので、飛散粒子や薬品の飛沫などによる眼の障害を防ぐ目的で使用するものではない。
  - 電動ファン付き呼吸用保護具には、労働安全衛生法により規格が定められている。
