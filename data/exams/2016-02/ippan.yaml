  stem: 環境中の有害要因に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 空気中の酸素濃度が16%程度以下になると、頭痛、吐き気などの自覚症状が現れ、10%程度以下になると、意識喪失や痙攣が現れる。
  - 高気圧作業における減圧症は、急激な減圧に伴い、血液中や組織中に溶け込んでいた酸素の気泡化が関与して発生する。
  - レーザー光線にさらされる業務は、レーザー機器の出力パワーなどに基づくクラス分けに応じた労働衛生上の対策を講ずる必要がある。
  - 熱射病では、体温中枢の障害により、体温が上昇しているのに汗が出なくなり、意識障害が生じて死亡することもある。
  - 腰痛予防のために、成人男子の労働者では、人力のみにより取り扱う物の重量は、体重のおおむね40%以下となるようにする。
