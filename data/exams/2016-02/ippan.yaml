  stem: 温熱条件及びその生体影響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 温度感覚を左右する環境条件は、気温、湿度、気流及び輻射(放射)熱である。
  - WBGTは、暑熱環境による熱ストレスの評価に用いられる指標で、屋外で太陽照射がある場合は、自然湿球温度、黒球温度及び乾球温度の測定値から算出される。
  - WBGT値がその基準値を超えるおそれのあるときには、冷房などによりWBGT値を低減することや代謝率レベルの低い作業に変更するなどの対策が必要である。
  - 実効温度は、人の温熱感に基礎を置いた指標で、気温、湿度及び気流の総合効果を温度目盛りで表したものである。
  - 寒冷にさらされ体温が正常以下になると、皮膚の血管が拡張して血流量を増し、皮膚温を上昇させる。
  answer: 5
  choice_notes: []
  explanation: 寒冷にさらされて体温が下がると、熱を逃がさないように皮膚の血管は**収縮**して血流量を減らし、皮膚温を下げます。「血管が拡張して皮膚温を上昇させる」とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 寒冷にさらされ体温が正常以下になると,皮膚の血管が拡張して血流量を増し,皮膚温を上昇させる.
