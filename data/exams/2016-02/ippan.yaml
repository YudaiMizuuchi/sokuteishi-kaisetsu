  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 1,2-ジクロロプロパンは、肝臓及び腎臓の障害などのほか、長期間の高濃度ぼく露により胆管がん発症につながる蓋然性が高い。
  - ジメチル-2.2-ジクロロビニルホスフェイト(DDVP)は、神経系や肝臓に対する毒性のほか、ヒトに対する発がん性が疑われている。
  - インジウム化合物は、間質性肺炎を引き起こすほか、ヒトに対する発がん性が疑われている。
  - 二酸化硫黄は、慢性気管支炎、歯牙酸蝕症などを生じる。
  - 一酸化炭素は、ヘモグロビンの合成を阻害し、貧血の原因となる。
  answer: 5
  choice_notes: []
  explanation: 一酸化炭素は、ヘモグロビンの合成を阻害するのではなく、ヘモグロビンと強く**結合**して酸素を運べなくします。ヘモグロビンの合成を阻害して貧血を起こすのは鉛の特徴なので、選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 一酸化炭素は,ヘモグロビンの合成を阻害し,貧血の原因となる.
