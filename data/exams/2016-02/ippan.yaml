  stem: 「化学物質等による危険性又は有害性の調査等に関する指針(厚生労働省)」に従って実施するリスクアセスメントに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 化学物質等の適切な管理について必要な能力を有する者のうちから、化学物質管理者を指名して、リスクアセスメント等に関する技術的業務を行わせる。
  - 負傷又は疾病の重篤度の見積りでは、過去に実際に発生した負傷又は疾病の重篤度を、最も重篤な負傷又は疾病の重篤度として見積もる。
  - リスクの見積りは、リスク低減の優先度を定めるために行うものであるので、必ずしも数値化する必要はなく、相対的な分類でも差し支えない。
  - 「危険性又は有害性」とは、労働者に負傷又は疾病を生じさせる潜在的な根源であり、ハザードともいわれる。
  - 化学物質等による疾病のリスク低減措置の検討では、使用する化学物質等について、危険性又は有害性が高いものからより低いものへの代替の措置を、局所排気装置の設置等の衛生工学的措置より優先する。
  answer: 2
  choice_notes: []
  explanation: '重篤度は、過去に実際に発生した負傷又は疾病の重篤度ではなく、**予想される最も重篤な**負傷又は疾病の重篤度を見積もります。選択肢2は誤りです。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(3)ア。'
  figures: []
  law_note: null
  _key_choice: 負傷又は疾病の重篤度の見積りでは,過去に実際に発生した負傷又は疾病の重篤度を,最も重篤な負傷又は疾病の重篤度として見積もる.
