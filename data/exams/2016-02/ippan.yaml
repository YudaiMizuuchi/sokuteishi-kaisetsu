  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - N,N-ジメチルホルムアミドは、肝臓障害を生じる。
  - 硫化水素は、意識消失、呼吸麻痺などを生じる。
  - 無機水銀は、腎臓障害を生じる。
  - フッ化水素は、細胞内の呼吸の障害による痙攣、呼吸麻痺などを生じる。
  - トルエンジイソシアネートは、アレルギー性気管支喘息や皮膚炎を生じる。
  answer: 4
  choice_notes: []
  explanation: 細胞内の呼吸を障害して痙攣や呼吸麻痺を起こすのは、シアン化水素や硫化水素です。フッ化水素の主な健康障害は、皮膚や粘膜の深い化学熱傷と、慢性の骨・歯の障害なので、選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: フッ化水素は,細胞内の呼吸の障害による痙攣,呼吸麻痺などを生じる.
