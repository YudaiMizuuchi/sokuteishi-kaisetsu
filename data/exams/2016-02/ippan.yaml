  stem: 化学物質の性状及び挙動に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤の蒸気は、空気より軽いため蒸発しやすい。
  - 濃度の低い硫酸の液から発生したミストは、一般に、時間の経過とともに、元の液より酸の濃度が高くなる。
  - ヒュームの一次粒子の粒径は、一般に、1μm以下である。
  - アセトン及びメタノールは、水溶性の有機溶剤である。
  - トルエン及びキシレンは、水より密度が小さく、水には溶けにくい。
  answer: 1
  choice_notes: []
