  stem: 局所排気装置に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 囲い式フードの制御風速とは、フード開口面における平均風速をいう。
  - ダクトの断面積が同じである場合、断面が長方形のダクトは円形のダクトに比べて圧力損失が大きい。
  - 外付け式フードの関口部の周囲にフランジを設けると、フランジがないときに比べ、少ない排風量で所要の効果を上げることができる。
  - 排風量一定のもとでは、ダクトの断面積を大きくすると、圧力損失は小さくなるが搬送速度は遅くなる。
  - ダクトの圧力損失は、ダクトの長さが増すほど大きくなる。
