  stem: 作業環境における有害因子による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音は、自律神経系や内分泌系へも影響を与え、交感神経の活動の亢進や副腎皮質ホルモンの分泌の増加が認められることがある。
  - 空気中の酸素濃度が15～16%程度の酸素欠乏状態では、一般に頭痛、吐き気などの症状がみられる。
  - 潜水業務における減圧症は、浮上による減圧に伴い、血液中や組織中に溶け込んでいた酸素の気泡化によって発生する。
  - 低体温症は、低温下の作業で全身が冷やされ、体内温度が35程度以下に低下したとき発生し、意識消失、筋の硬直などの症状がみられる。
  - レーザー光線は、誘導放出による光の増幅によって人工的に作られた電磁波で、網膜の損傷を起こすことがある。
