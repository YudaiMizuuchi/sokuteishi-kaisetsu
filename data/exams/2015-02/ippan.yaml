  stem: 電磁波及びその健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 紫外線は、可視光線より波長が短い電磁波で、電光性眼炎を起こすことがある。
  - β線は、電離作用を有する電磁波である。
  - 可視光線は、波長がおよそ400nm～760nmの領域の電磁波である。
  - マイクロ波は、赤外線より波長が長い電磁波で、組織壊死を起こすことがある。
  - 赤外線は、可視光線より波長が長い電磁波で、白内障を起こすことがある。
  answer: 2
  choice_notes: []
  explanation: β 線は、電子（または陽電子）の流れで、電離作用を有する**粒子線**です。電磁波とする選択肢2は誤りです。
