  stem: 電離放射線に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 電離放射線の被ばくによる生体影響は、身体的影響と遺伝的影響に分類される。
  - α線、β線及びγ線のうち、透過力が最も強いものはγ線である。
  - 発がん及び遺伝的影響は、確率的影響に分類される。
  - X線とν線では、一般に、X線の方がエネルギーが大きい。
  - 皮膚障害などの急性障害は、確定的影響に分類され、しきい値が存在する。
  answer: 4
  choice_notes: []
  explanation: X 線と γ 線は、エネルギー（波長）の大小で区別されるのではなく、発生のしかたで区別されます。「一般に X 線の方がエネルギーが大きい」とする選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: X線とν線では,一般に,X線の方がエネルギーが大きい.
