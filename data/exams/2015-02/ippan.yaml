  explanation: '臭化メチルは、くん蒸剤として使われるガスで、中枢神経障害などを起こしますが、尿路系（膀胱）の腫瘍を起こす物質ではありません。よって答えは（5）です。


    ベンジジン、β-ナフチルアミン、4-アミノジフェニル、4-ニトロジフェニルは、いずれも膀胱がんを起こす芳香族アミン類（製造等禁止物質）です。'
  figures: []
