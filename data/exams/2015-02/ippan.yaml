  stem: 温熱条件及びその生体彰響に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 屋外で太陽照射がある場合のWBGT(湿球黒球温度)は、湿球温度計、黒球温度計及び乾球温度計の示度から算出される。
  - 熱中症のリスク評価指標として、作業強度などに応じたWBGT基準値が示されている。
  - 相対湿度とは、ある温度における飽和水蒸気量に対する空気中の水蒸気量の比を百分率で示したものである。
  - 実効温度は、人の温熱感に基礎を置いた指標で、気温、湿度及び気流の総合効果を温度目盛りで表したものである。
  - 温度感覚を左右する環境要素は、気温、湿度、気圧及び輻射熱であり、この4要素によって温熱環境が定まる。
  answer: 5
  choice_notes: []
  explanation: 温度感覚を左右する環境要素は、気温、湿度、**気流**及びふく射熱の4要素です。気圧とする選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 温度感覚を左右する環境要素は,気温,湿度,気圧及び輻射熱であり,この4要素によって温熱環境が定まる.
