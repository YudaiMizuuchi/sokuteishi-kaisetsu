  stem: 有機溶剤に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 有機溶剤は、呼吸器から吸収されやすいが、皮膚から吸収されるものもある。
  - トルエンのばく露の生物学的モニタリングの指標としての尿中代謝物は、トリクロロ酢酸である。
  - キシレンのばく露の生物学的モニタリングの指標としての尿中代謝物は、メチル馬尿酸である。
  - 有機溶剤による皮膚又は粘膜の障害としては、皮膚の角化、結膜炎などがある。
  - 低濃度の有機溶剤の繰り返しばく露では、頭痛、めまい、物忘れ、不眠などの不定愁訴がみられる。
  answer: 2
  choice_notes: []
  explanation: トルエンの生物学的モニタリングの指標は、尿中の**馬尿酸**です。トリクロロ酢酸は、トリクロロエチレンなどの代謝物なので、選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: トルエンのばく露の生物学的モニタリングの指標としての尿中代謝物は,トリクロロ酢酸である.
