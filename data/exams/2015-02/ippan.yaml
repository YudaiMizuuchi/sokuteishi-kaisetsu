  stem: 「化学物質等による危険性又は有害性等の調査等に関する指針(厚生労働省)」に従って実施するリスクアセスメントに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 化学物質等による危険性又は有害性により発生するおそれのある負傷又は疾病の重篤度及びそれらの発生の可能性の度合をそれぞれ考慮して、リスクを見積もる。
  - 化学物質等による疾病のリスクについては、化学物質等の有害性の度合及びばく露の量のそれぞれを考慮して見積もることができる。
  - 化学物質等への個人ばく露濃度等を測定し、ばく露量をばく露限界と比較して化学物質等による疾病のリスクを見積もる場合、ばく露限界としては、管理濃度が最も適している。
  - リスク低減措置としては、有害性のより低い物への代替による対策が、機械設備の密閉化、局所排気装置の設置などの衛生工学的対策よりも優先される。
  - 個人用保護具の使用によるばく露低減対策は、機械設備の密閉化等の衛生工学的対策、マニュアルの整備等の管理的対策など、より優先順位の高い対策を検討し、実施しても十分にリスクを低減できない場合に行うべき対策である。
  answer: 3
  choice_notes: []
  explanation: '個人ばく露濃度と比べるばく露限界としては、日本産業衛生学会の許容濃度や ACGIH の TLV-TWA など（現在は濃度基準値も）が用いられます。管理濃度は、作業環境測定の結果（評価値）と比べて作業環境の状態を評価するための指標で、個人ばく露濃度と比べるものではありません。選択肢3は誤りです。


    根拠：化学物質等による危険性又は有害性等の調査等に関する指針 9(1)イ。'
  figures: []
  law_note: null
  _key_choice: 化学物質等への個人ばく露濃度等を測定し,ばく露量をばく露限界と比較して化学物質等による疾病のリスクを見積もる場合,ばく露限界としては,管理濃度が最も適している.
  columns: null
