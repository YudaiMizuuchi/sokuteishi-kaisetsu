  stem: 騒音に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音性難聴は、伝音性難聴である。
  - 騒音による聴力低下は、通常、会話領域より高い音域から始まる。
  - 騒音性難聴では、内耳の有毛細胞が変性して聴力低下が起こる。
  - 等価騒音レベルは、ある時間範囲について、変動する騒音の騒音レベルをエネルギー的な平均値として表した量である。
  - 騒音のA測定の平均値は、得られた測定値の算術平均とする。
  answer: 1
  choice_notes: []
  explanation: 騒音性難聴は、内耳の障害による**感音性難聴**です。伝音性難聴とする選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: 騒音性難聴は,伝音性難聴である.
