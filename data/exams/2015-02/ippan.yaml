  stem: 振動障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 振動工具を使用する作業では、レイノー現象などの末梢循環障害が発生するおそれがある。
  - 振動工具を使用する作業では、手指のしびれなどの末梢神経障害が発生するおそれがある。
  - チェーンソーの周波数補正振動加速度実効値の3軸合成値に応じた振動ばく露時間の制限が設定されている。
  - 振動障害は、振動の周波数が高いほど起こりやすい。
  - 振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬季に行うとよい。
  answer: 4
  choice_notes: []
  explanation: 局所振動障害は、周波数が高いほど起こりやすいわけではありません。影響が大きいのは比較的低い周波数で、1,000 Hz を超えるとほとんど影響しないとされています。選択肢4は誤りです。
  figures: []
  law_note: null
  _key_choice: 振動障害は,振動の周波数が高いほど起こりやすい.
