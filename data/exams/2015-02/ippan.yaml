  stem: 化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ベンゼンでは、再生不良性貧血などの造血器障害がみられる。
  - 酢酸メチルでは、視力低下、視野狭窄などがみられる。
  - n-ヘキサンでは、頭痛、めまい、多発性神経炎などがみられる。
  - N,N-ジメチルホルムアミドでは、頭痛、めまい、肝機能障害などがみられる。
  - 一酸化炭素では、ヘモグロビン合成の障害による貧血、溶血などがみられる。
  answer: 5
  choice_notes: []
  explanation: 一酸化炭素は、ヘモグロビンの合成を阻害するのではなく、ヘモグロビンと強く**結合**して酸素を運べなくします。選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 一酸化炭素では,ヘモグロビン合成の障害による貧血,溶血などがみられる.
  columns: null
