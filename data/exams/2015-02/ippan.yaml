  stem: 鉱物性粉じん等による健康障害に関する次の記述のうち、誤っているものはどれか。
  choices:
  - じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病である。
  - 鉱物性粉じんに含まれる遊離けい酸は、胸膜の中皮腫を生じさせるという特徴がある。
  - アルミニウムを含む粉じんや炭素を含む粉じんは、じん肺を起こすことがある。
  - 石綿粉じんに長期間ばく露されると、胸膜プラーク(肥厚斑)ができることがある。
  - じん肺の呼吸器症状は、喫煙によって悪化する。
  answer: 2
  choice_notes: []
  explanation: 胸膜の中皮腫を起こすのは石綿です。遊離けい酸はけい肺の原因なので、選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: 鉱物性粉じんに含まれる遊離けい酸は,胸膜の中皮腫を生じさせるという特徴がある.
  columns: null
