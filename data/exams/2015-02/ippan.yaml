  stem: 金属等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ヒ素の慢性中毒による皮膚症状としては、黒皮症、角化症などのほか、皮膚がんを生じることがある。
  - マンガンによる慢性中毒では、筋のこわばり、歩行困難、言語障害などの症状がみられる。
  - 金属熱は、鉄、アルミニウムなどの金属を溶融する作業などに長時間従事した際に、高温により体温調節機能が障害を受けたことにより発生する。
  - 金属水銀中毒では、感情不安定、幻覚などの精神障害や手指の震えなどがみられる。
  - コバルト及びその無機化合物は、アレルギー性接触皮膚炎、気管支ぜんそくなどを引き起こすほか、ヒトに対する発がん性が疑われている。
  answer: 3
  choice_notes: []
  explanation: 金属熱は、亜鉛や銅などの金属の**ヒュームを吸入**して起こる疾病で、高温による体温調節機能の障害（熱中症）ではありません。選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: 金属熱は,鉄,アルミニウムなどの金属を溶融する作業などに長時間従事した際に,高温により体温調節機能が障害を受けたことにより発生する.
  columns: null
