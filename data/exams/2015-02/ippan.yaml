  stem: 労働衛生対策を進めていくに当たっては、作業環境管理、作業管理及び健康管理が必要であるが、次の措置のうち作業管理に該当するものはどれか。
  choices:
  - 粉じん作業において、発生する粉じんを湿潤な状態に保つための設備を設ける。
  - 有機溶剤の蒸気を発散する屋内作業場において、定期的に環境空気中の有機溶剤の濃度を測定する。
  - 外部放射線による実効線量が3か月間に一定の線量を超えるおそれのある区域を管理区域として設定し、標識によって明示する。
  - 有害な化学物質の蒸気を発散する作業場所に、局所排気装置を設置し稼働させる。
  - 深夜業に従事する労働者の健康診断の結果、有所見と判断された者の勤務を昼間勤務に転換する。
  answer: 3
  choice_notes: []
  explanation: '管理区域を設定して標識で明示し、立ち入る人や場所を管理することは、作業者のばく露を防ぐための**作業管理**に当たります。よって答えは（3）です。


    湿潤化の設備（1）、濃度の測定（2）、局所排気装置の設置（4）は作業環境管理、昼間勤務への転換（5）は健康管理です。'
  figures: []
  law_note: null
  _key_choice: 外部放射線による実効線量が3か月間に一定の線量を超えるおそれのある区域を管理区域として設定し,標識によって明示する.
  columns: null
