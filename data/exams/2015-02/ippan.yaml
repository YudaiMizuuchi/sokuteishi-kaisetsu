  stem: 化学物質の吸収、代謝、蓄積などに関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多くの有機化合物は、主として腎臓での解毒作用により、代謝されて排泄される。
  - 生物学的モニタリングとは、生体試料中の化学物質又はその代謝産物などを測定し、ばく露や生体影響の評価を行うことをいう。
  - 有機溶剤は脂溶性が高いので、中枢神経系などの脂肪に富んだ組織に蓄積しやすい。
  - 化学物質の生物学的半減期とは、取り込まれた体内の化学物質量が半分に減るのに要する時間である。
  - 呼吸器から侵入する化学物質の量は、労働強度によって変わる。
  answer: 1
  choice_notes: []
  explanation: 多くの有機化合物は、主として**肝臓**で代謝されてから排泄されます。腎臓での解毒作用とする選択肢1は誤りです。
  figures: []
  law_note: null
  _key_choice: 多くの有機化合物は,主として腎臓での解毒作用により,代謝されて排泄される.
  columns: null
