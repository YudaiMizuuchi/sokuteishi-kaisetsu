  stem: 化学物質に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フッ化水素は、刺激性及び腐食性が強く、骨硬化を起こすことがある。
  - シアン化水素は、体の細胞内の酸素の利用を障害し、呼吸困難や呼吸麻痺を引き起こす。
  - 塩素は、黄緑色の刺激臭のある気体で、吸入した場合、粘膜や呼吸器が刺激され、肺水腫を起こすこともある。
  - 硫化水素は、無色・無臭の気体であり、酸素欠乏症を起こす。
  - ホルムアルデヒドは、粘膜の刺激や接触皮膚炎を生じるほか、鼻咽頭がんを生じることがある。
  answer: 4
  choice_notes: []
  explanation: '硫化水素は無色ですが、腐卵臭のある気体で、主に細胞の呼吸を妨げて呼吸麻痺などを起こします。「無色・無臭」とする選択肢4は誤りです。


    平成30年度第2回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 硫化水素は,無色・無臭の気体であり,酸素欠乏症を起こす.
  columns: null
