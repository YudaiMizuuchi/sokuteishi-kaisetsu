  stem: 作業環境評価基準に従った作業環境測定の結果の評価及びそれに基づく措置に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定の第2評価値が管理濃度を超えるときは、B測定の測定値にかかわらず、第2管理区分に区分される。
  - トルエン及びキシレンを含有する混合物に係る単位作業場所にあっては、測定点ごとに、定められた算定式により求めた換算値を測定値とみなし、管理濃度に相当する値を1として管理区分の区分を行う。
  - 第3管理区分に区分された場所については、施設の整備及び作業工程の改善等の措置を講じ、当該場所の管理区分が第1管理区分又は第2管理区分となるようにしなければならない。
  - 第3管理区分に区分された場所について作業環境を改善するために必要な措置を講じたときは、その効果を確認するための測定を行わなければならない。
  - 測定値が管理濃度の10分の1に満たない測定点がある単位作業場所にあっては、管理濃度の10分の1を当該測定点における測定値とみなして、管理区分の区分を行うことができる。
  answer: 1
  choice_notes: []
  explanation: 'A 測定の第2評価値が管理濃度を超えるときは、B 測定の測定値にかかわらず、**第3管理区分**に区分されます。第2管理区分とする選択肢1は誤りです。


    根拠：作業環境評価基準第2条第1項。'
