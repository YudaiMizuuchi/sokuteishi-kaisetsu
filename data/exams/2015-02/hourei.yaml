  stem: 衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 事業者は、常時300人以上の労働者を使用する製造業の事業場においては、総括安全衛生管理者を選任しなければならない。
  - 事業者は、工業的業種に属する事業者においては常時50人以上の労働者を使用する場合に、非工業的業種に属する事業者においては常時100人以上の労働者を使用する場合に、それぞれ衛生委員会を設けなければならない。
  - 事業者は、総括安全衛生管理者を選任する場合には、当該事業者においてその事業の実施を統括管理する者をもって充てなければならない。
  - 事業者は、常時使用する労働者の数が10人以上50人未満の事業者においては、業種に応じて安全衛生推進者又は衛生推進者を選任しなければならない。
  - 事業者は、衛生管理者に対し、衛生に関する措置をなし得る権限を与えなければならない。
  answer: 2
  choice_notes: []
  explanation: 衛生委員会は、業種にかかわらず、常時**50人以上**の労働者を使用する事業場に設置しなければなりません。非工業的業種は100人以上とする選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: 事業者は,工業的業種に属する事業者においては常時50人以上の労働者を使用する場合に,非工業的業種に属する事業者においては常時100人以上の労働者を使用する場合に,それぞれ衛生委員会を設けなければならない.
