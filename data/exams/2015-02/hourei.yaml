  stem: 労働安全衛生規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、硫化水素の濃度が10ppmを超える場所には、関係者以外の者が立ち入ることを禁止しなければならない。
  - 事業者は、常時50人以上の労働者を使用するときは、労働者が臥床することのできる休養室又は休養所を男性用と女性用に区別して設けなければならない。
  - 事業者は、強烈な騒音を発する屋内作業場には、その作業場が強烈な騒音を発する場所であることを労働者が容易に知ることができるよう、標識によって明示する等の措置を講ずるものとする。
  - 事業者は、有害なガス、蒸気又は粉じんを発散する作業場においては、その作業場内に休憩の設備を設けなければならない。
  - 事業者は、労働者を常時就業させる屋内作業場の気温が10℃以下であるときは、換気に際し、労働者を1m/s以上の気流にさらしてはならない。
  answer: 4
  choice_notes: []
  explanation: '有害なガス、蒸気又は粉じんを発散する作業場では、原則として、休憩の設備を**作業場外**に設けなければなりません。「作業場内に」とする選択肢4は誤りです。


    根拠：労働安全衛生規則第614条。'
  figures: []
  law_note: null
