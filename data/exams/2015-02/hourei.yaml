  - 屋内作業場において、第2種有機溶剤等を使用して洗浄の業務を行う場合には、6か月以内ごとに1回、定期に、当該有機溶剤の空気中の濃度を測定しなければならない。
  - 事業者は、有機溶剤等を入れてあった空容器で有機溶剤の蒸気が発散するおそれのあるものについては、密閉するか、又は屋外の一定の場所に集積しておかなければならない。
  - 屋内作業場において、第2種有機溶剤等を使用して洗浄の業務を行う場合において有機溶剤等の区分の色分けによる表示を行うときは、赤色で行わなければならない。
  - 法令に基づき作業場所に設けた局所排気装置で、空気清浄装置を設けていないものの排気口の高さを、原則として、屋根から1.5m以上としなければならない。
