  stem: 事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、室の照明設備については、6か月以内ごとに1回、定期に、点検しなければならない。
  - 事業者は、室における空気の二酸化炭素の含有率を測定するときは、検知管方式による二酸化炭素検定器を用いて行うことができる。
  - 事業者は、空気調和設備を設けている場合は、室に供給される空気中のホルムアルデヒドの量(1気圧、25℃とした場合の空気1m³中に含まれるホルムアルデヒドの重量)を0.1mg以下としなければならない。
  - 事業者は、空気調和設備を設けている場合は、室に流入する空気が、特定の労働者に直接、継続して及ばないようにし、かつ、室の気流を0.5m/s以下としなければならない。
  - 事業者は、空気調和設備を設けている場合は、室に供給される空気中の二酸化炭素の含有率(1気圧、25℃とした場合の空気中に占める二酸化炭素の容積の割合)を5,000ppm以下としなければならない。
  answer: 5
  choice_notes: []
  explanation: '空気調和設備で室に供給される空気中の二酸化炭素の含有率は、**1,000 ppm 以下**となるようにしなければなりません。5,000 ppm とする選択肢5は誤りです。


    根拠：事務所衛生基準規則第5条第1項第2号。5,000 ppm は、室の二酸化炭素の含有率の基準です（同規則第3条第2項）。'
  figures: []
