  stem: 作業環境測定士に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 第2種作業環境測定士は、指定作業場についての作業環境測定の業務のうち、簡易測定機器以外の機器を用いて行う分析の業務を行うことができない。
  - 事業者は、作業環境測定士ではない者に、指定作業場についての作業環境測定結果について、作業環境評価基準に基づく評価を行わせることができる。
  - 著しい騒音を発する屋内作業場についての等価騒音レベルの測定は、作業環境測定士でない者に行わせることができる。
  - 第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についてのデザイン及びサンプリングの業務を行うことができない。
  - 第2種酸素欠乏危険場所において作業を行う場合の当該作業場についての酸素及び硫化水素の濃度測定は、作業環境測定士でない者に行わせることができる。
  answer: 4
  choice_notes: []
  explanation: 作業環境測定士のデザイン・サンプリングの業務には、作業場の種類による制限はありません。第1種作業環境測定士は、登録を受けた作業場の種類以外の指定作業場についても、デザイン及びサンプリングを行うことができます。選択肢4は誤りです。
  figures: []
  law_note: null
