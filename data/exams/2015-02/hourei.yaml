  stem: 労働安全衛生規則に基づく健康診断に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、常時使用する労働者に対し、原則として、1年以内ごとに1回、法令で定める項目について医師による定期健康診断を行わなければならない。
  - 事業者は、雇入時の健康診断項目のうち、肝機能検査等一定の検査項目については、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる。
  - 事業者は、定期健康診断の結果については、定期健康診断を受けた労働者に対し、遅滞なく、当該健康診断の結果を通知しなければならない。
  - 常時50人以上の労働者を使用する事業者は、定期健康診断を行ったときは、遅滞なく、定期健康診断結果報告書を所轄労働基準監督署長に提出しなければならない。
  - 常時50人以上の労働者を使用する事業場であっても、雇入時の健康診断の結果については、所轄労働基準監督署長に報告する必要はない。
  answer: 2
  choice_notes: []
  explanation: 肝機能検査などを医師が必要でないと認めるときに省略できるのは、**定期**健康診断です。雇入時の健康診断では省略できないので、選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: 事業者は,雇入時の健康診断項目のうち,肝機能検査等一定の検査項目については,厚生労働大臣が定める基準に基づき,医師が必要でないと認めるときは,省略することができる.
