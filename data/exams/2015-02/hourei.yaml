  stem: 法令に基づいて行う作業環境測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 多量のドライアイスを取り扱う業務を行う寒冷な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温及び湿度を測定しなければならない。
  - 動力により駆動されるハンマーを用いる金属の銀造の業務を行い、著しい騒音を発する屋内作業場については、6か月以内ごとに1回、定期に、等価騒音レベルを測定しなければならない。
  - 通気設備が設けられている坑内の作業場については、半月以内ごとに1回、定期に、当該作業場における通気量を測定しなければならない。
  - 溶融ガラスからガラス製品を成型する業務を行う暑熱な屋内作業場については、半月以内ごとに1回、定期に、当該屋内作業場における気温、湿度及びふく射熱を測定しなければならない。
  - 第1種酸素欠乏危険作業を行うときは、その日の作業を開始した後、直ちに当該作業場における空気中の酸素の濃度を測定しなければならない。
  answer: 5
  choice_notes: []
  explanation: '第1種酸素欠乏危険作業では、その日の作業を**開始する前**に、空気中の酸素の濃度を測定しなければなりません。「作業を開始した後、直ちに」とする選択肢5は誤りです。


    平成27年度第1回にも、同じ論点があります。'
  figures: []
  law_note: null
  _key_choice: 第1種酸素欠乏危険作業を行うときは,その日の作業を開始した後,直ちに当該作業場における空気中の酸素の濃度を測定しなければならない.
