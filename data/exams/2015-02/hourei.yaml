  stem: 作業環境測定基準に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 騒音の測定点は、原則として単位作業場所の床面上に6m以下の等間隔で引いた縦の線と横の線との交点の床上50cm以上150cm以下の位置とする。
  - 鉱物性粉じんの濃度の測定を相対濃度指示方法によって行う場合は、当該単位作業場所における一箇所以上の測定点において、分粒装置を用いるろ過捕集方法及び重量分析方法による測定を同時に行わなければならない。
  - ろ過捕集方法に用いるろ過材は、0.3μmの粒子を95%以上捕集する性能を有するものでなければならない。
  - 鉱物性粉じん中の遊離けい酸の含有率の測定は、エックス線回折分析方法又は重量分析方法によらなければならない。
  - 作業環境測定基準で定める一定の特定化学物質の濃度を測定する場合、当該特定化学物質以外の物が測定値に影響を及ぼすおそれがないときは、検知管方式の測定機器により測定することができる。
  answer: 1
  choice_notes: []
  explanation: 騒音の測定点の高さは、床上 **120 cm 以上 150 cm 以下**です。50 cm 以上 150 cm 以下とする選択肢1は誤りです。
  figures: []
  law_note: null
