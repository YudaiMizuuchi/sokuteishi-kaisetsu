  stem: 作業環境測定機関に関する次の記述のうち、法令上、誤っているものはどれか。
  choices:
  - 作業環境測定機関は、登録を受けた都道府県労働局長の管轄外の都道府県に所在する事業場についても作業環境測定を行うことができる。
  - 作業環境測定機関は、指定作業場についての作業環境測定を依頼されたときは、正当な理由のある場合を除き、遅滞なく、作業環境測定を行わなければならない。
  - 作業環境測定機関になろうとする者は、作業環境測定を行うことができる作業場の種類について登録を受けなければならない。
  - 作業環境測定機関は、作業環境測定を行ったときは、法令で定める事項を記載した書類を作成し、3年間保存しなければならない。
  - 作業環境測定機関の登録を受けるためには、登録を受けようとする作業場の種類について登録を受けている第1種作業環境測定士又は第2種作業環境測定士が置かれていなければならない。
  answer: 5
  choice_notes: []
  explanation: '作業環境測定機関の登録を受けるには、登録を受けようとする作業場の種類ごとに、その種類について登録を受けた**第1種**作業環境測定士が置かれていなければなりません。第2種作業環境測定士でもよいとする選択肢5は誤りです。


    根拠：作業環境測定法施行規則第54条第2号。作業場の種類は、第1種の測定士の分析の範囲を表すものです。'
  figures: []
  law_note: null
  _key_choice: 作業環境測定機関の登録を受けるためには,登録を受けようとする作業場の種類について登録を受けている第1種作業環境測定士又は第2種作業環境測定士が置かれていなければならない.
