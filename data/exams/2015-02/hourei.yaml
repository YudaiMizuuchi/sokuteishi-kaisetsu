  - はんだ付けの業務を行う自然換気が不十分な屋内作業場に設ける全体換気装置は、その業務に従事する労働者1人について100m³/h以上の換気能力を有するものでなければならない。
  - 法定の鉛業務に常時従事する労働者に対して行う医師による健康診断は、雇入れの際、当該業務に配置替えの際及びその後業務の種類に応じて6か月又は1年以内ごとに1回、定期に、実施しなければならない。
  - 法令に基づき設置した設備のうち、プッシュプル型換気装置については、原則として1年以内ごとに1回、定期に、法令で定める項目について自主検査を行わなければならない。
  answer: 2
