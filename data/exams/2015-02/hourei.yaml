  stem: 粉じん障害防止規則に関する次の記述のうち、誤っているものはどれか。ただし、同規則に定める適用除外及び特例はないものとする。
  choices:
  - 特定粉じん作業以外の粉じん作業を行う屋内作業場については、当該粉じん作業に係る粉じんを減少させるため、全体換気装置による換気の実施又はこれと同等以上の措置を講じなければならない。
  - 事業者は、粉じん作業を行う屋内の作業場所については、毎日1回以上、清掃を行わなければならない。
  - 法令の規定により、局所排気装置に設ける除じん装置は、粉じんの種類がヒュームである場合は、サイクロン又はスクラバによる除じん方式による除じん装置としなければならない。
  - 土石、岩石又は鉱物に係る特定粉じん作業が常時行われる屋内作業場について粉じん濃度の測定を行うときは、原則として、当該粉じん中の進難けい酸の含有率を測定しなければならない。
  - 法令に基づき特定粉じん発生源に設けた局所排気装置については、原則として、1年以内ごとに1回、定期に、自主検査を行い、その検査の結果等を記録して、3年間保存しなければならない。
  answer: 3
  choice_notes: []
  explanation: '粉じん障害防止規則で、ヒュームの除じん装置は**ろ過除じん方式又は電気除じん方式**とされています。サイクロン又はスクラバとする選択肢3は誤りです。


    根拠：粉じん障害防止規則第13条。'
