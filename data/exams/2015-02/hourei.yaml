  stem: 酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 酸素欠乏危険作業を行う場所の換気には、純酸素を使用してはならない。
  - 海水が滞留しているピットの内部における作業は、第2種酸素欠乏危険作業である。
  - 相当期間密閉されていた鋼製のボイラー、タンクその他その内壁が酸化されやすい施設の内部における作業は、第2種酸素欠乏危険作業である。
  - 酸素欠乏等とは、空気中の酸素の濃度が18%未満である状態又は空気中の硫化水素の濃度が10ppmを超える状態をいう。
  - 酸素欠乏危険作業に係る業務に労働者を就かせるときは、原則として、法定の科目について特別の教育を行わなければならない。
  answer: 3
  choice_notes: []
  explanation: 相当期間密閉されていた鋼製のボイラーやタンクなど、内壁が酸化されやすい施設の内部は、酸素欠乏の危険がある場所ですが、硫化水素の危険はないので、**第1種**酸素欠乏危険作業です。第2種とする選択肢3は誤りです。
