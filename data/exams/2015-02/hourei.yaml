  stem: 電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 事業者は、労働者が電離放射線を受けることをできるだけ少なくするように努めなければならない。
  - アルファ線、ベータ線、ガンマ線及び中性子線は、電離放射線である。
  - 外部放射線による実効線量と空気中の放射性物質による実効機量との合計が3か月間につき1.3mSvを超えるおそれがある区域は、管理区域である。
  - 管理区域内において放射線業務に従事する労働者の受ける実効練量が5年間につぎ50mSvを超えず、かつ、1年間につき20mSvを超えないようにしなければならない。
  - 放射線業務を行う作業場のうち、管理区域に該当する部分については、原則として、1か月以内ごとに1回、定期に外部放射線による線量当量率又は線量当量を測定しなければならない。
  answer: 4
  choice_notes: []
  explanation: 放射線業務従事者の実効線量の限度は、**5年間につき 100 mSv**、かつ **1年間につき 50 mSv** です。「5年間につき 50 mSv、1年間につき 20 mSv」とする選択肢4は誤りです。
  figures: []
  law_note: null
