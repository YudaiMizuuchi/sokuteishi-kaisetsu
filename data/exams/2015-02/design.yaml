  stem: 単位作業場所に関する次の記述のうち、誤っているものはどれか。
  choices:
  - クロム酸鉛を取り扱っている作業場では、同一の区域をクロム酸と鉛それぞれの単位作業場所として設定する。
  - 連続する2作業日にわたって測定を行う場合、第1日目と第2日目の単位作業場所の範囲は必ずしも一致している必要はない。
  - 単位作業場所は、必ずしも平面的な場所だけでなく、化学反応装置の周囲に設けられた作業足場のような立体的なものもある。
  - 塗料の調合作業とそこで調合された塗料を用いる塗装作業が同時に行われる区域を、1つの単位作業場所として設定することができる。
  - 同一の区域でも、時間帯によって発散状況が異なる場合は、別の単位作業場所として設定する。
  answer: 2
  choice_notes: []
  explanation: 連続する2作業日にわたって測定を行う場合は、2日とも**同じ範囲**の単位作業場所で測定します。「必ずしも一致している必要はない」とする選択肢2は誤りです。
  figures: []
  law_note: null
  _key_choice: 連続する2作業日にわたって測定を行う場合,第1日目と第2日目の単位作業場所の範囲は必ずしも一致している必要はない.
  columns: null
