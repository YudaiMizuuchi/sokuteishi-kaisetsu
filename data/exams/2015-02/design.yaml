  stem: 環境空気中の有害物質の捕集及び分析に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 繊維ろ紙による粒子の捕集では、ろ過流速が速いほど、拡散効果による捕集率は増大する。
  - 固体であっても昇華性がある物質の捕集には、ろ過材と固体捕集管を組み合わせた相補型のろ過捕集法が用いられる。
  - ポーラスポリマービーズは活性炭に比べ、有機化合物蒸気に対する捕集容量は小さい。
  - ミゼットインピンジャーに粒径3～5mmのガラスビーズを入れると、ガス状物質の捕集率を高めることができる。
  - 多段平行板式分粒装置を用いて、所定の吸引速度より速く吸引すると、分粒装置を通過する粒子の50%分粒粒径は大きくなる。
