  stem: 有害物質のB測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定におけるサンプリング時間は、原則として、10分間の連続した時間とする。
  - 検知管5本を用いても測定時間の合計が10分に満たない場合は、10分の間に均等な間隔をおいて測定した5本の検知管の指示値の算術平均値を測定値としてよい。
  - 発散源に近接する場所において作業が行われている場合は、B測定を行う
  - 環境空気中の濃度が最大になると考えられる作業がA測定の実施時間内に行われない場合には、B測定はA測定の実施時間とは別の時間に実施してもよい
  - 単位作業場所の中で最大の測定値を示すと考えられる場所については、労働者が立ち入る可能性がなくてもその場所でB測定を行わなければならない。
  answer: 5
  choice_notes: []
  explanation: B 測定は、作業者がばく露される最も高い濃度をとらえるための測定なので、労働者が立ち入る可能性がない場所で行う必要はありません。選択肢5は誤りです。
  figures: []
  law_note: null
  _key_choice: 単位作業場所の中で最大の測定値を示すと考えられる場所については,労働者が立ち入る可能性がなくてもその場所でB測定を行わなければならない.
