  stem: 鉱物性粉じんに関する次の記述のうち、誤っているものはどれか。
  choices:
  - トリジマイトは、遊離けい酸である。
  - 粉じん粒子は、拡散効果、さえぎり効果などにより、ろ過材に捕集される。
  - 石英、クリストバライトは、その化学式はいずれもSiO₂で表される。
  - 正長石は、遊離けい酸である。
  - 粉じん粒子の空気力学相当径とは、その粒子と同じ終末沈降速度をもつ密度1g/cm³の球形粒子の直径である。
  answer: 4
  choice_notes: []
  explanation: '正長石は、カリウムを含むけい酸塩鉱物で、遊離けい酸ではありません。「遊離けい酸である」とする選択肢4は誤りです。


    トリジマイト、石英、クリストバライトは、いずれも SiO₂ の結晶で、遊離けい酸です。'
  figures: []
