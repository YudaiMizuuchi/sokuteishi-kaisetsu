  stem: '次の㋑～㋭のうち、作業環境測定の単位作業場所の範囲の設定に当たって、考慮する必要のないもののみの組合せは下のうちどれか。


    ㋑当該作業場における作業者の行動範囲


    ㋺当該作業場で就業する作業者の人数


    ㋩当該作業場における測定対象物質の発散状況


    ㋥当該作業場で就業する作業者の作業時間の長さ


    ㋭当該作業場における作業者の労働衛生保護具の使用状況'
  choices:
  - ㋑㋺㋩
  - ㋑㋩㋭
  - ㋺㋩㋥
  - ㋺㋥㋭
  - ㋩㋥㋭
  answer: 4
  choice_notes: []
  explanation: 単位作業場所の範囲の設定で考慮しないのは、作業者の人数（㋺）、作業時間の長さ（㋥）、保護具の使用状況（㋭）です。作業者の行動範囲と測定対象物質の発散状況は考慮します。よって（4）が正しい組合せです。
  figures: []
  law_note: null
  _key_choice: ロニホ
  columns: null
