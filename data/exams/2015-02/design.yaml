  stem: 光散乱方式の相対濃度計による鉱物性粉じんの測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 粒子の組成と粒径分布が同じであれば、相対濃度は質量濃度に比例する。
  - 相対濃度計の指示値は、試料空気の吸引流量には影響されない。
  - 質量濃度が同じであれば、粒径5μmの粉じん粒子の散乱光強度は、粒径0.3μmの粉じん粒子の散乱光強度より小さい。
  - 相対濃度計の吸引口に分粒装置を接続しても質量濃度を求めることはできない。
  - 相対濃度計の感度較正には、0.3μmの石英粒子が用いられる。
  answer: 5
  choice_notes: []
  explanation: 光散乱方式の相対濃度計の感度較正には、粒径 0.3 µm の**ステアリン酸粒子**が用いられます。石英粒子とする選択肢5は誤りです。
  figures: []
