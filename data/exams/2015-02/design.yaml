  stem: 有害物質の物性等に関する次の記述のうち、誤っているものはどれか。
  choices:
  - ジクロロメタンは、水より密度が大きい。
  - アクリルアミドは、環境空気中に気体及び粒子の状態で共存することがある。
  - アセトンは、二硫化炭素より極性が大きい。
  - キシレンの蒸気は、空気より重い。
  - メタノールは、トルエンよりも極性が小さい。
