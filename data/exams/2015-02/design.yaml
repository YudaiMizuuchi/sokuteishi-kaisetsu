  explanation: 'シアン化水素用の検知管は、反応で生じる酸を pH 指示薬の変色で検知するので、塩基性のアンモニアが共存すると酸が中和されて変色層が短くなり、**マイナス**の影響を受けます。プラスの影響とする選択肢4は誤りです。


