  stem: 有害物質のA測定及びB測定が行われた場合の作業環境評価に関する次の記述のうち、誤っているものはどれか。
  choices:
  - B測定値が管理濃度の1.5倍を超えていれば、管理区分は第3管理区分になる。
  - A測定値及びB測定値のすべてが管理濃度より低ければ、管理区分は必ず第1管理区分になる。
  - 第2評価値とは、空気中有害物質の算術平均濃度の推定値をいう。
  - 同じ単位作業場所について、1日測定で第2管理区分となる場合でも、2日間測定では第1管理区分になることがある。
  - A測定の第2評価値は、幾何平均値より小さな値になることはない。
  answer: 2
  choice_notes: []
  explanation: 'A 測定値と B 測定値の全てが管理濃度より低くても、A 測定の第1評価値（上側5％の推定値）が管理濃度以上になれば、第1管理区分にはなりません。「必ず第1管理区分になる」とする選択肢2は誤りです。


    管理区分は、個々の測定値ではなく、評価値と B 測定値で決まります。'
