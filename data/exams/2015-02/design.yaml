  stem: ろ過捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - フッ素樹脂加工したガラス繊維ろ紙は、通常のガラス繊維ろ紙より、吸湿による秤量誤差は小さい。
  - 鉛ヒュームの捕集には、オープンフェース型ホルダーを用いる。
  - ポアサイズ0.8μmのメンブランフィルターは、粒径0.3μmの粒子をほとんど捕集できない。
  - メンブランフィルターは、ガラス繊維ろ紙に比べて、粉じんの堆積による通気抵抗の増加が大きい。
  - 粒径が0.1μmよりも小さな粒子のろ過材による捕集では、慣性効果よりも拡散効果による捕集の割合が高い。
  answer: 3
