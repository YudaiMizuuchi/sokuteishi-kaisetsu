  stem: 有害物質のA測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - A測定は、当該単位作業場所における空気中有害物質の平均的な濃度とその変動を求めるための測定である。
  - A測定は、始業直後にのみ有害物質の発散があるような特別の場合を除き、作業開始からおおむね1時間を経過した時以後に行う。
  - 過去において実施した作業環境測定により幾何標準偏差が1.5以下であることが明らかな場合は、有害物質の濃度はほぼ均一であるとみなすことができる。
  - 測定点の数を5未満とすることができる単位作業場所でも、各測定点で繰り返し測定を行うことによって、測定値の総数は5以上とする。
  - 等間隔で引いた縦の線と横の線との交点部分に設備等がある場合でも、作業者の呼吸域となる可能性のある位置は測定点とする。
  answer: 3
  choice_notes: []
  explanation: 有害物質の濃度がほぼ均一であるとみなせるのは、幾何標準偏差がおおむね **1.2 以下**であることが明らかな場合です。1.5 以下とする選択肢3は誤りです。
  figures: []
  law_note: null
  _key_choice: 過去において実施した作業環境測定により幾何標準偏差が1.5以下であることが明らかな場合は,有害物質の濃度はほぼ均一であるとみなすことができる.
  columns: null
