  stem: '次の記述の㋑及び㋺の［　］に入る用語の組合せとして、正しいものは下のうちどれか。


    「環境空気中の放射性物質の濃度を測定するために用いられる試料の採取方法として、［㋑］に対しては冷却凝縮捕集方法、［㋺］に対しては、ろ過捕集方法が用いられる。」'
  choices:
