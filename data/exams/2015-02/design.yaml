  stem: 固体捕集法に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 活性炭管は、ミストの捕集には不適当である。
  - シリカゲル管は、極性の小さい蒸気の捕集に適している。
  - ガスクロマトグラフ分析用のカラム充てん剤は、固体捕集法の捕集剤として使用されることがある。
  - ポーラスポリマービーズは、表面が不活性なため、一般に不安定な物質の捕集に適している。
  - シリカゲル管を用いてメタノールを捕集する場合、水蒸気が共存すると破過時間は短くなる。
  answer: 2
  choice_notes: []
  explanation: シリカゲルは、極性の**大きい**物質の捕集に適しています。「極性の小さい蒸気の捕集に適している」とする選択肢2は誤りです。
  figures: []
