  stem: 検知管による測定に関する次の記述のうち、誤っているものはどれか。
  choices:
  - 変色層の長さは、通気速度の影響を受けることがある。
  - 検知限度とは、変色がわずかでも認められる最低濃度のことで、定量下限とは異なる。
  - 直読式の検知管の目盛りは、通常、20℃で校正されている。
  - シアン化水素用検知管によりシアン化水素の濃度を測定する場合には、混在するアンモニアによるプラスの影響を受ける。
  - キシレン用検知管によりキシレンの濃度を測定する場合には、混在する芳香族炭化水素によるプラスの影響を受ける。
  answer: 4
