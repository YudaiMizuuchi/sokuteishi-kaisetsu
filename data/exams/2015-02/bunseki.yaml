  stem: '次の計算で求めた分析値の表し方として、正しいものは下のうちどれか。ただし、各数値は有効数字で表されている。


    (131＋33.5－0.236)×10⁻³／ (32.06×0.753)'
  choices:
  - 6.8043×10⁻³
  - 6.804×10⁻³
  - 6.80×10⁻³
  - 6.8×10⁻³
  - 7×10⁻³
  answer: 3
  choice_notes: []
  explanation: 'まず足し算と引き算を行います。131 ＋ 33.5 − 0.236 ＝ 164.264 は、小数点以下の桁数が最も少ない 131（小数点以下0桁）に合わせて 164（3桁）です。次の掛け算・割り算は、有効数字の桁数が最も少ない 0.753（3桁）に合わせて、結果も3桁にします。


    164 × 10⁻³ ÷ (32.06 × 0.753) ≒ 6.80 × 10⁻³


    よって（3）が正しい表し方です。'
  figures: []
  law_note: null
