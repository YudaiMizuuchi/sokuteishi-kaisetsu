  stem: 1molの気体に関する次の記述のうち、正しいものはどれか。ただし、温度は絶対温度で表している。
  choices:
  - 温度が一定の条件では、体積を2倍にすると圧力は1/2倍になる。
  - 体積が一定の条件で、温度を2倍にすると圧力は1/2倍になる。
  - 圧力が一定の条件で、温度を2倍にすると体積は1/2倍になる。
  - 温度と体積の両方を2倍にすると、圧力は1/2倍になる。
  - 温度と圧力の両方を2倍にすると、体積は1/2倍になる。
  answer: 1
  choice_notes: []
  explanation: '温度が一定なら、気体の体積と圧力は反比例するので、体積を2倍にすると圧力は1/2倍になります（ボイルの法則）。よって（1）が正しいものです。


    体積一定で温度を2倍にすると圧力は2倍、圧力一定で温度を2倍にすると体積は2倍、温度と体積を2倍にすると圧力は変わらず、温度と圧力を2倍にすると体積は変わりません。'
  figures: []
