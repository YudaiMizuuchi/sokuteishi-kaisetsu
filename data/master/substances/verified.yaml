        処理: 加水分解で生じる芳香族アミンを、ジアゾ化-カップリング反応で発色（赤紫色）
        分析: 吸光光度分析（550 nm付近）
      '22.2':
        捕集: 1-(2-ピリジル)ピペラジン（2-PP）含浸ろ紙（固体捕集）
