description: ガイドブック3・4の各方法の「原理」の項（本文）で確認した、物質別の測定方法の表。人（Claude）が、本文を読んで、短く書き直したもの。確認していない物質・方法は、ここに入れない。
verified:
  tokka:
    '3001':
      '1.1':
        捕集: グラスファイバーろ紙＋活性炭フェルトを装着したサンプラーで、粒子と蒸気を吸引捕集（相補型）
        処理: メタノールで抽出
        分析: ガスクロマトグラフ（FTD、キャピラリーカラム、スプリットレス）
    '3002':
      '2.1':
        捕集: 直接捕集（捕集袋・真空捕集瓶）
        処理: －
        分析: ガスクロマトグラフ（FTD）
      '2.2':
        捕集: シリカゲル管（固体捕集）
        処理: アセトンで脱着
        分析: ガスクロマトグラフ（FID）
      '2.3':
        捕集: 精製水に吸収（液体捕集）
        処理: 臭素液を加え紫外線を照射→コハク酸イミドで過剰の臭素を除去→バルビツル酸とピリジンで発色（紫赤色）
        分析: 吸光光度分析（575 nm付近）
      '2.4':
        捕集: 検知管
        処理: －
        分析: 検知管法
    '3005':
      '5.1':
        捕集: 精製水に吸収（ミゼットインピンジャー）
        処理: アルカリ性にしてナフトキノンスルホン酸と反応→黄色の色素をクロロホルムに抽出
        分析: 吸光光度分析（420 nm付近）
      '5.2':
        捕集: ナフトキノンスルホン酸溶液に吸収（ミゼットインピンジャー）
        処理: 生成した黄色の色素をクロロホルムで抽出
        分析: 高速液体クロマトグラフ（紫外・可視吸光検出器）
    '3012':
      '12.1':
        捕集: ガラス繊維ろ紙を前置した、Tenax TA捕集管（相補型：粒子と蒸気）
        処理: 加熱脱着（標準液はアセトニトリルで調製・希釈）
        分析: ガスクロマトグラフ
    '3013':
      '13.1':
        捕集: 4-(p-ニトロベンジル)ピリジンのアセトン溶液に吸収（液体捕集）
        処理: 加温して反応→冷却→アンモニア水を加えて発色（赤紫色）
        分析: 吸光光度分析（530 nm付近）
    '3016':
      '16.1':
        捕集: 水酸化ナトリウム溶液に吸収（液体捕集）
        処理: 酢酸で中和→クロラミンTとピリジン-ピラゾロンで発色（青色）。標準はシアン化カリウム
        分析: 吸光光度分析（620 nm付近）
      '16.2':
        捕集: 検知管
        処理: －
        分析: 検知管法
    '3021':
      '21.1':
        捕集: 直接捕集
        処理: －
        分析: ガスクロマトグラフ（FID）
      '21.2':
        捕集: 固体捕集管
        処理: 脱着溶媒で脱着
        分析: ガスクロマトグラフ（FID）
      '21.3':
        捕集: 水酸化カリウム-エタノール溶液に吸収（液体捕集）
        処理: 硫酸鉄(Ⅲ)アンモニウムとチオシアン酸水銀(Ⅱ)を加えて発色（赤色）
        分析: 吸光光度分析（460 nm付近）
    '3027':
      '27.1':
        捕集: 水酸化ナトリウム溶液に吸収（液体捕集）
        処理: pHを弱酸性に調節→ランタンとアリザリンコンプレクソンで発色（赤色溶液中の青色）
        分析: 吸光光度分析（620 nm付近）
      '27.2':
        捕集: 水酸化ナトリウム溶液に吸収（液体捕集）
        処理: pHを弱酸性に調節→別の発色試薬（アルフッソン）で発色
        分析: 吸光光度分析（620 nm付近）
      '27.3':
        捕集: 検知管
        処理: －
        分析: 検知管法
    '3029':
      '29.1':
        捕集: 直接捕集
        処理: －
        分析: ガスクロマトグラフ（FID）
      '29.2':
        捕集: 活性炭管（0.1 L/min前後で吸引）
        処理: 二硫化炭素で脱着
        分析: ガスクロマトグラフ（FID）
      '29.3':
        捕集: 硝酸アンモニウム-硫酸溶液に吸収（ニトロ化）
        処理: アルカリで中和→メチルエチルケトンに転溶→アルカリで発色（赤紫色）
        分析: 吸光光度分析（560 nm付近）
      '29.4':
        捕集: 検知管
        処理: －
        分析: 検知管法
    '3034':
      '34.1':
        捕集: 直接捕集
        処理: －
        分析: ガスクロマトグラフ
      '34.2':
        捕集: 硫酸亜鉛溶液に吸収（液体捕集）
        処理: p-アミノジメチルアニリンと鉄(Ⅲ)塩を加え、メチレンブルーを生成（青色）
        分析: 吸光光度分析（670 nm付近）
      '34.3':
        捕集: 検知管
        処理: －
        分析: 検知管法
  kinzoku:
    '4001':
      '1.1':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理→ジチゾン-クロロホルム溶液で抽出（赤紫色）
        分析: 吸光光度分析（518 nm付近）
      '1.2':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理→APDCで有機溶媒に抽出
        分析: 原子吸光分析（228.8 nm）
      '1.3':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-AES
      '1.4':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-MS
    '4004':
      '4.1':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸化剤を加えた硝酸で処理（ヒ酸イオン）→モリブデン酸でヒ-モリブデン酸を生成・抽出→塩化スズ(Ⅱ)で還元（青色）
        分析: 吸光光度分析（725 nmまたは840 nm付近）
    '4005':
      '5.1':
        捕集: 過マンガン酸カリウム-希硫酸溶液に吸収（液体捕集）
        処理: ジチゾン-クロロホルム溶液で抽出（黄色）
        分析: 吸光光度分析（490 nmまたは610 nm付近）
      '5.2':
        捕集: 過マンガン酸カリウム-希硫酸溶液に吸収（バブラー）
        処理: 還元剤を加え、還元気化で水銀蒸気を発生
        分析: 原子吸光分析（253.65 nm）
      '5.4':
        捕集: ホプカライトを充てんした捕集管（固体捕集）
        処理: 硝酸-塩酸混液で脱着→還元気化
        分析: 原子吸光分析（253.7 nm）
    '4006':
      '6.1':
        捕集: メンブランフィルター（ろ過捕集）
        処理: 混酸で処理→アルカリ性にしてベリロンと反応（赤紫色）
        分析: 吸光光度分析（525 nm付近）
      '6.2':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 硫酸で処理→アルカリ性にしてモリンを加え、紫外線を照射
        分析: 蛍光光度分析（蛍光の強度）
      '6.4':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-AES
    '4007':
      '7.1':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理→アルカリ性にしてホルムアルドキシムと反応（赤褐色）。測定値には塩基性酸化マンガンを含む
        分析: 吸光光度分析（450 nm付近）
      '7.2':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 混酸で処理
        分析: 原子吸光分析（279.48 nm）
      '7.3':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-AES
      '7.4':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-MS
    '4008':
      '8.1':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理→弱アルカリ性でジチゾンと反応（赤色のキレート）→ベンゼンで抽出（単色法）
        分析: 吸光光度分析
      '8.2':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理→弱アルカリ性でジチゾンと反応（赤色のキレート）→クロロホルムで抽出（混色法）
        分析: 吸光光度分析
      '8.3':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理（水溶液のまま）
        分析: フレーム原子吸光分析
      '8.4':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理（水溶液のまま）
        分析: 電気加熱式原子吸光分析
      '8.6':
        捕集: グラスファイバーフィルター（ろ過捕集）
        処理: 酸で処理→キレート剤と有機溶媒で抽出・濃縮
        分析: 電気加熱式原子吸光分析
      '8.7':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-AES
      '8.8':
        捕集: ろ過捕集
        処理: 酸で処理
        分析: ICP-MS
