        処理: 二硫化炭素で脱着
        分析: ガスクロマトグラフ（FID）
      '29.3':
        捕集: 硝酸アンモニウム-硫酸溶液に吸収（ニトロ化）
        処理: アルカリで中和→メチルエチルケトンに転溶→アルカリで発色（赤紫色）
        分析: 吸光光度分析（560 nm付近）
      '29.4':
        捕集: 検知管
        処理: －
        分析: 検知管法
