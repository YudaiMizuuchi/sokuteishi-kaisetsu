        捕集: 2,4-ジニトロフェニルヒドラジン（DNPH）をシリカゲルに吸着させた捕集管（固体捕集）
        処理: DNPH誘導体にして、アセトニトリルで溶出
        分析: 高速液体クロマトグラフ分析
      '36.2': &id001
        捕集: 検知管
        処理: （総論Ⅰ5.1・表Ⅰ.3、4を参照）
        分析: 検知管法
