description: ガイドブック3・4の各方法の「原理」の項（本文）で確認した、物質別の測定方法の表。人（Claude）が、本文を読んで、短く書き直したもの。確認していない物質・方法は、ここに入れない。
verified:
  tokka:
    '3001':
      '1.1':
        捕集: グラスファイバーろ紙＋活性炭フェルトを装着したサンプラーで、粒子と蒸気を吸引捕集（相補型）
        処理: メタノールで抽出
        分析: ガスクロマトグラフ（FTD、キャピラリーカラム、スプリットレス）
    '3002':
      '2.1':
        捕集: 直接捕集（捕集袋・真空捕集瓶）
        処理: －
        分析: ガスクロマトグラフ（FTD）
      '2.2':
        捕集: シリカゲル管（固体捕集）
        処理: アセトンで脱着
        分析: ガスクロマトグラフ（FID）
      '2.3':
        捕集: 精製水に吸収（液体捕集）
        処理: 臭素液を加え紫外線を照射→コハク酸イミドで過剰の臭素を除去→バルビツル酸とピリジンで発色（紫赤色）
        分析: 吸光光度分析（575 nm付近）
      '2.4':
        捕集: 検知管
        処理: －
        分析: 検知管法
    '3005':
      '5.1':
        捕集: 精製水に吸収（ミゼットインピンジャー）
        処理: アルカリ性にしてナフトキノンスルホン酸と反応→黄色の色素をクロロホルムに抽出
        分析: 吸光光度分析（420 nm付近）
      '5.2':
        捕集: ナフトキノンスルホン酸溶液に吸収（ミゼットインピンジャー）
        処理: 生成した黄色の色素をクロロホルムで抽出
        分析: 高速液体クロマトグラフ（紫外・可視吸光検出器）
    '3012':
      '12.1':
        捕集: ガラス繊維ろ紙を前置した、Tenax TA捕集管（相補型：粒子と蒸気）
        処理: 加熱脱着（標準液はアセトニトリルで調製・希釈）
        分析: ガスクロマトグラフ
    '3013':
      '13.1':
        捕集: 4-(p-ニトロベンジル)ピリジンのアセトン溶液に吸収（液体捕集）
        処理: 加温して反応→冷却→アンモニア水を加えて発色（赤紫色）
        分析: 吸光光度分析（530 nm付近）
    '3016':
      '16.1':
        捕集: 水酸化ナトリウム溶液に吸収（液体捕集）
        処理: 酢酸で中和→クロラミンTとピリジン-ピラゾロンで発色（青色）。標準はシアン化カリウム
        分析: 吸光光度分析（620 nm付近）
      '16.2':
        捕集: 検知管
        処理: －
        分析: 検知管法
    '3021':
      '21.1':
        捕集: 直接捕集
        処理: －
        分析: ガスクロマトグラフ（FID）
      '21.2':
        捕集: 固体捕集管
        処理: 脱着溶媒で脱着
        分析: ガスクロマトグラフ（FID）
      '21.3':
        捕集: 水酸化カリウム-エタノール溶液に吸収（液体捕集）
        処理: 硫酸鉄(Ⅲ)アンモニウムとチオシアン酸水銀(Ⅱ)を加えて発色（赤色）
        分析: 吸光光度分析（460 nm付近）
    '3027':
      '27.1':
        捕集: 水酸化ナトリウム溶液に吸収（液体捕集）
        処理: pHを弱酸性に調節→ランタンとアリザリンコンプレクソンで発色（赤色溶液中の青色）
        分析: 吸光光度分析（620 nm付近）
      '27.2':
        捕集: 水酸化ナトリウム溶液に吸収（液体捕集）
