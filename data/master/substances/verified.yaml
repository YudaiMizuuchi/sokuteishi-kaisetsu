      '4.1':
        捕集: 0.05 M硫酸（液体捕集：インピンジャー、30 L/min）
        処理: 亜硝酸ナトリウムとスルファニル酸を加えて発色（赤色）
        分析: 吸光光度分析（490 nm付近）
      '4.2':
        捕集: 0.1 M塩酸（液体捕集）
        処理: アンモニア水でアルカリ性→エチルエーテルで抽出→減圧濃縮→薄層クロマトグラフ法で分離→エタノールで抽出
        分析: 蛍光光度分析（紫外線を照射して、蛍光強度を測定）
    '3006':
      '6.1':
        捕集: 臭化水素酸を含浸させた活性炭管（固体捕集：2-ブロモエタノールになる）
        処理: DMFで脱着→HFBIと反応させて誘導体化（過剰のHFBIは加水分解）
        分析: ガスクロマトグラフ分析（ECD）
      '6.2':
        捕集: 臭化水素酸を含浸・乾燥させた活性炭管（固体捕集：2-ブロモエタノールになる）
        処理: トルエン／アセトニトリルで抽出
        分析: ガスクロマトグラフ質量分析（GC-MS）
      '6.3': *id001
    '3022':
