- id: pr-kinzoku-0020
  subject: kinzoku
  name: 分析結果から、空気中の金属濃度への換算
  statement: ろ紙に捕集された金属の量は、試料液中の濃度に、試料液の量（希釈していれば、希釈倍率も）を掛けて求める。空気中の濃度は、その量を、吸引した空気の量（流量×時間）で割る。µg/L は mg/m³ と同じ値になる。酸で抽出した液の量と、分析に使った液の量を取り違えない。個人サンプリング法やC測定では、測定値（時間加重平均）を求めるのに、採取した時間全体を使う。
  formula: C(mg/m³) ＝ c(µg/mL) × V(mL) ／ Q(L)
  keywords:
  - 空気中の鉛
  - 捕集
  - 試料溶液
  - 抽出
  - 個人サンプリング法
  - 吸引流量
