description: 原理マスタ：いくつもの論点を生む、もとの理屈。1つの原理＝1つの理屈（分野名は原理ではない）。紐づけの基準：正答の選択肢の正誤が、その原理だけから、直接導けるときだけ、points に入れる。暗記が要る事実は、紐づけない。
principles:
- id: pr-bunseki-0001
  subject: bunseki
  name: ランベルト・ベールの法則
  statement: 吸光度は、溶液の濃度と、光が通る液層の長さ（光路長）の積に比例する。濃度が2倍、光路長が2倍なら、吸光度は、4倍になる。
  formula: A ＝ ε × c × l
  keywords:
  - ランベルト
  - 光路長
  - 液層の長さ
  - 吸光度.{0,12}(濃度|光路長).{0,8}比例
  points:
  - pt-bunseki-0012
  - pt-bunseki-0077
  - pt-bunseki-0189
  - qp-bunseki-0042
- id: pr-bunseki-0002
  subject: bunseki
  name: 吸光度と透過率の関係
  statement: 吸光度は、透過率の逆数の常用対数で表す。透過率が50％なら吸光度は約0.30、10％なら1.0。
  formula: A ＝ −log₁₀T ＝ 2 − log₁₀T（Tは透過率％）
  keywords:
  - 透過率
  - 吸光度.{0,10}対数
  - log
  points:
  - pt-bunseki-0018
  - pt-bunseki-0050
  - pt-bunseki-0114
  - pt-bunseki-0209
  - pt-bunseki-0319
  - pt-bunseki-0473
  - pt-bunseki-0487
- id: pr-bunseki-0003
  subject: bunseki
  name: モル吸光係数の性質
  statement: モル吸光係数は、物質・波長・溶媒で決まり、濃度や光路長には依存しない。大きいほど、同じ濃度で、吸光度が大きい（高感度）。
  formula: ε ＝ A ÷ (c × l)
  keywords:
  - モル吸光係数
  points:
  - pt-bunseki-0019
  - pt-bunseki-0022
  - pt-bunseki-0119
  - pt-bunseki-0272
  - qp-bunseki-0042
- id: pr-bunseki-0004
  subject: bunseki
  name: 蛍光は励起光より長波長
  statement: 吸収した光のエネルギーの一部が、熱などで失われるので、放出される蛍光は、励起光より、エネルギーが小さく、波長が長い。
  formula: ''
  keywords:
  - 蛍光.{0,12}波長.{0,6}長
  - 励起光.{0,10}長波長
  - 励起波長
  points:
  - pt-bunseki-0002
  - pt-bunseki-0219
  - pt-bunseki-0270
- id: pr-bunseki-0005
  subject: bunseki
  name: 蛍光強度は低濃度で濃度に比例
  statement: 低濃度では、蛍光強度は、濃度と励起光の強度に比例する。高濃度では、自己吸収や濃度消光で、比例しなくなる。
  formula: ''
  keywords:
  - 蛍光.{0,6}強度.{0,14}(濃度|励起光).{0,6}比例
  - 濃度消光
  - 低濃度
  points:
  - pt-bunseki-0001
- id: pr-bunseki-0006
  subject: bunseki
  name: 蛍光は励起光と直角方向で測る
  statement: 励起光は、まっすぐ透過するので、励起光の影響を避けるため、蛍光は、入射光と直角の方向で測る。
  formula: ''
  keywords:
  - 直角方向
  - 直角
  points:
  - pt-bunseki-0009
  - pt-bunseki-0300
- id: pr-bunseki-0007
  subject: bunseki
  name: 蛍光を弱める要因
  statement: 溶存酸素、温度の上昇、pH、共存物質などは、励起状態の分子のエネルギーを、蛍光以外の経路で失わせ、蛍光強度を弱める。
  formula: ''
  keywords:
  - 溶存酸素
  - 蛍光.{0,10}(温度|pH|粘性)
  points:
  - pt-bunseki-0074
  - pt-bunseki-0361
  - pt-bunseki-0381
- id: pr-bunseki-0008
  subject: bunseki
  name: 原子吸光は基底状態の原子の光吸収
  statement: フレーム中の原子の大部分は、基底状態にあるので、原子吸光は、基底状態の原子が、光を吸収することを利用する。
  formula: ''
  keywords:
  - 基底状態
  - 励起状態.{0,8}(原子|吸収)
  points:
  - pt-bunseki-0044
  - pt-bunseki-0068
  - pt-bunseki-0071
  - pt-bunseki-0193
  - pt-bunseki-0313
- id: pr-bunseki-0009
  subject: bunseki
  name: 原子吸光の光源は線光源
  statement: 中空陰極ランプは、測定元素に固有の、線幅の狭い輝線を出す。光源の線幅が、吸収線より狭いことで、感度が出る。
  formula: ''
  keywords:
  - 中空陰極
  - 輝線
  - 線幅
  points:
  - pt-bunseki-0005
  - pt-bunseki-0057
- id: pr-bunseki-0010
  subject: bunseki
  name: バックグラウンド補正
  statement: 分子による光の吸収や散乱は、原子の吸収と区別できないので、広い波長の光源（重水素ランプなど）で、別に測って、差し引く。
  formula: ''
  keywords:
  - バックグラウンド
  - 重水素放電管
  - 重水素ランプ
  points:
  - pt-bunseki-0032
- id: pr-bunseki-0011
  subject: bunseki
  name: X線回折のブラッグの条件
  statement: 結晶の格子面で反射したX線が強め合う条件は、2d sinθ ＝ nλ。回折角から、格子面間隔 d がわかり、物質を同定できる。
  formula: 2d sinθ ＝ nλ
  keywords:
  - ブラッグ
  - 回折角
  - 格子面間隔
  - 回折線.{0,10}条件
  points:
  - pt-bunseki-0011
  - pt-bunseki-0021
  - pt-bunseki-0045
  - qp-bunseki-0073
- id: pr-bunseki-0012
  subject: bunseki
  name: X線回折の線源は特性X線
  statement: 回折には、波長のそろった特性X線（Cu-Kαなど）を使う。連続X線は、波長が連続で、回折角が定まらないので、使わない。
  formula: ''
  keywords:
  - 連続X線
  - Cu-Kα
  - 特性X線
  - Kα
  points:
  - pt-bunseki-0025
  - pt-bunseki-0027
  - pt-bunseki-0137
  - pt-bunseki-0142
  - qp-bunseki-0073
- id: pr-bunseki-0013
  subject: bunseki
  name: X線の吸収補正
  statement: 試料自身が、X線を吸収するので、試料の量が多いほど、回折線強度が、量に比例しなくなる。基底標準の強度の変化から、補正する。
  formula: ''
  keywords:
  - X線の吸収
  - 吸収の補正
  - 吸収補正
  points:
  - pt-bunseki-0069
- id: pr-bunseki-0014
  subject: bunseki
  name: 気体の状態方程式
  statement: 気体の圧力・体積・物質量・温度の関係。0℃・1気圧のモル体積は22.4 L、25℃・1気圧では24.5 L。
  formula: PV ＝ nRT
  keywords:
  - 状態方程式
  - 気体定数
  - モル体積
  - PV
  points:
  - qp-bunseki-0031
  - qp-bunseki-0075
  - qp-bunseki-0090
- id: pr-bunseki-0015
  subject: bunseki
  name: ドルトンの分圧の法則
  statement: 混合気体の分圧は、全圧に、モル分率（物質量の割合）を掛けたものになる。
  formula: P_i ＝ P × n_i ÷ n_全
  keywords:
  - 分圧
  points:
  - pt-bunseki-0401
- id: pr-bunseki-0016
  subject: bunseki
  name: ヘンリーの法則
  statement: 一定温度で、気体の溶解度（溶ける量）は、その気体の圧力（分圧）に比例する。
  formula: ''
  keywords:
  - ヘンリー
  - 溶解度.{0,10}圧力
  points:
  - pt-bunseki-0053
- id: pr-bunseki-0017
  subject: bunseki
  name: ルシャトリエの原理
  statement: 平衡にある系に、温度・圧力・濃度の変化を与えると、その変化を打ち消す向きに、平衡が移動する。
  formula: ''
  keywords:
  - 温度を(上げ|下げ)
  - 平衡.{0,8}移動
  - 左に進む
  - 右に進む
  - ルシャトリエ
