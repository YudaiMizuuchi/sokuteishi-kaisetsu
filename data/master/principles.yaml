  - qp-design-0003
  - qp-design-0047
- id: pr-design-0014
  subject: design
  name: 沸点・蒸気圧と、ガス・蒸気の状態
  statement: 沸点が低い物質ほど、蒸気圧が高く、揮発しやすい。飽和蒸気圧は、温度が高いほど大きい。常温・常圧（25℃、1気圧）で、沸点が25℃より低い物質は気体（ガス）で、高い物質は液体（空気中では蒸気として存在する）。融点が常温より高い物質は、固体（粒子として存在する）。
  formula: ''
  keywords:
