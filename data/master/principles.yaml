  subject: design
  name: 放射能の計数率と、空気中の放射能濃度の関係
  statement: 放射能測定器の正味計数率は、試料の放射能に、計数効率を掛けたものに比例する。空気中の放射能濃度は、正味計数率を、計数効率・捕集率・吸引した空気の量で割って求める。濃度から試料の放射能を求めるときは、濃度に、吸引した空気の量と捕集率を掛ける。測定したい濃度（濃度限度の1/10など）に必要な最小の採取時間は、検出下限計数率を、計数効率・捕集率・吸引流量・測定したい濃度で割って求める。流量はcm³/s、時間はsに単位をそろえる。
  formula: C ＝ n ／ (ε × η × q × t)
  keywords:
  - 正味計数率
  - 計数効率
  - 検出下限計数率
  - 最小試料採取時間
  - 空気中放射能濃度
  - 試料の放射能
