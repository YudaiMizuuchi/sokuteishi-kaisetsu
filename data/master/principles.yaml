- id: pr-bunseki-0018
  subject: bunseki
  name: 化学平衡と平衡定数
  statement: 平衡状態では、正反応と逆反応の速度が等しい。平衡定数は、温度だけで決まり、濃度や圧力、触媒では変わらない。
  formula: K ＝ [生成物] ÷ [反応物]
