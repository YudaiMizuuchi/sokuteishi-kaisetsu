traps:
- id: ds-gas-01
  subject: design
  chapter: gas
  foundation: null
  seat: 濃度と物質の状態
  name: ppm⇔mg/m³の換算（計算）
  rank: A
  count: 7
  exams:
  - 2020-02
  - 2021-08
  - 2023-02
  - 2023-08
  - 2024-08
  - 2025-08
  - 2026-08
  understanding: mg/m³ ＝ ppm × 分子量 ÷ 24.45（25℃・1気圧）。
  reason: ppmは体積の比。25℃・1気圧で1molの気体は24.45Lなので、体積→mol→質量と直せば換算できる。
  confidence: 高
  verify: false
- id: ds-states-01
  subject: design
  chapter: dust-disease
  foundation: null
  seat: 濃度と物質の状態
  name: 管理濃度の表し方（粉じん・RCF）
  rank: A
  count: 3
  exams:
  - 2020-08
  - 2024-02
  - 2025-02
  understanding: 鉱物性粉じんは遊離けい酸含有率から式で求め、含有率が高いほど小さい（質量濃度）。RCFは長さ5µm以上の繊維の本数濃度。
  reason: じん肺の主因は遊離けい酸なので含有率が高いほど厳しくする。繊維は形（長さ）が健康影響を左右するので本数で数える。
  confidence: 中
  verify: false
- id: ds-states-02
  subject: design
  chapter: dust-disease
  foundation: null
  seat: 濃度と物質の状態
  name: 粉じん・ヒューム・ミストの粒径と形
  rank: A
  count: 3
  exams:
  - 2020-02
  - 2021-02
  - 2026-02
  understanding: ヒュームの一次粒子は1µm以下と微細で球形が多い。ミストはヒュームより大きい。
  reason: ヒュームは蒸気が冷えて凝縮した粒子なので小さく丸い。
  confidence: 高
  verify: false
- id: ds-gas-02
  subject: design
  chapter: gas
  foundation: null
  seat: 濃度と物質の状態
  name: 体積分率（%）とppmの関係
  rank: C
  count: 1
  exams:
  - 2019-08
  understanding: 1% ＝ 10,000ppm（0.1%は1,000ppm）。
  reason: '%は百分率、ppmは百万分率なので桁が4つ違う。'
  confidence: 高
  verify: false
- id: ds-properties-01
  subject: design
  chapter: properties
  foundation: null
  seat: 物性
  name: 物性の比較（蒸気圧・沸点・融点・状態）
  rank: A
  count: 14
  exams:
  - 2019-08
  - 2020-02
  - 2020-08
  - 2021-02
  - 2023-02
  - 2023-08
  - 2024-02
  - 2024-08
  - 2025-08
  - 2026-02
  - 2026-08
  understanding: 形式として毎回1〜2問。物質の暗記より、分子量と分子間力（水素結合・極性）からおおまかに推測する。
  reason: 分子が大きいほど、分子同士が引き合うほど、揮発しにくい（沸点が高く、蒸気圧が低い）。
  confidence: 高
  verify: false
- id: ds-properties-02
  subject: design
  chapter: properties
  foundation: null
  seat: 物性
  name: 極性の大小
  rank: A
  count: 3
  exams:
  - 2019-08
  - 2020-08
  - 2025-02
  understanding: 四塩化炭素は無極性でクロロホルムより極性が小さい。アルコールは極性が大きく、トルエンは小さい。
  reason: 分子の形が対称だと電荷の偏りが打ち消し合う。-OHを持つ分子は偏りが大きい。
  confidence: 高
  verify: false
- id: ds-properties-03
  subject: design
  chapter: properties
  foundation: null
  seat: 物性
  name: 蒸気の密度（空気より重いか）
  rank: A
  count: 3
  exams:
  - 2021-02
  - 2024-02
  - 2024-08
  understanding: 空気の平均分子量（約29）と比べる。多くの有機溶剤は重く床付近にたまる。フッ化水素（20）やシアン化水素（27）は軽い。
  reason: 同じ温度・圧力なら気体の密度は分子量に比例する。
  confidence: 高
  verify: false
- id: ds-properties-04
  subject: design
  chapter: properties
  foundation: null
  seat: 物性
  name: 遊離けい酸の種類（クリストバライト）
  rank: B
  count: 2
  exams:
  - 2020-08
  - 2021-08
  understanding: クリストバライトは遊離けい酸（結晶質シリカ）の一種。
  reason: 石英・クリストバライト・トリジマイトが遊離けい酸の結晶形。
  confidence: 高
  verify: false
- id: ds-properties-05
  subject: design
  chapter: properties
  foundation: null
  seat: 物性
  name: その他の性状（単発）
  rank: C
  count: 1
  exams:
  - 2026-08
  understanding: 単発の論点（正答肢一覧で個別に確認）
  reason: null
  confidence: null
  verify: false
- id: ds-unit-workplace-01
  subject: design
  chapter: unit-workplace
  foundation: null
  seat: 単位作業場所
  name: 人数・作業時間・保護具は考慮しない
  rank: A
  count: 4
  exams:
  - 2019-08
  - 2020-02
  - 2023-02
  - 2023-08
  understanding: 単位作業場所は「濃度分布」と「労働者の行動範囲」で決める。人数・作業時間・保護具は考慮しない。
  reason: A・B測定は“場”の評価。誰が何時間いるか、保護具を着けているかは個人ばく露（作業管理）の問題。
  confidence: 高
  verify: false
- id: ds-unit-workplace-02
  subject: design
  chapter: unit-workplace
  foundation: null
  seat: 単位作業場所
  name: 作業・物質の違いと単位作業場所の分け方
  rank: A
  count: 4
  exams:
  - 2020-08
  - 2021-08
  - 2025-02
  - 2025-08
  understanding: 別々の場所・時間で使う物質を混合溶剤とみなさない。壁で仕切られた区域は別。同じ区域で同時に行う一連の作業は一つ。
  reason: 単位作業場所は「同じ濃度分布を持つ空間」。空間がつながっているか、同時に発散しているかで決まり、作業内容や人で決まるのではない。
  confidence: 中
  verify: false
- id: ds-unit-workplace-03
  subject: design
  chapter: unit-workplace
  foundation: null
  seat: 単位作業場所
  name: 気流・換気は考慮する
  rank: B
  count: 2
  exams:
  - 2021-02
  - 2026-02
  understanding: 作業場内の気流や換気設備の稼働状況は考慮する。
  reason: 気流は濃度分布を直接左右するから。
  confidence: 高
  verify: false
- id: ds-unit-workplace-04
  subject: design
  chapter: unit-workplace
  foundation: null
  seat: 単位作業場所
  name: 1日で終わらない場合は区分けする（2作業日に分けない）
  rank: C
  count: 1
  exams:
  - 2024-08
  understanding: 1日でサンプリングが終わらないほど広い場合は、範囲を区分けして別の単位作業場所にする。
  reason: 連続2作業日の測定は日間変動を見るためのもの。1回の測定を2日に分けると同じ日の分布として扱えなくなる。
  confidence: 高
  verify: false
