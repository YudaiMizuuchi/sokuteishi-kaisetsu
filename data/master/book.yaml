  - 2017-08
  - 2020-02
  - 2021-08
  - 2022-02
  - 2023-02
  - 2023-08
  - 2024-08
  - 2025-08
  - 2026-08
  understanding: mg/m³ ＝ ppm × 分子量 ÷ 24.45（25℃・1気圧）。
  reason: ppmは体積の比。25℃・1気圧で1molの気体は24.45Lなので、体積→mol→質量と直せば換算できる。
  confidence: 高
  verify: false
  hidden: false
