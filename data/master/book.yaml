traps:
- id: ds-gas-01
  subject: design
  chapter: gas
  foundation: null
  seat: 濃度と物質の状態
  name: ppm⇔mg/m³の換算（計算）
  rank: A
  count: 7
  exams:
  - 2020-02
  - 2021-08
  - 2023-02
  - 2023-08
  - 2024-08
  - 2025-08
  - 2026-08
  understanding: mg/m³ ＝ ppm × 分子量 ÷ 24.45（25℃・1気圧）。
  reason: ppmは体積の比。25℃・1気圧で1molの気体は24.45Lなので、体積→mol→質量と直せば換算できる。
  confidence: 高
  verify: false
- id: ds-states-01
  subject: design
  chapter: states
  foundation: null
  seat: 濃度と物質の状態
  name: 管理濃度の表し方（粉じん・RCF）
  rank: A
  count: 3
  exams:
  - 2020-08
  - 2024-02
  - 2025-02
  understanding: 鉱物性粉じんは遊離けい酸含有率から式で求め、含有率が高いほど小さい（質量濃度）。RCFは長さ5µm以上の繊維の本数濃度。
  reason: じん肺の主因は遊離けい酸なので含有率が高いほど厳しくする。繊維は形（長さ）が健康影響を左右するので本数で数える。
  confidence: 中
  verify: false
- id: ds-states-02
  subject: design
  chapter: states
  foundation: null
  seat: 濃度と物質の状態
  name: 粉じん・ヒューム・ミストの粒径と形
  rank: A
  count: 3
  exams:
  - 2020-02
  - 2021-02
  - 2026-02
  understanding: ヒュームの一次粒子は1µm以下と微細で球形が多い。ミストはヒュームより大きい。
  reason: ヒュームは蒸気が冷えて凝縮した粒子なので小さく丸い。
  confidence: 高
  verify: false
- id: ds-gas-02
  subject: design
  chapter: gas
  foundation: null
  seat: 濃度と物質の状態
  name: 体積分率（%）とppmの関係
  rank: C
  count: 1
  exams:
  - 2019-08
  understanding: 1% ＝ 10,000ppm（0.1%は1,000ppm）。
  reason: '%は百分率、ppmは百万分率なので桁が4つ違う。'
  confidence: 高
  verify: false
