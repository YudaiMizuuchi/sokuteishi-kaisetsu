  understanding: 形式として毎回1〜2問。物質の暗記より、分子量と分子間力（水素結合・極性）からおおまかに推測する。
  reason: 分子が大きいほど、分子同士が引き合うほど、揮発しにくい（沸点が高く、蒸気圧が低い）。
  confidence: 高
  verify: false
  hidden: false
