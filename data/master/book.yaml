- id: ds-liquid-direct-01
  subject: design
  chapter: liquid-direct
  foundation: null
  seat: 液体捕集・直接捕集
  name: ミゼットインピンジャーの捕集率（流量・粒径）
  rank: A
  count: 13
  exams:
  - 2015-08
  - 2016-02
  - 2016-08
  - 2017-02
  - 2017-08
  - 2019-08
  - 2020-08
  - 2021-08
  - 2022-08
  - 2023-02
  - 2023-08
  - 2025-02
  understanding: ガス状物質は流量が小さいほど捕集率が高い。粒子は慣性衝突で捕るので、流量が大きいほど、粒径が大きいほど捕集率が高い。
  reason: ガスは捕集液との接触時間が長いほど溶ける。粒子は勢いよく液面にぶつかるほど捕まる。
  confidence: 高
  verify: false
  hidden: false
- id: ds-flowmeter-01
  subject: design
  chapter: flowmeter
  foundation: null
  seat: 流量計
  name: 捕集器具の圧力損失と流量（面積式流量計・ポンプ調整）
  rank: A
  count: 12
  exams:
  - 2016-08
  - 2017-02
  - 2017-08
  - 2018-02
  - 2019-02
  - 2020-08
  - 2021-02
  - 2021-08
  - 2023-02
  - 2023-08
  - 2024-02
  - 2024-08
  understanding: 捕集器具とポンプの間の面積式流量計は真の流量より大きく指示する。流量は捕集器具を付けた状態で合わせる。付けずに合わせると実流量が減り、算出濃度は低くなる。
  reason: 捕集器具の後ろは減圧され空気が膨張する（密度が下がる）ため、浮子が余分に押し上げられる。
  confidence: 中
  verify: false
  hidden: false
- id: ds-gas-01
  subject: design
  chapter: gas
  foundation: null
  seat: 濃度と物質の状態
  name: ppm⇔mg/m³の換算（計算）
  rank: B
  count: 10
  exams:
