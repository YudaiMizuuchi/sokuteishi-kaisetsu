  - 2018-02
  - 2018-08
  - 2019-02
  - 2021-02
  - 2022-02
  - 2023-02
  - 2024-02
  - 2024-08
  understanding: ポアサイズは捕集できる最小粒径ではない。それより小さい粒子も慣性・さえぎり・拡散で捕集される（0.8µmで0.3µmもよく捕る）。
  reason: フィルターは“ふるい”ではなく、繊維や孔の壁に粒子がぶつかって捕まる仕組み。
  confidence: 高
  verify: false
  hidden: false
- id: ds-states-01
  subject: design
  chapter: dust-disease
  foundation: null
  seat: 濃度と物質の状態
  name: 管理濃度の表し方（粉じん・RCF）
  rank: C
  count: 9
  exams:
  - 2015-08
  - 2016-08
  - 2018-02
  - 2018-08
  - 2020-08
  - 2022-08
  - 2024-02
  - 2025-02
  - 2026-08
  understanding: 鉱物性粉じんは遊離けい酸含有率から式で求め、含有率が高いほど小さい（質量濃度）。RCFは長さ5µm以上の繊維の本数濃度。
  reason: じん肺の主因は遊離けい酸なので含有率が高いほど厳しくする。繊維は形（長さ）が健康影響を左右するので本数で数える。
  confidence: 中
  verify: false
  hidden: false
