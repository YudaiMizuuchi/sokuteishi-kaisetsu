- id: ds-a-b-measurement-01
  subject: design
  chapter: a-b-measurement
  foundation: null
  seat: A測定・B測定
  name: 測定点の線の引き方（等間隔系統抽出）
  rank: A
  count: 4
  exams:
  - 2020-08
  - 2025-08
  - 2026-02
  - 2026-08
  understanding: 6m以下の等間隔で縦横の線を引き、その交点を全て測定点にする。縦横の間隔は違ってよく、直交しなくてもよい。設備と重なる交点は除き、線は引き直さない。交点から任意に選ばない。
  reason: 等間隔系統抽出で、測定者の判断を入れずに場を偏りなく代表させるため。
  confidence: 高
  verify: false
- id: ds-a-b-measurement-02
  subject: design
  chapter: a-b-measurement
  foundation: null
  seat: A測定・B測定
  name: 10分以上連続測定の例外（検知管・相対濃度計）
  rank: A
  count: 3
  exams:
  - 2023-02
  - 2024-02
  - 2025-02
  understanding: 1測定点10分以上の連続採取は原則だが、相対濃度指示方法・検知管・直接捕集は例外。
  reason: 10分はろ過・固体捕集などで捕集量とならしを確保するための時間。連続表示の機器や瞬時採取の方法には当てはまらない（代わりに全体で1時間以上かける）。
  confidence: 中
  verify: false
- id: ds-a-b-measurement-03
  subject: design
  chapter: a-b-measurement
  foundation: null
  seat: A測定・B測定
  name: B測定もA測定と同じ方法（K値・分粒装置）
  rank: A
  count: 3
  exams:
  - 2019-08
  - 2023-08
  - 2025-08
  understanding: B測定の採取・分析方法はA測定と同じ。相対濃度計ならA測定で求めた質量濃度変換係数を使い、分粒装置も同様に使う。
  reason: A測定とB測定を同じ物差しで比べて管理区分を決めるため。
  confidence: 中
  verify: false
- id: ds-a-b-measurement-04
  subject: design
  chapter: a-b-measurement
  foundation: null
  seat: A測定・B測定
  name: 測定点の高さは床上50〜150cm
  rank: A
  count: 3
  exams:
  - 2019-08
  - 2021-02
  - 2025-02
  understanding: A・B測定とも、測定点の高さは床上50cm以上150cm以下。
  reason: 座って作業する人から立って作業する人までの呼吸域を含めるため。
  confidence: 高
  verify: false
- id: ds-a-b-measurement-05
  subject: design
  chapter: a-b-measurement
  foundation: null
  seat: A測定・B測定
  name: 短時間測定の積み上げは平均（10分間値）
  rank: A
  count: 3
  exams:
  - 2020-02
  - 2024-08
  - 2026-08
  understanding: 検知管5本や圧電天秤2分×5回のように短時間測定を10分間に並べた場合は、その平均をB測定値とする（最大値・幾何平均ではない）。
  reason: B測定値は「最も高い時間帯の10分間の濃度」なので、短時間値を並べたらそれをならす。
  confidence: 中（根拠資料で要確認）
  verify: true
